 as a fertiliser only", "Biogas cannot be used for anything"], "mand": 0}, {"id": "BIO-07-026", "t": 7, "s": "4.7.2.3", "k": "Practical", "m": 4, "ht": false, "q": "<b>Required practical 10.<\/b> Describe how to investigate the effect of <b>temperature<\/b> on the decay of milk.", "a": ["Put equal volumes of <b>milk and lipase<\/b> with a pH indicator (e.g. phenolphthalein) at different <b>temperatures<\/b> (1)", "Time how long the indicator takes to <b>change colour<\/b> (as pH falls) (1)", "<b>Repeat<\/b> and keep volumes and concentrations the same (1)", "Calculate the <b>rate<\/b> (1 ÷ time) (1)"], "cp": ["Put equal volumes of milk and lipase with a pH indicator (e.g. phenolphthalein) at different temperatures", "Time how long the indicator takes to change colour (as pH falls)", "Repeat and keep volumes and concentrations the same", "Calculate the rate (1 ÷ time)"], "dp": ["Put equal volumes of milk and amylase with iodine", "Time how long the indicator takes to change colour as pH rises", "Use a different volume of milk each time"], "mand": 0}, {"id": "BIO-07-027", "t": 7, "s": "4.7.2.3", "k": "Explain", "m": 2, "ht": false, "q": "In the milk experiment, why does the <b>pH fall<\/b>?", "a": ["Lipase breaks down the <b>fats<\/b> in the milk (1)", "into <b>fatty acids<\/b>, which are acidic (1)"], "cp": ["Lipase breaks down the fats in the milk", "into fatty acids, which are acidic"], "dp": ["Lipase breaks down the proteins in the milk", "into glycerol, which is acidic", "The milk is neutralised"], "mand": 0}, {"id": "BIO-07-028", "t": 7, "s": "4.7.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>biodiversity<\/b>? Why is it important?", "a": ["The <b>variety of species<\/b> in an ecosystem (or on Earth) (1)", "High biodiversity makes ecosystems more <b>stable<\/b>, as species depend on each other (1)"], "cp": ["The variety of species in an ecosystem (or on Earth)", "High biodiversity makes ecosystems more stable, as species depend on each other"], "dp": ["The number of individuals of one species", "The size of a habitat", "High biodiversity makes ecosystems less stable"], "mand": 0}, {"id": "BIO-07-029", "t": 7, "s": "4.7.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways humans cause <b>pollution<\/b>.", "a": ["<b>Water:<\/b> sewage, fertiliser or toxic chemicals (1)", "<b>Air:<\/b> smoke or acidic gases (1)", "<b>Land:<\/b> landfill or toxic chemicals (1)"], "cp": ["Water: sewage, fertiliser or toxic chemicals", "Air: smoke or acidic gases", "Land: landfill or toxic chemicals"], "dp": ["Water: clean rain", "Air: oxygen", "Land: recycling"], "mand": 0}, {"id": "BIO-07-030", "t": 7, "s": "4.7.3.3", "k": "Recall", "m": 4, "ht": false, "q": "Give <b>four<\/b> ways humans reduce the land available for other animals and plants.", "a": ["<b>Building<\/b> (1)", "<b>Quarrying<\/b> (1)", "<b>Farming<\/b> (1)", "<b>Dumping<\/b> waste (1)"], "cp": ["Building", "Quarrying", "Farming", "Dumping waste"], "dp": ["Planting trees", "Creating nature reserves", "Recycling"], "mand": 0}, {"id": "BIO-07-031", "t": 7, "s": "4.7.3.3", "k": "Explain", "m": 3, "ht": false, "q": "Why is destroying <b>peat bogs<\/b> a problem for the environment?", "a": ["It destroys <b>habitats<\/b>, so biodiversity falls (1)", "Peat <b>decays or burns<\/b>, releasing <b>carbon dioxide<\/b> (1)", "People still want cheap <b>compost<\/b>, so there is a conflict (1)"], "cp": ["It destroys habitats, so biodiversity falls", "Peat decays or burns, releasing carbon dioxide", "People still want cheap compost, so there is a conflict"], "dp": ["It increases biodiversity", "Peat absorbs more CO<sub>2<\/sub> when it is destroyed", "Everyone agrees we should use more peat"], "mand": 0}, {"id": "BIO-07-032", "t": 7, "s": "4.7.3.4", "k": "Explain", "m": 3, "ht": false, "q": "Why does <b>deforestation<\/b> in tropical areas matter?", "a": ["Trees are cleared for <b>cattle, rice fields<\/b> and biofuel crops (1)", "Fewer trees, so less CO<sub>2<\/sub> removed by <b>photosynthesis<\/b>; burning or decay <b>releases CO<sub>2<\/sub><\/b> (1)", "<b>Biodiversity falls<\/b> as habitats are lost (1)"], "cp": ["Trees are cleared for cattle, rice fields and biofuel crops", "Fewer trees, so less CO<sub>2<\/sub> removed by photosynthesis; burning or decay releases CO<sub>2<\/sub>", "Biodiversity falls as habitats are lost"], "dp": ["Trees are cleared to plant more forest", "More trees, so more CO<sub>2<\/sub> removed by photosynthesis", "Biodiversity rises as habitats are gained"], "mand": 0}, {"id": "BIO-07-033", "t": 7, "s": "4.7.3.5", "k": "Explain", "m": 3, "ht": false, "q": "Name <b>two<\/b> gases that increase <b>global warming<\/b>. Give <b>one<\/b> biological effect.", "a": ["<b>Carbon dioxide<\/b> (1)", "<b>Methane<\/b> (1)", "Effect: species <b>distribution changes<\/b>, ice melts, or breeding times change (1)", "<i>Use the term 'global warming', not ozone layer.<\/i>"], "cp": ["Carbon dioxide", "Methane", "Effect: species distribution changes, ice melts, or breeding times change"], "dp": ["Oxygen", "Nitrogen", "Effect: more skin cancer from the ozone layer"], "mand": 0}, {"id": "BIO-07-034", "t": 7, "s": "4.7.3.6", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways to maintain <b>biodiversity<\/b>.", "a": ["Any three (1 each):", "• <b>breeding programmes<\/b> for endangered species", "• protect and regenerate <b>habitats<\/b>", "• reintroduce <b>hedgerows<\/b> and field margins", "• reduce <b>deforestation<\/b> and CO<sub>2<\/sub> emissions", "• <b>recycle<\/b> rather than dump waste"], "cp": ["breeding programmes for endangered species", "protect and regenerate habitats", "reintroduce hedgerows and field margins", "reduce deforestation and CO<sub>2<\/sub> emissions", "recycle rather than dump waste"], "dp": ["cut down hedgerows", "build on field margins", "dump waste in landfill"], "mand": 0}, {"id": "BIO-07-035", "t": 7, "s": "4.7.3.6", "k": "Evaluate", "m": 2, "ht": false, "q": "Why can it be hard to protect biodiversity?", "a": ["Conservation costs <b>money<\/b> and land (1)", "which can <b>conflict<\/b> with farming, housing and jobs (1)"], "cp": ["Conservation costs money and land", "which can conflict with farming, housing and jobs"], "dp": ["Conservation is cheap and everyone agrees", "so there is never any conflict", "because plants cannot be protected"], "mand": 0}, {"id": "BIO-07-036", "t": 7, "s": "4.7.4.1", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>trophic levels 1 to 4<\/b> in a food chain.", "a": ["Level 1: <b>producers<\/b> (plants, algae) (1)", "Level 2: <b>primary consumers<\/b> (herbivores) (1)", "Level 3: <b>secondary consumers<\/b> (carnivores) (1)", "Level 4: <b>tertiary consumers<\/b> (1)"], "cp": ["Level 1: producers (plants, algae)", "Level 2: primary consumers (herbivores)", "Level 3: secondary consumers (carnivores)", "Level 4: tertiary consumers"], "dp": ["Level 1: primary consumers", "Level 2: producers", "Level 3: decomposers"], "mand": 0}, {"id": "BIO-07-037", "t": 7, "s": "4.7.4.1", "k": "Recall", "m": 2, "ht": false, "q": "How do <b>decomposers<\/b> break down dead material?", "a": ["They <b>secrete enzymes<\/b> onto the dead matter (1)", "and the small, soluble molecules <b>diffuse<\/b> into them (1)"], "cp": ["They secrete enzymes onto the dead matter", "and the small, soluble molecules diffuse into them"], "dp": ["They swallow the dead matter whole", "and the large, insoluble molecules diffuse into them", "They secrete oxygen onto the matter"], "mand": 0}, {"id": "BIO-07-038", "t": 7, "s": "4.7.4.2", "k": "Recall", "m": 2, "ht": false, "q": "What does a <b>pyramid of biomass<\/b> show? Which level is at the bottom?", "a": ["The <b>mass of living material<\/b> at each trophic level (1)", "<b>Level 1<\/b> (producers) is at the bottom (1)"], "cp": ["The mass of living material at each trophic level", "Level 1 (producers) is at the bottom"], "dp": ["The number of organisms at each level", "Level 4 is at the bottom", "The energy lost as heat"], "mand": 0}, {"id": "BIO-07-039", "t": 7, "s": "4.7.4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why only about <b>10%<\/b> of biomass passes to the next trophic level.", "a": ["Some is lost as <b>faeces<\/b> and <b>urine<\/b> (1)", "Some is used in <b>respiration<\/b> (released as CO<sub>2<\/sub>, water and heat) (1)", "Some parts (e.g. <b>bones, roots<\/b>) are not eaten (1)", "<i>Trap: do not just say 'waste'.<\/i>"], "cp": ["Some is lost as faeces and urine", "Some is used in respiration (released as CO<sub>2<\/sub>, water and heat)", "Some parts (e.g. bones, roots) are not eaten"], "dp": ["Some is lost as oxygen", "All of the biomass is eaten", "Some is used in photosynthesis"], "mand": 0}, {"id": "BIO-07-040", "t": 7, "s": "4.7.4.3", "k": "Calculation", "m": 2, "ht": false, "q": "A cow eats 1000 kg of grass and gains 100 kg of biomass.<br/><br/>Calculate the <b>efficiency<\/b> of biomass transfer.", "a": ["100 ÷ 1000 × 100 (1)", "= <b>10%<\/b> (1)"], "cp": ["100 ÷ 1000 × 100", "= 10%"], "dp": ["1000 ÷ 100 × 100", "= 1000%", "= 1%"], "mand": 0}, {"id": "BIO-07-041", "t": 7, "s": "4.7.4.3", "k": "Explain", "m": 2, "ht": false, "q": "Why do food chains rarely have more than <b>four or five<\/b> trophic levels?", "a": ["Biomass is <b>lost<\/b> at each level (1)", "so there is not enough left to support <b>more<\/b> organisms (1)"], "cp": ["Biomass is lost at each level", "so there is not enough left to support more organisms"], "dp": ["Biomass is gained at each level", "so there is too much left", "because predators eat their own kind"], "mand": 0}, {"id": "BIO-07-042", "t": 7, "s": "4.7.5.1", "k": "Recall", "m": 3, "ht": false, "q": "What is <b>food security<\/b>? Give <b>two<\/b> threats to it.", "a": ["Having <b>enough food<\/b> to feed a population (1)", "Any two threats (1 each):", "• rising <b>population<\/b>", "• new <b>pests and pathogens<\/b>", "• <b>climate change<\/b> or failed rains", "• <b>conflict<\/b> or the cost of farming"], "cp": ["Having enough food to feed a population", "rising population", "new pests and pathogens", "climate change or failed rains", "conflict or the cost of farming"], "dp": ["Having enough money to buy any food", "falling population", "stable weather"], "mand": 1}, {"id": "BIO-07-043", "t": 7, "s": "4.7.5.2", "k": "Explain", "m": 2, "ht": false, "q": "Why does keeping farm animals <b>indoors<\/b> and <b>warm<\/b> make food production more efficient?", "a": ["They move less and need less energy to keep warm (1)", "so <b>less energy is lost<\/b> and more is used for <b>growth<\/b> (1)"], "cp": ["They move less and need less energy to keep warm", "so less energy is lost and more is used for growth"], "dp": ["They move more and need more energy", "so more energy is lost as heat", "so they grow slower"], "mand": 0}, {"id": "BIO-07-044", "t": 7, "s": "4.7.5.2", "k": "Evaluate", "m": 2, "ht": false, "q": "Give <b>one<\/b> advantage and <b>one<\/b> disadvantage of intensive farming.", "a": ["Advantage: produces <b>more food<\/b> at a lower cost (1)", "Disadvantage: <b>ethical<\/b> concerns about animal welfare (1)"], "cp": ["Advantage: produces more food at a lower cost", "Disadvantage: ethical concerns about animal welfare"], "dp": ["Advantage: produces less food at a higher cost", "Disadvantage: there are no ethical concerns", "Advantage: animals roam freely"], "mand": 0}, {"id": "BIO-07-045", "t": 7, "s": "4.7.5.3", "k": "Explain", "m": 3, "ht": false, "q": "How do <b>net size<\/b> and <b>fishing quotas<\/b> help to keep fish stocks sustainable?", "a": ["Large <b>mesh nets<\/b> let young fish escape (1)", "so they can grow and <b>breed<\/b> (1)", "<b>Quotas<\/b> limit how many fish can be caught (1)"], "cp": ["Large mesh nets let young fish escape", "so they can grow and breed", "Quotas limit how many fish can be caught"], "dp": ["Small mesh nets let more fish be caught", "so they are caught later", "Quotas allow unlimited catches"], "mand": 0}, {"id": "BIO-07-046", "t": 7, "s": "4.7.5.4", "k": "Recall", "m": 3, "ht": false, "q": "What is <b>mycoprotein<\/b> and how is it made?", "a": ["A <b>protein-rich<\/b> vegetarian food made from the fungus <b>Fusarium<\/b> (1)", "Grown on <b>glucose syrup<\/b> in <b>aerobic<\/b> conditions (1)", "Then <b>harvested and purified<\/b> (1)"], "cp": ["A protein-rich vegetarian food made from the fungus Fusarium", "Grown on glucose syrup in aerobic conditions", "Then harvested and purified"], "dp": ["A fat-rich food made from a plant", "Grown on soil in anaerobic conditions", "Grown in sunlight"], "mand": 0}, {"id": "BIO-07-047", "t": 7, "s": "4.7.5.4", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> ways biotechnology can help feed more people.", "a": ["<b>Mycoprotein<\/b> (1)", "<b>GM crops<\/b> with higher yield or better nutrition (e.g. golden rice) (1)"], "cp": ["Mycoprotein", "GM crops with higher yield or better nutrition (e.g. golden rice)"], "dp": ["Using more pesticides only", "Cutting down forests", "Dumping waste"], "mand": 0}, {"id": "BIO-07-H01", "t": 7, "s": "4.7.2.4", "k": "Evaluate", "m": 3, "ht": true, "q": "Explain how <b>global warming<\/b> could change where species can live.", "a": ["Temperatures <b>rise<\/b>, so some species move towards the <b>poles<\/b> or higher ground (1)", "Changes in <b>rainfall<\/b> alter where some plants can grow (1)", "Species that cannot move or adapt may become <b>extinct<\/b> (1)"], "cp": ["Temperatures rise, so some species move towards the poles or higher ground", "Changes in rainfall alter where some plants can grow", "Species that cannot move or adapt may become extinct"], "dp": ["Temperatures rise, so all species move towards the equator", "Changes in rainfall make no difference", "Species that cannot move always adapt"], "mand": 0}, {"id": "BIO-07-H02", "t": 7, "s": "4.7.2.4", "k": "Evaluate", "m": 2, "ht": true, "q": "Give <b>two<\/b> ways environmental change can be <b>seasonal<\/b>, <b>geographic<\/b> or caused by <b>humans<\/b>.", "a": ["Seasonal: e.g. <b>temperature and rainfall<\/b> change through the year (1)", "Human: e.g. <b>pollution<\/b> or deforestation change gases and habitats (1)"], "cp": ["Seasonal: e.g. temperature and rainfall change through the year", "Human: e.g. pollution or deforestation change gases and habitats"], "dp": ["Seasonal: the same all year", "Human: only natural events like volcanoes", "Seasonal: caused only by pollution"], "mand": 0}];

    body=`<p class="hint">${n===1?"Choose <b>one</b> answer.":"Choose <b>"+n+"</b> answers, like a tick-box question in the exam."}</p>
    <div class="opts">${R.opts.map((o,i)=>`<button class="pt opt ${n===1?"single":""} ${R.sel.includes(i)?"on":""}" onclick="pick(${i})" aria-pressed="${R.sel.includes(i)}"><span class="box">${ICON.tick}</span><span>${o.h}</span></button>`).join("")}</div>
    <div class="score"><span class="small">${R.sel.length} of ${n} chosen</span><button class="btn" ${R.sel.length?"":"disabled"} onclick="reveal()">Check my answer${n>1?"s":""}<span class="kbd">Space</span></button></div>`;
  }else{
    const earned=curScore(c);
    body=`${fbBanner(c,earned)}<div class="opts">${R.opts.map((o,i)=>{const p=R.sel.includes(i);const st=p?(o.ok?"right":"wrong"):(o.ok?"missed":"");const ic=st==="right"?ICON.tick:st==="wrong"?ICON.cross:st==="missed"?ICON.tick:"";const lab=st==="right"?"Correct":st==="wrong"?"Not quite":st==="missed"?"You missed this one":"";return `<div class="pt opt done ${n===1?"single":""} ${st}"><span class="box">${ic}</span><span>${o.h}${lab?`<small class="olab">${lab}</small>`:""}</span></div>`}).join("")}</div>
    <div class="ans"><h3>Full mark scheme</h3><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div>
    <div class="score"><div class="big">${earned} / ${c.m} ${c.m===1?"mark":"marks"}</div><button class="btn" id="nextbtn" onclick="next()">${R.i+1===R.cards.length?"Finish":"Next question"}<span class="kbd">Space</span></button></div></div>`;
  }
  $("#app").innerHTML=`
  <div class="rhead"><button class="chip" onclick="if(confirm('Leave this round?'))go('home')">Quit</button><b>${R.label}</b><div class="seg">${R.cards.map((x,k)=>`<i class="${k<R.i?"d":k===R.i?"n":""}"></i>`).join("")}</div><span class="pill">${R.i+1} / ${R.cards.length}</span>${hearts}${R.combo>=2?`<span class="pill combo">${R.combo} in a row</span>`:""}<span class="pill">${R.earned} marks</span></div>
  <div class="card" style="--c:${col}" id="card">
    <div class="ctop"><span class="id">${c.id}</span><span class="tag c">${TOPICS[c.t].name}</span><span class="tag">${c.k}</span><span class="tag m">${c.m} ${c.m===1?"mark":"marks"}</span>${c.ht?'<span class="tag ht">Higher only</span>':""}<span class="tag">Spec ${c.s}</span></div>
    <p class="q">${c.q}</p>
    ${body}
  </div>`;
}
function fbBanner(c,e){
  const m=c.m,full=e===m,none=e===0;
  const T=full?["Full marks.","Spot on.","Brilliant."]:none?["Not this time."]:["Nearly there."];
  const h=T[(R.i+c.id.length)%T.length];
  const s=full?(m>1?"Every mark secured.":"Correct."):none?"Read the mark scheme below and it will stick next time.":e+" of "+m+" marks. Check what you missed below.";
  return `<div class="fb ${full?"full":none?"none":"part"}"><b>${h}</b><span>${s}</span></div>`}
function curScore(c){let s=0;R.sel.forEach(i=>{if(R.opts[i]&&R.opts[i].ok)s++});return Math.min(s,c.m)}
function reveal(){if(!R.sel.length||R.rev)return;R.rev=true;
  {const c=R.cards[R.i];logEvent({t:"answer",id:c.id,topic:TOPICS[c.t].name,kind:c.k,marks:curScore(c),max:c.m,sel:R.sel.map(i=>plain(R.opts[i].h)).join(" | "),miss:R.opts.filter((o,i)=>o.ok&&!R.sel.includes(i)).map(o=>plain(o.h)).join(" | "),round:R.label})}
  roundView();const a=document.querySelector(".opts");if(a)a.scrollIntoView({behavior:"smooth",block:"start"})}
function pick(i){const n=R.cards[R.i].m;const k=R.sel.indexOf(i);
  if(k>=0)R.sel.splice(k,1);else if(n===1)R.sel=[i];else if(R.sel.length<n)R.sel.push(i);else{toast("You have chosen "+n+". Untick one to change.");return}
  const y=window.scrollY;roundView();window.scrollTo(0,y)}
function next(){
  const c=R.cards[R.i],e=curScore(c);
  R.earned+=e;R.max+=c.m;R.log.push({c,e});R.combo=(e===c.m)?(R.combo||0)+1:0;
  const st=S.cards[c.id]||(S.cards[c.id]={box:0,seen:0,best:0});
  const ratio=e/c.m;st.seen++;st.best=Math.max(st.best,e);
  if(ratio>=.8)st.box=Math.min(3,st.box+1);else if(ratio<.5)st.box=0;else st.box=Math.max(1,st.box);
  let xp=e*10+(e===c.m?5:0);S.xp+=xp;S.marks+=e;
  {const a=S.tp[c.t]||(S.tp[c.t]={e:0,m:0});a.e+=e;a.m+=c.m;const k=S.kp[c.k]||(S.kp[c.k]={e:0,m:0});k.e+=e;k.m+=c.m;S.hist[todayStr()]=(S.hist[todayStr()]||0)+e;const ks=Object.keys(S.hist).sort();while(ks.length>60)delete S.hist[ks.shift()]}
  if(S.day.d!==todayStr())S.day={d:todayStr(),m:0};S.day.m+=e;
  if(e===c.m){S.perfect++;if(c.k==="Exam trap")S.traps++}
  let lost=false;
  if(R.survival&&e<Math.ceil(c.m/2)){R.hearts--;lost=true;if(R.hearts<=0)R.over=true}
  save();
  if(R.over||R.i+1>=R.cards.length){finish();return}
  R.i++;prep();roundView();window.scrollTo(0,0);
  if(lost){const el=$("#card");el.classList.add("shake")}
}
function finish(){
  S.rounds++;
  const t=todayStr();
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.last===y.toLocaleDateString("en-CA"))?S.streak+1:1;S.last=t}
  if(S.streak>(S.best||0))S.best=S.streak;
  if(R.survival&&!R.over)S.survWins++;
  S.recent.unshift({d:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),l:R.label,e:R.earned,m:R.max});S.recent=S.recent.slice(0,10);
  logEvent({t:"round",round:R.label,marks:R.earned,max:R.max,xp:R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0),totalxp:S.xp+0,cards:R.log.length,over:R.over?1:0});
  R.newBadges=checkBadges();save();view="result";render();window.scrollTo(0,0);if(!R.over&&R.max&&R.earned/R.max>=.7)confetti();
}
function resultView(){
  const pct=R.max?R.earned/R.max:0,stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const msg=R.over?"Out of lives. Review the cards you missed and go again.":pct>=.9?"Outstanding. That is top-grade recall.":pct>=.7?"Strong round. A few marks to tidy up.":pct>=.4?"Good effort. The missed cards will come round again.":"Tough one. Read the mark schemes and try again.";
  const missed=R.log.filter(x=>x.e<x.c.m).map(x=>x.c);
  $("#app").innerHTML=`<div class="card result" style="--c:${CFG.accent}">
   <h1 style="margin-top:0">${R.over?"Game over":"Round complete"}</h1><p class="sub">${msg}</p>
   <div class="stars">${[0,1,2].map(i=>`<span class="star ${i<stars?"on":""}">${ICON.star}</span>`).join("")}</div>
   <div class="rstats"><div class="stat"><b>${R.earned}/${R.max}</b><span>marks</span></div><div class="stat"><b>${Math.round(pct*100)}%</b><span>score</span></div><div class="stat"><b>+${R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0)}</b><span>points</span></div></div>
   ${R.newBadges&&R.newBadges.length?`<div class="newb">${R.newBadges.map(b=>`<div class="badge got" style="margin:8px 0"><span class="ic">${ICON.medal}</span><div><b>New badge: ${b.n}</b><small>${b.d}</small></div></div>`).join("")}</div>`:""}
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
    ${missed.length?`<button class="btn" onclick="replay()">Retry ${missed.length} missed</button>`:""}
    <button class="btn ghost" onclick="go('home')">Back to home</button></div>
   ${missed.length?`<h2>Review</h2><div style="text-align:left">${missed.map(c=>`<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span></summary><div class="body"><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`).join("")}</div>`:""}
  </div>`;
  R.missed=missed;
}
function confetti(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cols=[CFG.accent,CFG.accent2,"#ffb84d","#3ddc97","#ffffff"];for(let i=0;i<46;i++){const s=document.createElement("i");s.className="conf";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.animationDuration=(1.8+Math.random()*1.6)+"s";s.style.animationDelay=(Math.random()*.5)+"s";s.style.borderRadius=i%3?"2px":"50%";document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function replay(){const m=R.missed;R={cards:shuffle(m.slice()),i:0,earned:0,max:0,hearts:null,survival:false,label:"Retry",rev:false,sel:[],log:[],over:false};prep();view="round";render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* ---------- library ---------- */
function library(){
  const kinds=[...new Set(DATA.map(c=>c.k))].sort();
  $("#app").innerHTML=`<div class="lib"><h1>Card <span class="grad">library</span></h1><p class="sub">Every question with its full mark scheme. Tap a card to open it.</p>
  <div class="chips">${[0].concat(TN).map(t=>`<button class="chip ${LIB.t===t?"on":""}" onclick="LIB.t=${t};library()">${t?"Topic "+t:"All topics"}</button>`).join("")}</div>
  <div class="chips"><input type="search" id="lq" placeholder="Search questions and answers" value="${LIB.q.replace(/"/g,"&quot;")}"><select id="lk"><option value="">All question types</option>${kinds.map(k=>`<option ${LIB.k===k?"selected":""}>${k}</option>`).join("")}</select><button class="chip" id="lo">Open all</button></div>
  <div id="lres"></div></div>`;
  const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
render();
</script>
</body>
</html>
