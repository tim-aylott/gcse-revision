: "4.2.2.3", "k": "Recall", "m": 2, "ht": false, "q": "What is blood made of?", "a": ["Blood is a <b>tissue<\/b> (1)", "It has <b>plasma<\/b> with <b>red blood cells<\/b>, <b>white blood cells<\/b> and <b>platelets<\/b> in it (1)"], "cp": ["Blood is a tissue", "It has plasma with red blood cells, white blood cells and platelets in it"], "dp": ["Blood is an organ", "It has plasma with only red and white blood cells", "Blood is a single cell type"], "mand": 0}, {"id": "BIO-02-037", "t": 2, "s": "4.2.2.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>red blood cell<\/b> is adapted to carry oxygen.", "a": ["Contains <b>haemoglobin<\/b>, which binds to oxygen (1)", "<b>No nucleus<\/b>, so more room for haemoglobin (1)", "<b>Biconcave<\/b> disc shape gives a large surface area (1)"], "cp": ["Contains haemoglobin, which binds to oxygen", "No nucleus, so more room for haemoglobin", "Biconcave disc shape gives a large surface area"], "dp": ["Contains chlorophyll, which binds to oxygen", "Has a large nucleus to control oxygen carrying", "Has a tail to swim through the blood"], "mand": 0}, {"id": "BIO-02-038", "t": 2, "s": "4.2.2.3", "k": "Recall", "m": 2, "ht": false, "q": "What do <b>white blood cells<\/b> do?", "a": ["They defend the body against <b>pathogens<\/b> (1)", "by <b>phagocytosis<\/b> and by making <b>antibodies<\/b> and <b>antitoxins<\/b> (1)"], "cp": ["They defend the body against pathogens", "by phagocytosis and by making antibodies and antitoxins"], "dp": ["They carry oxygen around the body", "by helping the blood clot at a wound", "They carry digested food to the cells"], "mand": 0}, {"id": "BIO-02-039", "t": 2, "s": "4.2.2.3", "k": "Recall", "m": 1, "ht": false, "q": "What do <b>platelets<\/b> do?", "a": ["They are small cell fragments that help the blood <b>clot<\/b> at a wound (1)"], "cp": ["They are small cell fragments that help the blood clot at a wound"], "dp": ["They carry oxygen around the body", "They are cells that destroy pathogens by phagocytosis", "They carry hormones to target organs"], "mand": 0}, {"id": "BIO-02-040", "t": 2, "s": "4.2.2.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> things carried in <b>plasma<\/b>.", "a": ["Any three (1 each):", "• <b>carbon dioxide<\/b> to the lungs", "• <b>digested food<\/b> (e.g. glucose)", "• <b>urea<\/b> to the kidneys", "• <b>hormones<\/b>", "• <b>heat energy<\/b>"], "cp": ["carbon dioxide to the lungs", "digested food (e.g. glucose)", "urea to the kidneys", "hormones", "heat energy"], "dp": ["oxygen to the cells", "bile to the small intestine", "enzymes to digest food in the blood"], "mand": 0}, {"id": "BIO-02-041", "t": 2, "s": "4.2.2.4", "k": "Explain", "m": 2, "ht": false, "q": "What is <b>coronary heart disease<\/b>?", "a": ["<b>Fatty material<\/b> builds up in the coronary arteries and narrows them (1)", "Less blood and <b>oxygen<\/b> reaches the heart muscle (1)"], "cp": ["Fatty material builds up in the coronary arteries and narrows them", "Less blood and oxygen reaches the heart muscle"], "dp": ["Fatty material builds up in the veins and widens them", "More blood and oxygen reaches the heart muscle", "The heart valves stop opening fully"], "mand": 0}, {"id": "BIO-02-042", "t": 2, "s": "4.2.2.4", "k": "Explain", "m": 2, "ht": false, "q": "What is a <b>stent<\/b>? How does it help?", "a": ["A tube put inside an artery (1)", "It keeps the artery <b>open<\/b>, so blood can flow to the heart muscle (1)"], "cp": ["A tube put inside an artery", "It keeps the artery open, so blood can flow to the heart muscle"], "dp": ["A tube put inside a vein to pump blood faster", "It dissolves fatty deposits using chemicals", "It replaces a damaged heart valve"], "mand": 0}, {"id": "BIO-02-043", "t": 2, "s": "4.2.2.4", "k": "Evaluate", "m": 2, "ht": false, "q": "Give one <b>advantage<\/b> and one <b>disadvantage<\/b> of taking <b>statins<\/b>.", "a": ["Advantage: <b>lower blood cholesterol<\/b> and slow the build-up of fatty deposits (1)", "Disadvantage: must be taken <b>long-term<\/b> and may cause <b>side effects<\/b> (1)"], "cp": ["Advantage: lower blood cholesterol and slow the build-up of fatty deposits", "Disadvantage: must be taken long-term and may cause side effects"], "dp": ["Advantage: they cure heart disease completely", "Disadvantage: they make the arteries narrower", "Advantage: they remove the need for a healthy diet"], "mand": 0}, {"id": "BIO-02-044", "t": 2, "s": "4.2.2.4", "k": "Recall", "m": 2, "ht": false, "q": "A heart valve is faulty. What can go wrong and how is it treated?", "a": ["The valve may <b>not open fully<\/b> or may <b>leak<\/b> (1)", "It can be replaced with a <b>biological<\/b> or <b>mechanical<\/b> valve (1)"], "cp": ["The valve may not open fully or may leak", "It can be replaced with a biological or mechanical valve"], "dp": ["The valve may grow into the artery", "It is treated with antibiotics", "It is always replaced with a new heart"], "mand": 0}, {"id": "BIO-02-045", "t": 2, "s": "4.2.2.4", "k": "Explain", "m": 2, "ht": false, "q": "Why might a patient with heart failure be given an <b>artificial heart<\/b>?", "a": ["To keep them alive while they wait for a <b>donor heart<\/b> (1)", "or to give their own heart time to <b>recover<\/b> (1)"], "cp": ["To keep them alive while they wait for a donor heart", "or to give their own heart time to recover"], "dp": ["To cure heart failure permanently with no side effects", "Because an artificial heart never causes blood clots", "To avoid taking any drugs at all"], "mand": 0}, {"id": "BIO-02-046", "t": 2, "s": "4.2.2.4", "k": "Evaluate", "m": 2, "ht": false, "q": "Give <b>two<\/b> problems with heart <b>transplants<\/b>.", "a": ["Any two (1 each):", "• not enough <b>donor hearts<\/b>", "• risk of <b>rejection<\/b> by the immune system", "• must take <b>drugs<\/b> for life to stop rejection", "• major <b>surgery<\/b>"], "cp": ["not enough donor hearts", "risk of rejection by the immune system", "must take drugs for life to stop rejection", "major surgery"], "dp": ["too many donor hearts available", "no risk of infection after surgery", "the immune system always accepts a donor heart"], "mand": 0}, {"id": "BIO-02-047", "t": 2, "s": "4.2.2.5", "k": "Definition", "m": 1, "ht": false, "q": "What is <b>health<\/b>?", "a": ["A state of <b>physical and mental wellbeing<\/b> (1)"], "cp": ["A state of physical and mental wellbeing"], "dp": ["Not having any disease or injury", "Being able to run a long distance", "A state of physical fitness only"], "mand": 0}, {"id": "BIO-02-048", "t": 2, "s": "4.2.2.5", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two<\/b> examples of one disease making another more likely.", "a": ["Any two (1 each):", "• a weak <b>immune system<\/b> makes <b>infections<\/b> more likely", "• some <b>viruses<\/b> living in cells can trigger <b>cancer<\/b>", "• immune reactions can cause <b>allergies<\/b> (e.g. rashes, asthma)", "• serious physical illness can lead to <b>depression<\/b>"], "cp": ["a weak immune system makes infections more likely", "some viruses living in cells can trigger cancer", "immune reactions can cause allergies (e.g. rashes, asthma)", "serious physical illness can lead to depression"], "dp": ["a broken bone makes cancer more likely", "being very fit makes infection more likely", "eating fruit makes depression more likely"], "mand": 0}, {"id": "BIO-02-049", "t": 2, "s": "4.2.2.6", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>risk factor<\/b> for a disease?", "a": ["Something that <b>increases the chance<\/b> of getting a disease (1)", "e.g. a lifestyle factor, or a substance in the body or environment (1)"], "cp": ["Something that increases the chance of getting a disease", "e.g. a lifestyle factor, or a substance in the body or environment"], "dp": ["Something that guarantees you will get a disease", "A drug used to treat the disease", "Something that only affects older people"], "mand": 0}, {"id": "BIO-02-050", "t": 2, "s": "4.2.2.6", "k": "Recall", "m": 4, "ht": false, "q": "Give one <b>risk factor<\/b> for each:<br/>a) cardiovascular disease<br/>b) Type 2 diabetes<br/>c) lung disease<br/>d) liver disease", "a": ["a) <b>smoking<\/b>, poor diet or lack of exercise (1)", "b) <b>obesity<\/b> (1)", "c) <b>smoking<\/b> (1)", "d) <b>alcohol<\/b> (1)"], "cp": ["a) smoking, poor diet or lack of exercise", "b) obesity", "c) smoking", "d) alcohol"], "dp": ["a) a low-fat diet", "b) regular exercise", "d) eating plenty of fibre"], "mand": 0}, {"id": "BIO-02-051", "t": 2, "s": "4.2.2.6", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two<\/b> risk factors that can harm an <b>unborn baby<\/b>.", "a": ["<b>Smoking<\/b> (1)", "<b>Alcohol<\/b> (1)"], "cp": ["Smoking", "Alcohol"], "dp": ["Eating fruit and vegetables", "Drinking enough water", "Getting enough sleep"], "mand": 0}, {"id": "BIO-02-052", "t": 2, "s": "4.2.2.6", "k": "Explain", "m": 2, "ht": false, "q": "A scatter graph shows a <b>positive correlation<\/b> between a risk factor and a disease.<br/><br/>Does this prove the risk factor causes the disease?", "a": ["<b>No<\/b> (1)", "A correlation does not prove cause. Other factors may be involved, and a <b>causal mechanism<\/b> is needed (1)"], "cp": ["No", "A correlation does not prove cause. Other factors may be involved, and a causal mechanism is needed"], "dp": ["Yes", "A positive correlation always proves the risk factor causes the disease", "Only a negative correlation can show cause"], "mand": 0}, {"id": "BIO-02-053", "t": 2, "s": "4.2.2.6", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>positive<\/b> correlation, <b>negative<\/b> correlation and <b>no<\/b> correlation.", "a": ["<b>Positive:<\/b> as one variable goes up, the other goes <b>up<\/b> (1)", "<b>Negative:<\/b> as one goes up, the other goes <b>down<\/b> (1)", "<b>None:<\/b> no pattern between the two (1)"], "cp": ["Positive: as one variable goes up, the other goes up", "Negative: as one goes up, the other goes down", "None: no pattern between the two"], "dp": ["Positive: as one variable goes up, the other goes down", "Negative: as one goes up, the other goes up", "None: the points form a perfect straight line"], "mand": 0}, {"id": "BIO-02-054", "t": 2, "s": "4.2.2.6", "k": "Explain", "m": 2, "ht": false, "q": "Why should a health survey use a <b>large, random<\/b> sample?", "a": ["A large sample is more <b>representative<\/b> of the population (1)", "A random sample avoids <b>bias<\/b> (1)"], "cp": ["A large sample is more representative of the population", "A random sample avoids bias"], "dp": ["A small sample is quicker, so it is more reliable", "A selected sample avoids anomalies", "A large sample guarantees the result is a cause"], "mand": 0}, {"id": "BIO-02-055", "t": 2, "s": "4.2.2.6", "k": "Recall", "m": 2, "ht": false, "q": "Non-communicable diseases have costs. Give <b>one human<\/b> cost and <b>one financial<\/b> cost.", "a": ["Human: <b>suffering<\/b>, ill health or early death of patients and families (1)", "Financial: the cost of <b>treatment<\/b> for the NHS, or <b>lost working days<\/b> (1)"], "cp": ["Human: suffering, ill health or early death of patients and families", "Financial: the cost of treatment for the NHS, or lost working days"], "dp": ["Human: fewer people need hospital care", "Financial: a saving in the cost of treatment", "Human: the disease cannot affect families"], "mand": 0}, {"id": "BIO-02-056", "t": 2, "s": "4.2.2.7", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>cancer<\/b>?", "a": ["<b>Uncontrolled<\/b> growth and division of cells (1)", "caused by changes in the cells (1)"], "cp": ["Uncontrolled growth and division of cells", "caused by changes in the cells"], "dp": ["Controlled growth and division of cells", "caused by bacteria only", "Cells dying faster than they are replaced"], "mand": 0}, {"id": "BIO-02-057", "t": 2, "s": "4.2.2.7", "k": "Compare", "m": 3, "ht": false, "q": "Compare a <b>benign<\/b> tumour and a <b>malignant<\/b> tumour.", "a": ["<b>Benign:<\/b> stays in <b>one place<\/b> (often inside a membrane) and does not invade other tissues (1)", "<b>Malignant:<\/b> <b>invades<\/b> neighbouring tissues (1)", "and spreads in the blood to form <b>secondary tumours<\/b> (1)"], "cp": ["Benign: stays in one place (often inside a membrane) and does not invade other tissues", "Malignant: invades neighbouring tissues", "and spreads in the blood to form secondary tumours"], "dp": ["Benign: invades neighbouring tissues", "Malignant: stays in one place inside a membrane", "Benign: spreads in the blood to form secondary tumours"], "mand": 0}, {"id": "BIO-02-058", "t": 2, "s": "4.2.2.7", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> risk factors for cancer.", "a": ["Any two (1 each):", "• <b>smoking<\/b>", "• <b>ionising radiation<\/b> (e.g. UV, X-rays)", "• <b>obesity<\/b>", "• <b>genetic<\/b> factors (inherited faulty genes)"], "cp": ["smoking", "ionising radiation (e.g. UV, X-rays)", "obesity", "genetic factors (inherited faulty genes)"], "dp": ["eating plenty of vegetables", "being underweight", "regular exercise"], "mand": 0}, {"id": "BIO-02-059", "t": 2, "s": "4.2.3.1", "k": "Recall", "m": 2, "ht": false, "q": "What is the job of the <b>palisade mesophyll<\/b> in a leaf?", "a": ["Most <b>photosynthesis<\/b> happens here (1)", "It has lots of <b>chloroplasts<\/b> and is packed near the top of the leaf to absorb light (1)"], "cp": ["Most photosynthesis happens here", "It has lots of chloroplasts and is packed near the top of the leaf to absorb light"], "dp": ["Gases diffuse through here", "It covers and protects the leaf", "It has few chloroplasts and is packed near the bottom of the leaf"], "mand": 0}, {"id": "BIO-02-060", "t": 2, "s": "4.2.3.1", "k": "Recall", "m": 2, "ht": false, "q": "What is the job of the <b>spongy mesophyll<\/b> in a leaf?", "a": ["It has <b>air spaces<\/b> (1)", "so gases such as CO<sub>2<\/sub> can <b>diffuse<\/b> through the leaf (1)"], "cp": ["It has air spaces", "so gases such as CO<sub>2<\/sub> can diffuse through the leaf"], "dp": ["Most photosynthesis happens here", "It has no air spaces, so it is waterproof", "so sugars are carried away"], "mand": 0}, {"id": "BIO-02-061", "t": 2, "s": "4.2.3.1", "k": "Recall", "m": 2, "ht": false, "q": "What is the job of the <b>epidermis<\/b> of a leaf?", "a": ["<b>Covers and protects<\/b> the leaf (1)", "The lower epidermis has <b>stomata<\/b> for gas exchange (1)"], "cp": ["Covers and protects the leaf", "The lower epidermis has stomata for gas exchange"], "dp": ["Most photosynthesis happens here", "The upper epidermis has stomata for gas exchange", "It has air spaces"], "mand": 0}, {"id": "BIO-02-062", "t": 2, "s": "4.2.3.1", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>meristem<\/b>?", "a": ["A plant tissue found at <b>growing tips<\/b> (shoots and roots) (1)", "where cells <b>divide<\/b> and can differentiate into any cell type (1)"], "cp": ["A plant tissue found at growing tips (shoots and roots)", "where cells divide and can differentiate into any cell type"], "dp": ["A plant tissue that carries water up the stem", "where cells have stopped dividing", "A tissue found only in the roots, never the shoots"], "mand": 0}, {"id": "BIO-02-063", "t": 2, "s": "4.2.3.1", "k": "Recall", "m": 4, "ht": false, "q": "Name the layers of a leaf, from the <b>top<\/b> to the <b>bottom<\/b>.", "a": ["<b>Upper epidermis<\/b> (1)", "<b>Palisade mesophyll<\/b> (1)", "<b>Spongy mesophyll<\/b> (1)", "<b>Lower epidermis<\/b> with stomata (1)"], "cp": ["Upper epidermis", "Palisade mesophyll", "Spongy mesophyll", "Lower epidermis with stomata"], "dp": ["Upper epidermis with stomata", "Spongy mesophyll before palisade mesophyll", "Xylem tubes"], "mand": 0}, {"id": "BIO-02-064", "t": 2, "s": "4.2.3.2", "k": "Explain", "m": 2, "ht": false, "q": "What do <b>stomata<\/b> and <b>guard cells<\/b> do?", "a": ["Stomata let gases in and out and let <b>water vapour<\/b> escape (1)", "<b>Guard cells<\/b> open and close the stomata (1)"], "cp": ["Stomata let gases in and out and let water vapour escape", "Guard cells open and close the stomata"], "dp": ["Stomata carry water up the stem", "Guard cells absorb water from the soil", "Stomata only let gases in, never out"], "mand": 0}, {"id": "BIO-02-065", "t": 2, "s": "4.2.3.2", "k": "Definition", "m": 3, "ht": false, "q": "What is <b>transpiration<\/b>?", "a": ["<b>Water vapour<\/b> is lost from the leaves (1)", "by evaporation through the <b>stomata<\/b> (1)", "This pulls water up the plant in the <b>xylem<\/b> (1)"], "cp": ["Water vapour is lost from the leaves", "by evaporation through the stomata", "This pulls water up the plant in the xylem"], "dp": ["Water vapour is lost from the roots", "by condensation through the stomata", "This pushes sugars down the plant in the phloem"], "mand": 0}, {"id": "BIO-02-066", "t": 2, "s": "4.2.3.2", "k": "Explain", "m": 4, "ht": false, "q": "How do these change the rate of <b>transpiration<\/b>?<br/>a) more light<br/>b) higher temperature<br/>c) higher humidity<br/>d) more wind", "a": ["a) <b>faster<\/b> (stomata open, more photosynthesis) (1)", "b) <b>faster<\/b> (more evaporation) (1)", "c) <b>slower<\/b> (smaller concentration gradient) (1)", "d) <b>faster<\/b> (water vapour is blown away) (1)"], "cp": ["a) faster (stomata open, more photosynthesis)", "b) faster (more evaporation)", "c) slower (smaller concentration gradient)", "d) faster (water vapour is blown away)"], "dp": ["a) slower (stomata close)", "c) faster (water evaporates more quickly)", "d) slower (the air around the leaf stays still)"], "mand": 0}, {"id": "BIO-02-067", "t": 2, "s": "4.2.3.2", "k": "Calculation", "m": 2, "ht": false, "q": "A plant loses 12 cm<sup>3<\/sup> of water in 4 hours.<br/><br/>Calculate the rate of water loss per hour.", "a": ["12 ÷ 4 (1)", "= <b>3 cm<sup>3<\/sup> per hour<\/b> (1)"], "cp": ["12 ÷ 4", "= 3 cm<sup>3<\/sup> per hour"], "dp": ["12 × 4", "= 48 cm<sup>3<\/sup> per hour", "= 0.3 cm<sup>3<\/sup> per hour"], "mand": 0}, {"id": "BIO-02-068", "t": 2, "s": "4.2.3.2", "k": "Definition", "m": 3, "ht": false, "q": "What is <b>translocation<\/b>?", "a": ["The movement of dissolved <b>sugars<\/b> (1)", "from the <b>leaves<\/b> to the rest of the plant (1)", "through the <b>phloem<\/b> (1)"], "cp": ["The movement of dissolved sugars", "from the leaves to the rest of the plant", "through the phloem"], "dp": ["The movement of water and mineral ions", "from the roots to the leaves", "through the xylem"], "mand": 0}, {"id": "BIO-02-069", "t": 2, "s": "4.2.3.2", "k": "Compare", "m": 4, "ht": false, "q": "Compare <b>xylem<\/b> and <b>phloem<\/b>.", "a": ["<b>Xylem:<\/b> carries <b>water and mineral ions<\/b> up from the roots (1)", "Made of dead, hollow tubes strengthened with <b>lignin<\/b> (1)", "<b>Phloem:<\/b> carries dissolved <b>sugars<\/b> to all parts of the plant (1)", "Made of living cells with <b>pores<\/b> in the end walls (1)"], "cp": ["Xylem: carries water and mineral ions up from the roots", "Made of dead, hollow tubes strengthened with lignin", "Phloem: carries dissolved sugars to all parts of the plant", "Made of living cells with pores in the end walls"], "dp": ["Xylem: carries dissolved sugars to all parts of the plant", "Phloem: made of dead, hollow tubes strengthened with lignin", "Phloem: carries water and mineral ions up from the roots"], "mand": 0}, {"id": "BIO-02-070", "t": 2, "s": "4.2.3.2", "k": "Recall", "m": 2, "ht": false, "q": "How do <b>root hair cells<\/b> take in <b>water<\/b> and <b>mineral ions<\/b>?", "a": ["Water: by <b>osmosis<\/b> (1)", "Mineral ions: by <b>active transport<\/b> (1)"], "cp": ["Water: by osmosis", "Mineral ions: by active transport"], "dp": ["Water: by active transport", "Mineral ions: by osmosis", "Mineral ions: by diffusion down the concentration gradient"], "mand": 0}, {"id": "BIO-03-001", "t": 3, "s": "4.3.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>pathogen<\/b>? Name the <b>four<\/b> types.", "a": ["A microorganism that causes <b>disease<\/b> (1)", "<b>Bacteria, viruses, protists, fungi<\/b> (1)"], "cp": ["A microorganism that causes disease", "Bacteria, viruses, protists, fungi"], "dp": ["A cell that defends the body against disease", "Bacteria, viruses, antibodies, fungi", "Bacteria, viruses, platelets, fungi"], "mand": 0}, {"id": "BIO-03-002", "t": 3, "s": "4.3.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways pathogens can be spread.", "a": ["<b>Direct contact<\/b> (1)", "Through <b>water<\/b> (1)", "Through the <b>air<\/b> (1)"], "cp": ["Direct contact", "Through water", "Through the air"], "dp": ["Through sunlight", "By osmosis", "Through the plant's xylem"], "mand": 0}, {"id": "BIO-03-003", "t": 3, "s": "4.3.1.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>bacteria<\/b> and <b>viruses<\/b> make you ill.", "a": ["Both <b>reproduce rapidly<\/b> inside the body (1)", "Bacteria may release <b>toxins<\/b> that damage tissues (1)", "Viruses live and reproduce <b>inside cells<\/b> and damage them (1)"], "cp": ["Both reproduce rapidly inside the body", "Bacteria may release toxins that damage tissues", "Viruses live and reproduce inside cells and damage them"], "dp": ["Both reproduce only outside the body", "Viruses release toxins that damage tissues, bacteria live inside cells", "Bacteria live and reproduce inside cells and damage them"], "mand": 0}, {"id": "BIO-03-004", "t": 3, "s": "4.3.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways to reduce or prevent the spread of infection.", "a": ["Any three (1 each):", "• <b>wash hands<\/b> / good hygiene", "• <b>vaccination<\/b>", "• <b>isolate<\/b> infected people", "• destroy <b>vectors<\/b> (e.g. mosquitoes)", "• use <b>condoms<\/b> (for sexually transmitted infections)"], "cp": ["wash hands / good hygiene", "vaccination", "isolate infected people", "destroy vectors (e.g. mosquitoes)", "use condoms (for sexually transmitted infections)"], "dp": ["take antibiotics to prevent viral infections", "share towels and bedding", "spend more time near infected people"], "mand": 0}, {"id": "BIO-03-005", "t": 3, "s": "4.3.1.2", "k": "Recall", "m": 3, "ht": false, "q": "<b>Measles.<\/b> What are the symptoms, how does it spread, and how is it prevented?", "a": ["<b>Fever<\/b> and a red <b>skin rash<\/b> (1)", "Spreads by <b>droplets<\/b> from coughs and sneezes (inhaled) (1)", "Prevented by <b>vaccination<\/b> (1)"], "cp": ["Fever and a red skin rash", "Spreads by droplets from coughs and sneezes (inhaled)", "Prevented by vaccination"], "dp": ["Thick yellow-green discharge", "Spreads by mosquito bites", "Prevented by antibiotics"], "mand": 0}, {"id": "BIO-03-006", "t": 3, "s": "4.3.1.2", "k": "Recall", "m": 3, "ht": false, "q": "<b>HIV.<\/b> How does it spread, what does it do and how is it controlled?", "a": ["Spreads by <b>sexual contact<\/b> or sharing <b>needles<\/b> / blood (1)", "Attacks and destroys <b>immune cells<\/b>, which can lead to <b>AIDS<\/b> (1)", "Controlled with <b>antiretroviral drugs<\/b> (1)"], "cp": ["Spreads by sexual contact or sharing needles / blood", "Attacks and destroys immune cells, which can lead to AIDS", "Controlled with antiretroviral drugs"], "dp": ["Spreads through droplets from coughs and sneezes", "Attacks and destroys red blood cells", "Controlled with antibiotics"], "mand": 0}, {"id": "BIO-03-007", "t": 3, "s": "4.3.1.2", "k": "Recall", "m": 2, "ht": false, "q": "<b>Tobacco mosaic virus (TMV).<\/b> What does it do to a plant?", "a": ["Causes a <b>mosaic<\/b> pattern of discoloured patches on the leaves (1)", "Less <b>photosynthesis<\/b>, so the plant grows less (1)"], "cp": ["Causes a mosaic pattern of discoloured patches on the leaves", "Less photosynthesis, so the plant grows less"], "dp": ["Causes purple or black spots that fall off early", "Roots rot, so the plant cannot take up water", "More photosynthesis, so the plant grows more"], "mand": 0}, {"id": "BIO-03-008", "t": 3, "s": "4.3.1.3", "k": "Recall", "m": 3, "ht": false, "q": "<b>Salmonella.<\/b> How does it spread, what are the symptoms and how is it controlled?", "a": ["Spreads through <b>contaminated food<\/b> (1)", "<b>Fever, stomach cramps, vomiting and diarrhoea<\/b> (caused by toxins) (1)", "<b>Vaccinating poultry<\/b> in the UK helps control it (1)"], "cp": ["Spreads through contaminated food", "Fever, stomach cramps, vomiting and diarrhoea (caused by toxins)", "Vaccinating poultry in the UK helps control it"], "dp": ["Spreads by sexual contact", "A red skin rash", "Controlled with antiretroviral drugs"], "mand": 0}, {"id": "BIO-03-009", "t": 3, "s": "4.3.1.3", "k": "Recall", "m": 3, "ht": false, "q": "<b>Gonorrhoea.<\/b> What are the symptoms, how does it spread and how is it controlled?", "a": ["Thick yellow-green <b>discharge<\/b> and pain when urinating (1)", "Spreads by <b>sexual contact<\/b> (1)", "Treated with <b>antibiotics<\/b> (resistant strains are now common); <b>condoms<\/b> prevent spread (1)"], "cp": ["Thick yellow-green discharge and pain when urinating", "Spreads by sexual contact", "Treated with antibiotics (resistant strains are now common); condoms prevent spread"], "dp": ["Fever and a red skin rash", "Spreads through contaminated food", "Prevented by a vaccination given in childhood"], "mand": 0}, {"id": "BIO-03-010", "t": 3, "s": "4.3.1.4", "k": "Recall", "m": 3, "ht": false, "q": "<b>Rose black spot.<\/b> What are the symptoms, how does it spread and how is it treated?", "a": ["<b>Purple or black spots<\/b> on leaves, which may turn yellow and drop early (1)", "Spreads by <b>wind and water<\/b> (spores) (1)", "Treat with <b>fungicides<\/b> and remove affected leaves (1)"], "cp": ["Purple or black spots on leaves, which may turn yellow and drop early", "Spreads by wind and water (spores)", "Treat with fungicides and remove affected leaves"], "dp": ["A mosaic pattern of discoloured patches on the leaves", "Spreads by insects such as aphids", "Treat with antibiotics"], "mand": 0}, {"id": "BIO-03-011", "t": 3, "s": "4.3.1.4", "k": "Explain", "m": 2, "ht": false, "q": "Why does rose black spot make a plant grow <b>less<\/b>?", "a": ["The spots reduce the <b>leaf area<\/b> that can absorb light (1)", "so there is less <b>photosynthesis<\/b> (1)"], "cp": ["The spots reduce the leaf area that can absorb light", "so there is less photosynthesis"], "dp": ["The spots increase the leaf area that can absorb light", "so there is more respiration", "so the roots cannot take up water"], "mand": 0}, {"id": "BIO-03-012", "t": 3, "s": "4.3.1.5", "k": "Recall", "m": 3, "ht": false, "q": "<b>Malaria.<\/b> What causes it, how does it spread and what are the symptoms?", "a": ["Caused by a <b>protist<\/b> (1)", "Spread by the bites of <b>mosquitoes<\/b> (the vector) (1)", "Recurring <b>fever<\/b>; can be fatal (1)"], "cp": ["Caused by a protist", "Spread by the bites of mosquitoes (the vector)", "Recurring fever; can be fatal"], "dp": ["Caused by a virus", "Spread by contaminated water", "A red skin rash; never fatal"], "mand": 0}, {"id": "BIO-03-013", "t": 3, "s": "4.3.1.5", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>vector<\/b>? Give an example.", "a": ["An organism that <b>carries<\/b> a pathogen from one host to another, without being harmed itself (1)", "Example: the <b>mosquito<\/b> carrying malaria (1)"], "cp": ["An organism that carries a pathogen from one host to another, without being harmed itself", "Example: the mosquito carrying malaria"], "dp": ["An organism that causes disease directly in its host", "A drug that carries a pathogen to cells", "Example: the malaria protist itself"], "mand": 0}, {"id": "BIO-03-014", "t": 3, "s": "4.3.1.5", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> ways to control the spread of <b>malaria<\/b>.", "a": ["Any two (1 each):", "• stop mosquitoes <b>breeding<\/b> (e.g. drain standing water)", "• use <b>mosquito nets<\/b>", "• use <b>insect repellent<\/b> or insecticide", "• take <b>anti-malarial drugs<\/b>"], "cp": ["stop mosquitoes breeding (e.g. drain standing water)", "use mosquito nets", "use insect repellent or insecticide", "take anti-malarial drugs"], "dp": ["give everyone antibiotics", "leave standing water so mosquitoes drown", "wash hands before eating"], "mand": 0}, {"id": "BIO-03-015", "t": 3, "s": "4.3.1.6", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four<\/b> ways the body stops pathogens getting in.", "a": ["<b>Skin<\/b> is a barrier (and scabs seal cuts) (1)", "<b>Nose<\/b> hairs and mucus trap particles (1)", "<b>Trachea and bronchi<\/b> have mucus and cilia that move it out (1)", "<b>Stomach acid<\/b> kills pathogens (1)"], "cp": ["Skin is a barrier (and scabs seal cuts)", "Nose hairs and mucus trap particles", "Trachea and bronchi have mucus and cilia that move it out", "Stomach acid kills pathogens"], "dp": ["Platelets in the skin kill pathogens", "Hairs in the stomach trap particles", "The trachea has no mucus, so it stays clear"], "mand": 0}, {"id": "BIO-03-016", "t": 3, "s": "4.3.1.6", "k": "Process", "m": 2, "ht": false, "q": "What is <b>phagocytosis<\/b>?", "a": ["A white blood cell <b>engulfs<\/b> (surrounds) a pathogen (1)", "and <b>digests<\/b> (destroys) it (1)"], "cp": ["A white blood cell engulfs (surrounds) a pathogen", "and digests (destroys) it"], "dp": ["A white blood cell makes antibodies against a pathogen", "and carries it to the kidneys", "A pathogen engulfs a white blood cell"], "mand": 0}, {"id": "BIO-03-017", "t": 3, "s": "4.3.1.6", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>antigen<\/b>?", "a": ["A <b>protein<\/b> on the surface of a pathogen (1)", "that the immune system recognises as foreign (1)", "<i>Trap: it is not the nucleus or a gene.<\/i>"], "cp": ["A protein on the surface of a pathogen", "that the immune system recognises as foreign"], "dp": ["A protein released by white blood cells", "that destroys the pathogen", "The nucleus of a pathogen"], "mand": 0}, {"id": "BIO-03-018", "t": 3, "s": "4.3.1.6", "k": "Explain", "m": 2, "ht": false, "q": "How do <b>antibodies<\/b> help to destroy a pathogen?", "a": ["White blood cells make antibodies that are <b>specific<\/b> to the pathogen's antigens (1)", "The antibodies <b>bind<\/b> to the pathogen and help to destroy it (1)"], "cp": ["White blood cells make antibodies that are specific to the pathogen's antigens", "The antibodies bind to the pathogen and help to destroy it"], "dp": ["Platelets make antibodies that work against any pathogen", "The antibodies neutralise toxins only", "Red blood cells make the antibodies"], "mand": 0}, {"id": "BIO-03-019", "t": 3, "s": "4.3.1.6", "k": "Recall", "m": 1, "ht": false, "q": "What do <b>antitoxins<\/b> do?", "a": ["They <b>neutralise toxins<\/b> released by pathogens (1)"], "cp": ["They neutralise toxins released by pathogens"], "dp": ["They engulf and digest pathogens", "They bind to antigens on pathogens", "They help blood to clot"], "mand": 0}, {"id": "BIO-03-020", "t": 3, "s": "4.3.1.7", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>vaccination<\/b> protects a person from a pathogen.", "a": ["Vaccine contains <b>dead or inactive<\/b> pathogens with <b>antigens<\/b> (1)", "This stimulates <b>white blood cells<\/b> to make <b>antibodies<\/b> (1)", "If the same pathogen enters later, the correct antibodies are made <b>quickly<\/b>, preventing illness (1)"], "cp": ["Vaccine contains dead or inactive pathogens with antigens", "This stimulates white blood cells to make antibodies", "If the same pathogen enters later, the correct antibodies are made quickly, preventing illness"], "dp": ["Vaccine contains live, harmful pathogens", "This directly kills any pathogens already in the body", "If the pathogen enters later, antibiotics are made quickly"], "mand": 0}, {"id": "BIO-03-021", "t": 3, "s": "4.3.1.7", "k": "Explain", "m": 2, "ht": false, "q": "Explain why vaccinating <b>most<\/b> of a population also protects people who are <b>not<\/b> vaccinated.", "a": ["Vaccinated people do not get or pass on the disease (1)", "so the pathogen <b>spreads less<\/b> through the population (1)"], "cp": ["Vaccinated people do not get or pass on the disease", "so the pathogen spreads less through the population"], "dp": ["Vaccinated people pass the vaccine on to others", "so the pathogen spreads faster", "so the unvaccinated make antibodies from the vaccine nearby"], "mand": 0}, {"id": "BIO-03-022", "t": 3, "s": "4.3.1.7", "k": "Explain", "m": 2, "ht": false, "q": "After vaccination, the <b>second<\/b> response to the same pathogen is faster.<br/><br/>Why?", "a": ["<b>Memory cells<\/b> remember the pathogen (1)", "and make the <b>right antibodies<\/b> much faster and in larger amounts (1)"], "cp": ["Memory cells remember the pathogen", "and make the right antibodies much faster and in larger amounts"], "dp": ["Red blood cells remember the pathogen", "and make fewer antibodies, more slowly", "The pathogen has become weaker"], "mand": 0}, {"id": "BIO-03-023", "t": 3, "s": "4.3.1.8", "k": "Exam trap", "m": 3, "ht": false, "q": "Doctors try not to prescribe antibiotics for viral infections such as flu.<br/><br/>Explain why.", "a": ["Antibiotics do <b>not kill viruses<\/b> (1)", "Unnecessary use increases the chance of bacteria developing <b>resistance<\/b> (by mutation) (1)", "<b>Resistant<\/b> bacteria survive, reproduce and spread (1)"], "cp": ["Antibiotics do not kill viruses", "Unnecessary use increases the chance of bacteria developing resistance (by mutation)", "Resistant bacteria survive, reproduce and spread"], "dp": ["Antibiotics make viruses mutate", "Viruses become resistant to antibiotics", "Antibiotics kill the body's own white blood cells"], "mand": 0}, {"id": "BIO-03-024", "t": 3, "s": "4.3.1.8", "k": "Recall", "m": 2, "ht": false, "q": "Why must different bacterial infections be treated with <b>different<\/b> antibiotics?", "a": ["Each antibiotic works on <b>specific bacteria<\/b> (1)", "so the doctor must choose the one that kills that type (1)"], "cp": ["Each antibiotic works on specific bacteria", "so the doctor must choose the one that kills that type"], "dp": ["Each antibiotic works on all bacteria", "so the doctor can use any antibiotic", "because antibiotics also kill viruses"], "mand": 0}, {"id": "BIO-03-025", "t": 3, "s": "4.3.1.8", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes: 'Bacteria become <b>immune<\/b> to antibiotics.'<br/><br/>What is wrong with this?", "a": ["<b>Immune<\/b> describes a person's immune system. Bacteria become <b>resistant<\/b> (1)", "Resistance comes from a <b>mutation<\/b> in the bacteria (1)"], "cp": ["Immune describes a person's immune system. Bacteria become resistant", "Resistance comes from a mutation in the bacteria"], "dp": ["Nothing is wrong, immune is the correct word for bacteria", "Resistance develops in the patient, not the bacteria", "Resistance is caused by the antibiotic changing the bacteria"], "mand": 0}, {"id": "BIO-03-026", "t": 3, "s": "4.3.1.8", "k": "Recall", "m": 2, "ht": false, "q": "Why are <b>painkillers<\/b> not a cure for an infection? Why are antiviral drugs hard to make?", "a": ["Painkillers treat <b>symptoms<\/b> only; they do not kill the pathogen (1)", "Viruses live <b>inside cells<\/b>, so it is hard to kill them without damaging <b>body tissue<\/b> (1)"], "cp": ["Painkillers treat symptoms only; they do not kill the pathogen", "Viruses live inside cells, so it is hard to kill them without damaging body tissue"], "dp": ["Painkillers kill the pathogen", "Viruses are too big to be targeted by drugs", "Viruses are killed easily by antibiotics"], "mand": 0}, {"id": "BIO-03-027", "t": 3, "s": "4.3.1.9", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> drugs first found in plants or microorganisms, and what each came from.", "a": ["<b>Digitalis<\/b> (foxglove) is used for heart conditions (1)", "<b>Aspirin<\/b> comes from willow (1)", "<b>Penicillin<\/b> comes from <b>Penicillium<\/b> mould (1)"], "cp": ["Digitalis (foxglove) is used for heart conditions", "Aspirin comes from willow", "Penicillin comes from Penicillium mould"], "dp": ["Digitalis comes from willow", "Aspirin comes from foxglove", "Penicillin comes from yeast"], "mand": 0}, {"id": "BIO-03-028", "t": 3, "s": "4.3.1.9", "k": "Recall", "m": 1, "ht": false, "q": "How are most new drugs made today?", "a": ["They are <b>synthesised<\/b> by chemists in laboratories, sometimes starting from a plant chemical (1)"], "cp": ["They are synthesised by chemists in laboratories, sometimes starting from a plant chemical"], "dp": ["They are collected directly from wild plants", "They are taken from animal blood", "They are grown inside human patients"], "mand": 0}, {"id": "BIO-03-029", "t": 3, "s": "4.3.1.9", "k": "Explain", "m": 2, "ht": false, "q": "What is <b>preclinical<\/b> testing? What is it looking for?", "a": ["Tests on <b>cells, tissues and live animals<\/b> (1)", "to check the drug is not <b>toxic<\/b> and that it works (1)"], "cp": ["Tests on cells, tissues and live animals", "to check the drug is not toxic and that it works"], "dp": ["Tests on healthy human volunteers", "to check how much the drug will sell for", "Tests on patients with the disease"], "mand": 0}, {"id": "BIO-03-030", "t": 3, "s": "4.3.1.9", "k": "Process", "m": 3, "ht": false, "q": "Describe the stages of a <b>clinical trial<\/b>.", "a": ["First tested on <b>healthy volunteers<\/b>, starting with a <b>low dose<\/b> (1)", "Then tested on <b>patients<\/b> (1)", "To find the <b>optimum dose<\/b> that works with the fewest side effects (1)"], "cp": ["First tested on healthy volunteers, starting with a low dose", "Then tested on patients", "To find the optimum dose that works with the fewest side effects"], "dp": ["First tested on patients at a high dose", "Then tested on animals", "To find the cheapest dose"], "mand": 0}, {"id": "BIO-03-031", "t": 3, "s": "4.3.1.9", "k": "Definition", "m": 2, "ht": false, "q": "In drug testing, what do <b>toxicity<\/b> and <b>efficacy<\/b> mean?", "a": ["<b>Toxicity:<\/b> how harmful the drug is (1)", "<b>Efficacy:<\/b> how well the drug works (1)", "<i>Trap: the word is efficacy, not efficiency.<\/i>"], "cp": ["Toxicity: how harmful the drug is", "Efficacy: how well the drug works"], "dp": ["Toxicity: how well the drug works", "Efficacy: how harmful the drug is", "Efficacy: how quickly the drug is made"], "mand": 0}, {"id": "BIO-03-032", "t": 3, "s": "4.3.1.9", "k": "Explain", "m": 3, "ht": false, "q": "In a <b>double-blind<\/b> trial, some patients get a <b>placebo<\/b>. Explain why.", "a": ["A placebo is a <b>dummy<\/b> treatment with no drug in it (1)", "It lets the effect of the drug be <b>compared<\/b> with no drug (1)", "<b>Double-blind:<\/b> neither patients nor doctors know who has the drug, to avoid <b>bias<\/b> (1)"], "cp": ["A placebo is a dummy treatment with no drug in it", "It lets the effect of the drug be compared with no drug", "Double-blind: neither patients nor doctors know who has the drug, to avoid bias"], "dp": ["A placebo is a drug with a double dose", "It lets doctors see which patients are healthiest", "Double-blind: the doctors know who has the drug but the patients do not"], "mand": 0}, {"id": "BIO-03-033", "t": 3, "s": "4.3.1.9", "k": "Explain", "m": 2, "ht": false, "q": "Why are drug trial results checked by <b>peer review<\/b> before they are published?", "a": ["Other <b>independent scientists<\/b> check the methods and results (1)", "so the findings are <b>valid<\/b> and not biased (1)"], "cp": ["Other independent scientists check the methods and results", "so the findings are valid and not biased"], "dp": ["The drug company checks its own results", "so the drug can be sold sooner", "so the results are kept secret"], "mand": 0}, {"id": "BIO-03-034", "t": 3, "s": "4.3.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Name a plant disease caused by a <b>virus<\/b>, a <b>fungus<\/b> and an <b>insect<\/b>.", "a": ["Virus: <b>tobacco mosaic virus<\/b> (1)", "Fungus: <b>rose black spot<\/b> (1)", "Insect: <b>aphids<\/b> (1)"], "cp": ["Virus: tobacco mosaic virus", "Fungus: rose black spot", "Insect: aphids"], "dp": ["Virus: rose black spot", "Fungus: tobacco mosaic virus", "Insect: salmonella"], "mand": 0}, {"id": "BIO-03-035", "t": 3, "s": "4.3.3.1", "k": "Explain", "m": 2, "ht": false, "q": "A plant has <b>stunted growth<\/b> and a <b>nitrate<\/b> deficiency.<br/><br/>Why does this affect growth?", "a": ["<b>Nitrate<\/b> is needed to make <b>protein<\/b> (1)", "Protein is needed for <b>growth<\/b>, so growth is stunted (1)"], "cp": ["Nitrate is needed to make protein", "Protein is needed for growth, so growth is stunted"], "dp": ["Nitrate is needed to make glucose", "Protein is needed for photosynthesis only", "Growth is stunted because there is too much nitrate"], "mand": 0}, {"id": "BIO-03-036", "t": 3, "s": "4.3.3.1", "k": "Explain", "m": 2, "ht": false, "q": "A plant has <b>yellow leaves<\/b> (chlorosis) because of a <b>magnesium<\/b> deficiency.<br/><br/>Why?", "a": ["<b>Magnesium<\/b> is needed to make <b>chlorophyll<\/b> (1)", "Without chlorophyll the leaves go <b>yellow<\/b> (1)", "<i>Trap: it is not caused by lack of sunlight.<\/i>"], "cp": ["Magnesium is needed to make chlorophyll", "Without chlorophyll the leaves go yellow"], "dp": ["Magnesium is needed to make protein", "Without sunlight the leaves go yellow", "Magnesium is needed to make cell walls"], "mand": 0}, {"id": "BIO-03-037", "t": 3, "s": "4.3.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> physical or chemical ways plants defend themselves.", "a": ["<b>Cellulose cell walls<\/b> and a <b>waxy cuticle<\/b> (1)", "Layers of <b>dead cells<\/b> (bark) (1)", "<b>Chemicals<\/b> that kill bacteria, or poisons that deter herbivores (1)"], "cp": ["Cellulose cell walls and a waxy cuticle", "Layers of dead cells (bark)", "Chemicals that kill bacteria, or poisons that deter herbivores"], "dp": ["A thin cuticle that lets pathogens in", "Layers of living cells that fall off", "Chemicals that help bacteria to grow"], "mand": 0}, {"id": "BIO-03-038", "t": 3, "s": "4.3.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> mechanical defences or adaptations of plants.", "a": ["Any three (1 each):", "• <b>thorns<\/b> and <b>hairs<\/b>", "• leaves that <b>droop or curl<\/b> when touched", "• <b>mimicry<\/b> (looking like another thing)"], "cp": ["thorns and hairs", "leaves that droop or curl when touched", "mimicry (looking like another thing)"], "dp": ["chloroplasts in the roots", "stomata that stay open", "thick xylem walls"], "mand": 0}, {"id": "BIO-03-H01", "t": 3, "s": "4.3.2.1", "k": "Definition", "m": 2, "ht": true, "q": "What are <b>monoclonal antibodies<\/b>?", "a": ["Antibodies made from a <b>single clone<\/b> of cells (1)", "Each one binds to just <b>one specific antigen<\/b> (1)"], "cp": ["Antibodies made from a single clone of cells", "Each one binds to just one specific antigen"], "dp": ["Antibodies made from many different cell types", "Each one binds to many different antigens", "Antibodies that kill all pathogens"], "mand": 0}, {"id": "BIO-03-H02", "t": 3, "s": "4.3.2.1", "k": "Process", "m": 4, "ht": true, "q": "Describe how <b>monoclonal antibodies<\/b> are produced.", "a": ["Mouse <b>lymphocytes<\/b> make the antibody needed (1)", "They are fused with <b>tumour cells<\/b> to make <b>hybridoma<\/b> cells (1)", "Hybridoma cells are <b>cloned<\/b> (they divide) (1)", "The antibody is <b>collected and purified<\/b> (1)"], "cp": ["Mouse lymphocytes make the antibody needed", "They are fused with tumour cells to make hybridoma cells", "Hybridoma cells are cloned (they divide)", "The antibody is collected and purified"], "dp": ["Mouse red blood cells make the antibody needed", "They are fused with bacterial cells", "The hybridoma cells are killed"], "mand": 0}, {"id": "BIO-03-H03", "t": 3, "s": "4.3.2.2", "k": "Recall", "m": 3, "ht": true, "q": "Give <b>three<\/b> uses of monoclonal antibodies.", "a": ["Any three (1 each):", "• <b>diagnosis<\/b> (e.g. pregnancy tests)", "• <b>measuring<\/b> hormones or chemicals in blood", "• <b>detecting pathogens<\/b>", "• <b>research<\/b>: fluorescent dyes locate specific molecules", "• <b>treating cancer<\/b>"], "cp": ["diagnosis (e.g. pregnancy tests)", "measuring hormones or chemicals in blood", "detecting pathogens", "research: fluorescent dyes locate specific molecules", "treating cancer"], "dp": ["making vaccines", "treating bacterial infections instead of antibiotics", "digesting starch in food"], "mand": 0}, {"id": "BIO-03-H04", "t": 3, "s": "4.3.2.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain how monoclonal antibodies can treat <b>cancer<\/b>.", "a": ["The antibody is made to bind to an <b>antigen on the cancer cells<\/b> (1)", "A <b>toxic drug<\/b> or radioactive substance is attached to it (1)", "It carries the drug to cancer cells only, so <b>healthy cells<\/b> are harmed less (1)"], "cp": ["The antibody is made to bind to an antigen on the cancer cells", "A toxic drug or radioactive substance is attached to it", "It carries the drug to cancer cells only, so healthy cells are harmed less"], "dp": ["The antibody is made to bind to healthy cells", "Vitamins are attached to it", "It carries the drug to all cells equally"], "mand": 0}, {"id": "BIO-03-H05", "t": 3, "s": "4.3.2.2", "k": "Evaluate", "m": 2, "ht": true, "q": "Give one <b>advantage<\/b> and one <b>disadvantage<\/b> of using monoclonal antibodies.", "a": ["Advantage: very <b>specific<\/b>, so they target only certain cells or molecules (1)", "Disadvantage: can have <b>unexpected side effects<\/b> and have not been as widely used as hoped (1)"], "cp": ["Advantage: very specific, so they target only certain cells or molecules", "Disadvantage: can have unexpected side effects and have not been as widely used as hoped"], "dp": ["Advantage: they work on every disease", "Disadvantage: they are not specific", "Advantage: they cause no side effects at all"], "mand": 0}, {"id": "BIO-03-H06", "t": 3, "s": "4.3.3.1", "k": "Recall", "m": 3, "ht": true, "q": "Give <b>three<\/b> signs of plant disease.", "a": ["Any three (1 each):", "• <b>stunted growth<\/b>", "• <b>spots<\/b> on leaves", "• areas of <b>decay<\/b> (rot)", "• <b>discolouration<\/b>", "• malformed stems or leaves", "• signs of <b>pests<\/b>"], "cp": ["stunted growth", "spots on leaves", "areas of decay (rot)", "discolouration", "malformed stems or leaves", "signs of pests"], "dp": ["dark green, healthy leaves", "fast, normal growth", "no spots or marks"], "mand": 0}, {"id": "BIO-03-H07", "t": 3, "s": "4.3.3.1", "k": "Recall", "m": 3, "ht": true, "q": "Give <b>three<\/b> ways to identify a plant disease.", "a": ["Any three (1 each):", "• use a <b>gardening manual<\/b> or website", "• send to a <b>laboratory<\/b> for testing", "• use a <b>testing kit<\/b> with monoclonal antibodies"], "cp": ["use a gardening manual or website", "send to a laboratory for testing", "use a testing kit with monoclonal antibodies"], "dp": ["taste the leaves", "measure the pH of the leaf", "ask other gardeners which flowers they prefer"], "mand": 0}, {"id": "BIO-04-001", "t": 4, "s": "4.4.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the <b>word equation<\/b> for photosynthesis.", "a": ["<b>carbon dioxide + water<\/b> (1)", "→ (light) → <b>glucose + oxygen<\/b> (1)", "<i>In symbols: 6CO<sub>2<\/sub> + 6H<sub>2<\/sub>O → C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub> + 6O<sub>2<\/sub><\/i>"], "cp": ["carbon dioxide + water", "→ (light) → glucose + oxygen"], "dp": ["glucose + oxygen", "→ (light) → carbon dioxide + water", "→ (light) → glucose + carbon dioxide"], "mand": 0}, {"id": "BIO-04-002", "t": 4, "s": "4.4.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Photosynthesis is an <b>endothermic<\/b> reaction. What does this mean?", "a": ["It <b>takes in energy<\/b> from the surroundings (1)", "The energy comes from <b>light<\/b>, absorbed by the chloroplasts (1)"], "cp": ["It takes in energy from the surroundings", "The energy comes from light, absorbed by the chloroplasts"], "dp": ["It gives out energy to the surroundings", "The energy comes from glucose, absorbed by the mitochondria", "It releases heat as it happens"], "mand": 0}, {"id": "BIO-04-003", "t": 4, "s": "4.4.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Where in a plant cell does photosynthesis happen? What absorbs the light?", "a": ["In the <b>chloroplasts<\/b> (1)", "The green pigment <b>chlorophyll<\/b> absorbs the light (1)"], "cp": ["In the chloroplasts", "The green pigment chlorophyll absorbs the light"], "dp": ["In the mitochondria", "The green pigment haemoglobin absorbs the light", "In the nucleus"], "mand": 0}, {"id": "BIO-04-004", "t": 4, "s": "4.4.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> factors that can limit the rate of photosynthesis.", "a": ["Any three (1 each):", "• <b>light intensity<\/b>", "• <b>carbon dioxide<\/b> concentration", "• <b>temperature<\/b>", "• amount of <b>chlorophyll<\/b>"], "cp": ["light intensity", "carbon dioxide concentration", "temperature", "amount of chlorophyll"], "dp": ["oxygen concentration", "wind speed", "soil pH"], "mand": 0}, {"id": "BIO-04-005", "t": 4, "s": "4.4.1.2", "k": "Definition", "m": 1, "ht": false, "q": "What is a <b>limiting factor<\/b>?", "a": ["The factor in <b>shortest supply<\/b>, which stops the rate going any faster (1)"], "cp": ["The factor in shortest supply, which stops the rate going any faster"], "dp": ["The factor that is easiest to change", "The factor that is in greatest supply", "The factor that speeds the rate up as far as possible"], "mand": 0}, {"id": "BIO-04-006", "t": 4, "s": "4.4.1.2", "k": "Explain", "m": 2, "ht": false, "q": "On a graph of rate against <b>light intensity<\/b>, the line rises then <b>levels off<\/b>.<br/><br/>Explain why.", "a": ["At first, more light gives a <b>faster<\/b> rate (1)", "Then light is <b>no longer limiting<\/b>. Another factor (e.g. CO<sub>2<\/sub> or temperature) is limiting (1)"], "cp": ["At first, more light gives a faster rate", "Then light is no longer limiting. Another factor (e.g. CO<sub>2<\/sub> or temperature) is limiting"], "dp": ["At first, more light gives a slower rate", "Then the chloroplasts run out of light", "Then the plant has stopped photosynthesising completely"], "mand": 0}, {"id": "BIO-04-007", "t": 4, "s": "4.4.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Above about 45°C, the rate of photosynthesis <b>falls<\/b>.<br/><br/>Explain why.", "a": ["<b>Enzymes<\/b> that control photosynthesis are <b>denatured<\/b> (1)", "Their active site changes shape, so they stop working (1)"], "cp": ["Enzymes that control photosynthesis are denatured", "Their active site changes shape, so they stop working"], "dp": ["Chlorophyll melts above 45°C", "The enzymes are used up", "The active site gets bigger"], "mand": 0}, {"id": "BIO-04-008", "t": 4, "s": "4.4.1.2", "k": "Calculation", "m": 2, "ht": false, "q": "A student counts 24 bubbles of oxygen from pondweed in 3 minutes.<br/><br/>Calculate the rate of photosynthesis in bubbles per minute.", "a": ["24 ÷ 3 (1)", "= <b>8 bubbles per minute<\/b> (1)"], "cp": ["24 ÷ 3", "= 8 bubbles per minute"], "dp": ["24 × 3", "= 72 bubbles per minute", "= 0.125 bubbles per minute"], "mand": 0}, {"id": "BIO-04-009", "t": 4, "s": "4.4.1.2", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical 6.<\/b> Describe how to investigate the effect of <b>light intensity<\/b> on the rate of photosynthesis using pondweed.", "a": ["Pondweed in water with <b>sodium hydrogencarbonate<\/b> (CO<sub>2<\/sub>) (1)", "Lamp a <b>measured distance<\/b> away (1)", "<b>Count bubbles<\/b> in a set time (1)", "<b>Repeat<\/b> at different distances, find a mean (1)", "<b>Control:<\/b> temperature, pondweed, time (1)"], "cp": ["Pondweed in water with sodium hydrogencarbonate (CO<sub>2<\/sub>)", "Lamp a measured distance away", "Count bubbles in a set time", "Repeat at different distances, find a mean", "Control: temperature, pondweed, time"], "dp": ["Pondweed in water with no sodium hydrogencarbonate", "Lamp always at the same distance", "Count bubbles over a different time at each distance"], "mand": 0}, {"id": "BIO-04-010", "t": 4, "s": "4.4.1.2", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 6.<\/b> Give <b>two<\/b> variables to keep the same.", "a": ["Any two (1 each):", "• <b>temperature<\/b> of the water", "• <b>CO<sub>2<\/sub> concentration<\/b> (same amount of sodium hydrogencarbonate)", "• same piece of <b>pondweed<\/b>", "• same <b>time<\/b> for counting"], "cp": ["temperature of the water", "CO<sub>2<\/sub> concentration (same amount of sodium hydrogencarbonate)", "same piece of pondweed", "same time for counting"], "dp": ["light intensity", "a different piece of pondweed each time", "a different volume of water each time"], "mand": 0}, {"id": "BIO-04-011", "t": 4, "s": "4.4.1.2", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 6.<\/b> A student counts bubbles. Give <b>one<\/b> problem with this method and a better way.", "a": ["Bubbles may be different sizes, so the count is <b>inaccurate<\/b> (1)", "Better: collect the gas in a <b>gas syringe<\/b> and measure its <b>volume<\/b> (1)"], "cp": ["Bubbles may be different sizes, so the count is inaccurate", "Better: collect the gas in a gas syringe and measure its volume"], "dp": ["Bubbles contain carbon dioxide, not oxygen", "Better: count the bubbles for longer", "Better: measure the mass of the pondweed"], "mand": 0}, {"id": "BIO-04-012", "t": 4, "s": "4.4.1.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways a plant uses the glucose it makes.", "a": ["Any three (1 each):", "• <b>respiration<\/b> (to release energy)", "• make <b>starch<\/b> for storage", "• make <b>fats or oils<\/b> for storage", "• make <b>cellulose<\/b> for cell walls", "• make <b>amino acids<\/b> and <b>proteins<\/b>"], "cp": ["respiration (to release energy)", "make starch for storage", "make fats or oils for storage", "make cellulose for cell walls", "make amino acids and proteins"], "dp": ["make haemoglobin", "make bile", "make lactic acid for storage"], "mand": 0}, {"id": "BIO-04-013", "t": 4, "s": "4.4.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Why do plants store glucose as <b>starch<\/b>?", "a": ["Starch is <b>insoluble<\/b> (1)", "so it does not affect <b>osmosis<\/b> (does not draw water into cells) (1)"], "cp": ["Starch is insoluble", "so it does not affect osmosis (does not draw water into cells)"], "dp": ["Starch is soluble", "so it draws water into the cells", "so it dissolves in the cell sap"], "mand": 0}, {"id": "BIO-04-014", "t": 4, "s": "4.4.1.3", "k": "Recall", "m": 2, "ht": false, "q": "What does a plant need to make <b>amino acids<\/b> from glucose?", "a": ["<b>Nitrate ions<\/b> (1)", "absorbed from the <b>soil<\/b> by the roots (1)"], "cp": ["Nitrate ions", "absorbed from the soil by the roots"], "dp": ["Magnesium ions", "absorbed from the air by the leaves", "Carbon dioxide only"], "mand": 0}, {"id": "BIO-04-015", "t": 4, "s": "4.4.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>respiration<\/b>?", "a": ["A chemical reaction in <b>all living cells<\/b> that <b>releases energy<\/b> from glucose (1)", "It is <b>exothermic<\/b>: it transfers energy to the surroundings (1)", "<i>Trap: it is not the same as breathing.<\/i>"], "cp": ["A chemical reaction in all living cells that releases energy from glucose", "It is exothermic: it transfers energy to the surroundings"], "dp": ["Breathing air in and out of the lungs", "It is endothermic: it takes in energy from the surroundings", "A reaction that only happens in animal cells"], "mand": 0}, {"id": "BIO-04-016", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the <b>word equation<\/b> for aerobic respiration.", "a": ["<b>glucose + oxygen<\/b> (1)", "→ <b>carbon dioxide + water<\/b> (1)", "<i>In symbols: C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub> + 6O<sub>2<\/sub> → 6CO<sub>2<\/sub> + 6H<sub>2<\/sub>O<\/i>"], "cp": ["glucose + oxygen", "→ carbon dioxide + water"], "dp": ["glucose + carbon dioxide", "→ lactic acid", "→ ethanol + carbon dioxide"], "mand": 0}, {"id": "BIO-04-017", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 1, "ht": false, "q": "Write the word equation for <b>anaerobic respiration in muscles<\/b>.", "a": ["<b>glucose → lactic acid<\/b> (1)"], "cp": ["glucose → lactic acid"], "dp": ["glucose → ethanol + carbon dioxide", "glucose → carbon dioxide + water", "glucose + oxygen → lactic acid"], "mand": 0}, {"id": "BIO-04-018", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the word equation for <b>anaerobic respiration in yeast<\/b> (fermentation).", "a": ["<b>glucose → ethanol<\/b> (1)", "<b>+ carbon dioxide<\/b> (1)"], "cp": ["glucose → ethanol", "+ carbon dioxide"], "dp": ["glucose → lactic acid", "+ oxygen", "+ water"], "mand": 0}, {"id": "BIO-04-019", "t": 4, "s": "4.4.2.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>aerobic<\/b> and <b>anaerobic<\/b> respiration in muscles.", "a": ["Aerobic needs <b>oxygen<\/b>; anaerobic does not (1)", "Aerobic makes <b>CO<sub>2<\/sub> and water<\/b>; anaerobic makes <b>lactic acid<\/b> (1)", "Aerobic releases <b>much more energy<\/b> (1)"], "cp": ["Aerobic needs oxygen; anaerobic does not", "Aerobic makes CO<sub>2<\/sub> and water; anaerobic makes lactic acid", "Aerobic releases much more energy"], "dp": ["Aerobic does not need oxygen; anaerobic does", "Anaerobic makes CO<sub>2<\/sub> and water; aerobic makes lactic acid", "Anaerobic releases much more energy"], "mand": 0}, {"id": "BIO-04-020", "t": 4, "s": "4.4.2.1", "k": "Explain", "m": 1, "ht": false, "q": "Why does anaerobic respiration release <b>less<\/b> energy than aerobic?", "a": ["The glucose is <b>not fully broken down<\/b> (1)"], "cp": ["The glucose is not fully broken down"], "dp": ["The glucose is completely broken down", "Oxygen is used up too quickly", "Lactic acid takes in energy"], "mand": 0}, {"id": "BIO-04-021", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> things organisms use energy from respiration for.", "a": ["Building larger <b>molecules<\/b> from smaller ones (1)", "<b>Movement<\/b> (muscle contraction) (1)", "Keeping <b>warm<\/b> (1)"], "cp": ["Building larger molecules from smaller ones", "Movement (muscle contraction)", "Keeping warm"], "dp": ["Making oxygen from water", "Absorbing light", "Cooling the body down"], "mand": 0}, {"id": "BIO-04-022", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> uses of yeast fermentation.", "a": ["<b>Bread making<\/b>: the carbon dioxide makes the dough rise (1)", "<b>Alcoholic drinks<\/b>: ethanol is produced (1)"], "cp": ["Bread making: the carbon dioxide makes the dough rise", "Alcoholic drinks: ethanol is produced"], "dp": ["Bread making: the ethanol makes the dough rise", "Alcoholic drinks: lactic acid is produced", "Making yoghurt: yeast produces lactic acid"], "mand": 0}, {"id": "BIO-04-023", "t": 4, "s": "4.4.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>heart rate<\/b> and <b>breathing rate<\/b> increase during exercise.", "a": ["Muscles need more <b>energy<\/b> from respiration (1)", "so they need more <b>oxygen and glucose<\/b> delivered by the blood (1)", "and more <b>carbon dioxide<\/b> removed (1)"], "cp": ["Muscles need more energy from respiration", "so they need more oxygen and glucose delivered by the blood", "and more carbon dioxide removed"], "dp": ["Muscles need more energy from photosynthesis", "and more oxygen removed", "and less glucose delivered by the blood"], "mand": 0}, {"id": "BIO-04-024", "t": 4, "s": "4.4.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why muscles get <b>tired<\/b> during long, hard exercise.", "a": ["Not enough oxygen reaches the muscles, so they use <b>anaerobic respiration<\/b> (1)", "<b>Lactic acid<\/b> builds up (1)", "This causes muscle <b>fatigue<\/b> (they stop contracting well) (1)"], "cp": ["Not enough oxygen reaches the muscles, so they use anaerobic respiration", "Lactic acid builds up", "This causes muscle fatigue (they stop contracting well)"], "dp": ["Too much oxygen reaches the muscles", "Glucose builds up", "Enough oxygen reaches the muscles, so they use aerobic respiration only"], "mand": 0}, {"id": "BIO-04-025", "t": 4, "s": "4.4.2.2", "k": "Practical", "m": 3, "ht": false, "q": "A student investigates the effect of exercise on <b>heart rate<\/b>.<br/><br/>What should they measure, and what should they control?", "a": ["Measure heart rate <b>before<\/b> and <b>after<\/b> exercise (1)", "Use the <b>same person / same type<\/b> and amount of exercise (1)", "<b>Repeat<\/b> and calculate a mean (1)"], "cp": ["Measure heart rate before and after exercise", "Use the same person / same type and amount of exercise", "Repeat and calculate a mean"], "dp": ["Measure heart rate only after exercise", "Use a different person each time", "Do a different type of exercise each time"], "mand": 0}, {"id": "BIO-04-026", "t": 4, "s": "4.4.2.3", "k": "Definition", "m": 1, "ht": false, "q": "What is <b>metabolism<\/b>?", "a": ["The <b>sum of all the chemical reactions<\/b> in a cell or the body (1)"], "cp": ["The sum of all the chemical reactions in a cell or the body"], "dp": ["The breakdown of food in the gut", "The speed of the heart", "The movement of substances across a membrane"], "mand": 0}, {"id": "BIO-04-027", "t": 4, "s": "4.4.2.3", "k": "Recall", "m": 2, "ht": false, "q": "How is a <b>lipid<\/b> (fat) built in the body?", "a": ["From <b>one glycerol<\/b> molecule (1)", "and <b>three fatty acids<\/b> (1)"], "cp": ["From one glycerol molecule", "and three fatty acids"], "dp": ["three glycerol molecules", "one fatty acid", "one amino acid"], "mand": 0}, {"id": "BIO-04-028", "t": 4, "s": "4.4.2.3", "k": "Recall", "m": 2, "ht": false, "q": "How are <b>proteins<\/b> made from glucose?", "a": ["Glucose and <b>nitrate ions<\/b> are used to make <b>amino acids<\/b> (1)", "Amino acids are joined together to make <b>proteins<\/b> (1)"], "cp": ["Glucose and nitrate ions are used to make amino acids", "Amino acids are joined together to make proteins"], "dp": ["Glucose and fatty acids are used to make amino acids", "Amino acids are joined together to make starch", "Glucose is joined to glycerol"], "mand": 0}, {"id": "BIO-04-029", "t": 4, "s": "4.4.2.3", "k": "Recall", "m": 2, "ht": false, "q": "What happens to <b>excess protein<\/b> in the body?", "a": ["It is broken down to make <b>urea<\/b> (1)", "which is <b>excreted<\/b> in the urine (1)"], "cp": ["It is broken down to make urea", "which is excreted in the urine"], "dp": ["It is stored as extra protein", "It is excreted in the faeces", "It is turned into starch"], "mand": 0}, {"id": "BIO-04-H01", "t": 4, "s": "4.4.1.2", "k": "Calculation", "m": 2, "ht": true, "q": "Light intensity is <b>inversely proportional<\/b> to distance squared.<br/><br/>A lamp is moved from 10 cm to 20 cm away from some pondweed. By what factor does the light intensity change?", "a": ["Distance <b>doubles<\/b> (1)", "Intensity falls to <b>one quarter<\/b> (÷ 4) (1)", "<i>Intensity is proportional to 1 / distance<sup>2<\/sup>.<\/i>"], "cp": ["Distance doubles", "Intensity falls to one quarter (÷ 4)"], "dp": ["Distance halves", "Intensity falls to a half", "Intensity doubles"], "mand": 0}, {"id": "BIO-04-H02", "t": 4, "s": "4.4.1.2", "k": "Calculation", "m": 2, "ht": true, "q": "A lamp is moved from 10 cm to 30 cm from some pondweed.<br/><br/>How does the light intensity change?", "a": ["Distance is <b>×3<\/b> (1)", "Intensity falls to <b>1 / 9<\/b> of the original (÷ 3<sup>2<\/sup>) (1)"], "cp": ["Distance is ×3", "Intensity falls to 1 / 9 of the original (÷ 3<sup>2<\/sup>)"], "dp": ["Distance is ×2", "Intensity falls to 1/3 of the original", "Intensity falls to 1/6 of the original"], "mand": 0}, {"id": "BIO-04-H03", "t": 4, "s": "4.4.1.2", "k": "Data", "m": 3, "ht": true, "q": "A graph of rate against light intensity has <b>two lines<\/b>: one at 20°C and one at 30°C. They are the same at low light, then the 30°C line rises higher.<br/><br/>Explain.", "a": ["At low light intensity, <b>light<\/b> is the limiting factor for both (1)", "The 20°C line levels off, so <b>temperature<\/b> (or CO<sub>2<\/sub>) is then limiting (1)", "The 30°C line rises higher because <b>temperature<\/b> was limiting at 20°C (1)"], "cp": ["At low light intensity, light is the limiting factor for both", "The 20°C line levels off, so temperature (or CO<sub>2<\/sub>) is then limiting", "The 30°C line rises higher because temperature was limiting at 20°C"], "dp": ["At low light, temperature is the limiting factor for both", "The 20°C line levels off because the light is too bright", "The 30°C line rises higher because the plant has more chlorophyll"], "mand": 0}, {"id": "BIO-04-H04", "t": 4, "s": "4.4.1.2", "k": "Evaluate", "m": 3, "ht": true, "q": "A farmer adds heating, lighting and CO<sub>2<\/sub> to a greenhouse.<br/><br/>Why might the farmer stop adding more?", "a": ["Raising the <b>limiting factor<\/b> increases the rate and the yield (1)", "But once another factor is limiting, extra input gives <b>no extra growth<\/b> (1)", "So extra <b>cost<\/b> is wasted; the profit must be greater than the cost (1)"], "cp": ["Raising the limiting factor increases the rate and the yield", "But once another factor is limiting, extra input gives no extra growth", "So extra cost is wasted; the profit must be greater than the cost"], "dp": ["Raising the limiting factor decreases the yield", "But more input always gives more growth", "So the profit is always greater than the cost"], "mand": 0}, {"id": "BIO-04-H05", "t": 4, "s": "4.4.2.2", "k": "Explain", "m": 2, "ht": true, "q": "Why do you keep breathing <b>heavily<\/b> after you stop exercising?", "a": ["To take in <b>extra oxygen<\/b> (the <b>oxygen debt<\/b>) (1)", "to break down the <b>lactic acid<\/b> that built up (1)"], "cp": ["To take in extra oxygen (the oxygen debt)", "to break down the lactic acid that built up"], "dp": ["To get rid of extra oxygen", "to make more lactic acid", "to make glucose from lactic acid in the muscles"], "mand": 0}, {"id": "BIO-04-H06", "t": 4, "s": "4.4.2.2", "k": "Recall", "m": 2, "ht": true, "q": "What happens to <b>lactic acid<\/b> after exercise?", "a": ["It is carried by the blood to the <b>liver<\/b> (1)", "where it is converted back to <b>glucose<\/b> (1)"], "cp": ["It is carried by the blood to the liver", "where it is converted back to glucose"], "dp": ["It is carried by the blood to the kidneys", "where it is converted into urea", "It stays in the muscles for ever"], "mand": 0}, {"id": "BIO-04-H07", "t": 4, "s": "4.4.2.2", "k": "Definition", "m": 1, "ht": true, "q": "What is <b>oxygen debt<\/b>?", "a": ["The <b>extra oxygen<\/b> the body needs after exercise to react with the lactic acid and remove it (1)", "<i>Trap: it must be 'repaid', not just 'owed'.<\/i>"], "cp": ["The extra oxygen the body needs after exercise to react with the lactic acid and remove it"], "dp": ["The oxygen the body is short of during exercise", "The oxygen that muscles store to use later", "The carbon dioxide the body must remove after exercise"], "mand": 0}, {"id": "BIO-05-001", "t": 5, "s": "4.5.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>homeostasis<\/b>?", "a": ["The regulation of the body's <b>internal conditions<\/b> (1)", "to keep them <b>optimal<\/b> for enzymes and cell functions (1)"], "cp": ["The regulation of the body's internal conditions", "to keep them optimal for enzymes and cell functions"], "dp": ["The regulation of the body's external conditions", "to keep them at the maximum level possible", "The response of a plant to a stimulus"], "mand": 0}, {"id": "BIO-05-002", "t": 5, "s": "4.5.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> things controlled by homeostasis in humans.", "a": ["<b>Blood glucose<\/b> concentration (1)", "<b>Body temperature<\/b> (1)", "<b>Water levels<\/b> (1)"], "cp": ["Blood glucose concentration", "Body temperature", "Water levels"], "dp": ["Height", "Blood group", "Eye colour"], "mand": 0}, {"id": "BIO-05-003", "t": 5, "s": "4.5.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three parts<\/b> of a control system and what each does.", "a": ["<b>Receptors<\/b> detect a change (stimulus) (1)", "<b>Coordination centre<\/b> (e.g. brain, pancreas) processes the information (1)", "<b>Effectors<\/b> (muscles or glands) bring about a response (1)"], "cp": ["Receptors detect a change (stimulus)", "Coordination centre (e.g. brain, pancreas) processes the information", "Effectors (muscles or glands) bring about a response"], "dp": ["Receptors bring about a response", "Effectors detect a change", "The coordination centre releases the stimulus"], "mand": 0}, {"id": "BIO-05-004", "t": 5, "s": "4.5.2.1", "k": "Process", "m": 2, "ht": false, "q": "Write the pathway of a nervous response, from <b>stimulus<\/b> to <b>response<\/b>.", "a": ["<b>stimulus → receptor → coordinator<\/b> (CNS) (1)", "<b>→ effector → response<\/b> (1)"], "cp": ["stimulus → receptor → coordinator (CNS)", "→ effector → response"], "dp": ["stimulus → effector → coordinator (CNS)", "→ receptor → response", "→ response → effector"], "mand": 0}, {"id": "BIO-05-005", "t": 5, "s": "4.5.2.1", "k": "Definition", "m": 1, "ht": false, "q": "What is a <b>reflex<\/b>?", "a": ["A <b>fast, automatic<\/b> response that does not involve the conscious part of the brain (1)", "<i>Trap: give a definition, not an example.<\/i>"], "cp": ["A fast, automatic response that does not involve the conscious part of the brain"], "dp": ["A slow response that needs thought", "A response controlled by hormones", "A response that must be learned first"], "mand": 0}, {"id": "BIO-05-006", "t": 5, "s": "4.5.2.1", "k": "Explain", "m": 1, "ht": false, "q": "Why are reflexes useful?", "a": ["They are <b>fast<\/b>, so they protect the body from harm (1)"], "cp": ["They are fast, so they protect the body from harm"], "dp": ["They are slow, so the brain can decide what to do", "They need conscious thought, so they are accurate", "They make hormones"], "mand": 0}, {"id": "BIO-05-007", "t": 5, "s": "4.5.2.1", "k": "Process", "m": 4, "ht": false, "q": "Describe the path of a nerve impulse in a <b>reflex arc<\/b>.", "a": ["<b>Receptor<\/b> detects the stimulus (1)", "Impulse along the <b>sensory neurone<\/b> to the <b>relay neurone<\/b> in the CNS (1)", "Impulse along the <b>motor neurone<\/b> (1)", "to the <b>effector<\/b> (muscle or gland), which responds (1)"], "cp": ["Receptor detects the stimulus", "Impulse along the sensory neurone to the relay neurone in the CNS", "Impulse along the motor neurone", "to the effector (muscle or gland), which responds"], "dp": ["Impulse along the motor neurone to the relay neurone in the CNS", "Impulse along the sensory neurone straight to the effector", "Receptor detects the stimulus and responds itself"], "mand": 0}, {"id": "BIO-05-008", "t": 5, "s": "4.5.2.1", "k": "Explain", "m": 2, "ht": false, "q": "What is a <b>synapse<\/b>, and how does an impulse cross it?", "a": ["A <b>gap<\/b> between two neurones (1)", "<b>Chemicals<\/b> diffuse across the gap and start an impulse in the next neurone (1)"], "cp": ["A gap between two neurones", "Chemicals diffuse across the gap and start an impulse in the next neurone"], "dp": ["A fatty sheath around a neurone", "Electrical sparks jump across the gap", "A gap between a neurone and a hormone"], "mand": 0}, {"id": "BIO-05-009", "t": 5, "s": "4.5.2.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare the <b>nervous<\/b> system and the <b>hormonal<\/b> system.", "a": ["Nervous: <b>electrical impulses<\/b>; hormonal: <b>chemicals in the blood<\/b> (1)", "Nervous response is <b>fast<\/b>; hormonal is <b>slower<\/b> (1)", "Nervous effects are <b>short-lived<\/b>; hormonal effects <b>last longer<\/b> (1)"], "cp": ["Nervous: electrical impulses; hormonal: chemicals in the blood", "Nervous response is fast; hormonal is slower", "Nervous effects are short-lived; hormonal effects last longer"], "dp": ["Nervous: chemicals in the blood; hormonal: electrical impulses", "Nervous response is slow; hormonal is faster", "Nervous effects last longer; hormonal effects are short-lived"], "mand": 0}, {"id": "BIO-05-010", "t": 5, "s": "4.5.2.1", "k": "Practical", "m": 4, "ht": false, "q": "<b>Required practical 7.<\/b> Describe how to measure <b>reaction time<\/b> using a ruler.", "a": ["A partner holds a ruler and <b>drops it without warning<\/b> (1)", "The student <b>catches<\/b> it (1)", "Record the <b>distance<\/b> on the ruler where it was caught (1)", "<b>Repeat<\/b> and calculate a <b>mean<\/b> (1)"], "cp": ["A partner holds a ruler and drops it without warning", "The student catches it", "Record the distance on the ruler where it was caught", "Repeat and calculate a mean"], "dp": ["The student drops the ruler themselves", "Record the time the ruler takes to fall", "Do the test once only"], "mand": 0}, {"id": "BIO-05-011", "t": 5, "s": "4.5.2.1", "k": "Practical", "m": 3, "ht": false, "q": "A student investigates the effect of caffeine on reaction time.<br/><br/>Name the <b>independent<\/b> variable, the <b>dependent<\/b> variable and one <b>control<\/b> variable.", "a": ["<b>Independent:<\/b> caffeine (amount, or with / without) (1)", "<b>Dependent:<\/b> reaction time (1)", "<b>Control (any one):<\/b> same person, same hand, same method, same time of day (1)"], "cp": ["Independent: caffeine (amount, or with / without)", "Dependent: reaction time", "Control (any one): same person, same hand, same method, same time of day"], "dp": ["Independent: reaction time", "Dependent: caffeine", "Control: a different person each time"], "mand": 0}, {"id": "BIO-05-012", "t": 5, "s": "4.5.2.1", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 7.<\/b> Why should the student <b>repeat<\/b> the reaction time test and use a mean?", "a": ["To reduce the effect of <b>random errors<\/b> (1)", "so the result is more <b>reliable<\/b> (1)"], "cp": ["To reduce the effect of random errors", "so the result is more reliable"], "dp": ["To remove all systematic errors", "To choose the fastest time", "so the independent variable changes"], "mand": 0}, {"id": "BIO-05-013", "t": 5, "s": "4.5.2.2", "k": "Recall", "m": 3, "ht": false, "q": "Name the job of the <b>cerebral cortex<\/b>, the <b>cerebellum<\/b> and the <b>medulla<\/b>.", "a": ["<b>Cerebral cortex:<\/b> consciousness, intelligence, memory and language (1)", "<b>Cerebellum:<\/b> controls muscle <b>coordination<\/b> and movement (1)", "<b>Medulla:<\/b> controls <b>unconscious<\/b> actions such as heart rate and breathing (1)"], "cp": ["Cerebral cortex: consciousness, intelligence, memory and language", "Cerebellum: controls muscle coordination and movement", "Medulla: controls unconscious actions such as heart rate and breathing"], "dp": ["Cerebral cortex: controls heart rate and breathing", "Cerebellum: consciousness and memory", "Medulla: muscle coordination and movement"], "mand": 0}, {"id": "BIO-05-014", "t": 5, "s": "4.5.2.3", "k": "Recall", "m": 4, "ht": false, "q": "State the job of the <b>cornea<\/b>, <b>retina<\/b>, <b>optic nerve<\/b> and <b>iris<\/b>.", "a": ["<b>Cornea:<\/b> refracts (bends) light into the eye (1)", "<b>Retina:<\/b> has receptor cells sensitive to light and colour (1)", "<b>Optic nerve:<\/b> carries impulses to the brain (1)", "<b>Iris:<\/b> controls the <b>size of the pupil<\/b> (1)"], "cp": ["Cornea: refracts (bends) light into the eye", "Retina: has receptor cells sensitive to light and colour", "Optic nerve: carries impulses to the brain", "Iris: controls the size of the pupil"], "dp": ["Cornea: controls the size of the pupil", "Retina: bends light into the eye", "Iris: has receptor cells sensitive to light"], "mand": 0}, {"id": "BIO-05-015", "t": 5, "s": "4.5.2.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the eye adjusts to <b>bright light<\/b>.", "a": ["The <b>iris<\/b> muscles change the pupil (1)", "The pupil gets <b>smaller<\/b> (1)", "so <b>less light<\/b> enters and the retina is protected (1)"], "cp": ["The iris muscles change the pupil", "The pupil gets smaller", "so less light enters and the retina is protected"], "dp": ["The pupil gets larger", "so more light enters the eye", "The lens muscles change the pupil"], "mand": 0}, {"id": "BIO-05-016", "t": 5, "s": "4.5.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain how the pupil changes in <b>dim light<\/b>.", "a": ["The pupil gets <b>larger<\/b> (1)", "so <b>more light<\/b> enters the eye (1)"], "cp": ["The pupil gets larger", "so more light enters the eye"], "dp": ["The pupil gets smaller", "so less light enters the eye", "The lens gets thicker"], "mand": 0}, {"id": "BIO-05-017", "t": 5, "s": "4.5.2.3", "k": "Process", "m": 3, "ht": false, "q": "Explain how the eye focuses on a <b>near<\/b> object (accommodation).", "a": ["<b>Ciliary muscles contract<\/b> (1)", "<b>Suspensory ligaments loosen<\/b> (1)", "The lens becomes <b>thicker<\/b> and refracts light more (1)"], "cp": ["Ciliary muscles contract", "Suspensory ligaments loosen", "The lens becomes thicker and refracts light more"], "dp": ["Ciliary muscles relax", "Suspensory ligaments tighten", "The lens becomes thinner"], "mand": 0}, {"id": "BIO-05-018", "t": 5, "s": "4.5.2.3", "k": "Process", "m": 3, "ht": false, "q": "Explain how the eye focuses on a <b>distant<\/b> object.", "a": ["<b>Ciliary muscles relax<\/b> (1)", "<b>Suspensory ligaments tighten<\/b> (1)", "The lens becomes <b>thinner<\/b> and refracts light less (1)"], "cp": ["Ciliary muscles relax", "Suspensory ligaments tighten", "The lens becomes thinner and refracts light less"], "dp": ["Ciliary muscles contract", "Suspensory ligaments loosen", "The lens becomes thicker and refracts light more"], "mand": 0}, {"id": "BIO-05-019", "t": 5, "s": "4.5.2.3", "k": "Exam trap", "m": 2, "ht": false, "q": "What is the difference between <b>accommodation<\/b> and <b>adaptation<\/b> in the eye?", "a": ["<b>Accommodation:<\/b> the lens changes shape to focus on near or far objects (1)", "<b>Adaptation:<\/b> the pupil changes size for bright or dim light (1)"], "cp": ["Accommodation: the lens changes shape to focus on near or far objects", "Adaptation: the pupil changes size for bright or dim light"], "dp": ["Accommodation: the pupil changes size", "Adaptation: the lens changes shape", "They are the same thing"], "mand": 0}, {"id": "BIO-05-020", "t": 5, "s": "4.5.2.3", "k": "Explain", "m": 3, "ht": false, "q": "What is <b>myopia<\/b> (short sight)? Why does it happen and how is it corrected?", "a": ["Distant objects look <b>blurred<\/b>; light focuses <b>in front of<\/b> the retina (1)", "The eyeball is too <b>long<\/b>, or the lens is too strong (1)", "Corrected with a <b>concave<\/b> lens (glasses or contact lenses) or laser surgery (1)"], "cp": ["Distant objects look blurred; light focuses in front of the retina", "The eyeball is too long, or the lens is too strong", "Corrected with a concave lens (glasses or contact lenses) or laser surgery"], "dp": ["Near objects look blurred; light focuses behind the retina", "The eyeball is too short, or the lens is too weak", "Corrected with a convex lens"], "mand": 0}, {"id": "BIO-05-021", "t": 5, "s": "4.5.2.3", "k": "Explain", "m": 3, "ht": false, "q": "What is <b>hyperopia<\/b> (long sight)? Why does it happen and how is it corrected?", "a": ["Near objects look <b>blurred<\/b>; light focuses <b>behind<\/b> the retina (1)", "The eyeball is too <b>short<\/b>, or the lens is too weak (1)", "Corrected with a <b>convex<\/b> lens or laser surgery (1)"], "cp": ["Near objects l
