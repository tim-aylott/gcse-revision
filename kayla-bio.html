<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayla Biology">
<meta name="theme-color" content="#0d1020">
<title>Kayla's Biology Lab | GCSE Higher revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#8b7bff;--accent2:#38d0f0;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M5 3c0 6 4 7 7 9s5 3 7 9M19 3c0 6-4 7-7 9s-5 3-7 9"/><path d="M7 7h10M7 17h10"/></svg></span><span>Biology Lab</span></button>
  <span class="pill">Kayla | Higher</span>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your progress is saved on this device. Your answers are also sent to a private progress sheet so your parents can see how revision is going. Original questions written in GCSE mark-scheme style.</footer></div>
<script>
const DATA=[{"id": "BIO-01-001", "t": 1, "s": "4.1.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>eukaryotic<\/b> cell? Give <b>two<\/b> examples.", "a": ["Has its genetic material inside a <b>nucleus<\/b> (1)", "Examples: <b>plant cells<\/b> and <b>animal cells<\/b> (1)"], "cp": ["Has its genetic material inside a nucleus", "Examples: plant cells and animal cells"], "dp": ["Has its genetic material free in the cytoplasm as a single loop", "Examples: bacterial cells and viruses", "Has no mitochondria or other sub-cellular structures"], "mand": 0}, {"id": "BIO-01-002", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> features of a <b>prokaryotic<\/b> (bacterial) cell.", "a": ["Any three (1 each):", "• <b>no nucleus<\/b>", "• DNA is a single <b>loop<\/b> in the cytoplasm", "• may have <b>plasmids<\/b> (small rings of DNA)", "• has a <b>cell wall<\/b>", "• much <b>smaller<\/b> than plant and animal cells"], "cp": ["no nucleus", "DNA is a single loop in the cytoplasm", "may have plasmids (small rings of DNA)", "has a cell wall", "much smaller than plant and animal cells"], "dp": ["has a nucleus that holds the DNA", "DNA is arranged in 23 pairs of chromosomes", "much larger than plant and animal cells"], "mand": 0}, {"id": "BIO-01-003", "t": 1, "s": "4.1.1.1", "k": "Compare", "m": 2, "ht": false, "q": "Give <b>two<\/b> differences between a bacterial cell and an animal cell.", "a": ["Any two (1 each):", "• bacteria have <b>no nucleus<\/b>; animal cells do", "• bacteria have a <b>cell wall<\/b>; animal cells do not", "• bacterial DNA is a <b>single loop<\/b> and they may have <b>plasmids<\/b>", "• bacterial cells are <b>much smaller<\/b>"], "cp": ["bacteria have no nucleus; animal cells do", "bacteria have a cell wall; animal cells do not", "bacterial DNA is a single loop and they may have plasmids", "bacterial cells are much smaller"], "dp": ["bacteria have a nucleus; animal cells do not", "bacterial cells are much larger", "animal cells have a cell wall; bacteria do not"], "mand": 0}, {"id": "BIO-01-004", "t": 1, "s": "4.1.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>plasmid<\/b>? Where is it found?", "a": ["A small <b>ring of DNA<\/b> (1)", "Found in <b>bacterial<\/b> (prokaryotic) cells, as well as the main DNA loop (1)"], "cp": ["A small ring of DNA", "Found in bacterial (prokaryotic) cells, as well as the main DNA loop"], "dp": ["A small ring of protein that makes enzymes", "A long molecule of RNA found in the nucleus", "Found only in plant cells, inside the chloroplasts"], "mand": 0}, {"id": "BIO-01-005", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Complete these unit conversions:<br/>1 mm = ? µm<br/>1 µm = ? nm", "a": ["1 mm = <b>1000 µm<\/b> (1)", "1 µm = <b>1000 nm<\/b> (1)"], "cp": ["1 mm = 1000 µm", "1 µm = 1000 nm"], "dp": ["1 mm = 100 µm", "1 µm = 100 nm", "1 mm = 10 000 µm"], "mand": 0}, {"id": "BIO-01-006", "t": 1, "s": "4.1.1.1", "k": "Calculation", "m": 1, "ht": false, "q": "A bacterium is 0.0000025 m long.<br/><br/>Write this length in <b>standard form<\/b>.", "a": ["The number must be between 1 and 10, so 2.5", "The decimal point moves 6 places to the right, so the power is negative", "<b>2.5 × 10<sup>-6<\/sup> m<\/b> (1)"], "cp": ["2.5 × 10<sup>-6<\/sup> m"], "dp": ["2.5 × 10<sup>6<\/sup> m", "2.5 × 10<sup>-5<\/sup> m", "2.5 × 10<sup>-7<\/sup> m"], "mand": 0}, {"id": "BIO-01-007", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What does the <b>nucleus<\/b> do?", "a": ["It contains the cell's <b>genetic material<\/b> (DNA) (1)", "which <b>controls the activities<\/b> of the cell (1)"], "cp": ["It contains the cell's genetic material (DNA)", "which controls the activities of the cell"], "dp": ["It is where aerobic respiration happens", "It is where proteins are made", "It controls what moves into and out of the cell"], "mand": 0}, {"id": "BIO-01-008", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the job of the <b>mitochondria<\/b>?", "a": ["They are where <b>aerobic respiration<\/b> happens (1)", "which <b>releases energy<\/b> for the cell (1)"], "cp": ["They are where aerobic respiration happens", "which releases energy for the cell"], "dp": ["They are where photosynthesis happens", "which controls the activities of the cell", "They are where proteins are made"], "mand": 0}, {"id": "BIO-01-009", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 1, "ht": false, "q": "What do <b>ribosomes<\/b> do?", "a": ["They are where <b>proteins are made<\/b> (protein synthesis) (1)"], "cp": ["They are where proteins are made (protein synthesis)"], "dp": ["They are where aerobic respiration happens", "They are where photosynthesis happens", "They contain the cell's DNA"], "mand": 0}, {"id": "BIO-01-010", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the job of <b>chloroplasts<\/b>? Which cells have them?", "a": ["They contain <b>chlorophyll<\/b> and absorb light for <b>photosynthesis<\/b> (1)", "Found in <b>plant cells<\/b> (often in leaves) (1)"], "cp": ["They contain chlorophyll and absorb light for photosynthesis", "Found in plant cells (often in leaves)"], "dp": ["They release energy from glucose by respiration", "Found in animal cells and bacterial cells", "They store cell sap to keep the cell firm"], "mand": 0}, {"id": "BIO-01-011", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 1, "ht": false, "q": "What does the <b>cell membrane<\/b> do?", "a": ["It <b>controls what moves into and out of<\/b> the cell (1)"], "cp": ["It controls what moves into and out of the cell"], "dp": ["It gives the cell a strong, rigid outer layer", "It is where most chemical reactions happen", "It contains the genetic material"], "mand": 0}, {"id": "BIO-01-012", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 1, "ht": false, "q": "What is the <b>cytoplasm<\/b> and what happens there?", "a": ["A jelly-like liquid where most <b>chemical reactions<\/b> of the cell happen (1)"], "cp": ["A jelly-like liquid where most chemical reactions of the cell happen"], "dp": ["A rigid layer made of cellulose that supports the cell", "A structure that controls what enters and leaves the cell", "A solid structure where proteins are made"], "mand": 0}, {"id": "BIO-01-013", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>cell wall<\/b> of a plant cell made of? What does it do?", "a": ["Made of <b>cellulose<\/b> (1)", "<b>Strengthens<\/b> and supports the cell (1)"], "cp": ["Made of cellulose", "Strengthens and supports the cell"], "dp": ["Made of lignin", "Controls which substances enter and leave the cell", "Contains the cell's genetic material"], "mand": 0}, {"id": "BIO-01-014", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>permanent vacuole<\/b> in a plant cell?", "a": ["It is filled with <b>cell sap<\/b> (a solution of sugars and salts) (1)", "It keeps the cell <b>firm<\/b> (rigid) (1)"], "cp": ["It is filled with cell sap (a solution of sugars and salts)", "It keeps the cell firm (rigid)"], "dp": ["It is filled with cytoplasm and ribosomes", "It controls the activities of the cell", "It is where photosynthesis happens"], "mand": 0}, {"id": "BIO-01-015", "t": 1, "s": "4.1.1.2", "k": "Compare", "m": 3, "ht": false, "q": "Name <b>three<\/b> parts found in plant cells but <b>not<\/b> in animal cells.", "a": ["<b>Chloroplasts<\/b> (1)", "<b>Permanent vacuole<\/b> (1)", "<b>Cellulose cell wall<\/b> (1)"], "cp": ["Chloroplasts", "Permanent vacuole", "Cellulose cell wall"], "dp": ["Mitochondria", "Ribosomes", "Cell membrane"], "mand": 0}, {"id": "BIO-01-016", "t": 1, "s": "4.1.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>sperm cell<\/b> is adapted for its job.", "a": ["Any three (1 each):", "• <b>tail<\/b> to swim to the egg", "• lots of <b>mitochondria<\/b> to release energy for swimming", "• <b>acrosome<\/b> holds enzymes to break into the egg", "• nucleus carries the father's <b>genetic information<\/b>"], "cp": ["tail to swim to the egg", "lots of mitochondria to release energy for swimming", "acrosome holds enzymes to break into the egg", "nucleus carries the father's genetic information"], "dp": ["a long insulating sheath to speed up impulses", "hollow tube with no end walls", "a large food store to feed the embryo"], "mand": 0}, {"id": "BIO-01-017", "t": 1, "s": "4.1.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>nerve cell<\/b> is adapted to carry electrical impulses.", "a": ["Any three (1 each):", "• very <b>long<\/b>, so it carries impulses a long way", "• <b>branched ends<\/b> connect to lots of other nerve cells", "• <b>insulating sheath<\/b> speeds up the impulse", "• lots of <b>mitochondria<\/b> to release energy"], "cp": ["very long, so it carries impulses a long way", "branched ends connect to lots of other nerve cells", "insulating sheath speeds up the impulse", "lots of mitochondria to release energy"], "dp": ["contains protein fibres that can contract", "a tail to swim to the egg", "a very large, round shape to store nutrients"], "mand": 0}, {"id": "BIO-01-018", "t": 1, "s": "4.1.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain how a <b>muscle cell<\/b> is adapted for its job.", "a": ["Contains protein fibres that can <b>contract<\/b> (shorten) (1)", "Lots of <b>mitochondria<\/b> to release energy for contraction (1)"], "cp": ["Contains protein fibres that can contract (shorten)", "Lots of mitochondria to release energy for contraction"], "dp": ["Has an insulating sheath to speed up impulses", "Has a long tail so it can swim", "Lots of chloroplasts to absorb light for energy"], "mand": 0}, {"id": "BIO-01-019", "t": 1, "s": "4.1.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain how a <b>root hair cell<\/b> is adapted for its job.", "a": ["Long, thin 'hair' gives a <b>large surface area<\/b> (1)", "so it can absorb <b>water and mineral ions<\/b> quickly (1)"], "cp": ["Long, thin 'hair' gives a large surface area", "so it can absorb water and mineral ions quickly"], "dp": ["Has many chloroplasts for photosynthesis", "so it can carry impulses a long way", "Contains protein fibres that can contract"], "mand": 0}, {"id": "BIO-01-020", "t": 1, "s": "4.1.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>xylem<\/b> cells are adapted to carry water.", "a": ["Hollow tubes with <b>no end walls<\/b> (1)", "so water flows through easily (1)", "Walls strengthened with <b>lignin<\/b> (1)"], "cp": ["Hollow tubes with no end walls", "so water flows through easily", "Walls strengthened with lignin"], "dp": ["Pores in the end walls", "Living cells with a nucleus and lots of cytoplasm", "so dissolved sugar flows through easily"], "mand": 0}, {"id": "BIO-01-021", "t": 1, "s": "4.1.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>phloem<\/b> cells are adapted to carry sugar.", "a": ["<b>Pores<\/b> in the end walls (1)", "so dissolved sugars can move from cell to cell (1)"], "cp": ["Pores in the end walls", "so dissolved sugars can move from cell to cell"], "dp": ["Hollow tubes with no end walls", "so water flows through easily", "Walls strengthened with lignin"], "mand": 0}, {"id": "BIO-01-022", "t": 1, "s": "4.1.1.4", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>differentiation<\/b>?", "a": ["The process by which a cell becomes <b>specialised<\/b> for a job (1)", "It gains the <b>sub-cellular structures<\/b> it needs (1)"], "cp": ["The process by which a cell becomes specialised for a job", "It gains the sub-cellular structures it needs"], "dp": ["The process by which a cell divides to make two identical cells", "The process by which water moves into a cell", "It loses its nucleus and all its genes"], "mand": 0}, {"id": "BIO-01-023", "t": 1, "s": "4.1.1.4", "k": "Explain", "m": 2, "ht": false, "q": "Why is differentiation important in a multicellular organism?", "a": ["Cells can do a <b>specific job<\/b> (1)", "so they form tissues and organs that work <b>efficiently<\/b> (1)"], "cp": ["Cells can do a specific job", "so they form tissues and organs that work efficiently"], "dp": ["All cells can do every job equally well", "so they all stay identical to one another", "so cells no longer need energy from respiration"], "mand": 0}, {"id": "BIO-01-024", "t": 1, "s": "4.1.1.4", "k": "Compare", "m": 2, "ht": false, "q": "Compare <b>when<\/b> animal cells and plant cells can differentiate.", "a": ["Most animal cells differentiate <b>early<\/b> in development (1)", "Many plant cells can differentiate <b>throughout life<\/b> (1)"], "cp": ["Most animal cells differentiate early in development", "Many plant cells can differentiate throughout life"], "dp": ["Most plant cells differentiate early in development", "Most animal cells can differentiate throughout life", "Plant cells cannot differentiate at all"], "mand": 0}, {"id": "BIO-01-025", "t": 1, "s": "4.1.1.4", "k": "Recall", "m": 2, "ht": false, "q": "Why do cells divide in a <b>mature<\/b> (adult) animal?", "a": ["For <b>repair<\/b> of damaged tissue (1)", "For <b>replacement<\/b> of old cells (1)"], "cp": ["For repair of damaged tissue", "For replacement of old cells"], "dp": ["To make the animal grow taller", "To turn specialised cells into stem cells", "To get rid of waste carbon dioxide"], "mand": 0}, {"id": "BIO-01-026", "t": 1, "s": "4.1.1.5", "k": "Recall", "m": 1, "ht": false, "q": "Write the <b>magnification<\/b> equation.", "a": ["magnification = <b>image size ÷ real size<\/b> (1)", "So: real size = image size ÷ magnification", "And: image size = real size × magnification"], "cp": ["magnification = image size ÷ real size"], "dp": ["magnification = real size ÷ image size", "magnification = image size × real size", "magnification = image size − real size"], "mand": 0}, {"id": "BIO-01-027", "t": 1, "s": "4.1.1.5", "k": "Calculation", "m": 3, "ht": false, "q": "A cell is 7.5 cm wide in a photograph. The magnification is ×3000.<br/><br/>Calculate the real width in <b>millimetres<\/b>. Give your answer in <b>standard form<\/b>.", "a": ["7.5 cm = 75 mm (1)", "Real size = 75 ÷ 3000 = 0.025 mm (1)", "<b>2.5 × 10<sup>-2<\/sup> mm<\/b> (1)", "<i>Convert units first.<\/i>"], "cp": ["7.5 cm = 75 mm", "Real size = 75 ÷ 3000 = 0.025 mm", "2.5 × 10<sup>-2<\/sup> mm"], "dp": ["7.5 cm = 750 mm", "Real size = 75 × 3000 = 225 000 mm", "2.5 × 10<sup>-3<\/sup> mm"], "mand": 0}, {"id": "BIO-01-028", "t": 1, "s": "4.1.1.5", "k": "Calculation", "m": 3, "ht": false, "q": "A cell is 0.05 mm long. In a drawing it is 40 mm long.<br/><br/>Work out the <b>magnification<\/b>.", "a": ["magnification = image size ÷ real size (1)", "40 ÷ 0.05 (1)", "= <b>×800<\/b> (1)"], "cp": ["magnification = image size ÷ real size", "40 ÷ 0.05", "= ×800"], "dp": ["magnification = real size ÷ image size", "0.05 ÷ 40", "= ×80"], "mand": 0}, {"id": "BIO-01-029", "t": 1, "s": "4.1.1.5", "k": "Calculation", "m": 2, "ht": false, "q": "A mitochondrion is 2 µm long. A student views it at ×5000.<br/><br/>How long is the <b>image<\/b> in mm?", "a": ["2 × 5000 = 10 000 µm (1)", "10 000 ÷ 1000 = <b>10 mm<\/b> (1)"], "cp": ["2 × 5000 = 10 000 µm", "10 000 ÷ 1000 = 10 mm"], "dp": ["2 ÷ 5000 = 0.0004 µm", "10 000 × 1000 = 10 000 000 mm", "10 000 ÷ 10 = 1000 mm"], "mand": 0}, {"id": "BIO-01-030", "t": 1, "s": "4.1.1.5", "k": "Definition", "m": 1, "ht": false, "q": "What is <b>resolving power<\/b> (resolution)?", "a": ["The ability to see two points that are close together as <b>separate<\/b> points (1)"], "cp": ["The ability to see two points that are close together as separate points"], "dp": ["How many times bigger an image is than the real object", "The ability to see very small objects in colour", "How bright the image is when viewed"], "mand": 0}, {"id": "BIO-01-031", "t": 1, "s": "4.1.1.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>electron microscopes<\/b> have helped us understand sub-cellular structures.", "a": ["They have a higher <b>magnification<\/b> (1)", "and a higher <b>resolving power<\/b> (1)", "so very small structures (e.g. <b>ribosomes<\/b>, the inside of mitochondria) can be seen in detail (1)"], "cp": ["They have a higher magnification", "and a higher resolving power", "so very small structures (e.g. ribosomes, the inside of mitochondria) can be seen in detail"], "dp": ["They are cheaper and easier to use than light microscopes", "They can only be used to see living cells", "They have a lower magnification"], "mand": 0}, {"id": "BIO-01-032", "t": 1, "s": "4.1.1.5", "k": "Practical", "m": 4, "ht": false, "q": "<b>Required practical 1.<\/b> Describe how to prepare a slide of onion cells to view under a light microscope.", "a": ["Peel a thin layer of <b>onion skin<\/b> with forceps (1)", "Place it on a slide with a drop of <b>water or stain<\/b> (e.g. iodine) (1)", "Lower a <b>cover slip<\/b> at an angle to avoid air bubbles (1)", "Start with the <b>lowest power<\/b> lens and focus, then increase (1)"], "cp": ["Peel a thin layer of onion skin with forceps", "Place it on a slide with a drop of water or stain (e.g. iodine)", "Lower a cover slip at an angle to avoid air bubbles", "Start with the lowest power lens and focus, then increase"], "dp": ["Cut a thick slice of onion with a scalpel and place it straight on the slide", "Drop the cover slip flat onto the slide quickly", "Start with the highest power lens and focus"], "mand": 0}, {"id": "BIO-01-033", "t": 1, "s": "4.1.1.5", "k": "Practical", "m": 3, "ht": false, "q": "<b>Required practical 1.<\/b> Give <b>three<\/b> rules for a good biological drawing.", "a": ["Any three (1 each):", "• sharp pencil, clear <b>continuous lines<\/b>, no shading", "• draw large, filling most of the space", "• label with <b>ruled lines<\/b> that do not cross", "• include the <b>magnification<\/b> or a scale", "• give the drawing a <b>title<\/b>"], "cp": ["sharp pencil, clear continuous lines, no shading", "draw large, filling most of the space", "label with ruled lines that do not cross", "include the magnification or a scale", "give the drawing a title"], "dp": ["use coloured pens and shade to show detail", "draw it as small as possible", "label with lines that cross over each other"], "mand": 0}, {"id": "BIO-01-034", "t": 1, "s": "4.1.1.6", "k": "Recall", "m": 2, "ht": false, "q": "How do bacteria reproduce? How fast can they do this?", "a": ["By <b>binary fission<\/b> (one cell splits into two) (1)", "As often as every <b>20 minutes<\/b> if warm with enough nutrients (1)"], "cp": ["By binary fission (one cell splits into two)", "As often as every 20 minutes if warm with enough nutrients"], "dp": ["By making gametes that fuse together", "Only once every few days, even in warm conditions", "By mitosis, when the nucleus divides first"], "mand": 0}, {"id": "BIO-01-035", "t": 1, "s": "4.1.1.6", "k": "Calculation", "m": 2, "ht": false, "q": "One bacterium divides every 20 minutes.<br/><br/>How many bacteria will there be after 2 hours?", "a": ["2 hours = 120 minutes, so 120 ÷ 20 = <b>6 divisions<\/b> (1)", "2<sup>6<\/sup> = <b>64<\/b> bacteria (1)"], "cp": ["2 hours = 120 minutes, so 120 ÷ 20 = 6 divisions", "2<sup>6<\/sup> = 64 bacteria"], "dp": ["2 hours = 200 minutes, so 200 ÷ 20 = 10 divisions", "6 × 2 = 12 bacteria", "6<sup>2<\/sup> = 36 bacteria"], "mand": 0}, {"id": "BIO-01-036", "t": 1, "s": "4.1.1.6", "k": "Explain", "m": 2, "ht": false, "q": "<b>Aseptic technique.<\/b> Why are Petri dishes and agar sterilised before use?", "a": ["To <b>kill<\/b> any unwanted microorganisms (1)", "so they do not <b>contaminate<\/b> the culture (only the bacteria you want grow) (1)"], "cp": ["To kill any unwanted microorganisms", "so they do not contaminate the culture (only the bacteria you want grow)"], "dp": ["To give the bacteria extra nutrients", "so the agar sets firmly", "To keep the bacteria at the correct temperature"], "mand": 0}, {"id": "BIO-01-037", "t": 1, "s": "4.1.1.6", "k": "Explain", "m": 2, "ht": false, "q": "Why is the inoculating loop passed through a <b>flame<\/b> before it touches bacteria?", "a": ["To <b>sterilise<\/b> it (1)", "It kills any microorganisms already on the loop, so the culture stays <b>uncontaminated<\/b> (1)"], "cp": ["To sterilise it", "It kills any microorganisms already on the loop, so the culture stays uncontaminated"], "dp": ["To warm the loop so the bacteria grow faster", "To cool the agar so it sets", "To remove oxygen from the dish"], "mand": 0}, {"id": "BIO-01-038", "t": 1, "s": "4.1.1.6", "k": "Explain", "m": 2, "ht": false, "q": "After inoculating, how should the Petri dish lid be fixed and the dish stored? Why?", "a": ["Lid <b>taped<\/b> on, to stop microorganisms getting in or out (1)", "Stored <b>upside down<\/b>, so condensation does not drip onto the culture (1)"], "cp": ["Lid taped on, to stop microorganisms getting in or out", "Stored upside down, so condensation does not drip onto the culture"], "dp": ["Lid left off so the bacteria get enough oxygen", "Stored the right way up, so the agar does not fall out", "Stored at 37°C, so the bacteria grow quickly"], "mand": 0}, {"id": "BIO-01-039", "t": 1, "s": "4.1.1.6", "k": "Explain", "m": 1, "ht": false, "q": "Why are cultures in schools kept at <b>25°C or lower<\/b>?", "a": ["A higher temperature could grow <b>harmful bacteria<\/b> that can cause disease in humans (1)"], "cp": ["A higher temperature could grow harmful bacteria that can cause disease in humans"], "dp": ["Bacteria grow too slowly at higher temperatures to be seen", "Agar melts at temperatures above 25°C", "Higher temperatures stop the bacteria respiring"], "mand": 0}, {"id": "BIO-01-040", "t": 1, "s": "4.1.1.6", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 2.<\/b> What is a <b>clear zone<\/b> on an agar plate with antibiotic discs?", "a": ["An area around the disc where bacteria have been <b>killed<\/b> or cannot grow (1)", "The bigger the clear zone, the <b>more effective<\/b> the antibiotic or antiseptic (1)"], "cp": ["An area around the disc where bacteria have been killed or cannot grow", "The bigger the clear zone, the more effective the antibiotic or antiseptic"], "dp": ["An area where the bacteria have grown the most", "The smaller the clear zone, the more effective the antibiotic", "An area where the agar has dried out"], "mand": 0}, {"id": "BIO-01-041", "t": 1, "s": "4.1.1.6", "k": "Data", "m": 2, "ht": false, "q": "The clear zone around antiseptic A is 12 mm wide. Around antiseptic B it is 20 mm wide.<br/><br/>Which is more effective? Explain.", "a": ["<b>B<\/b> (1)", "It has the <b>bigger clear zone<\/b>, so it killed more bacteria (1)"], "cp": ["B", "It has the bigger clear zone, so it killed more bacteria"], "dp": ["A", "It has the smaller clear zone, so it killed more bacteria", "They are equally effective, because both have clear zones"], "mand": 0}, {"id": "BIO-01-042", "t": 1, "s": "4.1.1.6", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 2.<\/b> Why is a disc with <b>no<\/b> antiseptic included on the plate?", "a": ["It is a <b>control<\/b> (1)", "It shows the bacteria were not killed by the disc itself (1)"], "cp": ["It is a control", "It shows the bacteria were not killed by the disc itself"], "dp": ["It is the dependent variable", "It makes sure the bacteria grow faster", "It shows the antiseptic works in every case"], "mand": 0}, {"id": "BIO-01-043", "t": 1, "s": "4.1.1.6", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 2.<\/b> Give <b>two<\/b> variables to keep the same.", "a": ["Any two (1 each):", "• same <b>type of bacteria<\/b>", "• same <b>size of disc<\/b> and amount of antiseptic", "• same type and depth of <b>agar<\/b>", "• same <b>temperature<\/b> and incubation time"], "cp": ["same type of bacteria", "same size of disc and amount of antiseptic", "same type and depth of agar", "same temperature and incubation time"], "dp": ["different types of bacteria on each plate", "incubate each plate at a different temperature", "use a different depth of agar for each plate"], "mand": 0}, {"id": "BIO-01-044", "t": 1, "s": "4.1.1.6", "k": "Calculation", "m": 2, "ht": false, "q": "A clear zone has a radius of 1.5 cm.<br/><br/>Calculate its area. Use area = πr² and π = 3.14.", "a": ["r² = 1.5 × 1.5 = 2.25 (1)", "3.14 × 2.25 = <b>7.1 cm<sup>2<\/sup><\/b> (to 2 s.f.) (1)"], "cp": ["r² = 1.5 × 1.5 = 2.25", "3.14 × 2.25 = 7.1 cm<sup>2<\/sup> (to 2 s.f.)"], "dp": ["r² = 1.5 × 2 = 3", "3.14 × 3 = 9.4 cm<sup>2<\/sup>", "3.14 × 1.5 = 4.7 cm<sup>2<\/sup>"], "mand": 0}, {"id": "BIO-01-045", "t": 1, "s": "4.1.2.1", "k": "Recall", "m": 3, "ht": false, "q": "What is a <b>chromosome<\/b>? How many are in a human body cell?", "a": ["A long molecule of <b>DNA<\/b> (1)", "that carries many <b>genes<\/b> (1)", "Human body cells have <b>46<\/b> (23 pairs) (1)"], "cp": ["A long molecule of DNA", "that carries many genes", "Human body cells have 46 (23 pairs)"], "dp": ["A short section of DNA that codes for one protein", "Human body cells have 23 chromosomes", "A small ring of DNA found in bacteria"], "mand": 0}, {"id": "BIO-01-046", "t": 1, "s": "4.1.2.2", "k": "Process", "m": 2, "ht": false, "q": "What happens in a cell <b>before<\/b> mitosis?", "a": ["The cell <b>grows<\/b> and makes more sub-cellular structures (e.g. ribosomes, mitochondria) (1)", "The <b>DNA is copied<\/b> (replicated) (1)"], "cp": ["The cell grows and makes more sub-cellular structures (e.g. ribosomes, mitochondria)", "The DNA is copied (replicated)"], "dp": ["The nucleus divides into two", "The cell membrane pinches in to form two cells", "The chromosomes are pulled to opposite ends of the cell"], "mand": 0}, {"id": "BIO-01-047", "t": 1, "s": "4.1.2.2", "k": "Process", "m": 3, "ht": false, "q": "What happens <b>during<\/b> mitosis?", "a": ["One full set of <b>chromosomes<\/b> is pulled to each end of the cell (1)", "The <b>nucleus<\/b> divides (1)", "Then the cytoplasm and membranes divide to make <b>two identical cells<\/b> (1)"], "cp": ["One full set of chromosomes is pulled to each end of the cell", "The nucleus divides", "Then the cytoplasm and membranes divide to make two identical cells"], "dp": ["The cell divides to make four genetically different cells", "Pairs of chromosomes are halved so each cell gets 23", "The DNA is copied again at the end"], "mand": 0}, {"id": "BIO-01-048", "t": 1, "s": "4.1.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> reasons why mitosis is important.", "a": ["<b>Growth<\/b> and development of multicellular organisms (1)", "<b>Repair<\/b> and replacement of damaged or old cells (1)"], "cp": ["Growth and development of multicellular organisms", "Repair and replacement of damaged or old cells"], "dp": ["Making gametes for sexual reproduction", "Mixing genes to make variation", "Making cells with half the number of chromosomes"], "mand": 0}, {"id": "BIO-01-049", "t": 1, "s": "4.1.2.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>stem cell<\/b>?", "a": ["An <b>undifferentiated<\/b> cell (1)", "that can divide to make many more cells and <b>differentiate<\/b> into different cell types (1)"], "cp": ["An undifferentiated cell", "that can divide to make many more cells and differentiate into different cell types"], "dp": ["A specialised cell with a fixed job", "that cannot divide again", "that can only make copies of itself and never change type"], "mand": 0}, {"id": "BIO-01-050", "t": 1, "s": "4.1.2.3", "k": "Recall", "m": 3, "ht": false, "q": "Where are stem cells found in <b>embryos<\/b>, <b>adults<\/b> and <b>plants<\/b>?", "a": ["Embryos: <b>embryonic stem cells<\/b> can become most cell types (1)", "Adults: e.g. <b>bone marrow<\/b>, can form many cell types such as blood cells (1)", "Plants: <b>meristems<\/b> can become any plant cell type (1)"], "cp": ["Embryos: embryonic stem cells can become most cell types", "Adults: e.g. bone marrow, can form many cell types such as blood cells", "Plants: meristems can become any plant cell type"], "dp": ["Embryos: stem cells can only become nerve cells", "Adults: e.g. the skin surface, which can form any cell type in the body", "Plants: root hairs can become any plant cell type"], "mand": 0}, {"id": "BIO-01-051", "t": 1, "s": "4.1.2.3", "k": "Explain", "m": 2, "ht": false, "q": "What is <b>therapeutic cloning<\/b> and why is it useful?", "a": ["An embryo is made with the <b>patient's own genes<\/b> (1)", "so the stem cells are <b>less likely to be rejected<\/b> by the patient's immune system (1)"], "cp": ["An embryo is made with the patient's own genes", "so the stem cells are less likely to be rejected by the patient's immune system"], "dp": ["An embryo is made using genes from a donor", "so the stem cells will be rejected by the patient's immune system", "so the treatment needs no embryo"], "mand": 0}, {"id": "BIO-01-052", "t": 1, "s": "4.1.2.3", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>one<\/b> benefit and <b>two<\/b> concerns of using embryonic stem cells in medicine.", "a": ["Benefit: could treat conditions such as <b>diabetes<\/b> or <b>paralysis<\/b> (1)", "Concern 1: risk of transferring a <b>virus<\/b> to the patient (1)", "Concern 2: <b>ethical or religious<\/b> objections to using embryos (1)"], "cp": ["Benefit: could treat conditions such as diabetes or paralysis", "Concern 1: risk of transferring a virus to the patient", "Concern 2: ethical or religious objections to using embryos"], "dp": ["Benefit: stem cells are already specialised so they work straight away", "Concern 1: they can only become one cell type", "Concern 2: they cannot divide, so too few cells are made"], "mand": 0}, {"id": "BIO-01-053", "t": 1, "s": "4.1.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two<\/b> uses of plant <b>meristem<\/b> cells in cloning.", "a": ["Any two (1 each):", "• <b>protect rare plant species<\/b>", "• grow plants <b>quickly<\/b>", "• mass-produce crops with useful features (e.g. <b>disease resistance<\/b>)"], "cp": ["protect rare plant species", "grow plants quickly", "mass-produce crops with useful features (e.g. disease resistance)"], "dp": ["make the plants grow without sunlight", "replace damaged nerve cells in people", "produce plants with exactly half the genes"], "mand": 0}, {"id": "BIO-01-054", "t": 1, "s": "4.1.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>diffusion<\/b>?", "a": ["The <b>net movement<\/b> of particles (1)", "from a <b>higher<\/b> concentration to a <b>lower<\/b> concentration (1)"], "cp": ["The net movement of particles", "from a higher concentration to a lower concentration"], "dp": ["from a lower concentration to a higher concentration", "of water through a partially permeable membrane", "that needs energy from respiration"], "mand": 0}, {"id": "BIO-01-055", "t": 1, "s": "4.1.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> factors that affect the rate of diffusion.", "a": ["Concentration gradient: <b>steeper<\/b> = faster (1)", "<b>Temperature<\/b>: higher = faster (1)", "Surface area of the membrane: <b>larger<\/b> = faster (1)"], "cp": ["Concentration gradient: steeper = faster", "Temperature: higher = faster", "Surface area of the membrane: larger = faster"], "dp": ["Thickness of the membrane: thicker = faster", "Size of the organism: larger = faster", "Light intensity: brighter = faster"], "mand": 0}, {"id": "BIO-01-056", "t": 1, "s": "4.1.3.1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> examples of substances that move by diffusion in the body.", "a": ["<b>Oxygen<\/b> and <b>carbon dioxide<\/b> in gas exchange (1)", "<b>Urea<\/b> from cells into the blood plasma (1)"], "cp": ["Oxygen and carbon dioxide in gas exchange", "Urea from cells into the blood plasma"], "dp": ["Mineral ions into root hair cells", "Sugar from the gut into the blood, when the gut has less sugar than the blood", "Large proteins through the cell membrane"], "mand": 0}, {"id": "BIO-01-057", "t": 1, "s": "4.1.3.1", "k": "Calculation", "m": 3, "ht": false, "q": "A cube has sides of 2 cm.<br/><br/>Work out its surface area : volume ratio.", "a": ["Surface area = 6 × 2 × 2 = <b>24 cm<sup>2<\/sup><\/b> (1)", "Volume = 2 × 2 × 2 = <b>8 cm<sup>3<\/sup><\/b> (1)", "Ratio = 24 : 8 = <b>3 : 1<\/b> (1)"], "cp": ["Surface area = 6 × 2 × 2 = 24 cm<sup>2<\/sup>", "Volume = 2 × 2 × 2 = 8 cm<sup>3<\/sup>", "Ratio = 24 : 8 = 3 : 1"], "dp": ["Surface area = 2 × 2 × 2 = 8 cm<sup>2<\/sup>", "Volume = 6 × 2 × 2 = 24 cm<sup>3<\/sup>", "Ratio = 8 : 24 = 1 : 3"], "mand": 0}, {"id": "BIO-01-058", "t": 1, "s": "4.1.3.1", "k": "Explain", "m": 2, "ht": false, "q": "Why do large multicellular organisms need <b>exchange surfaces<\/b> and a <b>transport system<\/b>?", "a": ["They have a <b>small<\/b> surface area to volume ratio (1)", "so diffusion alone is too slow to supply all the cells (1)"], "cp": ["They have a small surface area to volume ratio", "so diffusion alone is too slow to supply all the cells"], "dp": ["They have a large surface area to volume ratio", "so diffusion is too fast to control", "so they have no need for oxygen"], "mand": 0}, {"id": "BIO-01-059", "t": 1, "s": "4.1.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> features of an effective exchange surface.", "a": ["Any three (1 each):", "• <b>large surface area<\/b>", "• <b>thin<\/b> membrane (short diffusion distance)", "• good <b>blood supply<\/b> (animals)", "• <b>ventilation<\/b> (e.g. lungs, gills)"], "cp": ["large surface area", "thin membrane (short diffusion distance)", "good blood supply (animals)", "ventilation (e.g. lungs, gills)"], "dp": ["thick membrane to protect it", "poor blood supply to stop it drying out", "small surface area"], "mand": 0}, {"id": "BIO-01-060", "t": 1, "s": "4.1.3.2", "k": "Definition", "m": 3, "ht": false, "q": "What is <b>osmosis<\/b>?", "a": ["The movement (diffusion) of <b>water<\/b> (1)", "from a <b>dilute<\/b> solution to a <b>concentrated<\/b> solution (1)", "through a <b>partially permeable membrane<\/b> (1)"], "cp": ["The movement (diffusion) of water", "from a dilute solution to a concentrated solution", "through a partially permeable membrane"], "dp": ["from a concentrated solution to a dilute solution", "of any dissolved particles", "that needs energy from respiration"], "mand": 0}, {"id": "BIO-01-061", "t": 1, "s": "4.1.3.2", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says: 'Osmosis is the movement of sugar into a cell.'<br/><br/>What is wrong with this?", "a": ["Osmosis is the movement of <b>water<\/b> only (1)", "Sugar moves by <b>diffusion<\/b> or <b>active transport<\/b> (1)"], "cp": ["Osmosis is the movement of water only", "Sugar moves by diffusion or active transport"], "dp": ["Osmosis can move any dissolved substance", "Sugar always moves by osmosis", "Osmosis only happens in animal cells"], "mand": 0}, {"id": "BIO-01-062", "t": 1, "s": "4.1.3.2", "k": "Explain", "m": 2, "ht": false, "q": "A potato chip is put in <b>pure water<\/b>. Explain why its mass goes up.", "a": ["<b>Water<\/b> moves into the chip by <b>osmosis<\/b> (1)", "from the dilute solution outside to the more concentrated cell contents (1)"], "cp": ["Water moves into the chip by osmosis", "from the dilute solution outside to the more concentrated cell contents"], "dp": ["Sugar moves into the chip by osmosis", "from the concentrated solution outside to the dilute cell contents", "Water moves into the chip by active transport"], "mand": 0}, {"id": "BIO-01-063", "t": 1, "s": "4.1.3.2", "k": "Explain", "m": 3, "ht": false, "q": "A potato chip is left in a <b>concentrated<\/b> sugar solution. Its mass goes down.<br/><br/>Explain why.", "a": ["Water leaves the chip by <b>osmosis<\/b> (1)", "The solution outside is more <b>concentrated<\/b> than the cell contents (1)", "Water moves from <b>dilute to concentrated<\/b> through the <b>partially permeable membrane<\/b> (1)"], "cp": ["Water leaves the chip by osmosis", "The solution outside is more concentrated than the cell contents", "Water moves from dilute to concentrated through the partially permeable membrane"], "dp": ["Sugar leaves the chip by osmosis", "The solution outside is more dilute than the cell contents", "Water moves from concentrated to dilute through the membrane"], "mand": 0}, {"id": "BIO-01-064", "t": 1, "s": "4.1.3.2", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical 3.<\/b> Describe how to investigate the effect of salt solution concentration on the mass of potato tissue.", "a": ["Cut chips of the <b>same size<\/b> and measure each <b>mass<\/b> (1)", "Put in <b>different concentrations<\/b>, same volume and time, same temperature (1)", "<b>Blot dry<\/b>, then reweigh (1)", "Calculate <b>percentage change in mass<\/b> (1)", "<b>Repeat<\/b> and calculate a mean (1)"], "cp": ["Cut chips of the same size and measure each mass", "Put in different concentrations, same volume and time, same temperature", "Blot dry, then reweigh", "Calculate percentage change in mass", "Repeat and calculate a mean"], "dp": ["Use chips of different sizes so the results can be compared", "Leave the chips in each solution for different lengths of time", "Weigh the chips only at the start"], "mand": 0}, {"id": "BIO-01-065", "t": 1, "s": "4.1.3.2", "k": "Practical", "m": 1, "ht": false, "q": "<b>Required practical 3.<\/b> Why must the chips be <b>blotted dry<\/b> before they are weighed?", "a": ["To remove <b>surface water<\/b>, so the mass is accurate (1)"], "cp": ["To remove surface water, so the mass is accurate"], "dp": ["To stop the chip absorbing more water", "To kill any bacteria on the chip", "To make the chip lighter"], "mand": 0}, {"id": "BIO-01-066", "t": 1, "s": "4.1.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "A chip starts at 5.0 g and ends at 5.6 g.<br/><br/>Calculate the <b>percentage change<\/b> in mass.", "a": ["Change = 5.6 − 5.0 = 0.6 g (1)", "0.6 ÷ 5.0 (1)", "× 100 = <b>12% increase<\/b> (1)"], "cp": ["Change = 5.6 − 5.0 = 0.6 g", "0.6 ÷ 5.0", "× 100 = 12% increase"], "dp": ["Change = 5.6 + 5.0 = 10.6 g", "0.6 ÷ 5.6", "× 100 = 12% decrease"], "mand": 0}, {"id": "BIO-01-067", "t": 1, "s": "4.1.3.2", "k": "Data", "m": 2, "ht": false, "q": "On a graph of % change in mass against concentration, the line crosses zero.<br/><br/>What does this show?", "a": ["<b>No net movement<\/b> of water (1)", "The concentration inside the potato is the <b>same<\/b> as the solution outside (1)"], "cp": ["No net movement of water", "The concentration inside the potato is the same as the solution outside"], "dp": ["The potato has gained the most mass", "The solution is more concentrated than the potato", "The potato cells have burst"], "mand": 0}, {"id": "BIO-01-068", "t": 1, "s": "4.1.3.3", "k": "Definition", "m": 3, "ht": false, "q": "What is <b>active transport<\/b>?", "a": ["Movement of substances from a <b>dilute<\/b> to a <b>concentrated<\/b> solution (1)", "(against the concentration gradient) (1)", "It needs <b>energy<\/b> from <b>respiration<\/b> (1)"], "cp": ["Movement of substances from a dilute to a concentrated solution", "(against the concentration gradient)", "It needs energy from respiration"], "dp": ["Movement of substances from a concentrated to a dilute solution", "(down the concentration gradient)", "It needs no energy"], "mand": 0}, {"id": "BIO-01-069", "t": 1, "s": "4.1.3.3", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> examples of active transport.", "a": ["<b>Mineral ions<\/b> into root hair cells (1)", "<b>Sugar<\/b> from the gut into the blood (1)"], "cp": ["Mineral ions into root hair cells", "Sugar from the gut into the blood"], "dp": ["Oxygen from the alveoli into the blood", "Carbon dioxide out of the blood into the lungs", "Water into the potato chip"], "mand": 0}, {"id": "BIO-01-070", "t": 1, "s": "4.1.3.3", "k": "Explain", "m": 2, "ht": false, "q": "Why do root hair cells use <b>active transport<\/b> to take up mineral ions?", "a": ["Mineral ions are at a <b>lower concentration<\/b> in the soil than in the root cell (1)", "so they must move <b>against<\/b> the gradient, using energy from respiration (1)"], "cp": ["Mineral ions are at a lower concentration in the soil than in the root cell", "so they must move against the gradient, using energy from respiration"], "dp": ["Mineral ions are at a higher concentration in the soil than in the root cell", "so they move down the gradient without using energy", "so they move through the cell by osmosis"], "mand": 0}, {"id": "BIO-01-071", "t": 1, "s": "4.1.3.3", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>diffusion<\/b>, <b>osmosis<\/b> and <b>active transport<\/b>.", "a": ["<b>Diffusion:<\/b> particles, high to low concentration, <b>no energy<\/b> (1)", "<b>Osmosis:<\/b> only <b>water<\/b>, through a partially permeable membrane, no energy (1)", "<b>Active transport:<\/b> low to high concentration, <b>needs energy<\/b> (1)"], "cp": ["Diffusion: particles, high to low concentration, no energy", "Osmosis: only water, through a partially permeable membrane, no energy", "Active transport: low to high concentration, needs energy"], "dp": ["Diffusion: only water, low to high concentration, needs energy", "Osmosis: any particles, high to low concentration, needs energy", "Active transport: high to low concentration, no energy"], "mand": 0}, {"id": "BIO-01-H01", "t": 1, "s": "4.1.1.6", "k": "Calculation", "m": 3, "ht": true, "q": "One bacterium divides every 20 minutes.<br/><br/>How many bacteria after 10 hours? Give your answer in <b>standard form<\/b> (2 significant figures).", "a": ["10 hours = 600 minutes, 600 ÷ 20 = <b>30 divisions<\/b> (1)", "2<sup>30<\/sup> = 1 073 741 824 (1)", "<b>1.1 × 10<sup>9<\/sup><\/b> (1)"], "cp": ["10 hours = 600 minutes, 600 ÷ 20 = 30 divisions", "2<sup>30<\/sup> = 1 073 741 824", "1.1 × 10<sup>9<\/sup>"], "dp": ["10 hours = 100 minutes, 100 ÷ 20 = 5 divisions", "30<sup>2<\/sup> = 900", "1.1 × 10<sup>8<\/sup>"], "mand": 0}, {"id": "BIO-02-001", "t": 2, "s": "4.2.1", "k": "Recall", "m": 1, "ht": false, "q": "Put these in order, smallest to largest:<br/>organ, cell, organism, tissue, organ system", "a": ["<b>cell → tissue → organ → organ system → organism<\/b> (1)"], "cp": ["cell → tissue → organ → organ system → organism"], "dp": ["cell → organ → tissue → organ system → organism", "tissue → cell → organ → organism → organ system", "cell → tissue → organ system → organ → organism"], "mand": 0}, {"id": "BIO-02-002", "t": 2, "s": "4.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>tissue<\/b>?", "a": ["A group of <b>cells<\/b> (1)", "with a <b>similar structure and function<\/b> (1)", "<i>Trap: 'a group of cells' alone does not get both marks.<\/i>"], "cp": ["A group of cells", "with a similar structure and function"], "dp": ["A group of different organs", "with different structures and functions", "A group of organs working together"], "mand": 0}, {"id": "BIO-02-003", "t": 2, "s": "4.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>organ<\/b>? Give an example.", "a": ["A group of different <b>tissues<\/b> working together to do a particular job (1)", "Example: <b>stomach<\/b>, heart, lung (1)"], "cp": ["A group of different tissues working together to do a particular job", "Example: stomach, heart, lung"], "dp": ["A group of identical cells doing the same job", "Example: blood, muscle, xylem", "A group of organ systems that make an organism"], "mand": 0}, {"id": "BIO-02-004", "t": 2, "s": "4.2.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>enzyme<\/b>?", "a": ["A <b>biological catalyst<\/b> (1)", "that speeds up a reaction and is <b>not used up<\/b> (1)"], "cp": ["A biological catalyst", "that speeds up a reaction and is not used up"], "dp": ["A hormone that controls reactions", "that slows down a reaction", "that is used up in the reaction"], "mand": 0}, {"id": "BIO-02-005", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Explain why an enzyme only works on <b>one<\/b> substrate. Use the lock and key model.", "a": ["The substrate fits the <b>active site<\/b> of the enzyme, like a key in a lock (1)", "The active site has a <b>specific shape<\/b>, so only that substrate fits (1)"], "cp": ["The substrate fits the active site of the enzyme, like a key in a lock", "The active site has a specific shape, so only that substrate fits"], "dp": ["The substrate has the same shape as the whole enzyme", "The enzyme changes shape to fit any substrate", "Any substrate with enough energy fits the active site"], "mand": 0}, {"id": "BIO-02-006", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Explain why an enzyme stops working if it gets too <b>hot<\/b>.", "a": ["The <b>active site changes shape<\/b> (1)", "The substrate no longer fits. The enzyme is <b>denatured<\/b> (1)"], "cp": ["The active site changes shape", "The substrate no longer fits. The enzyme is denatured"], "dp": ["The enzyme is used up by the heat", "The substrate melts", "The enzyme becomes inactive but returns to normal when cooled"], "mand": 0}, {"id": "BIO-02-007", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Why does enzyme activity <b>increase<\/b> as the temperature rises towards the optimum?", "a": ["Particles move <b>faster<\/b> (have more energy) (1)", "so there are more <b>collisions<\/b> between enzyme and substrate (1)"], "cp": ["Particles move faster (have more energy)", "so there are more collisions between enzyme and substrate"], "dp": ["Particles move more slowly", "so there are fewer collisions between enzyme and substrate", "so the enzyme is denatured"], "mand": 0}, {"id": "BIO-02-008", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "An enzyme works best at pH 7. Explain why it stops working at pH 2.", "a": ["The wrong pH changes the shape of the <b>active site<\/b> (1)", "The enzyme is <b>denatured<\/b>, so the substrate no longer fits (1)"], "cp": ["The wrong pH changes the shape of the active site", "The enzyme is denatured, so the substrate no longer fits"], "dp": ["The acid is digested by the enzyme", "The enzyme is killed by the acid", "The substrate is used up by the acid"], "mand": 0}, {"id": "BIO-02-009", "t": 2, "s": "4.2.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Amylase: where is it made, what does it break down and what does it make?", "a": ["Made in the <b>salivary glands<\/b>, <b>pancreas<\/b> and <b>small intestine<\/b> (1)", "Breaks down <b>starch<\/b> (a carbohydrate) (1)", "into <b>simple sugars<\/b> (1)"], "cp": ["Made in the salivary glands, pancreas and small intestine", "Breaks down starch (a carbohydrate)", "into simple sugars"], "dp": ["Made in the stomach, liver and gall bladder", "Breaks down proteins", "into amino acids"], "mand": 0}, {"id": "BIO-02-010", "t": 2, "s": "4.2.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Protease: where is it made, what does it break down and what does it make?", "a": ["Made in the <b>stomach<\/b>, <b>pancreas<\/b> and <b>small intestine<\/b> (1)", "Breaks down <b>proteins<\/b> (1)", "into <b>amino acids<\/b> (1)"], "cp": ["Made in the stomach, pancreas and small intestine", "Breaks down proteins", "into amino acids"], "dp": ["Made in the salivary glands, liver and gall bladder", "Breaks down starch", "into glycerol and fatty acids"], "mand": 0}, {"id": "BIO-02-011", "t": 2, "s": "4.2.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Lipase: where is it made, what does it break down and what does it make?", "a": ["Made in the <b>pancreas<\/b> and <b>small intestine<\/b> (1)", "Breaks down <b>lipids<\/b> (fats and oils) (1)", "into <b>glycerol<\/b> and <b>fatty acids<\/b> (1)"], "cp": ["Made in the pancreas and small intestine", "Breaks down lipids (fats and oils)", "into glycerol and fatty acids"], "dp": ["Made in the salivary glands, stomach and liver", "Breaks down proteins (such as meat and eggs)", "into simple sugars"], "mand": 0}, {"id": "BIO-02-012", "t": 2, "s": "4.2.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Bile: where is it <b>made<\/b>, where is it <b>stored<\/b>, and what are its <b>two jobs<\/b>?", "a": ["Made in the <b>liver<\/b>, stored in the <b>gall bladder<\/b> (1)", "<b>Neutralises<\/b> stomach acid, so enzymes in the small intestine work best (1)", "<b>Emulsifies<\/b> fat into small droplets (1)"], "cp": ["Made in the liver, stored in the gall bladder", "Neutralises stomach acid, so enzymes in the small intestine work best", "Emulsifies fat into small droplets"], "dp": ["Made in the pancreas, stored in the stomach", "Makes the stomach contents more acidic", "Breaks fat down into glycerol and fatty acids"], "mand": 0}, {"id": "BIO-02-013", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Explain why bile makes fat digestion <b>faster<\/b>.", "a": ["It <b>emulsifies<\/b> fat, breaking big drops into small droplets (1)", "This gives a <b>larger surface area<\/b> for lipase to work on (1)"], "cp": ["It emulsifies fat, breaking big drops into small droplets", "This gives a larger surface area for lipase to work on"], "dp": ["It breaks fat down into fatty acids and glycerol", "This gives a smaller surface area for lipase", "This warms the lipase so it works faster"], "mand": 0}, {"id": "BIO-02-014", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Stomach protease works best at <b>pH 2<\/b>. Small intestine enzymes work best at a higher pH.<br/><br/>How does the body deal with this?", "a": ["Stomach contents are <b>acidic<\/b> (1)", "<b>Bile<\/b> neutralises the acid, making the small intestine alkaline (1)"], "cp": ["Stomach contents are acidic", "Bile neutralises the acid, making the small intestine alkaline"], "dp": ["Stomach contents are alkaline", "Bile makes the small intestine more acidic", "Amylase neutralises the acid"], "mand": 0}, {"id": "BIO-02-015", "t": 2, "s": "4.2.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What happens to the <b>products of digestion<\/b>?", "a": ["Used to build new <b>carbohydrates, lipids and proteins<\/b> (1)", "Some <b>glucose<\/b> is used in <b>respiration<\/b> (1)"], "cp": ["Used to build new carbohydrates, lipids and proteins", "Some glucose is used in respiration"], "dp": ["All of them are burned for energy straight away", "They are all lost in urine", "They are turned back into the original food"], "mand": 0}, {"id": "BIO-02-016", "t": 2, "s": "4.2.2.1", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 4.<\/b> How do you test for <b>sugar<\/b>? What is a positive result?", "a": ["Add <b>Benedict's solution<\/b> and heat in a water bath (1)", "<b>Blue → green, yellow, orange or brick red<\/b> (1)"], "cp": ["Add Benedict's solution and heat in a water bath", "Blue → green, yellow, orange or brick red"], "dp": ["Add iodine solution", "Blue → purple (lilac)", "Orange-brown → blue-black"], "mand": 0}, {"id": "BIO-02-017", "t": 2, "s": "4.2.2.1", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 4.<\/b> How do you test for <b>starch<\/b>? What is a positive result?", "a": ["Add <b>iodine solution<\/b> (1)", "<b>Orange-brown → blue-black<\/b> (1)"], "cp": ["Add iodine solution", "Orange-brown → blue-black"], "dp": ["Add Benedict's solution and heat in a water bath", "Blue → brick red", "Blue → purple (lilac)"], "mand": 0}, {"id": "BIO-02-018", "t": 2, "s": "4.2.2.1", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 4.<\/b> How do you test for <b>protein<\/b>? What is a positive result?", "a": ["Add <b>Biuret reagent<\/b> (1)", "<b>Blue → purple (lilac)<\/b> (1)"], "cp": ["Add Biuret reagent", "Blue → purple (lilac)"], "dp": ["Add iodine solution", "Orange-brown → blue-black", "A red layer forms on top of the mixture"], "mand": 0}, {"id": "BIO-02-019", "t": 2, "s": "4.2.2.1", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 4.<\/b> How do you test for <b>lipids<\/b>? What is a positive result?", "a": ["Add <b>Sudan III<\/b> stain solution (1)", "A <b>red layer<\/b> forms on top of the mixture (1)"], "cp": ["Add Sudan III stain solution", "A red layer forms on top of the mixture"], "dp": ["Add Biuret reagent", "A purple colour appears", "Blue → brick red"], "mand": 0}, {"id": "BIO-02-020", "t": 2, "s": "4.2.2.1", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical 5.<\/b> Describe how to investigate the effect of <b>pH<\/b> on the rate of amylase.", "a": ["Mix <b>amylase<\/b>, <b>starch<\/b> and a <b>buffer<\/b> (one pH) in a water bath (1)", "Every 30 s, add a drop to <b>iodine<\/b> on a spotting tile (1)", "Record the <b>time<\/b> until iodine stays orange-brown (1)", "<b>Repeat<\/b> with buffers of different pH (1)", "Keep <b>volumes, concentrations and temperature<\/b> the same (1)"], "cp": ["Mix amylase, starch and a buffer (one pH) in a water bath", "Every 30 s, add a drop to iodine on a spotting tile", "Record the time until iodine stays orange-brown", "Repeat with buffers of different pH", "Keep volumes, concentrations and temperature the same"], "dp": ["Mix amylase and starch at different temperatures instead", "Add the drops to Benedict's solution on the spotting tile", "Use a different volume of starch each time"], "mand": 0}, {"id": "BIO-02-021", "t": 2, "s": "4.2.2.1", "k": "Practical", "m": 2, "ht": false, "q": "<b>Required practical 5.<\/b> In this test, what do the iodine colours tell you?", "a": ["<b>Blue-black:<\/b> starch is still there (1)", "<b>Orange-brown:<\/b> the starch has been broken down by amylase (1)"], "cp": ["Blue-black: starch is still there", "Orange-brown: the starch has been broken down by amylase"], "dp": ["Blue-black: all the starch has been broken down", "Orange-brown: starch is still there", "Blue-black: sugar is present"], "mand": 0}, {"id": "BIO-02-022", "t": 2, "s": "4.2.2.1", "k": "Calculation", "m": 3, "ht": false, "q": "Starch takes 50 s to disappear at pH 7 and 100 s at pH 4.<br/><br/>Calculate the rate (1 ÷ time) for each. Compare them.", "a": ["pH 7: 1 ÷ 50 = <b>0.02 /s<\/b> (1)", "pH 4: 1 ÷ 100 = <b>0.01 /s<\/b> (1)", "The rate at pH 7 is <b>twice as fast<\/b> (1)"], "cp": ["pH 7: 1 ÷ 50 = 0.02 /s", "pH 4: 1 ÷ 100 = 0.01 /s", "The rate at pH 7 is twice as fast"], "dp": ["pH 7: 50 ÷ 1 = 50 /s", "pH 4: 1 ÷ 100 = 0.1 /s", "The rate at pH 4 is twice as fast"], "mand": 0}, {"id": "BIO-02-023", "t": 2, "s": "4.2.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Why is the human circulatory system called a <b>double<\/b> circulatory system?", "a": ["Blood goes through the heart <b>twice<\/b> on each full circuit (1)", "One loop to the <b>lungs<\/b>, one loop to the <b>body<\/b> (1)"], "cp": ["Blood goes through the heart twice on each full circuit", "One loop to the lungs, one loop to the body"], "dp": ["Blood goes through the heart once on each full circuit", "One loop to the brain, one loop to the gut", "There are two separate hearts, one on each side of the chest"], "mand": 0}, {"id": "BIO-02-024", "t": 2, "s": "4.2.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Where does the <b>right ventricle<\/b> pump blood to? And the <b>left ventricle<\/b>?", "a": ["Right ventricle: to the <b>lungs<\/b> (1)", "Left ventricle: to the whole <b>body<\/b> (1)"], "cp": ["Right ventricle: to the lungs", "Left ventricle: to the whole body"], "dp": ["Right ventricle: to the whole body", "Left ventricle: to the lungs", "Right ventricle: to the left atrium"], "mand": 0}, {"id": "BIO-02-025", "t": 2, "s": "4.2.2.2", "k": "Process", "m": 4, "ht": false, "q": "Describe the path of blood from the <b>vena cava<\/b> to the <b>aorta<\/b>.", "a": ["Vena cava → <b>right atrium<\/b> → <b>right ventricle<\/b> (1)", "<b>Pulmonary artery<\/b> → lungs (1)", "<b>Pulmonary vein<\/b> → <b>left atrium<\/b> (1)", "<b>Left ventricle<\/b> → <b>aorta<\/b> (1)"], "cp": ["Vena cava → right atrium → right ventricle", "Pulmonary artery → lungs", "Pulmonary vein → left atrium", "Left ventricle → aorta"], "dp": ["Vena cava → left atrium → left ventricle", "Aorta → lungs", "Pulmonary vein → right atrium"], "mand": 0}, {"id": "BIO-02-026", "t": 2, "s": "4.2.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Why is the wall of the <b>left ventricle<\/b> thicker than the right?", "a": ["The left ventricle pumps blood around the <b>whole body<\/b> (1)", "so it needs a <b>higher pressure<\/b> than the right ventricle (to the lungs) (1)"], "cp": ["The left ventricle pumps blood around the whole body", "so it needs a higher pressure than the right ventricle (to the lungs)"], "dp": ["The left ventricle pumps blood only to the lungs", "so it needs a lower pressure than the right ventricle", "so it can store more blood"], "mand": 0}, {"id": "BIO-02-027", "t": 2, "s": "4.2.2.2", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>pacemaker<\/b>? Where is it? What if it fails?", "a": ["A group of cells in the <b>right atrium<\/b> (1)", "that controls the <b>resting heart rate<\/b> (1)", "An <b>artificial pacemaker<\/b> can correct an irregular heartbeat (1)"], "cp": ["A group of cells in the right atrium", "that controls the resting heart rate", "An artificial pacemaker can correct an irregular heartbeat"], "dp": ["A group of cells in the left ventricle", "that controls blood pressure", "An artificial pacemaker can replace the whole heart"], "mand": 0}, {"id": "BIO-02-028", "t": 2, "s": "4.2.2.2", "k": "Recall", "m": 1, "ht": false, "q": "What do the <b>coronary arteries<\/b> do?", "a": ["They supply the <b>heart muscle<\/b> itself with blood and oxygen (1)", "<i>Trap: they do not take blood to the lungs or body.<\/i>"], "cp": ["They supply the heart muscle itself with blood and oxygen"], "dp": ["They take blood from the heart to the lungs", "They take blood from the heart to the body", "They carry blood back to the heart from the body"], "mand": 0}, {"id": "BIO-02-029", "t": 2, "s": "4.2.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how an <b>artery<\/b> is adapted to its job.", "a": ["Carries blood <b>away from the heart<\/b> at high pressure (1)", "<b>Thick, muscular<\/b> and elastic walls (1)", "<b>Narrow<\/b> lumen (1)"], "cp": ["Carries blood away from the heart at high pressure", "Thick, muscular and elastic walls", "Narrow lumen"], "dp": ["Carries blood to the heart at low pressure", "Thin walls and a wide lumen", "Valves stop the blood flowing backwards"], "mand": 0}, {"id": "BIO-02-030", "t": 2, "s": "4.2.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>vein<\/b> is adapted to its job.", "a": ["Carries blood <b>to the heart<\/b> at low pressure (1)", "<b>Thinner<\/b> walls and a <b>wide<\/b> lumen (1)", "<b>Valves<\/b> stop the blood flowing backwards (1)"], "cp": ["Carries blood to the heart at low pressure", "Thinner walls and a wide lumen", "Valves stop the blood flowing backwards"], "dp": ["Carries blood away from the heart at high pressure", "Thick, muscular, elastic walls and a narrow lumen", "Walls only one cell thick"], "mand": 0}, {"id": "BIO-02-031", "t": 2, "s": "4.2.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how a <b>capillary<\/b> is adapted to its job.", "a": ["Walls are only <b>one cell thick<\/b> (1)", "so substances can <b>diffuse<\/b> quickly between blood and cells (1)"], "cp": ["Walls are only one cell thick", "so substances can diffuse quickly between blood and cells"], "dp": ["Walls are several cells thick", "so blood can be pumped back to the heart", "Has valves to stop the blood flowing backwards"], "mand": 0}, {"id": "BIO-02-032", "t": 2, "s": "4.2.2.2", "k": "Exam trap", "m": 2, "ht": false, "q": "Which blood vessels carry <b>oxygenated<\/b> blood, and which carry <b>deoxygenated<\/b> blood?<br/>(aorta, vena cava, pulmonary artery, pulmonary vein)", "a": ["<b>Oxygenated:<\/b> aorta and pulmonary vein (1)", "<b>Deoxygenated:<\/b> vena cava and pulmonary artery (1)", "<i>Trap: the pulmonary vein is not like other veins.<\/i>"], "cp": ["Oxygenated: aorta and pulmonary vein", "Deoxygenated: vena cava and pulmonary artery"], "dp": ["Oxygenated: vena cava and pulmonary artery", "Deoxygenated: aorta and pulmonary vein", "Oxygenated: aorta and pulmonary artery"], "mand": 0}, {"id": "BIO-02-033", "t": 2, "s": "4.2.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>alveoli<\/b> are adapted for gas exchange.", "a": ["Any three (1 each):", "• lots of alveoli give a <b>large surface area<\/b>", "• walls are <b>one cell thin<\/b> (short diffusion distance)", "• rich <b>blood supply<\/b> of capillaries", "• <b>ventilation<\/b> keeps the concentration gradient steep"], "cp": ["lots of alveoli give a large surface area", "walls are one cell thin (short diffusion distance)", "rich blood supply of capillaries", "ventilation keeps the concentration gradient steep"], "dp": ["thick walls to protect them", "very few alveoli, to save energy", "no blood supply, so the oxygen stays in the lungs"], "mand": 0}, {"id": "BIO-02-034", "t": 2, "s": "4.2.2.2", "k": "Explain", "m": 2, "ht": false, "q": "How does oxygen get from the air in the <b>alveoli<\/b> into the <b>blood<\/b>?", "a": ["By <b>diffusion<\/b> (1)", "from a <b>high<\/b> concentration of oxygen in the alveoli to a <b>low<\/b> concentration in the blood (1)"], "cp": ["By diffusion", "from a high concentration of oxygen in the alveoli to a low concentration in the blood"], "dp": ["By osmosis", "from a low concentration of oxygen in the alveoli to a high concentration in the blood", "By active transport"], "mand": 0}, {"id": "BIO-02-035", "t": 2, "s": "4.2.2.2", "k": "Calculation", "m": 2, "ht": false, "q": "Blood flow rate = volume ÷ time.<br/><br/>A vessel carries 450 cm<sup>3<\/sup> of blood in 3 minutes. Calculate the rate.", "a": ["450 ÷ 3 (1)", "= <b>150 cm<sup>3<\/sup> per minute<\/b> (1)"], "cp": ["450 ÷ 3", "= 150 cm<sup>3<\/sup> per minute"], "dp": ["450 × 3", "= 1350 cm<sup>3<\/sup> per minute", "= 15 cm<sup>3<\/sup> per minute"], "mand": 0}, {"id": "BIO-02-036", "t": 2, "s"
