ook blurred; light focuses behind the retina", "The eyeball is too short, or the lens is too weak", "Corrected with a convex lens or laser surgery"], "dp": ["Distant objects look blurred; light focuses in front of the retina", "The eyeball is too long, or the lens is too strong", "Corrected with a concave lens"], "mand": 0}, {"id": "BIO-05-022", "t": 5, "s": "4.5.2.4", "k": "Recall", "m": 2, "ht": false, "q": "How does the body <b>detect<\/b> a change in temperature?", "a": ["The <b>thermoregulatory centre<\/b> in the brain monitors blood temperature (1)", "<b>Skin receptors<\/b> send impulses to it (1)"], "cp": ["The thermoregulatory centre in the brain monitors blood temperature", "Skin receptors send impulses to it"], "dp": ["The pancreas monitors blood temperature", "Skin receptors release hormones into the blood", "Temperature receptors are in the muscles only"], "mand": 0}, {"id": "BIO-05-023", "t": 5, "s": "4.5.2.4", "k": "Process", "m": 3, "ht": false, "q": "Describe <b>two<\/b> ways the body cools down when it is too <b>hot<\/b>.", "a": ["Blood vessels near the skin <b>widen<\/b> (vasodilation) (1)", "so more heat is <b>transferred from the skin<\/b> to the surroundings (1)", "<b>Sweat<\/b> is produced, and evaporation cools the skin (1)"], "cp": ["Blood vessels near the skin widen (vasodilation)", "so more heat is transferred from the skin to the surroundings", "Sweat is produced, and evaporation cools the skin"], "dp": ["Blood vessels near the skin narrow", "so less heat is transferred to the surroundings", "Sweat stops being produced"], "mand": 0}, {"id": "BIO-05-024", "t": 5, "s": "4.5.2.4", "k": "Process", "m": 3, "ht": false, "q": "Describe how the body warms up when it is too <b>cold<\/b>.", "a": ["Blood vessels near the skin <b>narrow<\/b> (vasoconstriction) (1)", "<b>Sweating stops<\/b> (1)", "<b>Shivering<\/b>: muscles contract, releasing heat (1)"], "cp": ["Blood vessels near the skin narrow (vasoconstriction)", "Sweating stops", "Shivering: muscles contract, releasing heat"], "dp": ["Blood vessels near the skin widen", "Sweating starts", "Shivering: muscles relax, releasing heat"], "mand": 0}, {"id": "BIO-05-025", "t": 5, "s": "4.5.2.4", "k": "Exam trap", "m": 1, "ht": false, "q": "A student says: 'When we are hot, blood vessels move closer to the skin.'<br/><br/>What is wrong?", "a": ["Blood vessels do not move. They <b>widen<\/b> (vasodilate) so more blood flows near the skin surface (1)"], "cp": ["Blood vessels do not move. They widen (vasodilate) so more blood flows near the skin surface"], "dp": ["Blood vessels do move closer to the skin", "They narrow so more blood flows near the skin surface", "Blood vessels grow new branches"], "mand": 0}, {"id": "BIO-05-026", "t": 5, "s": "4.5.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>hormone<\/b>?", "a": ["A <b>chemical messenger<\/b> made by an endocrine gland (1)", "carried in the <b>blood<\/b> to a target organ (1)"], "cp": ["A chemical messenger made by an endocrine gland", "carried in the blood to a target organ"], "dp": ["An electrical signal sent by a neurone", "carried along nerves to a target organ", "An enzyme made in the gut"], "mand": 0}, {"id": "BIO-05-027", "t": 5, "s": "4.5.3.1", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>hormone<\/b> made by each:<br/>a) pancreas<br/>b) ovary<br/>c) testes<br/>d) the pituitary gland (name one)", "a": ["a) <b>insulin<\/b> (1)", "b) <b>oestrogen<\/b> (1)", "c) <b>testosterone<\/b> (1)", "d) <b>FSH<\/b> or <b>LH<\/b> (or ADH) (1)", "<i>Trap: name the hormone, not the gland.<\/i>"], "cp": ["a) insulin", "b) oestrogen", "c) testosterone", "d) FSH or LH (or ADH)"], "dp": ["a) testosterone", "b) insulin", "c) progesterone"], "mand": 0}, {"id": "BIO-05-028", "t": 5, "s": "4.5.3.1", "k": "Recall", "m": 1, "ht": false, "q": "Why is the <b>pituitary gland<\/b> called the 'master gland'?", "a": ["It makes hormones that <b>stimulate other glands<\/b> to release hormones (1)"], "cp": ["It makes hormones that stimulate other glands to release hormones"], "dp": ["It makes all the body's enzymes", "It controls the heart rate directly", "It is the largest gland in the body"], "mand": 0}, {"id": "BIO-05-029", "t": 5, "s": "4.5.3.2", "k": "Process", "m": 3, "ht": false, "q": "Explain how the body brings blood glucose down <b>after a meal<\/b>.", "a": ["The <b>pancreas<\/b> detects the rise and releases <b>insulin<\/b> (1)", "Insulin makes cells take up <b>glucose<\/b> from the blood (1)", "The <b>liver and muscles<\/b> store excess glucose as <b>glycogen<\/b> (1)"], "cp": ["The pancreas detects the rise and releases insulin", "Insulin makes cells take up glucose from the blood", "The liver and muscles store excess glucose as glycogen"], "dp": ["The pancreas detects the rise and releases glucagon", "Insulin makes the liver release glucose", "Excess glucose is stored as starch"], "mand": 0}, {"id": "BIO-05-030", "t": 5, "s": "4.5.3.2", "k": "Explain", "m": 3, "ht": false, "q": "A person with Type 1 diabetes injects insulin after a meal.<br/><br/>Explain why.", "a": ["The meal raises blood <b>glucose<\/b> (1)", "Their pancreas does <b>not make enough insulin<\/b> (1)", "Insulin allows glucose to move from the blood <b>into cells<\/b>, lowering blood glucose (1)"], "cp": ["The meal raises blood glucose", "Their pancreas does not make enough insulin", "Insulin allows glucose to move from the blood into cells, lowering blood glucose"], "dp": ["Their pancreas makes too much insulin", "Insulin makes the liver release more glucose", "Insulin turns glucose into glycogen in the blood"], "mand": 0}, {"id": "BIO-05-031", "t": 5, "s": "4.5.3.2", "k": "Compare", "m": 4, "ht": false, "q": "Compare <b>Type 1<\/b> and <b>Type 2<\/b> diabetes. Give the cause and a treatment for each.", "a": ["<b>Type 1:<\/b> the pancreas does not make enough <b>insulin<\/b> (1). Treated with <b>insulin injections<\/b> (1)", "<b>Type 2:<\/b> body cells <b>no longer respond<\/b> to insulin (1). Treated with a <b>carbohydrate-controlled diet and exercise<\/b> (1)"], "cp": ["Type 1: the pancreas does not make enough insulin", "Treated with insulin injections", "Type 2: body cells no longer respond to insulin", "Treated with a carbohydrate-controlled diet and exercise"], "dp": ["Type 1: body cells no longer respond to insulin", "Type 2: treated with insulin injections only", "Type 1: treated with a carbohydrate-controlled diet only"], "mand": 0}, {"id": "BIO-05-032", "t": 5, "s": "4.5.3.2", "k": "Data", "m": 2, "ht": false, "q": "Blood glucose is measured after a meal in a person <b>with<\/b> and <b>without<\/b> diabetes.<br/><br/>Describe how the two graphs differ.", "a": ["In the person with diabetes, glucose rises <b>higher<\/b> (1)", "and takes <b>longer<\/b> to come back down (1)"], "cp": ["In the person with diabetes, glucose rises higher", "and takes longer to come back down"], "dp": ["In the person with diabetes, glucose rises less", "and comes back down more quickly", "and stays at zero"], "mand": 0}, {"id": "BIO-05-033", "t": 5, "s": "4.5.3.2", "k": "Explain", "m": 2, "ht": false, "q": "What is the link between <b>obesity<\/b> and Type 2 diabetes? How can the risk be reduced?", "a": ["Obesity is a <b>risk factor<\/b> for Type 2 diabetes (1)", "Risk reduced by a <b>healthy diet<\/b> and <b>exercise<\/b> (1)"], "cp": ["Obesity is a risk factor for Type 2 diabetes", "Risk reduced by a healthy diet and exercise"], "dp": ["Obesity prevents Type 2 diabetes", "Risk reduced by eating more sugar", "Obesity causes Type 1 diabetes"], "mand": 0}, {"id": "BIO-05-034", "t": 5, "s": "4.5.3.3", "k": "Explain", "m": 2, "ht": false, "q": "Why must the water content of the body be controlled?", "a": ["Cells that gain or lose too much water by <b>osmosis<\/b> (1)", "do not <b>function efficiently<\/b> (1)"], "cp": ["Cells that gain or lose too much water by osmosis", "do not function efficiently"], "dp": ["Cells that gain or lose too much water by active transport", "work better", "become larger and more efficient"], "mand": 0}, {"id": "BIO-05-035", "t": 5, "s": "4.5.3.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways the body loses water.", "a": ["From the <b>lungs<\/b> when we breathe out (1)", "In <b>sweat<\/b> from the skin (1)", "In <b>urine<\/b> from the kidneys (1)"], "cp": ["From the lungs when we breathe out", "In sweat from the skin", "In urine from the kidneys"], "dp": ["From the stomach as acid", "Through the xylem", "In the blood plasma"], "mand": 0}, {"id": "BIO-05-036", "t": 5, "s": "4.5.3.3", "k": "Recall", "m": 3, "ht": false, "q": "What do the <b>kidneys<\/b> do?", "a": ["<b>Filter<\/b> the blood (1)", "<b>Reabsorb<\/b> useful substances: all the glucose, some ions and water (1)", "Release <b>urea<\/b>, extra water and ions in <b>urine<\/b> (1)"], "cp": ["Filter the blood", "Reabsorb useful substances: all the glucose, some ions and water", "Release urea, extra water and ions in urine"], "dp": ["Release all the glucose in urine", "Reabsorb urea", "Make new blood cells"], "mand": 0}, {"id": "BIO-05-037", "t": 5, "s": "4.5.3.3", "k": "Exam trap", "m": 2, "ht": false, "q": "Which substances are filtered out of the blood in the kidney, and which are <b>all<\/b> reabsorbed?", "a": ["Filtered: <b>glucose, urea, ions and water<\/b> (1)", "<b>All glucose<\/b> is reabsorbed; urea is not (1)", "<i>Trap: proteins are not filtered out.<\/i>"], "cp": ["Filtered: glucose, urea, ions and water", "All glucose is reabsorbed; urea is not"], "dp": ["Filtered: proteins, glucose, urea and water", "All urea is reabsorbed; glucose is not", "No glucose is filtered out"], "mand": 0}, {"id": "BIO-05-038", "t": 5, "s": "4.5.3.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>kidney dialysis<\/b> machine works.", "a": ["Blood flows past a <b>partially permeable membrane<\/b> (1)", "<b>Urea<\/b> and extra ions diffuse into the dialysis fluid (1)", "The fluid has normal glucose and ion levels, so these are <b>kept in the blood<\/b> (1)"], "cp": ["Blood flows past a partially permeable membrane", "Urea and extra ions diffuse into the dialysis fluid", "The fluid has normal glucose and ion levels, so these are kept in the blood"], "dp": ["Blood flows past a solid membrane", "Glucose diffuses out into the dialysis fluid", "The fluid has no glucose or ions in it"], "mand": 0}, {"id": "BIO-05-039", "t": 5, "s": "4.5.3.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Compare <b>dialysis<\/b> with a kidney <b>transplant<\/b>. Give one good point and one drawback for each.", "a": ["Dialysis +: no need to wait for a <b>donor<\/b> (1)", "Dialysis −: regular, long sessions; often 3 times a week (1)", "Transplant +: no more dialysis, a <b>normal life<\/b> (1)", "Transplant −: <b>donor shortage<\/b>, and risk of <b>rejection<\/b> (1)"], "cp": ["Dialysis +: no need to wait for a donor", "Dialysis −: regular, long sessions; often 3 times a week", "Transplant +: no more dialysis, a normal life", "Transplant −: donor shortage, and risk of rejection"], "dp": ["Dialysis +: no risk of infection and no sessions", "Transplant −: needs three sessions a week", "Dialysis −: risk of rejection"], "mand": 0}, {"id": "BIO-05-040", "t": 5, "s": "4.5.3.4", "k": "Recall", "m": 2, "ht": false, "q": "What does <b>testosterone<\/b> do? Where is it made?", "a": ["Made in the <b>testes<\/b> (1)", "Develops male features at puberty and stimulates <b>sperm production<\/b> (1)"], "cp": ["Made in the testes", "Develops male features at puberty and stimulates sperm production"], "dp": ["Made in the ovaries", "Develops female features at puberty", "Made in the pituitary gland"], "mand": 0}, {"id": "BIO-05-041", "t": 5, "s": "4.5.3.4", "k": "Recall", "m": 2, "ht": false, "q": "What does <b>oestrogen<\/b> do? Where is it made?", "a": ["Made in the <b>ovaries<\/b> (1)", "Develops female features at puberty and helps an <b>egg<\/b> to mature and be released about every 28 days (1)"], "cp": ["Made in the ovaries", "Develops female features at puberty and helps an egg to mature and be released about every 28 days"], "dp": ["Made in the testes", "Stimulates sperm production", "Develops male features at puberty"], "mand": 0}, {"id": "BIO-05-042", "t": 5, "s": "4.5.3.4", "k": "Recall", "m": 4, "ht": false, "q": "Give the job of each hormone in the <b>menstrual cycle<\/b>:<br/>FSH, LH, oestrogen, progesterone.", "a": ["<b>FSH:<\/b> makes an egg mature (1)", "<b>LH:<\/b> triggers the release of the egg (ovulation) (1)", "<b>Oestrogen:<\/b> builds the lining of the uterus (1)", "<b>Progesterone:<\/b> maintains the lining of the uterus (1)"], "cp": ["FSH: makes an egg mature", "LH: triggers the release of the egg (ovulation)", "Oestrogen: builds the lining of the uterus", "Progesterone: maintains the lining of the uterus"], "dp": ["FSH: triggers ovulation", "LH: makes an egg mature", "Oestrogen: breaks down the uterus lining"], "mand": 0}, {"id": "BIO-05-043", "t": 5, "s": "4.5.3.5", "k": "Explain", "m": 2, "ht": false, "q": "How do <b>hormonal<\/b> contraceptives work?", "a": ["The <b>pill<\/b> contains hormones that stop <b>FSH<\/b> being released, so no egg matures (1)", "<b>Implants, injections and patches<\/b> release <b>progesterone<\/b> slowly, stopping eggs maturing or being released (1)"], "cp": ["The pill contains hormones that stop FSH being released, so no egg matures", "Implants, injections and patches release progesterone slowly, stopping eggs maturing or being released"], "dp": ["The pill contains hormones that make more FSH", "Implants release sperm-killing chemicals", "Patches stop eggs being fertilised by blocking the oviduct"], "mand": 0}, {"id": "BIO-05-044", "t": 5, "s": "4.5.3.5", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> non-hormonal methods of contraception.", "a": ["Any three (1 each):", "• <b>condoms<\/b> and diaphragms (barrier methods)", "• <b>IUD<\/b> (intrauterine device)", "• <b>spermicides<\/b>", "• <b>abstaining<\/b> from sex when an egg could be in the oviduct", "• <b>sterilisation<\/b> (surgery)"], "cp": ["condoms and diaphragms (barrier methods)", "IUD (intrauterine device)", "spermicides", "abstaining from sex when an egg could be in the oviduct", "sterilisation (surgery)"], "dp": ["the contraceptive pill", "injections of progesterone", "implants that release hormones"], "mand": 0}, {"id": "BIO-05-045", "t": 5, "s": "4.5.3.5", "k": "Evaluate", "m": 2, "ht": false, "q": "Give one advantage of the contraceptive <b>pill<\/b> and one advantage of <b>condoms<\/b>.", "a": ["Pill: very <b>effective<\/b> if taken correctly (1)", "Condoms: also protect against <b>sexually transmitted infections<\/b> (1)"], "cp": ["Pill: very effective if taken correctly", "Condoms: also protect against sexually transmitted infections"], "dp": ["Pill: also protects against sexually transmitted infections", "Condoms: contain hormones that stop eggs maturing", "Pill: has no side effects"], "mand": 0}, {"id": "BIO-05-046", "t": 5, "s": "4.5.3.5", "k": "Explain", "m": 1, "ht": false, "q": "Why can questions about contraception <b>not<\/b> be answered by science alone?", "a": ["There are <b>social, ethical and religious<\/b> issues as well (1)"], "cp": ["There are social, ethical and religious issues as well"], "dp": ["Science can answer every question about contraception", "Contraception is not studied by scientists", "There is no evidence on how well it works"], "mand": 0}, {"id": "BIO-05-047", "t": 5, "s": "4.5.4.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>tropism<\/b>? What controls it in plants?", "a": ["A plant <b>growth response<\/b> to a stimulus such as light or gravity (1)", "Controlled by the plant hormone <b>auxin<\/b> (1)", "<i>Trap: name it a tropism and name auxin.<\/i>"], "cp": ["A plant growth response to a stimulus such as light or gravity", "Controlled by the plant hormone auxin"], "dp": ["A plant growth response controlled by gibberellin", "A movement of water through the plant", "Controlled by the plant hormone ethene"], "mand": 0}, {"id": "BIO-05-048", "t": 5, "s": "4.5.4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a plant shoot grows <b>towards light<\/b> (phototropism).", "a": ["<b>Auxin<\/b> builds up on the <b>shaded<\/b> side (1)", "so cells on the shaded side <b>grow longer<\/b> (elongate) faster (1)", "so the shoot <b>bends towards the light<\/b> (1)"], "cp": ["Auxin builds up on the shaded side", "so cells on the shaded side grow longer (elongate) faster", "so the shoot bends towards the light"], "dp": ["Auxin builds up on the lit side", "so cells on the lit side grow longer faster", "so the shoot bends away from the light"], "mand": 0}, {"id": "BIO-05-049", "t": 5, "s": "4.5.4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a plant <b>root<\/b> grows <b>downwards<\/b> (gravitropism).", "a": ["<b>Auxin<\/b> collects on the <b>lower<\/b> side of the root (1)", "In roots, auxin <b>slows<\/b> cell growth, so the lower side grows <b>less<\/b> (1)", "so the root bends <b>downwards<\/b> (1)"], "cp": ["Auxin collects on the lower side of the root", "In roots, auxin slows cell growth, so the lower side grows less", "so the root bends downwards"], "dp": ["Auxin collects on the upper side of the root", "In roots, auxin speeds up cell growth", "so the root bends upwards"], "mand": 0}, {"id": "BIO-05-050", "t": 5, "s": "4.5.4.1", "k": "Practical", "m": 4, "ht": false, "q": "<b>Required practical 8.<\/b> Describe how to investigate the effect of <b>light<\/b> or <b>gravity<\/b> on the growth of seedlings.", "a": ["Grow seedlings with the stimulus from <b>one direction<\/b> (e.g. a lamp on one side, or boxes turned on their side) (1)", "Keep a <b>control<\/b> set with even light or upright (1)", "<b>Measure<\/b> the length and direction of growth over time (1)", "Keep other conditions the <b>same<\/b> (water, temperature, seedling type) (1)"], "cp": ["Grow seedlings with the stimulus from one direction (e.g. a lamp on one side, or boxes turned on their side)", "Keep a control set with even light or upright", "Measure the length and direction of growth over time", "Keep other conditions the same (water, temperature, seedling type)"], "dp": ["Keep seedlings in different temperatures", "No control set is needed", "Measure only the colour of the seedlings"], "mand": 0}, {"id": "BIO-05-H01", "t": 5, "s": "4.5.2.2", "k": "Explain", "m": 2, "ht": true, "q": "Give <b>two<\/b> reasons why it is hard to investigate and treat the <b>brain<\/b>.", "a": ["Any two (1 each):", "• the brain is very <b>complex<\/b>, with billions of neurones", "• it is delicate and hard to <b>access<\/b> safely", "• <b>surgery<\/b> risks damage", "• brain tissue is hard to <b>repair<\/b>"], "cp": ["the brain is very complex, with billions of neurones", "it is delicate and hard to access safely", "surgery risks damage", "brain tissue is hard to repair"], "dp": ["the brain is simple, with only a few neurones", "it is easy to reach safely", "brain tissue repairs itself quickly"], "mand": 0}, {"id": "BIO-05-H02", "t": 5, "s": "4.5.2.2", "k": "Recall", "m": 3, "ht": true, "q": "Give <b>three<\/b> ways scientists have mapped the functions of the brain.", "a": ["Studying patients with <b>brain damage<\/b> (1)", "<b>Electrically stimulating<\/b> parts of the brain (1)", "<b>MRI scans<\/b> (1)"], "cp": ["Studying patients with brain damage", "Electrically stimulating parts of the brain", "MRI scans"], "dp": ["Weighing the brain after death", "Testing the reflexes of the knee", "Counting the neurones in the spinal cord"], "mand": 0}, {"id": "BIO-05-H03", "t": 5, "s": "4.5.2.4", "k": "Explain", "m": 2, "ht": true, "q": "Explain how <b>sweating<\/b> lowers body temperature.", "a": ["Sweat <b>evaporates<\/b> from the skin (1)", "Evaporation takes <b>energy<\/b> from the skin, so the body cools (1)"], "cp": ["Sweat evaporates from the skin", "Evaporation takes energy from the skin, so the body cools"], "dp": ["Sweat condenses on the skin", "Evaporation gives energy to the skin", "Sweating widens the blood vessels"], "mand": 0}, {"id": "BIO-05-H04", "t": 5, "s": "4.5.2.4", "k": "Explain", "m": 2, "ht": true, "q": "Explain how <b>vasoconstriction<\/b> helps when you are cold.", "a": ["Less blood flows near the skin surface (1)", "so <b>less heat is lost<\/b> to the surroundings (1)"], "cp": ["Less blood flows near the skin surface", "so less heat is lost to the surroundings"], "dp": ["More blood flows near the skin surface", "so more heat is lost", "so sweat is produced"], "mand": 0}, {"id": "BIO-05-H05", "t": 5, "s": "4.5.3.1", "k": "Recall", "m": 2, "ht": true, "q": "Name the hormones made by the <b>thyroid<\/b> and <b>adrenal<\/b> glands.", "a": ["Thyroid: <b>thyroxine<\/b> (1)", "Adrenal glands: <b>adrenaline<\/b> (1)"], "cp": ["Thyroid: thyroxine", "Adrenal glands: adrenaline"], "dp": ["Thyroid: insulin", "Adrenal glands: thyroxine", "Thyroid: adrenaline"], "mand": 0}, {"id": "BIO-05-H06", "t": 5, "s": "4.5.3.2", "k": "Recall", "m": 2, "ht": true, "q": "What happens when blood glucose is <b>too low<\/b>?", "a": ["The pancreas releases <b>glucagon<\/b> (1)", "which makes the liver turn <b>glycogen into glucose<\/b> (1)"], "cp": ["The pancreas releases glucagon", "which makes the liver turn glycogen into glucose"], "dp": ["The pancreas releases insulin", "which makes the liver turn glucose into glycogen", "which makes the cells take in more glucose"], "mand": 0}, {"id": "BIO-05-H07", "t": 5, "s": "4.5.3.2", "k": "Explain", "m": 4, "ht": true, "q": "Explain how <b>insulin<\/b> and <b>glucagon<\/b> control blood glucose by <b>negative feedback<\/b>.", "a": ["Glucose too <b>high<\/b>: pancreas releases <b>insulin<\/b> (1)", "Glucose moves into cells and is stored as <b>glycogen<\/b>, so blood glucose <b>falls<\/b> (1)", "Glucose too <b>low<\/b>: pancreas releases <b>glucagon<\/b>, glycogen is turned to glucose (1)", "Each change <b>reverses<\/b> the original change (negative feedback) (1)"], "cp": ["Glucose too high: pancreas releases insulin", "Glucose moves into cells and is stored as glycogen, so blood glucose falls", "Glucose too low: pancreas releases glucagon, glycogen is turned to glucose", "Each change reverses the original change (negative feedback)"], "dp": ["Glucose too high: pancreas releases glucagon", "Glucose too low: pancreas releases insulin", "Each change adds to the original change (positive feedback)"], "mand": 0}, {"id": "BIO-05-H08", "t": 5, "s": "4.5.3.3", "k": "Process", "m": 2, "ht": true, "q": "What happens to <b>excess amino acids<\/b> in the liver?", "a": ["They are <b>deaminated<\/b> to form <b>ammonia<\/b> (1)", "Ammonia is converted to <b>urea<\/b>, which is safe to excrete (1)"], "cp": ["They are deaminated to form ammonia", "Ammonia is converted to urea, which is safe to excrete"], "dp": ["They are deaminated to form glucose", "Ammonia is converted to protein", "They are stored as amino acids in the kidney"], "mand": 0}, {"id": "BIO-05-H09", "t": 5, "s": "4.5.3.3", "k": "Explain", "m": 4, "ht": true, "q": "Explain how <b>ADH<\/b> controls water balance when the blood is too <b>concentrated<\/b>.", "a": ["The <b>pituitary gland<\/b> releases more <b>ADH<\/b> (1)", "ADH makes the kidney tubules <b>more permeable<\/b> to water (1)", "More water is <b>reabsorbed<\/b> (1)", "Less, more <b>concentrated<\/b> urine is produced (negative feedback) (1)"], "cp": ["The pituitary gland releases more ADH", "ADH makes the kidney tubules more permeable to water", "More water is reabsorbed", "Less, more concentrated urine is produced (negative feedback)"], "dp": ["The pituitary gland releases less ADH", "ADH makes the kidney tubules less permeable to water", "More dilute urine is produced"], "mand": 0}, {"id": "BIO-05-H10", "t": 5, "s": "4.5.3.3", "k": "Explain", "m": 2, "ht": true, "q": "On a hot day, a person sweats a lot. What happens to their <b>urine<\/b>, and why?", "a": ["Urine is <b>smaller in volume<\/b> and <b>more concentrated<\/b> (1)", "Blood is more concentrated, so more <b>ADH<\/b> is released (1)"], "cp": ["Urine is smaller in volume and more concentrated", "Blood is more concentrated, so more ADH is released"], "dp": ["Urine is larger in volume and more dilute", "Blood is more dilute, so less ADH is released", "Urine stays the same because sweat does not affect water"], "mand": 0}, {"id": "BIO-05-H11", "t": 5, "s": "4.5.3.4", "k": "Explain", "m": 4, "ht": true, "q": "Explain how <b>FSH, oestrogen, LH and progesterone<\/b> interact in the menstrual cycle.", "a": ["<b>FSH<\/b> matures an egg and stimulates the ovary to make <b>oestrogen<\/b> (1)", "<b>Oestrogen<\/b> repairs the uterus lining and stimulates a surge of <b>LH<\/b> (1)", "<b>LH<\/b> causes <b>ovulation<\/b> (1)", "<b>Progesterone<\/b> maintains the lining and <b>inhibits<\/b> FSH and LH (1)"], "cp": ["FSH matures an egg and stimulates the ovary to make oestrogen", "Oestrogen repairs the uterus lining and stimulates a surge of LH", "LH causes ovulation", "Progesterone maintains the lining and inhibits FSH and LH"], "dp": ["FSH triggers ovulation", "Oestrogen stimulates a surge of FSH", "Progesterone stimulates FSH and LH"], "mand": 0}, {"id": "BIO-05-H12", "t": 5, "s": "4.5.3.4", "k": "Data", "m": 3, "ht": true, "q": "On a graph of hormones over a 28-day cycle, which hormone is <b>high in the second half<\/b>? Which peaks <b>around day 14<\/b>?", "a": ["<b>Progesterone<\/b> is high in the second half (1)", "<b>LH<\/b> peaks around day 14, causing ovulation (1)", "<b>Oestrogen<\/b> rises and peaks just before the LH peak (1)"], "cp": ["Progesterone is high in the second half", "LH peaks around day 14, causing ovulation", "Oestrogen rises and peaks just before the LH peak"], "dp": ["Progesterone is high in the first half", "FSH peaks around day 14, causing ovulation", "LH is highest in the second half"], "mand": 0}, {"id": "BIO-05-H13", "t": 5, "s": "4.5.3.6", "k": "Process", "m": 4, "ht": true, "q": "Describe how <b>IVF<\/b> works.", "a": ["The woman is given <b>FSH and LH<\/b> to stimulate several eggs to mature (1)", "The eggs are <b>collected<\/b> (1)", "They are <b>fertilised<\/b> with sperm in a laboratory (1)", "One or two early <b>embryos<\/b> are put into the <b>uterus<\/b> (1)"], "cp": ["The woman is given FSH and LH to stimulate several eggs to mature", "The eggs are collected", "They are fertilised with sperm in a laboratory", "One or two early embryos are put into the uterus"], "dp": ["The woman is given progesterone to stop eggs maturing", "The eggs are fertilised inside the oviduct", "Fifty embryos are put into the uterus"], "mand": 0}, {"id": "BIO-05-H14", "t": 5, "s": "4.5.3.6", "k": "Evaluate", "m": 2, "ht": true, "q": "Give <b>two<\/b> drawbacks of fertility treatment such as IVF.", "a": ["Any two (1 each):", "• <b>emotional and physical stress<\/b>", "• <b>low success rates<\/b>", "• risk of <b>multiple births<\/b>"], "cp": ["emotional and physical stress", "low success rates", "risk of multiple births"], "dp": ["it always works first time", "there are no physical risks", "it only ever produces one baby"], "mand": 0}, {"id": "BIO-05-H15", "t": 5, "s": "4.5.3.7", "k": "Recall", "m": 3, "ht": true, "q": "What does <b>adrenaline<\/b> do during fear or stress?", "a": ["Released from the <b>adrenal glands<\/b> (1)", "Makes the <b>heart rate faster<\/b> (1)", "to deliver more <b>oxygen and glucose<\/b> to the brain and muscles ('fight or flight') (1)"], "cp": ["Released from the adrenal glands", "Makes the heart rate faster", "to deliver more oxygen and glucose to the brain and muscles ('fight or flight')"], "dp": ["Released from the thyroid gland", "Makes the heart rate slower", "to deliver more oxygen and glucose to the gut"], "mand": 0}, {"id": "BIO-05-H16", "t": 5, "s": "4.5.3.7", "k": "Recall", "m": 2, "ht": true, "q": "What does <b>thyroxine<\/b> do?", "a": ["Made in the <b>thyroid gland<\/b> (1)", "Increases the <b>metabolic rate<\/b> and is needed for growth and development (1)"], "cp": ["Made in the thyroid gland", "Increases the metabolic rate and is needed for growth and development"], "dp": ["Made in the pituitary gland", "Decreases the metabolic rate", "Controls blood glucose"], "mand": 0}, {"id": "BIO-05-H17", "t": 5, "s": "4.5.3.7", "k": "Explain", "m": 2, "ht": true, "q": "Explain how thyroxine levels are controlled by <b>negative feedback<\/b>.", "a": ["If thyroxine is <b>too high<\/b>, the brain and pituitary release less of the hormone that stimulates it, so thyroxine <b>falls<\/b> (1)", "If it is <b>too low<\/b>, more stimulating hormone is released, so thyroxine <b>rises<\/b> (1)"], "cp": ["If thyroxine is too high, the brain and pituitary release less of the hormone that stimulates it, so thyroxine falls", "If it is too low, more stimulating hormone is released, so thyroxine rises"], "dp": ["If thyroxine is too high, more stimulating hormone is released", "If it is too low, less stimulating hormone is released", "Thyroxine is controlled by insulin"], "mand": 0}, {"id": "BIO-05-H18", "t": 5, "s": "4.5.4.1", "k": "Recall", "m": 2, "ht": true, "q": "What do <b>gibberellins<\/b> and <b>ethene<\/b> do in plants?", "a": ["<b>Gibberellins:<\/b> start <b>seed germination<\/b> (1)", "<b>Ethene:<\/b> controls <b>cell division<\/b> and fruit <b>ripening<\/b> (1)"], "cp": ["Gibberellins: start seed germination", "Ethene: controls cell division and fruit ripening"], "dp": ["Gibberellins: control fruit ripening", "Ethene: starts seed germination", "Ethene: makes shoots grow towards light"], "mand": 0}, {"id": "BIO-05-H19", "t": 5, "s": "4.5.4.2", "k": "Recall", "m": 3, "ht": true, "q": "Give <b>three<\/b> uses of <b>auxins<\/b> in agriculture and horticulture.", "a": ["As <b>weedkillers<\/b> (1)", "In <b>rooting powder<\/b> to make cuttings grow roots (1)", "To promote growth in <b>tissue culture<\/b> (1)"], "cp": ["As weedkillers", "In rooting powder to make cuttings grow roots", "To promote growth in tissue culture"], "dp": ["As fertilisers", "To make fruit ripen in storage", "To end seed dormancy"], "mand": 0}, {"id": "BIO-05-H20", "t": 5, "s": "4.5.4.2", "k": "Recall", "m": 3, "ht": true, "q": "Give uses of <b>ethene<\/b> and <b>gibberellins<\/b> in agriculture.", "a": ["<b>Ethene:<\/b> controls fruit <b>ripening<\/b> during storage and transport (1)", "<b>Gibberellins:<\/b> end seed <b>dormancy<\/b> and promote <b>flowering<\/b> (1)", "and increase <b>fruit size<\/b> (1)"], "cp": ["Ethene: controls fruit ripening during storage and transport", "Gibberellins: end seed dormancy and promote flowering", "and increase fruit size"], "dp": ["Ethene: ends seed dormancy", "Gibberellins: control fruit ripening during storage", "Gibberellins: kill weeds"], "mand": 0}, {"id": "BIO-06-001", "t": 6, "s": "4.6.1.1", "k": "Compare", "m": 4, "ht": false, "q": "Compare <b>sexual<\/b> and <b>asexual<\/b> reproduction.", "a": ["Sexual: <b>two parents<\/b> (1)", "Gametes <b>fuse<\/b> (fertilisation), so offspring show <b>variation<\/b> (1)", "Asexual: <b>one parent<\/b>, only <b>mitosis<\/b> (1)", "Offspring are genetically <b>identical<\/b> (clones) (1)"], "cp": ["Sexual: two parents", "Gametes fuse (fertilisation), so offspring show variation", "Asexual: one parent, only mitosis", "Offspring are genetically identical (clones)"], "dp": ["Sexual: one parent, only mitosis", "Asexual: two parents, gametes fuse", "Asexual offspring show variation"], "mand": 0}, {"id": "BIO-06-002", "t": 6, "s": "4.6.1.2", "k": "Process", "m": 3, "ht": false, "q": "What happens in <b>meiosis<\/b>?", "a": ["It happens in the <b>reproductive organs<\/b> (1)", "The cell divides to make <b>gametes<\/b> with <b>half<\/b> the number of chromosomes (1)", "The gametes are <b>genetically different<\/b> from each other (1)"], "cp": ["It happens in the reproductive organs", "The cell divides to make gametes with half the number of chromosomes", "The gametes are genetically different from each other"], "dp": ["It happens in all body cells", "The cell divides to make two identical body cells", "The gametes are genetically identical"], "mand": 0}, {"id": "BIO-06-003", "t": 6, "s": "4.6.1.2", "k": "Recall", "m": 2, "ht": false, "q": "How many chromosomes are in a human <b>gamete<\/b>? What happens at <b>fertilisation<\/b>?", "a": ["<b>23<\/b> chromosomes (half the normal 46) (1)", "Fertilisation <b>restores<\/b> the full number, 46 (1)"], "cp": ["23 chromosomes (half the normal 46)", "Fertilisation restores the full number, 46"], "dp": ["46 chromosomes", "Fertilisation halves the number to 23", "23 pairs"], "mand": 0}, {"id": "BIO-06-004", "t": 6, "s": "4.6.1.3", "k": "Evaluate", "m": 2, "ht": false, "q": "Give <b>one<\/b> advantage of <b>sexual<\/b> reproduction and <b>one<\/b> advantage of <b>asexual<\/b> reproduction.", "a": ["Sexual: <b>variation<\/b> in offspring, so some may survive a change in the environment (1)", "Asexual: needs only <b>one parent<\/b>; fast, and makes <b>many<\/b> identical offspring (1)"], "cp": ["Sexual: variation in offspring, so some may survive a change in the environment", "Asexual: needs only one parent; fast, and makes many identical offspring"], "dp": ["Sexual: needs only one parent; fast", "Asexual: variation in offspring", "Sexual: offspring are identical clones"], "mand": 0}, {"id": "BIO-06-005", "t": 6, "s": "4.6.1.3", "k": "Recall", "m": 1, "ht": false, "q": "Name <b>one<\/b> organism that can reproduce both sexually and asexually.", "a": ["<b>Malaria parasite<\/b>, many fungi, or many plants (1)"], "cp": ["Malaria parasite, many fungi, or many plants"], "dp": ["Humans", "Most mammals such as dogs", "Birds such as eagles"], "mand": 0}, {"id": "BIO-06-006", "t": 6, "s": "4.6.1.4", "k": "Definition", "m": 3, "ht": false, "q": "What are <b>DNA<\/b>, a <b>gene<\/b> and the <b>genome<\/b>?", "a": ["<b>DNA:<\/b> a polymer in a double helix, found in chromosomes (1)", "<b>Gene:<\/b> a section of DNA that codes for a <b>protein<\/b> (1)", "<b>Genome:<\/b> all the genetic material of an organism (1)"], "cp": ["DNA: a polymer in a double helix, found in chromosomes", "Gene: a section of DNA that codes for a protein", "Genome: all the genetic material of an organism"], "dp": ["DNA: a protein found in ribosomes", "Gene: all the DNA in an organism", "Genome: a section of DNA that codes for one protein"], "mand": 0}, {"id": "BIO-06-007", "t": 6, "s": "4.6.1.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> uses of studying the <b>human genome<\/b>.", "a": ["Finding genes linked to <b>diseases<\/b> (1)", "Understanding and <b>treating inherited disorders<\/b> (1)", "Tracing the <b>migration<\/b> of populations (1)"], "cp": ["Finding genes linked to diseases", "Understanding and treating inherited disorders", "Tracing the migration of populations"], "dp": ["Finding which bacteria cause infections", "Measuring a person's blood pressure", "Predicting the weather"], "mand": 0}, {"id": "BIO-06-008", "t": 6, "s": "4.6.1.5", "k": "Recall", "m": 3, "ht": false, "q": "What is a <b>nucleotide<\/b>? What are its three parts?", "a": ["The repeating unit of DNA (1)", "One <b>sugar<\/b> and one <b>phosphate<\/b> group (1)", "One of <b>four bases<\/b> (A, C, G, T) (1)"], "cp": ["The repeating unit of DNA", "One sugar and one phosphate group", "One of four bases (A, C, G, T)"], "dp": ["The repeating unit of protein", "Three sugar groups and one base", "One of twenty bases"], "mand": 0}, {"id": "BIO-06-009", "t": 6, "s": "4.6.1.5", "k": "Explain", "m": 2, "ht": false, "q": "How does DNA code for a <b>protein<\/b>?", "a": ["A sequence of <b>three bases<\/b> codes for one <b>amino acid<\/b> (1)", "The <b>order of bases<\/b> decides the order of amino acids and so the protein's shape (1)"], "cp": ["A sequence of three bases codes for one amino acid", "The order of bases decides the order of amino acids and so the protein's shape"], "dp": ["A sequence of one base codes for one amino acid", "A sequence of three amino acids codes for one base", "The order of bases decides the colour of the protein"], "mand": 0}, {"id": "BIO-06-010", "t": 6, "s": "4.6.1.6", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between a <b>gene<\/b> and an <b>allele<\/b>?", "a": ["A <b>gene<\/b> codes for a characteristic (1)", "An <b>allele<\/b> is a different version of the same gene (1)"], "cp": ["A gene codes for a characteristic", "An allele is a different version of the same gene"], "dp": ["A gene is a different version of an allele", "An allele is the whole DNA molecule", "A gene is a chromosome"], "mand": 0}, {"id": "BIO-06-011", "t": 6, "s": "4.6.1.6", "k": "Definition", "m": 2, "ht": false, "q": "What do <b>dominant<\/b> and <b>recessive<\/b> mean?", "a": ["<b>Dominant:<\/b> the characteristic shows if <b>one<\/b> copy is present (1)", "<b>Recessive:<\/b> shows only if <b>two<\/b> copies are present (1)", "<i>Trap: dominant does not mean 'stronger'.<\/i>"], "cp": ["Dominant: the characteristic shows if one copy is present", "Recessive: shows only if two copies are present"], "dp": ["Dominant: the characteristic is stronger", "Recessive: shows only if one copy is present", "Dominant: shows only if two copies are present"], "mand": 0}, {"id": "BIO-06-012", "t": 6, "s": "4.6.1.6", "k": "Definition", "m": 2, "ht": false, "q": "What do <b>homozygous<\/b> and <b>heterozygous<\/b> mean?", "a": ["<b>Homozygous:<\/b> two <b>identical<\/b> alleles (e.g. TT or tt) (1)", "<b>Heterozygous:<\/b> two <b>different<\/b> alleles (e.g. Tt) (1)"], "cp": ["Homozygous: two identical alleles (e.g. TT or tt)", "Heterozygous: two different alleles (e.g. Tt)"], "dp": ["Homozygous: two different alleles", "Heterozygous: two identical alleles", "Homozygous: only one allele (e.g. T)"], "mand": 0}, {"id": "BIO-06-013", "t": 6, "s": "4.6.1.6", "k": "Definition", "m": 2, "ht": false, "q": "What do <b>genotype<\/b> and <b>phenotype<\/b> mean?", "a": ["<b>Genotype:<\/b> the alleles a person has (e.g. Tt) (1)", "<b>Phenotype:<\/b> the characteristic that shows (e.g. tall) (1)"], "cp": ["Genotype: the alleles a person has (e.g. Tt)", "Phenotype: the characteristic that shows (e.g. tall)"], "dp": ["Genotype: the characteristic that shows", "Phenotype: the alleles a person has", "Genotype: the chromosomes in a gamete"], "mand": 0}, {"id": "BIO-06-014", "t": 6, "s": "4.6.1.6", "k": "Interpret", "m": 2, "ht": false, "q": "Cystic fibrosis is caused by a <b>recessive<\/b> allele, f.<br/><br/>Two parents are both <b>Ff<\/b>. Their child could be FF, Ff, Ff or ff. Which child has cystic fibrosis, and what is the chance of this?", "a": ["<b>ff<\/b> (1). It is recessive, so the child needs <b>two<\/b> copies", "<b>1 in 4<\/b> (or 25%, or 0.25) (1)"], "cp": ["ff", "1 in 4 (or 25%, or 0.25)"], "dp": ["FF", "1 in 2", "3 in 4"], "mand": 0}, {"id": "BIO-06-015", "t": 6, "s": "4.6.1.6", "k": "Interpret", "m": 2, "ht": false, "q": "Two plants, both <b>Tt<\/b>, are crossed. T = tall (dominant), t = dwarf. The possible offspring are TT, Tt, Tt, tt.<br/><br/>What is the ratio of tall to dwarf?", "a": ["TT, Tt and Tt are <b>tall<\/b>; tt is <b>dwarf<\/b> (1)", "Ratio tall : dwarf = <b>3 : 1<\/b> (1)"], "cp": ["TT, Tt and Tt are tall; tt is dwarf", "Ratio tall : dwarf = 3 : 1"], "dp": ["TT and tt are tall; Tt is dwarf", "Ratio tall : dwarf = 1 : 3", "Ratio tall : dwarf = 1 : 1"], "mand": 0}, {"id": "BIO-06-016", "t": 6, "s": "4.6.1.6", "k": "Interpret", "m": 3, "ht": false, "q": "Two parents <b>without<\/b> a condition have a child <b>with<\/b> it.<br/><br/>Is the allele dominant or recessive? Explain.", "a": ["<b>Recessive<\/b> (1)", "The parents each carry <b>one copy<\/b> but do not show it (heterozygous) (1)", "The child inherited <b>two copies<\/b> (1)"], "cp": ["Recessive", "The parents each carry one copy but do not show it (heterozygous)", "The child inherited two copies"], "dp": ["Dominant", "The parents are both homozygous dominant", "The child inherited one copy"], "mand": 0}, {"id": "BIO-06-017", "t": 6, "s": "4.6.1.6", "k": "Recall", "m": 1, "ht": false, "q": "How are most human characteristics controlled?", "a": ["By <b>many genes<\/b> working together, not just one gene (1)"], "cp": ["By many genes working together, not just one gene"], "dp": ["By a single gene", "By the environment only", "By the colour of the chromosomes"], "mand": 0}, {"id": "BIO-06-018", "t": 6, "s": "4.6.1.7", "k": "Recall", "m": 2, "ht": false, "q": "<b>Polydactyly.<\/b> What is it, and what causes it?", "a": ["Having <b>extra fingers or toes<\/b> (1)", "Caused by a <b>dominant<\/b> allele (1)"], "cp": ["Having extra fingers or toes", "Caused by a dominant allele"], "dp": ["Having missing fingers or toes", "Caused by a recessive allele", "Caused by bacteria"], "mand": 0}, {"id": "BIO-06-019", "t": 6, "s": "4.6.1.7", "k": "Recall", "m": 2, "ht": false, "q": "<b>Cystic fibrosis.<\/b> What is it, and what causes it?", "a": ["A disorder of <b>cell membranes<\/b> (1)", "Caused by a <b>recessive<\/b> allele, so a person needs <b>two copies<\/b> (1)"], "cp": ["A disorder of cell membranes", "Caused by a recessive allele, so a person needs two copies"], "dp": ["A disorder of the nervous system", "Caused by a dominant allele", "Caused by a virus"], "mand": 0}, {"id": "BIO-06-020", "t": 6, "s": "4.6.1.7", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>one<\/b> advantage and <b>two<\/b> concerns of <b>embryo screening<\/b>.", "a": ["Advantage: can avoid babies born with a serious <b>inherited disorder<\/b> (1)", "Concern: it is <b>expensive<\/b> (1)", "Concern: <b>ethical<\/b> issues, as embryos are destroyed or people may choose features (1)"], "cp": ["Advantage: can avoid babies born with a serious inherited disorder", "Concern: it is expensive", "Concern: ethical issues, as embryos are destroyed or people may choose features"], "dp": ["Advantage: guarantees the baby will have no health problems", "Concern: it is cheap and widely available to all", "Concern: it can only detect the baby's sex"], "mand": 0}, {"id": "BIO-06-021", "t": 6, "s": "4.6.1.8", "k": "Recall", "m": 2, "ht": false, "q": "Which chromosomes decide sex in humans?", "a": ["<b>Females XX<\/b> (1)", "<b>Males XY<\/b> (1)"], "cp": ["Females XX", "Males XY"], "dp": ["Females XY", "Males XX", "Males YY"], "mand": 0}, {"id": "BIO-06-022", "t": 6, "s": "4.6.1.8", "k": "Interpret", "m": 2, "ht": false, "q": "A mother has chromosomes XX and a father XY. The possible children are XX, XX, XY and XY.<br/><br/>What is the chance of a <b>girl<\/b>?", "a": ["XX is a girl (1)", "<b>50%<\/b> (1 in 2) (1)"], "cp": ["XX is a girl", "50% (1 in 2)"], "dp": ["XY is a girl", "25%", "75%"], "mand": 0}, {"id": "BIO-06-023", "t": 6, "s": "4.6.2.1", "k": "Recall", "m": 3, "ht": false, "q": "What causes <b>variation<\/b>? Give an example for each cause.", "a": ["<b>Genes<\/b> (inherited): e.g. eye colour (1)", "<b>Environment<\/b>: e.g. scars, accent (1)", "<b>Both<\/b>: e.g. height, weight (1)"], "cp": ["Genes (inherited): e.g. eye colour", "Environment: e.g. scars, accent", "Both: e.g. height, weight"], "dp": ["Genes: scars", "Environment: eye colour", "Both: blood group"], "mand": 0}, {"id": "BIO-06-024", "t": 6, "s": "4.6.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>mutation<\/b>?", "a": ["A <b>change in the DNA<\/b> (genetic material) (1)", "Most have <b>no effect<\/b>; a few change the phenotype (1)", "<i>Trap: 'a change' alone is not enough.<\/i>"], "cp": ["A change in the DNA (genetic material)", "Most have no effect; a few change the phenotype"], "dp": ["A change in the surroundings that harms DNA", "Most cause serious disease", "Mutations only happen in gametes"], "mand": 0}, {"id": "BIO-06-025", "t": 6, "s": "4.6.2.2", "k": "Process", "m": 4, "ht": false, "q": "Explain how <b>natural selection<\/b> can lead to evolution.", "a": ["There is <b>variation<\/b> in a population (from mutations) (1)", "Individuals with a helpful feature <b>survive<\/b> and breed (1)", "They <b>pass on the alleles<\/b> to their offspring (1)", "Over many generations more of the population have the feature (1)"], "cp": ["There is variation in a population (from mutations)", "Individuals with a helpful feature survive and breed", "They pass on the alleles to their offspring", "Over many generations more of the population have the feature"], "dp": ["There is no variation in a population", "Individuals with a helpful feature die before breeding", "Individuals change their features to suit the environment"], "mand": 0}, {"id": "BIO-06-026", "t": 6, "s": "4.6.2.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>evolution<\/b>? When has a <b>new species<\/b> formed?", "a": ["A <b>change<\/b> in the inherited characteristics of a population over time (1)", "When populations can no longer <b>interbreed<\/b> to produce fertile offspring (1)"], "cp": ["A change in the inherited characteristics of a population over time", "When populations can no longer interbreed to produce fertile offspring"], "dp": ["A change in a single individual during its life", "When populations look different", "When populations live in different places"], "mand": 0}, {"id": "BIO-06-027", "t": 6, "s": "4.6.2.3", "k": "Process", "m": 3, "ht": false, "q": "Describe how <b>selective breeding<\/b> is carried out.", "a": ["Choose parents with the <b>desired characteristic<\/b> (1)", "<b>Breed<\/b> them together, then choose the best offspring (1)", "<b>Repeat<\/b> over many generations (1)"], "cp": ["Choose parents with the desired characteristic", "Breed them together, then choose the best offspring", "Repeat over many generations"], "dp": ["Choose parents at random", "Breed them once, then stop", "Choose the largest parents regardless of the characteristic"], "mand": 0}, {"id": "BIO-06-028", "t": 6, "s": "4.6.2.3", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> examples of selective breeding.", "a": ["Any two (1 each):", "• <b>disease resistance<\/b> in crops", "• more <b>milk or meat<\/b> from animals", "• <b>gentle<\/b> nature in dogs", "• <b>large or unusual flowers<\/b>"], "cp": ["disease resistance in crops", "more milk or meat from animals", "gentle nature in dogs", "large or unusual flowers"], "dp": ["crops that make their own antibiotics", "bacteria that make human insulin", "sheep that glow in the dark"], "mand": 0}, {"id": "BIO-06-029", "t": 6, "s": "4.6.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>one<\/b> problem with selective breeding.", "a": ["<b>Inbreeding<\/b> (breeding closely related individuals) (1)", "can cause <b>inherited defects<\/b> and make the population more at risk from disease (1)"], "cp": ["Inbreeding (breeding closely related individuals)", "can cause inherited defects and make the population more at risk from disease"], "dp": ["Outbreeding, which makes the offspring weaker", "can cause the offspring to have less variation but no problems", "It always makes the population healthier"], "mand": 0}, {"id": "BIO-06-030", "t": 6, "s": "4.6.2.4", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>genetic engineering<\/b>?", "a": ["Changing the genome of an organism (1)", "by putting in a <b>gene from another organism<\/b> to give a useful characteristic (1)"], "cp": ["Changing the genome of an organism", "by putting in a gene from another organism to give a useful characteristic"], "dp": ["Breeding organisms with the best features", "by removing all the genes from the organism", "Making identical copies of an organism"], "mand": 0}, {"id": "BIO-06-031", "t": 6, "s": "4.6.2.4", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> examples of genetic engineering.", "a": ["<b>Crops<\/b> with disease resistance or bigger fruit (1)", "<b>Bacteria<\/b> that make human <b>insulin<\/b> (1)"], "cp": ["Crops with disease resistance or bigger fruit", "Bacteria that make human insulin"], "dp": ["Breeding cows to give more milk", "Growing plants from cuttings", "Using IVF to treat infertility"], "mand": 0}, {"id": "BIO-06-032", "t": 6, "s": "4.6.2.4", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>one<\/b> benefit and <b>two<\/b> concerns of <b>GM crops<\/b>.", "a": ["Benefit: greater <b>yield<\/b> or resistance to pests (1)", "Concern: effects on <b>wild plants and insects<\/b> (1)", "Concern: possible <b>health<\/b> effects, and <b>ethical<\/b> objections (1)"], "cp": ["Benefit: greater yield or resistance to pests", "Concern: effects on wild plants and insects", "Concern: possible health effects, and ethical objections"], "dp": ["Benefit: they can never harm wild plants", "Concern: they produce a lower yield", "Concern: they always cause allergies"], "mand": 0}, {"id": "BIO-06-033", "t": 6, "s": "4.6.2.5", "k": "Recall", "m": 2, "ht": false, "q": "What is <b>tissue culture<\/b> and what are <b>cuttings<\/b>?", "a": ["<b>Tissue culture:<\/b> growing small groups of plant cells on nutrient medium in sterile conditions (1)", "<b>Cuttings:<\/b> a piece of plant that grows roots to make a <b>clone<\/b> (1)"], "cp": ["Tissue culture: growing small groups of plant cells on nutrient medium in sterile conditions", "Cuttings: a piece of plant that grows roots to make a clone"], "dp": ["Tissue culture: growing whole plants from seeds", "Cuttings: a seed taken from a plant", "Cuttings: bacteria grown on agar"], "mand": 0}, {"id": "BIO-06-034", "t": 6, "s": "4.6.2.5", "k": "Process", "m": 4, "ht": false, "q": "Describe <b>adult cell cloning<\/b>.", "a": ["The <b>nucleus<\/b> is removed from an <b>unfertilised egg<\/b> (1)", "A nucleus from an <b>adult body cell<\/b> is put in (1)", "An electric shock makes the egg <b>divide<\/b> to form an embryo (1)", "The embryo is put into a <b>surrogate mother<\/b> (1)"], "cp": ["The nucleus is removed from an unfertilised egg", "A nucleus from an adult body cell is put in", "An electric shock makes the egg divide to form an embryo", "The embryo is put into a surrogate mother"], "dp": ["The nucleus is removed from an adult body cell", "A nucleus from a sperm cell is put in", "The embryo is kept in a Petri dish for life"], "mand": 0}, {"id": "BIO-06-035", "t": 6, "s": "4.6.2.5", "k": "Evaluate", "m": 2, "ht": false, "q": "Give <b>one<\/b> benefit and <b>one<\/b> concern of cloning animals.", "a": ["Benefit: can <b>save endangered species<\/b> or copy animals with useful features (1)", "Concern: clones have the <b>same genes<\/b>, so all could be killed by the same disease; <b>ethical<\/b> objections (1)"], "cp": ["Benefit: can save endangered species or copy animals with useful features", "Concern: clones have the same genes, so all could be killed by the same disease; ethical objections"], "dp": ["Benefit: clones are genetically different, giving variation", "Concern: clones are all different, so none survive", "Benefit: there are no ethical issues"], "mand": 0}, {"id": "BIO-06-036", "t": 6, "s": "4.6.3.1", "k": "Recall", "m": 2, "ht": false, "q": "Who proposed the theory of <b>evolution by natural selection<\/b>? When was it published?", "a": ["<b>Charles Darwin<\/b> and <b>Alfred Wallace<\/b> (1)", "Darwin published his book in <b>1859<\/b> (1)"], "cp": ["Charles Darwin and Alfred Wallace", "Darwin published his book in 1859"], "dp": ["Lamarck and Mendel", "1759", "1959"], "mand": 0}, {"id": "BIO-06-037", "t": 6, "s": "4.6.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Why was Darwin's theory <b>slow to be accepted<\/b>?", "a": ["It went against <b>religious<\/b> views about creation (1)", "There was <b>not enough evidence<\/b> at the time (1)", "People did not know how characteristics were <b>inherited<\/b> (genes) (1)"], "cp": ["It went against religious views about creation", "There was not enough evidence at the time", "People did not know how characteristics were inherited (genes)"], "dp": ["It agreed with religious views", "There was too much evidence at the time", "People already knew about genes"], "mand": 0}, {"id": "BIO-06-038", "t": 6, "s": "4.6.3.1", "k": "Recall", "m": 1, "ht": false, "q": "What was <b>Lamarck's<\/b> idea, and is it accepted?", "a": ["Characteristics <b>acquired<\/b> in a lifetime are passed on (e.g. a stretched neck). This is <b>rejected<\/b> (1)"], "cp": ["Characteristics acquired in a lifetime are passed on (e.g. a stretched neck). This is rejected"], "dp": ["Characteristics acquired in a lifetime are passed on; this is accepted today", "Species never change; this is accepted today", "Mutations cause evolution; this was Lamarck's idea"], "mand": 0}, {"id": "BIO-06-039", "t": 6, "s": "4.6.3.2", "k": "Process", "m": 4, "ht": false, "q": "Describe the steps that lead to a <b>new species<\/b> forming (speciation).", "a": ["A population is <b>isolated<\/b> (e.g. by a barrier) (1)", "Different conditions mean different <b>natural selection<\/b> (1)", "The two groups <b>change<\/b> over time (1)", "Eventually they can <b>no longer interbreed<\/b> to make fertile offspring (1)"], "cp": ["A population is isolated (e.g. by a barrier)", "Different conditions mean different natural selection", "The two groups change over time", "Eventually they can no longer interbreed to make fertile offspring"], "dp": ["A population is kept together in one place", "The same conditions mean the same natural selection", "The two groups can still interbreed to make fertile offspring"], "mand": 0}, {"id": "BIO-06-040", "t": 6, "s": "4.6.3.3", "k": "Recall", "m": 2, "ht": false, "q": "What did <b>Mendel's<\/b> breeding experiments with pea plants show? Why was his work not recognised at first?", "a": ["Characteristics are passed on as <b>units<\/b> (later called genes) (1)", "His work was not recognised until <b>after his death<\/b>, when chromosomes and genes were understood (1)"], "cp": ["Characteristics are passed on as units (later called genes)", "His work was not recognised until after his death, when chromosomes and genes were understood"], "dp": ["Characteristics blend together in the offspring", "His work was recognised straight away", "Characteristics are passed on only by the mother"], "mand": 0}, {"id": "BIO-06-041", "t": 6, "s": "4.6.3.4", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> pieces of evidence for evolution.", "a": ["<b>Fossils<\/b> (1)", "<b>Antibiotic resistance<\/b> in bacteria (1)"], "cp": ["Fossils", "Antibiotic resistance in bacteria"], "dp": ["Rocks cooling", "Plants growing towards light", "Rainfall patterns"], "mand": 0}, {"id": "BIO-06-042", "t": 6, "s": "4.6.3.5", "k": "Process", "m": 3, "ht": false, "q": "Describe <b>three<\/b> ways fossils can form.", "a": ["From parts that <b>have not decayed<\/b> (e.g. in ice or amber) (1)", "Hard parts <b>replaced by minerals<\/b> as they decay (1)", "<b>Traces<\/b> such as footprints, burrows or roots (1)"], "cp": ["From parts that have not decayed (e.g. in ice or amber)", "Hard parts replaced by minerals as they decay", "Traces such as footprints, burrows or roots"], "dp": ["From parts that have decayed completely", "Soft parts hardened by sunlight", "From flesh preserved in the air"], "mand": 0}, {"id": "BIO-06-043", "t": 6, "s": "4.6.3.5", "k": "Explain", "m": 2, "ht": false, "q": "Why is the <b>fossil record<\/b> incomplete?", "a": ["<b>Soft-bodied<\/b> organisms left few traces (1)", "Many fossils were <b>destroyed<\/b> or are yet to be found (1)"], "cp": ["Soft-bodied organisms left few traces", "Many fossils were destroyed or are yet to be found"], "dp": ["All organisms leave perfect fossils", "Every fossil has already been found", "Fossils only form from large animals"], "mand": 0}, {"id": "BIO-06-044", "t": 6, "s": "4.6.3.6", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> things that can cause a species to become <b>extinct<\/b>.", "a": ["Any three (1 each):", "• a new <b>predator<\/b>", "• a new <b>disease<\/b>", "• a new <b>competitor<\/b>", "• <b>environmental change<\/b>", "• a single <b>catastrophic event<\/b> (e.g. asteroid, volcano)"], "cp": ["a new predator", "a new disease", "a new competitor", "environmental change", "a single catastrophic event (e.g. asteroid, volcano)"], "dp": ["more food available", "fewer predators", "a stable environment"], "mand": 0}, {"id": "BIO-06-045", "t": 6, "s": "4.6.3.7", "k": "Process", "m": 4, "ht": false, "q": "Explain how <b>antibiotic-resistant<\/b> bacteria develop.", "a": ["A <b>mutation<\/b> makes some bacteria resistant (1)", "The antibiotic kills the non-resistant bacteria; resistant ones <b>survive<\/b> (1)", "They <b>reproduce<\/b>, passing on the resistance (1)", "The <b>resistant strain spreads<\/b> through the population (natural selection) (1)"], "cp": ["A mutation makes some bacteria resistant", "The antibiotic kills the non-resistant bacteria; resistant ones survive", "They reproduce, passing on the resistance", "The resistant strain spreads through the population (natural selection)"], "dp": ["Antibiotics cause the bacteria to become resistant", "Resistant bacteria are killed first", "Resistance is lost when it is passed on"], "mand": 0}, {"id": "BIO-06-046", "t": 6, "s": "4.6.3.7", "k": "Recall", "m": 3, "ht": false, "q": "How can the development of <b>antibiotic resistance<\/b> be reduced?", "a": ["Don't use antibiotics for <b>viral infections<\/b> or minor ones (1)", "<b>Finish the whole course<\/b> (1)", "<b>Restrict<\/b> their use in farming (1)"], "cp": ["Don't use antibiotics for viral infections or minor ones", "Finish the whole course", "Restrict their use in farming"], "dp": ["Use antibiotics for all viral infections", "Stop taking them as soon as you feel better", "Use more antibiotics in farming"], "mand": 0}, {"id": "BIO-06-047", "t": 6, "s": "4.6.3.7", "k": "Recall", "m": 1, "ht": false, "q": "What is <b>MRSA<\/b>?", "a": ["A <b>resistant<\/b> strain of bacteria: an example of antibiotic resistance (1)"], "cp": ["A resistant strain of bacteria: an example of antibiotic resistance"], "dp": ["A virus that causes measles", "A type of antibiotic", "A fungus that infects plants"], "mand": 0}, {"id": "BIO-06-048", "t": 6, "s": "4.6.4", "k": "Recall", "m": 1, "ht": false, "q": "Put Linnaeus's groups in order, largest to smallest.", "a": ["<b>Kingdom, phylum, class, order, family, genus, species<\/b> (1)", "<i>Memory trick: King Philip Came Over For Good Soup.<\/i>"], "cp": ["Kingdom, phylum, class, order, family, genus, species"], "dp": ["Kingdom, class, phylum, order, family, genus, species", "Species, genus, family, order, class, phylum, kingdom", "Kingdom, phylum, order, class, family, species, genus"], "mand": 0}, {"id": "BIO-06-049", "t": 6, "s": "4.6.4", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>binomial name<\/b>? Give an example.", "a": ["A <b>two-part<\/b> Latin name: the <b>genus<\/b> then the <b>species<\/b> (1)", "e.g. <b>Homo sapiens<\/b> (genus has a capital letter) (1)"], "cp": ["A two-part Latin name: the genus then the species", "e.g. Homo sapiens (genus has a capital letter)"], "dp": ["A two-part name: the species then the genus", "A one-word name for the species", "e.g. sapiens Homo"], "mand": 0}, {"id": "BIO-06-050", "t": 6, "s": "4.6.4", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three domains<\/b> in Carl Woese's system.", "a": ["<b>Archaea<\/b> (1)", "<b>Bacteria<\/b> (1)", "<b>Eukaryota<\/b> (1)"], "cp": ["Archaea", "Bacteria", "Eukaryota"], "dp": ["Fungi", "Animalia", "Protista"], "mand": 0}, {"id": "BIO-06-051", "t": 6, "s": "4.6.4", "k": "Explain", "m": 2, "ht": false, "q": "Why did classification systems change over time?", "a": ["Better <b>microscopes<\/b> showed more detail inside cells (1)", "and new <b>biochemical<\/b> evidence (e.g. DNA) showed how organisms are related (1)"], "cp": ["Better microscopes showed more detail inside cells", "and new biochemical evidence (e.g. DNA) showed how organisms are related"], "dp": ["Scientists changed their minds at random", "Organisms changed their features suddenly", "Legal rules required it"], "mand": 0}, {"id": "BIO-06-052", "t": 6, "s": "4.6.4", "k": "Data", "m": 2, "ht": false, "q": "On an <b>evolutionary tree<\/b>, how can you tell how closely two species are related?", "a": ["Look at <b>where branches split<\/b> (1)", "The more <b>recent<\/b> the shared ancestor, the more closely related (1)"], "cp": ["Look at where branches split", "The more recent the shared ancestor, the more closely related"], "dp": ["Look at how long the branches are drawn", "The older the shared ancestor, the more closely related", "Count the species at the end of the branches"], "mand": 0}, {"id": "BIO-06-H01", "t": 6, "s": "4.6.1.5", "k": "Recall", "m": 2, "ht": true, "q": "Which bases pair together in DNA?", "a": ["<b>A<\/b> always pairs with <b>T<\/b> (1)", "<b>C<\/b> always pairs with <b>G<\/b> (1)"], "cp": ["A always pairs with T", "C always pairs with G"], "dp": ["A always pairs with G", "C always pairs with T", "A always pairs with C"], "mand": 0}, {"id": "BIO-06-H02", "t": 6, "s": "4.6.1.5", "k": "Process", "m": 4, "ht": true, "q": "Describe simple <b>protein synthesis<\/b>.", "a": ["DNA in the <b>nucleus<\/b> is copied as a <b>messenger molecule<\/b> (mRNA) (1)", "which carries the code to a <b>ribosome<\/b> (1)", "<b>Amino acids<\/b> are joined in the order the code gives (1)", "The chain folds to make the <b>protein<\/b> (1)"], "cp": ["DNA in the nucleus is copied as a messenger molecule (mRNA)", "which carries the code to a ribosome", "Amino acids are joined in the order the code gives", "The chain folds to make the protein"], "dp": ["DNA leaves the nucleus and goes to the ribosome", "Amino acids are joined in a random order", "mRNA is copied in the ribosome as DNA"], "mand": 0}, {"id": "BIO-06-H03", "t": 6, "s": "4.6.1.5", "k": "Explain", "m": 3, "ht": true, "q": "Explain how a <b>mutation<\/b> in a gene could change a protein.", "a": ["A mutation changes the <b>order of bases<\/b> (1)", "so a different <b>amino acid<\/b> may be added (1)", "which can change the <b>shape<\/b> of the protein, so it may not work (1)"], "cp": ["A mutation changes the order of bases", "so a different amino acid may be added", "which can change the shape of the protein, so it may not work"], "dp": ["A mutation changes the number of chromosomes", "so the same amino acid is always added", "which never changes the protein"], "mand": 0}, {"id": "BIO-06-H04", "t": 6, "s": "4.6.1.5", "k": "Recall", "m": 2, "ht": true, "q": "What is the job of <b>non-coding DNA<\/b>?", "a": ["It does not code for proteins (1)", "but can <b>switch genes on and off<\/b> (1)"], "cp": ["It does not code for proteins", "but can switch genes on and off"], "dp": ["It codes for most of the body's proteins", "It stores amino acids", "It cannot ever have any effect"], "mand": 0}, {"id": "BIO-06-H05", "t": 6, "s": "4.6.1.6", "k": "Punnett square", "m": 4, "ht": true, "q": "Cystic fibrosis is caused by a <b>recessive<\/b> allele (f).<br/><br/>Two heterozygous parents have a child. Draw a <b>Punnett square<\/b> and find the probability that the child has cystic fibrosis.", "a": ["Parents are <b>Ff<\/b> × <b>Ff<\/b>. Gametes: <b>F or f<\/b> from each (1)", "Square gives <b>FF, Ff, Ff, ff<\/b> (1)", "Only <b>ff<\/b> has cystic fibrosis (1)", "Probability = <b>1 in 4<\/b> (25%, 0.25) (1)"], "cp": ["Parents are Ff × Ff. Gametes: F or f from each", "Square gives FF, Ff, Ff, ff", "Only ff has cystic fibrosis", "Probability = 1 in 4 (25%, 0.25)"], "dp": ["Parents are FF × Ff", "Square gives FF, FF, Ff, ff", "Probability = 1 in 2"], "mand": 0}, {"id": "BIO-06-H06", "t": 6, "s": "4.6.1.6", "k": "Punnett square", "m": 4, "ht": true, "q": "Polydactyly (extra fingers) is caused by a <b>dominant<\/b> allele (D). A father is <b>Dd<\/b>. The mother is <b>dd<\/b>.<br/><br/>Draw a Punnett square. What is the chance of a child with polydactyly?", "a": ["Gametes: father <b>D or d<\/b>; mother <b>d or d<\/b> (1)", "Square gives <b>Dd, Dd, dd, dd<\/b> (1)", "<b>Dd<\/b> shows polydactyly (1)", "Probability = <b>50%<\/b> (1 in 2, 0.5) (1)"], "cp": ["Gametes: father D or d; mother d or d", "Square gives Dd, Dd, dd, dd", "Dd shows polydactyly", "Probability = 50% (1 in 2, 0.5)"], "dp": ["Gametes: father D or D; mother d or d", "Square gives DD, DD, dd, dd", "Probability = 100%"], "mand": 0}, {"id": "BIO-06-H07", "t": 6, "s": "4.6.2.4", "k": "Process", "m": 4, "ht": true, "q": "Describe how a gene is transferred in <b>genetic engineering<\/b>.", "a": ["<b>Enzymes<\/b> cut the gene out of a chromosome (1)", "The gene is put into a <b>vector<\/b> (a plasmid or a virus) (1)", "The vector inserts it into the cells of the other organism (1)", "This is done at an <b>early stage<\/b> of development so all cells have it (1)"], "cp": ["Enzymes cut the gene out of a chromosome", "The gene is put into a vector (a plasmid or a virus)", "The vector inserts it into the cells of the other organism", "This is done at an early stage of development so all cells have it"], "dp": ["Enzymes join the gene to a chromosome in the old cell", "The gene is put into a mitochondrion", "This is done in the adult, so only some cells have it"], "mand": 0}, {"id": "BIO-07-001", "t": 7, "s": "4.7.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between a <b>community<\/b> and an <b>ecosystem<\/b>?", "a": ["<b>Community:<\/b> all the <b>living<\/b> organisms (all species) in one habitat (1)", "<b>Ecosystem:<\/b> the community <b>plus<\/b> the non-living (abiotic) environment (1)", "<i>Trap: do not mix these up.<\/i>"], "cp": ["Community: all the living organisms (all species) in one habitat", "Ecosystem: the community plus the non-living (abiotic) environment"], "dp": ["Community: the living organisms plus the non-living environment", "Ecosystem: all the living organisms of one species", "Community: all the non-living factors in a habitat"], "mand": 0}, {"id": "BIO-07-002", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> things <b>plants<\/b> compete for.", "a": ["<b>Light<\/b> (1)", "<b>Water<\/b> (1)", "<b>Space<\/b> and <b>mineral ions<\/b> (1)"], "cp": ["Light", "Water", "Space and mineral ions"], "dp": ["Mates", "Prey", "Oxygen from the soil"], "mand": 0}, {"id": "BIO-07-003", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> things <b>animals<\/b> compete for.", "a": ["<b>Food<\/b> (1)", "<b>Mates<\/b> (1)", "<b>Territory<\/b> (space) (1)"], "cp": ["Food", "Mates", "Territory (space)"], "dp": ["Light", "Mineral ions from the soil", "Chlorophyll"], "mand": 0}, {"id": "BIO-07-004", "t": 7, "s": "4.7.1.1", "k": "Explain", "m": 2, "ht": false, "q": "What is <b>interdependence<\/b>? Why can removing one species affect a whole community?", "a": ["Species <b>depend on each other<\/b> for food, shelter, pollination and so on (1)", "so removing one species can affect <b>many others<\/b> in the community (1)"], "cp": ["Species depend on each other for food, shelter, pollination and so on", "so removing one species can affect many others in the community"], "dp": ["Species do not depend on each other", "so removing one species affects only that species", "Species depend on each other only for oxygen"], "mand": 0}, {"id": "BIO-07-005", "t": 7, "s": "4.7.1.1", "k": "Definition", "m": 1, "ht": false, "q": "What is a <b>stable community<\/b>?", "a": ["One where all species and the environment are in <b>balance<\/b>, so population sizes stay fairly <b>constant<\/b> (1)"], "cp": ["One where all species and the environment are in balance, so population sizes stay fairly constant"], "dp": ["One where one species is always dominant", "One where population sizes change a lot", "One with no predators"], "mand": 0}, {"id": "BIO-07-006", "t": 7, "s": "4.7.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three abiotic<\/b> (non-living) factors that affect a community.", "a": ["Any three (1 each):", "• <b>light<\/b> intensity", "• <b>temperature<\/b>", "• <b>moisture<\/b> level", "• soil <b>pH<\/b> and mineral content", "• <b>wind<\/b> intensity and direction", "• <b>oxygen<\/b> (water) or <b>CO<sub>2<\/sub><\/b> (air) levels"], "cp": ["light intensity", "temperature", "moisture level", "soil pH and mineral content", "wind intensity and direction", "oxygen (water) or CO<sub>2<\/sub> (air) levels"], "dp": ["number of predators", "food availability", "new pathogens"], "mand": 0}, {"id": "BIO-07-007", "t": 7, "s": "4.7.1.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three biotic<\/b> (living) factors that affect a community.", "a": ["Any three (1 each):", "• <b>food<\/b> availability", "• new <b>predators<\/b>", "• new <b>pathogens<\/b> (disease)", "• one species <b>outcompeting<\/b> another"], "cp": ["food availability", "new predators", "new pathogens (disease)", "one species outcompeting another"], "dp": ["temperature", "soil pH", "wind direction"], "mand": 0}, {"id": "BIO-07-008", "t": 7, "s": "4.7.1.3", "k": "Explain", "m": 2, "ht": false, "q": "A new <b>predator<\/b> arrives in a community.<br/><br/>Explain how this could affect the community.", "a": ["The number of <b>prey<\/b> falls (1)", "Other species that eat the prey have <b>less food<\/b>; species the prey ate may <b>increase<\/b> (1)"], "cp": ["The number of prey falls", "Other species that eat the prey have less food; species the prey ate may increase"], "dp": ["The number of prey rises", "The species that the prey eat decrease", "Nothing else in the community changes"], "mand": 0}, {"id": "BIO-07-009", "t": 7, "s": "4.7.1.2", "k": "Explain", "m": 2, "ht": false, "q": "A long <b>drought<\/b> happens. Explain how it could change the plants in a community.", "a": ["Less <b>water<\/b> means fewer plants survive (1)", "so animals that eat them have <b>less food<\/b>, and numbers fall (1)"], "cp": ["Less water means fewer plants survive", "so animals that eat them have less food, and numbers fall"], "dp": ["More water means more plants survive", "so animals that eat them have more food", "Plants grow faster"], "mand": 0}, {"id": "BIO-07-010", "t": 7, "s": "4.7.1.4", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three types<\/b> of adaptation and give an example of each.", "a": ["<b>Structural:<\/b> e.g. thick fur, spines (1)", "<b>Behavioural:<\/b> e.g. migration, hibernation (1)", "<b>Functional:<\/b> e.g. how the body works, such as sweating or making venom (1)"], "cp": ["Structural: e.g. thick fur, spines", "Behavioural: e.g. migration, hibernation", "Functional: e.g. how the body works, such as sweating or making venom"], "dp": ["Structural: e.g. migration", "Behavioural: e.g. thick fur", "Functional: e.g. spines"], "mand": 0}, {"id": "BIO-07-011", "t": 7, "s": "4.7.1.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>cactus<\/b> is adapted to survive in a desert.", "a": ["Spines instead of leaves <b>reduce water loss<\/b> (1)", "A thick, waxy stem <b>stores water<\/b> (1)", "<b>Long roots<\/b> reach water deep in the ground (1)"], "cp": ["Spines instead of leaves reduce water loss", "A thick, waxy stem stores water", "Long roots reach water deep in the ground"], "dp": ["Large, flat leaves reduce water loss", "A thin, soft stem stores water", "Short roots reach water deep in the ground"], "mand": 0}, {"id": "BIO-07-012", "t": 7, "s": "4.7.1.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>polar bear<\/b> is adapted to the Arctic.", "a": ["Thick fur and a thick layer of <b>fat<\/b> for insulation (1)", "<b>White<\/b> fur for camouflage (1)", "<b>Small<\/b> ears and a large body give a small surface area to volume ratio, so it <b>loses less heat<\/b> (1)"], "cp": ["Thick fur and a thick layer of fat for insulation", "White fur for camouflage", "Small ears and a large body give a small surface area to volume ratio, so it loses less heat"], "dp": ["Thin fur and no fat for insulation", "Dark fur for camouflage", "Large ears and a small body give a large surface area to volume ratio"], "mand": 0}, {"id": "BIO-07-013", "t": 7, "s": "4.7.1.4", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>extremophile<\/b>? Give an example.", "a": ["An organism adapted to live in <b>extreme conditions<\/b> (1)", "e.g. bacteria at deep-sea <b>vents<\/b>, high temperature, pressure or salt (1)"], "cp": ["An organism adapted to live in extreme conditions", "e.g. bacteria at deep-sea vents, high temperature, pressure or salt"], "dp": ["An organism that cannot survive extreme conditions", "e.g. a goldfish in a pond", "An organism that eats other organisms"], "mand": 0}, {"id": "BIO-07-014", "t": 7, "s": "4.7.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Put these in order for a food chain: <b>secondary consumer, producer, primary consumer<\/b>. What does an arrow mean?", "a": ["<b>Producer → primary consumer → secondary consumer<\/b> (1)", "A <b>producer<\/b> makes its own food by photosynthesis (1)", "The arrow means 'is <b>eaten by<\/b>' (shows the direction of energy transfer) (1)"], "cp": ["Producer → primary consumer → secondary consumer", "A producer makes its own food by photosynthesis", "The arrow means 'is eaten by' (shows the direction of energy transfer)"], "dp": ["Secondary consumer → primary consumer → producer", "A producer eats other organisms", "The arrow means 'eats'"], "mand": 0}, {"id": "BIO-07-015", "t": 7, "s": "4.7.2.1", "k": "Explain", "m": 3, "ht": false, "q": "A graph shows <b>predator<\/b> and <b>prey<\/b> numbers rising and falling. Explain the pattern.", "a": ["More <b>prey<\/b> means more food, so <b>predators<\/b> increase (1)", "More predators eat more prey, so <b>prey fall<\/b> (1)", "Less food, so predators fall, and the cycle <b>repeats<\/b> (1)"], "cp": ["More prey means more food, so predators increase", "More predators eat more prey, so prey fall", "Less food, so predators fall, and the cycle repeats"], "dp": ["More predators means more prey", "Fewer predators eat more prey", "Predators decrease because they have more food"], "mand": 0}, {"id": "BIO-07-016", "t": 7, "s": "4.7.2.1", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical 9.<\/b> Describe how to estimate the population size of a species in a habitat using quadrats.", "a": ["Use <b>random<\/b> sampling (random coordinates) to avoid bias (1)", "<b>Count<\/b> the organisms in each quadrat (1)", "<b>Repeat<\/b> and calculate the <b>mean<\/b> per m<sup>2<\/sup> (1)", "Mean × <b>total area<\/b> (m<sup>2<\/sup>) = estimated population (1)", "Use a <b>large sample<\/b> for reliability (1)"], "cp": ["Use random sampling (random coordinates) to avoid bias", "Count the organisms in each quadrat", "Repeat and calculate the mean per m<sup>2<\/sup>", "Mean × total area (m<sup>2<\/sup>) = estimated population", "Use a large sample for reliability"], "dp": ["Place quadrats where the species is most common", "Count only the largest organisms", "Add up all the counts and multiply by the area"], "mand": 0}, {"id": "BIO-07-017", "t": 7, "s": "4.7.2.1", "k": "Calculation", "m": 3, "ht": false, "q": "The mean is 8 daisies per m<sup>2<\/sup>. A field is 500 m<sup>2<\/sup>.<br/><br/>Estimate the population.", "a": ["Mean × area (1)", "8 × 500 (1)", "= <b>4000<\/b> daisies (1)", "<i>Trap: do not multiply the total count by the area.<\/i>"], "cp": ["Mean × area", "8 × 500", "= 4000 daisies"], "dp": ["Mean ÷ area", "8 ÷ 500", "= 40 000 daisies"], "mand": 0}, {"id": "BIO-07-018", "t": 7, "s": "4.7.2.1", "k": "Practical", "m": 3, "ht": false, "q": "<b>Required practical 9.<\/b> How can a <b>transect<\/b> show how a species' distribution changes from the shade to the open?", "a": ["Lay a <b>tape<\/b> from the shade into the open (1)", "Place <b>quadrats<\/b> at regular intervals along the tape (1)", "<b>Count<\/b> the species in each and compare (1)"], "cp": ["Lay a tape from the shade into the open", "Place quadrats at regular intervals along the tape", "Count the species in each and compare"], "dp": ["Lay a tape across the shade only", "Place quadrats at random along the tape", "Count only the species in the open"], "mand": 0}, {"id": "BIO-07-019", "t": 7, "s": "4.7.2.1", "k": "Calculation", "m": 3, "ht": false, "q": "Counts per quadrat: 3, 8, 5, 9, 5.<br/><br/>Find the <b>mean<\/b>, <b>median<\/b> and <b>mode<\/b>.", "a": ["Mean: 30 ÷ 5 = <b>6<\/b> (1)", "Median: middle of 3, 5, 5, 8, 9 = <b>5<\/b> (1)", "Mode: most common = <b>5<\/b> (1)"], "cp": ["Mean: 30 ÷ 5 = 6", "Median: middle of 3, 5, 5, 8, 9 = 5", "Mode: most common = 5"], "dp": ["Mean: 30 ÷ 3 = 10", "Median: 8", "Mode: 9"], "mand": 0}, {"id": "BIO-07-020", "t": 7, "s": "4.7.2.1", "k": "Explain", "m": 1, "ht": false, "q": "Why should quadrat positions be chosen <b>randomly<\/b>?", "a": ["To avoid <b>bias<\/b> (1)"], "cp": ["To avoid bias"], "dp": ["To make the counts higher", "To save time", "To keep the quadrats in the shade"], "mand": 0}, {"id": "BIO-07-021", "t": 7, "s": "4.7.2.2", "k": "Process", "m": 4, "ht": false, "q": "Describe the <b>carbon cycle<\/b>: which processes <b>remove<\/b> and <b>add<\/b> carbon dioxide?", "a": ["<b>Photosynthesis<\/b> removes CO<sub>2<\/sub> from the air (1)", "<b>Respiration<\/b> of plants and animals adds CO<sub>2<\/sub> (1)", "<b>Combustion<\/b> (burning) adds CO<sub>2<\/sub> (1)", "<b>Decay<\/b>: microorganisms respire and add CO<sub>2<\/sub> (1)"], "cp": ["Photosynthesis removes CO<sub>2<\/sub> from the air", "Respiration of plants and animals adds CO<sub>2<\/sub>", "Combustion (burning) adds CO<sub>2<\/sub>", "Decay: microorganisms respire and add CO<sub>2<\/sub>"], "dp": ["Photosynthesis adds CO<sub>2<\/sub> to the air", "Respiration removes CO<sub>2<\/sub> from the air", "Decay removes CO<sub>2<\/sub> from the air"], "mand": 0}, {"id": "BIO-07-022", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 2, "ht": false, "q": "What do <b>microorganisms<\/b> do to dead plants and animals?", "a": ["They <b>decompose<\/b> (break down) the dead material (1)", "returning <b>CO<sub>2<\/sub><\/b> to the air and <b>mineral ions<\/b> to the soil (1)", "<i>Trap: dead matter does not decay by itself.<\/i>"], "cp": ["They decompose (break down) the dead material", "returning CO<sub>2<\/sub> to the air and mineral ions to the soil"], "dp": ["They preserve the dead material", "removing mineral ions from the soil", "producing oxygen"], "mand": 0}, {"id": "BIO-07-023", "t": 7, "s": "4.7.2.2", "k": "Process", "m": 4, "ht": false, "q": "Describe the <b>water cycle<\/b>.", "a": ["Water <b>evaporates<\/b> from land and sea (and plants lose water by <b>transpiration<\/b>) (1)", "Water vapour <b>rises, cools and condenses<\/b> to form clouds (1)", "Falls as <b>precipitation<\/b> (rain, snow) (1)", "Runs into rivers and the sea, or soaks into the ground (1)"], "cp": ["Water evaporates from land and sea (and plants lose water by transpiration)", "Water vapour rises, cools and condenses to form clouds", "Falls as precipitation (rain, snow)", "Runs into rivers and the sea, or soaks into the ground"], "dp": ["Water vapour sinks, warms and condenses", "Falls as evaporation", "Water in the ground evaporates only"], "mand": 0}, {"id": "BIO-07-024", "t": 7, "s": "4.7.2.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a compost heap decays <b>faster<\/b> when it is warm, moist and turned over.", "a": ["<b>Warm:<\/b> decomposers' enzymes and reproduction work faster (1)", "<b>Moist:<\/b> decomposers need water (1)", "<b>Turned over:<\/b> adds <b>oxygen<\/b> for aerobic respiration (1)"], "cp": ["Warm: decomposers' enzymes and reproduction work faster", "Moist: decomposers need water", "Turned over: adds oxygen for aerobic respiration"], "dp": ["Cold: decomposers work faster", "Dry: decomposers need no water", "Left alone: oxygen is added"], "mand": 0}, {"id": "BIO-07-025", "t": 7, "s": "4.7.2.3", "k": "Recall", "m": 2, "ht": false, "q": "What is made by <b>anaerobic decay<\/b>, and what can it be used for?", "a": ["<b>Methane<\/b> gas (1)", "<b>Biogas<\/b> can be burned as a fuel (1)"], "cp": ["Methane gas", "Biogas can be burned as a fuel"], "dp": ["Oxygen gas", "Biogas is used
