<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayla Health and Social Care">
<meta name="theme-color" content="#0d1020">
<title>Kayla's Health and Social Care Lab | GCSE BTEC revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#8b7bff;--accent2:#38d0f0;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v3M12 17v3M5 12h14"/><circle cx="12" cy="7" r="0.5"/><circle cx="12" cy="17" r="0.5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span>Health and Social Care Lab</span></button>
  <span class="pill">Kayla | BTEC</span>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>
<script>
const DATA=[{"id": "HSC-01-001", "t": 1, "s": "C3", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>format of the Component 3 exam<\/b>?", "a": ["An <b>external exam<\/b> set and marked by Pearson (1)", "<b>2 hours<\/b> and <b>60 marks<\/b> (1)", "Worth <b>40%<\/b> of the qualification (1)"], "cp": ["An external exam set and marked by Pearson", "2 hours and 60 marks", "Worth 40% of the qualification"], "dp": ["A 1 hour 30 minute exam", "Worth 100% of the qualification", "Marked by your teacher"], "mand": 0}, {"id": "HSC-01-002", "t": 1, "s": "C3", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>exam questions based on<\/b>?", "a": ["A <b>case study<\/b> about one individual (1)", "You <b>assess<\/b> their health and wellbeing (1)", "You then <b>recommend a plan<\/b> to improve it (1)"], "cp": ["A case study about one individual", "You assess their health and wellbeing", "You then recommend a plan to improve it"], "dp": ["A set text", "A practical task", "A fieldwork report"], "mand": 0}, {"id": "HSC-01-003", "t": 1, "s": "C3", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four assessment objectives<\/b> in Component 3.", "a": ["<b>AO1<\/b>: knowledge of the factors affecting health and wellbeing (1)", "<b>AO2<\/b>: interpret health indicators (1)", "<b>AO3<\/b>: design a person-centred improvement plan (1)", "<b>AO4<\/b>: how to overcome obstacles to the plan (1)"], "cp": ["AO1: knowledge of the factors affecting health and wellbeing", "AO2: interpret health indicators", "AO3: design a person-centred improvement plan", "AO4: how to overcome obstacles to the plan"], "dp": ["Spelling, punctuation and grammar", "Research, plan, present, review", "Care values, safeguarding, communication, review"], "mand": 0}, {"id": "HSC-01-004", "t": 1, "s": "C3", "k": "Recall", "m": 2, "ht": false, "q": "Which <b>other components<\/b> does the Component 3 exam draw on?", "a": ["<b>Component 1<\/b>: life stages and life events (1)", "<b>Component 2<\/b>: services, barriers and care values (1)"], "cp": ["Component 1: life stages and life events", "Component 2: services, barriers and care values"], "dp": ["Component 4 and 5", "Only Component 2", "None, it is separate"], "mand": 0}, {"id": "HSC-01-005", "t": 1, "s": "C3", "k": "Recall", "m": 2, "ht": false, "q": "How are <b>Components 1 and 2<\/b> assessed?", "a": ["<b>Internally<\/b>, through Pearson set assignments marked in school (1)", "Each is worth <b>30%<\/b> of the qualification (1)"], "cp": ["Internally, through Pearson set assignments marked in school", "Each is worth 30% of the qualification"], "dp": ["By external exam", "Each is worth 10%", "By a spoken presentation"], "mand": 0}, {"id": "HSC-01-006", "t": 1, "s": "Cmd", "k": "Definition", "m": 1, "ht": false, "q": "What does the command word <b>'Explain'<\/b> require?", "a": ["Make a point and give a <b>linked justification or example<\/b> (1)"], "cp": ["Make a point and give a linked justification or example"], "dp": ["Just list facts", "Give a one word answer", "Draw a conclusion only"], "mand": 0}, {"id": "HSC-01-007", "t": 1, "s": "Cmd", "k": "Definition", "m": 1, "ht": false, "q": "What does the command word <b>'Describe'<\/b> require?", "a": ["Give an <b>account<\/b> of something, with no justification needed (1)"], "cp": ["Give an account of something, with no justification needed"], "dp": ["Give reasons and evidence", "Make a judgement", "State one word"], "mand": 0}, {"id": "HSC-01-008", "t": 1, "s": "Cmd", "k": "Definition", "m": 1, "ht": false, "q": "What does the command word <b>'Assess'<\/b> require?", "a": ["Consider <b>all relevant factors<\/b>, decide which matter most and reach a <b>judgement<\/b> (1)"], "cp": ["Consider all relevant factors, decide which matter most and reach a judgement"], "dp": ["List the factors only", "Describe one factor", "Copy from the case study"], "mand": 0}, {"id": "HSC-01-009", "t": 1, "s": "Cmd", "k": "Definition", "m": 1, "ht": false, "q": "What does the command word <b>'Interpret'<\/b> require?", "a": ["State the <b>meaning<\/b> of something, such as what a reading shows about health (1)"], "cp": ["State the meaning of something, such as what a reading shows about health"], "dp": ["Draw a graph", "Copy the data", "Predict the future"], "mand": 0}, {"id": "HSC-01-010", "t": 1, "s": "Cmd", "k": "Definition", "m": 1, "ht": false, "q": "What does the command word <b>'Recommend'<\/b> require?", "a": ["<b>Suggest<\/b> a course of action or targets that would improve the situation (1)"], "cp": ["Suggest a course of action or targets that would improve the situation"], "dp": ["Describe the problem", "Criticise the plan", "State a fact"], "mand": 0}, {"id": "HSC-01-011", "t": 1, "s": "Cmd", "k": "Definition", "m": 1, "ht": false, "q": "What does the command word <b>'Justify'<\/b> require?", "a": ["Give <b>reasons or evidence<\/b> to support an opinion or choice (1)"], "cp": ["Give reasons or evidence to support an opinion or choice"], "dp": ["Give a list", "Describe only", "Give a definition"], "mand": 0}, {"id": "HSC-01-012", "t": 1, "s": "C3", "k": "Exam trap", "m": 2, "ht": false, "q": "A student answers an 'assess' question about a case study with <b>general facts only<\/b>. Why does this lose marks?", "a": ["The answer is <b>not linked to the individual<\/b> in the case study (1)", "Marks need <b>specific details<\/b> from the case study (1)"], "cp": ["The answer is not linked to the individual in the case study", "Marks need specific details from the case study"], "dp": ["Facts are never rewarded", "The answer was too long", "Case studies have no marks"], "mand": 0}, {"id": "HSC-01-013", "t": 1, "s": "C3", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'diet'<\/b> alone a weak answer when asked to <b>explain<\/b> a factor?", "a": ["It <b>names<\/b> the factor but gives no <b>effect<\/b> (1)", "An explanation needs a <b>linked effect on health or wellbeing<\/b> (1)"], "cp": ["It names the factor but gives no effect", "An explanation needs a linked effect on health or wellbeing"], "dp": ["Diet is not a factor", "One word always gets full marks", "Explain means list"], "mand": 0}, {"id": "HSC-01-014", "t": 1, "s": "C3", "k": "Exam trap", "m": 2, "ht": false, "q": "Why must a <b>recommended target<\/b> be realistic for the individual?", "a": ["The plan must suit their <b>needs, wishes and circumstances<\/b> (1)", "An <b>unrealistic target<\/b> is unlikely to be achieved (1)"], "cp": ["The plan must suit their needs, wishes and circumstances", "An unrealistic target is unlikely to be achieved"], "dp": ["Harder targets earn more marks", "Realism is not marked", "Targets must be identical for everyone"], "mand": 0}, {"id": "HSC-01-015", "t": 1, "s": "C3", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes that health means 'not being ill'. What is <b>missing<\/b>?", "a": ["<b>Wellbeing<\/b>: social and emotional health (1)", "Health is <b>not just the absence of illness<\/b> (1)"], "cp": ["Wellbeing: social and emotional health", "Health is not just the absence of illness"], "dp": ["Nothing is missing", "Only exercise", "Only mental health"], "mand": 0}, {"id": "HSC-02-001", "t": 2, "s": "A1", "k": "Definition", "m": 2, "ht": false, "q": "What is meant by <b>health and wellbeing<\/b>?", "a": ["A combination of <b>physical health<\/b> (1)", "and <b>social and emotional wellbeing<\/b>, not just the absence of illness (1)"], "cp": ["A combination of physical health", "and social and emotional wellbeing, not just the absence of illness"], "dp": ["Only being free from disease", "Only being fit", "Only feeling happy"], "mand": 0}, {"id": "HSC-02-002", "t": 2, "s": "A1", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four groups of factors<\/b> that affect health and wellbeing.", "a": ["<b>Physical and lifestyle<\/b> (1)", "<b>Social, emotional and cultural<\/b> (1)", "<b>Economic<\/b> (1)", "<b>Environmental<\/b> (1)"], "cp": ["Physical and lifestyle", "Social, emotional and cultural", "Economic", "Environmental"], "dp": ["Genetic, medical, legal, political", "Physical, intellectual, emotional, social", "Primary, secondary, tertiary, informal"], "mand": 0}, {"id": "HSC-02-003", "t": 2, "s": "A1", "k": "Recall", "m": 4, "ht": false, "q": "Give <b>four physical and lifestyle factors<\/b>.", "a": ["Any four (1 each):", "• Genetic inheritance", "• Ill health (acute or chronic)", "• Diet", "• Amount of exercise", "• Substance use", "• Personal hygiene"], "cp": ["Genetic inheritance", "Ill health (acute or chronic)", "Diet", "Amount of exercise", "Substance use", "Personal hygiene"], "dp": ["Income", "Housing", "Stress"], "mand": 0}, {"id": "HSC-02-004", "t": 2, "s": "A1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three social, emotional and cultural factors<\/b>.", "a": ["Any three (1 each):", "• Social interactions (supportive or unsupportive relationships)", "• Social isolation or integration", "• Stress, such as work-related stress", "• Willingness to seek help or use services"], "cp": ["Social interactions (supportive or unsupportive relationships)", "Social isolation or integration", "Stress, such as work-related stress", "Willingness to seek help or use services"], "dp": ["Pollution", "Genetic inheritance", "Diet"], "mand": 0}, {"id": "HSC-02-005", "t": 2, "s": "A1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two environmental factors<\/b>.", "a": ["Any two (1 each):", "• Environmental conditions such as pollution or noise", "• Housing, such as its condition or location"], "cp": ["Environmental conditions such as pollution or noise", "Housing, such as its condition or location"], "dp": ["Income", "Exercise", "Stress"], "mand": 0}, {"id": "HSC-02-006", "t": 2, "s": "A1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>genetic inheritance<\/b> and how can it affect health?", "a": ["Characteristics and conditions <b>passed from parents<\/b> through genes (1)", "Can cause <b>inherited conditions<\/b> or a <b>predisposition<\/b> to others (1)"], "cp": ["Characteristics and conditions passed from parents through genes", "Can cause inherited conditions or a predisposition to others"], "dp": ["Habits copied from friends", "Medicines taken in pregnancy", "The area you live in"], "mand": 0}, {"id": "HSC-02-007", "t": 2, "s": "A1", "k": "Explain", "m": 2, "ht": false, "q": "Give an <b>example of an inherited condition<\/b> and one condition a person may be <b>predisposed<\/b> to.", "a": ["Inherited condition, such as <b>cystic fibrosis<\/b> or <b>sickle cell disease<\/b> (1)", "Predisposition, such as <b>heart disease<\/b> or some cancers (1)"], "cp": ["Inherited condition, such as cystic fibrosis or sickle cell disease", "Predisposition, such as heart disease or some cancers"], "dp": ["Asthma caused by pollution", "Flu", "A broken bone"], "mand": 0}, {"id": "HSC-02-008", "t": 2, "s": "A1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>acute<\/b> and <b>chronic<\/b> ill health?", "a": ["<b>Acute<\/b> is short term and often sudden (1)", "<b>Chronic<\/b> is long lasting and often develops slowly (1)"], "cp": ["Acute is short term and often sudden", "Chronic is long lasting and often develops slowly"], "dp": ["Acute is mild and chronic is severe always", "Acute is mental and chronic is physical", "There is no difference"], "mand": 0}, {"id": "HSC-02-009", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>poor diet<\/b> can affect health and wellbeing.", "a": ["Can cause <b>obesity<\/b> or <b>malnutrition<\/b> (1)", "Raises the risk of <b>heart disease<\/b> or <b>type 2 diabetes<\/b> (1)", "Can lower <b>energy, mood and self-esteem<\/b> (1)"], "cp": ["Can cause obesity or malnutrition", "Raises the risk of heart disease or type 2 diabetes", "Can lower energy, mood and self-esteem"], "dp": ["It only affects teeth", "It has no effect on mood", "It only affects older adults"], "mand": 0}, {"id": "HSC-02-010", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>regular exercise<\/b> can improve health and wellbeing.", "a": ["Strengthens the <b>heart, lungs and muscles<\/b> (1)", "Helps control <b>weight<\/b> and lowers the risk of <b>disease<\/b> (1)", "Releases <b>endorphins<\/b>, which improve mood and reduce stress (1)"], "cp": ["Strengthens the heart, lungs and muscles", "Helps control weight and lowers the risk of disease", "Releases endorphins, which improve mood and reduce stress"], "dp": ["It makes bones weaker", "It increases stress", "It has only physical effects"], "mand": 0}, {"id": "HSC-02-011", "t": 2, "s": "A1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of substance use<\/b> that can harm health.", "a": ["Any three (1 each):", "• Alcohol", "• Nicotine (smoking)", "• Illegal drugs", "• Misuse of prescribed drugs"], "cp": ["Alcohol", "Nicotine (smoking)", "Illegal drugs", "Misuse of prescribed drugs"], "dp": ["Fruit and vegetables", "Water", "Vitamins taken as directed"], "mand": 0}, {"id": "HSC-02-012", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>substance use<\/b> can affect health and wellbeing.", "a": ["Can damage organs such as the <b>liver, lungs or heart<\/b> (1)", "Can cause <b>addiction<\/b> and mental health problems (1)", "Can harm <b>relationships and finances<\/b> (1)"], "cp": ["Can damage organs such as the liver, lungs or heart", "Can cause addiction and mental health problems", "Can harm relationships and finances"], "dp": ["It improves sleep", "It has no social effects", "It only harms the user's skin"], "mand": 0}, {"id": "HSC-02-013", "t": 2, "s": "A1", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>poor personal hygiene<\/b> can affect health and wellbeing.", "a": ["Increases the spread of <b>infections<\/b> and illness (1)", "Can lead to <b>social rejection<\/b> and low self-esteem (1)"], "cp": ["Increases the spread of infections and illness", "Can lead to social rejection and low self-esteem"], "dp": ["It improves immunity", "It has no effect", "It only affects clothing"], "mand": 0}, {"id": "HSC-02-014", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>supportive relationships<\/b> can improve wellbeing.", "a": ["Give <b>emotional support<\/b> in difficult times (1)", "Increase <b>self-esteem and sense of belonging<\/b> (1)", "Can offer <b>practical help<\/b> and encourage healthy habits (1)"], "cp": ["Give emotional support in difficult times", "Increase self-esteem and sense of belonging", "Can offer practical help and encourage healthy habits"], "dp": ["They increase isolation", "They always cause stress", "They reduce confidence"], "mand": 0}, {"id": "HSC-02-015", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>social isolation<\/b> can harm health and wellbeing.", "a": ["Can cause <b>loneliness and depression<\/b> (1)", "Less <b>support<\/b> to cope with problems (1)", "May lead to <b>less activity<\/b> and poorer self-care (1)"], "cp": ["Can cause loneliness and depression", "Less support to cope with problems", "May lead to less activity and poorer self-care"], "dp": ["It improves mental health", "It has no effect on older adults", "It reduces stress always"], "mand": 0}, {"id": "HSC-02-016", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>stress<\/b> can affect health and wellbeing.", "a": ["<b>Physical<\/b> effects such as headaches, poor sleep or high blood pressure (1)", "<b>Emotional<\/b> effects such as anxiety or low mood (1)", "May lead to <b>unhealthy coping<\/b> such as smoking or drinking (1)"], "cp": ["Physical effects such as headaches, poor sleep or high blood pressure", "Emotional effects such as anxiety or low mood", "May lead to unhealthy coping such as smoking or drinking"], "dp": ["Stress always improves performance", "Stress only affects children", "Stress has no physical effect"], "mand": 0}, {"id": "HSC-02-017", "t": 2, "s": "A1", "k": "Explain", "m": 2, "ht": false, "q": "Why might some people be <b>unwilling to seek help<\/b> or use services?", "a": ["<b>Culture<\/b>, <b>gender<\/b> or <b>education<\/b> may shape their attitudes (1)", "They may feel <b>embarrassed<\/b>, fear stigma or not know what is available (1)"], "cp": ["Culture, gender or education may shape their attitudes", "They may feel embarrassed, fear stigma or not know what is available"], "dp": ["Services are always free", "Everyone seeks help equally", "It is only due to distance"], "mand": 0}, {"id": "HSC-02-018", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>financial resources<\/b> can affect health and wellbeing.", "a": ["More money can pay for <b>healthy food<\/b>, heating and activities (1)", "Low income can mean <b>poor diet or housing<\/b> (1)", "<b>Money worries<\/b> cause stress and anxiety (1)"], "cp": ["More money can pay for healthy food, heating and activities", "Low income can mean poor diet or housing", "Money worries cause stress and anxiety"], "dp": ["Income has no effect on health", "Only wealthy people feel stress", "Poor people always have better health"], "mand": 0}, {"id": "HSC-02-019", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>pollution<\/b> can affect health.", "a": ["Poor air quality can trigger <b>asthma<\/b> and breathing problems (1)", "Raises the risk of <b>heart and lung disease<\/b> (1)", "Can reduce <b>outdoor activity<\/b> and so fitness (1)"], "cp": ["Poor air quality can trigger asthma and breathing problems", "Raises the risk of heart and lung disease", "Can reduce outdoor activity and so fitness"], "dp": ["Pollution improves lung function", "It only affects the skin", "It has no long term effects"], "mand": 0}, {"id": "HSC-02-020", "t": 2, "s": "A1", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>noise<\/b> in the environment can affect wellbeing.", "a": ["Can disturb <b>sleep<\/b> (1)", "Can cause <b>stress and irritability<\/b> (1)"], "cp": ["Can disturb sleep", "Can cause stress and irritability"], "dp": ["Noise improves concentration", "Noise only affects hearing aids", "It has no effect"], "mand": 0}, {"id": "HSC-02-021", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>housing<\/b> can affect health and wellbeing.", "a": ["<b>Damp or cold<\/b> homes can cause breathing problems (1)", "<b>Overcrowding<\/b> spreads infection and causes stress (1)", "<b>Location<\/b> affects access to services, green space and support (1)"], "cp": ["Damp or cold homes can cause breathing problems", "Overcrowding spreads infection and causes stress", "Location affects access to services, green space and support"], "dp": ["Housing has no effect", "Only owning a home matters", "Damp improves health"], "mand": 0}, {"id": "HSC-02-022", "t": 2, "s": "A1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two relationship changes<\/b> that are life events.", "a": ["Any two (1 each):", "• Marriage or a new partner", "• Divorce or separation", "• Birth of a child", "• Bereavement"], "cp": ["Marriage or a new partner", "Divorce or separation", "Birth of a child", "Bereavement"], "dp": ["Moving house", "Redundancy", "Retirement"], "mand": 0}, {"id": "HSC-02-023", "t": 2, "s": "A1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two changes in life circumstances<\/b> that can affect wellbeing.", "a": ["Any two (1 each):", "• Redundancy or unemployment", "• Moving house, school or job", "• Retirement", "• Exclusion from education"], "cp": ["Redundancy or unemployment", "Moving house, school or job", "Retirement", "Exclusion from education"], "dp": ["Bereavement", "Divorce", "Marriage"], "mand": 0}, {"id": "HSC-02-024", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>life event<\/b>, such as redundancy, can affect wellbeing.", "a": ["Loss of <b>income<\/b> causes stress and financial worry (1)", "May lower <b>self-esteem<\/b> and sense of purpose (1)", "Less money may lead to <b>poorer diet and fewer activities<\/b> (1)"], "cp": ["Loss of income causes stress and financial worry", "May lower self-esteem and sense of purpose", "Less money may lead to poorer diet and fewer activities"], "dp": ["Redundancy always improves wellbeing", "It affects only physical health", "It has no effect on family"], "mand": 0}, {"id": "HSC-02-025", "t": 2, "s": "A1", "k": "Explain", "m": 2, "ht": false, "q": "Why can the <b>same factor<\/b> affect two people <b>differently<\/b>?", "a": ["People have different <b>needs, circumstances and support<\/b> (1)", "Factors are <b>linked<\/b>, so effects combine in different ways (1)"], "cp": ["People have different needs, circumstances and support", "Factors are linked, so effects combine in different ways"], "dp": ["Factors affect everyone identically", "Only age matters", "It cannot happen"], "mand": 0}, {"id": "HSC-02-026", "t": 2, "s": "A1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>factors can be linked<\/b>, using low income as an example.", "a": ["Low income can mean <b>poor housing<\/b> (1)", "Poor housing and money worries cause <b>stress<\/b> (1)", "Stress and poor diet harm <b>physical health<\/b> (1)"], "cp": ["Low income can mean poor housing", "Poor housing and money worries cause stress", "Stress and poor diet harm physical health"], "dp": ["Factors never interact", "Income only affects diet", "Housing affects only the weather"], "mand": 0}, {"id": "HSC-02-027", "t": 2, "s": "A1", "k": "Evaluate", "m": 3, "ht": false, "q": "A case study says an adult is <b>unemployed, lives alone and rarely exercises<\/b>. Which <b>two factors<\/b> are the most important to address, and why?", "a": ["<b>Social isolation<\/b>: risk of loneliness and low mood (1)", "<b>Inactivity<\/b>: risk to heart health and weight (1)", "Both can be improved with <b>support and low-cost activity<\/b> (1)"], "cp": ["Social isolation: risk of loneliness and low mood", "Inactivity: risk to heart health and weight", "Both can be improved with support and low-cost activity"], "dp": ["Genetic inheritance only", "Pollution only", "Personal hygiene only"], "mand": 0}, {"id": "HSC-02-028", "t": 2, "s": "A1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student lists 'drinking and smoking' as <b>social factors<\/b>. What is the <b>error<\/b>?", "a": ["They are <b>substance use<\/b>, a <b>physical and lifestyle<\/b> factor (1)", "Social factors are about <b>relationships and interactions<\/b> (1)"], "cp": ["They are substance use, a physical and lifestyle factor", "Social factors are about relationships and interactions"], "dp": ["They are economic factors", "They are environmental factors", "There is no error"], "mand": 0}, {"id": "HSC-02-029", "t": 2, "s": "A1", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is saying 'being poor makes you ill' a <b>weak<\/b> answer?", "a": ["It is <b>too general<\/b> and gives no linked effect (1)", "Good answers explain <b>how<\/b>, such as poor diet or stress (1)"], "cp": ["It is too general and gives no linked effect", "Good answers explain how, such as poor diet or stress"], "dp": ["It is too detailed", "Poverty never affects health", "Marks are given for opinions"], "mand": 0}, {"id": "HSC-03-001", "t": 3, "s": "B1", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four physiological indicators<\/b> in the specification.", "a": ["<b>Pulse<\/b>, including resting and recovery rate (1)", "<b>Blood pressure<\/b> (1)", "<b>Peak flow<\/b> (1)", "<b>Body mass index (BMI)<\/b> (1)"], "cp": ["Pulse, including resting and recovery rate", "Blood pressure", "Peak flow", "Body mass index (BMI)"], "dp": ["Diet, exercise, smoking, alcohol", "Height, hair colour, eye colour, age", "Cholesterol, blood sugar, vision, hearing"], "mand": 0}, {"id": "HSC-03-002", "t": 3, "s": "B1", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>physiological indicators<\/b> used for?", "a": ["They are <b>measurements of the body<\/b> (1)", "Used to <b>interpret health<\/b> and spot risks to physical health (1)"], "cp": ["They are measurements of the body", "Used to interpret health and spot risks to physical health"], "dp": ["They measure income", "They measure happiness only", "They are lifestyle choices"], "mand": 0}, {"id": "HSC-03-003", "t": 3, "s": "B1", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>normal resting pulse<\/b> for an adult, and how is it measured?", "a": ["<b>60 to 100 beats per minute<\/b> (1)", "Counting beats in <b>one minute<\/b> at rest, at the wrist or neck (1)"], "cp": ["60 to 100 beats per minute", "Counting beats in one minute at rest, at the wrist or neck"], "dp": ["20 to 40 beats per minute", "120 to 160 beats per minute", "Measured only after exercise"], "mand": 0}, {"id": "HSC-03-004", "t": 3, "s": "B1", "k": "Explain", "m": 3, "ht": false, "q": "A resting pulse is <b>above 100 beats per minute<\/b>. What might this suggest?", "a": ["A <b>high<\/b> resting pulse (1)", "May suggest <b>stress, illness, poor fitness or too much caffeine<\/b> (1)", "Persistently high rates add <b>strain on the heart<\/b> (1)"], "cp": ["A high resting pulse", "May suggest stress, illness, poor fitness or too much caffeine", "Persistently high rates add strain on the heart"], "dp": ["Excellent fitness only", "Low blood pressure only", "A healthy reading"], "mand": 0}, {"id": "HSC-03-005", "t": 3, "s": "B1", "k": "Explain", "m": 2, "ht": false, "q": "A resting pulse is <b>below 60<\/b>. Why is it <b>not always a problem<\/b>?", "a": ["Very <b>fit people<\/b> often have a lower resting pulse (1)", "But it can be a concern if with <b>dizziness or fainting<\/b> (1)"], "cp": ["Very fit people often have a lower resting pulse", "But it can be a concern if with dizziness or fainting"], "dp": ["It always means illness", "It means unfit", "Low pulse is impossible"], "mand": 0}, {"id": "HSC-03-006", "t": 3, "s": "B1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>recovery rate<\/b> after exercise?", "a": ["The <b>time taken for pulse to return<\/b> to its resting rate after exercise (1)", "A <b>shorter time<\/b> suggests better fitness (1)"], "cp": ["The time taken for pulse to return to its resting rate after exercise", "A shorter time suggests better fitness"], "dp": ["How fast you run", "The pulse during exercise only", "The time to fall asleep"], "mand": 0}, {"id": "HSC-03-007", "t": 3, "s": "B1", "k": "Explain", "m": 3, "ht": false, "q": "After exercise, Sam's pulse takes <b>10 minutes<\/b> to return to normal. Interpret this.", "a": ["A <b>slow recovery rate<\/b> (1)", "Suggests <b>lower fitness<\/b> (1)", "Regular exercise could <b>improve<\/b> it (1)"], "cp": ["A slow recovery rate", "Suggests lower fitness", "Regular exercise could improve it"], "dp": ["Excellent fitness", "It is a normal quick recovery", "It shows high blood pressure"], "mand": 0}, {"id": "HSC-03-008", "t": 3, "s": "B1", "k": "Definition", "m": 2, "ht": false, "q": "What does <b>blood pressure<\/b> measure?", "a": ["The <b>force of blood<\/b> against the artery walls (1)", "Measured in <b>millimetres of mercury (mmHg)<\/b> (1)"], "cp": ["The force of blood against the artery walls", "Measured in millimetres of mercury (mmHg)"], "dp": ["The amount of oxygen in blood", "The speed of breathing", "The number of heartbeats"], "mand": 0}, {"id": "HSC-03-009", "t": 3, "s": "B1", "k": "Definition", "m": 2, "ht": false, "q": "A reading is <b>120/80<\/b>. What do the two numbers show?", "a": ["<b>Systolic<\/b> (top): pressure when the heart <b>beats<\/b> (1)", "<b>Diastolic<\/b> (bottom): pressure when the heart <b>rests<\/b> between beats (1)"], "cp": ["Systolic (top): pressure when the heart beats", "Diastolic (bottom): pressure when the heart rests between beats"], "dp": ["Top is pulse and bottom is BMI", "Top is diastolic and bottom is systolic", "Both are peak flow readings"], "mand": 0}, {"id": "HSC-03-010", "t": 3, "s": "B1", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>ideal blood pressure<\/b> range and what is <b>high<\/b> blood pressure?", "a": ["Ideal: <b>90/60 up to under 120/80<\/b> (1)", "High: <b>140/90 or above<\/b> (1)"], "cp": ["Ideal: 90/60 up to under 120/80", "High: 140/90 or above"], "dp": ["Ideal is 160/100", "High is 100/70", "Ideal is 60/40"], "mand": 0}, {"id": "HSC-03-011", "t": 3, "s": "B1", "k": "Recall", "m": 1, "ht": false, "q": "What is classed as <b>low blood pressure<\/b>?", "a": ["<b>Below 90/60<\/b> (1)"], "cp": ["Below 90/60"], "dp": ["Below 120/80", "Below 140/90", "Below 60/40 only"], "mand": 0}, {"id": "HSC-03-012", "t": 3, "s": "B1", "k": "Explain", "m": 3, "ht": false, "q": "Explain the <b>health risks of high blood pressure<\/b>.", "a": ["Puts <b>strain on the heart and arteries<\/b> (1)", "Raises the risk of <b>heart attack and stroke<\/b> (1)", "Can damage the <b>kidneys<\/b> (1)"], "cp": ["Puts strain on the heart and arteries", "Raises the risk of heart attack and stroke", "Can damage the kidneys"], "dp": ["It improves circulation", "It has no health risks", "It only causes tiredness"], "mand": 0}, {"id": "HSC-03-013", "t": 3, "s": "B1", "k": "Explain", "m": 2, "ht": false, "q": "What symptoms can <b>low blood pressure<\/b> cause?", "a": ["<b>Dizziness<\/b> or light-headedness (1)", "<b>Fainting<\/b> or blurred vision (1)"], "cp": ["Dizziness or light-headedness", "Fainting or blurred vision"], "dp": ["Strong muscles", "Heart attack only", "No symptoms ever"], "mand": 0}, {"id": "HSC-03-014", "t": 3, "s": "B1", "k": "Interpret", "m": 3, "ht": false, "q": "Priya's blood pressure is <b>150/95<\/b>. Interpret this reading.", "a": ["It is <b>high<\/b> (140/90 or above) (1)", "Raises the risk of <b>heart disease and stroke<\/b> (1)", "She should <b>see her GP<\/b> and review lifestyle (1)"], "cp": ["It is high (140/90 or above)", "Raises the risk of heart disease and stroke", "She should see her GP and review lifestyle"], "dp": ["It is ideal", "It is low", "It is normal for all adults"], "mand": 0}, {"id": "HSC-03-015", "t": 3, "s": "B1", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two lifestyle changes<\/b> that can help lower high blood pressure.", "a": ["Any two (1 each):", "• Reduce salt in the diet", "• Take more regular exercise", "• Cut down alcohol", "• Stop smoking", "• Lose excess weight"], "cp": ["Reduce salt in the diet", "Take more regular exercise", "Cut down alcohol", "Stop smoking", "Lose excess weight"], "dp": ["Eat more salt", "Drink more alcohol", "Sit down more"], "mand": 0}, {"id": "HSC-03-016", "t": 3, "s": "B1", "k": "Definition", "m": 2, "ht": false, "q": "What does a <b>peak flow<\/b> reading measure?", "a": ["How <b>fast a person can blow air out<\/b> of the lungs (1)", "Measured in <b>litres per minute<\/b> using a peak flow meter (1)"], "cp": ["How fast a person can blow air out of the lungs", "Measured in litres per minute using a peak flow meter"], "dp": ["The size of the heart", "Blood pressure in the lungs", "The amount of food eaten"], "mand": 0}, {"id": "HSC-03-017", "t": 3, "s": "B1", "k": "Explain", "m": 2, "ht": false, "q": "Why is a person's peak flow compared with a <b>chart<\/b>?", "a": ["Normal readings depend on <b>height, age and sex<\/b> (1)", "The chart shows the <b>expected range<\/b> for that person (1)"], "cp": ["Normal readings depend on height, age and sex", "The chart shows the expected range for that person"], "dp": ["Everyone has the same reading", "Charts show weight only", "Only age matters"], "mand": 0}, {"id": "HSC-03-018", "t": 3, "s": "B1", "k": "Explain", "m": 3, "ht": false, "q": "A person has a <b>low peak flow<\/b> reading. What could this suggest?", "a": ["<b>Narrowed or inflamed airways<\/b> (1)", "May suggest a lung condition such as <b>asthma or COPD<\/b> (1)", "Could be linked to <b>smoking or pollution<\/b> (1)"], "cp": ["Narrowed or inflamed airways", "May suggest a lung condition such as asthma or COPD", "Could be linked to smoking or pollution"], "dp": ["Excellent lung health", "A high pulse", "High BMI only"], "mand": 0}, {"id": "HSC-03-019", "t": 3, "s": "B1", "k": "Explain", "m": 2, "ht": false, "q": "Why do people with <b>asthma<\/b> often monitor peak flow?", "a": ["To <b>track how well their airways are working<\/b> (1)", "A fall can <b>warn<\/b> an attack or poor control is coming (1)"], "cp": ["To track how well their airways are working", "A fall can warn an attack or poor control is coming"], "dp": ["To measure weight", "To check blood sugar", "To count their pulse"], "mand": 0}, {"id": "HSC-03-020", "t": 3, "s": "B1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>BMI<\/b> and how is it calculated?", "a": ["<b>Body mass index<\/b>, a measure of weight in relation to height (1)", "<b>Weight (kg) divided by height (m) squared<\/b> (1)"], "cp": ["Body mass index, a measure of weight in relation to height", "Weight (kg) divided by height (m) squared"], "dp": ["Height divided by weight", "Weight plus height", "Pulse divided by height"], "mand": 0}, {"id": "HSC-03-021", "t": 3, "s": "B1", "k": "Recall", "m": 4, "ht": false, "q": "State the <b>BMI categories<\/b> for adults.", "a": ["Under <b>18.5<\/b>: underweight (1)", "<b>18.5 to 24.9<\/b>: healthy weight (1)", "<b>25 to 29.9<\/b>: overweight (1)", "<b>30 or over<\/b>: obese (1)"], "cp": ["Under 18.5: underweight", "18.5 to 24.9: healthy weight", "25 to 29.9: overweight", "30 or over: obese"], "dp": ["Under 25 is underweight", "18.5 to 40 is healthy", "Over 20 is obese"], "mand": 0}, {"id": "HSC-03-022", "t": 3, "s": "B1", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the <b>BMI<\/b> for a person weighing <b>70 kg<\/b> and <b>1.75 m<\/b> tall. State the category.", "a": ["Height squared: 1.75 × 1.75 = <b>3.0625<\/b> (1)", "70 ÷ 3.0625 = <b>22.9<\/b> (1)", "<b>Healthy weight<\/b> (18.5 to 24.9) (1)"], "cp": ["Height squared: 1.75 × 1.75 = 3.0625", "70 ÷ 3.0625 = 22.9", "Healthy weight (18.5 to 24.9)"], "dp": ["70 ÷ 1.75 = 40", "22.9 is overweight", "1.75 ÷ 70 = 0.025"], "mand": 0}, {"id": "HSC-03-023", "t": 3, "s": "B1", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the <b>BMI<\/b> for a person weighing <b>90 kg<\/b> and <b>1.80 m<\/b> tall. State the category.", "a": ["Height squared: 1.8 × 1.8 = <b>3.24<\/b> (1)", "90 ÷ 3.24 = <b>27.8<\/b> (1)", "<b>Overweight<\/b> (25 to 29.9) (1)"], "cp": ["Height squared: 1.8 × 1.8 = 3.24", "90 ÷ 3.24 = 27.8", "Overweight (25 to 29.9)"], "dp": ["90 ÷ 1.8 = 50 so obese", "27.8 is healthy", "3.24 ÷ 90 = 0.036"], "mand": 0}, {"id": "HSC-03-024", "t": 3, "s": "B1", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the <b>BMI<\/b> for a person weighing <b>50 kg<\/b> and <b>1.70 m<\/b> tall. State the category.", "a": ["Height squared: 1.7 × 1.7 = <b>2.89<\/b> (1)", "50 ÷ 2.89 = <b>17.3<\/b> (1)", "<b>Underweight<\/b> (under 18.5) (1)"], "cp": ["Height squared: 1.7 × 1.7 = 2.89", "50 ÷ 2.89 = 17.3", "Underweight (under 18.5)"], "dp": ["50 ÷ 1.7 = 29.4 so overweight", "17.3 is healthy", "1.7 ÷ 50 = 0.034"], "mand": 0}, {"id": "HSC-03-025", "t": 3, "s": "B1", "k": "Explain", "m": 3, "ht": false, "q": "Explain the <b>health risks of a BMI in the obese range<\/b>.", "a": ["Higher risk of <b>type 2 diabetes<\/b> (1)", "Higher risk of <b>heart disease, stroke and high blood pressure<\/b> (1)", "Can affect <b>joints, mobility and self-esteem<\/b> (1)"], "cp": ["Higher risk of type 2 diabetes", "Higher risk of heart disease, stroke and high blood pressure", "Can affect joints, mobility and self-esteem"], "dp": ["It lowers all risks", "It only affects skin", "There are no risks"], "mand": 0}, {"id": "HSC-03-026", "t": 3, "s": "B1", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two risks of being underweight<\/b>.", "a": ["Any two (1 each):", "• Weak immune system and more infections", "• Lack of nutrients, such as anaemia", "• Weak bones or osteoporosis", "• Tiredness and low energy"], "cp": ["Weak immune system and more infections", "Lack of nutrients, such as anaemia", "Weak bones or osteoporosis", "Tiredness and low energy"], "dp": ["Type 2 diabetes", "Heart strain from extra weight", "Higher blood pressure from fat"], "mand": 0}, {"id": "HSC-03-027", "t": 3, "s": "B1", "k": "Evaluate", "m": 2, "ht": false, "q": "Give <b>two limitations of BMI<\/b>.", "a": ["Does not tell <b>muscle from fat<\/b>, so athletes may appear overweight (1)", "Does not show <b>where fat is stored<\/b> or reflect age, sex or ethnicity (1)"], "cp": ["Does not tell muscle from fat, so athletes may appear overweight", "Does not show where fat is stored or reflect age, sex or ethnicity"], "dp": ["It is always accurate", "It measures fitness directly", "It includes blood pressure"], "mand": 0}, {"id": "HSC-03-028", "t": 3, "s": "B1", "k": "Interpret", "m": 4, "ht": false, "q": "Ben, 45, has a <b>resting pulse of 95<\/b>, <b>blood pressure of 145/92<\/b> and a <b>BMI of 31<\/b>. Interpret his readings.", "a": ["Pulse is <b>at the top of normal<\/b> (60 to 100) (1)", "Blood pressure is <b>high<\/b> (140/90 or above) (1)", "BMI is in the <b>obese<\/b> range (30 or over) (1)", "Together they <b>raise the risk of heart disease<\/b> (1)"], "cp": ["Pulse is at the top of normal (60 to 100)", "Blood pressure is high (140/90 or above)", "BMI is in the obese range (30 or over)", "Together they raise the risk of heart disease"], "dp": ["All readings are ideal", "He is underweight", "His blood pressure is low"], "mand": 0}, {"id": "HSC-03-029", "t": 3, "s": "B1", "k": "Evaluate", "m": 3, "ht": false, "q": "Why should <b>several indicators<\/b> be used together rather than one?", "a": ["One reading may be <b>unusual by chance<\/b> (1)", "Indicators <b>give different information<\/b> about health (1)", "Together they give a <b>fuller picture of risk<\/b> (1)"], "cp": ["One reading may be unusual by chance", "Indicators give different information about health", "Together they give a fuller picture of risk"], "dp": ["One reading is always enough", "They always disagree", "Only BMI matters"], "mand": 0}, {"id": "HSC-03-030", "t": 3, "s": "B1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says a pulse of 55 in an athlete means <b>illness<\/b>. Why is this weak?", "a": ["A <b>low resting pulse<\/b> is common in very fit people (1)", "Readings must be <b>interpreted in context<\/b> (1)"], "cp": ["A low resting pulse is common in very fit people", "Readings must be interpreted in context"], "dp": ["55 is always dangerous", "Athletes have fast pulses", "Pulse is not measured"], "mand": 0}, {"id": "HSC-03-031", "t": 3, "s": "B1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says a <b>BMI of 26<\/b> means a person is obese. What is the error?", "a": ["26 is in the <b>overweight<\/b> range (25 to 29.9) (1)", "<b>Obese<\/b> starts at 30 (1)"], "cp": ["26 is in the overweight range (25 to 29.9)", "Obese starts at 30"], "dp": ["26 is underweight", "26 is healthy", "26 is severely obese"], "mand": 0}, {"id": "HSC-04-001", "t": 4, "s": "B2", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three lifestyle indicators<\/b> in the specification.", "a": ["<b>Smoking<\/b> (1)", "<b>Alcohol consumption<\/b> (1)", "<b>Inactive lifestyles<\/b> (1)"], "cp": ["Smoking", "Alcohol consumption", "Inactive lifestyles"], "dp": ["Pulse, blood pressure, BMI", "Diet, hygiene, housing", "Income, noise, pollution"], "mand": 0}, {"id": "HSC-04-002", "t": 4, "s": "B2", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>lifestyle indicators<\/b> and how do they differ from physiological ones?", "a": ["Information about a person's <b>habits and behaviour<\/b> (1)", "Physiological indicators are <b>body measurements<\/b> (1)"], "cp": ["Information about a person's habits and behaviour", "Physiological indicators are body measurements"], "dp": ["They measure blood pressure", "They are the same thing", "They are genetic"], "mand": 0}, {"id": "HSC-04-003", "t": 4, "s": "B2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three health risks of smoking<\/b>.", "a": ["Any three (1 each):", "• Lung cancer", "• Chronic obstructive pulmonary disease (COPD)", "• Heart disease", "• Stroke", "• Reduced fitness and breathlessness"], "cp": ["Lung cancer", "Chronic obstructive pulmonary disease (COPD)", "Heart disease", "Stroke", "Reduced fitness and breathlessness"], "dp": ["Improved lung capacity", "Lower blood pressure", "Stronger bones"], "mand": 0}, {"id": "HSC-04-004", "t": 4, "s": "B2", "k": "Explain", "m": 2, "ht": false, "q": "Which <b>substance in cigarettes<\/b> is addictive and which damages lungs?", "a": ["<b>Nicotine<\/b> is addictive (1)", "<b>Tar<\/b> damages the lungs and causes cancer (1)"], "cp": ["Nicotine is addictive", "Tar damages the lungs and causes cancer"], "dp": ["Caffeine is addictive", "Sugar damages lungs", "Fibre is addictive"], "mand": 0}, {"id": "HSC-04-005", "t": 4, "s": "B2", "k": "Explain", "m": 2, "ht": false, "q": "What is <b>passive smoking<\/b> and why is it a risk?", "a": ["<b>Breathing in other people's smoke<\/b> (1)", "Raises the risk of <b>lung disease, asthma and cancer<\/b> (1)"], "cp": ["Breathing in other people's smoke", "Raises the risk of lung disease, asthma and cancer"], "dp": ["Smoking in your sleep", "Quitting smoking", "A type of exercise"], "mand": 0}, {"id": "HSC-04-006", "t": 4, "s": "B2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>guideline for alcohol<\/b> for adults?", "a": ["No more than <b>14 units a week<\/b> (1)", "Spread over <b>three or more days<\/b> (1)"], "cp": ["No more than 14 units a week", "Spread over three or more days"], "dp": ["Up to 40 units a week", "14 units in a single night", "Alcohol has no guideline"], "mand": 0}, {"id": "HSC-04-007", "t": 4, "s": "B2", "k": "Definition", "m": 1, "ht": false, "q": "What is <b>one unit of alcohol<\/b>?", "a": ["<b>10 ml of pure alcohol<\/b> (1)"], "cp": ["10 ml of pure alcohol"], "dp": ["100 ml of any drink", "One glass of any size", "1 litre of beer"], "mand": 0}, {"id": "HSC-04-008", "t": 4, "s": "B2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three health risks of drinking too much alcohol<\/b>.", "a": ["Any three (1 each):", "• Liver disease", "• High blood pressure", "• Heart disease and stroke", "• Some cancers", "• Depression and anxiety", "• Accidents and injuries"], "cp": ["Liver disease", "High blood pressure", "Heart disease and stroke", "Some cancers", "Depression and anxiety", "Accidents and injuries"], "dp": ["Better memory", "Stronger liver", "Lower blood pressure"], "mand": 0}, {"id": "HSC-04-009", "t": 4, "s": "B2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>binge drinking<\/b> differs from regular moderate drinking.", "a": ["Drinking a <b>lot in a short time<\/b> (1)", "Brings <b>immediate risks<\/b> such as accidents, alcohol poisoning and risky behaviour (1)"], "cp": ["Drinking a lot in a short time", "Brings immediate risks such as accidents, alcohol poisoning and risky behaviour"], "dp": ["It is drinking slowly", "It means no alcohol", "It is always safe"], "mand": 0}, {"id": "HSC-04-010", "t": 4, "s": "B2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>recommended weekly physical activity<\/b> for adults?", "a": ["At least <b>150 minutes<\/b> of moderate activity (1)", "Plus <b>strengthening exercises<\/b> on two days (1)"], "cp": ["At least 150 minutes of moderate activity", "Plus strengthening exercises on two days"], "dp": ["30 minutes a month", "600 minutes of vigorous activity", "No activity is needed"], "mand": 0}, {"id": "HSC-04-011", "t": 4, "s": "B2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three health risks of an inactive lifestyle<\/b>.", "a": ["Any three (1 each):", "• Obesity", "• Heart disease", "• Type 2 diabetes", "• Weak bones and muscles", "• Poor mental health"], "cp": ["Obesity", "Heart disease", "Type 2 diabetes", "Weak bones and muscles", "Poor mental health"], "dp": ["Stronger heart", "Lower weight", "Better sleep always"], "mand": 0}, {"id": "HSC-04-012", "t": 4, "s": "B2", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two examples of moderate exercise<\/b>.", "a": ["Any two (1 each):", "• Brisk walking", "• Cycling", "• Swimming", "• Dancing"], "cp": ["Brisk walking", "Cycling", "Swimming", "Dancing"], "dp": ["Sitting", "Lying down", "Watching television"], "mand": 0}, {"id": "HSC-04-013", "t": 4, "s": "B2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>stopping smoking<\/b> improves health.", "a": ["<b>Lung function gradually improves<\/b> (1)", "Risk of <b>heart disease and cancer falls<\/b> (1)", "Saves <b>money<\/b> and improves fitness (1)"], "cp": ["Lung function gradually improves", "Risk of heart disease and cancer falls", "Saves money and improves fitness"], "dp": ["Risk of disease rises", "It has no effect", "It only helps lung cancer in non-smokers"], "mand": 0}, {"id": "HSC-04-014", "t": 4, "s": "B2", "k": "Interpret", "m": 4, "ht": false, "q": "Dan, 40, smokes <b>20 a day<\/b>, drinks <b>25 units a week<\/b> and does <b>no exercise<\/b>. Interpret his lifestyle indicators.", "a": ["Smoking puts him at risk of <b>lung disease and cancer<\/b> (1)", "Drinking is <b>above the 14 unit guideline<\/b> (1)", "Inactivity risks <b>heart disease and obesity<\/b> (1)", "Combined risks are <b>higher still<\/b> (1)"], "cp": ["Smoking puts him at risk of lung disease and cancer", "Drinking is above the 14 unit guideline", "Inactivity risks heart disease and obesity", "Combined risks are higher still"], "dp": ["All habits are healthy", "Only exercise is a risk", "His alcohol intake is within guidelines"], "mand": 0}, {"id": "HSC-04-015", "t": 4, "s": "B2", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says '<b>20 units a week<\/b> is within the guideline'. What is the error?", "a": ["The guideline is <b>14 units<\/b> or fewer (1)", "20 units is <b>above<\/b> the low-risk limit (1)"], "cp": ["The guideline is 14 units or fewer", "20 units is above the low-risk limit"], "dp": ["The guideline is 30 units", "It is correct", "Units do not matter"], "mand": 0}, {"id": "HSC-05-001", "t": 5, "s": "C1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>person-centred approach<\/b>?", "a": ["Putting the <b>individual at the centre<\/b> of decisions about their care (1)", "Considering their <b>needs, wishes and circumstances<\/b> (1)"], "cp": ["Putting the individual at the centre of decisions about their care", "Considering their needs, wishes and circumstances"], "dp": ["One plan for everyone", "The professional decides alone", "Treating the illness only"], "mand": 0}, {"id": "HSC-05-002", "t": 5, "s": "C1", "k": "Explain", "m": 3, "ht": false, "q": "Why is a <b>person-centred approach<\/b> important when planning improvements?", "a": ["The plan <b>suits the individual's circumstances<\/b> (1)", "They are more <b>motivated<\/b> to follow it (1)", "It respects their <b>choices and independence<\/b> (1)"], "cp": ["The plan suits the individual's circumstances", "They are more motivated to follow it", "It respects their choices and independence"], "dp": ["It is quicker to write", "It removes the person's choices", "It ignores wishes"], "mand": 0}, {"id": "HSC-05-003", "t": 5, "s": "C1", "k": "Recall", "m": 3, "ht": false, "q": "What <b>three things must an improvement plan include<\/b>?", "a": ["<b>Recommended actions<\/b> (1)", "<b>Short-term and long-term targets<\/b> (1)", "<b>Sources of support<\/b>, formal or informal (1)"], "cp": ["Recommended actions", "Short-term and long-term targets", "Sources of support, formal or informal"], "dp": ["A diagnosis and prescription", "A budget and invoice", "A timetable of lessons"], "mand": 0}, {"id": "HSC-05-004", "t": 5, "s": "C1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>short-term<\/b> and <b>long-term<\/b> targets?", "a": ["<b>Short-term<\/b>: achievable in <b>under six months<\/b> (1)", "<b>Long-term<\/b>: take <b>six months or more<\/b> (1)"], "cp": ["Short-term: achievable in under six months", "Long-term: take six months or more"], "dp": ["Short-term is over a year", "Long-term is under a month", "They are identical"], "mand": 0}, {"id": "HSC-05-005", "t": 5, "s": "C1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>recommended action<\/b> in an improvement plan?", "a": ["A <b>specific step<\/b> the person can take (1)", "Linked to improving their <b>health or wellbeing<\/b> (1)"], "cp": ["A specific step the person can take", "Linked to improving their health or wellbeing"], "dp": ["A medical diagnosis", "A rule from a teacher", "A past event"], "mand": 0}, {"id": "HSC-05-006", "t": 5, "s": "C1", "k": "Explain", "m": 3, "ht": false, "q": "Give an example of a <b>short-term target<\/b> for a person who is inactive. Make it specific.", "a": ["A <b>clear action<\/b>, such as walking for 20 minutes (1)", "With a <b>frequency<\/b>, such as three times a week (1)", "With a <b>time limit<\/b>, such as over the next 8 weeks (1)"], "cp": ["A clear action, such as walking for 20 minutes", "With a frequency, such as three times a week", "With a time limit, such as over the next 8 weeks"], "dp": ["Get fit", "Be healthy", "Run a marathon next week"], "mand": 0}, {"id": "HSC-05-007", "t": 5, "s": "C1", "k": "Explain", "m": 3, "ht": false, "q": "Give an example of a <b>long-term target<\/b> for a person with a high BMI.", "a": ["A <b>measurable aim<\/b>, such as BMI below 25 (1)", "With a <b>realistic time<\/b>, such as within 12 months (1)", "Reached through <b>gradual weight loss<\/b> (1)"], "cp": ["A measurable aim, such as BMI below 25", "With a realistic time, such as within 12 months", "Reached through gradual weight loss"], "dp": ["Lose 3 stone in a week", "Never eat again", "Have no target"], "mand": 0}, {"id": "HSC-05-008", "t": 5, "s": "C1", "k": "Explain", "m": 2, "ht": false, "q": "Why should targets be <b>realistic<\/b>?", "a": ["Unrealistic targets can lead to <b>failure and low motivation<\/b> (1)", "Realistic targets fit the person's <b>abilities and circumstances<\/b> (1)"], "cp": ["Unrealistic targets can lead to failure and low motivation", "Realistic targets fit the person's abilities and circumstances"], "dp": ["Harder is always better", "They should be vague", "Realism is irrelevant"], "mand": 0}, {"id": "HSC-05-009", "t": 5, "s": "C1", "k": "Explain", "m": 2, "ht": false, "q": "Why should targets be <b>specific and measurable<\/b>?", "a": ["Progress can be <b>checked<\/b> (1)", "The person knows <b>exactly what to aim for<\/b> (1)"], "cp": ["Progress can be checked", "The person knows exactly what to aim for"], "dp": ["They should be general", "Measuring is not allowed", "It makes planning harder"], "mand": 0}, {"id": "HSC-05-010", "t": 5, "s": "C1", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>formal sources of support<\/b>?", "a": ["<b>Trained professionals or organisations<\/b> (1)", "For example a <b>GP, nurse, dietitian or counsellor<\/b> (1)"], "cp": ["Trained professionals or organisations", "For example a GP, nurse, dietitian or counsellor"], "dp": ["Friends and neighbours", "Family only", "Social media"], "mand": 0}, {"id": "HSC-05-011", "t": 5, "s": "C1", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>informal sources of support<\/b>?", "a": ["Support from <b>family, friends or neighbours<\/b> (1)", "Not paid and <b>not professionally trained<\/b> (1)"], "cp": ["Support from family, friends or neighbours", "Not paid and not professionally trained"], "dp": ["A GP or nurse", "A hospital consultant", "A social worker"], "mand": 0}, {"id": "HSC-05-012", "t": 5, "s": "C1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three formal sources of support<\/b>.", "a": ["Any three (1 each):", "• GP", "• Practice nurse", "• Dietitian", "• Counsellor or therapist", "• NHS stop smoking service"], "cp": ["GP", "Practice nurse", "Dietitian", "Counsellor or therapist", "NHS stop smoking service"], "dp": ["Best friend", "Neighbour", "Brother"], "mand": 0}, {"id": "HSC-05-013", "t": 5, "s": "C1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two informal sources of support<\/b>.", "a": ["Any two (1 each):", "• Family", "• Friends", "• Neighbours"], "cp": ["Family", "Friends", "Neighbours"], "dp": ["GP", "Dietitian", "Counsellor"], "mand": 0}, {"id": "HSC-05-014", "t": 5, "s": "C1", "k": "Explain", "m": 3, "ht": false, "q": "Recommend <b>support<\/b> for a person who wants to <b>stop smoking<\/b>, and say why.", "a": ["<b>NHS stop smoking service<\/b> or GP for advice and aids (1)", "<b>Nicotine replacement<\/b> reduces cravings (1)", "<b>Family and friends<\/b> give encouragement (1)"], "cp": ["NHS stop smoking service or GP for advice and aids", "Nicotine replacement reduces cravings", "Family and friends give encouragement"], "dp": ["Buy more cigarettes", "Avoid all help", "Smoke less on weekends only"], "mand": 0}, {"id": "HSC-05-015", "t": 5, "s": "C1", "k": "Explain", "m": 3, "ht": false, "q": "Recommend <b>actions<\/b> for a person with <b>high blood pressure<\/b>.", "a": ["<b>Reduce salt<\/b> in the diet (1)", "Take <b>regular exercise<\/b> and keep a healthy weight (1)", "Cut down <b>alcohol<\/b> and visit the <b>GP<\/b> for monitoring (1)"], "cp": ["Reduce salt in the diet", "Take regular exercise and keep a healthy weight", "Cut down alcohol and visit the GP for monitoring"], "dp": ["Add more salt", "Stop all exercise", "Drink more alcohol"], "mand": 0}, {"id": "HSC-05-016", "t": 5, "s": "C1", "k": "Explain", "m": 3, "ht": false, "q": "Recommend <b>actions<\/b> for a person who is <b>overweight and inactive<\/b>.", "a": ["Gradually <b>increase activity<\/b>, such as walking or swimming (1)", "Move to a <b>balanced diet<\/b> with smaller portions (1)", "Get <b>advice<\/b> from a GP or dietitian (1)"], "cp": ["Gradually increase activity, such as walking or swimming", "Move to a balanced diet with smaller portions", "Get advice from a GP or dietitian"], " t is not working"], "dp": ["To punish failure", "Plans never change", "It is not needed"], "mand": 0}, {"id": "HSC-05-021", "t": 5, "s": "C1", "k": "Explain", "m": 4, "ht": false, "q": "Case study: Aisha, 52, is a <b>smoker<\/b>, has <b>high BMI<\/b> and works long hours. Recommend <b>two actions<\/b> with a reason for each.", "a": ["<b>Action 1<\/b>: use the NHS stop smoking service (1)", "<b>Reason<\/b>: reduces lung and heart risk (1)", "<b>Action 2<\/b>: walk for 20 minutes after work (1)", "<b>Reason<\/b>: fits her schedule and helps weight and stress (1)"], "cp": ["Action 1: use the NHS stop smoking service", "Reason: reduces lung and heart risk", "Action 2: walk for 20 minutes after work", "Reason: fits her schedule and helps weight and stress"], "dp": ["Work more hours", "Ignore the smoking", "Start a strict crash diet"], "mand": 0}, {"id": "HSC-05-022", "t": 5, "s": "C1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student recommends '<b>go to the gym every day<\/b>' for someone who works two jobs. What is the weakness?", "a": ["It is <b>not realistic<\/b> for the person's circumstances (1)", "The plan must <b>suit their time and resources<\/b> (1)"], "cp": ["It is not realistic for the person's circumstances", "The plan must suit their time and resources"], "dp": ["It is perfect", "Gyms are unhealthy", "Daily exercise is illegal"], "mand": 0}, {"id": "HSC-05-023", "t": 5, "s": "C1", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'eat healthier'<\/b> a weak target?", "a": ["It is <b>vague<\/b> and cannot be measured (1)", "A good target is <b>specific, with a timescale<\/b> (1)"], "cp": ["It is vague and cannot be measured", "A good target is specific, with a timescale"], "dp": ["It is too specific", "It is always full marks", "Targets must be vague"], "mand": 0}, {"id": "HSC-05-024", "t": 5, "s": "C3 C", "k": "Definition", "m": 5, "ht": false, "q": "What does <b>SMART<\/b> stand for when setting targets?", "a": ["<b>S<\/b>pecific (1)", "<b>M<\/b>easurable (1)", "<b>A<\/b>chievable (1)", "<b>R<\/b>ealistic (1)", "<b>T<\/b>ime-bound (1)"], "cp": ["Specific", "Measurable", "Achievable", "Realistic", "Time-bound"], "dp": ["Simple, Medium, Active, Regular, Timed", "Safe, Mild, Average, Rapid, Total", "Slow, Mental, Active, Real, Tough"], "mand": 0}, {"id": "HSC-06-001", "t": 6, "s": "C2", "k": "Definition", "m": 1, "ht": false, "q": "What is an <b>obstacle<\/b> to an improvement plan?", "a": ["A <b>circumstance that prevents<\/b> the person following or completing the plan (1)"], "cp": ["A circumstance that prevents the person following or completing the plan"], "dp": ["A medical test", "A target already met", "A source of support"], "mand": 0}, {"id": "HSC-06-002", "t": 6, "s": "C2", "k": "Recall", "m": 4, "ht": false, "q": "Give <b>four types of obstacle<\/b> to implementing a plan.", "a": ["Any four (1 each):", "• Emotional or psychological", "• Time constraints", "• Availability of resources", "• Unachievable targets", "• Lack of support", "• Barriers to accessing services"], "cp": ["Emotional or psychological", "Time constraints", "Availability of resources", "Unachievable targets", "Lack of support", "Barriers to accessing services"], "dp": ["Excellent motivation", "Strong support", "Free time"], "mand": 0}, {"id": "HSC-06-003", "t": 6, "s": "C2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three emotional or psychological obstacles<\/b>.", "a": ["Any three (1 each):", "• Lack of motivation", "• Low self-esteem", "• Acceptance of the current state", "• Fear of failure"], "cp": ["Lack of motivation", "Low self-esteem", "Acceptance of the current state", "Fear of failure"], "dp": ["Too much money", "Too much time", "Good support"], "mand": 0}, {"id": "HSC-06-004", "t": 6, "s": "C2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>low self-esteem<\/b> can be an obstacle.", "a": ["The person may <b>doubt they can succeed<\/b> (1)", "So they may <b>give up early<\/b> or not start (1)"], "cp": [
