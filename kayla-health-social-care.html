r facilities nearby (1)", "Plan becomes <b>hard to carry out<\/b> (1)"], "cp": ["Financial: cannot afford gym fees or healthy food", "Physical: no equipment or facilities nearby", "Plan becomes hard to carry out"], "dp": ["Resources are always free", "Only money matters", "Facilities are always close"], "mand": 0}, {"id": "HSC-06-009", "t": 6, "s": "C2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>unachievable targets<\/b> can be an obstacle.", "a": ["Targets may be <b>too hard for the individual<\/b> or in too short a time (1)", "This leads to <b>failure and loss of motivation<\/b> (1)"], "cp": ["Targets may be too hard for the individual or in too short a time", "This leads to failure and loss of motivation"], "dp": ["Hard targets always work", "They are never an obstacle", "They are always motivating"], "mand": 0}, {"id": "HSC-06-010", "t": 6, "s": "C2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how a <b>lack of support<\/b> can be an obstacle.", "a": ["No <b>encouragement<\/b> from family or friends (1)", "Harder to <b>stay motivated<\/b> and cope with setbacks (1)"], "cp": ["No encouragement from family or friends", "Harder to stay motivated and cope with setbacks"], "dp": ["Support is always available", "It helps the plan", "It is not an obstacle"], "mand": 0}, {"id": "HSC-06-011", "t": 6, "s": "C2", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two other individual factors<\/b> that may be obstacles.", "a": ["Any two (1 each):", "• Ability or disability", "• Addiction", "• Long-term illness"], "cp": ["Ability or disability", "Addiction", "Long-term illness"], "dp": ["Excellent health", "No commitments", "Good motivation"], "mand": 0}, {"id": "HSC-06-012", "t": 6, "s": "C2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three barriers to accessing services<\/b>.", "a": ["Any three (1 each):", "• Cost of travel or charges", "• Distance and poor transport", "• Language or communication needs", "• Physical or sensory difficulties", "• Fear or stigma"], "cp": ["Cost of travel or charges", "Distance and poor transport", "Language or communication needs", "Physical or sensory difficulties", "Fear or stigma"], "dp": ["Short waiting lists", "Free taxis", "Services next door"], "mand": 0}, {"id": "HSC-06-013", "t": 6, "s": "C2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how an obstacle of <b>cost<\/b> can be overcome.", "a": ["Choose <b>free activities<\/b>, such as walking or parks (1)", "Use <b>subsidised or free NHS services<\/b> (1)", "Look for <b>community schemes or discounts<\/b> (1)"], "cp": ["Choose free activities, such as walking or parks", "Use subsidised or free NHS services", "Look for community schemes or discounts"], "dp": ["Ignore the plan", "Spend more money", "Do nothing"], "mand": 0}, {"id": "HSC-06-014", "t": 6, "s": "C2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>lack of time<\/b> can be overcome.", "a": ["Fit short sessions into the day, such as <b>10 minutes of activity<\/b> (1)", "<b>Plan ahead<\/b> and prepare meals in advance (1)", "Ask <b>family<\/b> to share childcare or chores (1)"], "cp": ["Fit short sessions into the day, such as 10 minutes of activity", "Plan ahead and prepare meals in advance", "Ask family to share childcare or chores"], "dp": ["Work more hours", "Drop the plan", "Sleep less"], "mand": 0}, {"id": "HSC-06-015", "t": 6, "s": "C2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>low motivation<\/b> can be overcome.", "a": ["Set <b>small, achievable targets<\/b> and celebrate success (1)", "Exercise with a <b>friend or group<\/b> (1)", "Track progress and get <b>encouragement<\/b> (1)"], "cp": ["Set small, achievable targets and celebrate success", "Exercise with a friend or group", "Track progress and get encouragement"], "dp": ["Set impossible targets", "Avoid all support", "Stop trying"], "mand": 0}, {"id": "HSC-06-016", "t": 6, "s": "C2", "k": "Explain", "m": 2, "ht": false, "q": "How can <b>lack of support<\/b> be overcome?", "a": ["Join a <b>support or community group<\/b> (1)", "Use <b>formal services<\/b> such as a GP or counsellor (1)"], "cp": ["Join a support or community group", "Use formal services such as a GP or counsellor"], "dp": ["Avoid people", "Hide the plan", "Wait for it to improve"], "mand": 0}, {"id": "HSC-06-017", "t": 6, "s": "C2", "k": "Explain", "m": 2, "ht": false, "q": "How can a <b>physical disability<\/b> obstacle be overcome?", "a": ["Choose <b>adapted activities<\/b>, such as chair exercises or swimming (1)", "Get advice from a <b>physiotherapist or GP<\/b> (1)"], "cp": ["Choose adapted activities, such as chair exercises or swimming", "Get advice from a physiotherapist or GP"], "dp": ["Ignore all exercise", "Give up the plan", "Run daily"], "mand": 0}, {"id": "HSC-06-018", "t": 6, "s": "C2", "k": "Explain", "m": 3, "ht": false, "q": "Case study: Tom, 17, wants to run <b>5 km three times a week<\/b> but works late and has <b>little money<\/b>. Identify <b>two obstacles<\/b> and a solution to one.", "a": ["Obstacle: <b>time constraints<\/b> from late work (1)", "Obstacle: <b>limited money<\/b> for equipment or gym (1)", "Solution: run in <b>free parks<\/b> at weekends or early (1)"], "cp": ["Obstacle: time constraints from late work", "Obstacle: limited money for equipment or gym", "Solution: run in free parks at weekends or early"], "dp": ["No obstacles exist", "Obstacles are never solvable", "Tom has too much free time"], "mand": 0}, {"id": "HSC-06-019", "t": 6, "s": "C2", "k": "Justify", "m": 3, "ht": false, "q": "Justify why a plan should <b>anticipate obstacles<\/b>.", "a": ["It makes the plan <b>more realistic<\/b> (1)", "The person has <b>ready solutions<\/b> if problems arise (1)", "It increases the chance of <b>sticking to the plan<\/b> (1)"], "cp": ["It makes the plan more realistic", "The person has ready solutions if problems arise", "It increases the chance of sticking to the plan"], "dp": ["Obstacles never occur", "It makes plans fail", "It is not required"], "mand": 0}, {"id": "HSC-06-020", "t": 6, "s": "C2", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes 'the obstacle is that Sam is lazy'. Why is this <b>weak<\/b>?", "a": ["It is a <b>judgement<\/b>, not an explained obstacle (1)", "A good answer names a real obstacle, such as <b>lack of motivation or time<\/b> (1)"], "cp": ["It is a judgement, not an explained obstacle", "A good answer names a real obstacle, such as lack of motivation or time"], "dp": ["It is a strong answer", "Laziness is a care value", "Judgements earn marks"], "mand": 0}, {"id": "HSC-06-021", "t": 6, "s": "C2", "k": "Exam trap", "m": 2, "ht": false, "q": "Why must a <b>solution<\/b> be linked to the obstacle?", "a": ["A solution must <b>directly address<\/b> the problem named (1)", "Unlinked suggestions <b>do not show understanding<\/b> (1)"], "cp": ["A solution must directly address the problem named", "Unlinked suggestions do not show understanding"], "dp": ["Any solution is fine", "Links lose marks", "Solutions are not needed"], "mand": 0}, {"id": "HSC-07-001", "t": 7, "s": "C1 A1", "k": "Recall", "m": 4, "ht": false, "q": "What does <b>PIES<\/b> stand for?", "a": ["<b>P<\/b>hysical (1)", "<b>I<\/b>ntellectual (1)", "<b>E<\/b>motional (1)", "<b>S<\/b>ocial (1)"], "cp": ["Physical", "Intellectual", "Emotional", "Social"], "dp": ["Personal, income, education, safety", "Planning, implementing, evaluating, supporting", "Pulse, intake, exercise, sleep"], "mand": 0}, {"id": "HSC-07-002", "t": 7, "s": "C1 A1", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>first three life stages<\/b> and their ages.", "a": ["<b>Infancy<\/b>: birth to 2 years (1)", "<b>Early childhood<\/b>: 3 to 8 years (1)", "<b>Adolescence<\/b>: 9 to 18 years (1)"], "cp": ["Infancy: birth to 2 years", "Early childhood: 3 to 8 years", "Adolescence: 9 to 18 years"], "dp": ["Infancy 0 to 10", "Early childhood 10 to 15", "Adolescence 15 to 30"], "mand": 0}, {"id": "HSC-07-003", "t": 7, " >menopause<\/b>?", "a": ["When a woman's <b>periods stop<\/b> and she can no longer conceive, usually in middle adulthood (1)"], "cp": ["When a woman's periods stop and she can no longer conceive, usually in middle adulthood"], "dp": ["The start of puberty", "The first period", "A type of infection"], "mand": 0}, {"id": "HSC-07-008", "t": 7, "s": "C1 A1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two aspects of intellectual development<\/b>.", "a": ["Any two (1 each):", "• Language development", "• Problem solving", "• Abstract or creative thinking", "• Memory and recall"], "cp": ["Language development", "Problem solving", "Abstract or creative thinking", "Memory and recall"], "dp": ["Making friends", "Bonding", "Walking"], "mand": 0}, {"id": "HSC-07-009", "t": 7, "s": "C1 A1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>bonding and attachment<\/b> in emotional development?", "a": ["A <b>close emotional relationship<\/b> between a baby and carer (1)", "Gives <b>security<\/b> and affects later relationships (1)"], "cp": ["A close emotional relationship between a baby and carer", "Gives security and affects later relationships"], "dp": ["Learning to read", "Physical growth", "Moving house"], "mand": 0}, {"id": "HSC-07-010", "t": 7, "s": "C1 A1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>socialisation<\/b>?", "a": ["The process of <b>learning the norms and values<\/b> of society (1)", "Through family, school, friends and wider community (1)"], "cp": ["The process of learning the norms and values of society", "Through family, school, friends and wider community"], "dp": ["Learning to walk", "Moving out", "Avoiding other people"], "mand": 0}, {"id": "HSC-07-011", "t": 7, "s": "C1 A2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three physical factors<\/b> that affect growth and development.", "a": ["Any three (1 each):", "• Genetic inheritance", "• Illness and disease", "• Diet and lifestyle choices", "• Appearance"], "cp": ["Genetic inheritance", "Illness and disease", "Diet and lifestyle choices", "Appearance"], "dp": ["Income", "Culture", "Role models"], "mand": 0}, {"id": "HSC-07-012", "t": 7, "s": "C1 A2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three social and cultural factors<\/b> that affect development.", "a": ["Any three (1 each):", "• Culture and religion", "• Educational experiences", "• Role models", "• Social isolation", "• Relationships with friends and family"], "cp": ["Culture and religion", "Educational experiences", "Role models", "Social isolation", "Relationships with friends and family"], "dp": ["Genetic inheritance", "Income", "Diet"], "mand": 0}, {"id": "HSC-07-013", "t": 7, "s": "C1 A2", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two economic factors<\/b> that affect development.", "a": ["Any two (1 each):", "• Income and wealth", "• Material possessions"], "cp": ["Income and wealth", "Material possessions"], "dp": ["Role models", "Diet", "Culture"], "mand": 0}, {"id": "HSC-07-014", "t": 7, "s": "C1 B1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three types of life event<\/b> that can affect development.", "a": ["<b>Physical<\/b>: accident, injury or ill health (1)", "<b>Relationship changes<\/b>: marriage, divorce, bereavement (1)", "<b>Life circumstances<\/b>: moving, redundancy, retirement (1)"], "cp": ["Physical: accident, injury or ill health", "Relationship changes: marriage, divorce, bereavement", "Life circumstances: moving, redundancy, retirement"], "dp": ["Birthdays only", "Weather events", "Holidays only"], "mand": 0}, {"id": "HSC-07-015", "t": 7, "s": "C1 B1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between an <b>expected<\/b> and an <b>unexpected<\/b> life event?", "a": ["<b>Expected<\/b>: predicted or planned, such as starting school or retiring (1)", "<b>Unexpected<\/b>: sudden, such as an accident or redundancy (1)"], "cp": ["Expected: predicted or planned, such as starting school or retiring", "Unexpected: sudden, such as an accident or redundancy"], "dp": ["Expected events are always bad", "Unexpected events are planned", "There is no difference"], "mand": 0}, {"id": "HSC-07-016", "t": 7, "s": "C1 B2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three sources of support<\/b> for coping with life events.", "a": ["Any three (1 each):", "• Family, friends and partners", "• Professional carers and services", "• Community groups", "• Voluntary organisations", "• Faith-based organisations"], "cp": ["Family, friends and partners", "Professional carers and services", "Community groups", "Voluntary organisations", "Faith-based organisations"], "dp": ["Being alone", "Avoiding the problem", "Social media only"], "mand": 0}, {"id": "HSC-07-017", "t": 7, "s": "C1 B2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of support<\/b>.", "a": ["<b>Emotional<\/b> support (1)", "<b>Information and advice<\/b> (1)", "<b>Practical help<\/b>, such as financial help or childcare (1)"], "cp": ["Emotional support", "Information and advice", "Practical help, such as financial help or childcare"], "dp": ["Legal, military and religious", "Physical only", "Medical only"], "mand": 0}, {"id": "HSC-07-018", "t": 7, "s": "C1 B2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>bereavement<\/b> can affect the four areas of PIES.", "a": ["<b>Emotional<\/b>: grief, sadness, loss of security (1)", "<b>Social<\/b>: may withdraw from friends or lose a relationship (1)", "<b>Physical<\/b>: poor sleep or appetite (1)"], "cp": ["Emotional: grief, sadness, loss of security", "Social: may withdraw from friends or lose a relationship", "Physical: poor sleep or appetite"], "dp": ["No effects", "Only physical", "Only intellectual"], "mand": 0}, {"id": "HSC-07-019", "t": 7, "s": "C1 B2", "k": "Explain", "m": 2, "ht": false, "q": "Why might two people react <b>differently<\/b> to the same life event?", "a": ["Different <b>personalities and past experiences<\/b> (1)", "Diffe    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
    ${missed.length?`<button class="btn" onclick="replay()">Retry ${missed.length} missed</button>`:""}
    <button class="btn ghost" onclick="go('home')">Back to home</button></div>
   ${missed.length?`<h2>Review</h2><div style="text-align:left">${missed.map(c=>`<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span></summary><div class="body"><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`).join("")}</div>`:""}
  </div>`;
  R.missed=missed;
}
function confetti(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cols=[CFG.accent,CFG.accent2,"#ffb84d","#3ddc97","#ffffff"];for(let i=0;i<46;i++){const s=document.createElement("i");s.className="conf";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.animationDuration=(1.8+Math.random()*1.6)+"s";s.style.animationDelay=(Math.random()*.5)+"s";s.style.borderRadius=i%3?"2px":"50%";document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function replay(){const m=R.missed;R={cards:shuffle(m.slice()),i:0,earned:0,max:0,hearts:null,survival:false,label:"Retry",rev:false,sel:[],log:[],over:false};prep();view="round";render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* ---------- library ---------- */
function library(){
  const kinds=[...new Set(DATA.map(c=>c.k))].sort();
  $("#app").innerHTML=`<div class="lib"><h1>Card <span class="grad">library</span></h1><p class="sub">Every question with its full mark scheme. Tap a card to open it.</p>
  <div class="chips">${[0].concat(TN).map(t=>`<button class="chip ${LIB.t===t?"on":""}" onclick="LIB.t=${t};library()">${t?"Topic "+t:"All topics"}</button>`).join("")}</div>
  <div class="chips"><input type="search" id="lq" placeholder="Search questions and answers" value="${LIB.q.replace(/"/g,"&quot;")}"><select id="lk"><option value="">All question types</option>${kinds.map(k=>`<option ${LIB.k===k?"selected":""}>${k}</option>`).join("")}</select><button class="chip" id="lo">Open all</button></div>
  <div id="lres"></div></div>`;
  const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
render();
</script>
