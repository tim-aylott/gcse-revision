<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayla Business Studies">
<meta name="theme-color" content="#0d1020">
<title>Kayla's Business Studies Lab | GCSE AQA revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#8b7bff;--accent2:#38d0f0;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v3M12 17v3M5 12h14"/><circle cx="12" cy="7" r="0.5"/><circle cx="12" cy="17" r="0.5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span>Business Studies Lab</span></button>
  <span class="pill">Kayla | AQA</span>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>

sks (1)"], "cp": ["Benefit: reaches more customers", "Benefit: lower costs than a shop", "Drawback: delivery and returns costs", "Drawback: security and competition risks"], "dp": ["Benefit: customers cannot reach the site", "Drawback: no website is needed", "Benefit: it removes competitors"], "mand": 0}, {"id": "BUS-02-004", "t": 2, "s": "3.2.2", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>ethical issue<\/b> in business?", "a": ["A question of what is <b>morally right or wrong<\/b> (1)", "e.g. <b>fair pay, honest advertising or sourcing<\/b> (1)"], "cp": ["A question of what is morally right or wrong", "e.g. fair pay, honest advertising or sourcing"], "dp": ["A question about tax rates", "A question about stock levels", "A question about colours"], "mand": 0}, {"id": "BUS-02-005", "t": 2, "s": "3.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one cost and one benefit<\/b> of acting ethically.", "a": ["Benefit: <b>good reputation<\/b> attracts customers (1)", "Benefit: better <b>staff loyalty<\/b> (1)", "Cost: ethical sourcing or pay can <b>raise costs<\/b> (1)"], "cp": ["Benefit: good reputation attracts customers", "Benefit: better staff loyalty", "Cost: ethical sourcing or pay can raise costs"], "dp": ["No benefit at all", "It always makes products cheaper", "It always reduces sales"], "mand": 0}, {"id": "BUS-02-006", "t": 2, "s": "3.2.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> a business can reduce its environmental impact.", "a": ["Any three (1 each):", "• <b>recycle<\/b> materials", "• use <b>renewable energy<\/b>", "• cut <b>packaging and waste<\/b>", "• use <b>ethical suppliers<\/b>", "• reduce <b>transport emissions<\/b>"], "cp": ["recycle materials", "use renewable energy", "cut packaging and waste", "use ethical suppliers", "reduce transport emissions"], "dp": ["Burn more waste", "Use more plastic", "Ignore waste rules"], "mand": 0}, {"id": "BUS-02-007", "t": 2, "s": "3.2.3", "k": "Definition", "m": ", "A charity in the UK only", "A business with no staff"], "mand": 0}, {"id": "BUS-02-011", "t": 2, "s": "3.2.4", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three pieces of legislation<\/b> that affect businesses.", "a": ["Any three (1 each):", "• <b>Equality Act<\/b>", "• <b>Consumer Rights Act<\/b>", "• <b>Health and Safety at Work Act<\/b>", "• <b>National Minimum Wage<\/b> law", "• data protection law"], "cp": ["Equality Act", "Consumer Rights Act", "Health and Safety at Work Act", "National Minimum Wage law", "data protection law"], "dp": ["A law about fish only", "A law about holidays only", "A law only for charities"], "mand": 0}, {"id": "BUS-02-012", "t": 2, "s": "3.2.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>consumer law<\/b> affects a business.", "a": ["Goods must be of <b>satisfactory quality<\/b> and as described (1)", "Businesses must provide <b>refunds or repairs<\/b> if faulty (1)", "Breaking the law can lead to <b>fines and bad publicity<\/b> (1)"], "cp": ["Goods must be of satisfactory quality and as described", "Businesses must provide refunds or repairs if faulty", "Breaking the law can lead to fines and bad publicity"], "dp": ["It lets firms sell faulty goods", "It bans all refunds", "It removes all costs"], "mand": 0}, {"id": "BUS-02-013", "t": 2, "s": "3.2.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>employment law<\/b> affects a business.", "a": ["Businesses must pay at least the <b>minimum wage<\/b> (1)", "They must provide <b>safe working conditions<\/b> (1)", "They must not <b>discriminate<\/b>; compliance adds costs but protects staff (1)"], "cp": ["Businesses must pay at least the minimum wage", "They must provide safe working conditions", "They must not discriminate; compliance adds costs but protects staff"], "dp": ["It lets firms pay nothing", "It allows discrimination", "It removes safety rules"], "mand": 0}, {"id": "BUS-02-014", "t": 2, "s": "3.2.5", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three economic factors<\/b> that affect businesses.", "a": ["Any three (1 each):", "• <b>interest rates<\/b>", "• <b>exchange rates<\/b>", "• <b>unemployment<\/b>", "• <b>taxation<\/b>", "• <b>inflation<\/b>", "• <b>consumer income<\/b>"], "cp": ["interest rates", "exchange rates", "unemployment", "taxation", "inflation", "consumer income"], "dp": ["Weather and rainfall", "Moon phases", "Football results"], "mand": 0}, {"id": "BUS-02-015", "t": 2, "s": "3.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>rise in interest rates<\/b> affects a business.", "a": ["Loan and overdraft <b>repayments cost more<\/b> (1)", "Consumers <b>save more and borrow less<\/b>, cutting demand (1)", "Business may <b>delay investment<\/b> (1)"], "cp": ["Loan and overdraft repayments cost more", "Consumers save more and borrow less, cutting demand", "Business may delay investment"], "dp": ["Loans become free", "Customers always spend more", "It reduces interest on all loans"], "mand": 0}, {"id": "BUS-02-016", "t": 2, "s": "3.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>stronger pound<\/b> affects a UK exporter.", "a": ["UK exports become <b>more expensive<\/b> for overseas customers (1)", "Demand may <b>fall<\/b> (1)", "Imported materials get <b>cheaper<\/b> (1)"], "cp": ["UK exports become more expensive for overseas customers", "Demand may fall", "Imported materials get cheaper"], "dp": ["UK exports become cheaper", "It has no effect on exporters", "Imports become more expensive"], "mand": 0}, {"id": "BUS-02-017", "t": 2, "s": "3.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>unemployment and consumer income<\/b> influence demand.", "a": ["Higher unemployment means <b>lower incomes<\/b> (1)", "Consumers spend less, so <b>demand falls<\/b> (1)", "Businesses may <b>cut prices<\/b> or lose sales (1)"], "cp": ["Higher unemployment means lower incomes", "Consumers spend less, so demand falls", "Businesses may cut prices or lose sales"], "dp": ["Unemployment always increases spending", "Incomes do not affect demand", "Demand always rises in a recession"], "mand": 0}, {"id": "BUS-02-018", "t": 2, "s": "3.2.6", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> a business can compete.", "a": ["Any three (1 each):", "• <b>price<\/b>", "• <b>quality<\/b>", "• <b>customer service<\/b>", "• <b>branding and design<\/b>", "• <b>convenience<\/b> or location", "• <b>innovation<\/b>"], "cp": ["price", "quality", "customer service", "branding and design", "convenience or location", "innovation"], "dp": ["Hiding the product", "Refusing customers", "Closing on weekdays"], "mand": 0}, {"id": "BUS-02-019", "t": 2, "s": "3.2.6", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a business can <b>respond to a new competitor<\/b>.", "a": ["Improve <b>quality or service<\/b> (1)", "Adjust <b>price or promotions<\/b> (1)", "Innovate or <b>differentiate<\/b> the product (1)"], "cp": ["Improve quality or service", "Adjust price or promotions", "Innovate or differentiate the product"], "dp": ["Ignore customers", "Always raise prices", "Close immediately"], "mand": 0}, {"id": "BUS-02-020", "t": 2, "s": "3.2.6", "k": "Evaluate", "m": 3, "ht": false, "q": "Evaluate whether competing on <b>price<\/b> is a good strategy.", "a": ["Advantage: attracts <b>price-sensitive<\/b> customers (1)", "Disadvantage: lowers <b>profit margins<\/b> (1)", "Disadvantage: <b>competitors can copy<\/b> price cuts (1)"], "cp": ["Advantage: attracts price-sensitive customers", "Disadvantage: lowers profit margins", "Disadvantage: competitors can copy price cuts"], "dp": ["It always increases profit", "It cannot attract customers", "Prices never matter"], "mand": 0}, {"id": "BUS-02-021", "t": 2, "s": "3.2.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says <b>'a high-tech business never has problems'<\/b>. What is wrong?", "a": ["Technology can have <b>high set-up costs<\/b> (1)", "There are <b>security, training and breakdown<\/b> risks (1)"], "cp": ["Technology can have high set-up costs", "There are security, training and breakdown risks"], "dp": ["Technology never costs money", "Technology never breaks", "Technology removes all competition"], "mand": 0}, {"id": "BUS-02-022", "t": 2, "s": "3.2.4", "k": "Exam trap", "m": 2, "ht": false, "q": "An answer says <b>'laws only help the business'<\/b>. What does it miss?", "a": ["Laws also <b>protect consumers and employees<\/b> (1)", "They can <b>add costs and rules<\/b> for the business (1)"], "cp": ["Laws also protect consumers and employees", "They can add costs and rules for the business"], "dp": ["Laws only protect owners", "Laws never cost money", "Laws are optional"], "mand": 0}, {"id": "BUS-02-023", "t": 2, "s": "3.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>pressure groups<\/b> can influence a business.", "a": ["They can <b>campaign publicly<\/b> against practices (1)", "This can <b>damage reputation<\/b> and sales (1)", "Business may <b>change behaviour<\/b> to protect image (1)"], "cp": ["They can campaign publicly against practices", "This can damage reputation and sales", "Business may change behaviour to protect image"], "dp": ["They have no effect", "They set the business's prices", "They own the business"], "mand": 0}, {"id": "BUS-02-024", "t": 2, "s": "3.2.3", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>one reason a UK firm might import goods<\/b> and one reason it might export.", "a": ["Import: <b>lower cost<\/b> or unavailable in the UK (1)", "Export: access to <b>new markets and customers<\/b> (1)", "Export: <b>higher sales<\/b> and growth (1)"], "cp": ["Import: lower cost or unavailable in the UK", "Export: access to new markets and customers", "Export: higher sales and growth"], "dp": ["Import to avoid customers", "Export to reduce sales", "Exporting means buying from abroad"], "mand": 0}, {"id": "BUS-03-001", "t": 3, "s": "3.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of production<\/b> process.", "a": ["<b>Job<\/b> production (1)", "<b>Batch<\/b> production (1)", "<b>Flow<\/b> (mass) production (1)"], "cp": ["Job production", "Batch production", "Flow (mass) production"], "dp": ["Piece, row and line production", "Fast, slow and medium production", "Hand, foot and mouth production"], "mand": 0}, {"id": "BUS-03-002", "t": 3, "s": "3.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>job production<\/b>?", "a": ["Making <b>one-off or custom<\/b> products (1)", "Each item is made to <b>customer specification<\/b> (1)"], "cp": ["Making one-off or custom products", "Each item is made to customer specification"], "dp": ["Making thousands of identical items", "Making batches of goods", "Making goods with no workers"], "mand": 0}, {"id": "BUS-03-003", "t": 3, "s": "3.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>batch production<\/b>?", "a": ["Making <b>groups of identical items<\/b> together (1)", "Machines or processes are set for each batch (1)"], "cp": ["Making groups of identical items together", "Machines or processes are set for each batch"], "dp": ["Making one-off items", "Making one item at a time forever", "Making products with no machines"], "mand": 0}, {"id": "BUS-03-004", "t": 3, "s": "3.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>flow (mass) production<\/b>?", "a": ["<b>Continuous<\/b> production of identical items on a production line (1)", "Highly <b>automated and low unit cost<\/b> (1)"], "cp": ["Continuous production of identical items on a production line", "Highly automated and low unit cost"], "dp": ["Making unique items for each customer", "Stopping production every hour", "Making goods by hand"], "mand": 0}, {"id": "BUS-03-005", "t": 3, "s": "3.3.1", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>two advantages<\/b> and <b>one disadvantage<\/b> of flow production.", "a": ["Advantage: <b>low cost per unit<\/b> (1)", "Advantage: <b>high output<\/b> and consistent quality (1)", "Disadvantage: <b>expensive set-up<\/b> and inflexible (1)"], "cp": ["Advantage: low cost per unit", "Advantage: high output and consistent quality", "Disadvantage: expensive set-up and inflexible"], "dp": ["Advantage: all products are unique", "Disadvantage: very low output", "Advantage: it needs no machines"], "mand": 0}, {"id": "BUS-03-006", "t": 3, "s": "3.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>lean production<\/b>?", "a": ["Reducing <b>waste<\/b> in every part of production (1)", "e.g. using <b>just-in-time<\/b> stock and efficient processes (1)"], "cp": ["Reducing waste in every part of production", "e.g. using just-in-time stock and efficient processes"], "dp": ["Producing extra stock", "Making products slowly", "Using more raw materials than needed"], "mand": 0}, {"id": "BUS-03-007", "t": 3, "s": "3.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>just-in-time (JIT)<\/b> stock control works.", "a": ["Materials are ordered to <b>arrive just when needed<\/b> (1)", "Little stock is held, so <b>storage costs are low<\/b> (1)", "Delays in delivery can <b>stop production<\/b> (1)"], "cp": ["Materials are ordered to arrive just when needed", "Little stock is held, so storage costs are low", "Delays in delivery can stop production"], "dp": ["Stock is kept in huge warehouses", "Stock is never ordered", "JIT means ordering one year ahead"], "mand": 0}, {"id": "BUS-03-008", "t": 3, "s": "3.3.2", "k": "Definition", "m": 2, "ht": false, "q": "What is meant by <b>quality<\/b> in business?", "a": ["Meeting or exceeding <b>customer expectations<\/b> (1)", "Products are <b>reliable, safe and fit for purpose<\/b> (1)"], "cp": ["Meeting or exceeding customer expectations", "Products are reliable, safe and fit for purpose"], "dp": ["Making goods as cheaply as possible", "Making goods quickly only", "Making goods nobody wants"], "mand": 0}, {"id": "BUS-03-009", "t": 3, "s": "3.3.2", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>quality control<\/b> and <b>quality assurance<\/b>.", "a": ["<b>Quality control<\/b>: inspecting products to find faults (1)", "<b>Quality assurance<\/b>: preventing faults throughout the process (1)", "QA aims to build quality in from the <b>start<\/b> (1)"], "cp": ["Quality control: inspecting products to find faults", "Quality assurance: preventing faults throughout the process", "QA aims to build quality in from the start"], "dp": ["Quality control happens before design", "Quality assurance happens after sale", "They mean the same"], "mand": 0}, {"id": "BUS-03-010", "t": 3, "s": "3.3.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>why quality matters<\/b> to a business.", "a": ["Increases <b>customer satisfaction and loyalty<\/b> (1)", "Reduces <b>returns and waste<\/b> (1)", "Protects <b>reputation<\/b> and supports higher prices (1)"], "cp": ["Increases customer satisfaction and loyalty", "Reduces returns and waste", "Protects reputation and supports higher prices"], "dp": ["Quality has no effect", "Poor quality raises sales", "Quality only matters to staff"], "mand": 0}, {"id": "BUS-03-011", "t": 3, "s": "3.3.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three factors<\/b> to consider when choosing a supplier.", "a": ["Any three (1 each):", "• <b>cost<\/b>", "• <b>quality<\/b>", "• <b>reliability<\/b> and delivery", "• <b>credit terms<\/b>", "• <b>ethical<\/b> practices"], "cp": ["cost", "quality", "reliability and delivery", "credit terms", "ethical practices"], "dp": ["Colour of logo", "Supplier's holiday dates", "Name of the owner's pet"], "mand": 0}, {"id": "BUS-03-012", "t": 3, "s": "3.3.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>why a good supplier relationship<\/b> matters.", "a": ["Reliable deliveries keep <b>production running<\/b> (1)", "Better <b>prices or credit<\/b> terms (1)", "Quality problems are <b>solved faster<\/b> (1)"], "cp": ["Reliable deliveries keep production running", "Better prices or credit terms", "Quality problems are solved faster"], "dp": ["Relationships do not matter", "Suppliers should never be paid", "Good suppliers always charge more"], "mand": 0}, {"id": "BUS-03-013", "t": 3, "s": "3.3.3", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>procurement<\/b>?", "a": ["The process of <b>obtaining goods and services<\/b> a business needs (1)", "From <b>suppliers<\/b> at the right price and quality (1)"], "cp": ["The process of obtaining goods and services a business needs", "From suppliers at the right price and quality"], "dp": ["Selling products to customers", "Hiring new staff", "Setting prices"], "mand": 0}, {"id": "BUS-03-014", "t": 3, "s": "3.3.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> a business can sell to customers (sales channels).", "a": ["Any three (1 each):", "• <b>retail shops<\/b>", "• <b>e-commerce<\/b> websites", "• <b>telephone<\/b> or direct sales", "• <b>social media<\/b> sales", "• <b>wholesalers<\/b>"], "cp": ["retail shops", "e-commerce websites", "telephone or direct sales", "social media sales", "wholesalers"], "dp": ["Only door-to-door", "Only market stalls", "Only newspapers"], "mand": 0}, {"id": "BUS-03-015", "t": 3, "s": "3.3.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>good customer service<\/b> helps a business.", "a": ["Customers feel valued and <b>return<\/b> (1)", "They give <b>positive reviews<\/b> and recommendations (1)", "Improves <b>reputation and sales<\/b> (1)"], "cp": ["Customers feel valued and return", "They give positive reviews and recommendations", "Improves reputation and sales"], "dp": ["Customer service lowers sales", "Customers never return", "It only helps competitors"], "mand": 0}, {"id": "BUS-03-016", "t": 3, "s": "3.3.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three features<\/b> of good customer service.", "a": ["Any three (1 each):", "• <b>product knowledge<\/b>", "• <b>helpful, friendly<\/b> staff", "• <b>speedy<\/b> response", "• <b>after-sales<\/b> support", "• easy <b>returns<\/b>"], "cp": ["product knowledge", "helpful, friendly staff", "speedy response", "after-sales support", "easy returns"], "dp": ["Rude staff", "Slow responses", "Hidden contact details"], "mand": 0}, {"id": "BUS-03-017", "t": 3, "s": "3.3.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a business should <b>handle stock levels<\/b> to avoid problems.", "a": ["Too little stock can <b>run out and lose sales<\/b> (1)", "Too much stock raises <b>storage costs and waste<\/b> (1)", "Use forecasts and <b>stock records<\/b> to balance (1)"], "cp": ["Too little stock can run out and lose sales", "Too much stock raises storage costs and waste", "Use forecasts and stock records to balance"], "dp": ["Hold huge stock always", "Hold zero stock always", "Ignore sales forecasts"], "mand": 0}, {"id": "BUS-03-018", "t": 3, "s": "3.3.5", "k": "Calculation", "m": 3, "ht": false, "q": "A firm has 400 units in stock, sells 50 per week and reorders when stock hits 100. How many <b>weeks until it reorders<\/b>?", "a": ["Stock to use = 400 - 100 = 300 units (1)", "300 ÷ 50 (1)", "= <b>6 weeks<\/b> (1)"], "cp": ["Stock to use = 400 - 100 = 300 units", "300 ÷ 50", "= 6 weeks"], "dp": ["8 weeks", "4 weeks", "2 weeks"], "mand": 0}, {"id": "BUS-03-019", "t": 3, "s": "3.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one benefit and one risk<\/b> of using technology in production.", "a": ["Benefit: <b>faster and more accurate<\/b> output (1)", "Benefit: <b>lower labour costs<\/b> over time (1)", "Risk: <b>high cost and breakdowns<\/b> or job losses (1)"], "cp": ["Benefit: faster and more accurate output", "Benefit: lower labour costs over time", "Risk: high cost and breakdowns or job losses"], "dp": ["Technology has no benefits", "Technology never breaks", "Technology always raises jobs"], "mand": 0}, {"id": "BUS-03-020", "t": 3, "s": "3.3.1", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate whether a bakery making <b>custom wedding cakes<\/b> should use job or flow production.", "a": ["Job production allows <b>unique, high-quality<\/b> cakes (1)", "Customers pay <b>higher prices<\/b> for custom work (1)", "Flow production is <b>too rigid<\/b> and not suitable for custom orders (1)", "So job production suits the product and market (1)"], "cp": ["Job production allows unique, high-quality cakes", "Customers pay higher prices for custom work", "Flow production is too rigid and not suitable for custom orders", "So job production suits the product and market"], "dp": ["Flow is best because each cake is unique", "Neither is possible", "Batch is best for custom orders"], "mand": 0}, {"id": "BUS-03-021", "t": 3, "s": "3.3.2", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'quality means expensive'<\/b>. What is wrong?", "a": ["Quality means <b>meeting customer needs<\/b>, not necessarily high price (1)", "A low-cost product can still be <b>good quality<\/b> (1)"], "cp": ["Quality means meeting customer needs, not necessarily high price", "A low-cost product can still be good quality"], "dp": ["Quality always means high price", "Quality means cheapest", "Quality has nothing to do with customers"], "mand": 0}, {"id": "BUS-03-022", "t": 3, "s": "3.3.3", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>cheapest supplier<\/b> not always the best choice?", "a": ["Quality or reliability may be <b>poor<\/b> (1)", "Late or faulty deliveries can <b>cost sales<\/b> (1)"], "cp": ["Quality or reliability may be poor", "Late or faulty deliveries can cost sales"], "dp": ["Cheapest is always best", "Cost is never important", "Suppliers have no effect on quality"], "mand": 0}, {"id": "BUS-03-023", "t": 3, "s": "3.3.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a business can <b>use technology to support sales<\/b>.", "a": ["Online stores sell <b>24 hours a day<\/b> (1)", "Data tracks <b>customer buying<\/b> habits (1)", "Digital marketing and payments <b>speed up<\/b> sales (1)"], "cp": ["Online stores sell 24 hours a day", "Data tracks customer buying habits", "Digital marketing and payments speed up sales"], "dp": ["Technology reduces all sales", "Websites must close at night", "Data cannot help sales"], "mand": 0}, {"id": "BUS-03-024", "t": 3, "s": "3.3.1", "k": "Calculation", "m": 3, "ht": false, "q": "A factory makes 600 items in 5 days with 12 workers. Calculate <b>output per worker<\/b>.", "a": ["Output per worker = output ÷ workers (1)", "600 ÷ 12 (1)", "= <b>50 items per worker<\/b> (1)"], "cp": ["Output per worker = output ÷ workers", "600 ÷ 12", "= 50 items per worker"], "dp": ["120 items", "72 items", "7200 items"], "mand": 0}, {"id": "BUS-04-001", "t": 4, "s": "3.4.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three organisational structures<\/b> or terms used to describe one.", "a": ["Any three (1 each):", "• <b>hierarchical<\/b>", "• <b>flat<\/b>", "• <b>chain of command<\/b>", "• <b>span of control<\/b>", "• <b>centralised / decentralised<\/b>", "• <b>delegation<\/b>"], "cp": ["hierarchical", "flat", "chain of command", "span of control", "centralised / decentralised", "delegation"], "dp": ["Sole, joint and shared", "Cold, warm and hot", "Fast, slow and steady"], "mand": 0}, {"id": "BUS-04-002", "t": 4, "s": "3.4.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>span of control<\/b>?", "a": ["The <b>number of workers<\/b> a manager is directly responsible for (1)", "A wide span means <b>more subordinates<\/b> per manager (1)"], "cp": ["The number of workers a manager is directly responsible for", "A wide span means more subordinates per manager"], "dp": ["The size of the business premises", "The number of products sold", "The length of a contract"], "mand": 0}, {"id": "BUS-04-003", "t": 4, "s": "3.4.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>chain of command<\/b>?", "a": ["The <b>line of authority<\/b> from the top of the business to the bottom (1)", "Shows who is <b>accountable to whom<\/b> (1)"], "cp": ["The line of authority from the top of the business to the bottom", "Shows who is accountable to whom"], "dp": ["The order in which products are made", "A series of shops", "A list of suppliers"], "mand": 0}, {"id": "BUS-04-004", "t": 4, "s": "3.4.1", "k": "Compare", "m": 4, "ht": false, "q": "Compare a <b>tall (hierarchical)<\/b> and a <b>flat<\/b> structure.", "a": ["<b>Tall<\/b>: many layers and narrow spans of control (1)", "<b>Tall<\/b>: slower communication but close supervision (1)", "<b>Flat<\/b>: few layers and wide spans (1)", "<b>Flat<\/b>: faster communication and more responsibility for staff (1)"], "cp": ["Tall: many layers and narrow spans of control", "Tall: slower communication but close supervision", "Flat: few layers and wide spans", "Flat: faster communication and more responsibility for staff"], "dp": ["Tall has no managers", "Flat has many layers of management", "Both have identical spans"], "mand": 0}, {"id": "BUS-04-005", "t": 4, "s": "3.4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what <b>delegation<\/b> is and one benefit.", "a": ["Passing <b>authority and tasks<\/b> to subordinates (1)", "Frees managers to focus on <b>important decisions<\/b> (1)", "Can <b>motivate<\/b> and develop staff (1)"], "cp": ["Passing authority and tasks to subordinates", "Frees managers to focus on important decisions", "Can motivate and develop staff"], "dp": ["Giving all work to the owner", "Firing staff", "Never trusting staff"], "mand": 0}, {"id": "BUS-04-006", "t": 4, "s": "3.4.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>centralised<\/b> and <b>decentralised<\/b> decision making.", "a": ["<b>Centralised<\/b>: decisions made by senior managers at the top (1)", "<b>Decentralised<\/b>: decisions made at lower levels (1)", "Decentralised is <b>quicker and more motivating<\/b> but less consistent (1)"], "cp": ["Centralised: decisions made by senior managers at the top", "Decentralised: decisions made at lower levels", "Decentralised is quicker and more motivating but less consistent"], "dp": ["Centralised means every employee decides", "Decentralised means only the owner decides", "They are the same"], "mand": 0}, {"id": "BUS-04-007", "t": 4, "s": "3.4.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three methods of recruitment<\/b>.", "a": ["Any three (1 each):", "• <b>job centre<\/b>", "• <b>online job boards<\/b>", "• <b>newspapers / adverts<\/b>", "• <b>recruitment agency<\/b>", "• <b>social media<\/b>", "• <b>word of mouth<\/b>"], "cp": ["job centre", "online job boards", "newspapers / adverts", "recruitment agency", "social media", "word of mouth"], "dp": ["Fishing", "Shouting in the street", "Waiting for phone calls only"], "mand": 0}, {"id": "BUS-04-008", "t": 4, "s": "3.4.2", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>internal and external recruitment<\/b>.", "a": ["<b>Internal<\/b>: from existing staff, cheaper and quicker (1)", "<b>External<\/b>: from outside, brings new ideas and skills (1)", "External is <b>more costly and slower<\/b> (1)"], "cp": ["Internal: from existing staff, cheaper and quicker", "External: from outside, brings new ideas and skills", "External is more costly and slower"], "dp": ["Internal means recruiting from abroad", "External means promoting staff", "Both are free"], "mand": 0}, {"id": "BUS-04-009", "t": 4, "s": "3.4.2", "k": "Recall", "m": 3, "ht": false, "q": "What should a <b>job description and person specification<\/b> include?", "a": ["<b>Job description<\/b>: job title, duties and responsibilities (1)", "<b>Person specification<\/b>: skills, qualifications and experience wanted (1)", "Both help attract suitable <b>applicants<\/b> (1)"], "cp": ["Job description: job title, duties and responsibilities", "Person specification: skills, qualifications and experience wanted", "Both help attract suitable applicants"], "dp": ["Only salary", "Only holiday dates", "Only the manager's name"], "mand": 0}, {"id": "BUS-04-010", "t": 4, "s": "3.4.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three selection methods<\/b>.", "a": ["Any three (1 each):", "• <b>application form / CV<\/b>", "• <b>interview<\/b>", "• <b>references<\/b>", "• <b>tests<\/b> or work trials", "• <b>assessment centre<\/b>"], "cp": ["application form / CV", "interview", "references", "tests or work trials", "assessment centre"], "dp": ["Coin toss", "Lottery", "Random choice"], "mand": 0}, {"id": "BUS-04-011", "t": 4, "s": "3.4.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>why training<\/b> is important for a business.", "a": ["Staff develop <b>skills<\/b> and productivity (1)", "Better <b>customer service and fewer mistakes<\/b> (1)", "Increases <b>motivation and retention<\/b> (1)"], "cp": ["Staff develop skills and productivity", "Better customer service and fewer mistakes", "Increases motivation and retention"], "dp": ["Training lowers skills", "Training has no effect", "Training only costs money"], "mand": 0}, {"id": "BUS-04-012", "t": 4, "s": "3.4.2", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>induction<\/b>, <b>on-the-job<\/b> and <b>off-the-job<\/b> training.", "a": ["<b>Induction<\/b>: introduces a new starter to the business (1)", "<b>On-the-job<\/b>: learning while working (1)", "<b>Off-the-job<\/b>: training away from the workplace (1)"], "cp": ["Induction: introduces a new starter to the business", "On-the-job: learning while working", "Off-the-job: training away from the workplace"], "dp": ["Induction means firing staff", "On-the-job happens at school", "Off-the-job means working extra hours"], "mand": 0}, {"id": "BUS-04-013", "t": 4, "s": "3.4.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>workforce planning<\/b>? Give a reason it matters.", "a": ["Working out <b>how many and what type of staff<\/b> the business needs (1)", "Prevents <b>overstaffing or shortages<\/b> (1)"], "cp": ["Working out how many and what type of staff the business needs", "Prevents overstaffing or shortages"], "dp": ["Planning marketing campaigns", "Planning the production line only", "Planning holidays"], "mand": 0}, {"id": "BUS-04-014", "t": 4, "s": "3.4.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three reasons<\/b> a business might make staff redundant or reduce its workforce.", "a": ["Any three (1 each):", "• <b>falling sales<\/b>", "• <b>automation<\/b>", "• <b>cost cutting<\/b>", "• <b>closing a branch<\/b>", "• <b>restructuring<\/b>"], "cp": ["falling sales", "automation", "cost cutting", "closing a branch", "restructuring"], "dp": ["To increase its costs", "To reduce customers", "To hire more staff"], "mand": 0}, {"id": "BUS-04-015", "t": 4, "s": "3.4.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three financial methods of motivation<\/b>.", "a": ["Any three (1 each):", "• <b>wages / salary<\/b>", "• <b>bonus<\/b>", "• <b>commission<\/b>", "• <b>profit sharing<\/b>", "• <b>performance-related pay<\/b>", "• <b>fringe benefits<\/b>"], "cp": ["wages / salary", "bonus", "commission", "profit sharing", "performance-related pay", "fringe benefits"], "dp": ["Job rotation and training", "Praise and thanks", "Team trips only"], "mand": 0}, {"id": "BUS-04-016", "t": 4, "s": "3.4.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three non-financial methods of motivation<\/b>.", "a": ["Any three (1 each):", "• <b>job enrichment<\/b>", "• <b>job rotation<\/b>", "• <b>recognition<\/b> and praise", "• <b>flexible working<\/b>", "• <b>promotion<\/b> and training", "• <b>team working<\/b>"], "cp": ["job enrichment", "job rotation", "recognition and praise", "flexible working", "promotion and training", "team working"], "dp": ["Bonuses", "Commission", "Profit sharing"], "mand": 0}, {"id": "BUS-04-017", "t": 4, "s": "3.4.3", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>time rate<\/b> and <b>piece rate<\/b> pay.", "a": ["<b>Time rate<\/b>: paid per hour/week regardless of output (1)", "<b>Piece rate<\/b>: paid per unit produced (1)", "Piece rate encourages output but may reduce <b>quality<\/b> (1)"], "cp": ["Time rate: paid per hour/week regardless of output", "Piece rate: paid per unit produced", "Piece rate encourages output but may reduce quality"], "dp": ["Time rate pays for output only", "Piece rate pays for attendance only", "Both are non-financial"], "mand": 0}, {"id": "BUS-04-018", "t": 4, "s": "3.4.3", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>wages<\/b> and <b>salary<\/b>?", "a": ["<b>Wages<\/b>: usually paid hourly or weekly and can vary (1)", "<b>Salary<\/b>: fixed annual amount paid monthly (1)"], "cp": ["Wages: usually paid hourly or weekly and can vary", "Salary: fixed annual amount paid monthly"], "dp": ["Wages are annual; salary is hourly", "There is no difference", "Salary is a bonus"], "mand": 0}, {"id": "BUS-04-019", "t": 4, "s": "3.4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>why motivated staff<\/b> are important to a business.", "a": ["More <b>productive<\/b> and efficient (1)", "Better <b>customer service<\/b> (1)", "Lower <b>absence and staff turnover<\/b> (1)"], "cp": ["More productive and efficient", "Better customer service", "Lower absence and staff turnover"], "dp": ["Motivated staff always raise costs", "Motivation has no effect", "Motivated staff reduce sales"], "mand": 0}, {"id": "BUS-04-020", "t": 4, "s": "3.4.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate whether <b>bonuses<\/b> are always the best way to motivate staff.", "a": ["Bonuses can <b>raise effort<\/b> and output (1)", "But they can <b>increase costs<\/b> and are short-term (1)", "Some staff value <b>recognition or flexibility<\/b> more (1)", "So a mix of methods may work best (1)"], "cp": ["Bonuses can raise effort and output", "But they can increase costs and are short-term", "Some staff value recognition or flexibility more", "So a mix of methods may work best"], "dp": ["Bonuses always motivate everyone", "Bonuses never work", "Only non-financial methods exist"], "mand": 0}, {"id": "BUS-04-021", "t": 4, "s": "3.4.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of employee<\/b> contract or working pattern.", "a": ["Any three (1 each):", "• <b>full-time<\/b>", "• <b>part-time<\/b>", "• <b>temporary<\/b>", "• <b>zero-hours<\/b>", "• <b>flexible / remote<\/b>"], "cp": ["full-time", "part-time", "temporary", "zero-hours", "flexible / remote"], "dp": ["Retired", "Imaginary", "Unlimited"], "mand": 0}, {"id": "BUS-04-022", "t": 4, "s": "3.4.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>good communication<\/b> helps a business.", "a": ["Staff understand <b>tasks and goals<\/b> (1)", "Fewer <b>mistakes<\/b> and delays (1)", "Higher <b>morale<\/b> and faster decisions (1)"], "cp": ["Staff understand tasks and goals", "Fewer mistakes and delays", "Higher morale and faster decisions"], "dp": ["Communication slows decisions", "Communication is irrelevant", "Good communication causes errors"], "mand": 0}, {"id": "BUS-04-023", "t": 4, "s": "3.4.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three methods of business communication<\/b>.", "a": ["Any three (1 each):", "• <b>email<\/b>", "• <b>meetings<\/b>", "• <b>noticeboards / intranet<\/b>", "• <b>phone / video calls<\/b>", "• <b>reports / memos<\/b>", "• <b>messaging apps<\/b>"], "cp": ["email", "meetings", "noticeboards / intranet", "phone / video calls", "reports / memos", "messaging apps"], "dp": ["Smoke signals only", "Silence", "Guessing"], "mand": 0}, {"id": "BUS-04-024", "t": 4, "s": "3.4.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>poor communication<\/b> can harm a business.", "a": ["Staff may <b>misunderstand<\/b> instructions (1)", "Leads to <b>mistakes and wasted time<\/b> (1)", "Lowers <b>morale<\/b> and customer satisfaction (1)"], "cp": ["Staff may misunderstand instructions", "Leads to mistakes and wasted time", "Lowers morale and customer satisfaction"], "dp": ["Poor communication improves efficiency", "It has no effect", "It always saves money"], "mand": 0}, {"id": "BUS-04-025", "t": 4, "s": "3.4.2", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'recruitment and selection are the same'<\/b>. What is wrong?", "a": ["<b>Recruitment<\/b> attracts applicants (1)", "<b>Selection<\/b> chooses the best candidate (1)"], "cp": ["Recruitment attracts applicants", "Selection chooses the best candidate"], "dp": ["They are identical", "Selection attracts applicants", "Recruitment chooses the winner"], "mand": 0}, {"id": "BUS-04-026", "t": 4, "s": "3.4.3", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'pay is the only motivator'<\/b> a weak answer?", "a": ["<b>Non-financial<\/b> factors such as recognition also motivate (1)", "Different people are motivated by <b>different things<\/b> (1)"], "cp": ["Non-financial factors such as recognition also motivate", "Different people are motivated by different things"], "dp": ["Pay is the only thing that matters", "Nobody is motivated by pay", "Non-financial methods never work"], "mand": 0}, {"id": "BUS-04-027", "t": 4, "s": "3.4.1", "k": "Calculation", "m": 3, "ht": false, "q": "A manager has 3 supervisors, each supervising 8 workers. What is the <b>manager's span of control<\/b> and the number of workers?", "a": ["Span of control = <b>3<\/b> (1)", "Workers = 3 × 8 (1)", "= <b>24 workers<\/b> (1)"], "cp": ["Span of control = 3", "Workers = 3 × 8", "= 24 workers"], "dp": ["8 supervisors and 3 workers", "24 supervisors", "11 workers"], "mand": 0}, {"id": "BUS-05-001", "t": 5, "s": "3.5.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>market<\/b>?", "a": ["Where <b>buyers and sellers<\/b> meet (1)", "To exchange <b>goods or services<\/b> for money (1)"], "cp": ["Where buyers and sellers meet", "To exchange goods or services for money"], "dp": ["A shop's car park", "A list of staff", "A government office"], "mand": 0}, {"id": "BUS-05-002", "t": 5, "s": "3.5.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three types of market<\/b> or market features.", "a": ["Any three (1 each):", "• <b>mass market<\/b>", "• <b>niche market<\/b>", "• <b>market size<\/b>", "• <b>market share<\/b>", "• <b>market growth<\/b>"], "cp": ["mass market", "niche market", "market size", "market share", "market growth"], "dp": ["Imaginary market", "Closed market", "Hidden market"], "mand": 0}, {"id": "BUS-05-003", "t": 5, "s": "3.5.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare a <b>mass market<\/b> and a <b>niche market<\/b>.", "a": ["<b>Mass<\/b>: large number of customers, lower prices (1)", "<b>Niche<\/b>: small specialist group, often higher prices (1)", "Niche has <b>less competition<\/b> but fewer customers (1)"], "cp": ["Mass: large number of customers, lower prices", "Niche: small specialist group, often higher prices", "Niche has less competition but fewer customers"], "dp": ["Niche has the most customers", "Mass is small and specialist", "They are identical"], "mand": 0}, {"id": "BUS-05-004", "t": 5, "s": "3.5.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>market segmentation<\/b>?", "a": ["Dividing customers into <b>groups<\/b> with similar needs (1)", "e.g. by <b>age, income, location or lifestyle<\/b> (1)"], "cp": ["Dividing customers into groups with similar needs", "e.g. by age, income, location or lifestyle"], "dp": ["Splitting a product in half", "Selling to everyone with the same product", "Ignoring customers"], "mand": 0}, {"id": "BUS-05-005", "t": 5, "s": "3.5.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>market research<\/b>? Why is it done?", "a": ["Collecting information about <b>customers and competitors<\/b> (1)", "To reduce <b>risk<\/b> and guide decisions (1)"], "cp": ["Collecting information about customers and competitors", "To reduce risk and guide decisions"], "dp": ["Guessing customer needs", "Selling to customers", "Setting wages"], "mand": 0}, {"id": "BUS-05-006", "t": 5, "s": "3.5.1", "k": "Compare", "m": 4, "ht": false, "q": "Compare <b>primary<\/b> and <b>secondary<\/b> market research.", "a": ["<b>Primary<\/b>: new data collected first-hand, e.g. surveys (1)", "Primary is specific but <b>costly and slow<\/b> (1)", "<b>Secondary<\/b>: existing data, e.g. reports (1)", "Secondary is cheaper but may be <b>out of date<\/b> (1)"], "cp": ["Primary: new data collected first-hand, e.g. surveys", "Primary is specific but costly and slow", "Secondary: existing data, e.g. reports", "Secondary is cheaper but may be out of date"], "dp": ["Primary uses existing reports only", "Secondary means surveys only", "Both are free"], "mand": 0}, {"id": "BUS-05-007", "t": 5, "s": "3.5.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three methods<\/b> of primary research.", "a": ["Any three (1 each):", "• <b>surveys / questionnaires<\/b>", "• <b>interviews<\/b>", "• <b>focus groups<\/b>", "• <b>observation<\/b>", "• <b>product trials<\/b>"], "cp": ["surveys / questionnaires", "interviews", "focus groups", "observation", "product trials"], "dp": ["Reading old reports", "Searching published statistics", "Government data only"], "mand": 0}, {"id": "BUS-05-008", "t": 5, "s": "3.5.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>quantitative<\/b> and <b>qualitative<\/b> data?", "a": ["<b>Quantitative<\/b>: numerical data (1)", "<b>Qualitative<\/b>: opinions and reasons (1)"], "cp": ["Quantitative: numerical data", "Qualitative: opinions and reasons"], "dp": ["Quantitative is opinions; qualitative is numbers", "Both are numbers", "Both are opinions"], "mand": 0}, {"id": "BUS-05-009", "t": 5, "s": "3.5.1", "k": "Calculation", "m": 3, "ht": false, "q": "A firm sells 20,000 units in a market of 200,000 units. Calculate <b>market share<\/b>.", "a": ["Market share = firm sales ÷ market sales × 100 (1)", "20,000 ÷ 200,000 × 100 (1)", "= <b>10%<\/b> (1)"], "cp": ["Market share = firm sales ÷ market sales × 100", "20,000 ÷ 200,000 × 100", "= 10%"], "dp": ["20%", "1%", "100%"], "mand": 0}, {"id": "BUS-05-010", "t": 5, "s": "3.5.2", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four Ps<\/b> of the marketing mix.", "a": ["<b>Product<\/b> (1)", "<b>Price<\/b> (1)", "<b>Promotion<\/b> (1)", "<b>Place<\/b> (1)"], "cp": ["Product", "Price", "Promotion", "Place"], "dp": ["Profit, People, Power and Paper", "Plan, Purchase, Pack and Post", "Price, Profit, Pay and Product"], "mand": 0}, {"id": "BUS-05-011", "t": 5, "s": "3.5.2", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>product life cycle<\/b>?", "a": ["The stages a product passes through during its time on the market (1)", "<b>Introduction, growth, maturity, decline<\/b> (1)"], "cp": ["The stages a product passes through during its time on the market", "Introduction, growth, maturity, decline"], "dp": ["A product's guarantee", "The time it takes to make a product", "A shop's opening hours"], "mand": 0}, {"id": "BUS-05-012", "t": 5, "s": "3.5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain what a business might do in the <b>decline<\/b> stage.", "a": ["Use an <b>extension strategy<\/b> such as a relaunch or redesign (1)", "Or <b>reduce costs<\/b> and promotion (1)", "Or <b>withdraw<\/b> the product (1)"], "cp": ["Use an extension strategy such as a relaunch or redesign", "Or reduce costs and promotion", "Or withdraw the product"], "dp": ["Increase prices massively", "Ignore the product", "Never withdraw products"], "mand": 0}, {"id": "BUS-05-013", "t": 5, "s": "3.5.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three extension strategies<\/b>.", "a": ["Any three (1 each):", "• <b>new packaging<\/b>", "• <b>new uses<\/b>", "• <b>product modifications<\/b>", "• <b>new markets<\/b>", "• <b>price promotions<\/b>", "• <b>advertising<\/b>"], "cp": ["new packaging", "new uses", "product modifications", "new markets", "price promotions", "advertising"], "dp": ["Closing the shop", "Removing all branding", "Stopping all promotion"], "mand": 0}, {"id": "BUS-05-014", "t": 5, "s": "3.5.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three pricing strategies<\/b>.", "a": ["Any three (1 each):", "• <b>cost-plus<\/b>", "• <b>competitor-based<\/b>", "• <b>price skimming<\/b>", "• <b>penetration pricing<\/b>", "• <b>loss leader<\/b>", "• <b>psychological<\/b> pricing"], "cp": ["cost-plus", "competitor-based", "price skimming", "penetration pricing", "loss leader", "psychological pricing"], "dp": ["Random pricing", "Free forever", "Doubling every day"], "mand": 0}, {"id": "BUS-05-015", "t": 5, "s": "3.5.2", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>price skimming<\/b> and <b>penetration pricing<\/b>.", "a": ["<b>Skimming<\/b>: high initial price, lowered later (1)", "<b>Penetration<\/b>: low initial price to gain market share (1)", "Skimming suits <b>new, unique<\/b> products (1)"], "cp": ["Skimming: high initial price, lowered later", "Penetration: low initial price to gain market share", "Skimming suits new, unique products"], "dp": ["Skimming starts with a very low price", "Penetration starts with a very high price", "They are identical"], "mand": 0}, {"id": "BUS-05-016", "t": 5, "s": "3.5.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>loss leader<\/b>?", "a": ["A product sold <b>below cost<\/b> (1)", "To attract customers who then buy <b>other products<\/b> (1)"], "cp": ["A product sold below cost", "To attract customers who then buy other products"], "dp": ["A product that makes the highest profit", "A product no one wants", "A supplier discount"], "mand": 0}, {"id": "BUS-05-017", "t": 5, "s": "3.5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>cost-plus pricing<\/b>.", "a": ["Add a <b>fixed mark-up<\/b> to the cost of making the product (1)", "Ensures each item makes a <b>profit<\/b> (1)", "Ignores competitors and demand (1)"], "cp": ["Add a fixed mark-up to the cost of making the product", "Ensures each item makes a profit", "Ignores competitors and demand"], "dp": ["Price is set at cost only", "Price is set randomly", "Price depends only on competitors"], "mand": 0}, {"id": "BUS-05-018", "t": 5, "s": "3.5.2", "k": "Calculation", "m": 3, "ht": false, "q": "A product costs £12 to make and the firm adds a 50% mark-up. Calculate the <b>selling price<\/b>.", "a": ["Mark-up = 50% × £12 = £6 (1)", "Selling price = £12 + £6 (1)", "= <b>£18<\/b> (1)"], "cp": ["Mark-up = 50% × £12 = £6", "Selling price = £12 + £6", "= £18"], "dp": ["£6", "£24", "£12"], "mand": 0}, {"id": "BUS-05-019", "t": 5, "s": "3.5.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three promotion methods<\/b>.", "a": ["Any three (1 each):", "• <b>advertising<\/b>", "• <b>sales promotions<\/b> (discounts)", "• <b>social media<\/b>", "• <b>sponsorship<\/b>", "• <b>public relations<\/b>", "• <b>personal selling<\/b>"], "cp": ["advertising", "sales promotions (discounts)", "social media", "sponsorship", "public relations", "personal selling"], "dp": ["Hiding products", "Raising costs", "Reducing product range"], "mand": 0}, {"id": "BUS-05-020", "t": 5, "s": "3.5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>branding<\/b> is important.", "a": ["Makes a product <b>recognisable<\/b> (1)", "Builds <b>loyalty and trust<\/b> (1)", "Can support a <b>higher price<\/b> (1)"], "cp": ["Makes a product recognisable", "Builds loyalty and trust", "Can support a higher price"], "dp": ["Branding lowers sales", "Branding has no effect", "Branding makes products unrecognisable"], "mand": 0}, {"id": "BUS-05-021", "t": 5, "s": "3.5.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three distribution channels<\/b> (place).", "a": ["Any three (1 each):", "• <b>direct to customer<\/b>", "• <b>via retailer<\/b>", "• <b>via wholesaler<\/b>", "• <b>online<\/b>", "• <b>market stalls<\/b>"], "cp": ["direct to customer", "via retailer", "via wholesaler", "online", "market stalls"], "dp": ["Teleportation", "Waiting for customers", "Hidden storage"], "mand": 0}, {"id": "BUS-05-022", "t": 5, "s": "3.5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>e-commerce<\/b> affects the 'place' element.", "a": ["Customers can <b>buy 24/7<\/b> from anywhere (1)", "Reaches <b>wider markets<\/b> (1)", "Requires <b>delivery systems<\/b> and a good website (1)"], "cp": ["Customers can buy 24/7 from anywhere", "Reaches wider markets", "Requires delivery systems and a good website"], "dp": ["It restricts customers to one shop", "Place no longer matters", "It prevents sales"], "mand": 0}, {"id": "BUS-05-023", "t": 5, "s": "3.5.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate whether <b>advertising<\/b> is the best form of promotion for a new local cafe.", "a": ["Advertising can <b>raise awareness<\/b> (1)", "But it can be <b>costly<\/b> for a small firm (1)", "<b>Social media and offers<\/b> are cheaper and targeted (1)", "So low-cost, local methods may be best (1)"], "cp": ["Advertising can raise awareness", "But it can be costly for a small firm", "Social media and offers are cheaper and targeted", "So low-cost, local methods may be best"], "dp": ["National TV is best for every cafe", "Promotion is unnecessary", "Cafes cannot advertise"], "mand": 0}, {"id": "BUS-05-024", "t": 5, "s": "3.5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why the <b>marketing mix<\/b> must work together.", "a": ["Elements need to be <b>consistent<\/b> (1)", "e.g. premium product, <b>premium price and promotion<\/b> (1)", "Mixed signals <b>confuse<\/b> customers (1)"], "cp": ["Elements need to be consistent", "e.g. premium product, premium price and promotion", "Mixed signals confuse customers"], "dp": ["Elements should conflict", "They never relate", "Only price matters"], "mand": 0}, {"id": "BUS-05-025", "t": 5, "s": "3.5.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'market research guarantees success'<\/b>. What is wrong?", "a": ["It only <b>reduces risk<\/b>, it cannot guarantee success (1)", "Results may be <b>inaccurate or out of date<\/b> (1)"], "cp": ["It only reduces risk, it cannot guarantee success", "Results may be inaccurate or out of date"], "dp": ["Research always guarantees success", "Research increases risk", "Research has no use"], "mand": 0}, {"id": "BUS-05-026", "t": 5, "s": "3.5.2", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'lower price always increases profit'<\/b> wrong?", "a": ["A lower price cuts the <b>profit per unit<\/b> (1)", "Sales may not rise enough to compensate (<b>elasticity<\/b>) (1)"], "cp": ["A lower price cuts the profit per unit", "Sales may not rise enough to compensate (elasticity)"], "dp": ["Lower prices always raise profit", "Price never affects profit", "Higher prices always cut sales to zero"], "mand": 0}, {"id": "BUS-05-027", "t": 5, "s": "3.5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>how a business uses market segmentation<\/b>.", "a": ["Targets products to <b>specific groups<\/b> (1)", "Tailors <b>promotion and price<\/b> to each group (1)", "Improves <b>sales<\/b> and efficiency (1)"], "cp": ["Targets products to specific groups", "Tailors promotion and price to each group", "Improves sales and efficiency"], "dp": ["Sells the same to everyone", "Ignores differences between customers", "Removes all targeting"], "mand": 0}, {"id": "BUS-06-001", "t": 6, "s": "3.6.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three sources of finance<\/b>.", "a": ["Any three (1 each):", "• <b>savings<\/b>", "• <b>bank loan<\/b>", "• <b>overdraft<\/b>", "• <b>share issue<\/b>", "• <b>retained profit<\/b>"], "cp": ["savings", "bank loan", "overdraft", "share issue", "retained profit"], "dp": ["Imaginary money", "Free gifts", "Printing money"], "mand": 0}, {"id": "BUS-06-002", "t": 6, "s": "3.6.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>short-term<\/b> and <b>long-term<\/b> finance.", "a": ["<b>Short-term<\/b>: repaid within a year, e.g. overdraft (1)", "<b>Long-term<\/b>: repaid over years, e.g. loan (1)", "Match the finance to the <b>purpose and timescale<\/b> (1)"], "cp": ["Short-term: repaid within a year, e.g. overdraft", "Long-term: repaid over years, e.g. loan", "Match the finance to the purpose and timescale"], "dp": ["Short-term lasts decades", "Long-term is repaid in a day", "They are identical"], "mand": 0}, {"id": "BUS-06-003", "t": 6, "s": "3.6.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>internal<\/b> and <b>external<\/b> sources of finance.", "a": ["<b>Internal<\/b>: from within the business, e.g. retained profit (1)", "<b>External<\/b>: from outside, e.g. loans (1)", "Internal avoids <b>interest<\/b> but may be limited (1)"], "cp": ["Internal: from within the business, e.g. retained profit", "External: from outside, e.g. loans", "Internal avoids interest but may be limited"], "dp": ["Internal means a bank loan", "External means retained profit", "Both are free"], "mand": 0}, {"id": "BUS-06-004", "t": 6, "s": "3.6.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three reasons<\/b> a business needs finance.", "a": ["Any three (1 each):", "• <b>start-up<\/b> costs", "• <b>working capital<\/b>", "• <b>expansion<\/b>", "• <b>new equipment<\/b>", "• <b>cash-flow<\/b> problems"], "cp": ["start-up costs", "working capital", "expansion", "new equipment", "cash-flow problems"], "dp": ["To avoid customers", "To close down", "To reduce sales"], "mand": 0}, {"id": "BUS-06-005", "t": 6, "s": "3.6.1", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>overdraft<\/b>?", "a": ["Borrowing more than you have in your <b>bank account<\/b> (1)", "A flexible <b>short-term<\/b> source of finance with interest (1)"], "cp": ["Borrowing more than you have in your bank account", "A flexible short-term source of finance with interest"], "dp": ["A long-term share issue", "Money from profit", "A government grant"], "mand": 0}, {"id": "BUS-06-006", "t": 6, "s": "3.6.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>trade credit<\/b>?", "a": ["Buying goods or services now and <b>paying the supplier later<\/b> (1)", "Helps <b>cash flow<\/b> (1)"], "cp": ["Buying goods or services now and paying the supplier later", "Helps cash flow"], "dp": ["Paying before delivery", "A discount to customers", "A bank account"], "mand": 0}, {"id": "BUS-06-007", "t": 6, "s": "3.6.2", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>fixed costs<\/b>? Give an example.", "a": ["Costs that <b>do not change<\/b> with output (1)", "e.g. <b>rent<\/b> or insurance (1)"], "cp": ["Costs that do not change with output", "e.g. rent or insurance"], "dp": ["Costs that vary with output", "Money earned from sales", "Taxes on profit"], "mand": 0}, {"id": "BUS-06-008", "t": 6, "s": "3.6.2", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>variable costs<\/b>? Give an example.", "a": ["Costs that <b>change with output<\/b> (1)", "e.g. <b>raw materials<\/b> or packaging (1)"], "cp": ["Costs that change with output", "e.g. raw materials or packaging"], "dp": ["Costs that never change", "Rent", "Salaries only"], "mand": 0}, {"id": "BUS-06-009", "t": 6, "s": "3.6.2", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate <b>total cost<\/b> if fixed costs are £8,000 and variable costs are £6,000.", "a": ["Total cost = fixed + variable (1)", "£8,000 + £6,000 (1)", "= <b>£14,000<\/b> (1)"], "cp": ["Total cost = fixed + variable", "£8,000 + £6,000", "= £14,000"], "dp": ["£2,000", "£48,000", "£8,000"], "mand": 0}, {"id": "BUS-06-010", "t": 6, "s": "3.6.2", "k": "Calculation", "m": 3, "ht": false, "q": "A firm sells 500 units at £20 each. Calculate <b>revenue<\/b>.", "a": ["Revenue = price × quantity (1)", "£20 × 500 (1)", "= <b>£10,000<\/b> (1)"], "cp": ["Revenue = price × quantity", "£20 × 500", "= £10,000"], "dp": ["£520", "£100", "£25"], "mand": 0}, {"id": "BUS-06-011", "t": 6, "s": "3.6.2", "k": "Calculation", "m": 3, "ht": false, "q": "Revenue is £10,000 and total costs are £7,500. Calculate <b>profit<\/b>.", "a": ["Profit = revenue - total costs (1)", "£10,000 - £7,500 (1)", "= <b>£2,500<\/b> (1)"], "cp": ["Profit = revenue - total costs", "£10,000 - £7,500", "= £2,500"], "dp": ["£17,500", "£7,500", "-£2,500"], "mand": 0}, {"id": "BUS-06-012", "t": 6, "s": "3.6.2", "k": "Calculation", "m": 4, "ht": false, "q": "A firm has fixed costs of £12,000, a price of £10 and variable costs of £4 per unit. Calculate the <b>break-even output<\/b>.", "a": ["Contribution per unit = £10 - £4 = £6 (1)", "Break-even = fixed costs ÷ contribution (1)", "£12,000 ÷ £6 (1)", "= <b>2,000 units<\/b> (1)"], "cp": ["Contribution per unit = £10 - £4 = £6", "Break-even = fixed costs ÷ contribution", "£12,000 ÷ £6", "= 2,000 units"], "dp": ["1,200 units", "3,000 units", "1,000 units"], "mand": 0}, {"id": "BUS-06-013", "t": 6, "s": "3.6.2", "k": "Calculation", "m": 3, "ht": false, "q": "A firm breaks even at 2,000 units but plans to sell 2,600. Calculate the <b>margin of safety<\/b>.", "a": ["Margin of safety = actual - break-even (1)", "2,600 - 2,000 (1)", "= <b>600 units<\/b> (1)"], "cp": ["Margin of safety = actual - break-even", "2,600 - 2,000", "= 600 units"], "dp": ["4,600 units", "2,000 units", "5,200 units"], "mand": 0}, {"id": "BUS-06-014", "t": 6, "s": "3.6.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one use and one limitation<\/b> of break-even analysis.", "a": ["Use: shows how many units must be sold to <b>avoid a loss<\/b> (1)", "Use: helps with pricing and planning (1)", "Limitation: assumes <b>all output is sold<\/b> and costs stay constant (1)"], "cp": ["Use: shows how many units must be sold to avoid a loss", "Use: helps with pricing and planning", "Limitation: assumes all output is sold and costs stay constant"], "dp": ["It guarantees profit", "It predicts exact sales", "It ignores costs completely"], "mand": 0}, {"id": "BUS-06-015", "t": 6, "s": "3.6.2", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>margin of safety<\/b> and why is it useful?", "a": ["The amount by which sales can fall before the business makes a loss (1)", "Shows <b>risk level<\/b> (1)"], "cp": ["The amount by which sales can fall before the business makes a loss", "Shows risk level"], "dp": ["Money kept in a safe", "Profit after tax", "A government rule"], "mand": 0}, {"id": "BUS-06-016", "t": 6, "s": "3.6.3", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>cash flow<\/b>?", "a": ["The <b>money moving into and out<\/b> of a business (1)", "Over a specific period (1)"], "cp": ["The money moving into and out of a business", "Over a specific period"], "dp": ["Total profit only", "The value of the factory", "Shareholder dividends"], "mand": 0}, {"id": "BUS-06-017", "t": 6, "s": "3.6.3", "k": "Compare", "m": 3, "ht": false, "q": "Explain the difference between <b>cash and profit<\/b>.", "a": ["<b>Cash<\/b> is money actually available (1)", "<b>Profit<\/b> is revenue minus costs, may not yet be received (1)", "A profitable business can still <b>run out of cash<\/b> (1)"], "cp": ["Cash is money actually available", "Profit is revenue minus costs, may not yet be received", "A profitable business can still run out of cash"], "dp": ["Cash and profit are identical", "Profit is physical coins only", "Cash is revenue minus costs"], "mand": 0}, {"id": "BUS-06-018", "t": 6, "s": "3.6.3", "k": "Calculation", "m": 3, "ht": false, "q": "A firm opens with £2,000. Cash inflow £5,000, outflow £4,200. Calculate <b>closing balance<\/b>.", "a": ["Net cash flow = £5,000 - £4,200 = £800 (1)", "Closing = opening + net (1)", "= £2,000 + £800 = <b>£2,800<\/b> (1)"], "cp": ["Net cash flow = £5,000 - £4,200 = £800", "Closing = opening + net", "= £2,000 + £800 = £2,800"], "dp": ["£800", "£4,200", "£1,200"], "mand": 0}, {"id": "BUS-06-019", "t": 6, "s": "3.6.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to improve cash flow.", "a": ["Any three (1 each):", "• <b>overdraft<\/b> or short-term loan", "• <b>chase customers<\/b> for   if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
render();
</script>
