acts east and 40 N acts north. Find the <b>size of the resultant<\/b> force using a scale diagram or Pythagoras.", "a": ["Draw a <b>right-angled triangle<\/b> (1)", "R<sup>2<\/sup> = 30<sup>2<\/sup> + 40<sup>2<\/sup> = 2500 (1)", "R = <b>50 N<\/b> (1)"], "cp": ["Draw a right-angled triangle", "R<sup>2<\/sup> = 30<sup>2<\/sup> + 40<sup>2<\/sup> = 2500", "R = 50 N"], "dp": ["70 N", "10 N", "35 N"], "mand": 0}, {"id": "PHY-05-H02", "t": 5, "s": "4.5.4", "k": "Explain", "m": 3, "ht": true, "q": "Explain how a <b>lever<\/b> works as a force multiplier.", "a": ["A lever has a <b>pivot<\/b> and an effort and a load (1)", "The effort is <b>further from the pivot<\/b> than the load (1)", "So a <b>small force<\/b> gives a large moment, moving a <b>larger force<\/b> (1)"], "cp": ["A lever has a pivot and an effort and a load", "The effort is further from the pivot than the load", "So a small force gives a large moment, moving a larger force"], "dp": ["Levers increase distance only", "The effort must be nearer the pivot than the load", "Levers work without a pivot"], "mand": 0}, {"id": "PHY-05-H03", "t": 5, "s": "4.5.4", "k": "Explain", "m": 3, "ht": true, "q": "Explain how <b>gears<\/b> transmit rotational effects of forces.", "a": ["Gears <b>mesh together<\/b> so the teeth push on each other (1)", "A <b>small gear drives a large gear<\/b>, so a <b>larger moment<\/b> but slower (1)", "Adjacent gears turn in <b>opposite directions<\/b> (1)"], "cp": ["Gears mesh together so the teeth push on each other", "A small gear drives a large gear, so a larger moment but slower", "Adjacent gears turn in opposite directions"], "dp": ["Gears do not rotate", "Gears always turn in the same direction", "A larger gear always turns faster"], "mand": 0}, {"id": "PHY-05-H04", "t": 5, "s": "4.5.5", "k": "Recall", "m": 2, "ht": true, "q": "Write the equation for <b>pressure in a fluid<\/b>.", "a": ["pressure = <b>height × density × gravitational field strength<\/b> (1)", "p = h ρ g (1)"], "cp": ["pressure = height × density × gravitational field strength", "p = h ρ g"], "dp": ["p = h ÷ (ρ g)", "p = m ÷ A", "p = ρ ÷ (h g)"], "mand": 0}, {"id": "PHY-05-H05", "t": 5, "s": "4.5.5", "k": "Calculation", "m": 3, "ht": true, "q": "Calculate the pressure at the bottom of a pool 3 m deep. (density of water 1000 kg/m<sup>3<\/sup>, g = 10 N/kg)", "a": ["p = h ρ g (1)", "= 3 × 1000 × 10 (1)", "= <b>30 000 Pa<\/b> (1)"], "cp": ["p = h ρ g", "= 3 × 1000 × 10", "= 30 000 Pa"], "dp": ["300 Pa", "3000 Pa", "3 Pa"], "mand": 0}, {"id": "PHY-05-H06", "t": 5, "s": "4.5.5", "k": "Explain", "m": 3, "ht": true, "q": "Explain why an object <b>floats<\/b> or <b>sinks<\/b> in terms of <b>upthrust<\/b>.", "a": ["The <b>pressure at the bottom<\/b> of the object is greater than at the top (1)", "This gives an <b>upward force (upthrust)<\/b> (1)", "If upthrust is <b>equal to weight<\/b> it floats; if <b>weight is greater<\/b> it sinks (1)"], "cp": ["The pressure at the bottom of the object is greater than at the top", "This gives an upward force (upthrust)", "If upthrust is equal to weight it floats; if weight is greater it sinks"], "dp": ["Upthrust is a downward force", "Floating happens when weight is greater than upthrust", "Pressure is the same at the top and bottom"], "mand": 0}, {"id": "PHY-05-H07", "t": 5, "s": "4.5.6.3", "k": "Explain", "m": 3, "ht": true, "q": "Explain why <b>braking distance<\/b> increases a lot when speed doubles.", "a": ["The kinetic energy is <b>0.5 m v<sup>2<\/sup><\/b> (1)", "Doubling speed makes the kinetic energy <b>four times bigger<\/b> (1)", "So the braking force must do <b>four times as much work<\/b>, so the distance is about <b>four times longer<\/b> (1)"], "cp": ["The kinetic energy is 0.5 m v<sup>2<\/sup>", "Doubling speed makes the kinetic energy four times bigger", "So the braking force must do four times as much work, so the distance is about four times longer"], "dp": ["Braking distance doubles exactly", "Speed has no effect on braking distance", "Braking distance halves"], "mand": 0}, {"id": "PHY-05-H08", "t": 5, "s": "4.5.6.3", "k": "Explain", "m": 3, "ht": true, "q": "Why do <b>brakes get hot<\/b> and why is a <b>large deceleration<\/b> dangerous?", "a": ["Friction transfers <b>kinetic energy to thermal energy<\/b> (1)", "A large deceleration needs a <b>large force<\/b> (1)", "It can cause the brakes to <b>overheat or the car to skid<\/b>, and injure passengers (1)"], "cp": ["Friction transfers kinetic energy to thermal energy", "A large deceleration needs a large force", "It can cause the brakes to overheat or the car to skid, and injure passengers"], "dp": ["Brakes get cold when they work", "Large deceleration is always safe", "Brakes create kinetic energy"], "mand": 0}, {"id": "PHY-05-H09", "t": 5, "s": "4.5.7.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain how <b>crumple zones, seat belts and air bags<\/b> reduce injuries in a crash.", "a": ["They <b>increase the time<\/b> of the collision (1)", "so the <b>rate of change of momentum decreases<\/b> (1)", "Reducing the <b>force<\/b> on the passengers (1)"], "cp": ["They increase the time of the collision", "so the rate of change of momentum decreases", "Reducing the force on the passengers"], "dp": ["They decrease the time of the collision", "They increase the force", "They have no effect on momentum"], "mand": 0}, {"id": "PHY-05-H10", "t": 5, "s": "4.5.7.2", "k": "Recall", "m": 2, "ht": true, "q": "Write the equation for <b>force<\/b> in terms of change in momentum.", "a": ["force = <b>change in momentum ÷ time<\/b> (1)", "F = Δp ÷ t (1)"], "cp": ["force = change in momentum ÷ time", "F = Δp ÷ t"], "dp": ["F = Δp × t", "F = p ÷ m", "F = m × Δt"], "mand": 0}, {"id": "PHY-05-H11", "t": 5, "s": "4.5.7.2", "k": "Calculation", "m": 3, "ht": true, "q": "A 0.2 kg ball changes velocity from 10 m/s to 0 m/s in 0.1 s. Calculate the <b>force<\/b> on the ball.", "a": ["Change in momentum = 0.2 × (10 - 0) = 2 kg m/s (1)", "F = Δp ÷ t = 2 ÷ 0.1 (1)", "= <b>20 N<\/b> (1)"], "cp": ["Change in momentum = 0.2 × (10 - 0) = 2 kg m/s", "F = Δp ÷ t = 2 ÷ 0.1", "= 20 N"], "dp": ["0.2 N", "2 N", "200 N"], "mand": 0}, {"id": "PHY-06-001", "t": 6, "s": "4.6.1.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between a <b>transverse<\/b> and a <b>longitudinal<\/b> wave?", "a": ["Transverse: oscillations are <b>at right angles<\/b> to the direction of energy transfer (1)", "Longitudinal: oscillations are <b>parallel<\/b> to the direction of energy transfer (1)"], "cp": ["Transverse: oscillations are at right angles to the direction of energy transfer", "Longitudinal: oscillations are parallel to the direction of energy transfer"], "dp": ["Transverse waves oscillate parallel to the direction of travel", "Longitudinal waves move particles in circles", "Both oscillate at right angles"], "mand": 0}, {"id": "PHY-06-002", "t": 6, "s": "4.6.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Give an <b>example<\/b> of a transverse wave and a longitudinal wave.", "a": ["Transverse: <b>light<\/b> (or any EM wave, ripples, waves on a rope) (1)", "Longitudinal: <b>sound<\/b> (or P seismic waves) (1)"], "cp": ["Transverse: light (or any EM wave, ripples, waves on a rope)", "Longitudinal: sound (or P seismic waves)"], "dp": ["Transverse: sound, longitudinal: light", "Both are sound waves", "Transverse: ultrasound, longitudinal: X-rays"], "mand": 0}, {"id": "PHY-06-003", "t": 6, "s": "4.6.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Do waves transfer <b>matter<\/b> or <b>energy<\/b>? Explain.", "a": ["Waves transfer <b>energy<\/b> (and information) (1)", "The <b>particles only vibrate<\/b> around a fixed point and do not travel with the wave (1)"], "cp": ["Waves transfer energy (and information)", "The particles only vibrate around a fixed point and do not travel with the wave"], "dp": ["Waves transfer matter from place to place", "Waves transfer both matter and energy", "Waves transfer neither"], "mand": 0}, {"id": "PHY-06-004", "t": 6, "s": "4.6.1.2", "k": "Definition", "m": 4, "ht": false, "q": "Define <b>amplitude, wavelength, frequency<\/b> and <b>period<\/b> of a wave.", "a": ["Amplitude: <b>maximum displacement<\/b> from the rest position (1)", "Wavelength: <b>distance from one point to the same point<\/b> on the next wave (1)", "Frequency: <b>number of waves<\/b> passing a point per <b>second<\/b> (1)", "Period: the <b>time for one wave<\/b> (1)"], "cp": ["Amplitude: maximum displacement from the rest position", "Wavelength: distance from one point to the same point on the next wave", "Frequency: number of waves passing a point per second", "Period: the time for one wave"], "dp": ["Amplitude: the distance between two waves", "Wavelength: the time for one wave", "Frequency: the speed of the wave"], "mand": 0}, {"id": "PHY-06-005", "t": 6, "s": "4.6.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>unit of frequency<\/b> and what does <b>1 Hz<\/b> mean?", "a": ["The unit is the <b>hertz (Hz)<\/b> (1)", "1 Hz is <b>one wave per second<\/b> (1)"], "cp": ["The unit is the hertz (Hz)", "1 Hz is one wave per second"], "dp": ["The unit is the metre", "1 Hz is one wave per minute", "1 Hz is one metre per second"], "mand": 0}, {"id": "PHY-06-006", "t": 6, "s": "4.6.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking <b>wave speed, frequency and wavelength<\/b>.", "a": ["wave speed = <b>frequency × wavelength<\/b> (1)", "v = f λ, with v in <b>m/s<\/b>, f in <b>Hz<\/b>, λ in <b>m<\/b> (1)"], "cp": ["wave speed = frequency × wavelength", "v = f λ, with v in m/s, f in Hz, λ in m"], "dp": ["v = f ÷ λ", "v = λ ÷ f", "v = f + λ"], "mand": 0}, {"id": "PHY-06-007", "t": 6, "s": "4.6.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "A wave has a frequency of 50 Hz and a wavelength of 0.4 m. Calculate its <b>speed<\/b>.", "a": ["v = f λ (1)", "= 50 × 0.4 (1)", "= <b>20 m/s<\/b> (1)"], "cp": ["v = f λ", "= 50 × 0.4", "= 20 m/s"], "dp": ["125 m/s", "0.008 m/s", "50.4 m/s"], "mand": 0}, {"id": "PHY-06-008", "t": 6, "s": "4.6.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "Sound travels at 340 m/s. A note has a frequency of 680 Hz. Calculate its <b>wavelength<\/b>.", "a": ["λ = v ÷ f (1)", "= 340 ÷ 680 (1)", "= <b>0.5 m<\/b> (1)"], "cp": ["λ = v ÷ f", "= 340 ÷ 680", "= 0.5 m"], "dp": ["231 200 m", "2 m", "1020 m"], "mand": 0}, {"id": "PHY-06-009", "t": 6, "s": "4.6.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking <b>period and frequency<\/b>.", "a": ["period = <b>1 ÷ frequency<\/b> (1)", "T = 1 ÷ f, with T in <b>seconds<\/b> and f in <b>Hz<\/b> (1)"], "cp": ["period = 1 ÷ frequency", "T = 1 ÷ f, with T in seconds and f in Hz"], "dp": ["period = frequency", "period = frequency × 2", "period = 2 ÷ frequency"], "mand": 0}, {"id": "PHY-06-010", "t": 6, "s": "4.6.1.2", "k": "Calculation", "m": 2, "ht": false, "q": "A wave has a frequency of 4 Hz. Calculate its <b>period<\/b>.", "a": ["T = 1 ÷ f (1)", "= 1 ÷ 4 = <b>0.25 s<\/b> (1)"], "cp": ["T = 1 ÷ f", "= 1 ÷ 4 = 0.25 s"], "dp": ["4 s", "8 s", "0.4 s"], "mand": 0}, {"id": "PHY-06-011", "t": 6, "s": "4.6.1.2", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical:<\/b> Describe how to measure the <b>speed of ripples<\/b> in a ripple tank.", "a": ["Set up the <b>ripple tank<\/b> with a vibrating dipper (1)", "Use a <b>strobe light<\/b> to make the ripples look still (1)", "Measure the <b>wavelength<\/b> by placing a ruler on the tank (1)", "Calculate the <b>frequency<\/b> from the dipper or strobe (1)", "Calculate <b>speed = frequency × wavelength<\/b> (1)"], "cp": ["Set up the ripple tank with a vibrating dipper", "Use a strobe light to make the ripples look still", "Measure the wavelength by placing a ruler on the tank", "Calculate the frequency from the dipper or strobe", "Calculate speed = frequency × wavelength"], "dp": ["Time how long the water takes to evaporate", "Measure the mass of water in the tank", "Shine a torch at the tank"], "mand": 0}, {"id": "PHY-06-012", "t": 6, "s": "4.6.1.2", "k": "Practical", "m": 4, "ht": false, "q": "<b>Required practical:<\/b> How can you find the <b>frequency and wavelength of waves on a string<\/b>?", "a": ["Attach the string to a <b>vibration generator<\/b> and a pulley with a mass (1)", "Adjust the frequency until a <b>standing wave<\/b> appears (1)", "Measure the <b>wavelength<\/b> (2 × the loop length) (1)", "Use the <b>frequency from the signal generator<\/b> and v = f λ (1)"], "cp": ["Attach the string to a vibration generator and a pulley with a mass", "Adjust the frequency until a standing wave appears", "Measure the wavelength (2 × the loop length)", "Use the frequency from the signal generator and v = f λ"], "dp": ["Hit the string with a hammer", "Measure only the length of the string", "Use a thermometer on the string"], "mand": 0}, {"id": "PHY-06-013", "t": 6, "s": "4.6.1.2", "k": "Explain", "m": 2, "ht": false, "q": "In the ripple tank practical, why is it better to measure the distance across <b>several wavelengths<\/b>?", "a": ["It <b>reduces the percentage uncertainty<\/b> in the measurement (1)", "You then <b>divide<\/b> by the number of wavelengths (1)"], "cp": ["It reduces the percentage uncertainty in the measurement", "You then divide by the number of wavelengths"], "dp": ["It makes the waves faster", "It changes the frequency", "It makes the ripples bigger"], "mand": 0}, {"id": "PHY-06-014", "t": 6, "s": "4.6.1.3", "k": "Recall", "m": 2, "ht": false, "q": "State the <b>law of reflection<\/b>.", "a": ["The <b>angle of incidence<\/b> equals the <b>angle of reflection<\/b> (1)", "Both are measured from the <b>normal<\/b> (1)"], "cp": ["The angle of incidence equals the angle of reflection", "Both are measured from the normal"], "dp": ["Angle of incidence is bigger than angle of reflection", "Angle of reflection is measured from the surface", "The ray turns at 90 degrees"], "mand": 0}, {"id": "PHY-06-015", "t": 6, "s": "4.6.1.3", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between <b>specular<\/b> and <b>diffuse<\/b> reflection?", "a": ["Specular: reflection from a <b>smooth surface<\/b> in one direction (1)", "Diffuse: reflection from a <b>rough surface<\/b> in many directions (1)"], "cp": ["Specular: reflection from a smooth surface in one direction", "Diffuse: reflection from a rough surface in many directions"], "dp": ["Specular happens at rough surfaces", "Diffuse reflection gives a clear mirror image", "They are the same"], "mand": 0}, {"id": "PHY-06-016", "t": 6, "s": "4.6.1.3", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical (Physics only):<\/b> Describe how to investigate <b>refraction<\/b> of light in a glass block.", "a": ["Place the <b>block on paper<\/b> and draw round it (1)", "Shine a ray in and mark it with <b>crosses<\/b> (1)", "Draw the <b>normal<\/b> where the ray enters (1)", "Measure the <b>angles of incidence and refraction<\/b> (1)", "Repeat with different angles (1)"], "cp": ["Place the block on paper and draw round it", "Shine a ray in and mark it with crosses", "Draw the normal where the ray enters", "Measure the angles of incidence and refraction", "Repeat with different angles"], "dp": ["Measure the thickness of the block with a thermometer", "Draw the normal after removing the ray", "Measure the angles from the surface"], "mand": 0}, {"id": "PHY-06-017", "t": 6, "s": "4.6.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why light <b>bends<\/b> towards the normal when entering glass from air.", "a": ["Light <b>slows down<\/b> in glass (1)", "The wave changes speed, so it changes <b>direction<\/b> (refracts) (1)", "It bends <b>towards the normal<\/b> in a denser medium (1)"], "cp": ["Light slows down in glass", "The wave changes speed, so it changes direction (refracts)", "It bends towards the normal in a denser medium"], "dp": ["Light speeds up in glass and bends away", "Refraction only happens in air", "The normal moves when light enters the glass"], "mand": 0}, {"id": "PHY-06-018", "t": 6, "s": "4.6.1.3", "k": "Recall", "m": 2, "ht": false, "q": "What happens to the <b>frequency and wavelength<\/b> of a wave when it refracts into a slower medium?", "a": ["Frequency <b>stays the same<\/b> (1)", "Wavelength <b>decreases<\/b> (1)"], "cp": ["Frequency stays the same", "Wavelength decreases"], "dp": ["Frequency increases and wavelength stays the same", "Both increase", "Frequency decreases and wavelength increases"], "mand": 0}, {"id": "PHY-06-019", "t": 6, "s": "4.6.2.1", "k": "Recall", "m": 7, "ht": false, "q": "List the <b>seven types<\/b> of EM wave from <b>longest to shortest<\/b> wavelength.", "a": ["<b>Radio<\/b> (1)", "<b>Microwave<\/b> (1)", "<b>Infrared<\/b> (1)", "<b>Visible light<\/b> (1)", "<b>Ultraviolet<\/b> (1)", "<b>X-ray<\/b> (1)", "<b>Gamma ray<\/b> (1)"], "cp": ["Radio", "Microwave", "Infrared", "Visible light", "Ultraviolet", "X-ray", "Gamma ray"], "dp": ["Gamma, X-ray, ultraviolet, visible, infrared, microwave, radio", "Radio, X-ray, microwave, infrared, light, ultraviolet, gamma", "Light, radio, microwave, infrared, ultraviolet, X-ray, gamma"], "mand": 0}, {"id": "PHY-06-020", "t": 6, "s": "4.6.2.1", "k": "Recall", "m": 2, "ht": false, "q": "Which has the <b>highest frequency<\/b> and which has the <b>longest wavelength<\/b>: radio, light or gamma?", "a": ["<b>Gamma<\/b> has the highest frequency (1)", "<b>Radio<\/b> has the longest wavelength (1)"], "cp": ["Gamma has the highest frequency", "Radio has the longest wavelength"], "dp": ["Radio has the highest frequency", "Gamma has the longest wavelength", "Light has both"], "mand": 0}, {"id": "PHY-06-021", "t": 6, "s": "4.6.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What do <b>all electromagnetic waves<\/b> have in common?", "a": ["They are all <b>transverse<\/b> waves (1)", "They all travel at the <b>same speed in a vacuum<\/b> (about 3 × 10<sup>8<\/sup> m/s) (1)"], "cp": ["They are all transverse waves", "They all travel at the same speed in a vacuum (about 3 × 10<sup>8<\/sup> m/s)"], "dp": ["They are all longitudinal", "They all need a medium to travel", "They all have the same frequency"], "mand": 0}, {"id": "PHY-06-022", "t": 6, "s": "4.6.2.2", "k": "Explain", "m": 2, "ht": false, "q": "What <b>changes<\/b> when radio waves are produced and when they are absorbed?", "a": ["Produced by <b>oscillations in electrical circuits<\/b> (1)", "Absorbed, they <b>create an alternating current<\/b> with the same frequency (1)"], "cp": ["Produced by oscillations in electrical circuits", "Absorbed, they create an alternating current with the same frequency"], "dp": ["Radio waves are produced by nuclear reactions", "Radio waves are made by hot objects only", "Absorbed radio waves make light"], "mand": 0}, {"id": "PHY-06-023", "t": 6, "s": "4.6.2.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>one use<\/b> of each: radio waves, microwaves and infrared.", "a": ["Radio waves: <b>broadcasting or communication<\/b> (1)", "Microwaves: <b>cooking or satellite communication<\/b> (1)", "Infrared: <b>remote controls, cameras, heaters<\/b> (1)"], "cp": ["Radio waves: broadcasting or communication", "Microwaves: cooking or satellite communication", "Infrared: remote controls, cameras, heaters"], "dp": ["Radio waves: cooking food", "Microwaves: sunbeds", "Infrared: X-ray pictures"], "mand": 0}, {"id": "PHY-06-024", "t": 6, "s": "4.6.2.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>one use<\/b> of each: visible light, ultraviolet and X-rays.", "a": ["Visible light: <b>vision, photography, fibre optics<\/b> (1)", "Ultraviolet: <b>sun tanning or security marking<\/b> (1)", "X-rays: <b>medical imaging of bones<\/b> (1)"], "cp": ["Visible light: vision, photography, fibre optics", "Ultraviolet: sun tanning or security marking", "X-rays: medical imaging of bones"], "dp": ["Visible light: cooking food", "Ultraviolet: sending radio programmes", "X-rays: heating homes"], "mand": 0}, {"id": "PHY-06-025", "t": 6, "s": "4.6.2.3", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two uses<\/b> of gamma rays.", "a": ["Any two (1 each):", "• <b>sterilising<\/b> medical equipment or food", "• <b>treating cancer<\/b> (radiotherapy)", "• <b>medical tracers<\/b> and imaging"], "cp": ["sterilising medical equipment or food", "treating cancer (radiotherapy)", "medical tracers and imaging"], "dp": ["Cooking food", "Sending TV signals", "Sunbeds"], "mand": 0}, {"id": "PHY-06-026", "t": 6, "s": "4.6.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Why are <b>microwaves<\/b> good for <b>satellite communication<\/b>?", "a": ["They can <b>pass through the atmosphere<\/b> (1)", "without being absorbed or refracted too much (1)"], "cp": ["They can pass through the atmosphere", "without being absorbed or refracted too much"], "dp": ["They are absorbed by the atmosphere", "They are blocked by clouds", "They are very slow"], "mand": 0}, {"id": "PHY-06-027", "t": 6, "s": "4.6.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Why are <b>optical fibres<\/b> used with infrared or visible light?", "a": ["Light is <b>totally internally reflected<\/b> along the fibre (1)", "so it carries <b>signals<\/b> with very little loss over long distances (1)"], "cp": ["Light is totally internally reflected along the fibre", "so it carries signals with very little loss over long distances"], "dp": ["Light is absorbed by the fibre", "Fibres store energy", "Fibres turn light into sound"], "mand": 0}, {"id": "PHY-06-028", "t": 6, "s": "4.6.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Why are <b>X-rays<\/b> useful in medicine but gamma rays used in cancer treatment?", "a": ["X-rays pass through <b>soft tissue<\/b> but are absorbed by <b>bone<\/b>, so form images (1)", "Gamma rays are <b>ionising<\/b> and kill cancer cells (1)"], "cp": ["X-rays pass through soft tissue but are absorbed by bone, so form images", "Gamma rays are ionising and kill cancer cells"], "dp": ["Gamma rays are absorbed by bone to make images", "X-rays kill cancer cells", "X-rays are not absorbed by anything"], "mand": 0}, {"id": "PHY-06-029", "t": 6, "s": "4.6.2.4", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three types of EM wave<\/b> that can damage cells, and what each can cause.", "a": ["<b>Ultraviolet<\/b>: skin burning and skin cancer, eye damage (1)", "<b>X-rays<\/b>: mutations and cancer (1)", "<b>Gamma rays<\/b>: mutations and cancer (1)"], "cp": ["Ultraviolet: skin burning and skin cancer, eye damage", "X-rays: mutations and cancer", "Gamma rays: mutations and cancer"], "dp": ["Radio waves: skin burning", "Microwaves: skin cancer", "Visible light: mutations"], "mand": 0}, {"id": "PHY-06-030", "t": 6, "s": "4.6.2.4", "k": "Explain", "m": 2, "ht": false, "q": "Why are <b>X-rays and gamma rays<\/b> more dangerous than radio waves?", "a": ["They have <b>high frequency<\/b> and energy (1)", "They are <b>ionising<\/b> and can damage cells or DNA (1)"], "cp": ["They have high frequency and energy", "They are ionising and can damage cells or DNA"], "dp": ["Radio waves have the highest energy", "They have long wavelengths", "X-rays and gamma rays are not absorbed"], "mand": 0}, {"id": "PHY-06-031", "t": 6, "s": "4.6.2.4", "k": "Explain", "m": 2, "ht": false, "q": "What is <b>radiation dose<\/b> and what unit is used?", "a": ["A measure of the <b>risk of harm<\/b> from exposure to radiation (1)", "Measured in <b>sieverts (Sv)<\/b> (or millisieverts) (1)"], "cp": ["A measure of the risk of harm from exposure to radiation", "Measured in sieverts (Sv) (or millisieverts)"], "dp": ["The power of the source in watts", "The energy of the source in joules", "The count rate in Bq"], "mand": 0}, {"id": "PHY-06-032", "t": 6, "s": "4.6.2.4", "k": "Evaluate", "m": 2, "ht": false, "q": "A hospital worker wears a badge that tracks radiation exposure. Why?", "a": ["To <b>measure the dose<\/b> received (1)", "So the exposure can be kept <b>below a safe limit<\/b> (1)"], "cp": ["To measure the dose received", "So the exposure can be kept below a safe limit"], "dp": ["To make the worker immune", "To measure the temperature", "To protect from radio waves"], "mand": 0}, {"id": "PHY-06-033", "t": 6, "s": "4.6.3", "k": "Recall", "m": 3, "ht": false, "q": "What happens to light at a <b>transparent<\/b>, <b>translucent<\/b> and <b>opaque<\/b> object?", "a": ["<b>Transparent<\/b>: light passes through (1)", "<b>Translucent<\/b>: some light passes, scattered (1)", "<b>Opaque<\/b>: light is absorbed or reflected (1)"], "cp": ["Transparent: light passes through", "Translucent: some light passes, scattered", "Opaque: light is absorbed or reflected"], "dp": ["Opaque objects let all light pass through", "Transparent objects absorb light", "Translucent objects block all light"], "mand": 0}, {"id": "PHY-06-034", "t": 6, "s": "4.6.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a <b>red filter<\/b> looks red and a <b>blue object<\/b> looks black under red light.", "a": ["A red filter <b>transmits red<\/b> and absorbs other colours (1)", "A blue object <b>reflects only blue<\/b> (1)", "There is <b>no blue light<\/b> in red light, so nothing is reflected and it looks black (1)"], "cp": ["A red filter transmits red and absorbs other colours", "A blue object reflects only blue", "There is no blue light in red light, so nothing is reflected and it looks black"], "dp": ["Red filters absorb red light", "Blue objects reflect red light", "A blue object looks purple under red light"], "mand": 0}, {"id": "PHY-06-035", "t": 6, "s": "4.6.3", "k": "Recall", "m": 2, "ht": false, "q": "Why does an object look a certain <b>colour<\/b> in white light?", "a": ["It <b>reflects that colour<\/b> (1)", "and <b>absorbs the other colours<\/b> (1)"], "cp": ["It reflects that colour", "and absorbs the other colours"], "dp": ["It makes that colour", "It absorbs that colour and reflects the rest", "It emits that colour"], "mand": 0}, {"id": "PHY-06-036", "t": 6, "s": "4.6.3", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>convex<\/b> and <b>concave<\/b> lenses.", "a": ["<b>Convex<\/b> lenses are thicker in the middle and <b>converge<\/b> rays to a focus (1)", "<b>Concave<\/b> lenses are thinner in the middle and <b>diverge<\/b> rays (1)", "Convex lenses can form <b>real or virtual images<\/b>; concave lenses form <b>virtual images<\/b> only (1)"], "cp": ["Convex lenses are thicker in the middle and converge rays to a focus", "Concave lenses are thinner in the middle and diverge rays", "Convex lenses can form real or virtual images; concave lenses form virtual images only"], "dp": ["Convex lenses diverge rays", "Concave lenses converge rays", "Both lenses make real images only"], "mand": 0}, {"id": "PHY-06-037", "t": 6, "s": "4.6.3", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>magnification<\/b>.", "a": ["magnification = <b>image height ÷ object height<\/b> (1)", "No units, it is a <b>ratio<\/b> (1)"], "cp": ["magnification = image height ÷ object height", "No units, it is a ratio"], "dp": ["magnification = object height ÷ image height", "magnification = image height × object height", "magnification = focal length ÷ height"], "mand": 0}, {"id": "PHY-06-038", "t": 6, "s": "4.6.3", "k": "Calculation", "m": 3, "ht": false, "q": "An object is 2 cm tall. Its image through a lens is 10 cm tall. Calculate the <b>magnification<\/b>.", "a": ["magnification = image height ÷ object height (1)", "= 10 ÷ 2 (1)", "= <b>5<\/b> (1)"], "cp": ["magnification = image height ÷ object height", "= 10 ÷ 2", "= 5"], "dp": ["0.2", "20", "8"], "mand": 0}, {"id": "PHY-06-039", "t": 6, "s": "4.6.3", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>real image<\/b> and a <b>virtual image<\/b>?", "a": ["A <b>real image<\/b> can be <b>projected on a screen<\/b> (rays cross) (1)", "A <b>virtual image<\/b> cannot; the rays only <b>appear<\/b> to come from the image (1)"], "cp": ["A real image can be projected on a screen (rays cross)", "A virtual image cannot; the rays only appear to come from the image"], "dp": ["A real image is always upside down and a virtual image is always the right way up", "A virtual image can be shown on a screen", "A real image cannot be seen"], "mand": 0}, {"id": "PHY-06-040", "t": 6, "s": "4.6.3", "k": "Explain", "m": 2, "ht": false, "q": "How does a <b>magnifying glass<\/b> work?", "a": ["It is a <b>convex lens<\/b> with the object <b>closer than the focal length<\/b> (1)", "It forms an <b>upright, magnified, virtual image<\/b> (1)"], "cp": ["It is a convex lens with the object closer than the focal length", "It forms an upright, magnified, virtual image"], "dp": ["It is a concave lens", "It forms a smaller real image", "It projects an image on a screen"], "mand": 0}, {"id": "PHY-06-041", "t": 6, "s": "4.6.3", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>focal length<\/b> of a convex lens?", "a": ["The distance from the <b>lens to the focus<\/b> (1)", "where rays parallel to the <b>axis<\/b> meet (1)"], "cp": ["The distance from the lens to the focus", "where rays parallel to the axis meet"], "dp": ["The distance between two lenses", "The height of the image", "The width of the lens"], "mand": 0}, {"id": "PHY-06-042", "t": 6, "s": "4.6.4", "k": "Explain", "m": 3, "ht": false, "q": "What is a <b>black body<\/b> and what does it emit?", "a": ["A black body is a <b>perfect absorber and emitter<\/b> of radiation (1)", "It <b>absorbs all radiation<\/b> that hits it (1)", "The <b>wavelengths and intensity emitted<\/b> depend on its temperature (1)"], "cp": ["A black body is a perfect absorber and emitter of radiation", "It absorbs all radiation that hits it", "The wavelengths and intensity emitted depend on its temperature"], "dp": ["A black body only emits light", "A black body is always cold", "It reflects all radiation"], "mand": 0}, {"id": "PHY-06-043", "t": 6, "s": "4.6.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain what happens to the radiation emitted by an object as it gets <b>hotter<\/b>.", "a": ["The <b>intensity increases<\/b> at all wavelengths (1)", "The <b>peak wavelength gets shorter<\/b> (1)", "So the object goes from infrared to <b>red hot then white hot<\/b> (1)"], "cp": ["The intensity increases at all wavelengths", "The peak wavelength gets shorter", "So the object goes from infrared to red hot then white hot"], "dp": ["The peak wavelength gets longer", "The object stops emitting radiation", "Intensity decreases"], "mand": 0}, {"id": "PHY-06-044", "t": 6, "s": "4.6.4", "k": "Practical", "m": 4, "ht": false, "q": "<b>Required practical:<\/b> How do you compare <b>infrared radiation<\/b> from different surfaces using a Leslie cube?", "a": ["Fill a <b>Leslie cube<\/b> with hot water (1)", "Use an <b>infrared detector<\/b> at the same distance from each face (1)", "Record the <b>reading<\/b> from each face (1)", "The <b>matt black<\/b> surface emits the <b>most<\/b> radiation, shiny silver the least (1)"], "cp": ["Fill a Leslie cube with hot water", "Use an infrared detector at the same distance from each face", "Record the reading from each face", "The matt black surface emits the most radiation, shiny silver the least"], "dp": ["Shine a torch at the cube", "Measure the mass of each face", "Use a voltmeter on the cube"], "mand": 0}, {"id": "PHY-06-045", "t": 6, "s": "4.6.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>Earth's temperature<\/b> stays steady, in terms of radiation.", "a": ["The Earth <b>absorbs radiation from the Sun<\/b> (1)", "and <b>emits radiation<\/b> (infrared) back into space (1)", "When absorbed = emitted, the <b>temperature is constant<\/b> (1)"], "cp": ["The Earth absorbs radiation from the Sun", "and emits radiation (infrared) back into space", "When absorbed = emitted, the temperature is constant"], "dp": ["The Earth does not emit radiation", "The Earth only reflects sunlight", "The Sun absorbs radiation from the Earth"], "mand": 0}, {"id": "PHY-06-046", "t": 6, "s": "4.6.5", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>range of human hearing<\/b>? What is <b>ultrasound<\/b>?", "a": ["About <b>20 Hz to 20 000 Hz<\/b> (1)", "Ultrasound is sound with a frequency <b>above 20 000 Hz<\/b> (1)"], "cp": ["About 20 Hz to 20 000 Hz", "Ultrasound is sound with a frequency above 20 000 Hz"], "dp": ["Hearing range is 2 Hz to 2000 Hz", "Ultrasound is below 20 Hz", "Hearing range is 20 000 Hz to 200 000 Hz"], "mand": 0}, {"id": "PHY-06-047", "t": 6, "s": "4.6.5", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two uses<\/b> of ultrasound.", "a": ["Any two (1 each):", "• <b>medical scanning<\/b> of a foetus", "• <b>breaking kidney stones<\/b>", "• <b>sonar<\/b> (echo sounding)", "• <b>industrial<\/b> flaw detection or cleaning"], "cp": ["medical scanning of a foetus", "breaking kidney stones", "sonar (echo sounding)", "industrial flaw detection or cleaning"], "dp": ["Cooking food", "Sending TV signals", "Sunbeds"], "mand": 0}, {"id": "PHY-06-048", "t": 6, "s": "4.6.5", "k": "Calculation", "m": 3, "ht": false, "q": "A ship sends ultrasound that returns after 0.4 s. The speed of sound in water is 1500 m/s. Calculate the <b>depth<\/b>.", "a": ["Distance there and back = 1500 × 0.4 = 600 m (1)", "Divide by 2 for one way (1)", "= <b>300 m<\/b> (1)"], "cp": ["Distance there and back = 1500 × 0.4 = 600 m", "Divide by 2 for one way", "= 300 m"], "dp": ["600 m", "3750 m", "1900 m"], "mand": 0}, {"id": "PHY-06-049", "t": 6, "s": "4.6.5", "k": "Explain", "m": 2, "ht": false, "q": "How does an ultrasound scan form an <b>image<\/b>?", "a": ["The waves are <b>reflected<\/b> at boundaries between different tissues (1)", "The <b>time for echoes<\/b> to return gives the distance and builds up the image (1)"], "cp": ["The waves are reflected at boundaries between different tissues", "The time for echoes to return gives the distance and builds up the image"], "dp": ["The waves are absorbed by the tissues", "The waves are converted to X-rays", "Echoes are not used"], "mand": 0}, {"id": "PHY-06-050", "t": 6, "s": "4.6.5", "k": "Explain", "m": 2, "ht": false, "q": "Why can sound <b>not travel through a vacuum<\/b>?", "a": ["Sound is a <b>longitudinal wave<\/b> that needs particles (1)", "There are <b>no particles<\/b> in a vacuum to pass on the vibrations (1)"], "cp": ["Sound is a longitudinal wave that needs particles", "There are no particles in a vacuum to pass on the vibrations"], "dp": ["Sound is an EM wave", "Sound travels faster in a vacuum", "Particles are too hot in a vacuum"], "mand": 0}, {"id": "PHY-06-051", "t": 6, "s": "4.6.5", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>P-waves and S-waves<\/b> from earthquakes.", "a": ["P-waves are <b>longitudinal<\/b>, S-waves are <b>transverse<\/b> (1)", "P-waves are <b>faster<\/b> (1)", "P-waves travel through <b>solids and liquids<\/b>, S-waves only through <b>solids<\/b> (1)"], "cp": ["P-waves are longitudinal, S-waves are transverse", "P-waves are faster", "P-waves travel through solids and liquids, S-waves only through solids"], "dp": ["S-waves are longitudinal and travel through liquids", "P-waves only travel through solids", "S-waves are faster than P-waves"], "mand": 0}, {"id": "PHY-06-052", "t": 6, "s": "4.6.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>seismic waves<\/b> give evidence that the Earth has a <b>liquid outer core<\/b>.", "a": ["S-waves <b>cannot pass through liquids<\/b> (1)", "There is a <b>shadow zone<\/b> where S-waves are not detected (1)", "P-waves <b>change direction (refract)<\/b> at the core boundary, showing a liquid core (1)"], "cp": ["S-waves cannot pass through liquids", "There is a shadow zone where S-waves are not detected", "P-waves change direction (refract) at the core boundary, showing a liquid core"], "dp": ["P-waves cannot travel through the core", "S-waves pass through the whole Earth", "Earthquakes only happen in the core"], "mand": 0}, {"id": "PHY-06-H01", "t": 6, "s": "4.6.1.3", "k": "Explain", "m": 3, "ht": true, "q": "Use <b>wavefront diagrams<\/b> to explain refraction when light slows down.", "a": ["Wavefronts <b>slow down on entering<\/b> the new material (1)", "The part of the wave that enters first <b>slows first<\/b> (1)", "So the wavefronts <b>change direction<\/b> and <b>wavelength shortens<\/b> (1)"], "cp": ["Wavefronts slow down on entering the new material", "The part of the wave that enters first slows first", "So the wavefronts change direction and wavelength shortens"], "dp": ["Wavefronts speed up and stay in a straight line", "The frequency changes but the wavelength does not", "The light changes colour and bends because of it"], "mand": 0}, {"id": "PHY-06-H02", "t": 6, "s": "4.6.2.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain how <b>changes in atoms and nuclei<\/b> can produce EM waves.", "a": ["Electrons <b>moving to a lower energy level<\/b> give out EM radiation (1)", "Nuclear changes produce <b>gamma rays<\/b> (1)", "Different changes give <b>different wavelengths<\/b> (1)"], "cp": ["Electrons moving to a lower energy level give out EM radiation", "Nuclear changes produce gamma rays", "Different changes give different wavelengths"], "dp": ["Atoms only absorb EM waves", "Gamma rays are made by electrons", "Nuclear changes produce radio waves only"], "mand": 0}, {"id": "PHY-07-001", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What happens when the <b>poles of two magnets<\/b> are brought together?", "a": ["<b>Like poles repel<\/b> (1)", "<b>Opposite poles attract<\/b> (1)"], "cp": ["Like poles repel", "Opposite poles attract"], "dp": ["Like poles attract", "Opposite poles repel", "There is no force between magnets"], "mand": 0}, {"id": "PHY-07-002", "t": 7, "s": "4.7.1.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between a <b>permanent<\/b> and an <b>induced<\/b> magnet?", "a": ["A <b>permanent<\/b> magnet always has its own magnetic field (1)", "An <b>induced<\/b> magnet becomes magnetic only <b>while in a magnetic field<\/b> and loses it when removed (1)"], "cp": ["A permanent magnet always has its own magnetic field", "An induced magnet becomes magnetic only while in a magnetic field and loses it when removed"], "dp": ["Induced magnets are always magnetic", "Permanent magnets only work near other magnets", "They are the same"], "mand": 0}, {"id": "PHY-07-003", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two magnetic materials<\/b>. Which is attracted by an induced magnet?", "a": ["Any two: <b>iron, steel, cobalt, nickel<\/b> (1)", "They are attracted because the magnet <b>induces<\/b> magnetism in them (1)"], "cp": ["Any two: iron, steel, cobalt, nickel", "They are attracted because the magnet induces magnetism in them"], "dp": ["Copper and aluminium", "Plastic and glass", "Gold and silver"], "mand": 0}, {"id": "PHY-07-004", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>magnetic field<\/b>?", "a": ["The <b>region around a magnet<\/b> (1)", "where a <b>magnetic material<\/b> or another magnet feels a <b>force<\/b> (1)"], "cp": ["The region around a magnet", "where a magnetic material or another magnet feels a force"], "dp": ["The region where charges are produced", "A region of high temperature", "The region where light travels"], "mand": 0}, {"id": "PHY-07-005", "t": 7, "s": "4.7.1.1", "k": "Explain", "m": 2, "ht": false, "q": "How does the <b>strength of a magnetic field<\/b> change with distance from a magnet?", "a": ["The field is <b>strongest at the poles<\/b> (1)", "and gets <b>weaker with distance<\/b> from the magnet (1)"], "cp": ["The field is strongest at the poles", "and gets weaker with distance from the magnet"], "dp": ["The field gets stronger with distance", "The field is the same everywhere", "The field is strongest in the centre of the magnet"], "mand": 0}, {"id": "PHY-07-006", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe a <b>magnetic field line<\/b> pattern around a bar magnet.", "a": ["Lines go from the <b>north pole to the south pole<\/b> (1)", "Lines are <b>closest together<\/b> at the poles, where the field is strongest (1)", "The direction shows the <b>force on a north pole<\/b> placed there (1)"], "cp": ["Lines go from the north pole to the south pole", "Lines are closest together at the poles, where the field is strongest", "The direction shows the force on a north pole placed there"], "dp": ["Lines go from south to north outside the magnet", "Lines cross each other", "Lines get closer far from the magnet"], "mand": 0}, {"id": "PHY-07-007", "t": 7, "s": "4.7.1.2", "k": "Explain", "m": 2, "ht": false, "q": "How does a <b>compass<\/b> work and what does it show about the Earth?", "a": ["The needle is a <b>small magnet<\/b> that lines up with the <b>magnetic field<\/b> (1)", "The Earth has a <b>magnetic field<\/b> like a bar magnet, as if there is a <b>core of magnetic material<\/b> (1)"], "cp": ["The needle is a small magnet that lines up with the magnetic field", "The Earth has a magnetic field like a bar magnet, as if there is a core of magnetic material"], "dp": ["A compass points to the Equator", "The Earth has no magnetic field", "The compass needle is not magnetic"], "mand": 0}, {"id": "PHY-07-008", "t": 7, "s": "4.7.1.2", "k": "Practical", "m": 3, "ht": false, "q": "How can you <b>plot the magnetic field<\/b> of a bar magnet with a compass?", "a": ["Place the <b>compass near one pole<\/b> and mark the <b>needle's direction<\/b> with dots (1)", "Move the compass so that it <b>starts where the last dot ended<\/b> (1)", "<b>Join the dots<\/b> to make a field line (1)"], "cp": ["Place the compass near one pole and mark the needle's direction with dots", "Move the compass so that it starts where the last dot ended", "Join the dots to make a field line"], "dp": ["Hold the compass far away from the magnet", "Put the compass on top of the magnet", "Use a voltmeter to plot the field"], "mand": 0}, {"id": "PHY-07-009", "t": 7, "s": "4.7.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What happens when a <b>current flows in a wire<\/b>?", "a": ["A <b>magnetic field<\/b> is produced around the wire (1)", "in <b>circles<\/b> around the wire (1)"], "cp": ["A magnetic field is produced around the wire", "in circles around the wire"], "dp": ["A gravitational field is made", "The wire becomes a magnet that never changes", "There is a magnetic field only at the ends"], "mand": 0}, {"id": "PHY-07-010", "t": 7, "s": "4.7.2.1", "k": "Explain", "m": 2, "ht": false, "q": "How does the <b>strength of the magnetic field<\/b> around a wire change?", "a": ["A <b>larger current<\/b> gives a <b>stronger<\/b> field (1)", "The field is <b>stronger closer to the wire<\/b> (1)"], "cp": ["A larger current gives a stronger field", "The field is stronger closer to the wire"], "dp": ["A larger current gives a weaker field", "The field is stronger further away", "Current does not change the field"], "mand": 0}, {"id": "PHY-07-011", "t": 7, "s": "4.7.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>solenoid<\/b> and what does its <b>field<\/b> look like?", "a": ["A <b>coil of wire<\/b> carrying a current (1)", "Its field is like a <b>bar magnet<\/b> and strong and <b>uniform inside<\/b> the coil (1)"], "cp": ["A coil of wire carrying a current", "Its field is like a bar magnet and strong and uniform inside the coil"], "dp": ["A single straight wire with a weak field", "A magnet with no field inside", "A coil with no magnetic field"], "mand": 0}, {"id": "PHY-07-012", "t": 7, "s": "4.7.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to make an <b>electromagnet stronger<\/b>.", "a": ["Any three (1 each):", "• <b>increase the current<\/b>", "• add <b>more turns<\/b> of wire", "• add an <b>iron core<\/b>", "• make the coil <b>shorter or tighter<\/b>"], "cp": ["increase the current", "add more turns of wire", "add an iron core", "make the coil shorter or tighter"], "dp": ["Use a thinner wire only", "Use a plastic core", "Reduce the current"], "mand": 0}, {"id": "PHY-07-013", "t": 7, "s": "4.7.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two advantages<\/b> of an electromagnet over a permanent magnet.", "a": ["It can be <b>switched on and off<\/b> (1)", "Its <b>strength can be changed<\/b> by changing the current (1)"], "cp": ["It can be switched on and off", "Its strength can be changed by changing the current"], "dp": ["It is always on", "It can never change strength", "It does not need a current"], "mand": 0}, {"id": "PHY-07-014", "t": 7, "s": "4.7.2.1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two uses<\/b> of electromagnets.", "a": ["Any two (1 each):", "• <b>scrapyard cranes<\/b>", "• <b>electric bells<\/b>", "• <b>relays<\/b>", "• <b>door locks<\/b>"], "cp": ["scrapyard cranes", "electric bells", "relays", "door locks"], "dp": ["Cooking food", "Heating the home", "Generating light"], "mand": 0}, {"id": "PHY-07-015", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a <b>wire carrying a current<\/b> in a magnetic field experiences a <b>force<\/b>.", "a": ["The wire has its own <b>magnetic field<\/b> (1)", "It <b>interacts<\/b> with the field of the magnet (1)", "This produces a <b>force<\/b> on the wire (the motor effect) (1)"], "cp": ["The wire has its own magnetic field", "It interacts with the field of the magnet", "This produces a force on the wire (the motor effect)"], "dp": ["The wire becomes heavier", "The current is converted to gravity", "There is no force on the wire"], "mand": 0}, {"id": "PHY-07-016", "t": 7, "s": "4.7.2.2", "k": "Recall", "m": 2, "ht": false, "q": "What is <b>Fleming's left-hand rule<\/b> used for? What do the three fingers show?", "a": ["To find the <b>direction of the force<\/b> on a current-carrying wire in a field (1)", "<b>Thumb = force (motion)<\/b>, <b>first finger = field<\/b>, <b>second finger = current<\/b> (1)"], "cp": ["To find the direction of the force on a current-carrying wire in a field", "Thumb = force (motion), first finger = field, second finger = current"], "dp": ["It is used to find the direction of the current only", "Thumb = current, first finger = force, second finger = field", "It is used for the right hand to find charge"], "mand": 0}, {"id": "PHY-07-017", "t": 7, "s": "4.7.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>generator effect<\/b>?", "a": ["A <b>potential difference<\/b> is induced (1)", "when a <b>conductor moves relative to a magnetic field<\/b> or the field changes (1)"], "cp": ["A potential difference is induced", "when a conductor moves relative to a magnetic field or the field changes"], "dp": ["A current causes a magnetic field", "A magnet gets stronger when a current flows", "A wire becomes warm in a field"], "mand": 0}, {"id": "PHY-07-018", "t": 7, "s": "4.7.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to <b>increase the induced potential difference<\/b>.", "a": ["Any three (1 each):", "• <b>move the magnet faster<\/b>", "• use a <b>stronger magnet<\/b>", "• add <b>more turns<\/b> to the coil", "• use a <b>larger coil area<\/b>"], "cp": ["move the magnet faster", "use a stronger magnet", "add more turns to the coil", "use a larger coil area"], "dp": ["Use a weaker magnet", "Move the magnet slower", "Use fewer turns on the coil"], "mand": 0}, {"id": "PHY-07-019", "t": 7, "s": "4.7.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Describe what happens when a <b>magnet is pushed in and out<\/b> of a coil connected to a meter.", "a": ["The meter <b>deflects<\/b> when the magnet moves (1)", "The <b>direction reverses<\/b> when the magnet is pulled out (1)", "<b>No reading<\/b> when the magnet is still (1)"], "cp": ["The meter deflects when the magnet moves", "The direction reverses when the magnet is pulled out", "No reading when the magnet is still"], "dp": ["There is a constant reading", "The meter shows a reading only when the magnet is still", "The meter always shows zero"], "mand": 0}, {"id": "PHY-07-020", "t": 7, "s": "4.7.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how an <b>alternator<\/b> (ac generator) works.", "a": ["A <b>coil rotates<\/b> in a magnetic field (1)", "The coil <b>cuts field lines<\/b>, inducing a p.d. that <b>changes direction every half turn<\/b> (1)", "<b>Slip rings and brushes<\/b> carry the alternating current out (1)"], "cp": ["A coil rotates in a magnetic field", "The coil cuts field lines, inducing a p.d. that changes direction every half turn", "Slip rings and brushes carry the alternating current out"], "dp": ["A magnet is turned by a battery", "The coil produces dc without slip rings", "The coil is stationary and the magnet pushes it"], "mand": 0}, {"id": "PHY-07-021", "t": 7, "s": "4.7.3.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between a <b>dynamo<\/b> and an <b>alternator<\/b>?", "a": ["A <b>dynamo<\/b> produces <b>direct current (dc)<\/b> using a split-ring commutator (1)", "An <b>alternator<\/b> produces <b>alternating current (ac)<\/b> using slip rings (1)"], "cp": ["A dynamo produces direct current (dc) using a split-ring commutator", "An alternator produces alternating current (ac) using slip rings"], "dp": ["A dynamo makes ac only", "An alternator uses a commutator", "They both produce dc"], "mand": 0}, {"id": "PHY-07-022", "t": 7, "s": "4.7.3.1", "k": "Data", "m": 3, "ht": false, "q": "Describe how the graph of <b>output p.d.<\/b> from an alternator changes with time, if the coil spins faster.", "a": ["The graph is <b>sinusoidal<\/b> (1)", "The <b>maximum p.d. increases<\/b> (1)", "The <b>frequency increases<\/b> (more waves per second) (1)"], "cp": ["The graph is sinusoidal", "The maximum p.d. increases", "The frequency increases (more waves per second)"], "dp": ["The graph becomes a straight line", "The p.d. goes down", "The frequency decreases"], "mand": 0}, {"id": "PHY-07-023", "t": 7, "s": "4.7.3.2", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>transformer<\/b> and what type of current does it need?", "a": ["A device that <b>changes the potential difference<\/b> of an alternating current (1)", "It needs an <b>alternating<\/b> current (1)"], "cp": ["A device that changes the potential difference of an alternating current", "It needs an alternating current"], "dp": ["A device that makes dc from ac", "A device that stores energy", "A device that works with direct current only"], "mand": 0}, {"id": "PHY-07-024", "t": 7, "s": "4.7.3.2", "k": "Recall", "m": 2, "ht": false, "q": "Compare a <b>step-up<\/b> and a <b>step-down<\/b> transformer.", "a": ["<b>Step-up<\/b>: more turns on the secondary coil, p.d. <b>increases<\/b> (1)", "<b>Step-down<\/b>: fewer turns on the secondary coil, p.d. <b>decreases<\/b> (1)"], "cp": ["Step-up: more turns on the secondary coil, p.d. increases", "Step-down: fewer turns on the secondary coil, p.d. decreases"], "dp": ["Step-up: fewer secondary turns", "Step-down: more secondary turns", "They have the same number of turns"], "mand": 0}, {"id": "PHY-07-025", "t": 7, "s": "4.7.3.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking the <b>potential differences and turns<\/b> of a transformer.", "a": ["<b>V<sub>p<\/sub> ÷ V<sub>s<\/sub> = N<sub>p<\/sub> ÷ N<sub>s<\/sub><\/b> (1)", "(p.d. across primary ÷ p.d. across secondary = turns on primary ÷ turns on secondary) (1)"], "cp": ["V<sub>p<\/sub> ÷ V<sub>s<\/sub> = N<sub>p<\/sub> ÷ N<sub>s<\/sub>", "(p.d. across primary ÷ p.d. across secondary = turns on primary ÷ turns on secondary)"], "dp": ["V<sub>p<\/sub> × V<sub>s<\/sub> = N<sub>p<\/sub> × N<sub>s<\/sub>", "V<sub>p<\/sub> ÷ V<sub>s<\/sub> = N<sub>s<\/sub> ÷ N<sub>p<\/sub>", "V<sub>p<\/sub> + N<sub>p<\/sub> = V<sub>s<\/sub> + N<sub>s<\/sub>"], "mand": 0}, {"id": "PHY-07-026", "t": 7, "s": "4.7.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "A transformer has 100 turns on the primary and 500 on the secondary. The input is 12 V.<br/><br/>Calculate the <b>output p.d.<\/b>", "a": ["V<sub>p<\/sub> ÷ V<sub>s<\/sub> = N<sub>p<\/sub> ÷ N<sub>s<\/sub> (1)", "12 ÷ V<sub>s<\/sub> = 100 ÷ 500 (1)", "V<sub>s<\/sub> = <b>60 V<\/b> (1)"], "cp": ["V<sub>p<\/sub> ÷ V<sub>s<\/sub> = N<sub>p<\/sub> ÷ N<sub>s<\/sub>", "12 ÷ V<sub>s<\/sub> = 100 ÷ 500", "V<sub>s<\/sub> = 60 V"], "dp": ["2.4 V", "600 V", "5 V"], "mand": 0}, {"id": "PHY-07-027", "t": 7, "s": "4.7.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "A transformer has a 230 V input and 23 V output. The primary coil has 1000 turns. Calculate the number of turns on the <b>secondary<\/b>.", "a": ["230 ÷ 23 = 1000 ÷ N<sub>s<\/sub> (1)", "N<sub>s<\/sub> = 1000 × 23 ÷ 230 (1)", "= <b>100 turns<\/b> (1)"], "cp": ["230 ÷ 23 = 1000 ÷ N<sub>s<\/sub>", "N<sub>s<\/sub> = 1000 × 23 ÷ 230", "= 100 turns"], "dp": ["10 000 turns", "1000 turns", "23 turns"], "mand": 0}, {"id": "PHY-07-028", "t": 7, "s": "4.7.3.2", "k": "Recall", "m": 2, "ht": false, "q": "For a <b>100% efficient transformer<\/b>, how is the power input related to the output?", "a": ["Power in = power out (1)", "<b>V<sub>p<\/sub> I<sub>p<\/sub> = V<sub>s<\/sub> I<sub>s<\/sub><\/b> (1)"], "cp": ["Power in = power out", "V<sub>p<\/sub> I<sub>p<\/sub> = V<sub>s<\/sub> I<sub>s<\/sub>"], "dp": ["Power in is greater than power out", "V<sub>p<\/sub> I<sub>s<\/sub> = V<sub>s<\/sub> I<sub>p<\/sub>", "The output power is zero"], "mand": 0}, {"id": "PHY-07-029", "t": 7, "s": "4.7.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 100% efficient transformer has an input of 10 V and 6 A. The output is 60 V. Calculate the <b>output current<\/b>.", "a": ["V<sub>p<\/sub> I<sub>p<\/sub> = V<sub>s<\/sub> I<sub>s<\/sub>, so 10 × 6 = 60 × I<sub>s<\/sub> (1)", "I<sub>s<\/sub> = 60 ÷ 60 (1)", "= <b>1 A<\/b> (1)"], "cp": ["V<sub>p<\/sub> I<sub>p<\/sub> = V<sub>s<\/sub> I<sub>s<\/sub>, so 10 × 6 = 60 × I<sub>s<\/sub>", "I<sub>s<\/sub> = 60 ÷ 60", "= 1 A"], "dp": ["36 A", "10 A", "0.17 A"], "mand": 0}, {"id": "PHY-07-030", "t": 7, "s": "4.7.3.2", "k": "Explain", "m": 2, "ht": false, "q": "A step-up transformer increases voltage. Why does the <b>current decrease<\/b>?", "a": ["Power in = power out (for an efficient transformer) (1)", "So <b>if voltage goes up, current goes down<\/b> (1)"], "cp": ["Power in = power out (for an efficient transformer)", "So if voltage goes up, current goes down"], "dp": ["Because the transformer breaks the circuit", "Because power is created in the transformer", "Both voltage and current go up"], "mand": 0}, {"id": "PHY-07-031", "t": 7, "s": "4.7.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Why does a <b>soft iron core<\/b> make an electromagnet stronger?", "a": ["Iron is <b>easily magnetised<\/b> by the coil's field (1)", "so the core becomes a magnet itself and <b>adds to the field<\/b> (1)"], "cp": ["Iron is easily magnetised by the coil's field", "so the core becomes a magnet itself and adds to the field"], "dp": ["Iron is a good insulator", "Iron reduces the current", "Iron makes the coil bigger"], "mand": 0}, {"id": "PHY-07-032", "t": 7, "s": "4.7.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why is <b>steel<\/b> used for a permanent magnet but <b>soft iron<\/b> for an electromagnet?", "a": ["Steel <b>keeps its magnetism<\/b> (1)", "Soft iron <b>loses its magnetism<\/b> when the current is switched off (1)"], "cp": ["Steel keeps its magnetism", "Soft iron loses its magnetism when the current is switched off"], "dp": ["Soft iron is permanently magnetic", "Steel cannot be magnetised", "They behave the same"], "mand": 0}, {"id": "PHY-07-H01", "t": 7, "s": "4.7.2.2", "k": "Recall", "m": 2, "ht": true, "q": "What is the <b>equation for the force<\/b> on a wire in a magnetic field?", "a": ["force = <b>magnetic flux density × current × length<\/b> (1)", "F = B I l, with B in <b>tesla (T)<\/b> (1)"], "cp": ["force = magnetic flux density × current × length", "F = B I l, with B in tesla (T)"], "dp": ["F = B ÷ (I l)", "F = B + I + l", "F = I ÷ (B l)"], "mand": 0}, {"id": "PHY-07-H02", "t": 7, "s": "4.7.2.2", "k": "Calculation", "m": 3, "ht": true, "q": "A wire 0.2 m long carries 5 A in a field of 0.4 T at right angles. Calculate the <b>force<\/b>.", "a": ["F = B I l (1)", "= 0.4 × 5 × 0.2 (1)", "= <b>0.4 N<\/b> (1)"], "cp": ["F = B I l", "= 0.4 × 5 × 0.2", "= 0.4 N"], "dp": ["2 N", "25 N", "0.08 N"], "mand": 0}, {"id": "PHY-07-H03", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 2, "ht": true, "q": "How can you make the <b>force<\/b> on a wire in a magnetic field <b>bigger<\/b>?", "a": ["Increase the <b>current<\/b> (1)", "Use a <b>stronger magnet<\/b> or a longer wire in the field (1)"], "cp": ["Increase the current", "Use a stronger magnet or a longer wire in the field"], "dp": ["Decrease the current", "Use a weaker magnet", "Make the wire shorter"], "mand": 0}, {"id": "PHY-07-H04", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain how a <b>simple electric motor<\/b> turns.", "a": ["A <b>coil<\/b> carrying a current is in a <b>magnetic field<\/b> (1)", "The forces on the <b>two sides<\/b> act in <b>opposite directions<\/b> (1)", "A <b>split-ring commutator<\/b> reverses the current every half turn so the coil keeps turning (1)"], "cp": ["A coil carrying a current is in a magnetic field", "The forces on the two sides act in opposite directions", "A split-ring commutator reverses the current every half turn so the coil keeps turning"], "dp": ["The forces on both sides act in the same direction", "The coil does not need a commutator", "The magnet moves to turn the coil"], "mand": 0}, {"id": "PHY-07-H05", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 2, "ht": true, "q": "How can you make an electric motor <b>spin faster<\/b>?", "a": ["Increase the <b>current<\/b> (1)", "Use a <b>stronger magnet<\/b> or more turns on the coil (1)"], "cp": ["Increase the current", "Use a stronger magnet or more turns on the coil"], "dp": ["Use less current", "Remove the magnet", "Use a weaker magnet"], "mand": 0}, {"id": "PHY-07-H06", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain how a <b>loudspeaker<\/b> works.", "a": ["A <b>coil<\/b> carrying alternating current is near a <b>magnet<\/b> (1)", "The current <b>changes direction<\/b>, so the force on the coil <b>moves it back and forth<\/b> (1)", "It makes the <b>cone vibrate<\/b> to produce sound waves (1)"], "cp": ["A coil carrying alternating current is near a magnet", "The current changes direction, so the force on the coil moves it back and forth", "It makes the cone vibrate to produce sound waves"], "dp": ["The magnet is fixed to the cone and does not move", "The coil is connected to a battery with direct current", "The cone is heated to make sound"], "mand": 0}, {"id": "PHY-07-H07", "t": 7, "s": "4.7.3.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain how a <b>microphone<\/b> works.", "a": ["Sound waves make a <b>diaphragm vibrate<\/b> (1)", "A <b>coil attached to it<\/b> moves in a magnetic field (1)", "This <b>induces an alternating p.d.<\/b> that matches the sound wave (1)"], "cp": ["Sound waves make a diaphragm vibrate", "A coil attached to it moves in a magnetic field", "This induces an alternating p.d. that matches the sound wave"], "dp": ["The sound makes a battery produce current", "A magnet is heated by sound", "The diaphragm makes a constant p.d."], "mand": 0}, {"id": "PHY-07-H08", "t": 7, "s": "4.7.3.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain how a transformer <b>works<\/b>.", "a": ["A <b>primary coil<\/b> carries ac, creating a <b>changing magnetic field<\/b> in the iron core (1)", "The changing field <b>induces a p.d.<\/b> in the <b>secondary coil<\/b> (1)", "The <b>number of turns<\/b> decides whether p.d. goes up or down (1)"], "cp": ["A primary coil carries ac, creating a changing magnetic field in the iron core", "The changing field induces a p.d. in the secondary coil", "The number of turns decides whether p.d. goes up or down"], "dp": ["A dc supply makes the field in the core constant", "Both coils are connected electrically", "The core is made of copper"], "mand": 0}, {"id": "PHY-08-001", "t": 8, "s": "4.8.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>parts of the solar system<\/b> in order of size, smallest to largest, from: planet, Sun, moon.", "a": ["<b>Moon<\/b> (1)", "<b>Planet<\/b> (1)", "<b>Sun<\/b> (1)"], "cp": ["Moon", "Planet", "Sun"], "dp": ["Sun, planet, moon", "Planet, moon, Sun", "Moon, Sun, planet"], "mand": 0}, {"id": "PHY-08-002", "t": 8, "s": "4.8.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>galaxy<\/b>? Name our galaxy.", "a": ["A <b>huge group of stars<\/b> held together by gravity (1)", "Our galaxy is the <b>Milky Way<\/b> (1)"], "cp": ["A huge group of stars held together by gravity", "Our galaxy is the Milky Way"], "dp": ["A group of planets", "The Andromeda cluster", "A large star"], "mand": 0}, {"id": "PHY-08-003", "t": 8, "s": "4.8.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>dwarf planet<\/b>, and what object is an example?", "a": ["A <b>small planet-like object<\/b> that orbits the Sun but has not cleared its orbit (1)", "Example: <b>Pluto<\/b> (1)"], "cp": ["A small planet-like object that orbits the Sun but has not cleared its orbit", "Example: Pluto"], "dp": ["A moon of Earth", "A very small star", "A comet with a long tail"], "mand": 0}, {"id": "PHY-08-004", "t": 8, "s": "4.8.1.1", "k": "Explain", "m": 3, "ht": false, "q": "Describe how the <b>Sun and solar system formed<\/b>.", "a": ["Gravity pulled a <b>cloud of dust and gas<\/b> (nebula) together (1)", "It got <b>hot and dense<\/b>, so nuclear fusion started and the <b>Sun formed<\/b> (1)", "Remaining material formed <b>planets<\/b> and moons (1)"], "cp": ["Gravity pulled a cloud of dust and gas (nebula) together", "It got hot and dense, so nuclear fusion started and the Sun formed", "Remaining material formed planets and moons"], "dp": ["A big explosion of dust formed the planets first", "The Sun formed after all the planets", "Planets formed from the Sun's fusion"], "mand": 0}, {"id": "PHY-08-005", "t": 8, "s": "4.8.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Name the <b>two types of satellite<\/b> and give an example of each.", "a": ["<b>Natural<\/b>: e.g. the <b>Moon<\/b> (1)", "<b>Artificial<\/b>: e.g. <b>communications satellite<\/b> or weather satellite (1)"], "cp": ["Natural: e.g. the Moon", "Artificial: e.g. communications satellite or weather satellite"], "dp": ["Natural: the Sun, Artificial: the Moon", "Both are made by humans", "Natural: planets, Artificial: stars"], "mand": 0}, {"id": "PHY-08-006", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Describe the <b>life cycle of a star<\/b> like the Sun.", "a": ["A <b>nebula<\/b> collapses under gravity to form a <b>protostar<\/b> (1)", "It becomes a <b>main sequence star<\/b> (hydrogen fuses to helium) (1)", "It then becomes a <b>red giant<\/b> and finally a <b>white dwarf<\/b> (1)"], "cp": ["A nebula collapses under gravity to form a protostar", "It becomes a main sequence star (hydrogen fuses to helium)", "It then becomes a red giant and finally a white dwarf"], "dp": ["Black hole then neutron star then red giant", "Main sequence then nebula then white dwarf", "Red giant then main sequence then supernova"], "mand": 0}, {"id": "PHY-08-007", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Describe what happens to a star <b>much bigger than the Sun<\/b> at the end of its life.", "a": ["It becomes a <b>red supergiant<\/b> (1)", "then <b>explodes<\/b> as a <b>supernova<\/b> (1)", "leaving a <b>neutron star<\/b> or a <b>black hole<\/b> (1)"], "cp": ["It becomes a red supergiant", "then explodes as a supernova", "leaving a neutron star or a black hole"], "dp": ["It becomes a white dwarf", "It turns into a nebula", "It stays as a main sequence star forever"], "mand": 0}, {"id": "PHY-08-008", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Why is a main sequence star <b>stable<\/b>?", "a": ["The <b>outward force<\/b> from fusion energy (1)", "balances the <b>inward force<\/b> of gravity (1)"], "cp": ["The outward force from fusion energy", "balances the inward force of gravity"], "dp": ["Gravity is zero", "Fusion stops", "The star has no mass"], "mand": 0}, {"id": "PHY-08-009", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 3, "ht": false, "q": "How were the <b>elements heavier than iron<\/b> formed and spread across the Universe?", "a": ["Heavy elements form during a <b>supernova<\/b> (1)", "The explosion <b>spreads them<\/b> into space (1)", "They can form <b>new stars and planets<\/b> later (1)"], "cp": ["Heavy elements form during a supernova", "The explosion spreads them into space", "They can form new stars and planets later"], "dp": ["They were all made in the Big Bang", "They form at the centre of the Earth", "They are made in main sequence stars only"], "mand": 0}, {"id": "PHY-08-010", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>fusion in stars<\/b> makes elements up to iron.", "a": ["<b>Hydrogen nuclei fuse<\/b> to form helium (1)", "Then heavier nuclei fuse in <b>larger stars<\/b> up to iron (1)"], "cp": ["Hydrogen nuclei fuse to form helium", "Then heavier nuclei fuse in larger stars up to iron"], "dp": ["Helium nuclei split to make hydrogen", "Elements are made by chemical reactions in the Sun", "Stars only burn coal"], "mand": 0}, {"id": "PHY-08-011", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 2, "ht": false, "q": "What is a <b>black hole<\/b>?", "a": ["A <b>very dense region<\/b> with huge mass (1)", "where gravity is so strong that <b>not even light can escape<\/b> (1)"], "cp": ["A very dense region with huge mass", "where gravity is so strong that not even light can escape"], "dp": ["A hole in space with nothing in it", "A very cold star", "A galaxy with no stars"], "mand": 0}, {"id": "PHY-08-012", "t": 8, "s": "4.8.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Why does a <b>geostationary satellite<\/b> appear to stay in the same place?", "a": ["Its <b>orbital period is 24 hours<\/b>, the same as the Earth's rotation (1)", "It orbits <b>above the equator<\/b> (1)"], "cp": ["Its orbital period is 24 hours, the same as the Earth's rotation", "It orbits above the equator"], "dp": ["It does not move at all", "It orbits at a very low height", "It moves faster than the Earth's rotation"], "mand": 0}, {"id": "PHY-08-013", "t": 8, "s": "4.8.1.3", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between the orbits of <b>planets<\/b> and <b>comets<\/b>?", "a": ["Planets: orbits are <b>almost circular<\/b> (1)", "Comets: orbits are <b>very elliptical<\/b> (1)"], "cp": ["Planets: orbits are almost circular", "Comets: orbits are very elliptical"], "dp": ["Planets have elliptical orbits", "Comets are circular", "They are exactly the same"], "mand": 0}, {"id": "PHY-08-014", "t": 8, "s": "4.8.1.3", "k": "Recall", "m": 2, "ht": false, "q": "What <b>force<\/b> keeps planets in orbit around the Sun and what is it?", "a": ["<b>Gravity<\/b> (1)", "A <b>non-contact force<\/b> of attraction between masses (1)"], "cp": ["Gravity", "A non-contact force of attraction between masses"], "dp": ["Friction", "Magnetic force", "The normal force"], "mand": 0}, {"id": "PHY-08-015", "t": 8, "s": "4.8.2.1", "k": "Explain", "m": 3, "ht": false, "q": "What is <b>red-shift<\/b>?", "a": ["The <b>wavelength of light increases<\/b> from a distant galaxy (1)", "The light is shifted <b>towards the red end<\/b> of the spectrum (1)", "Because the galaxy is <b>moving away<\/b> (1)"], "cp": ["The wavelength of light increases from a distant galaxy", "The light is shifted towards the red end of the spectrum", "Because the galaxy is moving away"], "dp": ["Light from a galaxy moving towards us", "Light with a shorter wavelength", "Light turning to X-rays"], "mand": 0}, {"id": "PHY-08-016", "t": 8, "s": "4.8.2.1", "k": "Explain", "m": 3, "ht": false, "q": "How does red-shift show that the <b>Universe is expanding<\/b>?", "a": ["Light from <b>distant galaxies is red-shifted<\/b> (1)", "The <b>further away<\/b> the galaxy, the <b>bigger<\/b> the red-shift (1)", "So the galaxies are <b>moving away faster<\/b>, so the Universe is <b>expanding<\/b> (1)"], "cp": ["Light from distant galaxies is red-shifted", "The further away the galaxy, the bigger the red-shift", "So the galaxies are moving away faster, so the Universe is expanding"], "dp": ["Light from distant galaxies is blue-shifted", "Red-shift is the same for all galaxies", "The Universe is contracting"], "mand": 0}, {"id": "PHY-08-017", "t": 8, "s": "4.8.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>Big Bang theory<\/b> describes the origin of the Universe.", "a": ["The Universe began from a <b>very small, hot, dense region<\/b> (1)", "It <b>exploded and expanded<\/b> about 13.8 billion years ago (1)", "Evidence: <b>red-shift<\/b> and <b>cosmic microwave background<\/b> radiation (1)"], "cp": ["The Universe began from a very small, hot, dense region", "It exploded and expanded about 13.8 billion years ago", "Evidence: red-shift and cosmic microwave background radiation"], "dp": ["The Universe has always been the same size", "The Universe began as a large cold gas", "The Big Bang started in the Sun"], "mand": 0}, {"id": "PHY-08-018", "t": 8, "s": "4.8.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>cosmic microwave background radiation (CMBR)<\/b>?", "a": ["<b>Microwave radiation<\/b> coming from <b>all directions<\/b> in space (1)", "It is <b>left over from the early hot Universe<\/b> (Big Bang) (1)"], "cp": ["Microwave radiation coming from all directions in space", "It is left over from the early hot Universe (Big Bang)"], "dp": ["Radio waves from the Sun", "Radiation from the Earth", "X-rays from black holes"], "mand": 0}, {"id": "PHY-08-019", "t": 8, "s": "4.8.2.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the <b>steady state theory<\/b> and why was it rejected?", "a": ["It said the Universe has <b>always existed<\/b> and new matter is created as it expands (1)", "It <b>cannot explain the CMBR<\/b>, which supports the Big Bang (1)"], "cp": ["It said the Universe has always existed and new matter is created as it expands", "It cannot explain the CMBR, which supports the Big Bang"], "dp": ["It said the Universe started from a point", "It was rejected because there is no red-shift", "It explains the CMBR"], "mand": 0}, {"id": "PHY-08-020", "t": 8, "s": "4.8.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Why is the <b>wavelength of light increased<\/b> when a source moves away?", "a": ["The waves are <b>stretched<\/b> as the source moves away (1)", "This is the <b>Doppler effect<\/b> (1)"], "cp": ["The waves are stretched as the source moves away", "This is the Doppler effect"], "dp": ["The waves are compressed", "The frequency of the light increases", "The speed of light slows down"], "mand": 0}, {"id": "PHY-08-021", "t": 8, "s": "4.8.2.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the evidence for <b>dark matter<\/b>?", "a": ["Galaxies <b>rotate faster<\/b> than expected from visible matter (1)", "So there must be <b>extra mass that we cannot see<\/b> (1)"], "cp": ["Galaxies rotate faster than expected from visible matter", "So there must be extra mass that we cannot see"], "dp": ["Dark matter gives off visible light", "Stars are moving more slowly than predicted", "It is the matter inside black holes"], "mand": 0}, {"id": "PHY-08-022", "t": 8, "s": "4.8.2.2", "k": "Recall", "m": 2, "ht": false, "q": "What does <b>dark energy<\/b> explain?", "a": ["The <b>accelerating expansion<\/b> of the Universe (1)", "It is an unknown form of energy pushing galaxies apart (1)"], "cp": ["The accelerating expansion of the Universe", "It is an unknown form of energy pushing galaxies apart"], "dp": ["Why galaxies are slowing down", "Why stars are hot", "The Moon's orbit"], "mand": 0}, {"id": "PHY-08-023", "t": 8, "s": "4.8.1.1", "k": "Calculation", "m": 3, "ht": false, "q": "Light takes 8 minutes to travel from the Sun to the Earth. The speed of light is 3 × 10<sup>8<\/sup> m/s. Calculate the <b>distance<\/b> in metres.", "a": ["8 minutes = 480 s (1)", "distance = 3 × 10<sup>8<\/sup> × 480 (1)", "= <b>1.44 × 10<sup>11<\/sup> m<\/b> (1)"], "cp": ["8 minutes = 480 s", "distance = 3 × 10<sup>8<\/sup> × 480", "= 1.44 × 10<sup>11<\/sup> m"], "dp": ["2.4 × 10<sup>9<\/sup> m", "3.8 × 10<sup>8<\/sup> m", "1.44 × 10<sup>8<\/sup> m"], "mand": 0}, {"id": "PHY-08-024", "t": 8, "s": "4.8.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>energy source<\/b> of a main sequence star and its main <b>fuel<\/b>?", "a": ["<b>Nuclear fusion<\/b> (1)", "<b>Hydrogen<\/b> (fusing to helium) (1)"], "cp": ["Nuclear fusion", "Hydrogen (fusing to helium)"], "dp": ["Nuclear fission of uranium", "Burning coal", "Chemical reactions with oxygen"], "mand": 0}, {"id": "PHY-08-025", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 2, "ht": false, "q": "What is a <b>red giant<\/b>?", "a": ["A star that has <b>run out of hydrogen<\/b> in its core and <b>expanded<\/b> (1)", "The outer layers <b>cool<\/b> so it looks <b>red<\/b> (1)"], "cp": ["A star that has run out of hydrogen in its core and expanded", "The outer layers cool so it looks red"], "dp": ["A star that is smaller than the Sun", "A star made of iron", "A very hot blue star"], "mand": 0}, {"id": "PHY-08-026", "t": 8, "s": "4.8.1.2", "k": "Explain", "m": 2, "ht": false, "q": "What is a <b>white dwarf<\/b>?", "a": ["A <b>small, dense, hot star<\/b> (1)", "The <b>core left after a red giant<\/b> loses its outer layers, which slowly cools (1)"], "cp": ["A small, dense, hot star", "The core left after a red giant loses its outer layers, which slowly cools"], "dp": ["A star bigger than the Sun", "A star which is made of ice", "The first stage of a star"], "mand": 0}, {"id": "PHY-08-027", "t": 8, "s": "4.8.1.3", "k": "Recall", "m": 2, "ht": false, "q": "Write the <b>order of the planets<\/b> by naming the first four from the Sun.", "a": ["<b>Mercury<\/b>, <b>Venus<\/b> (1)", "<b>Earth<\/b>, <b>Mars<\/b> (1)"], "cp": ["Mercury, Venus", "Earth, Mars"], "dp": ["Earth, Mars, Venus, Mercury", "Venus, Mercury, Earth, Mars", "Mars, Earth, Venus, Mercury"], "mand": 0}, {"id": "PHY-08-028", "t": 8, "s": "4.8.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why does gravity matter for the <b>formation<\/b> of stars and planets?", "a": ["Gravity <b>pulls dust and gas together<\/b> (1)", "Increasing <b>density and temperature<\/b> until fusion starts (stars) (1)"], "cp": ["Gravity pulls dust and gas together", "Increasing density and temperature until fusion starts (stars)"], "dp": ["Gravity pushes dust and gas apart", "Gravity does not affect small particles", "Gravity makes stars cool down"], "mand": 0}, {"id": "PHY-08-H01", "t": 8, "s": "4.8.1.3", "k": "Explain", "m": 3, "ht": true, "q": "Explain why a satellite in a <b>circular orbit<\/b> keeps changing direction but <b>moves at constant speed<\/b>.", "a": ["The satellite is <b>accelerating<\/b> because its velocity changes direction (1)", "<b>Gravity<\/b> acts towards the centre (1)", "The speed stays the same but the <b>velocity changes<\/b> (1)"], "cp": ["The satellite is accelerating because its velocity changes direction", "Gravity acts towards the centre", "The speed stays the same but the velocity changes"], "dp": ["No force acts on it", "The satellite is stationary", "Gravity pushes it away from the centre"], "mand": 0}, {"id": "PHY-08-H02", "t": 8, "s": "4.8.1.3", "k": "Explain", "m": 3, "ht": true, "q": "A planet moves from a <b>larger orbit to a smaller orbit<\/b>. What happens to its <b>speed<\/b> and <b>why<\/b>?", "a": ["Its speed <b>increases<\/b> (1)", "Gravity is <b>stronger<\/b> at a smaller radius (1)", "A <b>higher speed<\/b> is needed to stay in orbit (1)"], "cp": ["Its speed increases", "Gravity is stronger at a smaller radius", "A higher speed is needed to stay in orbit"], "dp": ["Its speed decreases", "Its speed stays the same", "The planet stops moving"], "mand": 0}];
