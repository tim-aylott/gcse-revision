", "t": 3, "s": "4.3.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what happens to <b>internal energy<\/b> when a system is <b>heated<\/b>.", "a": ["Energy is transferred to the particles (1)", "Either the particles <b>move faster<\/b> (temperature rises) (1)", "Or a <b>change of state<\/b> occurs (potential energy increases) (1)"], "cp": ["Energy is transferred to the particles", "Either the particles move faster (temperature rises)", "Or a change of state occurs (potential energy increases)"], "dp": ["The particles move slower", "The internal energy falls", "The mass of the system increases"], "mand": 0}, {"id": "PHY-03-016", "t": 3, "s": "4.3.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Why does a substance's temperature stay <b>constant<\/b> during melting?", "a": ["Energy is used to <b>break bonds<\/b> between particles (1)", "It increases <b>potential energy<\/b>, not kinetic energy, so the temperature does not rise (1)"], "cp": ["Energy is used to break bonds between particles", "It increases potential energy, not kinetic energy, so the temperature does not rise"], "dp": ["Energy is lost to the surroundings", "The substance stops absorbing energy", "The particles stop vibrating"], "mand": 0}, {"id": "PHY-03-017", "t": 3, "s": "4.3.2.3", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>specific latent heat<\/b>?", "a": ["The <b>energy needed to change the state<\/b> of 1 kg of a substance (1)", "<b>without a change in temperature<\/b> (1)"], "cp": ["The energy needed to change the state of 1 kg of a substance", "without a change in temperature"], "dp": ["The energy needed to raise 1 kg by 1 °C", "The temperature at which a substance boils", "The energy stored in a hot object"], "mand": 0}, {"id": "PHY-03-018", "t": 3, "s": "4.3.2.3", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between <b>latent heat of fusion<\/b> and <b>latent heat of vaporisation<\/b>?", "a": ["Fusion = energy for <b>melting or freezing<\/b> (solid and liquid) (1)", "Vaporisation = energy for <b>boiling or condensing<\/b> (liquid and gas) (1)"], "cp": ["Fusion = energy for melting or freezing (solid and liquid)", "Vaporisation = energy for boiling or condensing (liquid and gas)"], "dp": ["Fusion is for boiling, vaporisation is for melting", "They are the same", "Fusion is for sublimation only"], "mand": 0}, {"id": "PHY-03-019", "t": 3, "s": "4.3.2.3", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for the <b>energy for a change of state<\/b>.", "a": ["energy = <b>mass × specific latent heat<\/b> (1)", "E = m L, with E in <b>joules<\/b>, m in <b>kg<\/b>, L in <b>J/kg<\/b> (1)"], "cp": ["energy = mass × specific latent heat", "E = m L, with E in joules, m in kg, L in J/kg"], "dp": ["E = m × c × Δθ", "E = m ÷ L", "E = L ÷ m"], "mand": 0}, {"id": "PHY-03-020", "t": 3, "s": "4.3.2.3", "k": "Calculation", "m": 3, "ht": false, "q": "The specific latent heat of fusion of ice is 334 000 J/kg.<br/><br/>Calculate the energy needed to melt <b>0.5 kg<\/b> of ice.", "a": ["E = m L (1)", "= 0.5 × 334 000 (1)", "= <b>167 000 J<\/b> (1)"], "cp": ["E = m L", "= 0.5 × 334 000", "= 167 000 J"], "dp": ["668 000 J", "334 000 J", "1670 J"], "mand": 0}, {"id": "PHY-03-021", "t": 3, "s": "4.3.2.3", "k": "Calculation", "m": 3, "ht": false, "q": "4.5 MJ of energy turns 2 kg of water into steam. Calculate the <b>specific latent heat of vaporisation<\/b>. (1 MJ = 1 000 000 J)", "a": ["L = E ÷ m (1)", "= 4 500 000 ÷ 2 (1)", "= <b>2 250 000 J/kg<\/b> (1)"], "cp": ["L = E ÷ m", "= 4 500 000 ÷ 2", "= 2 250 000 J/kg"], "dp": ["9 000 000 J/kg", "2.25 J/kg", "4 500 000 J/kg"], "mand": 0}, {"id": "PHY-03-022", "t": 3, "s": "4.3.2.3", "k": "Data", "m": 3, "ht": false, "q": "A heating graph for water shows a <b>flat line at 100 °C<\/b>. What is happening?", "a": ["The water is <b>boiling<\/b> (changing state) (1)", "The energy is breaking <b>bonds<\/b> between particles (1)", "It increases <b>potential energy<\/b>, not temperature (1)"], "cp": ["The water is boiling (changing state)", "The energy is breaking bonds between particles", "It increases potential energy, not temperature"], "dp": ["The water is cooling", "The heater is switched off", "The water is freezing"], "mand": 0}, {"id": "PHY-03-023", "t": 3, "s": "4.3.2.3", "k": "Data", "m": 2, "ht": false, "q": "On a heating graph, why is the <b>flat section for boiling longer<\/b> than the flat section for melting?", "a": ["The specific latent heat of <b>vaporisation is larger<\/b> (1)", "so <b>more energy<\/b> is needed to boil it (1)"], "cp": ["The specific latent heat of vaporisation is larger", "so more energy is needed to boil it"], "dp": ["Boiling takes less energy than melting", "The heater is weaker at 100 °C", "The mass changes during melting"], "mand": 0}, {"id": "PHY-03-024", "t": 3, "s": "4.3.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Why does steam burn your skin <b>more<\/b> than boiling water at the same temperature?", "a": ["Steam <b>releases extra energy<\/b> when it condenses (latent heat) (1)", "as well as the energy it loses by cooling (1)"], "cp": ["Steam releases extra energy when it condenses (latent heat)", "as well as the energy it loses by cooling"], "dp": ["Steam is at a higher temperature than boiling water", "Steam has a greater mass", "Steam is denser than water"], "mand": 0}, {"id": "PHY-03-025", "t": 3, "s": "4.3.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>gas<\/b> exerts <b>pressure<\/b> on the walls of its container.", "a": ["Gas particles move <b>randomly<\/b> and <b>collide<\/b> with the walls (1)", "Each collision exerts a <b>force<\/b> on the wall (1)", "Many collisions give a <b>pressure<\/b> (force per unit area) (1)"], "cp": ["Gas particles move randomly and collide with the walls", "Each collision exerts a force on the wall", "Many collisions give a pressure (force per unit area)"], "dp": ["The gas particles are attracted to the walls", "The gas particles heat the container", "Gas particles push each other and not the walls"], "mand": 0}, {"id": "PHY-03-026", "t": 3, "s": "4.3.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>heating a gas<\/b> in a sealed container increases its pressure.", "a": ["Particles gain <b>kinetic energy<\/b> and move <b>faster<\/b> (1)", "They <b>collide with the walls<\/b> more often and with more force (1)", "So the <b>pressure increases<\/b> (1)"], "cp": ["Particles gain kinetic energy and move faster", "They collide with the walls more often and with more force", "So the pressure increases"], "dp": ["Particles move slower and push more gently", "The container gets bigger", "Particles get larger when heated"], "mand": 0}, {"id": "PHY-03-027", "t": 3, "s": "4.3.3.1", "k": "Recall", "m": 2, "ht": false, "q": "How does <b>temperature<\/b> relate to the <b>average kinetic energy<\/b> of gas particles?", "a": ["As temperature <b>increases<\/b>, average kinetic energy <b>increases<\/b> (1)", "The <b>kelvin temperature<\/b> is proportional to the average kinetic energy (1)"], "cp": ["As temperature increases, average kinetic energy increases", "The kelvin temperature is proportional to the average kinetic energy"], "dp": ["Temperature has no effect on kinetic energy", "As temperature increases, kinetic energy decreases", "Kinetic energy is constant"], "mand": 0}, {"id": "PHY-03-028", "t": 3, "s": "4.3.3.2", "k": "Explain", "m": 3, "ht": false, "q": "A syringe of air is sealed and the plunger is pushed in. Explain what happens to the <b>pressure<\/b>.", "a": ["The volume <b>decreases<\/b> (1)", "Particles <b>hit the walls more often<\/b> (1)", "So the <b>pressure increases<\/b> (at constant temperature) (1)"], "cp": ["The volume decreases", "Particles hit the walls more often", "So the pressure increases (at constant temperature)"], "dp": ["The pressure stays the same", "The pressure falls as the gas is squeezed", "The particles get smaller"], "mand": 0}, {"id": "PHY-03-029", "t": 3, "s": "4.3.3.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking <b>pressure and volume<\/b> of a fixed mass of gas at constant temperature.", "a": ["<b>pressure × volume = constant<\/b> (1)", "p<sub>1<\/sub>V<sub>1<\/sub> = p<sub>2<\/sub>V<sub>2<\/sub> (1)"], "cp": ["pressure × volume = constant", "p<sub>1<\/sub>V<sub>1<\/sub> = p<sub>2<\/sub>V<sub>2<\/sub>"], "dp": ["pressure ÷ volume = constant", "pressure + volume = constant", "pressure × temperature = constant"], "mand": 0}, {"id": "PHY-03-030", "t": 3, "s": "4.3.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "A gas at 100 kPa has a volume of 6 m<sup>3<\/sup>. It is compressed to 2 m<sup>3<\/sup> at constant temperature.<br/><br/>Calculate the <b>new pressure<\/b>.", "a": ["p<sub>1<\/sub>V<sub>1<\/sub> = p<sub>2<\/sub>V<sub>2<\/sub>, so 100 × 6 = p<sub>2<\/sub> × 2 (1)", "p<sub>2<\/sub> = 600 ÷ 2 (1)", "= <b>300 kPa<\/b> (1)"], "cp": ["p<sub>1<\/sub>V<sub>1<\/sub> = p<sub>2<\/sub>V<sub>2<\/sub>, so 100 × 6 = p<sub>2<\/sub> × 2", "p<sub>2<\/sub> = 600 ÷ 2", "= 300 kPa"], "dp": ["33 kPa", "200 kPa", "1200 kPa"], "mand": 0}, {"id": "PHY-03-031", "t": 3, "s": "4.3.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "A gas has a pressure of 150 kPa and a volume of 4 m<sup>3<\/sup>. The pressure drops to 50 kPa. Calculate the <b>new volume<\/b>.", "a": ["150 × 4 = 50 × V<sub>2<\/sub> (1)", "V<sub>2<\/sub> = 600 ÷ 50 (1)", "= <b>12 m<sup>3<\/sup><\/b> (1)"], "cp": ["150 × 4 = 50 × V<sub>2<\/sub>", "V<sub>2<\/sub> = 600 ÷ 50", "= 12 m<sup>3<\/sup>"], "dp": ["1.3 m<sup>3<\/sup>", "8 m<sup>3<\/sup>", "2 m<sup>3<\/sup>"], "mand": 0}, {"id": "PHY-03-032", "t": 3, "s": "4.3.1.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>evaporation<\/b>?", "a": ["A <b>liquid changing to a gas<\/b> below its boiling point (1)", "Only the <b>fastest particles<\/b> at the surface escape (1)"], "cp": ["A liquid changing to a gas below its boiling point", "Only the fastest particles at the surface escape"], "dp": ["A gas changing to a liquid", "A solid changing to a gas", "A liquid boiling at 100 °C only"], "mand": 0}, {"id": "PHY-03-033", "t": 3, "s": "4.3.2.1", "k": "Explain", "m": 2, "ht": false, "q": "A student heats water and the temperature rises from 20 °C to 80 °C. Is there a change of state? Explain.", "a": ["No change of state (1)", "The energy goes into the <b>kinetic energy<\/b> of the particles, so the temperature <b>rises<\/b> (1)"], "cp": ["No change of state", "The energy goes into the kinetic energy of the particles, so the temperature rises"], "dp": ["Yes, the water becomes a gas", "Yes, the water becomes a solid", "No, the particles stop moving"], "mand": 0}, {"id": "PHY-03-034", "t": 3, "s": "4.3.1.1", "k": "Explain", "m": 2, "ht": false, "q": "A bottle of water has a mass of 500 g. A same-size bottle of oil has a mass of 450 g. Which liquid is <b>denser<\/b>? Explain.", "a": ["<b>Water<\/b> (1)", "It has <b>more mass in the same volume<\/b> (1)"], "cp": ["Water", "It has more mass in the same volume"], "dp": ["Oil, because it is lighter", "They are equally dense", "Oil, because it floats"], "mand": 0}, {"id": "PHY-03-035", "t": 3, "s": "4.3.2.2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>unit<\/b> of specific heat capacity and of specific latent heat?", "a": ["Specific heat capacity: <b>J/kg °C<\/b> (1)", "Specific latent heat: <b>J/kg<\/b> (1)"], "cp": ["Specific heat capacity: J/kg °C", "Specific latent heat: J/kg"], "dp": ["Specific heat capacity: J/kg and latent heat: J/kg °C", "Both in J", "Both in °C"], "mand": 0}, {"id": "PHY-03-H01", "t": 3, "s": "4.3.3.2", "k": "Explain", "m": 3, "ht": true, "q": "Explain why <b>pumping a bicycle tyre<\/b> makes the pump get warm.", "a": ["<b>Work is done<\/b> on the gas by compressing it (1)", "Energy is transferred to the <b>internal energy<\/b> of the gas (1)", "So the <b>temperature<\/b> of the gas rises (1)"], "cp": ["Work is done on the gas by compressing it", "Energy is transferred to the internal energy of the gas", "So the temperature of the gas rises"], "dp": ["The pump is heated by the sun", "Energy is destroyed in the pump", "Work done reduces the temperature"], "mand": 0}, {"id": "PHY-03-H02", "t": 3, "s": "4.3.3.2", "k": "Explain", "m": 2, "ht": true, "q": "Explain why compressing a gas quickly increases its temperature.", "a": ["Work is done <b>on<\/b> the gas (1)", "It transfers energy to the gas particles' <b>kinetic energy<\/b>, increasing temperature (1)"], "cp": ["Work is done on the gas", "It transfers energy to the gas particles' kinetic energy, increasing temperature"], "dp": ["The gas particles slow down", "The gas gets bigger", "Energy leaves the gas when work is done on it"], "mand": 0}, {"id": "PHY-03-H03", "t": 3, "s": "4.3.2.2", "k": "Explain", "m": 2, "ht": true, "q": "Why is the <b>temperature of a gas<\/b> in a sealed container different from its <b>internal energy<\/b>?", "a": ["Temperature depends on the <b>average kinetic energy<\/b> of the particles (1)", "Internal energy is the <b>total kinetic and potential energy<\/b> of all the particles (1)"], "cp": ["Temperature depends on the average kinetic energy of the particles", "Internal energy is the total kinetic and potential energy of all the particles"], "dp": ["They are the same thing", "Temperature depends on mass only", "Internal energy only depends on volume"], "mand": 0}, {"id": "PHY-04-001", "t": 4, "s": "4.4.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>relative mass<\/b> and <b>relative charge<\/b> of a proton, neutron and electron.", "a": ["Proton: mass <b>1<\/b>, charge <b>+1<\/b> (1)", "Neutron: mass <b>1<\/b>, charge <b>0<\/b> (1)", "Electron: mass <b>very small<\/b> (about 1/2000), charge <b>-1<\/b> (1)"], "cp": ["Proton: mass 1, charge +1", "Neutron: mass 1, charge 0", "Electron: mass very small (about 1/2000), charge -1"], "dp": ["Proton: mass 1, charge -1", "Neutron: mass 0, charge +1", "Electron: mass 1, charge +1"], "mand": 0}, {"id": "PHY-04-002", "t": 4, "s": "4.4.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>size of an atom<\/b> and the size of its <b>nucleus<\/b>?", "a": ["Atom radius is about <b>1 × 10<sup>-10<\/sup> m<\/b> (1)", "The nucleus is about <b>1/10 000<\/b> of the size of the atom (1)"], "cp": ["Atom radius is about 1 × 10<sup>-10<\/sup> m", "The nucleus is about 1/10 000 of the size of the atom"], "dp": ["Atom radius about 1 m", "The nucleus is as big as the atom", "The nucleus is about 10 times smaller than the atom"], "mand": 0}, {"id": "PHY-04-003", "t": 4, "s": "4.4.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What do the <b>atomic number<\/b> and <b>mass number<\/b> tell you?", "a": ["Atomic number = number of <b>protons<\/b> (1)", "Mass number = number of <b>protons + neutrons<\/b> (1)"], "cp": ["Atomic number = number of protons", "Mass number = number of protons + neutrons"], "dp": ["Atomic number = protons + neutrons", "Mass number = number of electrons", "Atomic number = number of neutrons"], "mand": 0}, {"id": "PHY-04-004", "t": 4, "s": "4.4.1.1", "k": "Calculation", "m": 3, "ht": false, "q": "An atom of carbon-14 has atomic number 6.<br/><br/>How many <b>protons, neutrons and electrons<\/b> does it have?", "a": ["<b>6 protons<\/b> (1)", "14 - 6 = <b>8 neutrons<\/b> (1)", "<b>6 electrons<\/b> (neutral atom) (1)"], "cp": ["6 protons", "14 - 6 = 8 neutrons", "6 electrons (neutral atom)"], "dp": ["8 protons, 6 neutrons, 8 electrons", "14 protons, 6 neutrons, 6 electrons", "6 protons, 14 neutrons, 6 electrons"], "mand": 0}, {"id": "PHY-04-005", "t": 4, "s": "4.4.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>isotopes<\/b>?", "a": ["Atoms with the <b>same number of protons<\/b> (1)", "but a <b>different number of neutrons<\/b> (1)"], "cp": ["Atoms with the same number of protons", "but a different number of neutrons"], "dp": ["Atoms with different numbers of protons", "Atoms with the same mass number", "Atoms with different numbers of electrons"], "mand": 0}, {"id": "PHY-04-006", "t": 4, "s": "4.4.1.1", "k": "Explain", "m": 2, "ht": false, "q": "How does an atom become a <b>positive ion<\/b>?", "a": ["It <b>loses one or more electrons<\/b> (1)", "so it has more <b>protons than electrons<\/b> (1)"], "cp": ["It loses one or more electrons", "so it has more protons than electrons"], "dp": ["It gains electrons", "It loses protons", "It gains neutrons"], "mand": 0}, {"id": "PHY-04-007", "t": 4, "s": "4.4.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Where are the <b>electrons<\/b> in an atom and what happens when they absorb radiation?", "a": ["Electrons are in <b>energy levels (shells)<\/b> around the nucleus (1)", "They can <b>move to a higher energy level<\/b> when they absorb EM radiation (1)"], "cp": ["Electrons are in energy levels (shells) around the nucleus", "They can move to a higher energy level when they absorb EM radiation"], "dp": ["Electrons are inside the nucleus", "Electrons move to a lower level when they absorb radiation", "Electrons are all in one shell"], "mand": 0}, {"id": "PHY-04-008", "t": 4, "s": "4.4.1.2", "k": "Compare", "m": 3, "ht": false, "q": "Describe the <b>plum pudding model<\/b> of the atom.", "a": ["A <b>ball of positive charge<\/b> (1)", "with <b>negative electrons<\/b> spread through it (1)", "Proposed by <b>J.J. Thomson<\/b> after discovering the electron (1)"], "cp": ["A ball of positive charge", "with negative electrons spread through it", "Proposed by J.J. Thomson after discovering the electron"], "dp": ["A tiny positive nucleus with electrons in shells", "A solid sphere with no charge", "Protons and neutrons in a nucleus with electrons orbiting"], "mand": 0}, {"id": "PHY-04-009", "t": 4, "s": "4.4.1.2", "k": "Data", "m": 3, "ht": false, "q": "In the <b>alpha scattering experiment<\/b>, most alpha particles went straight through. What did this show?", "a": ["Most of an atom is <b>empty space<\/b> (1)", "Some were <b>deflected<\/b> by the positive nucleus (1)", "A few <b>bounced back<\/b>, so the nucleus is <b>small and dense<\/b> and positive (1)"], "cp": ["Most of an atom is empty space", "Some were deflected by the positive nucleus", "A few bounced back, so the nucleus is small and dense and positive"], "dp": ["Atoms are solid spheres", "The nucleus is negatively charged", "Atoms have no nucleus"], "mand": 0}, {"id": "PHY-04-010", "t": 4, "s": "4.4.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Why did the alpha scattering results <b>disprove the plum pudding model<\/b>?", "a": ["In the plum pudding model, alpha particles should only be <b>slightly deflected<\/b> (1)", "But some were <b>deflected through large angles<\/b> (1)", "So the <b>positive charge must be concentrated<\/b> in a small nucleus (1)"], "cp": ["In the plum pudding model, alpha particles should only be slightly deflected", "But some were deflected through large angles", "So the positive charge must be concentrated in a small nucleus"], "dp": ["All alpha particles passed straight through", "The alpha particles were absorbed", "Electrons deflected the alpha particles"], "mand": 0}, {"id": "PHY-04-011", "t": 4, "s": "4.4.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What did <b>Niels Bohr<\/b> add to the model of the atom?", "a": ["Electrons orbit the nucleus at <b>specific distances<\/b> (energy levels) (1)", "Supported by <b>experimental evidence<\/b> and explained by calculations (1)"], "cp": ["Electrons orbit the nucleus at specific distances (energy levels)", "Supported by experimental evidence and explained by calculations"], "dp": ["Electrons are inside the nucleus", "Electrons are spread through a positive ball", "Atoms are indivisible spheres"], "mand": 0}, {"id": "PHY-04-012", "t": 4, "s": "4.4.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What did <b>James Chadwick<\/b> discover?", "a": ["The <b>neutron<\/b> (1)", "About 20 years after the nucleus was accepted, <b>in the nucleus<\/b> (1)"], "cp": ["The neutron", "About 20 years after the nucleus was accepted, in the nucleus"], "dp": ["The electron", "The proton", "The nucleus"], "mand": 0}, {"id": "PHY-04-013", "t": 4, "s": "4.4.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>radioactive decay<\/b>?", "a": ["A <b>random<\/b> process where an <b>unstable nucleus<\/b> gives out radiation (1)", "to <b>become more stable<\/b> (1)"], "cp": ["A random process where an unstable nucleus gives out radiation", "to become more stable"], "dp": ["A chemical reaction between atoms", "A predictable process that happens at a set time", "The movement of electrons between atoms"], "mand": 0}, {"id": "PHY-04-014", "t": 4, "s": "4.4.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What does <b>activity<\/b> of a radioactive source mean? What is it measured in?", "a": ["The <b>rate<\/b> at which a source decays (1)", "Measured in <b>becquerel (Bq)<\/b> (1 Bq = 1 decay per second) (1)"], "cp": ["The rate at which a source decays", "Measured in becquerel (Bq) (1 Bq = 1 decay per second)"], "dp": ["The energy of the radiation", "The mass of the source", "The number of protons in the source"], "mand": 0}, {"id": "PHY-04-015", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What does a <b>Geiger-Muller tube<\/b> measure?", "a": ["The <b>count rate<\/b> (1)", "The number of <b>radiation counts per second or minute<\/b> that reach the tube (1)"], "cp": ["The count rate", "The number of radiation counts per second or minute that reach the tube"], "dp": ["The energy of the radiation in joules", "The half-life of the source", "The charge of the particles"], "mand": 0}, {"id": "PHY-04-016", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>alpha, beta and gamma<\/b> radiation.", "a": ["<b>Alpha<\/b>: 2 protons and 2 neutrons (helium nucleus) (1)", "<b>Beta<\/b>: a fast-moving electron from the nucleus (1)", "<b>Gamma<\/b>: electromagnetic radiation from the nucleus (1)"], "cp": ["Alpha: 2 protons and 2 neutrons (helium nucleus)", "Beta: a fast-moving electron from the nucleus", "Gamma: electromagnetic radiation from the nucleus"], "dp": ["Alpha is an electron, beta is a helium nucleus", "Gamma has mass and charge", "Alpha is an EM wave"], "mand": 0}, {"id": "PHY-04-017", "t": 4, "s": "4.4.2.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare the <b>penetration<\/b> of alpha, beta and gamma radiation.", "a": ["<b>Alpha<\/b> is stopped by <b>paper<\/b> or a few cm of air (1)", "<b>Beta<\/b> is stopped by thin <b>aluminium<\/b> (1)", "<b>Gamma<\/b> is only reduced by thick <b>lead<\/b> or concrete (1)"], "cp": ["Alpha is stopped by paper or a few cm of air", "Beta is stopped by thin aluminium", "Gamma is only reduced by thick lead or concrete"], "dp": ["Alpha passes through lead", "Gamma is stopped by paper", "Beta is stopped by paper"], "mand": 0}, {"id": "PHY-04-018", "t": 4, "s": "4.4.2.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare the <b>ionising power<\/b> of alpha, beta and gamma radiation.", "a": ["<b>Alpha<\/b> is strongly ionising (1)", "<b>Beta<\/b> is moderately ionising (1)", "<b>Gamma<\/b> is weakly ionising (1)"], "cp": ["Alpha is strongly ionising", "Beta is moderately ionising", "Gamma is weakly ionising"], "dp": ["Alpha is weakly ionising", "Gamma is strongly ionising", "They all ionise equally"], "mand": 0}, {"id": "PHY-04-019", "t": 4, "s": "4.4.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Which type of radiation is most dangerous <b>inside<\/b> the body and which is more dangerous <b>outside<\/b>? Explain.", "a": ["<b>Alpha<\/b> is most dangerous inside because it is <b>strongly ionising<\/b> (1)", "<b>Beta and gamma<\/b> are more dangerous outside, because they can <b>penetrate the skin<\/b> (1)"], "cp": ["Alpha is most dangerous inside because it is strongly ionising", "Beta and gamma are more dangerous outside, because they can penetrate the skin"], "dp": ["Alpha is most dangerous outside the body", "Gamma is most dangerous inside because it is strongly ionising", "They are all equally dangerous inside and outside"], "mand": 0}, {"id": "PHY-04-020", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What happens to the <b>nucleus<\/b> in <b>gamma emission<\/b>?", "a": ["The nucleus gives out <b>energy<\/b> as a gamma ray (1)", "The <b>mass number and atomic number do not change<\/b> (1)"], "cp": ["The nucleus gives out energy as a gamma ray", "The mass number and atomic number do not change"], "dp": ["The nucleus loses two protons", "The nucleus loses an electron", "The atomic number goes up by one"], "mand": 0}, {"id": "PHY-04-021", "t": 4, "s": "4.4.2.2", "k": "Explain", "m": 2, "ht": false, "q": "What happens to the <b>mass number<\/b> and <b>atomic number<\/b> in <b>alpha decay<\/b>?", "a": ["Mass number <b>decreases by 4<\/b> (1)", "Atomic number <b>decreases by 2<\/b> (1)"], "cp": ["Mass number decreases by 4", "Atomic number decreases by 2"], "dp": ["Mass number decreases by 2", "Atomic number decreases by 4", "Both stay the same"], "mand": 0}, {"id": "PHY-04-022", "t": 4, "s": "4.4.2.2", "k": "Explain", "m": 2, "ht": false, "q": "What happens to the <b>mass number<\/b> and <b>atomic number<\/b> in <b>beta decay<\/b>?", "a": ["Mass number <b>stays the same<\/b> (1)", "Atomic number <b>increases by 1<\/b> (a neutron becomes a proton) (1)"], "cp": ["Mass number stays the same", "Atomic number increases by 1 (a neutron becomes a proton)"], "dp": ["Mass number goes up by 1", "Atomic number decreases by 1", "Mass number decreases by 4"], "mand": 0}, {"id": "PHY-04-023", "t": 4, "s": "4.4.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "Complete the nuclear equation for alpha decay:<br/>Radium-226 (atomic number 88) decays to radon and an alpha particle.<br/><br/>What is the <b>mass number and atomic number of radon<\/b>?", "a": ["Mass number: 226 - 4 = <b>222<\/b> (1)", "Atomic number: 88 - 2 = <b>86<\/b> (1)", "So radon-222 (1)"], "cp": ["Mass number: 226 - 4 = 222", "Atomic number: 88 - 2 = 86", "So radon-222"], "dp": ["Mass number 230 and atomic number 90", "Mass number 222 and atomic number 90", "Mass number 226 and atomic number 86"], "mand": 0}, {"id": "PHY-04-024", "t": 4, "s": "4.4.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "Carbon-14 (atomic number 6) undergoes <b>beta decay<\/b>. What are the mass number and atomic number of the new nucleus?", "a": ["Mass number <b>stays at 14<\/b> (1)", "Atomic number <b>6 + 1 = 7<\/b> (1)", "The new element is <b>nitrogen-14<\/b> (1)"], "cp": ["Mass number stays at 14", "Atomic number 6 + 1 = 7", "The new element is nitrogen-14"], "dp": ["Mass number 10 and atomic number 5", "Mass number 14 and atomic number 5", "Mass number 15 and atomic number 6"], "mand": 0}, {"id": "PHY-04-025", "t": 4, "s": "4.4.2.3", "k": "Definition", "m": 2, "ht": false, "q": "What is meant by the <b>half-life<\/b> of a radioactive isotope?", "a": ["The <b>time<\/b> for the <b>number of nuclei<\/b> to halve (1)", "Or the time for the <b>activity (count rate) to fall to half<\/b> (1)"], "cp": ["The time for the number of nuclei to halve", "Or the time for the activity (count rate) to fall to half"], "dp": ["The time for a source to stop being radioactive", "Half the time that a source is dangerous", "The time it takes to double the activity"], "mand": 0}, {"id": "PHY-04-026", "t": 4, "s": "4.4.2.3", "k": "Calculation", "m": 3, "ht": false, "q": "A source has a half-life of 6 hours and an activity of 800 Bq.<br/><br/>What is its activity after <b>18 hours<\/b>?", "a": ["18 ÷ 6 = <b>3 half-lives<\/b> (1)", "800 → 400 → 200 (1)", "= <b>100 Bq<\/b> (1)"], "cp": ["18 ÷ 6 = 3 half-lives", "800 → 400 → 200", "= 100 Bq"], "dp": ["266 Bq", "200 Bq", "400 Bq"], "mand": 0}, {"id": "PHY-04-027", "t": 4, "s": "4.4.2.3", "k": "Calculation", "m": 3, "ht": false, "q": "A sample has 640 undecayed nuclei. The half-life is 10 days.<br/><br/>How many undecayed nuclei are left after <b>30 days<\/b>?", "a": ["30 ÷ 10 = 3 half-lives (1)", "640 → 320 → 160 (1)", "→ <b>80 nuclei<\/b> (1)"], "cp": ["30 ÷ 10 = 3 half-lives", "640 → 320 → 160", "→ 80 nuclei"], "dp": ["320 nuclei", "213 nuclei", "20 nuclei"], "mand": 0}, {"id": "PHY-04-028", "t": 4, "s": "4.4.2.3", "k": "Data", "m": 3, "ht": false, "q": "A source has a half-life of 4 minutes and starts at 160 counts per minute. How long until it is about <b>10<\/b> counts per minute?", "a": ["160 → 80 → 40 → 20 → 10 (1)", "That is <b>4 half-lives<\/b> (1)", "4 × 4 = <b>16 minutes<\/b> (1)"], "cp": ["160 → 80 → 40 → 20 → 10", "That is 4 half-lives", "4 × 4 = 16 minutes"], "dp": ["12 minutes", "40 minutes", "8 minutes"], "mand": 0}, {"id": "PHY-04-029", "t": 4, "s": "4.4.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Why is a source with a <b>short half-life<\/b> better to use as a <b>medical tracer<\/b>?", "a": ["It becomes <b>safe quickly<\/b> (1)", "The patient receives <b>less radiation exposure<\/b> overall (1)"], "cp": ["It becomes safe quickly", "The patient receives less radiation exposure overall"], "dp": ["It lasts longer in the body", "It is more radioactive for years", "It gives out more alpha particles"], "mand": 0}, {"id": "PHY-04-030", "t": 4, "s": "4.4.2.4", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between <b>irradiation<\/b> and <b>contamination<\/b>?", "a": ["Irradiation: the object is <b>exposed<\/b> to radiation but does <b>not become radioactive<\/b> (1)", "Contamination: <b>unwanted radioactive atoms<\/b> get on or into an object (1)"], "cp": ["Irradiation: the object is exposed to radiation but does not become radioactive", "Contamination: unwanted radioactive atoms get on or into an object"], "dp": ["Irradiation makes the object radioactive", "Contamination is exposure without touching the source", "They are the same thing"], "mand": 0}, {"id": "PHY-04-031", "t": 4, "s": "4.4.2.4", "k": "Explain", "m": 2, "ht": false, "q": "Why are people who work with radioactive sources protected by <b>tongs, shielding or short exposure times<\/b>?", "a": ["To <b>reduce their exposure<\/b> to radiation (1)", "Because it can <b>ionise and damage cells<\/b> (cause cancer) (1)"], "cp": ["To reduce their exposure to radiation", "Because it can ionise and damage cells (cause cancer)"], "dp": ["To keep the source from decaying", "To make the radiation weaker for the source", "Because gamma rays heat the room"], "mand": 0}, {"id": "PHY-04-032", "t": 4, "s": "4.4.2.4", "k": "Recall", "m": 2, "ht": false, "q": "What is <b>background radiation<\/b>? Give <b>two sources<\/b>.", "a": ["Low-level radiation <b>always present<\/b> in the environment (1)", "Any two: <b>rocks (radon gas), cosmic rays, food, nuclear weapon tests, medical<\/b> (1)"], "cp": ["Low-level radiation always present in the environment", "Any two: rocks (radon gas), cosmic rays, food, nuclear weapon tests, medical"], "dp": ["Radiation only made in a nuclear reactor", "Only radiation from the sun", "Radiation which only affects workers"], "mand": 0}, {"id": "PHY-04-033", "t": 4, "s": "4.4.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three uses<\/b> of nuclear radiation.", "a": ["Any three (1 each):", "• <b>smoke detectors<\/b> (alpha)", "• <b>medical tracers and imaging<\/b> (gamma)", "• <b>treating cancer<\/b> (gamma radiotherapy)", "• <b>sterilising<\/b> equipment or food", "• <b>thickness gauges<\/b> (beta)"], "cp": ["smoke detectors (alpha)", "medical tracers and imaging (gamma)", "treating cancer (gamma radiotherapy)", "sterilising equipment or food", "thickness gauges (beta)"], "dp": ["Making electricity from alpha particles only", "Making materials radioactive for safe storage", "Increasing the heat from fossil fuels"], "mand": 0}, {"id": "PHY-04-034", "t": 4, "s": "4.4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>gamma<\/b> is used as a <b>medical tracer<\/b>.", "a": ["Gamma can <b>pass out of the body<\/b> to be detected (1)", "It has a <b>short half-life<\/b> so it does not stay radioactive for long (1)", "It is <b>weakly ionising<\/b> so does less damage (1)"], "cp": ["Gamma can pass out of the body to be detected", "It has a short half-life so it does not stay radioactive for long", "It is weakly ionising so does less damage"], "dp": ["Alpha is better because it is strongly ionising", "Gamma stays in the body for years", "Gamma is absorbed by the body"], "mand": 0}, {"id": "PHY-04-035", "t": 4, "s": "4.4.3", "k": "Explain", "m": 2, "ht": false, "q": "Why is <b>beta radiation<\/b> used to monitor the <b>thickness of paper<\/b>?", "a": ["Beta <b>passes through paper<\/b> but is partly absorbed (1)", "The <b>count rate changes<\/b> if the thickness changes, so rollers can be adjusted (1)"], "cp": ["Beta passes through paper but is partly absorbed", "The count rate changes if the thickness changes, so rollers can be adjusted"], "dp": ["Alpha passes through the paper so it is better", "Gamma is completely absorbed by paper", "Beta is stopped by paper and cannot be detected"], "mand": 0}, {"id": "PHY-04-036", "t": 4, "s": "4.4.3", "k": "Evaluate", "m": 3, "ht": false, "q": "Evaluate the use of <b>radioactive materials<\/b> in medicine.", "a": ["<b>Benefit<\/b>: can find and treat disease, e.g. cancer (1)", "<b>Risk<\/b>: radiation can damage healthy cells (1)", "The benefits are judged to <b>outweigh the risks<\/b> if the dose is controlled (1)"], "cp": ["Benefit: can find and treat disease, e.g. cancer", "Risk: radiation can damage healthy cells", "The benefits are judged to outweigh the risks if the dose is controlled"], "dp": ["There are no risks to patients", "They are never used for treatment", "They have no benefits"], "mand": 0}, {"id": "PHY-04-037", "t": 4, "s": "4.4.3", "k": "Explain", "m": 2, "ht": false, "q": "Why is <b>nuclear waste<\/b> a problem?", "a": ["It stays <b>radioactive for a long time<\/b> (1)", "It must be <b>stored safely<\/b> for thousands of years to avoid contamination (1)"], "cp": ["It stays radioactive for a long time", "It must be stored safely for thousands of years to avoid contamination"], "dp": ["It is not radioactive", "It decays instantly", "It can be burnt safely"], "mand": 0}, {"id": "PHY-04-038", "t": 4, "s": "4.4.4.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>nuclear fission<\/b>?", "a": ["The <b>splitting<\/b> of a large unstable nucleus (1)", "into <b>two smaller nuclei<\/b>, releasing energy (1)"], "cp": ["The splitting of a large unstable nucleus", "into two smaller nuclei, releasing energy"], "dp": ["Two small nuclei joining together", "A chemical reaction in the Sun", "A nucleus absorbing an electron"], "mand": 0}, {"id": "PHY-04-039", "t": 4, "s": "4.4.4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>chain reaction<\/b> happens in a nuclear reactor.", "a": ["A <b>neutron<\/b> is absorbed by a <b>uranium-235<\/b> nucleus, which splits (1)", "It releases <b>2 or 3 more neutrons<\/b> and energy (1)", "These cause <b>further fissions<\/b> (a chain reaction) (1)"], "cp": ["A neutron is absorbed by a uranium-235 nucleus, which splits", "It releases 2 or 3 more neutrons and energy", "These cause further fissions (a chain reaction)"], "dp": ["A proton is absorbed by a plutonium atom", "Fusion happens at room temperature", "Neutrons are destroyed when uranium splits"], "mand": 0}, {"id": "PHY-04-040", "t": 4, "s": "4.4.4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a nuclear reactor is <b>controlled<\/b>.", "a": ["<b>Control rods<\/b> absorb neutrons (1)", "They are <b>lowered or raised<\/b> to slow or speed up the reaction (1)", "A <b>moderator<\/b> slows neutrons so they can cause fission (1)"], "cp": ["Control rods absorb neutrons", "They are lowered or raised to slow or speed up the reaction", "A moderator slows neutrons so they can cause fission"], "dp": ["Control rods start the reaction", "The reaction cannot be controlled", "The moderator makes the neutrons faster"], "mand": 0}, {"id": "PHY-04-041", "t": 4, "s": "4.4.4.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>nuclear fusion<\/b>?", "a": ["<b>Two light nuclei<\/b> join together (1)", "to form a <b>heavier nucleus<\/b>, releasing energy (1)"], "cp": ["Two light nuclei join together", "to form a heavier nucleus, releasing energy"], "dp": ["A heavy nucleus splits into two", "Two atoms share electrons", "The decay of a radioactive nucleus"], "mand": 0}, {"id": "PHY-04-042", "t": 4, "s": "4.4.4.2", "k": "Compare", "m": 3, "ht": false, "q": "Give <b>three differences<\/b> between nuclear fission and fusion.", "a": ["Fission <b>splits<\/b> a heavy nucleus, fusion <b>joins<\/b> light nuclei (1)", "Fusion needs <b>very high temperature and pressure<\/b> (1)", "Fusion is how the <b>Sun<\/b> makes energy, fission is in <b>reactors<\/b> (1)"], "cp": ["Fission splits a heavy nucleus, fusion joins light nuclei", "Fusion needs very high temperature and pressure", "Fusion is how the Sun makes energy, fission is in reactors"], "dp": ["Fission joins nuclei, fusion splits them", "Fusion works at room temperature", "Fusion is used in reactors today"], "mand": 0}, {"id": "PHY-04-043", "t": 4, "s": "4.4.4.2", "k": "Explain", "m": 2, "ht": false, "q": "Why is it <b>difficult<\/b> to make a <b>fusion reactor<\/b>?", "a": ["Nuclei <b>repel<\/b> each other (both positive) (1)", "so they need <b>very high temperature and pressure<\/b> to get close enough to fuse (1)"], "cp": ["Nuclei repel each other (both positive)", "so they need very high temperature and pressure to get close enough to fuse"], "dp": ["Because nuclei attract each other", "Because fusion makes dangerous waste", "Because fusion needs lots of uranium"], "mand": 0}, {"id": "PHY-04-044", "t": 4, "s": "4.4.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Why is it <b>impossible<\/b> to predict when a particular nucleus will decay?", "a": ["Decay is a <b>random<\/b> process (1)", "Only the <b>probability or half-life<\/b> for a large number of nuclei can be predicted (1)"], "cp": ["Decay is a random process", "Only the probability or half-life for a large number of nuclei can be predicted"], "dp": ["Decay happens at a fixed time", "Radioactive nuclei decay in order", "The temperature decides it"], "mand": 0}, {"id": "PHY-04-045", "t": 4, "s": "4.4.1.1", "k": "Calculation", "m": 2, "ht": false, "q": "An atom has 11 protons and 12 neutrons. What is its <b>mass number<\/b> and which <b>element<\/b> is it?", "a": ["Mass number = 11 + 12 = <b>23<\/b> (1)", "11 protons means <b>sodium<\/b> (1)"], "cp": ["Mass number = 11 + 12 = 23", "11 protons means sodium"], "dp": ["Mass number 11, sodium", "Mass number 12, magnesium", "Mass number 23, magnesium"], "mand": 0}, {"id": "PHY-04-046", "t": 4, "s": "4.4.2.1", "k": "Explain", "m": 2, "ht": false, "q": "An alpha particle is a helium nucleus. Why is it <b>positively charged<\/b>?", "a": ["It has <b>2 protons<\/b> (+2) (1)", "and <b>no electrons<\/b> (1)"], "cp": ["It has 2 protons (+2)", "and no electrons"], "dp": ["It has 2 electrons", "It has 2 neutrons only", "It has an electron missing from a neutron"], "mand": 0}, {"id": "PHY-04-047", "t": 4, "s": "4.4.3", "k": "Compare", "m": 3, "ht": false, "q": "Smoke alarms use <b>alpha<\/b> radiation. Why not gamma?", "a": ["Alpha is easily <b>absorbed by smoke<\/b> particles (1)", "Gamma would <b>pass straight through<\/b> and not be affected (1)", "Alpha is <b>safe in the home<\/b> because it is stopped by air and skin (1)"], "cp": ["Alpha is easily absorbed by smoke particles", "Gamma would pass straight through and not be affected", "Alpha is safe in the home because it is stopped by air and skin"], "dp": ["Alpha is chosen because it is most penetrating", "Gamma is blocked by smoke", "Gamma does not ionise air"], "mand": 0}, {"id": "PHY-04-048", "t": 4, "s": "4.4.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Which is <b>more dangerous long term<\/b>: a source with a half-life of 5 minutes or 5000 years? Explain.", "a": ["<b>5000 years<\/b> (1)", "It stays <b>radioactive for much longer<\/b> (1)"], "cp": ["5000 years", "It stays radioactive for much longer"], "dp": ["5 minutes, as it decays faster", "They are equally dangerous", "5 minutes, because it gives out more radiation"], "mand": 0}, {"id": "PHY-04-H01", "t": 4, "s": "4.4.2.3", "k": "Calculation", "m": 3, "ht": true, "q": "A source's activity falls from 120 Bq to 30 Bq in 8 hours. Calculate its <b>half-life<\/b>.", "a": ["120 → 60 → 30 is <b>2 half-lives<\/b> (1)", "8 hours ÷ 2 (1)", "= <b>4 hours<\/b> (1)"], "cp": ["120 → 60 → 30 is 2 half-lives", "8 hours ÷ 2", "= 4 hours"], "dp": ["8 hours", "2 hours", "16 hours"], "mand": 0}, {"id": "PHY-04-H02", "t": 4, "s": "4.4.2.3", "k": "Calculation", "m": 3, "ht": true, "q": "A source starts with an activity of 240 Bq and has a half-life of 3 days. Calculate the <b>net decline<\/b> in activity after 9 days.", "a": ["9 ÷ 3 = 3 half-lives, so 240 → 120 → 60 → 30 Bq (1)", "Net decline = 240 - 30 (1)", "= <b>210 Bq<\/b>, or as a ratio (30 : 240 = 1 : 8) (1)"], "cp": ["9 ÷ 3 = 3 half-lives, so 240 → 120 → 60 → 30 Bq", "Net decline = 240 - 30", "= 210 Bq, or as a ratio (30 : 240 = 1 : 8)"], "dp": ["30 Bq", "120 Bq", "180 Bq"], "mand": 0}, {"id": "PHY-05-001", "t": 5, "s": "4.5.1.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between a <b>scalar<\/b> and a <b>vector<\/b> quantity?", "a": ["A scalar has <b>size (magnitude) only<\/b> (1)", "A vector has <b>size and direction<\/b> (1)"], "cp": ["A scalar has size (magnitude) only", "A vector has size and direction"], "dp": ["A scalar has direction only", "A vector has size only", "A scalar always has units, a vector does not"], "mand": 0}, {"id": "PHY-05-002", "t": 5, "s": "4.5.1.1", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>two scalar<\/b> and <b>two vector<\/b> quantities.", "a": ["Scalar 1: <b>speed<\/b> (or distance, mass, energy, time) (1)", "Scalar 2: <b>distance<\/b> (or any other scalar) (1)", "Vector 1: <b>velocity<\/b> (or force, displacement, weight) (1)", "Vector 2: <b>force<\/b> (or acceleration, momentum) (1)"], "cp": ["Scalar 1: speed (or distance, mass, energy, time)", "Scalar 2: distance (or any other scalar)", "Vector 1: velocity (or force, displacement, weight)", "Vector 2: force (or acceleration, momentum)"], "dp": ["Scalars: velocity and force; vectors: speed and mass", "Scalars: weight and displacement; vectors: energy and time", "Both types are only distance and speed"], "mand": 0}, {"id": "PHY-05-003", "t": 5, "s": "4.5.1.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between a <b>contact force<\/b> and a <b>non-contact force<\/b>? Give an example of each.", "a": ["Contact: objects <b>touch<\/b>, e.g. friction, tension, normal force (1)", "Non-contact: objects <b>do not touch<\/b>, e.g. gravity, magnetic force, electrostatic force (1)"], "cp": ["Contact: objects touch, e.g. friction, tension, normal force", "Non-contact: objects do not touch, e.g. gravity, magnetic force, electrostatic force"], "dp": ["Contact forces act at a distance", "Non-contact forces need the objects to touch", "Friction is a non-contact force"], "mand": 0}, {"id": "PHY-05-004", "t": 5, "s": "4.5.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Newton's third law: what is it? Give an example.", "a": ["When two objects interact, the forces are <b>equal in size and opposite in direction<\/b> (1)", "Example: a <b>book pushes down<\/b> on a table and the <b>table pushes up<\/b> on the book (1)"], "cp": ["When two objects interact, the forces are equal in size and opposite in direction", "Example: a book pushes down on a table and the table pushes up on the book"], "dp": ["Forces on one object are always balanced", "Every force has a bigger opposite force", "The two forces act on the same object"], "mand": 0}, {"id": "PHY-05-005", "t": 5, "s": "4.5.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why are Newton's third law pairs <b>not<\/b> balanced forces?", "a": ["They act on <b>different objects<\/b> (1)", "Balanced forces act on the <b>same object<\/b> (1)"], "cp": ["They act on different objects", "Balanced forces act on the same object"], "dp": ["They are not equal in size", "They act in the same direction", "They act at different times"], "mand": 0}, {"id": "PHY-05-006", "t": 5, "s": "4.5.1.2", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>mass<\/b> and <b>weight<\/b>?", "a": ["Mass is the <b>amount of matter<\/b>, measured in <b>kg<\/b> (1)", "Weight is the <b>force of gravity<\/b> on the object, measured in <b>newtons (N)<\/b> (1)"], "cp": ["Mass is the amount of matter, measured in kg", "Weight is the force of gravity on the object, measured in newtons (N)"], "dp": ["Weight is measured in kg and mass in newtons", "Mass changes on the Moon", "They are the same thing"], "mand": 0}, {"id": "PHY-05-007", "t": 5, "s": "4.5.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>weight<\/b>.", "a": ["weight = <b>mass × gravitational field strength<\/b> (1)", "W = m g, with W in <b>N<\/b>, m in <b>kg<\/b>, g in <b>N/kg<\/b> (1)"], "cp": ["weight = mass × gravitational field strength", "W = m g, with W in N, m in kg, g in N/kg"], "dp": ["weight = mass ÷ gravity", "weight = mass × speed", "weight = mass + gravity"], "mand": 0}, {"id": "PHY-05-008", "t": 5, "s": "4.5.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the <b>weight<\/b> of a 5 kg object on Earth. (g = 9.8 N/kg)", "a": ["W = m g (1)", "= 5 × 9.8 (1)", "= <b>49 N<\/b> (1)"], "cp": ["W = m g", "= 5 × 9.8", "= 49 N"], "dp": ["0.51 N", "4.9 N", "490 N"], "mand": 0}, {"id": "PHY-05-009", "t": 5, "s": "4.5.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "The weight of an astronaut on the Moon is 96 N. g on the Moon is 1.6 N/kg. Calculate her <b>mass<\/b>.", "a": ["m = W ÷ g (1)", "= 96 ÷ 1.6 (1)", "= <b>60 kg<\/b> (1)"], "cp": ["m = W ÷ g", "= 96 ÷ 1.6", "= 60 kg"], "dp": ["153.6 kg", "0.017 kg", "94.4 kg"], "mand": 0}, {"id": "PHY-05-010", "t": 5, "s": "4.5.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Why would you weigh <b>less on the Moon<\/b> but have the <b>same mass<\/b>?", "a": ["The Moon has a <b>weaker gravitational field strength<\/b> (1)", "Mass is the amount of matter, which does <b>not change<\/b> (1)"], "cp": ["The Moon has a weaker gravitational field strength", "Mass is the amount of matter, which does not change"], "dp": ["The Moon has stronger gravity", "Your mass is lower on the Moon", "There is no gravity on the Moon"], "mand": 0}, {"id": "PHY-05-011", "t": 5, "s": "4.5.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What does the <b>centre of mass<\/b> mean and how does weight act?", "a": ["The <b>point where the weight appears to act<\/b> (1)", "Weight acts <b>downwards through the centre of mass<\/b> (1)"], "cp": ["The point where the weight appears to act", "Weight acts downwards through the centre of mass"], "dp": ["The heaviest edge of an object", "The point where the object touches the ground", "The point where air resistance acts"], "mand": 0}, {"id": "PHY-05-012", "t": 5, "s": "4.5.1.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>resultant force<\/b>?", "a": ["A <b>single force<\/b> (1)", "that has the <b>same effect<\/b> as all the forces acting together (1)"], "cp": ["A single force", "that has the same effect as all the forces acting together"], "dp": ["The biggest force in a system", "The sum of the masses of the objects", "The force of friction only"], "mand": 0}, {"id": "PHY-05-013", "t": 5, "s": "4.5.1.3", "k": "Calculation", "m": 2, "ht": false, "q": "A 10 N force acts to the right and a 4 N force acts to the left on a box. Calculate the <b>resultant force<\/b>.", "a": ["10 - 4 (1)", "= <b>6 N to the right<\/b> (1)"], "cp": ["10 - 4", "= 6 N to the right"], "dp": ["14 N to the right", "6 N to the left", "40 N to the right"], "mand": 0}, {"id": "PHY-05-014", "t": 5, "s": "4.5.1.3", "k": "Explain", "m": 2, "ht": false, "q": "A car moves at a steady speed. What can you say about the <b>forces<\/b> on it?", "a": ["The forces are <b>balanced<\/b> (resultant force is zero) (1)", "so the driving force = the resistive forces (1)"], "cp": ["The forces are balanced (resultant force is zero)", "so the driving force = the resistive forces"], "dp": ["The driving force is bigger than the resistive forces", "There are no forces on the car", "The car is accelerating"], "mand": 0}, {"id": "PHY-05-015", "t": 5, "s": "4.5.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Draw and describe the <b>free body diagram<\/b> for a book resting on a table.", "a": ["<b>Weight<\/b> acts downwards (1)", "<b>Normal (reaction) force<\/b> acts upwards from the table (1)", "The forces are <b>equal<\/b>, so the resultant force is <b>zero<\/b> (1)"], "cp": ["Weight acts downwards", "Normal (reaction) force acts upwards from the table", "The forces are equal, so the resultant force is zero"], "dp": ["The weight is bigger than the normal force", "Only a weight force acts", "There is a sideways friction force"], "mand": 0}, {"id": "PHY-05-016", "t": 5, "s": "4.5.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>work done<\/b>.", "a": ["work done = <b>force × distance moved along the line of the force<\/b> (1)", "W = F s, in <b>joules (J)<\/b> (1)"], "cp": ["work done = force × distance moved along the line of the force", "W = F s, in joules (J)"], "dp": ["work done = force ÷ distance", "work done = mass × speed", "work done = force × time"], "mand": 0}, {"id": "PHY-05-017", "t": 5, "s": "4.5.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 50 N force pushes a box 4 m. Calculate the <b>work done<\/b>.", "a": ["W = F s (1)", "= 50 × 4 (1)", "= <b>200 J<\/b> (1)"], "cp": ["W = F s", "= 50 × 4", "= 200 J"], "dp": ["12.5 J", "54 J", "46 J"], "mand": 0}, {"id": "PHY-05-018", "t": 5, "s": "4.5.2", "k": "Calculation", "m": 3, "ht": false, "q": "A force does 600 J of work moving a trolley 20 m. Calculate the <b>force<\/b>.", "a": ["F = W ÷ s (1)", "= 600 ÷ 20 (1)", "= <b>30 N<\/b> (1)"], "cp": ["F = W ÷ s", "= 600 ÷ 20", "= 30 N"], "dp": ["12 000 N", "0.033 N", "580 N"], "mand": 0}, {"id": "PHY-05-019", "t": 5, "s": "4.5.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>1 joule<\/b> in terms of work?", "a": ["The work done when a force of <b>1 N<\/b> moves an object <b>1 m<\/b> (1)", "in the direction of the force (1)"], "cp": ["The work done when a force of 1 N moves an object 1 m", "in the direction of the force"], "dp": ["The work done when 1 kg moves 1 m", "The energy in 1 second", "The force needed to lift 1 kg"], "mand": 0}, {"id": "PHY-05-020", "t": 5, "s": "4.5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a bike's brakes get <b>hot<\/b> when it stops.", "a": ["Friction does <b>work<\/b> against the motion (1)", "The <b>kinetic energy<\/b> is transferred (1)", "To the <b>thermal store<\/b> of the brakes and surroundings (1)"], "cp": ["Friction does work against the motion", "The kinetic energy is transferred", "To the thermal store of the brakes and surroundings"], "dp": ["Friction increases the kinetic energy", "Gravity heats the brakes", "The wheels create heat by themselves"], "mand": 0}, {"id": "PHY-05-021", "t": 5, "s": "4.5.3", "k": "Explain", "m": 2, "ht": false, "q": "What is the difference between an <b>elastic<\/b> and an <b>inelastic<\/b> deformation?", "a": ["Elastic: the object <b>returns to its original shape<\/b> when the force is removed (1)", "Inelastic: it <b>stays deformed<\/b> (1)"], "cp": ["Elastic: the object returns to its original shape when the force is removed", "Inelastic: it stays deformed"], "dp": ["Elastic: the object is permanently stretched", "Inelastic: the object returns to its shape", "They both return to their original shape"], "mand": 0}, {"id": "PHY-05-022", "t": 5, "s": "4.5.3", "k": "Recall", "m": 2, "ht": false, "q": "What does the equation <b>F = k e<\/b> mean?", "a": ["force = <b>spring constant × extension<\/b> (1)", "F in <b>N<\/b>, k in <b>N/m<\/b>, e in <b>m<\/b> (1)"], "cp": ["force = spring constant × extension", "F in N, k in N/m, e in m"], "dp": ["force = spring constant ÷ extension", "force = extension × mass", "force = spring constant + extension"], "mand": 0}, {"id": "PHY-05-023", "t": 5, "s": "4.5.3", "k": "Calculation", "m": 3, "ht": false, "q": "A spring has a spring constant of 25 N/m. A force of 10 N stretches it.<br/><br/>Calculate the <b>extension<\/b>.", "a": ["e = F ÷ k (1)", "= 10 ÷ 25 (1)", "= <b>0.4 m<\/b> (1)"], "cp": ["e = F ÷ k", "= 10 ÷ 25", "= 0.4 m"], "dp": ["250 m", "2.5 m", "35 m"], "mand": 0}, {"id": "PHY-05-024", "t": 5, "s": "4.5.3", "k": "Calculation", "m": 3, "ht": false, "q": "A force of 12 N stretches a spring by 6 cm (0.06 m). Calculate the <b>spring constant<\/b> in N/m.", "a": ["k = F ÷ e (1)", "= 12 ÷ 0.06 (1)", "= <b>200 N/m<\/b> (1)"], "cp": ["k = F ÷ e", "= 12 ÷ 0.06", "= 200 N/m"], "dp": ["2 N/m", "0.5 N/m", "72 N/m"], "mand": 0}, {"id": "PHY-05-025", "t": 5, "s": "4.5.3", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical:<\/b> Describe how to investigate the <b>extension of a spring<\/b>.", "a": ["Measure the <b>original length<\/b> of the spring (1)", "Add a <b>mass<\/b> and measure the new length (1)", "<b>Extension = new length - original length<\/b> (1)", "Repeat with <b>more masses<\/b>, reading at eye level with a ruler (1)", "Plot <b>force (weight) against extension<\/b> (1)"], "cp": ["Measure the original length of the spring", "Add a mass and measure the new length", "Extension = new length - original length", "Repeat with more masses, reading at eye level with a ruler", "Plot force (weight) against extension"], "dp": ["Hang a single mass and time it", "Measure the original length only", "Measure the mass of the spring"], "mand": 0}, {"id": "PHY-05-026", "t": 5, "s": "4.5.3", "k": "Data", "m": 3, "ht": false, "q": "Describe a <b>force-extension graph<\/b> for a spring within its limit of proportionality.", "a": ["A <b>straight line<\/b> through the origin (1)", "Force is <b>directly proportional<\/b> to extension (1)", "The <b>gradient<\/b> equals the spring constant (1)"], "cp": ["A straight line through the origin", "Force is directly proportional to extension", "The gradient equals the spring constant"], "dp": ["A curve that gets steeper", "A flat horizontal line", "The graph goes down"], "mand": 0}, {"id": "PHY-05-027", "t": 5, "s": "4.5.3", "k": "Explain", "m": 2, "ht": false, "q": "What happens to a spring if it is stretched beyond its <b>limit of proportionality<\/b>?", "a": ["Force and extension are <b>no longer directly proportional<\/b> (graph curves) (1)", "The spring may be <b>permanently deformed<\/b> if stretched too far (1)"], "cp": ["Force and extension are no longer directly proportional (graph curves)", "The spring may be permanently deformed if stretched too far"], "dp": ["It keeps following Hooke's law", "The spring becomes a rod", "It becomes stronger"], "mand": 0}, {"id": "PHY-05-028", "t": 5, "s": "4.5.3", "k": "Evaluate", "m": 2, "ht": false, "q": "In the spring practical, how can you make the measurements more <b>accurate<\/b>?", "a": ["Read the ruler at <b>eye level<\/b>, parallel to the scale (1)", "Use a <b>set square<\/b> or marker and repeat the readings (1)"], "cp": ["Read the ruler at eye level, parallel to the scale", "Use a set square or marker and repeat the readings"], "dp": ["Use a thicker spring", "Add all the masses at once", "Use a longer string"], "mand": 0}, {"id": "PHY-05-029", "t": 5, "s": "4.5.4", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>moment<\/b> and what is the equation for it?", "a": ["The <b>turning effect<\/b> of a force (1)", "moment = <b>force × perpendicular distance<\/b> from the pivot (M = F d), in <b>Nm<\/b> (1)"], "cp": ["The turning effect of a force", "moment = force × perpendicular distance from the pivot (M = F d), in Nm"], "dp": ["The linear speed of an object", "moment = force ÷ distance", "moment = mass × speed"], "mand": 0}, {"id": "PHY-05-030", "t": 5, "s": "4.5.4", "k": "Calculation", "m": 3, "ht": false, "q": "A 20 N force acts 0.5 m from a pivot. Calculate the <b>moment<\/b>.", "a": ["M = F d (1)", "= 20 × 0.5 (1)", "= <b>10 Nm<\/b> (1)"], "cp": ["M = F d", "= 20 × 0.5", "= 10 Nm"], "dp": ["40 Nm", "0.025 Nm", "20.5 Nm"], "mand": 0}, {"id": "PHY-05-031", "t": 5, "s": "4.5.4", "k": "Calculation", "m": 3, "ht": false, "q": "A seesaw is balanced. A 300 N child sits 2 m from the pivot. A second child sits 3 m on the other side.<br/><br/>Calculate the <b>weight of the second child<\/b>.", "a": ["Clockwise moment = anticlockwise moment (1)", "300 × 2 = F × 3, so 600 = 3F (1)", "F = <b>200 N<\/b> (1)"], "cp": ["Clockwise moment = anticlockwise moment", "300 × 2 = F × 3, so 600 = 3F", "F = 200 N"], "dp": ["450 N", "900 N", "100 N"], "mand": 0}, {"id": "PHY-05-032", "t": 5, "s": "4.5.4", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>principle of moments<\/b>?", "a": ["For an object in <b>equilibrium<\/b> (balanced) (1)", "<b>total clockwise moment = total anticlockwise moment<\/b> (1)"], "cp": ["For an object in equilibrium (balanced)", "total clockwise moment = total anticlockwise moment"], "dp": ["Forces must always be zero for an object to move", "The bigger force always wins", "Moments only matter if there is no pivot"], "mand": 0}, {"id": "PHY-05-033", "t": 5, "s": "4.5.4", "k": "Explain", "m": 2, "ht": false, "q": "Why is a <b>long spanner<\/b> easier to use to undo a nut?", "a": ["A longer spanner means a <b>bigger distance<\/b> from the pivot (1)", "so the <b>same force gives a bigger moment<\/b> (1)"], "cp": ["A longer spanner means a bigger distance from the pivot", "so the same force gives a bigger moment"], "dp": ["A long spanner reduces the force needed because it is lighter", "Distance has no effect on moments", "The moment is the same for any spanner"], "mand": 0}, {"id": "PHY-05-034", "t": 5, "s": "4.5.5", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>pressure<\/b> and the unit.", "a": ["pressure = <b>force ÷ area<\/b> (p = F ÷ A) (1)", "Units: <b>pascal (Pa)<\/b> or N/m<sup>2<\/sup> (1)"], "cp": ["pressure = force ÷ area (p = F ÷ A)", "Units: pascal (Pa) or N/m<sup>2<\/sup>"], "dp": ["pressure = force × area", "pressure = area ÷ force", "pressure = mass ÷ area"], "mand": 0}, {"id": "PHY-05-035", "t": 5, "s": "4.5.5", "k": "Calculation", "m": 3, "ht": false, "q": "A 600 N person stands on an area of 0.03 m<sup>2<\/sup>. Calculate the <b>pressure<\/b>.", "a": ["p = F ÷ A (1)", "= 600 ÷ 0.03 (1)", "= <b>20 000 Pa<\/b> (1)"], "cp": ["p = F ÷ A", "= 600 ÷ 0.03", "= 20 000 Pa"], "dp": ["18 Pa", "600.03 Pa", "0.00005 Pa"], "mand": 0}, {"id": "PHY-05-036", "t": 5, "s": "4.5.5", "k": "Explain", "m": 2, "ht": false, "q": "Why do <b>skis<\/b> stop you sinking into snow?", "a": ["Skis have a <b>large area<\/b> (1)", "so the <b>pressure is smaller<\/b> for the same weight (1)"], "cp": ["Skis have a large area", "so the pressure is smaller for the same weight"], "dp": ["Skis have a small area so the pressure is bigger", "Skis make you lighter", "Snow is less dense under skis"], "mand": 0}, {"id": "PHY-05-037", "t": 5, "s": "4.5.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain why the <b>pressure in a liquid<\/b> increases with depth.", "a": ["The deeper you go, the <b>more liquid is above<\/b> (1)", "so there is <b>more weight<\/b> pushing down (1)", "Giving a <b>greater pressure<\/b> (and it acts in all directions) (1)"], "cp": ["The deeper you go, the more liquid is above", "so there is more weight pushing down", "Giving a greater pressure (and it acts in all directions)"], "dp": ["Pressure is the same at all depths", "The pressure is lower deeper down", "Pressure only acts downwards"], "mand": 0}, {"id": "PHY-05-038", "t": 5, "s": "4.5.5", "k": "Recall", "m": 2, "ht": false, "q": "What causes <b>atmospheric pressure<\/b> and how does it change with height?", "a": ["Air particles <b>collide with surfaces<\/b> (the weight of air above) (1)", "It <b>decreases<\/b> as you go higher because there is <b>less air above<\/b> (1)"], "cp": ["Air particles collide with surfaces (the weight of air above)", "It decreases as you go higher because there is less air above"], "dp": ["It increases with height", "It is caused by the Earth's rotation", "It stays the same at all heights"], "mand": 0}, {"id": "PHY-05-039", "t": 5, "s": "4.5.6.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between <b>distance<\/b> and <b>displacement<\/b>?", "a": ["Distance is how far an object <b>moves along its path<\/b> (a scalar) (1)", "Displacement is the <b>straight-line distance with direction<\/b> from start to finish (a vector) (1)"], "cp": ["Distance is how far an object moves along its path (a scalar)", "Displacement is the straight-line distance with direction from start to finish (a vector)"], "dp": ["Displacement has no direction", "Distance has a direction", "They are the same thing"], "mand": 0}, {"id": "PHY-05-040", "t": 5, "s": "4.5.6.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between <b>speed<\/b> and <b>velocity<\/b>?", "a": ["Speed is a <b>scalar<\/b>: how fast, no direction (1)", "Velocity is a <b>vector<\/b>: speed <b>in a given direction<\/b> (1)"], "cp": ["Speed is a scalar: how fast, no direction", "Velocity is a vector: speed in a given direction"], "dp": ["Speed has a direction", "Velocity is how fast only", "Velocity is a scalar"], "mand": 0}, {"id": "PHY-05-041", "t": 5, "s": "4.5.6.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>speed<\/b>.", "a": ["speed = <b>distance ÷ time<\/b> (1)", "v = s ÷ t, in <b>m/s<\/b> (1)"], "cp": ["speed = distance ÷ time", "v = s ÷ t, in m/s"], "dp": ["speed = time ÷ distance", "speed = distance × time", "speed = force ÷ time"], "mand": 0}, {"id": "PHY-05-042", "t": 5, "s": "4.5.6.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>typical speeds<\/b> for walking, running and cycling.", "a": ["Walking about <b>1.5 m/s<\/b> (1)", "Running about <b>3 m/s<\/b> (1)", "Cycling about <b>6 m/s<\/b> (1)"], "cp": ["Walking about 1.5 m/s", "Running about 3 m/s", "Cycling about 6 m/s"], "dp": ["Walking 15 m/s, running 30 m/s, cycling 60 m/s", "Walking 0.15 m/s, running 0.3 m/s, cycling 0.6 m/s", "Walking 6 m/s, running 1.5 m/s, cycling 3 m/s"], "mand": 0}, {"id": "PHY-05-043", "t": 5, "s": "4.5.6.1", "k": "Calculation", "m": 3, "ht": false, "q": "A car travels 90 m in 6 seconds. Calculate its <b>speed<\/b>.", "a": ["v = s ÷ t (1)", "= 90 ÷ 6 (1)", "= <b>15 m/s<\/b> (1)"], "cp": ["v = s ÷ t", "= 90 ÷ 6", "= 15 m/s"], "dp": ["540 m/s", "0.067 m/s", "96 m/s"], "mand": 0}, {"id": "PHY-05-044", "t": 5, "s": "4.5.6.1", "k": "Calculation", "m": 3, "ht": false, "q": "A runner moves at 4 m/s for 2 minutes. Calculate the <b>distance<\/b> run.", "a": ["2 minutes = 120 s (1)", "s = v t = 4 × 120 (1)", "= <b>480 m<\/b> (1)"], "cp": ["2 minutes = 120 s", "s = v t = 4 × 120", "= 480 m"], "dp": ["8 m", "30 m", "0.033 m"], "mand": 0}, {"id": "PHY-05-045", "t": 5, "s": "4.5.6.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>acceleration<\/b> and give its units.", "a": ["acceleration = <b>change in velocity ÷ time taken<\/b> (a = Δv ÷ t) (1)", "Units: <b>m/s<sup>2<\/sup><\/b> (1)"], "cp": ["acceleration = change in velocity ÷ time taken (a = Δv ÷ t)", "Units: m/s<sup>2<\/sup>"], "dp": ["acceleration = velocity × time", "acceleration = time ÷ change in velocity", "Units: m/s"], "mand": 0}, {"id": "PHY-05-046", "t": 5, "s": "4.5.6.1", "k": "Calculation", "m": 3, "ht": false, "q": "A car speeds up from 5 m/s to 25 m/s in 4 seconds. Calculate its <b>acceleration<\/b>.", "a": ["Δv = 25 - 5 = 20 m/s (1)", "a = Δv ÷ t = 20 ÷ 4 (1)", "= <b>5 m/s<sup>2<\/sup><\/b> (1)"], "cp": ["Δv = 25 - 5 = 20 m/s", "a = Δv ÷ t = 20 ÷ 4", "= 5 m/s<sup>2<\/sup>"], "dp": ["7.5 m/s<sup>2<\/sup>", "80 m/s<sup>2<\/sup>", "0.2 m/s<sup>2<\/sup>"], "mand": 0}, {"id": "PHY-05-047", "t": 5, "s": "4.5.6.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking <b>final speed, initial speed, acceleration and distance<\/b>.", "a": ["<b>v<sup>2<\/sup> - u<sup>2<\/sup> = 2 a s<\/b> (1)", "v = final speed, u = initial speed, a = acceleration, s = distance (1)"], "cp": ["v<sup>2<\/sup> - u<sup>2<\/sup> = 2 a s", "v = final speed, u = initial speed, a = acceleration, s = distance"], "dp": ["v = u + a", "v<sup>2<\/sup> = u<sup>2<\/sup> + a s", "v - u = a s"], "mand": 0}, {"id": "PHY-05-048", "t": 5, "s": "4.5.6.1", "k": "Calculation", "m": 3, "ht": false, "q": "A car starts at rest and accelerates at 2 m/s<sup>2<\/sup> over 25 m. Calculate its <b>final speed<\/b>.", "a": ["v<sup>2<\/sup> - u<sup>2<\/sup> = 2 a s, so v<sup>2<\/sup> = 0 + 2 × 2 × 25 = 100 (1)", "v = square root of 100 (1)", "= <b>10 m/s<\/b> (1)"], "cp": ["v<sup>2<\/sup> - u<sup>2<\/sup> = 2 a s, so v<sup>2<\/sup> = 0 + 2 × 2 × 25 = 100", "v = square root of 100", "= 10 m/s"], "dp": ["50 m/s", "100 m/s", "5 m/s"], "mand": 0}, {"id": "PHY-05-049", "t": 5, "s": "4.5.6.1", "k": "Data", "m": 3, "ht": false, "q": "On a <b>distance-time graph<\/b>, what does a <b>straight sloping line<\/b>, a <b>flat line<\/b> and a <b>curved steeper line<\/b> show?", "a": ["Straight sloping line: <b>constant speed<\/b> (1)", "Flat line: <b>stationary<\/b> (1)", "Steeper curve: <b>accelerating<\/b> (1)"], "cp": ["Straight sloping line: constant speed", "Flat line: stationary", "Steeper curve: accelerating"], "dp": ["Flat line: constant speed", "Sloping line: stationary", "Steeper curve: decelerating"], "mand": 0}, {"id": "PHY-05-050", "t": 5, "s": "4.5.6.1", "k": "Data", "m": 2, "ht": false, "q": "How can you find the <b>speed<\/b> from a distance-time graph?", "a": ["The <b>gradient<\/b> (slope) of the line (1)", "<b>Change in distance ÷ change in time<\/b> (1)"], "cp": ["The gradient (slope) of the line", "Change in distance ÷ change in time"], "dp": ["The area under the line", "The height at the end of the line", "The length of the line"], "mand": 0}, {"id": "PHY-05-051", "t": 5, "s": "4.5.6.1", "k": "Data", "m": 3, "ht": false, "q": "A velocity-time graph shows a <b>straight line sloping up<\/b>, a <b>flat line<\/b> and a line <b>sloping down<\/b>. What does each show?", "a": ["Sloping up: <b>constant acceleration<\/b> (1)", "Flat line: <b>constant velocity<\/b> (1)", "Sloping down: <b>deceleration<\/b> (1)"], "cp": ["Sloping up: constant acceleration", "Flat line: constant velocity", "Sloping down: deceleration"], "dp": ["Sloping up: constant speed", "Flat line: stationary", "Sloping down: constant speed"], "mand": 0}, {"id": "PHY-05-052", "t": 5, "s": "4.5.6.1", "k": "Data", "m": 3, "ht": false, "q": "A velocity-time graph shows a line from 0 m/s to 10 m/s in 5 s. What is the <b>acceleration<\/b> and the <b>distance<\/b>?", "a": ["Acceleration = gradient = 10 ÷ 5 = <b>2 m/s<sup>2<\/sup><\/b> (1)", "Distance = <b>area under the graph<\/b> (1)", "= 0.5 × 5 × 10 = <b>25 m<\/b> (1)"], "cp": ["Acceleration = gradient = 10 ÷ 5 = 2 m/s<sup>2<\/sup>", "Distance = area under the graph", "= 0.5 × 5 × 10 = 25 m"], "dp": ["Acceleration 50 m/s<sup>2<\/sup>, distance 2 m", "Acceleration 2 m/s, distance 50 m", "Acceleration 0.5 m/s<sup>2<\/sup>, distance 15 m"], "mand": 0}, {"id": "PHY-05-053", "t": 5, "s": "4.5.6.1", "k": "Explain", "m": 3, "ht": false, "q": "Describe the <b>motion of a skydiver<\/b> falling from a plane until they reach terminal velocity.", "a": ["At first, <b>weight is greater<\/b> than air resistance, so they <b>accelerate<\/b> (1)", "As speed increases, <b>air resistance increases<\/b> (1)", "When air resistance <b>equals weight<\/b>, the forces balance and they fall at <b>terminal velocity<\/b> (1)"], "cp": ["At first, weight is greater than air resistance, so they accelerate", "As speed increases, air resistance increases", "When air resistance equals weight, the forces balance and they fall at terminal velocity"], "dp": ["Air resistance is bigger than weight at the start", "They fall at a steady speed from the start", "Air resistance stays the same throughout"], "mand": 0}, {"id": "PHY-05-054", "t": 5, "s": "4.5.6.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>terminal velocity<\/b>?", "a": ["The <b>maximum constant speed<\/b> of a falling object (1)", "reached when <b>resistive forces equal the driving force (weight)<\/b> (1)"], "cp": ["The maximum constant speed of a falling object", "reached when resistive forces equal the driving force (weight)"], "dp": ["The speed when an object hits the ground", "The speed at the start of a fall", "The speed when there is no air resistance"], "mand": 0}, {"id": "PHY-05-055", "t": 5, "s": "4.5.6.2", "k": "Recall", "m": 2, "ht": false, "q": "Write <b>Newton's first law<\/b>.", "a": ["An object stays <b>at rest or at constant velocity<\/b> (1)", "unless acted on by a <b>resultant force<\/b> (1)"], "cp": ["An object stays at rest or at constant velocity", "unless acted on by a resultant force"], "dp": ["Force equals mass times acceleration", "An object always slows down", "Every action has an equal and opposite reaction"], "mand": 0}, {"id": "PHY-05-056", "t": 5, "s": "4.5.6.2", "k": "Recall", "m": 2, "ht": false, "q": "Write <b>Newton's second law<\/b> as an equation.", "a": ["resultant force = <b>mass × acceleration<\/b> (1)", "F = m a, with F in <b>N<\/b>, m in <b>kg<\/b>, a in <b>m/s<sup>2<\/sup><\/b> (1)"], "cp": ["resultant force = mass × acceleration", "F = m a, with F in N, m in kg, a in m/s<sup>2<\/sup>"], "dp": ["F = m ÷ a", "F = m + a", "F = a ÷ m"], "mand": 0}, {"id": "PHY-05-057", "t": 5, "s": "4.5.6.2", "k": "Calculation", "m": 3, "ht": false, "q": "A resultant force of 60 N acts on a 12 kg trolley. Calculate its <b>acceleration<\/b>.", "a": ["a = F ÷ m (1)", "= 60 ÷ 12 (1)", "= <b>5 m/s<sup>2<\/sup><\/b> (1)"], "cp": ["a = F ÷ m", "= 60 ÷ 12", "= 5 m/s<sup>2<\/sup>"], "dp": ["720 m/s<sup>2<\/sup>", "0.2 m/s<sup>2<\/sup>", "48 m/s<sup>2<\/sup>"], "mand": 0}, {"id": "PHY-05-058", "t": 5, "s": "4.5.6.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 1200 kg car accelerates at 2.5 m/s<sup>2<\/sup>. Calculate the <b>resultant force<\/b>.", "a": ["F = m a (1)", "= 1200 × 2.5 (1)", "= <b>3000 N<\/b> (1)"], "cp": ["F = m a", "= 1200 × 2.5", "= 3000 N"], "dp": ["480 N", "1202.5 N", "300 N"], "mand": 0}, {"id": "PHY-05-059", "t": 5, "s": "4.5.6.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>inertia<\/b>?", "a": ["The <b>tendency of an object to stay at rest or at constant velocity<\/b> (1)", "The <b>bigger the mass<\/b>, the <b>greater the inertia<\/b> (1)"], "cp": ["The tendency of an object to stay at rest or at constant velocity", "The bigger the mass, the greater the inertia"], "dp": ["The force of gravity on an object", "The speed of an object", "The friction between surfaces"], "mand": 0}, {"id": "PHY-05-060", "t": 5, "s": "4.5.6.2", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical:<\/b> Describe how to investigate how <b>force affects acceleration<\/b> of a trolley.", "a": ["Use a <b>trolley<\/b> pulled by a falling <b>mass<\/b> over a pulley, with a <b>light gate<\/b> (1)", "Measure the <b>acceleration<\/b> with the light gates (1)", "Change the <b>force<\/b> by moving masses from the trolley to the hanger (1)", "Keep the <b>total mass constant<\/b> (1)", "Plot <b>acceleration against force<\/b> (1)"], "cp": ["Use a trolley pulled by a falling mass over a pulley, with a light gate", "Measure the acceleration with the light gates", "Change the force by moving masses from the trolley to the hanger", "Keep the total mass constant", "Plot acceleration against force"], "dp": ["Change both mass and force at the same time", "Time the trolley only once with no repeats", "Use a different surface each time"], "mand": 0}, {"id": "PHY-05-061", "t": 5, "s": "4.5.6.2", "k": "Explain", "m": 2, "ht": false, "q": "In the force and acceleration practical, why do you move masses from the <b>trolley to the hanger<\/b>?", "a": ["To change the force while keeping the <b>total mass the same<\/b> (1)", "so only <b>force<\/b> is the independent variable (1)"], "cp": ["To change the force while keeping the total mass the same", "so only force is the independent variable"], "dp": ["To make the trolley heavier", "To keep the force constant", "To stop the trolley from moving"], "mand": 0}, {"id": "PHY-05-062", "t": 5, "s": "4.5.6.2", "k": "Data", "m": 2, "ht": false, "q": "Describe the <b>graph<\/b> of acceleration against force from the practical (constant mass).", "a": ["A <b>straight line<\/b> through the origin (1)", "Acceleration is <b>directly proportional<\/b> to force (1)"], "cp": ["A straight line through the origin", "Acceleration is directly proportional to force"], "dp": ["A curve that levels off", "A horizontal line", "A line that goes down"], "mand": 0}, {"id": "PHY-05-063", "t": 5, "s": "4.5.6.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain what happens to the acceleration of an object if the <b>mass doubles<\/b> with the same force.", "a": ["a = F ÷ m (1)", "Mass doubles, so acceleration is <b>halved<\/b> (1)", "Acceleration is <b>inversely proportional<\/b> to mass (1)"], "cp": ["a = F ÷ m", "Mass doubles, so acceleration is halved", "Acceleration is inversely proportional to mass"], "dp": ["Acceleration doubles", "Acceleration stays the same", "Acceleration is quartered"], "mand": 0}, {"id": "PHY-05-064", "t": 5, "s": "4.5.6.3", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>stopping distance<\/b> of a vehicle?", "a": ["<b>Thinking distance<\/b> + <b>braking distance<\/b> (1)", "The total distance travelled from seeing the hazard to <b>coming to a stop<\/b> (1)"], "cp": ["Thinking distance + braking distance", "The total distance travelled from seeing the hazard to coming to a stop"], "dp": ["Only the braking distance", "The time needed to stop", "The distance travelled during the reaction time only"], "mand": 0}, {"id": "PHY-05-065", "t": 5, "s": "4.5.6.3", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three factors<\/b> that affect <b>thinking distance<\/b>.", "a": ["Any three (1 each):", "• <b>speed<\/b> of the vehicle", "• <b>tiredness<\/b>", "• <b>alcohol or drugs<\/b>", "• <b>distractions<\/b> (phone)", "• the driver's <b>reaction time<\/b>"], "cp": ["speed of the vehicle", "tiredness", "alcohol or drugs", "distractions (phone)", "the driver's reaction time"], "dp": ["Worn brakes, wet roads and tyres", "Mass of the car", "The road surface only"], "mand": 0}, {"id": "PHY-05-066", "t": 5, "s": "4.5.6.3", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three factors<\/b> that affect <b>braking distance<\/b>.", "a": ["Any three (1 each):", "• <b>speed<\/b> of the vehicle", "• <b>mass<\/b> of the vehicle", "• <b>worn brakes or tyres<\/b>", "• <b>wet or icy roads<\/b>", "• <b>poor road surface<\/b>"], "cp": ["speed of the vehicle", "mass of the vehicle", "worn brakes or tyres", "wet or icy roads", "poor road surface"], "dp": ["Tiredness, alcohol and distractions", "The driver's reaction time", "Colour of the car"], "mand": 0}, {"id": "PHY-05-067", "t": 5, "s": "4.5.6.3", "k": "Data", "m": 2, "ht": false, "q": "Typical <b>reaction time<\/b> is about 0.2 to 0.9 s. Name <b>one way to measure<\/b> reaction time.", "a": ["<b>Ruler drop test<\/b> (catch a falling ruler) (1)", "Or a <b>computer reaction test<\/b> (1)"], "cp": ["Ruler drop test (catch a falling ruler)", "Or a computer reaction test"], "dp": ["Time with a thermometer", "Use a voltmeter", "Measure the mass of the person"], "mand": 0}, {"id": "PHY-05-068", "t": 5, "s": "4.5.7.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>momentum<\/b> and what is the equation?", "a": ["Momentum = <b>mass × velocity<\/b> (p = m v) (1)", "Measured in <b>kg m/s<\/b>; it is a <b>vector<\/b> (1)"], "cp": ["Momentum = mass × velocity (p = m v)", "Measured in kg m/s; it is a vector"], "dp": ["momentum = mass ÷ velocity", "momentum = force × time only", "momentum = mass × acceleration"], "mand": 0}, {"id": "PHY-05-069", "t": 5, "s": "4.5.7.1", "k": "Calculation", "m": 3, "ht": false, "q": "A 1500 kg car travels at 20 m/s. Calculate its <b>momentum<\/b>.", "a": ["p = m v (1)", "= 1500 × 20 (1)", "= <b>30 000 kg m/s<\/b> (1)"], "cp": ["p = m v", "= 1500 × 20", "= 30 000 kg m/s"], "dp": ["75 kg m/s", "300 000 kg m/s", "1520 kg m/s"], "mand": 0}, {"id": "PHY-05-070", "t": 5, "s": "4.5.7.1", "k": "Recall", "m": 2, "ht": false, "q": "State the <b>conservation of momentum<\/b>.", "a": ["In a <b>closed system<\/b>, the total momentum <b>before<\/b> an event (1)", "is <b>equal to<\/b> the total momentum <b>after<\/b> (1)"], "cp": ["In a closed system, the total momentum before an event", "is equal to the total momentum after"], "dp": ["Momentum is always lost in collisions", "Total momentum increases after a collision", "Momentum is only conserved if energy is conserved"], "mand": 0}, {"id": "PHY-05-071", "t": 5, "s": "4.5.7.1", "k": "Calculation", "m": 4, "ht": false, "q": "A 2 kg trolley at 3 m/s hits a stationary 1 kg trolley. They stick together. Calculate their <b>velocity<\/b> after the collision.", "a": ["Momentum before = 2 × 3 = 6 kg m/s (1)", "Total mass after = 3 kg (1)", "v = 6 ÷ 3 (1)", "= <b>2 m/s<\/b> (1)"], "cp": ["Momentum before = 2 × 3 = 6 kg m/s", "Total mass after = 3 kg", "v = 6 ÷ 3", "= 2 m/s"], "dp": ["3 m/s", "1 m/s", "9 m/s"], "mand": 0}, {"id": "PHY-05-072", "t": 5, "s": "4.5.7.1", "k": "Explain", "m": 2, "ht": false, "q": "A gun fires a bullet forward. Why does the gun <b>recoil<\/b> backwards?", "a": ["Total momentum <b>before = 0<\/b> (1)", "The bullet gains forward momentum, so the gun gains <b>equal and opposite momentum<\/b> (1)"], "cp": ["Total momentum before = 0", "The bullet gains forward momentum, so the gun gains equal and opposite momentum"], "dp": ["The bullet pushes the air backwards", "The gun gains forward momentum", "Momentum is not conserved"], "mand": 0}, {"id": "PHY-05-073", "t": 5, "s": "4.5.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why do <b>two ice skaters<\/b> push off from each other and move in opposite directions?", "a": ["Newton's third law: forces are <b>equal and opposite<\/b> (1)", "Each skater <b>gains momentum<\/b> in opposite directions (1)"], "cp": ["Newton's third law: forces are equal and opposite", "Each skater gains momentum in opposite directions"], "dp": ["Only the lighter skater moves", "They both move in the same direction", "The force of friction pushes them apart"], "mand": 0}, {"id": "PHY-05-074", "t": 5, "s": "4.5.6.1", "k": "Calculation", "m": 3, "ht": false, "q": "A cyclist accelerates from rest at 1.5 m/s<sup>2<\/sup> for 8 seconds. Calculate the <b>final velocity<\/b>.", "a": ["v = u + a t (or a = Δv ÷ t) (1)", "= 0 + 1.5 × 8 (1)", "= <b>12 m/s<\/b> (1)"], "cp": ["v = u + a t (or a = Δv ÷ t)", "= 0 + 1.5 × 8", "= 12 m/s"], "dp": ["5.3 m/s", "9.5 m/s", "0.19 m/s"], "mand": 0}, {"id": "PHY-05-075", "t": 5, "s": "4.5.6.2", "k": "Explain", "m": 2, "ht": false, "q": "A box is pushed with a force of 20 N but does not move. How big is <b>friction<\/b>?", "a": ["The box is <b>stationary<\/b> (1)", "so <b>forces are balanced<\/b>, friction = <b>20 N<\/b> (1)"], "cp": ["The box is stationary", "so forces are balanced, friction = 20 N"], "dp": ["Friction is zero", "Friction is greater than 20 N", "Friction is 10 N"], "mand": 0}, {"id": "PHY-05-076", "t": 5, "s": "4.5.2", "k": "Calculation", "m": 3, "ht": false, "q": "A crane lifts a 200 kg load 15 m. (g = 10 N/kg)<br/><br/>Calculate the <b>work done<\/b>.", "a": ["Weight = 200 × 10 = 2000 N (1)", "W = F s = 2000 × 15 (1)", "= <b>30 000 J<\/b> (1)"], "cp": ["Weight = 200 × 10 = 2000 N", "W = F s = 2000 × 15", "= 30 000 J"], "dp": ["3000 J", "300 J", "13 J"], "mand": 0}, {"id": "PHY-05-H01", "t": 5, "s": "4.5.1.3", "k": "Calculation", "m": 3, "ht": true, "q": "A force of 30 N
