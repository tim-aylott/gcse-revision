<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayla Physics">
<meta name="theme-color" content="#0d1020">
<title>Kayla's Physics Lab | GCSE Higher revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#8b7bff;--accent2:#38d0f0;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>

<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.5"/></svg></span><span>Physics Lab</span></button>
  <span class="pill">Kayla | Higher</span>

  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>
<script>
const DATA=[{"id": "PHY-01-001", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four<\/b> energy stores.", "a": ["Any four (1 each):", "• <b>kinetic<\/b>", "• <b>gravitational potential<\/b>", "• <b>elastic potential<\/b>", "• <b>thermal<\/b>", "• <b>chemical<\/b>", "• <b>nuclear<\/b>"], "cp": ["kinetic", "gravitational potential", "elastic potential", "thermal", "chemical", "nuclear"], "dp": ["Heat, light, sound and movement", "Force, mass, weight and speed", "Electricity, current, voltage and charge"], "mand": 0}, {"id": "PHY-01-002", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two<\/b> ways energy can be transferred between stores.", "a": ["Any two (1 each):", "• <b>mechanically<\/b> (by a force doing work)", "• <b>electrically<\/b> (a current)", "• by <b>heating<\/b>", "• by <b>radiation<\/b> (light or sound waves)"], "cp": ["mechanically (by a force doing work)", "electrically (a current)", "by heating", "by radiation (light or sound waves)"], "dp": ["By melting and freezing", "By gravity and magnetism only", "By filtering"], "mand": 0}, {"id": "PHY-01-003", "t": 1, "s": "4.1.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>system<\/b> in physics? Give an example.", "a": ["An <b>object or group of objects<\/b> being studied (1)", "Example: <b>a kettle<\/b>, or a ball and the Earth (1)"], "cp": ["An object or group of objects being studied", "Example: a kettle, or a ball and the Earth"], "dp": ["A set of rules for solving equations", "Only a machine with a motor", "Any object that is moving"], "mand": 0}, {"id": "PHY-01-004", "t": 1, "s": "4.1.1.1", "k": "Explain", "m": 3, "ht": false, "q": "A moving car brakes and stops. Describe the <b>energy transfer<\/b>.", "a": ["The <b>kinetic<\/b> store of the car decreases (1)", "The brakes get hot, so the <b>thermal<\/b> store increases (1)", "Energy is transferred by <b>friction<\/b> (mechanical work) (1)"], "cp": ["The kinetic store of the car decreases", "The brakes get hot, so the thermal store increases", "Energy is transferred by friction (mechanical work)"], "dp": ["The car gains kinetic energy from the brakes", "Energy is destroyed when the car stops", "The chemical store of the road increases"], "mand": 0}, {"id": "PHY-01-005", "t": 1, "s": "4.1.1.1", "k": "Explain", "m": 3, "ht": false, "q": "A ball is thrown up into the air. Describe the <b>energy changes<\/b> as it rises.", "a": ["The <b>kinetic<\/b> store decreases (1)", "The <b>gravitational potential<\/b> store increases (1)", "(Ignoring air resistance) the <b>total energy stays the same<\/b> (1)"], "cp": ["The kinetic store decreases", "The gravitational potential store increases", "(Ignoring air resistance) the total energy stays the same"], "dp": ["Both kinetic and gravitational potential stores increase", "Gravitational potential energy changes to sound", "Energy is created as the ball rises"], "mand": 0}, {"id": "PHY-01-006", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>kinetic energy<\/b>.", "a": ["kinetic energy = <b>0.5 × mass × speed<sup>2<\/sup><\/b> (1)", "E<sub>k<\/sub> = ½ m v<sup>2<\/sup>, in <b>joules (J)<\/b> (1)"], "cp": ["kinetic energy = 0.5 × mass × speed<sup>2<\/sup>", "E<sub>k<\/sub> = ½ m v<sup>2<\/sup>, in joules (J)"], "dp": ["kinetic energy = mass × speed", "kinetic energy = mass × gravity × height", "kinetic energy = 0.5 × mass × speed"], "mand": 0}, {"id": "PHY-01-007", "t": 1, "s": "4.1.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the <b>kinetic energy<\/b> of a 2 kg ball moving at 5 m/s.", "a": ["E<sub>k<\/sub> = 0.5 × m × v<sup>2<\/sup> (1)", "= 0.5 × 2 × 5<sup>2<\/sup> (1)", "= <b>25 J<\/b> (1)"], "cp": ["E<sub>k<\/sub> = 0.5 × m × v<sup>2<\/sup>", "= 0.5 × 2 × 5<sup>2<\/sup>", "= 25 J"], "dp": ["50 J", "10 J", "100 J"], "mand": 0}, {"id": "PHY-01-008", "t": 1, "s": "4.1.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 1500 kg car travels at 10 m/s. Calculate its <b>kinetic energy<\/b>.", "a": ["E<sub>k<\/sub> = 0.5 × m × v<sup>2<\/sup> (1)", "= 0.5 × 1500 × 10<sup>2<\/sup> (1)", "= <b>75 000 J<\/b> (1)"], "cp": ["E<sub>k<\/sub> = 0.5 × m × v<sup>2<\/sup>", "= 0.5 × 1500 × 10<sup>2<\/sup>", "= 75 000 J"], "dp": ["7500 J", "150 000 J", "15 000 J"], "mand": 0}, {"id": "PHY-01-009", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for the change in <b>gravitational potential energy<\/b>.", "a": ["GPE = <b>mass × gravitational field strength × height<\/b> (1)", "E<sub>p<\/sub> = m g h, in <b>joules<\/b>. (g = 9.8 N/kg on Earth) (1)"], "cp": ["GPE = mass × gravitational field strength × height", "E<sub>p<\/sub> = m g h, in joules. (g = 9.8 N/kg on Earth)"], "dp": ["GPE = mass × height", "GPE = mass × speed × height", "GPE = 0.5 × mass × height<sup>2<\/sup>"], "mand": 0}, {"id": "PHY-01-010", "t": 1, "s": "4.1.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 3 kg book is lifted 2 m. (g = 9.8 N/kg)<br/><br/>Calculate the <b>gravitational potential energy<\/b> gained.", "a": ["E<sub>p<\/sub> = m g h (1)", "= 3 × 9.8 × 2 (1)", "= <b>58.8 J<\/b> (1)"], "cp": ["E<sub>p<\/sub> = m g h", "= 3 × 9.8 × 2", "= 58.8 J"], "dp": ["29.4 J", "5.9 J", "19.6 J"], "mand": 0}, {"id": "PHY-01-011", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for the energy stored in a <b>stretched spring<\/b>.", "a": ["elastic potential energy = <b>0.5 × spring constant × extension<sup>2<\/sup><\/b> (1)", "E<sub>e<\/sub> = ½ k e<sup>2<\/sup>, in <b>joules<\/b> (1)"], "cp": ["elastic potential energy = 0.5 × spring constant × extension<sup>2<\/sup>", "E<sub>e<\/sub> = ½ k e<sup>2<\/sup>, in joules"], "dp": ["E = 0.5 × k × e", "E = k × e", "E = 0.5 × mass × extension<sup>2<\/sup>"], "mand": 0}, {"id": "PHY-01-012", "t": 1, "s": "4.1.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "A spring has a spring constant of 40 N/m. It is stretched by 0.10 m.<br/><br/>Calculate the <b>energy stored<\/b>.", "a": ["E<sub>e<\/sub> = 0.5 × k × e<sup>2<\/sup> (1)", "= 0.5 × 40 × 0.10<sup>2<\/sup> (1)", "= <b>0.2 J<\/b> (1)"], "cp": ["E<sub>e<\/sub> = 0.5 × k × e<sup>2<\/sup>", "= 0.5 × 40 × 0.10<sup>2<\/sup>", "= 0.2 J"], "dp": ["2 J", "0.4 J", "4 J"], "mand": 0}, {"id": "PHY-01-013", "t": 1, "s": "4.1.1.3", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>specific heat capacity<\/b> of a substance?", "a": ["The <b>energy needed<\/b> to raise the temperature of <b>1 kg<\/b> of the substance (1)", "by <b>1 °C<\/b> (1)"], "cp": ["The energy needed to raise the temperature of 1 kg of the substance", "by 1 °C"], "dp": ["The energy needed to melt 1 kg of the substance", "The temperature of 1 kg of the substance", "The energy a substance gives out when burned"], "mand": 0}, {"id": "PHY-01-014", "t": 1, "s": "4.1.1.3", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking <b>change in thermal energy<\/b>, mass, specific heat capacity and temperature change.", "a": ["change in thermal energy = <b>mass × specific heat capacity × temperature change<\/b> (1)", "ΔE = m c Δθ (1)"], "cp": ["change in thermal energy = mass × specific heat capacity × temperature change", "ΔE = m c Δθ"], "dp": ["ΔE = m × c ÷ Δθ", "ΔE = c × Δθ", "ΔE = m × g × Δθ"], "mand": 0}, {"id": "PHY-01-015", "t": 1, "s": "4.1.1.3", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the energy needed to heat 2 kg of water by 10 °C. (specific heat capacity of water = 4200 J/kg °C)", "a": ["ΔE = m c Δθ (1)", "= 2 × 4200 × 10 (1)", "= <b>84 000 J<\/b> (1)"], "cp": ["ΔE = m c Δθ", "= 2 × 4200 × 10", "= 84 000 J"], "dp": ["8400 J", "840 J", "42 000 J"], "mand": 0}, {"id": "PHY-01-016", "t": 1, "s": "4.1.1.3", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical:<\/b> Describe how to find the <b>specific heat capacity<\/b> of a metal block.", "a": ["Measure the <b>mass<\/b> of the block (1)", "Put a <b>heater and thermometer<\/b> in the block and insulate it (1)", "Record the <b>start temperature<\/b>, switch on and record the <b>energy supplied<\/b> (1)", "Record the <b>final temperature<\/b> (1)", "Calculate <b>c = ΔE ÷ (m × Δθ)<\/b> (1)"], "cp": ["Measure the mass of the block", "Put a heater and thermometer in the block and insulate it", "Record the start temperature, switch on and record the energy supplied", "Record the final temperature", "Calculate c = ΔE ÷ (m × Δθ)"], "dp": ["Measure only the volume of the block", "Heat the block with an open flame and ignore the thermometer", "Measure the time only"], "mand": 0}, {"id": "PHY-01-017", "t": 1, "s": "4.1.1.3", "k": "Evaluate", "m": 2, "ht": false, "q": "In the specific heat capacity practical, why is the block wrapped in <b>insulation<\/b>?", "a": ["To <b>reduce energy lost<\/b> to the surroundings (1)", "So the result is <b>closer to the true value<\/b> (more accurate) (1)"], "cp": ["To reduce energy lost to the surroundings", "So the result is closer to the true value (more accurate)"], "dp": ["To stop the block melting", "To make the block heavier", "To make the heater work faster"], "mand": 0}, {"id": "PHY-01-018", "t": 1, "s": "4.1.1.4", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>power<\/b>?", "a": ["The <b>rate<\/b> of transferring energy (or doing work) (1)", "Measured in <b>watts (W)<\/b>, where 1 W = 1 J/s (1)"], "cp": ["The rate of transferring energy (or doing work)", "Measured in watts (W), where 1 W = 1 J/s"], "dp": ["The total energy in a store", "The force on an object", "The distance moved in one second"], "mand": 0}, {"id": "PHY-01-019", "t": 1, "s": "4.1.1.4", "k": "Recall", "m": 2, "ht": false, "q": "Write <b>two equations<\/b> for power.", "a": ["power = <b>energy transferred ÷ time<\/b> (1)", "power = <b>work done ÷ time<\/b> (1)"], "cp": ["power = energy transferred ÷ time", "power = work done ÷ time"], "dp": ["power = energy × time", "power = time ÷ energy", "power = force × mass"], "mand": 0}, {"id": "PHY-01-020", "t": 1, "s": "4.1.1.4", "k": "Calculation", "m": 3, "ht": false, "q": "A motor transfers 3000 J in 12 seconds.<br/><br/>Calculate its <b>power<\/b>.", "a": ["P = E ÷ t (1)", "= 3000 ÷ 12 (1)", "= <b>250 W<\/b> (1)"], "cp": ["P = E ÷ t", "= 3000 ÷ 12", "= 250 W"], "dp": ["36 000 W", "0.004 W", "2500 W"], "mand": 0}, {"id": "PHY-01-021", "t": 1, "s": "4.1.1.4", "k": "Calculation", "m": 3, "ht": false, "q": "A 2 kW kettle runs for 3 minutes. Calculate the <b>energy transferred<\/b> in joules.", "a": ["2 kW = 2000 W and 3 min = 180 s (1)", "E = P × t = 2000 × 180 (1)", "= <b>360 000 J<\/b> (1)"], "cp": ["2 kW = 2000 W and 3 min = 180 s", "E = P × t = 2000 × 180", "= 360 000 J"], "dp": ["6000 J", "360 J", "6 J"], "mand": 0}, {"id": "PHY-01-022", "t": 1, "s": "4.1.2.1", "k": "Recall", "m": 2, "ht": false, "q": "State the <b>law of conservation of energy<\/b>.", "a": ["Energy <b>cannot be created or destroyed<\/b> (1)", "It can only be <b>transferred, stored or dissipated<\/b> (1)"], "cp": ["Energy cannot be created or destroyed", "It can only be transferred, stored or dissipated"], "dp": ["Energy is used up when work is done", "Energy can be made by machines", "Energy is always destroyed as heat"], "mand": 0}, {"id": "PHY-01-023", "t": 1, "s": "4.1.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What does it mean when energy is <b>dissipated<\/b>?", "a": ["Energy is <b>spread out<\/b> into the surroundings (1)", "Usually as <b>wasted thermal energy<\/b>, which cannot easily be used again (1)"], "cp": ["Energy is spread out into the surroundings", "Usually as wasted thermal energy, which cannot easily be used again"], "dp": ["Energy is destroyed", "Energy is stored in a battery", "Energy is turned into mass"], "mand": 0}, {"id": "PHY-01-024", "t": 1, "s": "4.1.2.1", "k": "Explain", "m": 2, "ht": false, "q": "What happens to the <b>wasted energy<\/b> from a machine?", "a": ["It is <b>dissipated<\/b> to the surroundings (1)", "Usually as <b>heat (thermal energy)<\/b> or sound (1)"], "cp": ["It is dissipated to the surroundings", "Usually as heat (thermal energy) or sound"], "dp": ["It is destroyed", "It is stored in the machine for ever", "It is turned into useful energy"], "mand": 0}, {"id": "PHY-01-025", "t": 1, "s": "4.1.2.1", "k": "Explain", "m": 3, "ht": false, "q": "A bulb transfers 100 J of electrical energy. 10 J is transferred as light. Where does the other energy go?", "a": ["<b>90 J<\/b> is wasted (1)", "Dissipated as <b>thermal energy<\/b> to the surroundings (1)", "Total energy output = <b>100 J<\/b>, so no energy is lost overall (1)"], "cp": ["90 J is wasted", "Dissipated as thermal energy to the surroundings", "Total energy output = 100 J, so no energy is lost overall"], "dp": ["90 J is destroyed", "The other 90 J is also light", "90 J is stored in the bulb as sound"], "mand": 0}, {"id": "PHY-01-026", "t": 1, "s": "4.1.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways to <b>reduce unwanted energy transfers<\/b> from a machine.", "a": ["Any three (1 each):", "• <b>lubrication<\/b> to reduce friction", "• <b>thermal insulation<\/b>", "• <b>streamlining<\/b> to reduce air resistance", "• use <b>better materials<\/b> that waste less"], "cp": ["lubrication to reduce friction", "thermal insulation", "streamlining to reduce air resistance", "use better materials that waste less"], "dp": ["Make the machine heavier", "Use a bigger motor", "Remove all moving parts"], "mand": 0}, {"id": "PHY-01-027", "t": 1, "s": "4.1.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>thermal conductivity<\/b> and <b>thickness<\/b> affect the rate of energy transfer through a wall.", "a": ["The <b>higher the thermal conductivity<\/b>, the <b>faster<\/b> the transfer (1)", "A <b>thicker wall<\/b> gives a <b>slower<\/b> transfer (1)", "So a wall with <b>low conductivity and thick<\/b> insulates best (1)"], "cp": ["The higher the thermal conductivity, the faster the transfer", "A thicker wall gives a slower transfer", "So a wall with low conductivity and thick insulates best"], "dp": ["Thick walls transfer energy faster", "Low conductivity gives faster transfer", "Thickness has no effect on energy transfer"], "mand": 0}, {"id": "PHY-01-028", "t": 1, "s": "4.1.2.1", "k": "Practical", "m": 4, "ht": false, "q": "<b>Required practical (Physics only):<\/b> Describe how to compare how well different materials <b>insulate<\/b>.", "a": ["Put <b>hot water<\/b> in a beaker wrapped in the material (1)", "Measure the <b>start temperature<\/b> and the temperature <b>every minute<\/b> (1)", "Keep other factors the same (<b>volume, start temperature, beaker<\/b>) (1)", "The material with the <b>smallest temperature drop<\/b> is the best insulator (1)"], "cp": ["Put hot water in a beaker wrapped in the material", "Measure the start temperature and the temperature every minute", "Keep other factors the same (volume, start temperature, beaker)", "The material with the smallest temperature drop is the best insulator"], "dp": ["Use different amounts of water for each material", "Only measure the final temperature once", "Use cold water and see which one boils first"], "mand": 0}, {"id": "PHY-01-029", "t": 1, "s": "4.1.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>efficiency<\/b>.", "a": ["efficiency = <b>useful output energy transfer ÷ total input energy transfer<\/b> (1)", "Also = <b>useful power out ÷ total power in<\/b> (1)"], "cp": ["efficiency = useful output energy transfer ÷ total input energy transfer", "Also = useful power out ÷ total power in"], "dp": ["efficiency = total input ÷ useful output", "efficiency = useful output × input", "efficiency = wasted energy ÷ input"], "mand": 0}, {"id": "PHY-01-030", "t": 1, "s": "4.1.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "A motor takes in 200 J and gives out 150 J of useful energy. Calculate the <b>efficiency<\/b> as a decimal.", "a": ["efficiency = useful output ÷ total input (1)", "= 150 ÷ 200 (1)", "= <b>0.75<\/b> (1)"], "cp": ["efficiency = useful output ÷ total input", "= 150 ÷ 200", "= 0.75"], "dp": ["1.33", "0.25", "50"], "mand": 0}, {"id": "PHY-01-031", "t": 1, "s": "4.1.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "A device is 40% efficient. It takes in 500 J. Calculate the <b>useful energy output<\/b>.", "a": ["0.40 × 500 (1)", "= <b>200 J<\/b> (1)", "The other 300 J is wasted (1)"], "cp": ["0.40 × 500", "= 200 J", "The other 300 J is wasted"], "dp": ["1250 J", "20 J", "460 J"], "mand": 0}, {"id": "PHY-01-032", "t": 1, "s": "4.1.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "A light bulb has a useful power output of 12 W and a total input of 60 W. Calculate the <b>percentage efficiency<\/b>.", "a": ["12 ÷ 60 (1)", "= 0.2 (1)", "= <b>20%<\/b> (1)"], "cp": ["12 ÷ 60", "= 0.2", "= 20%"], "dp": ["5%", "48%", "200%"], "mand": 0}, {"id": "PHY-01-033", "t": 1, "s": "4.1.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Can a machine be <b>100% efficient<\/b>? Explain.", "a": ["No, because some energy is <b>always wasted<\/b> (1)", "Usually as <b>thermal energy<\/b> due to friction or resistance (1)"], "cp": ["No, because some energy is always wasted", "Usually as thermal energy due to friction or resistance"], "dp": ["Yes, if the machine is well built", "Yes, when it uses renewable energy", "Yes, when it is made of metal"], "mand": 0}, {"id": "PHY-01-034", "t": 1, "s": "4.1.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> non-renewable energy resources.", "a": ["Any three (1 each):", "• <b>coal<\/b>", "• <b>oil<\/b>", "• <b>gas<\/b>", "• <b>nuclear fuel<\/b>"], "cp": ["coal", "oil", "gas", "nuclear fuel"], "dp": ["Wind, solar and tides", "Hydroelectric, wave and geothermal", "Biofuel, wood and solar"], "mand": 0}, {"id": "PHY-01-035", "t": 1, "s": "4.1.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> renewable energy resources.", "a": ["Any three (1 each):", "• <b>wind<\/b>", "• <b>solar<\/b>", "• <b>hydroelectric<\/b>", "• <b>tides<\/b>", "• <b>waves<\/b>"], "cp": ["wind", "solar", "hydroelectric", "tides", "waves"], "dp": ["Coal, oil and gas", "Coal, gas and nuclear", "Oil, nuclear and biofuel"], "mand": 0}, {"id": "PHY-01-036", "t": 1, "s": "4.1.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>renewable<\/b> energy resource?", "a": ["One that <b>can be replaced<\/b> as it is used (1)", "So it <b>will not run out<\/b> (1)"], "cp": ["One that can be replaced as it is used", "So it will not run out"], "dp": ["One that is cheap to use", "One that never makes electricity", "One that can only be used once"], "mand": 0}, {"id": "PHY-01-037", "t": 1, "s": "4.1.3", "k": "Compare", "m": 3, "ht": false, "q": "Give <b>one advantage<\/b> and <b>two disadvantages<\/b> of <b>wind power<\/b>.", "a": ["Advantage: <b>no carbon dioxide<\/b> and no fuel cost (1)", "Disadvantage: <b>unreliable<\/b>, depends on wind (1)", "Disadvantage: <b>visual and noise<\/b> impact (1)"], "cp": ["Advantage: no carbon dioxide and no fuel cost", "Disadvantage: unreliable, depends on wind", "Disadvantage: visual and noise impact"], "dp": ["Advantage: it works in all weather", "Disadvantage: it makes lots of carbon dioxide", "Disadvantage: it runs out quickly"], "mand": 0}, {"id": "PHY-01-038", "t": 1, "s": "4.1.3", "k": "Compare", "m": 2, "ht": false, "q": "Give <b>one advantage<\/b> and <b>one disadvantage<\/b> of <b>solar cells<\/b>.", "a": ["Advantage: <b>no pollution<\/b> while generating, or free energy source (1)", "Disadvantage: <b>no power at night<\/b> or in cloud (1)"], "cp": ["Advantage: no pollution while generating, or free energy source", "Disadvantage: no power at night or in cloud"], "dp": ["Advantage: they work at night", "Disadvantage: they use up fuel", "Disadvantage: they make carbon dioxide"], "mand": 0}, {"id": "PHY-01-039", "t": 1, "s": "4.1.3", "k": "Compare", "m": 2, "ht": false, "q": "Why is <b>coal<\/b> a problem for the environment?", "a": ["Burning it releases <b>carbon dioxide<\/b>, which adds to <b>global warming<\/b> (1)", "And <b>sulfur dioxide<\/b>, which causes <b>acid rain<\/b> (1)"], "cp": ["Burning it releases carbon dioxide, which adds to global warming", "And sulfur dioxide, which causes acid rain"], "dp": ["It makes the air cleaner", "It can be replaced easily", "It releases no gases"], "mand": 0}, {"id": "PHY-01-040", "t": 1, "s": "4.1.3", "k": "Evaluate", "m": 3, "ht": false, "q": "Why can some renewable resources <b>not<\/b> be used at any time to meet demand?", "a": ["Wind, solar and waves are <b>not constant<\/b> (1)", "They <b>depend on the weather<\/b> or time of day (1)", "So they need <b>backup<\/b> or storage to meet demand (1)"], "cp": ["Wind, solar and waves are not constant", "They depend on the weather or time of day", "So they need backup or storage to meet demand"], "dp": ["They only work when it is raining", "They run out after use", "They are always at the same level every day"], "mand": 0}, {"id": "PHY-01-041", "t": 1, "s": "4.1.3", "k": "Evaluate", "m": 2, "ht": false, "q": "Why is the use of <b>renewable energy resources<\/b> increasing in the UK?", "a": ["To <b>reduce carbon dioxide<\/b> emissions (1)", "Because <b>fossil fuels are running out<\/b> or government targets (1)"], "cp": ["To reduce carbon dioxide emissions", "Because fossil fuels are running out or government targets"], "dp": ["Because they are always cheaper to start", "Because they never need maintenance", "Because they work in all weather"], "mand": 0}, {"id": "PHY-01-042", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Name the <b>energy store<\/b> of a hot cup of tea and a stretched elastic band.", "a": ["Hot tea: <b>thermal<\/b> store (1)", "Stretched band: <b>elastic potential<\/b> store (1)"], "cp": ["Hot tea: thermal store", "Stretched band: elastic potential store"], "dp": ["Hot tea: kinetic", "Stretched band: thermal", "Hot tea: chemical only"], "mand": 0}, {"id": "PHY-01-043", "t": 1, "s": "4.1.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Describe the energy changes when a ball is <b>dropped<\/b>. (Ignore air resistance.)", "a": ["<b>Gravitational potential<\/b> store decreases (1)", "<b>Kinetic<\/b> store increases (1)"], "cp": ["Gravitational potential store decreases", "Kinetic store increases"], "dp": ["Kinetic store decreases", "Elastic store increases", "Thermal store decreases"], "mand": 0}, {"id": "PHY-01-044", "t": 1, "s": "4.1.1.4", "k": "Compare", "m": 2, "ht": false, "q": "Two motors lift the same weight to the same height. Motor A takes 4 s and motor B takes 8 s. Which has more <b>power<\/b>, and why?", "a": ["<b>Motor A<\/b> (1)", "It does the <b>same work in less time<\/b>, so a higher rate of transfer (1)"], "cp": ["Motor A", "It does the same work in less time, so a higher rate of transfer"], "dp": ["Motor B, because it takes longer", "They have the same power", "Motor B, because it uses more energy"], "mand": 0}, {"id": "PHY-01-045", "t": 1, "s": "4.1.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Why does a bouncing ball not return to its <b>original height<\/b>?", "a": ["Some energy is <b>transferred to the surroundings<\/b> as heat and sound (1)", "So less energy is left in the <b>kinetic<\/b> store after the bounce (1)", "So it cannot rise as high (1)"], "cp": ["Some energy is transferred to the surroundings as heat and sound", "So less energy is left in the kinetic store after the bounce", "So it cannot rise as high"], "dp": ["Energy is destroyed when the ball hits the ground", "The ball gains energy from the floor", "Gravity gets stronger as the ball bounces"], "mand": 0}, {"id": "PHY-01-046", "t": 1, "s": "4.1.3", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>main use of energy resources<\/b> in the UK? Give two.", "a": ["Any two (1 each):", "• <b>transport<\/b>", "• <b>heating<\/b>", "• <b>generating electricity<\/b>"], "cp": ["transport", "heating", "generating electricity"], "dp": ["Making water", "Making rocks", "Producing oxygen"], "mand": 0}, {"id": "PHY-01-H01", "t": 1, "s": "4.1.1.2", "k": "Calculation", "m": 3, "ht": true, "q": "A 4 kg object has 50 J of kinetic energy. Calculate its <b>speed<\/b>.", "a": ["50 = 0.5 × 4 × v<sup>2<\/sup>, so v<sup>2<\/sup> = 50 ÷ 2 = 25 (1)", "v = square root of 25 (1)", "= <b>5 m/s<\/b> (1)"], "cp": ["50 = 0.5 × 4 × v<sup>2<\/sup>, so v<sup>2<\/sup> = 50 ÷ 2 = 25", "v = square root of 25", "= 5 m/s"], "dp": ["25 m/s", "12.5 m/s", "2.5 m/s"], "mand": 0}, {"id": "PHY-01-H02", "t": 1, "s": "4.1.1.2", "k": "Calculation", "m": 3, "ht": true, "q": "A 60 kg climber gains 5880 J of gravitational potential energy. (g = 9.8 N/kg)<br/><br/>Calculate the <b>height<\/b> climbed.", "a": ["5880 = 60 × 9.8 × h (1)", "h = 5880 ÷ (60 × 9.8) = 5880 ÷ 588 (1)", "= <b>10 m<\/b> (1)"], "cp": ["5880 = 60 × 9.8 × h", "h = 5880 ÷ (60 × 9.8) = 5880 ÷ 588", "= 10 m"], "dp": ["100 m", "1 m", "0.1 m"], "mand": 0}, {"id": "PHY-01-H03", "t": 1, "s": "4.1.1.3", "k": "Calculation", "m": 4, "ht": true, "q": "0.5 kg of a metal needs 4000 J to heat it by 20 °C.<br/><br/>Calculate the <b>specific heat capacity<\/b> of the metal.", "a": ["ΔE = m c Δθ, so c = ΔE ÷ (m × Δθ) (1)", "= 4000 ÷ (0.5 × 20) (1)", "= 4000 ÷ 10 (1)", "= <b>400 J/kg °C<\/b> (1)"], "cp": ["ΔE = m c Δθ, so c = ΔE ÷ (m × Δθ)", "= 4000 ÷ (0.5 × 20)", "= 4000 ÷ 10", "= 400 J/kg °C"], "dp": ["40 000 J/kg °C", "800 J/kg °C", "200 J/kg °C"], "mand": 0}, {"id": "PHY-02-001", "t": 2, "s": "4.2.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the circuit components: (a) a <b>circle with a cross<\/b>, (b) a <b>rectangle<\/b>, (c) a <b>circle with an A<\/b> inside.", "a": ["(a) <b>lamp<\/b> (1)", "(b) <b>fixed resistor<\/b> (1)", "(c) <b>ammeter<\/b> (1)"], "cp": ["(a) lamp", "(b) fixed resistor", "(c) ammeter"], "dp": ["(a) voltmeter, (b) switch, (c) cell", "(a) cell, (b) lamp, (c) fuse", "(a) fuse, (b) ammeter, (c) thermistor"], "mand": 0}, {"id": "PHY-02-002", "t": 2, "s": "4.2.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What does a <b>voltmeter<\/b> measure and how is it connected?", "a": ["It measures <b>potential difference (voltage)<\/b> (1)", "Connected in <b>parallel<\/b> across the component (1)"], "cp": ["It measures potential difference (voltage)", "Connected in parallel across the component"], "dp": ["It measures current and is in series", "It measures resistance and is in series", "It measures power and is in parallel"], "mand": 0}, {"id": "PHY-02-003", "t": 2, "s": "4.2.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What does an <b>ammeter<\/b> measure and how is it connected?", "a": ["It measures <b>current<\/b> (1)", "Connected in <b>series<\/b> with the component (1)"], "cp": ["It measures current", "Connected in series with the component"], "dp": ["It measures voltage and is in parallel", "It measures charge and is in parallel", "It measures resistance and is in series"], "mand": 0}, {"id": "PHY-02-004", "t": 2, "s": "4.2.1.2", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>electric current<\/b>?", "a": ["The <b>rate of flow of charge<\/b> (1)", "Measured in <b>amperes (A)<\/b> (1)"], "cp": ["The rate of flow of charge", "Measured in amperes (A)"], "dp": ["The push that makes charge move", "The energy in each coulomb of charge", "The opposition to the flow of charge"], "mand": 0}, {"id": "PHY-02-005", "t": 2, "s": "4.2.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking <b>charge<\/b>, current and time. Give the units.", "a": ["charge = <b>current × time<\/b> (Q = I t) (1)", "Charge in <b>coulombs (C)<\/b>, current in <b>amps<\/b>, time in <b>seconds<\/b> (1)"], "cp": ["charge = current × time (Q = I t)", "Charge in coulombs (C), current in amps, time in seconds"], "dp": ["charge = current ÷ time", "charge = voltage × time", "charge = current × voltage"], "mand": 0}, {"id": "PHY-02-006", "t": 2, "s": "4.2.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "A current of 3 A flows for 20 seconds.<br/><br/>Calculate the <b>charge<\/b> that flows.", "a": ["Q = I t (1)", "= 3 × 20 (1)", "= <b>60 C<\/b> (1)"], "cp": ["Q = I t", "= 3 × 20", "= 60 C"], "dp": ["6.7 C", "0.15 C", "23 C"], "mand": 0}, {"id": "PHY-02-007", "t": 2, "s": "4.2.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "120 C of charge flows past a point in 40 seconds. Calculate the <b>current<\/b>.", "a": ["I = Q ÷ t (1)", "= 120 ÷ 40 (1)", "= <b>3 A<\/b> (1)"], "cp": ["I = Q ÷ t", "= 120 ÷ 40", "= 3 A"], "dp": ["4800 A", "0.33 A", "80 A"], "mand": 0}, {"id": "PHY-02-008", "t": 2, "s": "4.2.1.2", "k": "Recall", "m": 2, "ht": false, "q": "In a <b>series circuit<\/b>, what is the current like at different points?", "a": ["The current is the <b>same<\/b> (1)", "at <b>every point<\/b> in the circuit (1)"], "cp": ["The current is the same", "at every point in the circuit"], "dp": ["It decreases after each component", "It is bigger near the cell", "It is different in each component"], "mand": 0}, {"id": "PHY-02-009", "t": 2, "s": "4.2.1.3", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation linking <b>potential difference<\/b>, current and resistance.", "a": ["potential difference = <b>current × resistance<\/b> (1)", "V = I R, with V in <b>volts<\/b>, I in <b>amps<\/b>, R in <b>ohms (Ω)<\/b> (1)"], "cp": ["potential difference = current × resistance", "V = I R, with V in volts, I in amps, R in ohms (Ω)"], "dp": ["V = I ÷ R", "V = R ÷ I", "V = I × R × t"], "mand": 0}, {"id": "PHY-02-010", "t": 2, "s": "4.2.1.3", "k": "Calculation", "m": 3, "ht": false, "q": "A 12 Ω resistor has a current of 0.5 A through it.<br/><br/>Calculate the <b>potential difference<\/b> across it.", "a": ["V = I R (1)", "= 0.5 × 12 (1)", "= <b>6 V<\/b> (1)"], "cp": ["V = I R", "= 0.5 × 12", "= 6 V"], "dp": ["24 V", "0.04 V", "12.5 V"], "mand": 0}, {"id": "PHY-02-011", "t": 2, "s": "4.2.1.3", "k": "Calculation", "m": 3, "ht": false, "q": "A 6 V cell is connected to a resistor. The current is 2 A. Calculate the <b>resistance<\/b>.", "a": ["R = V ÷ I (1)", "= 6 ÷ 2 (1)", "= <b>3 Ω<\/b> (1)"], "cp": ["R = V ÷ I", "= 6 ÷ 2", "= 3 Ω"], "dp": ["12 Ω", "0.33 Ω", "8 Ω"], "mand": 0}, {"id": "PHY-02-012", "t": 2, "s": "4.2.1.3", "k": "Calculation", "m": 3, "ht": false, "q": "A resistor of 20 Ω has 5 V across it. Calculate the <b>current<\/b>.", "a": ["I = V ÷ R (1)", "= 5 ÷ 20 (1)", "= <b>0.25 A<\/b> (1)"], "cp": ["I = V ÷ R", "= 5 ÷ 20", "= 0.25 A"], "dp": ["100 A", "4 A", "25 A"], "mand": 0}, {"id": "PHY-02-013", "t": 2, "s": "4.2.1.3", "k": "Definition", "m": 2, "ht": false, "q": "What is meant by <b>potential difference<\/b>?", "a": ["The <b>energy transferred<\/b> per unit of <b>charge<\/b> (1)", "Measured in <b>volts<\/b> (1 V = 1 joule per coulomb) (1)"], "cp": ["The energy transferred per unit of charge", "Measured in volts (1 V = 1 joule per coulomb)"], "dp": ["The rate of flow of charge", "The opposition to flow of charge", "The total charge in a circuit"], "mand": 0}, {"id": "PHY-02-014", "t": 2, "s": "4.2.1.3", "k": "Explain", "m": 2, "ht": false, "q": "What happens to the <b>current<\/b> if the <b>resistance<\/b> of a circuit increases and the potential difference stays the same?", "a": ["The current <b>decreases<\/b> (1)", "Because current = voltage ÷ resistance, so they are <b>inversely related<\/b> (1)"], "cp": ["The current decreases", "Because current = voltage ÷ resistance, so they are inversely related"], "dp": ["The current increases", "The current does not change", "The voltage must also go up"], "mand": 0}, {"id": "PHY-02-015", "t": 2, "s": "4.2.1.4", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical:<\/b> Describe how to investigate how the <b>length of a wire<\/b> affects its resistance.", "a": ["Set up a circuit with a cell, ammeter, wire and <b>voltmeter in parallel<\/b> (1)", "Use a <b>crocodile clip<\/b> to change the wire length (1)", "Record <b>current<\/b> and <b>p.d.<\/b> for each length (1)", "Calculate <b>R = V ÷ I<\/b> (1)", "Plot <b>resistance against length<\/b> (1)"], "cp": ["Set up a circuit with a cell, ammeter, wire and voltmeter in parallel", "Use a crocodile clip to change the wire length", "Record current and p.d. for each length", "Calculate R = V ÷ I", "Plot resistance against length"], "dp": ["Measure the mass of the wire and heat it", "Change the thickness of the wire only", "Use a voltmeter in series"], "mand": 0}, {"id": "PHY-02-016", "t": 2, "s": "4.2.1.4", "k": "Explain", "m": 2, "ht": false, "q": "In the resistance practical, why should the current be <b>switched off between readings<\/b>?", "a": ["A current <b>heats the wire<\/b> (1)", "and a <b>hotter wire has more resistance<\/b>, which would affect the result (1)"], "cp": ["A current heats the wire", "and a hotter wire has more resistance, which would affect the result"], "dp": ["To save the cell from running out only", "Switching off makes the wire longer", "It has no effect on the result"], "mand": 0}, {"id": "PHY-02-017", "t": 2, "s": "4.2.1.4", "k": "Recall", "m": 2, "ht": false, "q": "How does the <b>resistance of a wire<\/b> change with length? Explain briefly.", "a": ["<b>Longer wire<\/b> means <b>higher resistance<\/b> (1)", "Because the <b>charge carriers collide<\/b> more with the metal ions over a longer wire (1)"], "cp": ["Longer wire means higher resistance", "Because the charge carriers collide more with the metal ions over a longer wire"], "dp": ["Longer wire has lower resistance", "Length has no effect on resistance", "Shorter wire has more resistance"], "mand": 0}, {"id": "PHY-02-018", "t": 2, "s": "4.2.1.4", "k": "Data", "m": 3, "ht": false, "q": "Describe the <b>current-potential difference graph<\/b> of a <b>fixed resistor<\/b> at constant temperature.", "a": ["A <b>straight line<\/b> through the origin (1)", "Current is <b>directly proportional<\/b> to p.d. (1)", "The <b>resistance is constant<\/b> (1)"], "cp": ["A straight line through the origin", "Current is directly proportional to p.d", "The resistance is constant"], "dp": ["A curve that levels off", "A line that bends upward", "A horizontal line"], "mand": 0}, {"id": "PHY-02-019", "t": 2, "s": "4.2.1.4", "k": "Data", "m": 3, "ht": false, "q": "Describe the I-V graph of a <b>filament lamp<\/b> and explain its shape.", "a": ["The graph is a <b>curve<\/b> that gets less steep (1)", "As current rises, the filament <b>gets hotter<\/b> (1)", "So <b>resistance increases<\/b> (1)"], "cp": ["The graph is a curve that gets less steep", "As current rises, the filament gets hotter", "So resistance increases"], "dp": ["A straight line through the origin", "The curve gets steeper as the lamp heats up", "The resistance decreases as it gets hotter"], "mand": 0}, {"id": "PHY-02-020", "t": 2, "s": "4.2.1.4", "k": "Data", "m": 3, "ht": false, "q": "Describe the I-V graph of a <b>diode<\/b>.", "a": ["In <b>one direction<\/b> (forward) current flows easily and then increases quickly (1)", "In the <b>reverse direction<\/b> the current is almost <b>zero<\/b> (1)", "So the <b>resistance is very high<\/b> in reverse (1)"], "cp": ["In one direction (forward) current flows easily and then increases quickly", "In the reverse direction the current is almost zero", "So the resistance is very high in reverse"], "dp": ["Current flows equally in both directions", "A straight line through the origin", "Current is always zero"], "mand": 0}, {"id": "PHY-02-021", "t": 2, "s": "4.2.1.4", "k": "Recall", "m": 2, "ht": false, "q": "How does the resistance of a <b>thermistor<\/b> change with temperature?", "a": ["As temperature <b>increases<\/b>, resistance <b>decreases<\/b> (1)", "Used in <b>temperature sensors<\/b>, for example thermostats (1)"], "cp": ["As temperature increases, resistance decreases", "Used in temperature sensors, for example thermostats"], "dp": ["As temperature increases, resistance increases", "Resistance does not change", "Resistance only changes in the dark"], "mand": 0}, {"id": "PHY-02-022", "t": 2, "s": "4.2.1.4", "k": "Recall", "m": 2, "ht": false, "q": "How does the resistance of an <b>LDR<\/b> change with light?", "a": ["As light intensity <b>increases<\/b>, resistance <b>decreases<\/b> (1)", "Used in <b>automatic lights<\/b> or light sensors (1)"], "cp": ["As light intensity increases, resistance decreases", "Used in automatic lights or light sensors"], "dp": ["As light increases, resistance increases", "Resistance does not change with light", "Resistance only changes with temperature"], "mand": 0}, {"id": "PHY-02-023", "t": 2, "s": "4.2.1.4", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical:<\/b> Describe how to find the <b>I-V characteristic<\/b> of a component.", "a": ["Set up the component with an <b>ammeter in series<\/b> and <b>voltmeter in parallel<\/b> (1)", "Add a <b>variable resistor<\/b> (1)", "Change the p.d. and record <b>current and p.d.<\/b> (1)", "<b>Reverse the connections<\/b> for negative values (1)", "Plot <b>current against p.d.<\/b> (1)"], "cp": ["Set up the component with an ammeter in series and voltmeter in parallel", "Add a variable resistor", "Change the p.d. and record current and p.d", "Reverse the connections for negative values", "Plot current against p.d"], "dp": ["Measure only the voltage once", "Put the voltmeter in series with the component", "Heat the component with a Bunsen burner"], "mand": 0}, {"id": "PHY-02-024", "t": 2, "s": "4.2.2", "k": "Recall", "m": 3, "ht": false, "q": "In a <b>series circuit<\/b>, what happens to <b>current<\/b>, <b>potential difference<\/b> and <b>resistance<\/b>?", "a": ["Current is the <b>same<\/b> everywhere (1)", "Potential difference is <b>shared<\/b> between components (1)", "Total resistance = <b>sum<\/b> of the resistances (1)"], "cp": ["Current is the same everywhere", "Potential difference is shared between components", "Total resistance = sum of the resistances"], "dp": ["Current is shared, voltage is the same", "Resistances are not added", "Voltage is the same across each component"], "mand": 0}, {"id": "PHY-02-025", "t": 2, "s": "4.2.2", "k": "Recall", "m": 3, "ht": false, "q": "In a <b>parallel circuit<\/b>, what happens to <b>current<\/b>, <b>potential difference<\/b> and <b>resistance<\/b>?", "a": ["Current is <b>shared<\/b> between branches (1)", "Potential difference is the <b>same<\/b> across each branch (1)", "Total resistance is <b>less than<\/b> the smallest branch (1)"], "cp": ["Current is shared between branches", "Potential difference is the same across each branch", "Total resistance is less than the smallest branch"], "dp": ["Current is the same in each branch", "Total resistance is the sum", "Voltage is shared between the branches"], "mand": 0}, {"id": "PHY-02-026", "t": 2, "s": "4.2.2", "k": "Calculation", "m": 2, "ht": false, "q": "Two resistors of 4 Ω and 6 Ω are in <b>series<\/b>. Calculate the <b>total resistance<\/b>.", "a": ["R<sub>total<\/sub> = R<sub>1<\/sub> + R<sub>2<\/sub> (1)", "= 4 + 6 = <b>10 Ω<\/b> (1)"], "cp": ["R<sub>total<\/sub> = R<sub>1<\/sub> + R<sub>2<\/sub>", "= 4 + 6 = 10 Ω"], "dp": ["24 Ω", "2.4 Ω", "5 Ω"], "mand": 0}, {"id": "PHY-02-027", "t": 2, "s": "4.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 6 V battery is connected to two resistors in series, 4 Ω and 2 Ω.<br/><br/>Calculate the <b>current<\/b>.", "a": ["Total resistance = 4 + 2 = 6 Ω (1)", "I = V ÷ R = 6 ÷ 6 (1)", "= <b>1 A<\/b> (1)"], "cp": ["Total resistance = 4 + 2 = 6 Ω", "I = V ÷ R = 6 ÷ 6", "= 1 A"], "dp": ["1.5 A", "3 A", "0.5 A"], "mand": 0}, {"id": "PHY-02-028", "t": 2, "s": "4.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 12 V cell is connected to a 4 Ω and a 2 Ω resistor in <b>series<\/b>. Calculate the p.d. across the <b>4 Ω resistor<\/b>.", "a": ["Total R = 6 Ω, so I = 12 ÷ 6 = 2 A (1)", "V = I R = 2 × 4 (1)", "= <b>8 V<\/b> (1)"], "cp": ["Total R = 6 Ω, so I = 12 ÷ 6 = 2 A", "V = I R = 2 × 4", "= 8 V"], "dp": ["4 V", "6 V", "12 V"], "mand": 0}, {"id": "PHY-02-029", "t": 2, "s": "4.2.2", "k": "Explain", "m": 2, "ht": false, "q": "What happens to the <b>total resistance<\/b> when you add more resistors in <b>parallel<\/b>? Explain.", "a": ["The total resistance <b>decreases<\/b> (1)", "There are <b>more paths<\/b> for the current, so more current flows overall (1)"], "cp": ["The total resistance decreases", "There are more paths for the current, so more current flows overall"], "dp": ["The total resistance increases", "It stays the same", "It doubles every time"], "mand": 0}, {"id": "PHY-02-030", "t": 2, "s": "4.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Why are <b>household lights<\/b> wired in <b>parallel<\/b> and not in series?", "a": ["Each lamp gets the <b>full mains voltage<\/b> (1)", "Each lamp can be <b>switched on and off separately<\/b> (1)", "If one lamp <b>breaks<\/b>, the others <b>still work<\/b> (1)"], "cp": ["Each lamp gets the full mains voltage", "Each lamp can be switched on and off separately", "If one lamp breaks, the others still work"], "dp": ["They would be brighter in series", "Parallel circuits use less electricity", "A series circuit has more current"], "mand": 0}, {"id": "PHY-02-031", "t": 2, "s": "4.2.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 12 V cell is connected across two identical resistors in parallel. The current in each is 2 A. Find the <b>total current<\/b> from the cell.", "a": ["Current is shared between the branches, so add them (1)", "2 + 2 (1)", "= <b>4 A<\/b> (1)"], "cp": ["Current is shared between the branches, so add them", "2 + 2", "= 4 A"], "dp": ["2 A", "1 A", "8 A"], "mand": 0}, {"id": "PHY-02-032", "t": 2, "s": "4.2.3.1", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between <b>direct current (dc)<\/b> and <b>alternating current (ac)<\/b>?", "a": ["dc flows in <b>one direction only<\/b> (1)", "ac <b>keeps changing direction<\/b> (reverses) (1)"], "cp": ["dc flows in one direction only", "ac keeps changing direction (reverses)"], "dp": ["dc keeps changing direction", "ac only flows from a battery", "There is no difference"], "mand": 0}, {"id": "PHY-02-033", "t": 2, "s": "4.2.3.1", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>frequency<\/b> and <b>potential difference<\/b> of UK mains electricity?", "a": ["Frequency: <b>50 Hz<\/b> (1)", "Potential difference: <b>230 V<\/b> (1)"], "cp": ["Frequency: 50 Hz", "Potential difference: 230 V"], "dp": ["Frequency: 230 Hz and 50 V", "Frequency: 12 Hz and 230 V", "Frequency: 100 Hz and 110 V"], "mand": 0}, {"id": "PHY-02-034", "t": 2, "s": "4.2.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three wires<\/b> in a mains plug and give their colours.", "a": ["<b>Live<\/b> = brown (1)", "<b>Neutral<\/b> = blue (1)", "<b>Earth<\/b> = green and yellow stripes (1)"], "cp": ["Live = brown", "Neutral = blue", "Earth = green and yellow stripes"], "dp": ["Live = blue, neutral = brown, earth = red", "Live = green, neutral = blue, earth = brown", "Live = red, neutral = black, earth = yellow"], "mand": 0}, {"id": "PHY-02-035", "t": 2, "s": "4.2.3.2", "k": "Explain", "m": 3, "ht": false, "q": "What are the <b>jobs<\/b> of the live, neutral and earth wires?", "a": ["<b>Live<\/b> carries the alternating p.d. (about 230 V) to the appliance (1)", "<b>Neutral<\/b> completes the circuit, near 0 V (1)", "<b>Earth<\/b> is a safety wire that stops the casing becoming live (1)"], "cp": ["Live carries the alternating p.d. (about 230 V) to the appliance", "Neutral completes the circuit, near 0 V", "Earth is a safety wire that stops the casing becoming live"], "dp": ["Earth carries the 230 V", "Neutral carries the 230 V", "Live is only used for safety"], "mand": 0}, {"id": "PHY-02-036", "t": 2, "s": "4.2.3.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>earth wire and fuse<\/b> protect a user if a live wire touches the metal casing.", "a": ["Current flows through the <b>earth wire<\/b> (low resistance) (1)", "A <b>large current<\/b> flows (1)", "The <b>fuse melts<\/b> and breaks the circuit, so the casing is not live (1)"], "cp": ["Current flows through the earth wire (low resistance)", "A large current flows", "The fuse melts and breaks the circuit, so the casing is not live"], "dp": ["The earth wire raises the voltage of the casing", "The fuse blows only if the appliance is switched off", "The neutral wire melts and protects the user"], "mand": 0}, {"id": "PHY-02-037", "t": 2, "s": "4.2.3.2", "k": "Explain", "m": 2, "ht": false, "q": "Why is it <b>dangerous<\/b> to touch a live wire even when the appliance is switched off?", "a": ["The live wire is at <b>about 230 V<\/b> (1)", "A <b>current can flow through you<\/b> to the earth, which can cause electric shock or death (1)"], "cp": ["The live wire is at about 230 V", "A current can flow through you to the earth, which can cause electric shock or death"], "dp": ["The neutral wire carries the voltage instead", "A live wire is at 0 V", "There is no current in a live wire"], "mand": 0}, {"id": "PHY-02-038", "t": 2, "s": "4.2.4.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the <b>two equations<\/b> for electrical power.", "a": ["P = <b>V × I<\/b> (power = potential difference × current) (1)", "P = <b>I<sup>2<\/sup> × R<\/b> (power = current squared × resistance) (1)"], "cp": ["P = V × I (power = potential difference × current)", "P = I<sup>2<\/sup> × R (power = current squared × resistance)"], "dp": ["P = V ÷ I", "P = I ÷ R", "P = I × R"], "mand": 0}, {"id": "PHY-02-039", "t": 2, "s": "4.2.4.1", "k": "Calculation", "m": 3, "ht": false, "q": "A kettle works from 230 V and has a current of 10 A.<br/><br/>Calculate its <b>power<\/b>.", "a": ["P = V I (1)", "= 230 × 10 (1)", "= <b>2300 W<\/b> (1)"], "cp": ["P = V I", "= 230 × 10", "= 2300 W"], "dp": ["23 W", "240 W", "220 W"], "mand": 0}, {"id": "PHY-02-040", "t": 2, "s": "4.2.4.1", "k": "Calculation", "m": 3, "ht": false, "q": "A 5 Ω resistor has a current of 2 A through it.<br/><br/>Calculate the <b>power<\/b> dissipated.", "a": ["P = I<sup>2<\/sup> R (1)", "= 2<sup>2<\/sup> × 5 = 4 × 5 (1)", "= <b>20 W<\/b> (1)"], "cp": ["P = I<sup>2<\/sup> R", "= 2<sup>2<\/sup> × 5 = 4 × 5", "= 20 W"], "dp": ["50 W", "10 W", "100 W"], "mand": 0}, {"id": "PHY-02-041", "t": 2, "s": "4.2.4.1", "k": "Explain", "m": 2, "ht": false, "q": "Why does a wire get <b>hot<\/b> when a current flows through it?", "a": ["Electrons <b>collide with ions<\/b> in the wire (1)", "Energy is transferred to the <b>thermal store<\/b> of the wire (1)"], "cp": ["Electrons collide with ions in the wire", "Energy is transferred to the thermal store of the wire"], "dp": ["The electrons are heated by the cell", "The ions create a magnetic field", "Electrons are destroyed in the wire"], "mand": 0}, {"id": "PHY-02-042", "t": 2, "s": "4.2.4.1", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>one advantage<\/b> and <b>one disadvantage<\/b> of the heating effect of a current.", "a": ["Advantage: used in <b>heaters, toasters, kettles<\/b> (1)", "Disadvantage: <b>wasted energy<\/b> as heat in circuits and wires (1)"], "cp": ["Advantage: used in heaters, toasters, kettles", "Disadvantage: wasted energy as heat in circuits and wires"], "dp": ["Advantage: it makes devices more efficient", "Disadvantage: it makes the voltage smaller", "Advantage: it cools wires down"], "mand": 0}, {"id": "PHY-02-043", "t": 2, "s": "4.2.4.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the equations for <b>energy transferred<\/b> by an appliance.", "a": ["E = <b>P × t<\/b> (energy = power × time) (1)", "E = <b>Q × V<\/b> (energy = charge × potential difference) (1)"], "cp": ["E = P × t (energy = power × time)", "E = Q × V (energy = charge × potential difference)"], "dp": ["E = P ÷ t", "E = I × R", "E = V ÷ Q"], "mand": 0}, {"id": "PHY-02-044", "t": 2, "s": "4.2.4.2", "k": "Calculation", "m": 3, "ht": false, "q": "A 1500 W heater is on for 2 minutes. Calculate the <b>energy<\/b> transferred.", "a": ["2 minutes = 120 s (1)", "E = P t = 1500 × 120 (1)", "= <b>180 000 J<\/b> (1)"], "cp": ["2 minutes = 120 s", "E = P t = 1500 × 120", "= 180 000 J"], "dp": ["3000 J", "750 J", "12.5 J"], "mand": 0}, {"id": "PHY-02-045", "t": 2, "s": "4.2.4.2", "k": "Calculation", "m": 3, "ht": false, "q": "20 C of charge passes through a lamp with a p.d. of 6 V across it.<br/><br/>Calculate the <b>energy transferred<\/b>.", "a": ["E = Q V (1)", "= 20 × 6 (1)", "= <b>120 J<\/b> (1)"], "cp": ["E = Q V", "= 20 × 6", "= 120 J"], "dp": ["3.3 J", "26 J", "14 J"], "mand": 0}, {"id": "PHY-02-046", "t": 2, "s": "4.2.4.3", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>main parts<\/b> of the National Grid?", "a": ["<b>Power stations<\/b> generate the electricity (1)", "<b>Step-up transformers<\/b>, <b>pylons and cables<\/b> carry it at high voltage (1)", "<b>Step-down transformers<\/b> reduce the voltage for homes (1)"], "cp": ["Power stations generate the electricity", "Step-up transformers, pylons and cables carry it at high voltage", "Step-down transformers reduce the voltage for homes"], "dp": ["Wind turbines only", "Step-down transformer at the power station, step-up near homes", "Batteries and capacitors"], "mand": 0}, {"id": "PHY-02-047", "t": 2, "s": "4.2.4.3", "k": "Explain", "m": 3, "ht": false, "q": "Why is electricity transmitted at <b>high voltage<\/b> and <b>low current<\/b>?", "a": ["A low current <b>reduces energy losses<\/b> as heat in the cables (1)", "Power = V × I, so <b>high voltage<\/b> keeps the same power with a low current (1)", "This makes the <b>National Grid efficient<\/b> (1)"], "cp": ["A low current reduces energy losses as heat in the cables", "Power = V × I, so high voltage keeps the same power with a low current", "This makes the National Grid efficient"], "dp": ["A higher current makes cables cooler", "High voltage reduces the power", "High current is safer to use in homes"], "mand": 0}, {"id": "PHY-02-048", "t": 2, "s": "4.2.4.3", "k": "Explain", "m": 2, "ht": false, "q": "What do <b>step-up<\/b> and <b>step-down transformers<\/b> do in the National Grid?", "a": ["<b>Step-up<\/b> increases the voltage for transmission (1)", "<b>Step-down<\/b> decreases the voltage for safe use in homes (1)"], "cp": ["Step-up increases the voltage for transmission", "Step-down decreases the voltage for safe use in homes"], "dp": ["Step-up reduces the voltage", "Step-down increases the current to dangerous levels", "They change ac to dc"], "mand": 0}, {"id": "PHY-02-049", "t": 2, "s": "4.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>plastic rod<\/b> becomes charged when rubbed with a cloth.", "a": ["<b>Electrons<\/b> move from one material to the other (1)", "The material that gains electrons becomes <b>negatively charged<\/b> (1)", "The one that loses them becomes <b>positively charged<\/b> (1)"], "cp": ["Electrons move from one material to the other", "The material that gains electrons becomes negatively charged", "The one that loses them becomes positively charged"], "dp": ["Protons move from the cloth to the rod", "Both objects become positive", "Electrons are created by friction"], "mand": 0}, {"id": "PHY-02-050", "t": 2, "s": "4.2.5", "k": "Recall", "m": 2, "ht": false, "q": "What happens when two objects with the <b>same charge<\/b> and two objects with <b>different charges<\/b> are brought together?", "a": ["Same charges <b>repel<\/b> (1)", "Different charges <b>attract<\/b> (1)"], "cp": ["Same charges repel", "Different charges attract"], "dp": ["Same charges attract", "Different charges repel", "Neither has a force"], "mand": 0}, {"id": "PHY-02-051", "t": 2, "s": "4.2.5", "k": "Explain", "m": 2, "ht": false, "q": "Why can a charged balloon <b>stick to a wall<\/b>?", "a": ["The balloon <b>induces an opposite charge<\/b> on the wall surface (1)", "Opposite charges <b>attract<\/b> (1)"], "cp": ["The balloon induces an opposite charge on the wall surface", "Opposite charges attract"], "dp": ["The balloon makes the wall magnetic", "Gravity pulls it to the wall", "Same charges attract"], "mand": 0}, {"id": "PHY-02-052", "t": 2, "s": "4.2.5", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>electric field<\/b>?", "a": ["The <b>region around a charged object<\/b> (1)", "Where another charged object feels a <b>force<\/b> (1)"], "cp": ["The region around a charged object", "Where another charged object feels a force"], "dp": ["A magnetic region with only north poles", "The current in a wire", "A place where electrons are made"], "mand": 0}, {"id": "PHY-02-053", "t": 2, "s": "4.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Why are <b>static sparks<\/b> dangerous when refuelling a car, and how is the risk reduced?", "a": ["Friction builds up <b>static charge<\/b> which can create a <b>spark<\/b> (1)", "A spark could ignite the <b>fuel vapour<\/b> (1)", "The hose and car are <b>earthed<\/b> so charge flows safely away (1)"], "cp": ["Friction builds up static charge which can create a spark", "A spark could ignite the fuel vapour", "The hose and car are earthed so charge flows safely away"], "dp": ["Petrol conducts electricity and gives shocks", "Static sparks make the car move", "Earthing adds extra charge to the car"], "mand": 0}, {"id": "PHY-02-054", "t": 2, "s": "4.2.4.1", "k": "Calculation", "m": 3, "ht": false, "q": "A 230 V appliance has a power of 920 W. Calculate the <b>current<\/b>.", "a": ["I = P ÷ V (1)", "= 920 ÷ 230 (1)", "= <b>4 A<\/b> (1)"], "cp": ["I = P ÷ V", "= 920 ÷ 230", "= 4 A"], "dp": ["211 600 A", "0.25 A", "1150 A"], "mand": 0}, {"id": "PHY-02-055", "t": 2, "s": "4.2.4.1", "k": "Explain", "m": 2, "ht": false, "q": "A 13 A fuse is in a plug. An appliance takes 3 A. Which fuse should be used: 3 A, 5 A or 13 A? Explain.", "a": ["<b>5 A<\/b> (1)", "The fuse rating should be <b>just above the normal current<\/b> so it blows if there is a fault (1)"], "cp": ["5 A", "The fuse rating should be just above the normal current so it blows if there is a fault"], "dp": ["3 A, because it matches exactly", "13 A, because it is the safest", "Any fuse will work the same"], "mand": 0}, {"id": "PHY-03-001", "t": 3, "s": "4.3.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>density<\/b>. Give the usual units.", "a": ["density = <b>mass ÷ volume<\/b> (ρ = m ÷ V) (1)", "Units: <b>kg/m<sup>3<\/sup><\/b> (or g/cm<sup>3<\/sup>) (1)"], "cp": ["density = mass ÷ volume (ρ = m ÷ V)", "Units: kg/m<sup>3<\/sup> (or g/cm<sup>3<\/sup>)"], "dp": ["density = volume ÷ mass", "density = mass × volume", "density = weight ÷ area"], "mand": 0}, {"id": "PHY-03-002", "t": 3, "s": "4.3.1.1", "k": "Calculation", "m": 3, "ht": false, "q": "A block has a mass of 600 g and a volume of 200 cm<sup>3<\/sup>.<br/><br/>Calculate its <b>density<\/b> in g/cm<sup>3<\/sup>.", "a": ["ρ = m ÷ V (1)", "= 600 ÷ 200 (1)", "= <b>3 g/cm<sup>3<\/sup><\/b> (1)"], "cp": ["ρ = m ÷ V", "= 600 ÷ 200", "= 3 g/cm<sup>3<\/sup>"], "dp": ["0.33 g/cm<sup>3<\/sup>", "120 000 g/cm<sup>3<\/sup>", "400 g/cm<sup>3<\/sup>"], "mand": 0}, {"id": "PHY-03-003", "t": 3, "s": "4.3.1.1", "k": "Calculation", "m": 3, "ht": false, "q": "A metal has a density of 8000 kg/m<sup>3<\/sup>. Calculate the <b>mass<\/b> of 0.5 m<sup>3<\/sup> of it.", "a": ["mass = density × volume (1)", "= 8000 × 0.5 (1)", "= <b>4000 kg<\/b> (1)"], "cp": ["mass = density × volume", "= 8000 × 0.5", "= 4000 kg"], "dp": ["16 000 kg", "0.00006 kg", "8000.5 kg"], "mand": 0}, {"id": "PHY-03-004", "t": 3, "s": "4.3.1.1", "k": "Calculation", "m": 3, "ht": false, "q": "A liquid has a density of 1000 kg/m<sup>3<\/sup>. Calculate the <b>volume<\/b> of 250 kg of it.", "a": ["volume = mass ÷ density (1)", "= 250 ÷ 1000 (1)", "= <b>0.25 m<sup>3<\/sup><\/b> (1)"], "cp": ["volume = mass ÷ density", "= 250 ÷ 1000", "= 0.25 m<sup>3<\/sup>"], "dp": ["4 m<sup>3<\/sup>", "250 000 m<sup>3<\/sup>", "1250 m<sup>3<\/sup>"], "mand": 0}, {"id": "PHY-03-005", "t": 3, "s": "4.3.1.1", "k": "Practical", "m": 5, "ht": false, "q": "<b>Required practical:<\/b> Describe how to find the <b>density of an irregular solid<\/b>.", "a": ["Measure the <b>mass<\/b> on a balance (1)", "Fill a <b>eureka (displacement) can<\/b> with water to the spout (1)", "Lower the object in and <b>collect the displaced water<\/b> in a measuring cylinder (1)", "The <b>volume of water<\/b> = volume of the object (1)", "Calculate <b>density = mass ÷ volume<\/b> (1)"], "cp": ["Measure the mass on a balance", "Fill a eureka (displacement) can with water to the spout", "Lower the object in and collect the displaced water in a measuring cylinder", "The volume of water = volume of the object", "Calculate density = mass ÷ volume"], "dp": ["Measure the length of each side with a ruler", "Weigh the object in air only", "Measure the temperature of the water"], "mand": 0}, {"id": "PHY-03-006", "t": 3, "s": "4.3.1.1", "k": "Practical", "m": 3, "ht": false, "q": "<b>Required practical:<\/b> Describe how to find the <b>density of a regular solid<\/b> (for example a cuboid).", "a": ["Measure the <b>mass<\/b> using a balance (1)", "Measure <b>length, width and height<\/b> with a ruler and calculate the volume (1)", "Calculate <b>density = mass ÷ volume<\/b> (1)"], "cp": ["Measure the mass using a balance", "Measure length, width and height with a ruler and calculate the volume", "Calculate density = mass ÷ volume"], "dp": ["Use a displacement can for every solid", "Measure only the height and mass", "Measure the surface area only"], "mand": 0}, {"id": "PHY-03-007", "t": 3, "s": "4.3.1.1", "k": "Practical", "m": 3, "ht": false, "q": "<b>Required practical:<\/b> How do you find the <b>density of a liquid<\/b>?", "a": ["Put a <b>measuring cylinder<\/b> on a balance and zero it (1)", "Add liquid and record its <b>volume<\/b> and <b>mass<\/b> (1)", "Calculate <b>density = mass ÷ volume<\/b> (1)"], "cp": ["Put a measuring cylinder on a balance and zero it", "Add liquid and record its volume and mass", "Calculate density = mass ÷ volume"], "dp": ["Measure its temperature with a thermometer only", "Weigh the cylinder without the liquid", "Pour it into a eureka can"], "mand": 0}, {"id": "PHY-03-008", "t": 3, "s": "4.3.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why does a <b>block of wood float<\/b> on water but a block of steel sinks?", "a": ["Wood is <b>less dense<\/b> than water (1)", "Steel is <b>more dense<\/b> than water (1)"], "cp": ["Wood is less dense than water", "Steel is more dense than water"], "dp": ["Wood is heavier than water", "Steel is less dense than water", "Wood has more mass than the steel"], "mand": 0}, {"id": "PHY-03-009", "t": 3, "s": "4.3.1.2", "k": "Compare", "m": 3, "ht": false, "q": "Compare the <b>arrangement and movement<\/b> of particles in a <b>solid, liquid and gas<\/b>.", "a": ["Solid: <b>close together<\/b>, regular pattern, <b>vibrate<\/b> in position (1)", "Liquid: <b>close together<\/b>, random, can <b>move past<\/b> each other (1)", "Gas: <b>far apart<\/b>, random, move <b>quickly in all directions<\/b> (1)"], "cp": ["Solid: close together, regular pattern, vibrate in position", "Liquid: close together, random, can move past each other", "Gas: far apart, random, move quickly in all directions"], "dp": ["Gas: close together in a regular pattern", "Solid: far apart and moving fast", "Liquid: fixed positions in a regular pattern"], "mand": 0}, {"id": "PHY-03-010", "t": 3, "s": "4.3.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Why does a <b>gas<\/b> have a much lower density than a <b>solid<\/b>?", "a": ["The particles in a gas are <b>much further apart<\/b> (1)", "So there is <b>less mass per unit volume<\/b> (1)"], "cp": ["The particles in a gas are much further apart", "So there is less mass per unit volume"], "dp": ["Gas particles are heavier", "Gas particles are closer together", "Gas particles are bigger"], "mand": 0}, {"id": "PHY-03-011", "t": 3, "s": "4.3.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>six changes of state<\/b> or give <b>three<\/b> examples.", "a": ["Any three (1 each):", "• <b>melting<\/b> (solid to liquid)", "• <b>freezing<\/b> (liquid to solid)", "• <b>boiling or evaporating<\/b> (liquid to gas)", "• <b>condensing<\/b> (gas to liquid)", "• <b>sublimation<\/b> (solid to gas)"], "cp": ["melting (solid to liquid)", "freezing (liquid to solid)", "boiling or evaporating (liquid to gas)", "condensing (gas to liquid)", "sublimation (solid to gas)"], "dp": ["Dissolving, filtering and mixing", "Sinking, floating and rising", "Burning, rusting and melting"], "mand": 0}, {"id": "PHY-03-012", "t": 3, "s": "4.3.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Is a <b>change of state<\/b> a chemical or a physical change? Explain.", "a": ["It is a <b>physical change<\/b> (1)", "The material <b>recovers its original properties<\/b> and no new substance is made (1)"], "cp": ["It is a physical change", "The material recovers its original properties and no new substance is made"], "dp": ["It is a chemical change", "A new substance forms", "The mass changes"], "mand": 0}, {"id": "PHY-03-013", "t": 3, "s": "4.3.1.2", "k": "Explain", "m": 2, "ht": false, "q": "What happens to the <b>mass<\/b> of a substance when it <b>melts<\/b>? Explain.", "a": ["The mass <b>stays the same<\/b> (1)", "The <b>number of particles<\/b> has not changed (conservation of mass) (1)"], "cp": ["The mass stays the same", "The number of particles has not changed (conservation of mass)"], "dp": ["The mass increases", "The mass decreases as the substance turns to liquid", "It depends on the temperature"], "mand": 0}, {"id": "PHY-03-014", "t": 3, "s": "4.3.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>internal energy<\/b>?", "a": ["The <b>total energy<\/b> that the particles of a system have (1)", "in their <b>kinetic and potential energy stores<\/b> (1)"], "cp": ["The total energy that the particles of a system have", "in their kinetic and potential energy stores"], "dp": ["The energy of a moving object as a whole", "The energy stored in a battery", "The energy inside a nucleus only"], "mand": 0}, {"id": "PHY-03-015
