<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amelie German">
<meta name="theme-color" content="#0d1020">
<title>Amelie's German Lab | GCSE Higher revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#2fd3c4;--accent2:#ffd166;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v3M12 17v3M5 12h14"/><circle cx="12" cy="7" r="0.5"/><circle cx="12" cy="17" r="0.5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span>German Lab</span></button>
  <span class="pill">Amelie | Higher</span>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>
<script>
const DATA=[{"id": "GER-01-001", "t": 1, "s": "Spec", "k": "Recall", "m": 4, "ht": false, "q": "What are the <b>four papers<\/b> in Edexcel GCSE German and what does each assess?", "a": ["<b>Paper 1<\/b>: Listening (1)", "<b>Paper 2<\/b>: Speaking (1)", "<b>Paper 3<\/b>: Reading (1)", "<b>Paper 4<\/b>: Writing, each worth <b>25%<\/b> (1)"], "cp": ["Paper 1: Listening", "Paper 2: Speaking", "Paper 3: Reading", "Paper 4: Writing, each worth 25%"], "dp": ["Two papers worth 50% each", "Listening, reading and a project", "Writing 100%"], "mand": 0}, {"id": "GER-01-002", "t": 1, "s": "Spec", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>Higher tier timings<\/b> for Listening, Reading and Writing?", "a": ["<b>Listening<\/b>: 45 minutes including 5 minutes reading time (1)", "<b>Reading<\/b>: 1 hour (1)", "<b>Writing<\/b>: 1 hour 20 minutes (1)"], "cp": ["Listening: 45 minutes including 5 minutes reading time", "Reading: 1 hour", "Writing: 1 hour 20 minutes"], "dp": ["All three are 30 minutes", "Listening 2 hours", "Writing 20 minutes"], "mand": 0}, {"id": "GER-01-003", "t": 1, "s": "Spec", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>three Speaking tasks<\/b> at Higher tier?", "a": ["<b>Role play<\/b> (1)", "<b>Picture-based task<\/b> (1)", "<b>Conversation<\/b>, on two themes (1)"], "cp": ["Role play", "Picture-based task", "Conversation, on two themes"], "dp": ["Debate, essay, poster", "Presentation only", "Reading aloud only"], "mand": 0}, {"id": "GER-01-004", "t": 1, "s": "Spec", "k": "Recall", "m": 4, "ht": false, "q": "What are the <b>five themes<\/b> of the course?", "a": ["<b>Identity and culture<\/b> (1)", "<b>Local area, holiday and travel<\/b> (1)", "<b>School<\/b>, and <b>Future aspirations, study and work<\/b> (1)", "<b>International and global dimension<\/b> (1)"], "cp": ["Identity and culture", "Local area, holiday and travel", "School, and Future aspirations, study and work", "International and global dimension"], "dp": ["Sport, music, art, drama, film", "Home, food, clothes, pets, hobbies only", "Grammar, vocabulary, spelling, culture"], "mand": 0}, {"id": "GER-01-005", "t": 1, "s": "Spec", "k": "Process", "m": 3, "ht": false, "q": "What happens in the <b>role play<\/b>?", "a": ["You ask <b>two questions<\/b> in German (1)", "You answer an <b>unpredictable question<\/b> (1)", "One part needs a <b>past tense<\/b> (1)"], "cp": ["You ask two questions in German", "You answer an unpredictable question", "One part needs a past tense"], "dp": ["You read aloud a story", "Only the teacher speaks", "You write a letter"], "mand": 0}, {"id": "GER-01-006", "t": 1, "s": "Spec", "k": "Process", "m": 3, "ht": false, "q": "What is a good approach to the <b>picture-based task<\/b>?", "a": ["Use the <b>five bullet points<\/b> in order (1)", "Answer in <b>full sentences<\/b> with opinions and reasons (1)", "Stay calm for the <b>unpredictable final question<\/b> (1)"], "cp": ["Use the five bullet points in order", "Answer in full sentences with opinions and reasons", "Stay calm for the unpredictable final question"], "dp": ["Describe only the colours", "Answer with single words", "Stop after two points"], "mand": 0}, {"id": "GER-01-007", "t": 1, "s": "Spec", "k": "Process", "m": 3, "ht": false, "q": "How does the <b>conversation<\/b> work?", "a": ["<b>Part 1<\/b> is a topic you choose (1)", "<b>Part 2<\/b> is a theme set by Pearson (1)", "Expect <b>follow-up questions<\/b> and develop your answers (1)"], "cp": ["Part 1 is a topic you choose", "Part 2 is a theme set by Pearson", "Expect follow-up questions and develop your answers"], "dp": ["Only one theme, no choice", "It is a written task", "Questions are all spelt out in advance"], "mand": 0}, {"id": "GER-01-008", "t": 1, "s": "Spec", "k": "Process", "m": 3, "ht": false, "q": "How should you <b>extend an answer<\/b> in speaking?", "a": ["Give an <b>opinion<\/b> (1)", "Add a <b>reason<\/b> with weil or denn (1)", "Mention <b>another time<\/b> frame (past or future) (1)"], "cp": ["Give an opinion", "Add a reason with weil or denn", "Mention another time frame (past or future)"], "dp": ["Say 'ja' or 'nein' only", "Repeat the question", "Speak English"], "mand": 0}, {"id": "GER-01-009", "t": 1, "s": "Listening", "k": "Process", "m": 3, "ht": false, "q": "What is a good approach to <b>Listening Section B<\/b> (questions in English)?", "a": ["<b>Read the questions<\/b> in the 5 minutes (1)", "Listen for <b>numbers, negatives and tenses<\/b> (1)", "Write <b>short answers<\/b> and check the marks (1)"], "cp": ["Read the questions in the 5 minutes", "Listen for numbers, negatives and tenses", "Write short answers and check the marks"], "dp": ["Ignore the questions", "Write full paragraphs", "Skip every number"], "mand": 0}, {"id": "GER-01-010", "t": 1, "s": "Listening", "k": "Exam trap", "m": 2, "ht": false, "q": "What <b>common traps<\/b> appear in German listening and reading?", "a": ["<b>Negatives<\/b> such as nicht and kein (1)", "<b>Time words<\/b> and <b>tenses<\/b> that change the meaning (1)"], "cp": ["Negatives such as nicht and kein", "Time words and tenses that change the meaning"], "dp": ["Only the title matters", "Nothing changes the meaning", "Numbers never matter"], "mand": 0}, {"id": "GER-01-011", "t": 1, "s": "Reading", "k": "Process", "m": 3, "ht": false, "q": "What are the <b>steps for the translation<\/b> from German into English?", "a": ["Read the <b>whole sentence<\/b> first (1)", "Check the <b>tense and verb position<\/b> (1)", "Translate <b>meaning<\/b>, not word for word (1)"], "cp": ["Read the whole sentence first", "Check the tense and verb position", "Translate meaning, not word for word"], "dp": ["Translate every word literally", "Skip the verbs", "Guess"], "mand": 0}, {"id": "GER-01-012", "t": 1, "s": "Writing", "k": "Process", "m": 3, "ht": false, "q": "What are the <b>steps for the translation<\/b> from English into German?", "a": ["Identify the <b>tense<\/b> first (1)", "Get the <b>verb in the right place<\/b> (1)", "Check <b>spellings<\/b>, capitals on nouns and genders (1)"], "cp": ["Identify the tense first", "Get the verb in the right place", "Check spellings, capitals on nouns and genders"], "dp": ["Write in English word order", "Leave out the verbs", "Use no capital letters"], "mand": 0}, {"id": "GER-01-013", "t": 1, "s": "Writing", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>two types of writing tasks<\/b> at Higher?", "a": ["<b>Task 1<\/b>: informal, e.g. an email or blog (1)", "<b>Task 2<\/b>: formal, e.g. a letter or application (1)", "Task 3 is the <b>translation<\/b> into German (1)"], "cp": ["Task 1: informal, e.g. an email or blog", "Task 2: formal, e.g. a letter or application", "Task 3 is the translation into German"], "dp": ["Poem, story and diary", "Three essays", "Two translations only"], "mand": 0}, {"id": "GER-01-014", "t": 1, "s": "Writing", "k": "Process", "m": 4, "ht": false, "q": "How do you get a <b>high mark for the open writing tasks<\/b>?", "a": ["Cover <b>every bullet point<\/b> (1)", "Use <b>different tenses<\/b> (1)", "Add <b>opinions and reasons<\/b> (1)", "<b>Check accuracy<\/b> and word order (1)"], "cp": ["Cover every bullet point", "Use different tenses", "Add opinions and reasons", "Check accuracy and word order"], "dp": ["Write as fast as possible", "Use only present tense", "Skip bullet points"], "mand": 0}, {"id": "GER-01-015", "t": 1, "s": "Writing", "k": "Recall", "m": 4, "ht": false, "q": "Which <b>linking words<\/b> improve a German answer?", "a": ["<b>weil<\/b> (because) (1)", "<b>aber<\/b> (but) (1)", "<b>obwohl<\/b> (although) (1)", "<b>deshalb<\/b> (therefore) (1)"], "cp": ["weil (because)", "aber (but)", "obwohl (although)", "deshalb (therefore)"], "dp": ["und nur", "ja, nein, vielleicht, doch", "oder immer"], "mand": 0}, {"id": "GER-02-001", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>verb second rule<\/b>? Translate 'Today I play football.'", "a": ["In a main clause the <b>verb is the second idea<\/b> (1)", "<b>Heute spiele ich Fußball.<\/b> (1)", "The subject goes <b>after the verb<\/b> when something else starts the sentence (1)"], "cp": ["In a main clause the verb is the second idea", "Heute spiele ich Fußball", "The subject goes after the verb when something else starts the sentence"], "dp": ["Heute ich spiele Fußball.", "Ich heute spiele Fußball.", "Spiele heute ich Fußball."], "mand": 0}, {"id": "GER-02-002", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "What happens to the verb after <b>weil<\/b>? Translate 'I am tired because I work a lot.'", "a": ["The verb goes to the <b>end<\/b> of the clause (1)", "<b>Ich bin müde, weil ich viel arbeite.<\/b> (1)", "Always put a <b>comma<\/b> before weil (1)"], "cp": ["The verb goes to the end of the clause", "Ich bin müde, weil ich viel arbeite", "Always put a comma before weil"], "dp": ["Ich bin müde, weil arbeite ich viel.", "Ich bin müde weil ich arbeite viel.", "Ich bin müde, weil ich arbeite viel."], "mand": 0}, {"id": "GER-02-003", "t": 2, "s": "Grammar", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four subordinating conjunctions<\/b> that send the verb to the end.", "a": ["<b>weil<\/b> (because) (1)", "<b>dass<\/b> (that) (1)", "<b>wenn<\/b> (if, when) (1)", "<b>obwohl<\/b> (although) (1)"], "cp": ["weil (because)", "dass (that)", "wenn (if, when)", "obwohl (although)"], "dp": ["und, aber, oder, denn", "deshalb, trotzdem, dann, danach", "ja, nein, doch, bitte"], "mand": 0}, {"id": "GER-02-004", "t": 2, "s": "Grammar", "k": "Recall", "m": 4, "ht": false, "q": "Which conjunctions <b>do not change word order<\/b>?", "a": ["<b>und<\/b> (and) (1)", "<b>aber<\/b> (but) (1)", "<b>oder<\/b> (or) (1)", "<b>denn<\/b> (because, for) (1)"], "cp": ["und (and)", "aber (but)", "oder (or)", "denn (because, for)"], "dp": ["weil, dass, wenn, obwohl", "deshalb, dann, trotzdem, danach", "ob, als, damit, bevor"], "mand": 0}, {"id": "GER-02-005", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do you form the <b>perfect tense<\/b> with haben? Translate 'I played football.'", "a": ["<b>haben + past participle<\/b> at the end (1)", "<b>Ich habe Fußball gespielt.<\/b> (1)", "Regular participle: <b>ge + stem + t<\/b> (1)"], "cp": ["haben + past participle at the end", "Ich habe Fußball gespielt", "Regular participle: ge + stem + t"], "dp": ["Ich bin Fußball gespielt.", "Ich habe gespielen Fußball.", "Ich habe spielte Fußball."], "mand": 0}, {"id": "GER-02-006", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "When does the <b>perfect tense use sein<\/b>? Translate 'I went to Berlin.'", "a": ["For verbs of <b>movement or change of state<\/b> (1)", "<b>Ich bin nach Berlin gefahren.<\/b> (1)", "Also with <b>bleiben, werden, passieren<\/b> (1)"], "cp": ["For verbs of movement or change of state", "Ich bin nach Berlin gefahren", "Also with bleiben, werden, passieren"], "dp": ["Ich habe nach Berlin gefahren.", "Ich bin nach Berlin gefahrt.", "Ich war nach Berlin fahren."], "mand": 0}, {"id": "GER-02-007", "t": 2, "s": "Grammar", "k": "Recall", "m": 4, "ht": false, "q": "Give the <b>past participles<\/b>: sehen, essen, trinken, schreiben.", "a": ["<b>gesehen<\/b> (1)", "<b>gegessen<\/b> (1)", "<b>getrunken<\/b> (1)", "<b>geschrieben<\/b> (1)"], "cp": ["gesehen", "gegessen", "getrunken", "geschrieben"], "dp": ["gesehnt, geessen, getrinkt, geschreibt", "gesah, aß, trank, schrieb", "gesehen, geessen, getrinkt, geschreiben"], "mand": 0}, {"id": "GER-02-008", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do you say <b>'I would like to travel'<\/b> and what is the structure?", "a": ["<b>Ich möchte reisen.<\/b> (1)", "<b>möchte + infinitive<\/b> at the end (1)", "Alternative: <b>ich würde gern reisen<\/b> (1)"], "cp": ["Ich möchte reisen", "möchte + infinitive at the end", "Alternative: ich würde gern reisen"], "dp": ["Ich möchte reise.", "Ich möchte gereist.", "Ich will reisen mich."], "mand": 0}, {"id": "GER-02-009", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do you form the <b>future tense<\/b>? Translate 'I will study German.'", "a": ["<b>werden + infinitive<\/b> at the end (1)", "<b>Ich werde Deutsch lernen.<\/b> (1)", "You can also use the <b>present with a time word<\/b> (1)"], "cp": ["werden + infinitive at the end", "Ich werde Deutsch lernen", "You can also use the present with a time word"], "dp": ["Ich werde lerne Deutsch.", "Ich habe Deutsch lernen.", "Ich bin Deutsch gelernt."], "mand": 0}, {"id": "GER-02-010", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do you form the <b>conditional<\/b>? Translate 'I would buy a car.'", "a": ["<b>würde + infinitive<\/b> at the end (1)", "<b>Ich würde ein Auto kaufen.<\/b> (1)", "Used for <b>'would'<\/b> and wishes (1)"], "cp": ["würde + infinitive at the end", "Ich würde ein Auto kaufen", "Used for 'would' and wishes"], "dp": ["Ich würde ein Auto gekauft.", "Ich werde ein Auto kaufen würde.", "Ich würde kaufe ein Auto."], "mand": 0}, {"id": "GER-02-011", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do <b>separable verbs<\/b> work? Translate 'I get up at seven.'", "a": ["The prefix goes to the <b>end<\/b> in the present tense (1)", "<b>Ich stehe um sieben Uhr auf.<\/b> (1)", "Other examples: <b>anrufen, einkaufen, fernsehen<\/b> (1)"], "cp": ["The prefix goes to the end in the present tense", "Ich stehe um sieben Uhr auf", "Other examples: anrufen, einkaufen, fernsehen"], "dp": ["Ich aufstehe um sieben Uhr.", "Ich stehe auf um sieben Uhr.", "Ich auf stehe um sieben Uhr."], "mand": 0}, {"id": "GER-02-012", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do <b>modal verbs<\/b> work? Translate 'I can swim.'", "a": ["The modal is the <b>second idea<\/b> (1)", "The other verb is an <b>infinitive at the end<\/b> (1)", "<b>Ich kann schwimmen.<\/b> (1)"], "cp": ["The modal is the second idea", "The other verb is an infinitive at the end", "Ich kann schwimmen"], "dp": ["Ich kann schwimme.", "Ich kann geschwommen.", "Ich schwimmen kann."], "mand": 0}, {"id": "GER-02-013", "t": 2, "s": "Grammar", "k": "Recall", "m": 4, "ht": false, "q": "Give the <b>meaning<\/b> of the modals: können, müssen, dürfen, wollen.", "a": ["<b>können<\/b>: can, to be able to (1)", "<b>müssen<\/b>: must, have to (1)", "<b>dürfen<\/b>: may, be allowed to (1)", "<b>wollen<\/b>: to want to (1)"], "cp": ["können: can, to be able to", "müssen: must, have to", "dürfen: may, be allowed to", "wollen: to want to"], "dp": ["can, must, may, will always the same", "have, be, do, go", "like, hate, love, want"], "mand": 0}, {"id": "GER-02-014", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do you use the <b>imperfect<\/b> for sein and haben? Translate 'It was good. I had time.'", "a": ["<b>sein<\/b>: war (1)", "<b>haben<\/b>: hatte (1)", "<b>Es war gut. Ich hatte Zeit.<\/b> (1)"], "cp": ["sein: war", "haben: hatte", "Es war gut. Ich hatte Zeit"], "dp": ["Es wurde gut. Ich habe Zeit.", "Es ist gewesen gut.", "Es war guten. Ich hatte zeiten."], "mand": 0}, {"id": "GER-02-015", "t": 2, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do you form the <b>reflexive verb<\/b> 'sich interessieren für'? Translate 'I am interested in music.'", "a": ["Use a <b>reflexive pronoun<\/b> mich, dich, sich (1)", "<b>Ich interessiere mich für Musik.<\/b> (1)", "The verb follows <b>verb second<\/b> (1)"], "cp": ["Use a reflexive pronoun mich, dich, sich", "Ich interessiere mich für Musik", "The verb follows verb second"], "dp": ["Ich interessiere für Musik.", "Ich mich interessiere Musik.", "Ich bin interessiert für Musik."], "mand": 0}, {"id": "GER-02-016", "t": 2, "s": "Grammar", "k": "Exam trap", "m": 2, "ht": false, "q": "Why do students <b>lose marks<\/b> by translating 'I am playing' as 'Ich bin spielen'?", "a": ["German has <b>no continuous tense<\/b> (1)", "Use <b>Ich spiele<\/b> for both 'I play' and 'I am playing' (1)"], "cp": ["German has no continuous tense", "Use Ich spiele for both 'I play' and 'I am playing'"], "dp": ["German always uses sein", "Spielen is the correct form", "Examiners accept both"], "mand": 0}, {"id": "GER-03-001", "t": 3, "s": "Grammar", "k": "Recall", "m": 4, "ht": false, "q": "Give the <b>definite articles<\/b> in the nominative: masculine, feminine, neuter, plural.", "a": ["<b>der<\/b> (masculine) (1)", "<b>die<\/b> (feminine) (1)", "<b>das<\/b> (neuter) (1)", "<b>die<\/b> (plural) (1)"], "cp": ["der (masculine)", "die (feminine)", "das (neuter)", "die (plural)"], "dp": ["die, der, den, dem", "den, die, das, die", "dem, der, dem, den"], "mand": 0}, {"id": "GER-03-002", "t": 3, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>accusative<\/b> and when do you use it? Change 'der Hund' to the accusative.", "a": ["The <b>direct object<\/b> and after certain prepositions (1)", "<b>Masculine der changes to den<\/b> (1)", "<b>Ich habe den Hund.<\/b> (1)"], "cp": ["The direct object and after certain prepositions", "Masculine der changes to den", "Ich habe den Hund"], "dp": ["Ich habe der Hund.", "Ich habe dem Hund.", "Ich habe des Hund."], "mand": 0}, {"id": "GER-03-003", "t": 3, "s": "Grammar", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four accusative prepositions<\/b>.", "a": ["<b>durch<\/b> (through) (1)", "<b>für<\/b> (for) (1)", "<b>gegen<\/b> (against) (1)", "<b>ohne<\/b> (without), also um and bis (1)"], "cp": ["durch (through)", "für (for)", "gegen (against)", "ohne (without), also um and bis"], "dp": ["mit, nach, bei, von", "in, auf, an, über only", "zu, aus, seit, bei"], "mand": 0}, {"id": "GER-03-004", "t": 3, "s": "Grammar", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four dative prepositions<\/b>.", "a": ["<b>mit<\/b> (with) (1)", "<b>nach<\/b> (after, to) (1)", "<b>bei<\/b> (at, with) (1)", "<b>von<\/b> (from, of), also zu, aus, seit (1)"], "cp": ["mit (with)", "nach (after, to)", "bei (at, with)", "von (from, of), also zu, aus, seit"], "dp": ["durch, für, gegen, ohne", "über, unter, neben, vor only", "bis, um, entlang, gegen"], "mand": 0}, {"id": "GER-03-005", "t": 3, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>dative articles<\/b> and an example?", "a": ["<b>dem<\/b> (masc and neut), <b>der<\/b> (fem), <b>den + n<\/b> (plural) (1)", "<b>Ich fahre mit dem Bus.<\/b> (1)", "Used for <b>indirect objects<\/b> too (1)"], "cp": ["dem (masc and neut), der (fem), den + n (plural)", "Ich fahre mit dem Bus", "Used for indirect objects too"], "dp": ["den, die, das always", "des, der, des, der", "dem always"], "mand": 0}, {"id": "GER-03-006", "t": 3, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "What are <b>two-way prepositions<\/b>? Compare 'in the room' and 'into the room'.", "a": ["<b>an, auf, in, neben, über, unter, vor, hinter, zwischen<\/b> (1)", "<b>Dative<\/b> for position: im Zimmer (1)", "<b>Accusative<\/b> for movement: ins Zimmer (1)"], "cp": ["an, auf, in, neben, über, unter, vor, hinter, zwischen", "Dative for position: im Zimmer", "Accusative for movement: ins Zimmer"], "dp": ["They never change", "Only dative", "Only accusative"], "mand": 0}, {"id": "GER-03-007", "t": 3, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do you say <b>'my'<\/b> in German and how does it change?", "a": ["<b>mein, meine, mein, meine<\/b> (nominative) (1)", "It changes with <b>gender and case<\/b> (1)", "<b>Ich habe meinen Bruder<\/b> (accusative masculine) (1)"], "cp": ["mein, meine, mein, meine (nominative)", "It changes with gender and case", "Ich habe meinen Bruder (accusative masculine)"], "dp": ["It never changes", "Only plural changes", "Always meine"], "mand": 0}, {"id": "GER-03-008", "t": 3, "s": "Grammar", "k": "Recall", "m": 3, "ht": false, "q": "How do <b>adjective endings<\/b> work with 'ein'? Translate 'a big house'.", "a": ["After <b>ein words<\/b> endings follow gender and c function fbBanner(c,e){
  const m=c.m,full=e===m,none=e===0;
  const T=full?["Full marks.","Spot on.","Brilliant."]:none?["Not this time."]:["Nearly there."];
  const h=T[(R.i+c.id.length)%T.length];
  const s=full?(m>1?"Every mark secured.":"Correct."):none?"Read the mark scheme below and it will stick next time.":e+" of "+m+" marks. Check what you missed below.";
  return `<div class="fb ${full?"full":none?"none":"part"}"><b>${h}</b><span>${s}</span></div>`}
function curScore(c){let s=0;R.sel.forEach(i=>{if(R.opts[i]&&R.opts[i].ok)s++});return Math.min(s,c.m)}
function reveal(){if(!R.sel.length||R.rev)return;R.rev=true;
  {const c=R.cards[R.i];logEvent({t:"answer",id:c.id,topic:TOPICS[c.t].name,kind:c.k,marks:curScore(c),max:c.m,sel:R.sel.map(i=>plain(R.opts[i].h)).join(" | "),miss:R.opts.filter((o,i)=>o.ok&&!R.sel.includes(i)).map(o=>plain(o.h)).join(" | "),round:R.label})}
  roundView();const a=document.querySelector(".opts");if(a)a.scrollIntoView({behavior:"smooth",block:"start"})}
function pick(i){const n=R.cards[R.i].m;const k=R.sel.indexOf(i);
  if(k>=0)R.sel.splice(k,1);else if(n===1)R.sel=[i];else if(R.sel.length<n)R.sel.push(i);else{toast("You have chosen "+n+". Untick one to change.");return}
  const y=window.scrollY;roundView();window.scrollTo(0,y)}
function next(){
  const c=R.cards[R.i],e=curScore(c);
  R.earned+=e;R.max+=c.m;R.log.push({c,e});R.combo=(e===c.m)?(R.combo||0)+1:0;
  const st=S.cards[c.id]||(S.cards[c.id]={box:0,seen:0,best:0});
  const ratio=e/c.m;st.seen++;st.best=Math.max(st.best,e);
  if(ratio>=.8)st.box=Math.min(3,st.box+1);else if(ratio<.5)st.box=0;else st.box=Math.max(1,st.box);
  let xp=e*10+(e===c.m?5:0);S.xp+=xp;S.marks+=e;
  {const a=S.tp[c.t]||(S.tp[c.t]={e:0,m:0});a.e+=e;a.m+=c.m;const k=S.kp[c.k]||(S.kp[c.k]={e:0,m:0});k.e+=e;k.m+=c.m;S.hist[todayStr()]=(S.hist[todayStr()]||0)+e;const ks=Object.keys(S.hist).sort();while(ks.length>60)delete S.hist[ks.shift()]}
  if(S.day.d!==todayStr())S.day={d:todayStr(),m:0};S.day.m+=e;
  if(e===c.m){S.perfect++;if(c.k==="Exam trap")S.traps++}
  let lost=false;
  if(R.survival&&e<Math.ceil(c.m/2)){R.hearts--;lost=true;if(R.hearts<=0)R.over=true}
  save();
  if(R.over||R.i+1>=R.cards.length){finish();return}
  R.i++;prep();roundView();window.scrollTo(0,0);
  if(lost){const el=$("#card");el.classList.add("shake")}
}
function finish(){
  S.rounds++;
  const t=todayStr();
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.last===y.toLocaleDateString("en-CA"))?S.streak+1:1;S.last=t}
  if(S.streak>(S.best||0))S.best=S.streak;
  if(R.survival&&!R.over)S.survWins++;
  S.recent.unshift({d:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),l:R.label,e:R.earned,m:R.max});S.recent=S.recent.slice(0,10);
  logEvent({t:"round",round:R.label,marks:R.earned,max:R.max,xp:R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0),totalxp:S.xp+0,cards:R.log.length,over:R.over?1:0});
  R.newBadges=checkBadges();save();view="result";render();window.scrollTo(0,0);if(!R.over&&R.max&&R.earned/R.max>=.7)confetti();
}
function resultView(){
  const pct=R.max?R.earned/R.max:0,stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const msg=R.over?"Out of lives. Review the cards you missed and go again.":pct>=.9?"Outstanding. That is top-grade recall.":pct>=.7?"Strong round. A few marks to tidy up.":pct>=.4?"Good effort. The missed cards will come round again.":"Tough one. Read the mark schemes and try again.";
  const missed=R.log.filter(x=>x.e<x.c.m).map(x=>x.c);
  $("#app").innerHTML=`<div class="card result" style="--c:${CFG.accent}">
   <h1 style="margin-top:0">${R.over?"Game over":"Round complete"}</h1><p class="sub">${msg}</p>
   <div class="stars">${[0,1,2].map(i=>`<span class="star ${i<stars?"on":""}">${ICON.star}</span>`).join("")}</div>
   <div class="rstats"><div class="stat"><b>${R.earned}/${R.max}</b><span>marks</span></div><div class="stat"><b>${Math.round(pct*100)}%</b><span>score</span></div><div class="stat"><b>+${R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0)}</b><span>points</span></div></div>
   ${R.newBadges&&R.newBadges.length?`<div class="newb">${R.newBadges.map(b=>`<div class="badge got" style="margin:8px 0"><span class="ic">${ICON.medal}</span><div><b>New badge: ${b.n}</b><small>${b.d}</small></div></div>`).join("")}</div>`:""}
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
    ${missed.length?`<button class="btn" onclick="replay()">Retry ${missed.length} missed</button>`:""}
    <button class="btn ghost" onclick="go('home')">Back to home</button></div>
   ${missed.length?`<h2>Review</h2><div style="text-align:left">${missed.map(c=>`<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span></summary><div class="body"><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`).join("")}</div>`:""}
  </div>`;
  R.missed=missed;
}
function confetti(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cols=[CFG.accent,CFG.accent2,"#ffb84d","#3ddc97","#ffffff"];for(let i=0;i<46;i++){const s=document.createElement("i");s.className="conf";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.animationDuration=(1.8+Math.random()*1.6)+"s";s.style.animationDelay=(Math.random()*.5)+"s";s.style.borderRadius=i%3?"2px":"50%";document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function replay(){const m=R.missed;R={cards:shuffle(m.slice()),i:0,earned:0,max:0,hearts:null,survival:false,label:"Retry",rev:false,sel:[],log:[],over:false};prep();view="round";render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* ---------- library ---------- */
function library(){
  const kinds=[...new Set(DATA.map(c=>c.k))].sort();
  $("#app").innerHTML=`<div class="lib"><h1>Card <span class="grad">library</span></h1><p class="sub">Every question with its full mark scheme. Tap a card to open it.</p>
  <div class="chips">${[0].concat(TN).map(t=>`<button class="chip ${LIB.t===t?"on":""}" onclick="LIB.t=${t};library()">${t?"Topic "+t:"All topics"}</button>`).join("")}</div>
  <div class="chips"><input type="search" id="lq" placeholder="Search questions and answers" value="${LIB.q.replace(/"/g,"&quot;")}"><select id="lk"><option value="">All question types</option>${kinds.map(k=>`<option ${LIB.k===k?"selected":""}>${k}</option>`).join("")}</select><button class="chip" id="lo">Open all</button></div>
  <div id="lres"></div></div>`;
  const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
/* ---------- light passcode gate (only active when a hash is set) ---------- */
async function gateHash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function gateRun(who,hash,acc,acc2,go){
  if(!hash){go();return}
  const K="gcse_gate_"+who.toLowerCase();
  try{if(localStorage.getItem(K)===hash){go();return}}catch(e){}
  const o=document.createElement("div");
  o.style.cssText="position:fixed;inset:0;z-index:99999;background:#0b0e1c;color:#f4f6ff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  o.innerHTML='<form style="width:100%;max-width:340px;text-align:center"><h1 style="margin:0 0 6px;font-size:1.6rem">Hi '+who+'</h1><p style="margin:0 0 18px;color:#aab0cc;font-size:.95rem">Enter your passcode to open your revision dashboard.</p><input id="gp" type="password" inputmode="numeric" autocomplete="off" placeholder="Passcode" style="width:100%;box-sizing:border-box;padding:14px 16px;border-radius:12px;border:2px solid #2b3050;background:#141831;color:#fff;font-size:1.1rem;text-align:center;outline:none"><button type="submit" style="margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:1rem;color:#10132a;background:linear-gradient(90deg,'+acc+','+acc2+');cursor:pointer">Open</button><p id="gm" style="min-height:1.4em;margin:12px 0 0;color:#ff8a8a;font-size:.9rem"></p></form>';
  document.body.appendChild(o);
  const f=o.querySelector("form"),i=o.querySelector("#gp"),m=o.querySelector("#gm");
  setTimeout(()=>{try{i.focus()}catch(e){}},50);
  f.addEventListener("submit",async ev=>{ev.preventDefault();
    const h=await gateHash(who.toLowerCase()+"|"+i.value.trim());
    if(h===hash){try{localStorage.setItem(K,hash)}catch(e){}o.remove();go()}
    else{m.textContent="That passcode is not right. Try again.";i.value="";i.focus()}});
}
gateRun(CFG.name,CFG.gate,CFG.accent,CFG.accent2,()=>render());
</script>
