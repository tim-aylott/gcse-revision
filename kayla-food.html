<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayla Food Preparation">
<meta name="theme-color" content="#0d1020">
<title>Kayla's Food Preparation Lab | GCSE AQA revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#8b7bff;--accent2:#38d0f0;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>

<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v3M12 17v3M5 12h14"/><circle cx="12" cy="7" r="0.5"/><circle cx="12" cy="17" r="0.5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span>Food Preparation Lab</span></button>
  <span class="pill">Kayla | AQA</span>
  <span class="spacer"></span>

</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>

too much sugar<\/b> in the diet.", "a": ["<b>Tooth decay<\/b> (1)", "<b>Obesity<\/b> (1)", "Increased risk of <b>type 2 diabetes<\/b> (1)"], "cp": ["Tooth decay", "Obesity", "Increased risk of type 2 diabetes"], "dp": ["Stronger bones", "Anaemia", "Rickets"], "mand": 0}, {"id": "FOD-01-021", "t": 1, "s": "3.2.1.3", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>free sugars<\/b>?", "a": ["Sugars <b>added to foods<\/b> (1)", "Plus sugars in <b>honey, syrups and fruit juices<\/b> (1)"], "cp": ["Sugars added to foods", "Plus sugars in honey, syrups and fruit juices"], "dp": ["Sugars in whole fruit", "Sugars in water", "Sugars that cost nothing"], "mand": 0}, {"id": "FOD-01-022", "t": 1, "s": "3.2.1.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'protein gives most energy'<\/b>. What is wrong?", "a": ["<b>Carbohydrate<\/b> is the main source of energy (1)", "Protein is mainly for <b>growth and repair<\/b> (1)"], "cp": ["Carbohydrate is the main source of energy", "Protein is mainly for growth and repair"], "dp": ["Protein is the main energy source", "Fat is for growth", "Fibre gives most energy"], "mand": 0}, {"id": "FOD-01-023", "t": 1, "s": "3.2.1.2", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'all fat is bad'<\/b> a weak answer?", "a": ["Fat is needed for <b>energy and fat-soluble vitamins<\/b> (1)", "<b>Unsaturated<\/b> fat is healthier than saturated (1)"], "cp": ["Fat is needed for energy and fat-soluble vitamins", "Unsaturated fat is healthier than saturated"], "dp": ["All fat is harmful", "Fat has no function", "Fat is never needed"], "mand": 0}, {"id": "FOD-01-024", "t": 1, "s": "3.2.1.3", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'fibre is digested for energy'<\/b> wrong?", "a": ["Fibre is <b>not digested<\/b> (1)", "It passes through the gut and aids <b>bowel movement<\/b> (1)"], "cp": ["Fibre is not digested", "It passes through the gut and aids bowel movement"], "dp": ["Fibre is fully digested", "Fibr  "What is <b>gelatinisation<\/b>?", "a": ["<b>Starch grains absorb liquid<\/b> and swell when heated (1)", "<b>Thickening<\/b> a sauce at around 62 to 80°C (1)"], "cp": ["Starch grains absorb liquid and swell when heated", "Thickening a sauce at around 62 to 80°C"], "dp": ["Sugar turning brown", "Fat melting", "Protein setting"], "mand": 0}, {"id": "FOD-04-016", "t": 4, "s": "3.3.2.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>dextrinisation<\/b>?", "a": ["<b>Starch breaks into dextrins<\/b> with dry heat (1)", "e.g. <b>browning of toast or bread<\/b> (1)"], "cp": ["Starch breaks into dextrins with dry heat", "e.g. browning of toast or bread"], "dp": ["Thickening a sauce", "Sugar melting", "Gluten forming"], "mand": 0}, {"id": "FOD-04-017", "t": 4, "s": "3.3.2.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>caramelisation<\/b>?", "a": ["<b>Sugar browns<\/b> and changes flavour when heated (1)", "Forms <b>caramel<\/b> (1)"], "cp": ["Sugar browns and changes flavour when heated", "Forms caramel"], "dp": ["Starch thickening", "Protein setting", "Fat separating"], "mand": 0}, {"id": "FOD-04-018", "t": 4, "s": "3.3.2.3", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four functional properties<\/b> of fats and oils.", "a": ["<b>Shortening<\/b> (1)", "<b>Aeration<\/b> (1)", "<b>Plasticity<\/b> (1)", "<b>Emulsification<\/b> (1)"], "cp": ["Shortening", "Aeration", "Plasticity", "Emulsification"], "dp": ["Gelatinisation, dextrinisation, denaturation and coagulation", "Boiling, baking, roasting and steaming", "Salting, drying, freezing and canning"], "mand": 0}, {"id": "FOD-04-019", "t": 4, "s": "3.3.2.3", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>shortening<\/b>?", "a": ["Fat coats flour and <b>stops long gluten strands<\/b> forming (1)", "Gives <b>short, crumbly<\/b> texture, e.g. pastry (1)"], "cp": ["Fat coats flour and stops long gluten strands forming", "Gives short, crumbly texture, e.g. pastry"], "dp": ["Making a recipe sh ast)"], "dp": ["Salt, sugar, fat and water", "Boiling, baking, roasting and steaming", "Marinating, tenderising, setting and glazing"], "mand": 0}, {"id": "FOD-04-024", "t": 4, "s": "3.3.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>chemical raising agent<\/b> works.", "a": ["<b>Baking powder or bicarbonate<\/b> reacts with moisture and heat (1)", "Produces <b>carbon dioxide<\/b> (1)", "Gas expands to make the mixture <b>rise<\/b> (1)"], "cp": ["Baking powder or bicarbonate reacts with moisture and heat", "Produces carbon dioxide", "Gas expands to make the mixture rise"], "dp": ["It produces steam only", "It cools the mix", "It adds protein"], "mand": 0}, {"id": "FOD-04-025", "t": 4, "s": "3.3.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>yeast<\/b> raises bread.", "a": ["Yeast <b>ferments sugar<\/b> (1)", "Produces <b>carbon dioxide<\/b> (1)", "Gas is trapped by <b>gluten<\/b>, making dough rise (1)"], "cp": ["Yeast ferments sugar", "Produces carbon dioxide", "Gas is trapped by gluten, making dough rise"], "dp": ["Yeast produces steam", "Yeast is a chemical agent", "Yeast removes gluten"], "mand": 0}, {"id": "FOD-04-026", "t": 4, "s": "3.3.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>steam<\/b> raises <b>choux pastry<\/b>.", "a": ["Water in the mixture turns to <b>steam<\/b> (1)", "Steam <b>expands<\/b> in the oven (1)", "Raises and <b>puffs<\/b> the pastry (1)"], "cp": ["Water in the mixture turns to steam", "Steam expands in the oven", "Raises and puffs the pastry"], "dp": ["It uses baking powder", "It uses yeast", "It does not rise"], "mand": 0}, {"id": "FOD-04-027", "t": 4, "s": "3.3.2.1", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'gelatinisation is protein setting'<\/b> wrong?", "a": ["Gelatinisation is <b>starch<\/b> thickening (1)", "Protein setting is <b>coagulation<\/b> (1)"], "cp": ["Gelatinisation is starch thickening", "Protein setting is coagulation"], "dp": ["It is protein setting", ching vegetables before freezing", "Using acid (lemon juice) to prevent browning", "Cooling or freezing slows enzymes"], "dp": ["Leaving food in the sun", "Adding sugar", "Cutting food earlier"], "mand": 0}, {"id": "FOD-05-006", "t": 5, "s": "3.4.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three signs of food spoilage<\/b>.", "a": ["Any three (1 each):", "• <b>mould<\/b> growth", "• <b>bad smell<\/b>", "• <b>slimy texture<\/b>", "• <b>colour change<\/b>", "• <b>sour taste<\/b>"], "cp": ["mould growth", "bad smell", "slimy texture", "colour change", "sour taste"], "dp": ["A fresh smell", "Firm texture", "Bright colour"], "mand": 0}, {"id": "FOD-05-007", "t": 5, "s": "3.4.1.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three uses of microorganisms<\/b> in food production.", "a": ["<b>Moulds<\/b> produce blue cheese (1)", "<b>Yeast<\/b> raises bread (1)", "<b>Bacteria<\/b> make yoghurt and cheese (1)"], "cp": ["Moulds produce blue cheese", "Yeast raises bread", "Bacteria make yoghurt and cheese"], "dp": ["Bacteria make sugar", "Yeast makes salt", "Moulds make butter"], "mand": 0}, {"id": "FOD-05-008", "t": 5, "s": "3.4.1.4", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three food poisoning bacteria<\/b>.", "a": ["Any three (1 each):", "• <b>Salmonella<\/b>", "• <b>Campylobacter<\/b>", "• <b>E. coli<\/b>", "• <b>Listeria<\/b>", "• <b>Staphylococcus aureus<\/b>"], "cp": ["Salmonella", "Campylobacter", "E. coli", "Listeria", "Staphylococcus aureus"], "dp": ["Lactobacillus and yeast", "Penicillium and mould", "Vitamin K"], "mand": 0}, {"id": "FOD-05-009", "t": 5, "s": "3.4.1.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three sources of bacterial contamination<\/b>.", "a": ["Any three (1 each):", "• <b>raw meat, poultry, eggs<\/b>", "• <b>work surfaces and equipment<\/b>", "• <b>people<\/b> handling food", "• <b>pests<\/b>", "• <b>waste food<\/b>"], "cp": ["raw meat, poultry, eggs", "work surfaces and equipment", "people handling food", "pests", "waste food"], "dp": ["Clean water only", "Sealed tins", "Fresh air only"], "mand": 0}, {"id": "FOD-05-010", "t": 5, "s": "3.4.1.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three general symptoms<\/b> of food poisoning.", "a": ["Any three (1 each):", "• <b>vomiting<\/b>", "• <b>diarrhoea<\/b>", "• <b>stomach pains<\/b>", "• <b>fever<\/b>", "• <b>nausea<\/b>"], "cp": ["vomiting", "diarrhoea", "stomach pains", "fever", "nausea"], "dp": ["Stronger bones", "Better sleep", "Weight gain"], "mand": 0}, {"id": "FOD-05-011", "t": 5, "s": "3.4.2.1", "k": "Recall", "m": 4, "ht": false, "q": "State <b>four key temperatures<\/b> in food safety.", "a": ["<b>Freezer<\/b> −18°C (1)", "<b>Fridge<\/b> below 5°C (1)", "<b>Danger zone<\/b> 5 to 63°C (1)", "<b>Cook and reheat<\/b> to 75°C core (1)"], "cp": ["Freezer −18°C", "Fridge below 5°C", "Danger zone 5 to 63°C", "Cook and reheat to 75°C core"], "dp": ["Freezer 0°C, fridge 20°C", "Danger zone 100 to 200°C", "Cook at 30°C"], "mand": 0}, {"id": "FOD-05-012", "t": 5, "s": "3.4.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>danger zone<\/b> and why is it important?", "a": ["<b>5 to 63°C<\/b> (1)", "Bacteria <b>multiply fastest<\/b> in this range (1)"], "cp": ["5 to 63°C", "Bacteria multiply fastest in this range"], "dp": ["-18 to 0°C", "75 to 100°C", "0 to 5°C"], "mand": 0}, {"id": "FOD-05-013", "t": 5, "s": "3.4.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>'use by'<\/b> and <b>'best before'<\/b>?", "a": ["<b>Use by<\/b>: a <b>safety<\/b> date, do not eat after (1)", "<b>Best before<\/b>: about <b>quality<\/b>, safe but may be less good (1)"], "cp": ["Use by: a safety date, do not eat after", "Best before: about quality, safe but may be less good"], "dp": ["They mean the same", "Best before is a safety date", "Use by is about colour"], "mand": 0}, {"id": "FOD-05-014", "t": 5, "s": "3.4.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how to <b>store food safely<\/b> in a fridge.", "a": ["Keep below <b>5°C<\/b> (1)", "Store <b>raw meat on the bottom shelf<\/b> (1)", "<b>Cover<\/b> food and keep cooked and raw apart (1)"], "cp": ["Keep below 5°C", "Store raw meat on the bottom shelf", "Cover food and keep cooked and raw apart"], "dp": ["Store raw meat at the top", "Leave food uncovered", "Keep fridge at 15°C"], "mand": 0}, {"id": "FOD-05-015", "t": 5, "s": "3.4.2.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three rules of personal hygiene<\/b> when preparing food.", "a": ["Any three (1 each):", "• <b>wash hands<\/b>", "• <b>tie back hair<\/b>", "• wear a <b>clean apron<\/b>", "• <b>cover cuts<\/b> with plasters", "• no <b>jewellery<\/b>"], "cp": ["wash hands", "tie back hair", "wear a clean apron", "cover cuts with plasters", "no jewellery"], "dp": ["Wear dirty clothes", "Wipe hands on apron", "Touch your hair often"], "mand": 0}, {"id": "FOD-05-016", "t": 5, "s": "3.4.2.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>cross-contamination<\/b>?", "a": ["Bacteria <b>spread from one food to another<\/b> (1)", "e.g. raw meat to <b>ready-to-eat<\/b> foods (1)"], "cp": ["Bacteria spread from one food to another", "e.g. raw meat to ready-to-eat foods"], "dp": ["Cooking two foods together", "Chilling foods", "Adding salt"], "mand": 0}, {"id": "FOD-05-017", "t": 5, "s": "3.4.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how to <b>prevent cross-contamination<\/b>.", "a": ["Use <b>separate chopping boards and utensils<\/b> (1)", "<b>Wash hands<\/b> and surfaces after raw meat (1)", "<b>Store raw and cooked<\/b> foods apart (1)"], "cp": ["Use separate chopping boards and utensils", "Wash hands and surfaces after raw meat", "Store raw and cooked foods apart"], "dp": ["Use one board for everything", "Rinse raw chicken in the sink", "Do not clean surfaces"], "mand": 0}, {"id": "FOD-05-018", "t": 5, "s": "3.4.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how to <b>use a temperature probe<\/b> to check food.", "a": ["Insert into the <b>centre (core)<\/b> of the food (1)", "Check it reaches <b>75°C<\/b> (1)", "<b>Clean the probe<\/b> between foods (1)"], "cp": ["Insert into the centre (core) of the food", "Check it reaches 75°C", "Clean the probe between foods"], "dp": ["Touch the edge of the pan", "Check the outside only", "Never use a probe"], "mand": 0}, {"id": "FOD-05-019", "t": 5, "s": "3.4.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>safe defrosting and reheating<\/b>.", "a": ["Defrost <b>thoroughly in the fridge<\/b> (1)", "Reheat to <b>75°C<\/b> core (1)", "<b>Reheat once only<\/b> (1)"], "cp": ["Defrost thoroughly in the fridge", "Reheat to 75°C core", "Reheat once only"], "dp": ["Defrost on the counter for days", "Reheat repeatedly", "Reheat to 20°C"], "mand": 0}, {"id": "FOD-05-020", "t": 5, "s": "3.4.2.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways to check food is cooked<\/b>.", "a": ["Any three (1 each):", "• <b>temperature probe<\/b>", "• <b>skewer or knife<\/b>", "• <b>colour<\/b>", "• <b>texture (poke test)<\/b>", "• <b>juices run clear<\/b>"], "cp": ["temperature probe", "skewer or knife", "colour", "texture (poke test)", "juices run clear"], "dp": ["Guess by smell", "Wait an hour", "Taste raw meat"], "mand": 0}, {"id": "FOD-05-021", "t": 5, "s": "3.4.2.2", "k": "Explain", "m": 3, "ht": false, "q": "Why must <b>high-risk foods<\/b> be handled with extra care?", "a": ["They <b>support bacteria<\/b> (1)", "They are <b>eaten without further cooking<\/b> (1)", "So keep <b>chilled and covered<\/b> (1)"], "cp": ["They support bacteria", "They are eaten without further cooking", "So keep chilled and covered"], "dp": ["They never spoil", "They are always cooked", "They are low in moisture"], "mand": 0}, {"id": "FOD-05-022", "t": 5, "s": "3.4.1.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'freezing kills bacteria'<\/b>. What is wrong?", "a": ["Freezing makes bacteria <b>dormant<\/b>, not dead (1)", "They can <b>grow again<\/b> when thawed (1)"], "cp": ["Freezing makes bacteria dormant, not dead", "They can grow again when thawed"], "dp": ["Freezing destroys all bacteria", "Freezing makes bacteria multiply", "Freezing adds vitamins"], "mand": 0}, {"id": "FOD-05-023", "t": 5, "s": "3.4.2.1", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'the danger zone is 0 to 5°C'<\/b> wrong?", "a": ["It is <b>5 to 63°C<\/b> (1)", "Fridge temperature (<b>below 5°C<\/b>) slows growth (1)"], "cp": ["It is 5 to 63°C", "Fridge temperature (below 5°C) slows growth"], "dp": ["It is correct", "Danger zone is 63 to 100°C", "Danger zone is −18°C"], "mand": 0}, {"id": "FOD-06-001", "t": 6, "s": "3.5.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three factors<\/b> that influence food choice.", "a": ["Any three (1 each):", "• <b>cost<\/b>", "• <b>time<\/b>", "• <b>lifestyle<\/b>", "• <b>preference<\/b>", "• <b>seasonality<\/b>"], "cp": ["cost", "time", "lifestyle", "preference", "seasonality"], "dp": ["Hair colour", "Shoe size", "Colour of the fridge"], "mand": 0}, {"id": "FOD-06-002", "t": 6, "s": "3.5.1.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>cost and income<\/b> affect food choice.", "a": ["Lower income means choosing <b>cheaper<\/b> foods (1)", "People may buy <b>budget or own-brand<\/b> products (1)", "Higher income allows <b>more variety or premium<\/b> foods (1)"], "cp": ["Lower income means choosing cheaper foods", "People may buy budget or own-brand products", "Higher income allows more variety or premium foods"], "dp": ["Income does not matter", "Everyone buys the same food", "Cost only matters to shops"], "mand": 0}, {"id": "FOD-06-003", "t": 6, "s": "3.5.1.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>time available<\/b> influences meal choice.", "a": ["Less time means <b>ready meals or quick recipes<\/b> (1)", "More time allows <b>cooking from scratch<\/b> (1)", "Planning ahead and <b>batch cooking<\/b> can save time (1)"], "cp": ["Less time means ready meals or quick recipes", "More time allows cooking from scratch", "Planning ahead and batch cooking can save time"], "dp": ["Time has no effect", "Everyone cooks from scratch", "Ready meals take hours"], "mand": 0}, {"id": "FOD-06-004", "t": 6, "s": "3.5.1.1", "k": "Calculation", "m": 3, "ht": false, "q": "A recipe costs £12 for 4 portions. Calculate the <b>cost per portion<\/b>.", "a": ["Total cost ÷ portions (1)", "£12 ÷ 4 (1)", "= <b>£3 per portion<\/b> (1)"], "cp": ["Total cost ÷ portions", "£12 ÷ 4", "= £3 per portion"], "dp": ["£48", "£16", "£1.50"], "mand": 0}, {"id": "FOD-06-005", "t": 6, "s": "3.5.1.1", "k": "Calculation", "m": 3, "ht": false, "q": "A recipe costs £9 for 6 portions. A shop sells the dish for £2.50 a portion. Calculate the <b>profit per portion<\/b>.", "a": ["Cost per portion = £9 ÷ 6 = £1.50 (1)", "Profit = £2.50 - £1.50 (1)", "= <b>£1.00<\/b> (1)"], "cp": ["Cost per portion = £9 ÷ 6 = £1.50", "Profit = £2.50 - £1.50", "= £1.00"], "dp": ["£4.00", "£0.50", "£1.50"], "mand": 0}, {"id": "FOD-06-006", "t": 6, "s": "3.5.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three religions<\/b> and one food rule each.", "a": ["e.g. <b>Hindu<\/b>: many are vegetarian and avoid beef (1)", "e.g. <b>Muslim<\/b>: no pork, <b>halal<\/b> meat (1)", "e.g. <b>Jewish<\/b>: kosher, no pork or shellfish (1)"], "cp": ["e.g. Hindu: many are vegetarian and avoid beef", "e.g. Muslim: no pork, halal meat", "e.g. Jewish: kosher, no pork or shellfish"], "dp": ["Christian: no food rules ever", "Sikh: all foods are banned", "Buddhist: must eat meat daily"], "mand": 0}, {"id": "FOD-06-007", "t": 6, "s": "3.5.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>religion or culture<\/b> can influence food choice.", "a": ["Some foods are <b>forbidden<\/b> (1)", "Some are eaten at <b>festivals<\/b> (1)", "Meat may need <b>special preparation<\/b> (halal or kosher) (1)"], "cp": ["Some foods are forbidden", "Some are eaten at festivals", "Meat may need special preparation (halal or kosher)"], "dp": ["Religion has no effect", "All religions eat the same", "Only cost matters"], "mand": 0}, {"id": "FOD-06-008", "t": 6, "s": "3.5.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ethical or moral reasons<\/b> for food choice.", "a": ["Any three (1 each):", "• <b>animal welfare<\/b>", "• <b>Fairtrade<\/b>", "• <b>local produce<\/b>", "• <b>organic<\/b>", "• avoiding <b>GM foods<\/b>"], "cp": ["animal welfare", "Fairtrade", "local produce", "organic", "avoiding GM foods"], "dp": ["Hair colour", "Colour of packaging only", "Price alone"], "mand": 0}, {"id": "FOD-06-009", "t": 6, "s": "3.5.1.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>Fairtrade<\/b>?", "a": ["Farmers in developing countries receive a <b>fair price<\/b> (1)", "And better <b>working conditions<\/b> (1)"], "cp": ["Farmers in developing countries receive a fair price", "And better working conditions"], "dp": ["A cheap food shop", "A type of organic farm", "A GM label"], "mand": 0}, {"id": "FOD-06-010", "t": 6, "s": "3.5.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three foods<\/b> that cause allergies.", "a": ["Any three (1 each):", "• <b>nuts<\/b>", "• <b>egg<\/b>", "• <b>milk<\/b>", "• <b>wheat<\/b>", "• <b>fish<\/b>", "• <b>shellfish<\/b>"], "cp": ["nuts", "egg", "milk", "wheat", "fish", "shellfish"], "dp": ["Water", "Salt", "Pure sugar"], "mand": 0}, {"id": "FOD-06-011", "t": 6, "s": "3.5.1.2", "k": "Compare", "m": 3, "ht": false, "q": "Compare a <b>food allergy<\/b> with a <b>food intolerance<\/b>.", "a": ["<b>Allergy<\/b>: immune reaction, can be <b>life-threatening<\/b> (anaphylaxis) (1)", "<b>Intolerance<\/b>: digestive problem, not usually dangerous, e.g. lactose or gluten (1)", "Both need <b>avoiding the trigger food<\/b> (1)"], "cp": ["Allergy: immune reaction, can be life-threatening (anaphylaxis)", "Intolerance: digestive problem, not usually dangerous, e.g. lactose or gluten", "Both need avoiding the trigger food"], "dp": ["Allergy is only mild", "Intolerance is always fatal", "They are identical"], "mand": 0}, {"id": "FOD-06-012", "t": 6, "s": "3.5.1.3", "k": "Recall", "m": 3, "ht": false, "q": "State <b>three pieces of mandatory information<\/b> on a food label.", "a": ["Any three (1 each):", "• <b>name<\/b> of the food", "• <b>ingredients<\/b> (allergens bold)", "• <b>weight or volume<\/b>", "• <b>use by / best before<\/b>", "• <b>storage<\/b> and cooking instructions"], "cp": ["name of the food", "ingredients (allergens bold)", "weight or volume", "use by / best before", "storage and cooking instructions"], "dp": ["A price tag only", "A photograph only", "A recipe"], "mand": 0}, {"id": "FOD-06-013", "t": 6, "s": "3.5.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>why ingredients are listed<\/b> in a set order.", "a": ["In <b>descending order of weight<\/b> (1)", "Largest amount first (1)", "Helps people avoid <b>allergens<\/b> and judge healthiness (1)"], "cp": ["In descending order of weight", "Largest amount first", "Helps people avoid allergens and judge healthiness"], "dp": ["Alphabetical order", "Order of price", "No set order"], "mand": 0}, {"id": "FOD-06-014", "t": 6, "s": "3.5.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>how traffic-light labelling<\/b> helps consumers.", "a": ["<b>Red, amber and green<\/b> show high, medium and low levels (1)", "Covers <b>fat, saturates, sugar and salt<\/b> (1)", "Makes <b>comparing<\/b> products easier (1)"], "cp": ["Red, amber and green show high, medium and low levels", "Covers fat, saturates, sugar and salt", "Makes comparing products easier"], "dp": ["It shows price", "It shows recipes", "It shows brand names only"], "mand": 0}, {"id": "FOD-06-015", "t": 6, "s": "3.5.1.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three marketing influences<\/b> on food choice.", "a": ["Any three (1 each):", "• <b>multi-buy offers<\/b>", "• <b>special offers<\/b>", "• <b>meal deals<\/b>", "• <b>advertising<\/b> and media", "• <b>point-of-sale<\/b> displays"], "cp": ["multi-buy offers", "special offers", "meal deals", "advertising and media", "point-of-sale displays"], "dp": ["Weather", "Colour of the car park", "None"], "mand": 0}, {"id": "FOD-06-016", "t": 6, "s": "3.5.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>how a supermarket's point-of-sale marketing<\/b> influences customers.", "a": ["Items placed at <b>checkouts or eye level<\/b> (1)", "Encourages <b>impulse buying<\/b> (1)", "Offers and displays make products <b>look attractive<\/b> (1)"], "cp": ["Items placed at checkouts or eye level", "Encourages impulse buying", "Offers and displays make products look attractive"], "dp": ["It reduces sales", "It hides products", "It lowers prices only"], "mand": 0}, {"id": "FOD-06-017", "t": 6, "s": "3.5.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>cuisine<\/b>?", "a": ["A <b>regional or national style<\/b> of cooking (1)", "With distinctive <b>ingredients, methods and serving styles<\/b> (1)"], "cp": ["A regional or national style of cooking", "With distinctive ingredients, methods and serving styles"], "dp": ["A type of kitchen", "A recipe book", "A shop"], "mand": 0}, {"id": "FOD-06-018", "t": 6, "s": "3.5.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>features of one cuisine<\/b> you have studied (e.g. Italian).", "a": ["Typical <b>ingredients<\/b> (e.g. pasta, tomatoes, olive oil) (1)", "Typical <b>methods or equipment<\/b> (1)", "<b>Eating pattern or presentation<\/b> style (1)"], "cp": ["Typical ingredients (e.g. pasta, tomatoes, olive oil)", "Typical methods or equipment", "Eating pattern or presentation style"], "dp": ["No typical ingredients", "Only one dish", "Cuisines never change"], "mand": 0}, {"id": "FOD-06-019", "t": 6, "s": "3.5.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of sensory test<\/b>.", "a": ["<b>Preference tests<\/b> (paired preference, hedonic) (1)", "<b>Discrimination tests<\/b> (triangle) (1)", "<b>Grading tests<\/b> (ranking, rating, profiling) (1)"], "cp": ["Preference tests (paired preference, hedonic)", "Discrimination tests (triangle)", "Grading tests (ranking, rating, profiling)"], "dp": ["Boiling, baking and roasting", "Fat, protein and carbohydrate", "Cutting, peeling and grating"], "mand": 0}, {"id": "FOD-06-020", "t": 6, "s": "3.5.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>triangle test<\/b>?", "a": ["A <b>discrimination test<\/b> using three samples (1)", "Two are the same; the taster picks the <b>odd one out<\/b> (1)"], "cp": ["A discrimination test using three samples", "Two are the same; the taster picks the odd one out"], "dp": ["A test of price", "A test of protein", "A test of cooking time"], "mand": 0}, {"id": "FOD-06-021", "t": 6, "s": "3.5.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>hedonic rating test<\/b>?", "a": ["Tasters rate <b>how much they like<\/b> a food on a scale (1)", "e.g. from <b>'dislike a lot' to 'like a lot'<\/b> (1)"], "cp": ["Tasters rate how much they like a food on a scale", "e.g. from 'dislike a lot' to 'like a lot'"], "dp": ["A test of weight", "A test of nutrients", "A test of temperature"], "mand": 0}, {"id": "FOD-06-022", "t": 6, "s": "3.5.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how to <b>set up a fair sensory test<\/b>.", "a": ["Give <b>identical sample sizes<\/b> (1)", "Use <b>coded samples<\/b> and cleanse the palate between (1)", "Use <b>the same conditions<\/b> for all tasters (1)"], "cp": ["Give identical sample sizes", "Use coded samples and cleanse the palate between", "Use the same conditions for all tasters"], "dp": ["Tell tasters which is which", "Change conditions each time", "Use different temperatures"], "mand": 0}, {"id": "FOD-06-023", "t": 6, "s": "3.5.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>the four senses<\/b> in food evaluation and one example each.", "a": ["<b nventional: uses chemicals to increase yield", "Organic is often more expensive"], "dp": ["Organic uses the most chemicals", "Conventional avoids chemicals", "They are the same"], "mand": 0}, {"id": "FOD-07-003", "t": 7, "s": "3.6.1.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>free-range<\/b> and <b>intensive<\/b> farming.", "a": ["<b>Free-range<\/b>: animals have <b>outdoor access<\/b> (1)", "<b>Intensive<\/b>: many animals kept <b>indoors<\/b> at low cost (1)", "Free-range often costs <b>more<\/b> but animal welfare is higher (1)"], "cp": ["Free-range: animals have outdoor access", "Intensive: many animals kept indoors at low cost", "Free-range often costs more but animal welfare is higher"], "dp": ["Free-range keeps animals in cages", "Intensive has most outdoor access", "Both cost the same"], "mand": 0}, {"id": "FOD-07-004", "t": 7, "s": "3.6.1.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one advantage and one disadvantage<\/b> of <b>locally produced food<\/b>.", "a": ["Advantage: fewer <b>transport emissions<\/b> and fresher (1)", "Advantage: supports <b>local economy<\/b> (1)", "Disadvantage: <b>limited variety or seasonal<\/b> and sometimes dearer (1)"], "cp": ["Advantage: fewer transport emissions and fresher", "Advantage: supports local economy", "Disadvantage: limited variety or seasonal and sometimes dearer"], "dp": ["No advantage", "Always cheaper", "Transport emissions are higher"], "mand": 0}, {"id": "FOD-07-005", "t": 7, "s": "3.6.1.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>what sustainable fishing<\/b> means.", "a": ["Catching fish <b>at a rate stocks can recover<\/b> (1)", "Avoids <b>overfishing<\/b> (1)", "Uses <b>nets and quotas<\/b> to protect young fish and habitats (1)"], "cp": ["Catching fish at a rate stocks can recover", "Avoids overfishing", "Uses nets and quotas to protect young fish and habitats"], "dp": ["Catching every fish", "Using no rules", "Using only fish farms"], "mand": 0}, {"id": "FOD-07   const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
render();
</script>
</body>
