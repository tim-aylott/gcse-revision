mand": 0}, {"id": "GEO-04-024", "t": 4, "s": "4.3", "k": "Data", "m": 3, "ht": false, "q": "Describe the <b>features of a flood hydrograph<\/b>: lag time, peak discharge, rising limb.", "a": ["<b>Peak discharge<\/b> is the highest flow (1)", "<b>Lag time<\/b> is the time between peak rainfall and peak discharge (1)", "<b>Rising limb<\/b> is the part where discharge increases rapidly (1)"], "cp": ["Peak discharge is the highest flow", "Lag time is the time between peak rainfall and peak discharge", "Rising limb is the part where discharge increases rapidly"], "dp": ["Lag time is the time rainfall lasts", "Peak discharge is the lowest flow", "The rising limb is the falling part"], "mand": 0}, {"id": "GEO-04-025", "t": 4, "s": "4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a <b>short lag time<\/b> is common in urban areas.", "a": ["Hard surfaces are <b>impermeable<\/b> (1)", "Water runs quickly into <b>drains<\/b> (1)", "Less <b>infiltration<\/b> so more surface runoff reaches the river fast (1)"], "cp": ["Hard surfaces are impermeable", "Water runs quickly into drains", "Less infiltration so more surface runoff reaches the river fast"], "dp": ["Soil absorbs most rain", "There are more trees to slow water", "Urban areas are always on high ground"], "mand": 0}, {"id": "GEO-04-026", "t": 4, "s": "4.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three hard engineering<\/b> river management methods.", "a": ["Any three (1 each):", "• <b>dams and reservoirs<\/b>", "• <b>embankments<\/b>", "• <b>straightening<\/b> channels", "• <b>flood relief channels<\/b>", "• <b>dredging<\/b>"], "cp": ["dams and reservoirs", "embankments", "straightening channels", "flood relief channels", "dredging"], "dp": ["Flood warnings", "Planting trees", "Floodplain zoning"], "mand": 0}, {"id": "GEO-04-027", "t": 4, "s": "4.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three soft engineering<\/b> river management methods.", "a": ["Any three (1 each):", "• <b>flood warnings<\/b> and preparation", "• <b>floodplain zoning<\/b> (no building)", "• <b>afforestation<\/b> (planting trees)", "• <b>river restoration<\/b> (re-meandering)", "• <b>washlands<\/b>"], "cp": ["flood warnings and preparation", "floodplain zoning (no building)", "afforestation (planting trees)", "river restoration (re-meandering)", "washlands"], "dp": ["Dams", "Embankments", "Concrete channels"], "mand": 0}, {"id": "GEO-04-028", "t": 4, "s": "4.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>river straightening or embankments<\/b> as flood management.", "a": ["Advantage: can speed water out and protect nearby areas (1)", "Advantage: protects homes and farmland (1)", "Disadvantage: <b>expensive<\/b> and may increase flood risk downstream (1)", "Disadvantage: spoils <b>habitats<\/b> and appearance (1)"], "cp": ["Advantage: can speed water out and protect nearby areas", "Advantage: protects homes and farmland", "Disadvantage: expensive and may increase flood risk downstream", "Disadvantage: spoils habitats and appearance"], "dp": ["No downsides at all", "They reduce flood risk everywhere", "They are free to build"], "mand": 0}, {"id": "GEO-04-029", "t": 4, "s": "4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>soft engineering<\/b> such as river restoration can reduce flooding.", "a": ["Re-creating <b>meanders and wetlands<\/b> slows the flow (1)", "Water spreads onto the <b>floodplain<\/b> instead of downstream towns (1)", "It increases <b>lag time<\/b> and benefits wildlife (1)"], "cp": ["Re-creating meanders and wetlands slows the flow", "Water spreads onto the floodplain instead of downstream towns", "It increases lag time and benefits wildlife"], "dp": ["It speeds water down the channel", "It creates more concrete", "It reduces biodiversity"], "mand": 0}, {"id": "GEO-04-030", "t": 4, "s": "4.3", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'rivers erode in the lower course more than the upper course'<\/b>. Is this right?", "a": ["No: the upper course has <b>more vertical erosion<\/b> (1)", "The lower course is dominated by <b>deposition and lateral erosion<\/b> (1)"], "cp": ["No: the upper course has more vertical erosion", "The lower course is dominated by deposition and lateral erosion"], "dp": ["Yes, always", "Erosion does not happen in rivers", "Rivers do not have upper courses"], "mand": 0}, {"id": "GEO-04-031", "t": 4, "s": "4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>geology<\/b> affects the shape of the UK coastline.", "a": ["<b>Hard rock<\/b> forms headlands and cliffs (1)", "<b>Soft rock<\/b> erodes quickly into bays and gentle slopes (1)", "Layers and <b>joints<\/b> affect where caves and arches form (1)"], "cp": ["Hard rock forms headlands and cliffs", "Soft rock erodes quickly into bays and gentle slopes", "Layers and joints affect where caves and arches form"], "dp": ["Geology does not affect coasts", "Wind alone shapes cliffs", "Soft rock forms headlands"], "mand": 0}, {"id": "GEO-05-001", "t": 5, "s": "5.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>pattern of population distribution<\/b> in the UK.", "a": ["Highest densities in <b>cities and the South East<\/b> (1)", "Lowest densities in <b>upland rural areas<\/b>, such as the Scottish Highlands (1)", "Population clusters around <b>major cities and transport routes<\/b> (1)"], "cp": ["Highest densities in cities and the South East", "Lowest densities in upland rural areas, such as the Scottish Highlands", "Population clusters around major cities and transport routes"], "dp": ["Population is even across the UK", "The Highlands are the most densely populated", "Most people live on mountains"], "mand": 0}, {"id": "GEO-05-002", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>some areas of the UK are densely populated<\/b>.", "a": ["Many <b>jobs and services<\/b> (1)", "Good <b>transport links<\/b> and flat, easy-to-build land (1)", "Historical industries or ports drew people in (1)"], "cp": ["Many jobs and services", "Good transport links and flat, easy-to-build land", "Historical industries or ports drew people in"], "dp": ["Poor roads and few jobs", "Steep land that is difficult to build on", "Harsh weather"], "mand": 0}, {"id": "GEO-05-003", "t": 5, "s": "5.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>north-south divide<\/b> in the UK?", "a": ["Differences in <b>wealth, jobs and living standards<\/b> between the north and south (1)", "The South East generally has <b>higher incomes and house prices<\/b> (1)"], "cp": ["Differences in wealth, jobs and living standards between the north and south", "The South East generally has higher incomes and house prices"], "dp": ["A river that divides England", "A road between London and Edinburgh", "A line that splits the UK into equal halves"], "mand": 0}, {"id": "GEO-05-004", "t": 5, "s": "5.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>how the UK population is changing<\/b>.", "a": ["An <b>ageing population<\/b> (more over 65s) (1)", "Increasing <b>ethnic diversity<\/b> through migration (1)", "<b>Rural areas<\/b> losing young people while some cities attract them (1)"], "cp": ["An ageing population (more over 65s)", "Increasing ethnic diversity through migration", "Rural areas losing young people while some cities attract them"], "dp": ["The UK has no migration", "Everyone in the UK is under 30", "The proportion of older people is falling"], "mand": 0}, {"id": "GEO-05-005", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>two causes<\/b> of an ageing population in the UK.", "a": ["People are <b>living longer<\/b> due to better healthcare, diet and living conditions (1)", "The <b>birth rate has fallen<\/b> (1)", "<b>Baby boomers<\/b> are now reaching older age (1)"], "cp": ["People are living longer due to better healthcare, diet and living conditions", "The birth rate has fallen", "Baby boomers are now reaching older age"], "dp": ["Death rate has risen sharply", "Older people are leaving the UK", "There are more babies than ever"], "mand": 0}, {"id": "GEO-05-006", "t": 5, "s": "5.1", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two impacts<\/b> of an ageing population.", "a": ["Any two (1 each):", "• greater demand for <b>healthcare and care homes<\/b>", "• higher <b>pension costs<\/b>", "• a smaller <b>working population<\/b> paying taxes", "• growth in <b>services for older people<\/b>"], "cp": ["greater demand for healthcare and care homes", "higher pension costs", "a smaller working population paying taxes", "growth in services for older people"], "dp": ["More schools needed", "Fewer pensions needed", "Lower demand for hospitals"], "mand": 0}, {"id": "GEO-05-007", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>deindustrialisation<\/b> changed the UK economy.", "a": ["Manufacturing and heavy industries such as <b>coal, steel and shipbuilding declined<\/b> (1)", "Competition from <b>cheaper overseas<\/b> producers and automation reduced jobs (1)", "The economy shifted to <b>tertiary and quaternary<\/b> services (1)"], "cp": ["Manufacturing and heavy industries such as coal, steel and shipbuilding declined", "Competition from cheaper overseas producers and automation reduced jobs", "The economy shifted to tertiary and quaternary services"], "dp": ["The UK built more factories in the 1980s", "Agriculture grew rapidly", "Everyone moved into primary jobs"], "mand": 0}, {"id": "GEO-05-008", "t": 5, "s": "5.1", "k": "Definition", "m": 2, "ht": false, "q": "What are the <b>primary, secondary, tertiary and quaternary sectors<\/b>?", "a": ["Primary: raw materials. Secondary: manufacturing (1)", "Tertiary: services. Quaternary: research and high-tech knowledge industries (1)"], "cp": ["Primary: raw materials. Secondary: manufacturing", "Tertiary: services. Quaternary: research and high-tech knowledge industries"], "dp": ["Primary: services. Tertiary: farming", "Secondary: mining. Quaternary: agriculture", "Primary: manufacturing. Tertiary: farming"], "mand": 0}, {"id": "GEO-05-009", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>globalisation<\/b> has changed UK places.", "a": ["<b>Foreign investment<\/b> and TNCs locate in UK (1)", "Some industries <b>moved overseas<\/b>, closing factories (1)", "Increased <b>migration<\/b> and cultural diversity (1)"], "cp": ["Foreign investment and TNCs locate in UK", "Some industries moved overseas, closing factories", "Increased migration and cultural diversity"], "dp": ["It has stopped all trade", "It means no companies from abroad work in the UK", "It has made the UK isolated"], "mand": 0}, {"id": "GEO-05-010", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what causes <b>regional differences<\/b> in the UK economy.", "a": ["<b>Decline of heavy industry<\/b> hit northern and Welsh areas (1)", "The South East has <b>services, finance and London<\/b> (1)", "Differences in <b>investment, skills and transport links<\/b> (1)"], "cp": ["Decline of heavy industry hit northern and Welsh areas", "The South East has services, finance and London", "Differences in investment, skills and transport links"], "dp": ["All regions have equal investment", "Weather alone explains it", "Only farmland causes differences"], "mand": 0}, {"id": "GEO-05-011", "t": 5, "s": "5.2", "k": "Recall", "m": 3, "ht": false, "q": "For your <b>major UK city case study<\/b>, what three things should you know?", "a": ["Its <b>location and function<\/b> (e.g. regional or national role) (1)", "How it has <b>changed<\/b>: causes of growth, migration and economic change (1)", "Its <b>challenges and opportunities<\/b>, and how they are managed (1)"], "cp": ["Its location and function (e.g. regional or national role)", "How it has changed: causes of growth, migration and economic change", "Its challenges and opportunities, and how they are managed"], "dp": ["Only its name", "Only the weather", "Only its football club"], "mand": 0}, {"id": "GEO-05-012", "t": 5, "s": "5.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three impacts of migration<\/b> on a UK city.", "a": ["Any three (1 each):", "• <b>cultural diversity<\/b> and new food, shops and festivals", "• <b>filling job vacancies<\/b> and skills gaps", "• pressure on <b>housing and services<\/b>", "• <b>growing<\/b> population and demand"], "cp": ["cultural diversity and new food, shops and festivals", "filling job vacancies and skills gaps", "pressure on housing and services", "growing population and demand"], "dp": ["Fewer shops", "Lower cultural diversity", "Fewer jobs filled"], "mand": 0}, {"id": "GEO-05-013", "t": 5, "s": "5.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> urban areas can be regenerated.", "a": ["Any three (1 each):", "• <b>redeveloping brownfield sites<\/b>", "• new <b>housing, shops and offices<\/b>", "• <b>improving transport<\/b>", "• <b>investment in culture<\/b> and sport (rebranding)", "• improving <b>green space<\/b>"], "cp": ["redeveloping brownfield sites", "new housing, shops and offices", "improving transport", "investment in culture and sport (rebranding)", "improving green space"], "dp": ["Closing all businesses", "Demolishing every building", "Moving the city"], "mand": 0}, {"id": "GEO-05-014", "t": 5, "s": "5.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>regeneration<\/b>?", "a": ["<b>Investment to revive<\/b> a run-down area (1)", "Creating <b>jobs, housing and improved services<\/b> (1)"], "cp": ["Investment to revive a run-down area", "Creating jobs, housing and improved services"], "dp": ["Removing all people from an area", "Building only motorways", "Moving a city to a new site"], "mand": 0}, {"id": "GEO-05-015", "t": 5, "s": "5.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>regeneration<\/b> as a way of improving a UK city.", "a": ["Advantage: creates <b>jobs and homes<\/b> (1)", "Advantage: attracts <b>investment and visitors<\/b> (1)", "Disadvantage: <b>rents and prices rise<\/b>, pushing out locals (1)", "Disadvantage: <b>cost<\/b> and disruption, and not all benefit equally (1)"], "cp": ["Advantage: creates jobs and homes", "Advantage: attracts investment and visitors", "Disadvantage: rents and prices rise, pushing out locals", "Disadvantage: cost and disruption, and not all benefit equally"], "dp": ["It never has problems", "It only helps rich areas", "It always costs nothing"], "mand": 0}, {"id": "GEO-05-016", "t": 5, "s": "5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a city can improve <b>sustainability<\/b>.", "a": ["Promote <b>public transport<\/b>, walking and cycling (1)", "Use <b>renewable energy<\/b> and recycling (1)", "Protect <b>green space<\/b> and build energy-efficient homes (1)"], "cp": ["Promote public transport, walking and cycling", "Use renewable energy and recycling", "Protect green space and build energy-efficient homes"], "dp": ["Increase car use", "Remove all parks", "Burn all waste"], "mand": 0}, {"id": "GEO-05-017", "t": 5, "s": "5.3", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>rural population change<\/b> in the UK.", "a": ["Some rural areas gain people through <b>counter-urbanisation<\/b> and commuting (1)", "Remote rural areas lose <b>young people<\/b> (1)", "Rural populations are <b>older<\/b> on average (1)"], "cp": ["Some rural areas gain people through counter-urbanisation and commuting", "Remote rural areas lose young people", "Rural populations are older on average"], "dp": ["All rural areas are growing quickly", "Young people are moving in everywhere", "Rural areas have no commuters"], "mand": 0}, {"id": "GEO-05-018", "t": 5, "s": "5.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>two causes<\/b> of change in rural UK areas.", "a": ["<b>Counter-urbanisation<\/b> and commuters moving in (1)", "<b>Second homes<\/b> and tourism (1)", "Farming <b>mechanisation<\/b> reduces jobs (1)"], "cp": ["Counter-urbanisation and commuters moving in", "Second homes and tourism", "Farming mechanisation reduces jobs"], "dp": ["Rural areas get more factories", "Everyone is moving to farms", "Farming needs more labour"], "mand": 0}, {"id": "GEO-05-019", "t": 5, "s": "5.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three effects<\/b> of second homes in rural areas.", "a": ["Any three (1 each):", "• <b>house prices rise<\/b> beyond locals' means", "• villages empty out outside holiday time", "• <b>shops and schools<\/b> can close", "• benefits for the <b>tourism<\/b> economy", "• less <b>demand for local services<\/b>"], "cp": ["house prices rise beyond locals' means", "villages empty out outside holiday time", "shops and schools can close", "benefits for the tourism economy", "less demand for local services"], "dp": ["More school places", "Cheaper local housing", "More year-round residents"], "mand": 0}, {"id": "GEO-05-020", "t": 5, "s": "5.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>rural-urban fringe<\/b> areas can be affected by development.", "a": ["Pressure for <b>new housing and retail parks<\/b> on green land (1)", "Loss of <b>farmland and habitats<\/b> (1)", "Conflict between <b>developers and green belt<\/b> campaigners (1)"], "cp": ["Pressure for new housing and retail parks on green land", "Loss of farmland and habitats", "Conflict between developers and green belt campaigners"], "dp": ["No development is ever allowed", "The fringe is entirely sealed with trees", "There are no houses on the fringe"], "mand": 0}, {"id": "GEO-05-021", "t": 5, "s": "5.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> UK retailing has changed.", "a": ["Any three (1 each):", "• <b>online shopping<\/b> growth", "• <b>out-of-town<\/b> retail parks and shopping centres", "• <b>high street decline<\/b>", "• growth of <b>supermarkets<\/b> and click-and-collect", "• <b>pedestrianised<\/b> centres"], "cp": ["online shopping growth", "out-of-town retail parks and shopping centres", "high street decline", "growth of supermarkets and click-and-collect", "pedestrianised centres"], "dp": ["More corner shops", "Less online shopping", "No change since 1950"], "mand": 0}, {"id": "GEO-05-022", "t": 5, "s": "5.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why many <b>high streets are in decline<\/b>.", "a": ["Customers shop <b>online<\/b> (1)", "<b>Out-of-town<\/b> centres offer parking and large stores (1)", "<b>High rents and rates<\/b> force shops to close (1)"], "cp": ["Customers shop online", "Out-of-town centres offer parking and large stores", "High rents and rates force shops to close"], "dp": ["Online shopping has stopped", "Rents are very low", "Out-of-town shops have all closed"], "mand": 0}, {"id": "GEO-05-023", "t": 5, "s": "5.1", "k": "Calculation", "m": 2, "ht": false, "q": "A city has 80,000 people in 12 km<sup>2<\/sup>. Calculate its <b>population density<\/b>.", "a": ["Density = population ÷ area (1)", "80,000 ÷ 12 = about <b>6,667 people per km<sup>2<\/sup><\/b> (1)"], "cp": ["Density = population ÷ area", "80,000 ÷ 12 = about 6,667 people per km<sup>2<\/sup>"], "dp": ["960,000 per km<sup>2<\/sup>", "666 per km<sup>2<\/sup>", "12,000 per km<sup>2<\/sup>"], "mand": 0}, {"id": "GEO-05-024", "t": 5, "s": "5.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says <b>'the UK's population is falling because it is ageing'<\/b>. What is wrong?", "a": ["UK population is <b>mostly still increasing<\/b>, mainly through <b>migration<\/b> and natural increase (1)", "Ageing means a <b>higher proportion of older people<\/b>, not necessarily a falling total (1)"], "cp": ["UK population is mostly still increasing, mainly through migration and natural increase", "Ageing means a higher proportion of older people, not necessarily a falling total"], "dp": ["Ageing always reduces population", "Migration reduces the population", "The UK has no older people"], "mand": 0}, {"id": "GEO-06-001", "t": 6, "s": "6.1", "k": "Process", "m": 4, "ht": false, "q": "Put the <b>stages of a geographical enquiry<\/b> in order.", "a": ["Question or hypothesis (1)", "Collect data (primary and secondary) (1)", "Present and analyse results (1)", "Conclude and evaluate (1)"], "cp": ["Question or hypothesis", "Collect data (primary and secondary)", "Present and analyse results", "Conclude and evaluate"], "dp": ["Conclusion, then collect data, then question, then present", "Present results, ask a question, then collect data, then conclude", "Evaluate, conclude, collect data, present"], "mand": 0}, {"id": "GEO-06-002", "t": 6, "s": "6.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>hypothesis<\/b> in fieldwork?", "a": ["A <b>testable statement<\/b> or prediction (1)", "e.g. 'Pebble size decreases downstream' (1)"], "cp": ["A testable statement or prediction", "e.g. 'Pebble size decreases downstream'"], "dp": ["A question with no answer", "A list of equipment", "A summary of results"], "mand": 0}, {"id": "GEO-06-003", "t": 6, "s": "6.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>primary and secondary data<\/b>?", "a": ["<b>Primary<\/b>: data you collect yourself in the field (1)", "<b>Secondary<\/b>: data collected by someone else, such as the census or maps (1)"], "cp": ["Primary: data you collect yourself in the field", "Secondary: data collected by someone else, such as the census or maps"], "dp": ["Primary data is from the internet", "Secondary data is collected by you", "They mean the same thing"], "mand": 0}, {"id": "GEO-06-004", "t": 6, "s": "6.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three sampling methods<\/b>.", "a": ["<b>Random<\/b> sampling (1)", "<b>Systematic<\/b> sampling (every nth sample) (1)", "<b>Stratified<\/b> sampling (proportional to groups) (1)"], "cp": ["Random sampling", "Systematic sampling (every nth sample)", "Stratified sampling (proportional to groups)"], "dp": ["Hopeful, careless and fast", "Quick, slow and equal", "Biased, loose and tidy"], "mand": 0}, {"id": "GEO-06-005", "t": 6, "s": "6.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>sampling<\/b> is used in fieldwork.", "a": ["It is not possible to measure <b>everything<\/b> (1)", "Sampling saves <b>time<\/b> and effort (1)", "A good sample can still be <b>representative<\/b> of the whole area (1)"], "cp": ["It is not possible to measure everything", "Sampling saves time and effort", "A good sample can still be representative of the whole area"], "dp": ["It removes the need for data", "It makes the results less accurate by design", "It is only needed for primary data"], "mand": 0}, {"id": "GEO-06-006", "t": 6, "s": "6.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to manage <b>risk<\/b> on fieldwork.", "a": ["Any three (1 each):", "• complete a <b>risk assessment<\/b>", "• check <b>weather and tides<\/b>", "• wear suitable <b>clothing<\/b> and footwear", "• work in <b>groups<\/b> and stay with a leader", "• carry a <b>first aid kit<\/b> and phone"], "cp": ["complete a risk assessment", "check weather and tides", "wear suitable clothing and footwear", "work in groups and stay with a leader", "carry a first aid kit and phone"], "dp": ["Go alone and in the dark", "Ignore tide times", "Wear flip-flops in a river"], "mand": 0}, {"id": "GEO-06-007", "t": 6, "s": "6.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what is meant by <b>reliability, accuracy and validity<\/b> in a fieldwork evaluation.", "a": ["<b>Reliability<\/b>: whether the results would be the same if repeated (1)", "<b>Accuracy<\/b>: how close measurements are to the true value (1)", "<b>Validity<\/b>: whether the data really answers the enquiry question (1)"], "cp": ["Reliability: whether the results would be the same if repeated", "Accuracy: how close measurements are to the true value", "Validity: whether the data really answers the enquiry question"], "dp": ["Reliability means the data is expensive", "Validity means the data is long", "Accuracy means the data was easy to collect"], "mand": 0}, {"id": "GEO-06-008", "t": 6, "s": "6.1", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>two ways<\/b> you could improve a fieldwork investigation.", "a": ["Take <b>more samples<\/b> or repeat measurements (1)", "Use <b>more sites<\/b> or a wider area (1)", "Collect data at <b>different times<\/b> or use more accurate equipment (1)"], "cp": ["Take more samples or repeat measurements", "Use more sites or a wider area", "Collect data at different times or use more accurate equipment"], "dp": ["Use fewer sites", "Take only one measurement", "Ignore anomalies"], "mand": 0}, {"id": "GEO-06-009", "t": 6, "s": "6.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three measurements<\/b> taken in a river fieldwork enquiry.", "a": ["Any three (1 each):", "• <b>channel width<\/b>", "• <b>depth<\/b>", "• <b>velocity<\/b> (e.g. using a float or flow meter)", "• <b>bedload size and shape<\/b>", "• <b>gradient<\/b>", "• <b>wetted perimeter<\/b>"], "cp": ["channel width", "depth", "velocity (e.g. using a float or flow meter)", "bedload size and shape", "gradient", "wetted perimeter"], "dp": ["Population density", "Pedestrian counts", "Beach slope in an urban area"], "mand": 0}, {"id": "GEO-06-010", "t": 6, "s": "6.2", "k": "Process", "m": 3, "ht": false, "q": "Describe how you would measure <b>river velocity<\/b> with a float.", "a": ["Mark a <b>measured distance<\/b> along the river (1)", "Time a float travelling that distance (1)", "Velocity = <b>distance ÷ time<\/b>, repeating to calculate a mean (1)"], "cp": ["Mark a measured distance along the river", "Time a float travelling that distance", "Velocity = distance ÷ time, repeating to calculate a mean"], "dp": ["Measure the colour of the water", "Count the number of boulders", "Weigh the float"], "mand": 0}, {"id": "GEO-06-011", "t": 6, "s": "6.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>discharge<\/b> is calculated.", "a": ["Discharge = <b>cross-sectional area × velocity<\/b> (1)", "Area = <b>width × average depth<\/b> (1)", "Units are <b>cumecs<\/b> (m<sup>3<\/sup>/s) (1)"], "cp": ["Discharge = cross-sectional area × velocity", "Area = width × average depth", "Units are cumecs (m<sup>3<\/sup>/s)"], "dp": ["Discharge = depth ÷ width", "Discharge = velocity ÷ area", "Discharge is measured in kilograms"], "mand": 0}, {"id": "GEO-06-012", "t": 6, "s": "6.2", "k": "Data", "m": 2, "ht": false, "q": "A river's <b>bedload becomes smaller and rounder downstream<\/b>. Explain why.", "a": ["<b>Attrition<\/b> wears particles down as they move (1)", "Rocks are smoothed and <b>rounded<\/b> by collisions (1)"], "cp": ["Attrition wears particles down as they move", "Rocks are smoothed and rounded by collisions"], "dp": ["Deposition makes stones larger", "Wind makes stones smaller", "Hydraulic action makes stones angular"], "mand": 0}, {"id": "GEO-06-013", "t": 6, "s": "6.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three measurements<\/b> taken in a coastal fieldwork enquiry.", "a": ["Any three (1 each):", "• <b>beach profile<\/b> (slope angle)", "• <b>pebble size and shape<\/b>", "• <b>longshore drift<\/b> speed and direction", "• <b>cliff condition<\/b> or erosion rate", "• <b>sea defence<\/b> survey"], "cp": ["beach profile (slope angle)", "pebble size and shape", "longshore drift speed and direction", "cliff condition or erosion rate", "sea defence survey"], "dp": ["Pedestrian counts", "River velocity", "Traffic count"], "mand": 0}, {"id": "GEO-06-014", "t": 6, "s": "6.3", "k": "Process", "m": 3, "ht": false, "q": "Describe how to complete a <b>beach profile<\/b>.", "a": ["Use <b>ranging poles and a clinometer<\/b> to measure slope (1)", "Measure <b>distance between breaks of slope<\/b> with a tape (1)", "Record angle and distance, then <b>plot the profile<\/b> (1)"], "cp": ["Use ranging poles and a clinometer to measure slope", "Measure distance between breaks of slope with a tape", "Record angle and distance, then plot the profile"], "dp": ["Count shells on the beach", "Measure wind speed only", "Photograph the sea at night"], "mand": 0}, {"id": "GEO-06-015", "t": 6, "s": "6.3", "k": "Data", "m": 2, "ht": false, "q": "Why might <b>pebble size<\/b> change along a beach?", "a": ["Larger stones are deposited where energy is <b>high<\/b> and <b>attrition<\/b> reduces size over distance (1)", "Longshore drift sorts material along the beach, so size and roundness <b>vary along it<\/b> (1)"], "cp": ["Larger stones are deposited where energy is high and attrition reduces size over distance", "Longshore drift sorts material along the beach, so size and roundness vary along it"], "dp": ["Pebbles are carried by wind", "Pebbles get larger with distance", "Pebbles are always the same size"], "mand": 0}, {"id": "GEO-06-016", "t": 6, "s": "6.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three methods<\/b> of collecting data in an urban enquiry.", "a": ["Any three (1 each):", "• <b>environmental quality survey<\/b>", "• <b>pedestrian counts<\/b>", "• <b>questionnaires<\/b>", "• <b>land use mapping<\/b>", "• <b>building condition survey<\/b>"], "cp": ["environmental quality survey", "pedestrian counts", "questionnaires", "land use mapping", "building condition survey"], "dp": ["Measuring river discharge", "Beach profile", "Pebble roundness"], "mand": 0}, {"id": "GEO-06-017", "t": 6, "s": "6.4", "k": "Process", "m": 3, "ht": false, "q": "Describe how to complete an <b>environmental quality survey<\/b>.", "a": ["Choose sites using a <b>sampling method<\/b> (1)", "Score features, such as litter or noise, on a <b>scale<\/b> (1)", "Total or average the scores and <b>map them<\/b> (1)"], "cp": ["Choose sites using a sampling method", "Score features, such as litter or noise, on a scale", "Total or average the scores and map them"], "dp": ["Tick a box if you like the place", "Write a poem", "Take only one photograph"], "mand": 0}, {"id": "GEO-06-018", "t": 6, "s": "6.4", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>one advantage<\/b> and <b>one disadvantage<\/b> of questionnaires.", "a": ["Advantage: collect people's <b>opinions and experiences<\/b> (1)", "Disadvantage: <b>bias<\/b> in who responds or in the questions (1)", "Disadvantage: time-consuming and <b>small samples<\/b> (1)"], "cp": ["Advantage: collect people's opinions and experiences", "Disadvantage: bias in who responds or in the questions", "Disadvantage: time-consuming and small samples"], "dp": ["They are perfectly accurate", "They never take time", "They avoid opinions"], "mand": 0}, {"id": "GEO-06-019", "t": 6, "s": "6.4", "k": "Recall", "m": 2, "ht": false, "q": "What are the <b>CBD, inner city and suburbs<\/b> likely to show in terms of land value or quality?", "a": ["<b>CBD<\/b>: highest land values and tall buildings (1)", "<b>Suburbs<\/b>: lower density, more green space and often higher environmental quality (1)"], "cp": ["CBD: highest land values and tall buildings", "Suburbs: lower density, more green space and often higher environmental quality"], "dp": ["CBD has the cheapest land", "Suburbs have the tallest buildings", "The inner city has no buildings"], "mand": 0}, {"id": "GEO-06-020", "t": 6, "s": "6.5", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> of presenting fieldwork data and when to use each.", "a": ["<b>Bar chart<\/b> to compare categories (1)", "<b>Line graph<\/b> to show change over time or distance (1)", "<b>Scatter graph<\/b> to show relationships between two variables (1)"], "cp": ["Bar chart to compare categories", "Line graph to show change over time or distance", "Scatter graph to show relationships between two variables"], "dp": ["Pie chart for time series", "Line graph for categories", "Tables for relationships only"], "mand": 0}, {"id": "GEO-06-021", "t": 6, "s": "6.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain what a <b>scatter graph<\/b> with a line of best fit shows.", "a": ["The <b>relationship<\/b> between two variables (1)", "The <b>direction<\/b> of correlation: positive or negative (1)", "<b>Anomalies<\/b> that sit far from the line (1)"], "cp": ["The relationship between two variables", "The direction of correlation: positive or negative", "Anomalies that sit far from the line"], "dp": ["The average of all data", "The location of data", "The mode of the data"], "mand": 0}, {"id": "GEO-06-022", "t": 6, "s": "6.5", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three descriptive statistics<\/b> used in geography.", "a": ["<b>Mean<\/b> (1)", "<b>Median<\/b> or <b>mode<\/b> (1)", "<b>Range<\/b> or <b>interquartile range<\/b> (1)"], "cp": ["Mean", "Median or mode", "Range or interquartile range"], "dp": ["Hypothesis, sample and map", "Axis, line and legend", "Scale, key and north arrow"], "mand": 0}, {"id": "GEO-06-023", "t": 6, "s": "6.5", "k": "Exam trap", "m": 2, "ht": false, "q": "An exam asks you to <b>'justify'<\/b> a fieldwork method. What must you do?", "a": ["Give <b>reasons<\/b> why the method suited the enquiry (1)", "Link the method to the <b>hypothesis or question<\/b> (1)"], "cp": ["Give reasons why the method suited the enquiry", "Link the method to the hypothesis or question"], "dp": ["Describe only the equipment", "List the results", "Say it was easy"], "mand": 0}, {"id": "GEO-06-024", "t": 6, "s": "6.1", "k": "Exam trap", "m": 2, "ht": false, "q": "Exam questions often ask about <b>your own fieldwork<\/b>. What helps most?", "a": ["Use <b>specific details<\/b> such as place names, sites and data (1)", "Describe <b>why you chose<\/b> methods and what the results showed (1)"], "cp": ["Use specific details such as place names, sites and data", "Describe why you chose methods and what the results showed"], "dp": ["Describe any fieldwork you read about", "Give general advice only", "Leave out the location"], "mand": 0}, {"id": "GEO-07-001", "t": 7, "s": "7.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>biosphere<\/b>?", "a": ["The part of the Earth where <b>life exists<\/b> (1)", "Includes land, water and air, and the <b>living things<\/b> within them (1)"], "cp": ["The part of the Earth where life exists", "Includes land, water and air, and the living things within them"], "dp": ["The layer of rock under the crust", "The ozone layer", "The part of the sea with no life"], "mand": 0}, {"id": "GEO-07-002", "t": 7, "s": "7.1", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>ecosystem<\/b>?", "a": ["A community of <b>living things<\/b> (plants and animals) interacting with each other (1)", "And with their <b>non-living environment<\/b> (soil, water, climate) (1)"], "cp": ["A community of living things (plants and animals) interacting with each other", "And with their non-living environment (soil, water, climate)"], "dp": ["A single species", "A type of rock", "A group of rivers"], "mand": 0}, {"id": "GEO-07-003", "t": 7, "s": "7.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three roles<\/b> of living things in a food chain.", "a": ["<b>Producers<\/b> make food by photosynthesis (1)", "<b>Consumers<\/b> eat other organisms (1)", "<b>Decomposers<\/b> break down dead material (1)"], "cp": ["Producers make food by photosynthesis", "Consumers eat other organisms", "Decomposers break down dead material"], "dp": ["Predators, parasites and plants", "Herbivores, fish and birds", "Recyclers, planters and growers"], "mand": 0}, {"id": "GEO-07-004", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>nutrient cycle<\/b> works in an ecosystem.", "a": ["Nutrients are stored in <b>biomass, litter and soil<\/b> (1)", "They move by <b>uptake<\/b>, leaf fall and decay (1)", "<b>Decomposers<\/b> return nutrients to the soil (1)"], "cp": ["Nutrients are stored in biomass, litter and soil", "They move by uptake, leaf fall and decay", "Decomposers return nutrients to the soil"], "dp": ["Nutrients never move", "Nutrients only stay in the air", "Decomposers remove nutrients permanently"], "mand": 0}, {"id": "GEO-07-005", "t": 7, "s": "7.1", "k": "Recall", "m": 5, "ht": false, "q": "Name <b>five biomes<\/b> of the world.", "a": ["<b>Tropical rainforest<\/b> (1)", "<b>Savanna<\/b> (1)", "<b>Desert<\/b> (1)", "<b>Tundra<\/b> (1)", "<b>Taiga<\/b> (boreal forest) (1)"], "cp": ["Tropical rainforest", "Savanna", "Desert", "Tundra", "Taiga (boreal forest)"], "dp": ["Meadow, field, garden, orchard and farm", "River, ocean, lake, pond and canal", "Alps, Andes, Rockies, Himalayas and Urals"], "mand": 0}, {"id": "GEO-07-006", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>climate affects the distribution of biomes<\/b>.", "a": ["<b>Temperature and rainfall<\/b> determine which plants grow (1)", "Hot, wet climates near the Equator support <b>rainforest<\/b> (1)", "Cold, dry climates support <b>tundra<\/b> with few plants (1)"], "cp": ["Temperature and rainfall determine which plants grow", "Hot, wet climates near the Equator support rainforest", "Cold, dry climates support tundra with few plants"], "dp": ["Climate has no effect on biomes", "Rainforests grow in deserts", "Tundra grows where it is hot"], "mand": 0}, {"id": "GEO-07-007", "t": 7, "s": "7.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ecosystem services<\/b> provided by the biosphere.", "a": ["Any three (1 each):", "• <b>food and timber<\/b> (provisioning)", "• <b>climate regulation<\/b> through carbon storage", "• <b>water filtering<\/b> and flood regulation", "• <b>recreation<\/b> and culture", "• <b>pollination<\/b> and soil formation"], "cp": ["food and timber (provisioning)", "climate regulation through carbon storage", "water filtering and flood regulation", "recreation and culture", "pollination and soil formation"], "dp": ["Making the Moon bigger", "Producing tectonic plates", "Controlling the tides"], "mand": 0}, {"id": "GEO-07-008", "t": 7, "s": "7.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> people use the biosphere.", "a": ["Any three (1 each):", "• <b>food<\/b> from farming and fishing", "• <b>timber and fuel<\/b>", "• <b>medicines<\/b> from plants", "• <b>water<\/b> supply", "• <b>tourism and recreation<\/b>"], "cp": ["food from farming and fishing", "timber and fuel", "medicines from plants", "water supply", "tourism and recreation"], "dp": ["Making steel", "Mining only rock", "Building rockets"], "mand": 0}, {"id": "GEO-07-009", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>demand for biosphere resources is rising<\/b>.", "a": ["A growing <b>population<\/b> needs more food and water (1)", "Rising <b>incomes<\/b> increase demand for meat, timber and energy (1)", "Industrial growth increases <b>demand for raw materials<\/b> (1)"], "cp": ["A growing population needs more food and water", "Rising incomes increase demand for meat, timber and energy", "Industrial growth increases demand for raw materials"], "dp": ["The population is shrinking", "Incomes are falling everywhere", "There is no demand for food"], "mand": 0}, {"id": "GEO-07-010", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>human activity<\/b> threatens ecosystems.", "a": ["<b>Deforestation<\/b> and farming destroy habitats (1)", "<b>Pollution<\/b> and waste damage soil, air and water (1)", "<b>Climate change<\/b> and overuse push species towards extinction (1)"], "cp": ["Deforestation and farming destroy habitats", "Pollution and waste damage soil, air and water", "Climate change and overuse push species towards extinction"], "dp": ["Humans protect all ecosystems", "Human activity has no effect", "Farms always increase biodiversity"], "mand": 0}, {"id": "GEO-07-011", "t": 7, "s": "7.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>biodiversity<\/b>?", "a": ["The <b>variety of living things<\/b> in an area (1)", "It includes <b>species and genetic diversity<\/b> (1)"], "cp": ["The variety of living things in an area", "It includes species and genetic diversity"], "dp": ["The number of people in an area", "The size of a lake", "The amount of rainfall"], "mand": 0}, {"id": "GEO-07-012", "t": 7, "s": "7.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>climate of tropical rainforests<\/b>.", "a": ["<b>Hot all year<\/b> (around 27°C) (1)", "<b>Heavy rainfall<\/b> (over 2000 mm per year) (1)", "<b>Little seasonal change<\/b>, near the Equator (1)"], "cp": ["Hot all year (around 27°C)", "Heavy rainfall (over 2000 mm per year)", "Little seasonal change, near the Equator"], "dp": ["Cold and dry", "Hot and dry", "Hot with a long dry season"], "mand": 0}, {"id": "GEO-07-013", "t": 7, "s": "7.2", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four layers<\/b> of a tropical rainforest.", "a": ["<b>Emergent<\/b> layer (1)", "<b>Canopy<\/b> (1)", "<b>Understorey<\/b> (1)", "<b>Forest floor<\/b> (shrub layer) (1)"], "cp": ["Emergent layer", "Canopy", "Understorey", "Forest floor (shrub layer)"], "dp": ["Crust, mantle, outer core and inner core", "Soil, rock, water and air", "Canopy, trunk, root and flower"], "mand": 0}, {"id": "GEO-07-014", "t": 7, "s": "7.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one adaptation<\/b> of rainforest plants to the climate.", "a": ["<b>Drip tips<\/b> shed heavy rain (1)", "<b>Buttress roots<\/b> support tall trees in shallow soils (1)", "<b>Epiphytes<\/b> grow on branches to reach sunlight (1)"], "cp": ["Drip tips shed heavy rain", "Buttress roots support tall trees in shallow soils", "Epiphytes grow on branches to reach sunlight"], "dp": ["Thick bark to store water", "Long roots reach deep groundwater", "Needle leaves to reduce water loss"], "mand": 0}, {"id": "GEO-07-015", "t": 7, "s": "7.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why rainforest soils are <b>nutrient-poor<\/b> despite lush growth.", "a": ["Most nutrients are <b>in the biomass and litter<\/b> (1)", "Heavy rain <b>leaches<\/b> nutrients out of the soil (1)", "When trees are cut, the <b>nutrient cycle is broken<\/b> (1)"], "cp": ["Most nutrients are in the biomass and litter", "Heavy rain leaches nutrients out of the soil", "When trees are cut, the nutrient cycle is broken"], "dp": ["Rainforest soils are very deep and rich", "Soils lack plants", "Decomposition is very slow because it is cold"], "mand": 0}, {"id": "GEO-07-016", "t": 7, "s": "7.2", "k": "Evaluate", "m": 3, "ht": false, "q": "Explain how <b>plants and animals depend on each other<\/b> in a rainforest.", "a": ["Plants provide <b>food and shelter<\/b> (1)", "Animals <b>pollinate and spread seeds<\/b> (1)", "Decomposers <b>return nutrients<\/b> to plants (1)"], "cp": ["Plants provide food and shelter", "Animals pollinate and spread seeds", "Decomposers return nutrients to plants"], "dp": ["They do not depend on each other", "Animals harm all plants", "Plants eat animals"], "mand": 0}, {"id": "GEO-07-017", "t": 7, "s": "7.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>features of taiga (boreal forest)<\/b>.", "a": ["<b>Cold climate<\/b> with long winters (1)", "Mostly <b>coniferous<\/b> trees with needle leaves (1)", "<b>Acidic, thin<\/b> soils and low biodiversity (1)"], "cp": ["Cold climate with long winters", "Mostly coniferous trees with needle leaves", "Acidic, thin soils and low biodiversity"], "dp": ["Hot and wet all year", "Broad-leaved trees only", "Deep, fertile soils"], "mand": 0}, {"id": "GEO-07-018", "t": 7, "s": "7.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>adaptations of taiga trees<\/b> to cold, snowy winters.", "a": ["<b>Needle leaves<\/b> reduce water loss (1)", "<b>Conical shape<\/b> sheds snow (1)", "<b>Dark colour<\/b> absorbs heat, and trees are evergreen to photosynthesise (1)"], "cp": ["Needle leaves reduce water loss", "Conical shape sheds snow", "Dark colour absorbs heat, and trees are evergreen to photosynthesise"], "dp": ["Large flat leaves", "Shedding leaves in summer", "Thick fleshy stems"], "mand": 0}, {"id": "GEO-07-019", "t": 7, "s": "7.1", "k": "Calculation", "m": 2, "ht": false, "q": "A forest has 400 species in 1980 and 300 in 2020. Calculate the <b>percentage change<\/b>.", "a": ["Change = -100 (1)", "-100 ÷ 400 × 100 = <b>-25%<\/b> (1)"], "cp": ["Change = -100", "-100 ÷ 400 × 100 = -25%"], "dp": ["-33%", "+25%", "-100%"], "mand": 0}, {"id": "GEO-07-020", "t": 7, "s": "7.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says <b>'rainforests and taiga are the same biome'<\/b>. What is wrong?", "a": ["They have very different <b>climates and species<\/b> (1)", "Rainforest is <b>hot and wet<\/b> in the tropics, taiga is <b>cold and coniferous<\/b> (1)"], "cp": ["They have very different climates and species", "Rainforest is hot and wet in the tropics, taiga is cold and coniferous"], "dp": ["They have identical climates", "Taiga is in the tropics", "Both are deserts"], "mand": 0}, {"id": "GEO-08-001", "t": 8, "s": "8.1", "k": "Recall", "m": 4, "ht": false, "q": "Give <b>four causes<\/b> of tropical rainforest deforestation.", "a": ["Any four (1 each):", "• <b>logging<\/b> for timber", "• <b>cattle ranching<\/b>", "• <b>commercial farming<\/b> (soya, palm oil)", "• <b>mining<\/b>", "• <b>road building<\/b> and settlement", "• <b>HEP dams<\/b>"], "cp": ["logging for timber", "cattle ranching", "commercial farming (soya, palm oil)", "mining", "road building and settlement", "HEP dams"], "dp": ["Planting new forest", "Seaweed harvesting", "Building coastal defences"], "mand": 0}, {"id": "GEO-08-002", "t": 8, "s": "8.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>cattle ranching and soya<\/b> lead to deforestation in the Amazon.", "a": ["Land is <b>cleared<\/b> for pasture or crop fields (1)", "<b>Global demand<\/b> for beef and soya drives clearance (1)", "Roads open more land to <b>clearance<\/b> (1)"], "cp": ["Land is cleared for pasture or crop fields", "Give <b>three environmental impacts<\/b> of using fossil fuels.", "a": ["Any three (1 each):", "• <b>carbon dioxide<\/b> emissions drive climate change", "• <b>air pollution<\/b> and acid rain", "• <b>oil spills<\/b> damage oceans", "• <b>habitat loss<\/b> from mining", "• landscape damage"], "cp": ["carbon dioxide emissions drive climate change", "air pollution and acid rain", "oil spills damage oceans", "habitat loss from mining", "landscape damage"], "dp": ["Reduced CO<sub>2<\/sub>", "Cleaner air", "Zero waste"], "mand": 0}, {"id": "GEO-09-007", "t": 9, "s": "9.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what <b>energy security<\/b> means and why it matters.", "a": ["Having a <b>reliable supply<\/b> of affordable energy (1)", "Countries that import fuel are <b>vulnerable to price rises<\/b> or supply disruption (1)", "Lack of energy can <b>harm economies and daily life<\/b> (1)"], "cp": ["Having a reliable supply of affordable energy", "Countries that import fuel are vulnerable to price rises or supply disruption", "Lack of energy can harm economies and daily life"], "dp": ["Having too much energy", "A safe place to store power", "Energy that can never be used"], "mand": 0}, {"id": "GEO-09-008", "t": 9, "s": "9.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three factors<\/b> that affect a country's energy mix.", "a": ["Any three (1 each):", "• <b>resources available<\/b> (coal, gas, rivers, wind)", "• <b>cost<\/b> of production", "• <b>technology<\/b> and infrastructure", "• <b>politics<\/b> and security", "• <b>environmental<\/b> concerns"], "cp": ["resources available (coal, gas, rivers, wind)", "cost of production", "technology and infrastructure", "politics and security", "environmental concerns"], "dp": ["The colour of the flag", "The country's football team", "The number of tourists"], "mand": 0}, {"id": "GEO-09-009", "t": 9, "s": "9.2", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four types of renewable energy<\/b>.", "a": ["Any four (1 each):", "• <b>solar<\/b>", "• <b>wind<\/b>", "• <b>hydroelectric<\/b>", "• <b>tidal and wave<\/b>", "• <b>geothermal<\/b>", "• <b>biomass<\/b>"], "cp": ["solar", "wind", "hydroelectric", "tidal and wave", "geothermal", "biomass"], "dp": ["Coal and oil", "Natural gas and uranium", "Peat and lignite"], "mand": 0}, {"id": "GEO-09-010", "t": 9, "s": "9.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>wind power<\/b>.", "a": ["Advantage: <b>renewable and low carbon<\/b> in use (1)", "Advantage: low running costs (1)", "Disadvantage: <b>intermittent<\/b> and depends on wind (1)", "Disadvantage: <b>visual impact<\/b> and noise, and costly to build (1)"], "cp": ["Advantage: renewable and low carbon in use", "Advantage: low running costs", "Disadvantage: intermittent and depends on wind", "Disadvantage: visual impact and noise, and costly to build"], "dp": ["It works with no wind", "It has no costs at all", "It releases large amounts of CO<sub>2<\/sub> when running"], "mand": 0}, {"id": "GEO-09-011", "t": 9, "s": "9.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>nuclear power<\/b>.", "a": ["Advantage: <b>large output<\/b> and low carbon (1)", "Advantage: <b>reliable<\/b> supply (1)", "Disadvantage: <b>radioactive waste<\/b> and accident risk (1)", "Disadvantage: very <b>high construction and decommissioning costs<\/b> (1)"], "cp": ["Advantage: large output and low carbon", "Advantage: reliable supply", "Disadvantage: radioactive waste and accident risk", "Disadvantage: very high construction and decommissioning costs"], "dp": ["It produces no waste", "It is a renewable resource", "It has zero accident risk"], "mand": 0}, {"id": "GEO-09-012", "t": 9, "s": "9.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>solar power<\/b>.", "a": ["Advantage: <b>renewable<\/b> and produces no emissions in use (1)", "Advantage: suits <b>remote areas<\/b> and sunny countries (1)", "Disadvantage: <b>depends on sunshine<\/b> and daylight (1)", "Disadvantage: <b>high installation costs<\/b> and storage needs (1)"], "cp": ["Advantage: renewable and produces no emissions in use", "Advantage: suits remote areas and sunny countries", "Disadvantage: depends on sunshine and daylight", "Disadvantage: high installation costs and storage needs"], "dp": ["It works well in the dark", "It has no installation cost", "It always produces more than needed"], "mand": 0}, {"id": "GEO-09-013", "t": 9, "s": "9.2", "k": "Evaluate", "m": 3, "ht": false, "q": "Evaluate <b>HEP (hydroelectric power)<\/b>: give two advantages and one disadvantage.", "a": ["Advantage: <b>renewable<\/b> and reliable (1)", "Advantage: provides <b>flood control and water supply<\/b> (1)", "Disadvantage: <b>floods land and displaces people<\/b>, and affects wildlife (1)"], "cp": ["Advantage: renewable and reliable", "Advantage: provides flood control and water supply", "Disadvantage: floods land and displaces people, and affects wildlife"], "dp": ["It produces no environmental impact", "It only works in deserts", "It has no construction cost"], "mand": 0}, {"id": "GEO-09-014", "t": 9, "s": "9.2", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two unconventional fossil fuel<\/b> sources.", "a": ["Any two (1 each):", "• <b>fracking<\/b> (shale gas)", "• <b>tar sands<\/b> (oil sands)", "• <b>deep-sea<\/b> drilling", "• coal-bed methane"], "cp": ["fracking (shale gas)", "tar sands (oil sands)", "deep-sea drilling", "coal-bed methane"], "dp": ["Wind and wave", "Solar and tidal", "Geothermal and biomass"], "mand": 0}, {"id": "GEO-09-015", "t": 9, "s": "9.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one concern<\/b> about fracking.", "a": ["<b>Groundwater contamination<\/b> risk (1)", "<b>Small earthquakes<\/b> (tremors) can be triggered (1)", "Still <b>releases greenhouse gases<\/b> and harms landscapes (1)"], "cp": ["Groundwater contamination risk", "Small earthquakes (tremors) can be triggered", "Still releases greenhouse gases and harms landscapes"], "dp": ["It is always completely safe", "It removes the need for water", "It reduces all emissions"], "mand": 0}, {"id": "GEO-09-016", "t": 9, "s": "9.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> individuals can reduce energy use.", "a": ["Any three (1 each):", "• <b>turn off<\/b> lights and devices", "• use <b>energy-efficient appliances<\/b>", "• <b>insulate<\/b> homes", "• <b>walk, cycle or use public transport<\/b>", "• use <b>LEDs<\/b> and smart meters"], "cp": ["turn off lights and devices", "use energy-efficient appliances", "insulate homes", "walk, cycle or use public transport", "use LEDs and smart meters"], "dp": ["Leave lights on", "Use more cars", "Heat empty rooms"], "mand": 0}, {"id": "GEO-09-017", "t": 9, "s": "9.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three government actions<\/b> to encourage sustainable energy use.", "a": ["Any three (1 each):", "• <b>subsidies<\/b> for renewables", "• <b>carbon taxes<\/b>", "• <b>regulation<\/b> of efficiency standards", "• <b>investment<\/b> in research", "• <b>international agreements<\/b>"], "cp": ["subsidies for renewables", "carbon taxes", "regulation of efficiency standards", "investment in research", "international agreements"], "dp": ["Banning insulation", "Taxing renewable energy heavily", "Removing all standards"], "mand": 0}, {"id": "GEO-09-018", "t": 9, "s": "9.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>attitudes to energy<\/b> can differ between stakeholders.", "a": ["<b>Energy companies<\/b> may focus on profit (1)", "<b>Environmental groups<\/b> push for renewables and lower emissions (1)", "<b>Governments<\/b> balance security, cost and climate targets (1)"], "cp": ["Energy companies may focus on profit", "Environmental groups push for renewables and lower emissions", "Governments balance security, cost and climate targets"], "dp": ["All stakeholders always agree", "Environmental groups promote coal", "Governments ignore cost"], "mand": 0}, {"id": "GEO-09-019", "t": 9, "s": "9.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>carbon capture and storage<\/b> as a way to reduce emissions.", "a": ["Advantage: can <b>cut CO<sub>2<\/sub> from power stations<\/b> (1)", "Advantage: allows continued use of existing plant while changing (1)", "Disadvantage: <b>expensive<\/b> and unproven at scale (1)", "Disadvantage: <b>storage safety<\/b> and leakage concerns (1)"], "cp": ["Advantage: can cut CO<sub>2<\/sub> from power stations", "Advantage: allows continued use of existing plant while changing", "Disadvantage: expensive and unproven at scale", "Disadvantage: storage safety and leakage concerns"], "dp": ["It removes the need for any other action", "It is free and fully developed", "It produces more CO<sub>2<\/sub>"], "mand": 0}, {"id": "GEO-09-020", "t": 9, "s": "9.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain what a <b>sustainable energy strategy<\/b> includes.", "a": ["A growing share of <b>renewables<\/b> (1)", "<b>Energy efficiency<\/b> and conservation (1)", "A secure, affordable supply that <b>reduces emissions<\/b> (1)"], "cp": ["A growing share of renewables", "Energy efficiency and conservation", "A secure, affordable supply that reduces emissions"], "dp": ["Only coal", "No energy efficiency", "Ignoring the environment"], "mand": 0}, {"id": "GEO-09-021", "t": 9, "s": "9.1", "k": "Data", "m": 3, "ht": false, "q": "A country's energy: coal 40%, oil 30%, gas 20%, renewables 10%. Calculate the <b>percentage from fossil fuels<\/b> and comment.", "a": ["Fossil fuels = 40 + 30 + 20 (1)", "= <b>90%<\/b> (1)", "The country is <b>highly dependent on fossil fuels<\/b> and has low renewable use (1)"], "cp": ["Fossil fuels = 40 + 30 + 20", "= 90%", "The country is highly dependent on fossil fuels and has low renewable use"], "dp": ["10% and mostly renewable", "60% and mostly nuclear", "100% and no renewables"], "mand": 0}, {"id": "GEO-09-022", "t": 9, "s": "9.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'renewable energy is always cheaper and perfect'<\/b>. What is wrong?", "a": ["Renewables can have <b>high set-up costs<\/b> and be <b>intermittent<\/b> (1)", "They can have <b>environmental impacts<\/b>, so you must weigh pros and cons (1)"], "cp": ["Renewables can have high set-up costs and be intermittent", "They can have environmental impacts, so you must weigh pros and cons"], "dp": ["Nothing is wrong", "They never need storage", "They have no impacts"], "mand": 0}, {"id": "GEO-09-023", "t": 9, "s": "9.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>energy sources vary between countries<\/b>.", "a": ["Different <b>natural resources<\/b> (coal, oil, rivers, sun) (1)", "Different <b>wealth and technology<\/b> (1)", "Different <b>policies and security<\/b> priorities (1)"], "cp": ["Different natural resources (coal, oil, rivers, sun)", "Different wealth and technology", "Different policies and security priorities"], "dp": ["All countries have the same energy mix", "Resources do not affect energy", "Wealth does not matter"], "mand": 0}, {"id": "GEO-09-024", "t": 9, "s": "9.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>energy use is linked to climate change<\/b>.", "a": ["Burning fossil fuels releases <b>CO<sub>2<\/sub><\/b> (1)", "Greenhouse gases <b>trap heat<\/b> and warm the planet (1)", "Rising energy demand increases <b>emissions<\/b> unless low-carbon sources grow (1)"], "cp": ["Burning fossil fuels releases CO<sub>2<\/sub>", "Greenhouse gases trap heat and warm the planet", "Rising energy demand increases emissions unless low-carbon sources grow"], "dp": ["Energy use cools the planet", "Fossil fuels absorb CO<sub>2<\/sub>", "Renewables increase emissions greatly"], "mand": 0}, {"id": "GEO-10-001", "t": 10, "s": "10.1", "k": "Recall", "m": 2, "ht": false, "q": "How do you give a <b>four-figure and a six-figure grid reference<\/b>?", "a": ["<b>Four-figure<\/b>: eastings first, then northings, to the grid square (1)", "<b>Six-figure<\/b>: add a tenth estimate in each direction, so the position is more precise (1)"], "cp": ["Four-figure: eastings first, then northings, to the grid square", "Six-figure: add a tenth estimate in each direction, so the position is more precise"], "dp": ["Northings first, then eastings", "Use latitude then longitude", "Count squares from the right edge"], "mand": 0}, {"id": "GEO-10-002", "t": 10, "s": "10.1", "k": "Process", "m": 2, "ht": false, "q": "What is the rule for reading a grid reference?", "a": ["<b>Along the corridor<\/b> (eastings) (1)", "<b>Then up the stairs<\/b> (northings) (1)"], "cp": ["Along the corridor (eastings)", "Then up the stairs (northings)"], "dp": ["Up the stairs, then along the corridor", "Always start at the top", "Read left to right then down"], "mand": 0}, {"id": "GEO-10-003", "t": 10, "s": "10.1", "k": "Calculation", "m": 3, "ht": false, "q": "A map has a scale of 1:25,000. A route measures 8 cm on the map. Calculate the <b>real distance<\/b> in km.", "a": ["8 × 25,000 = 200,000 cm (1)", "= 2,000 m (1)", "= <b>2 km<\/b> (1)"], "cp": ["8 × 25,000 = 200,000 cm", "= 2,000 m", "= 2 km"], "dp": ["20 km", "0.2 km", "200 km"], "mand": 0}, {"id": "GEO-10-004", "t": 10, "s": "10.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe how <b>contour lines<\/b> show relief.", "a": ["Lines join points of <b>equal height<\/b> (1)", "<b>Close together<\/b> means a steep slope (1)", "<b>Far apart<\/b> means a gentle slope (1)"], "cp": ["Lines join points of equal height", "Close together means a steep slope", "Far apart means a gentle slope"], "dp": ["Close lines mean flat land", "Contours show roads", "Contours show rivers only"], "mand": 0}, {"id": "GEO-10-005", "t": 10, "s": "10.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three features<\/b> that can be found on a map key.", "a": ["Any three (1 each):", "• <b>settlements<\/b> and buildings", "• <b>roads and railways<\/b>", "• <b>rivers and water<\/b>", "• <b>woodland<\/b>", "• <b>tourist symbols<\/b>"], "cp": ["settlements and buildings", "roads and railways", "rivers and water", "woodland", "tourist symbols"], "dp": ["Weather forecasts", "Population totals", "Tax rates"], "mand": 0}, {"id": "GEO-10-006", "t": 10, "s": "10.1", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>describe the relief<\/b> of an OS map area?", "a": ["Give <b>heights<\/b> and use <b>contour spacing<\/b> (1)", "Describe <b>slopes<\/b> as steep or gentle (1)", "Mention <b>valleys, ridges, peaks<\/b> and flat areas (1)"], "cp": ["Give heights and use contour spacing", "Describe slopes as steep or gentle", "Mention valleys, ridges, peaks and flat areas"], "dp": ["List shop names", "Describe only the roads", "Write the date"], "mand": 0}, {"id": "GEO-10-007", "t": 10, "s": "10.2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of map<\/b> used in geography to show data.", "a": ["<b>Choropleth<\/b> map (1)", "<b>Isoline<\/b> map (1)", "<b>Proportional symbol<\/b> map (1)"], "cp": ["Choropleth map", "Isoline map", "Proportional symbol map"], "dp": ["Weather map, sky map and moon map", "Tourist map, road map and city map only", "Contour map, tide map and rain map only"], "mand": 0}, {"id": "GEO-10-008", "t": 10, "s": "10.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>choropleth map<\/b>?", "a": ["A map that uses <b>different shades or colours<\/b> for areas (1)", "The shading shows <b>data values<\/b> such as population density (1)"], "cp": ["A map that uses different shades or colours for areas", "The shading shows data values such as population density"], "dp": ["A map with only roads", "A map that shows height only", "A drawing of a landscape"], "mand": 0}, {"id": "GEO-10-009", "t": 10, "s": "10.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three types of graph<\/b> commonly used in geography.", "a": ["Any three (1 each):", "• <b>bar chart<\/b>", "• <b>line graph<\/b>", "• <b>scatter graph<\/b>", "• <b>pie chart<\/b>", "• <b>histogram<\/b>", "• <b>pictogram<\/b>"], "cp": ["bar chart", "line graph", "scatter graph", "pie chart", "histogram", "pictogram"], "dp": ["Map, compass and ruler", "Table, key and scale", "Flow, delta and spit"], "mand": 0}, {"id": "GEO-10-010", "t": 10, "s": "10.2", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>describe a graph<\/b> in an exam?", "a": ["State the <b>overall trend or pattern<\/b> (1)", "Quote <b>figures with units<\/b>, such as highest and lowest (1)", "Mention <b>anomalies<\/b> or changes in rate (1)"], "cp": ["State the overall trend or pattern", "Quote figures with units, such as highest and lowest", "Mention anomalies or changes in rate"], "dp": ["Only repeat the title", "Give a personal opinion", "Only describe the colours"], "mand": 0}, {"id": "GEO-10-011", "t": 10, "s": "10.2", "k": "Calculation", "m": 3, "ht": false, "q": "Data: 12, 15, 9, 15, 19. Calculate the <b>mean, median and mode<\/b>.", "a": ["Mean = 70 ÷ 5 = <b>14<\/b> (1)", "Median: ordered 9, 12, 15, 15, 19 gives <b>15<\/b> (1)", "Mode = <b>15<\/b> (1)"], "cp": ["Mean = 70 ÷ 5 = 14", "Median: ordered 9, 12, 15, 15, 19 gives 15", "Mode = 15"], "dp": ["Mean 15, median 14, mode 9", "Mean 14, median 9, mode 12", "Mean 15, median 12, mode 15"], "mand": 0}, {"id": "GEO-10-012", "t": 10, "s": "10.2", "k": "Calculation", "m": 2, "ht": false, "q": "Calculate the <b>interquartile range<\/b> of 4, 6, 8, 10, 12, 14, 16, 18.", "a": ["Lower quartile = 7, upper quartile = 15 (1)", "IQR = 15 - 7 = <b>8<\/b> (1)"], "cp": ["Lower quartile = 7, upper quartile = 15", "IQR = 15 - 7 = 8"], "dp": ["14", "4", "18"], "mand": 0}, {"id": "GEO-10-013", "t": 10, "s": "10.2", "k": "Recall", "m": 2, "ht": false, "q": "What does <b>correlation<\/b> mean and how do you describe it?", "a": ["A <b>relationship<\/b> between two variables (1)", "Describe as <b>positive, negative or none<\/b>, and its strength (1)"], "cp": ["A relationship between two variables", "Describe as positive, negative or none, and its strength"], "dp": ["The size of a sample", "A type of map", "A sampling method"], "mand": 0}, {"id": "GEO-10-014", "t": 10, "s": "10.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three uses<\/b> of GIS (Geographical Information Systems).", "a": ["Any three (1 each):", "• <b>layering<\/b> data on maps", "• <b>planning<\/b> and decision making", "• <b>tracking hazards<\/b>", "• <b>analysing patterns<\/b>", "• <b>mapping flood or hazard risk<\/b>"], "cp": ["layering data on maps", "planning and decision making", "tracking hazards", "analysing patterns", "mapping flood or hazard risk"], "dp": ["Painting landscapes", "Measuring rock hardness", "Printing newspapers"], "mand": 0}, {"id": "GEO-10-015", "t": 10, "s": "10.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>two advantages<\/b> and <b>one limitation<\/b> of using photographs in geography.", "a": ["Advantage: show <b>real features<\/b> and landscapes (1)", "Advantage: useful for <b>comparing change<\/b> over time (1)", "Limitation: <b>limited viewpoint<\/b> or bias and may be dated (1)"], "cp": ["Advantage: show real features and landscapes", "Advantage: useful for comparing change over time", "Limitation: limited viewpoint or bias and may be dated"], "dp": ["They always show the whole area", "They never show anything useful", "They give exact measurements"], "mand": 0}, {"id": "GEO-10-016", "t": 10, "s": "10.2", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>annotate a photograph or sketch<\/b> well?", "a": ["Label <b>key features<\/b> (1)", "Add <b>explanations<\/b>, for example how they formed (1)", "Keep notes <b>short and linked<\/b> to the question (1)"], "cp": ["Label key features", "Add explanations, for example how they formed", "Keep notes short and linked to the question"], "dp": ["Write a story", "Write long personal opinions", "Cover the photo in colour"], "mand": 0}, {"id": "GEO-10-017", "t": 10, "s": "10.3", "k": "Process", "m": 3, "ht": fal
