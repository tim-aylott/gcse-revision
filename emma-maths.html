 trap", "m": 2, "ht": false, "q": "A student <b>circles two options<\/b> on a 'Circle your answer' question. What is wrong?", "a": ["Only <b>one answer<\/b> can be circled, so two circles earn no mark (1)", "To change your mind, <b>cross out clearly<\/b> the first circle (1)"], "cp": ["Only one answer can be circled, so two circles earn no mark", "To change your mind, cross out clearly the first circle"], "dp": ["Two circles earn double marks", "Circles are optional", "The examiner picks the best one"], "mand": 0}, {"id": "MAT-08-007", "t": 8, "s": "Mock", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways to check<\/b> an answer without a calculator.", "a": ["<b>Estimate<\/b> by rounding to 1 significant figure (1)", "Use the <b>inverse operation<\/b> (1)", "Ask if the answer is <b>sensible<\/b>, e.g. units and size (1)"], "cp": ["Estimate by rounding to 1 significant figure", "Use the inverse operation", "Ask if the answer is sensible, e.g. units and size"], "dp": ["Redo the same method and hope", "Round to the nearest million", "Never check"], "mand": 0}, {"id": "MAT-08-008", "t": 8, "s": "Mock", "k": "Explain", "m": 3, "ht": false, "q": "How should you tackle a <b>6 mark multi-step<\/b> question?", "a": ["Underline the <b>numbers and what is asked<\/b> (1)", "Work out <b>each part separately<\/b>, e.g. income then costs (1)", "Combine at the end and write the <b>units<\/b> (1)"], "cp": ["Underline the numbers and what is asked", "Work out each part separately, e.g. income then costs", "Combine at the end and write the units"], "dp": ["Do it all in your head", "Start with the final answer", "Write one line only"], "mand": 0}, {"id": "MAT-08-009", "t": 8, "s": "Mock", "k": "Calculation", "m": 4, "ht": false, "q": "A tour has <b>240 passengers<\/b> paying <b>£15<\/b> each. Each coach holds <b>40<\/b>, and costs <b>£120<\/b> for the driver plus <b>50p per mile<\/b> for <b>100 miles<\/b>. Work out the <b>profit<\/b>.", "a": ["Income = 240 × 15 = <b>£3600<\/b> (1)", "Coaches = 240 ÷ 40 = <b>6<\/b> (1)", "Cost per coach = 120 + 50 = £170, so total = 6 × 170 = <b>£1020<\/b> (1)", "Profit = 3600 − 1020 = <b>£2580<\/b> (1)"], "cp": ["Income = 240 × 15 = £3600", "Coaches = 240 ÷ 40 = 6", "Cost per coach = 120 + 50 = £170, so total = 6 × 170 = £1020", "Profit = 3600 − 1020 = £2580"], "dp": ["£4620", "£3600", "£2400"], "mand": 0}, {"id": "MAT-08-010", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "A function machine is <b>× 4<\/b> then <b>− 3<\/b>. Find the output for input 5, and the input for output 29.", "a": ["Input 5: 5 × 4 = 20, then 20 − 3 = <b>17<\/b> (1)", "Output 29: work backwards, 29 + 3 = 32, then 32 ÷ 4 = <b>8<\/b> (1)"], "cp": ["Input 5: 5 × 4 = 20, then 20 − 3 = 17", "Output 29: work backwards, 29 + 3 = 32, then 32 ÷ 4 = 8"], "dp": ["Input 5 gives 2 and input 29 gives 7", "Input 5 gives 22 and input 29 gives 26", "Input 5 gives 17 and input 29 gives 116"], "mand": 0}, {"id": "MAT-08-011", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "Find the <b>midpoint<\/b> of A (2, 3) and B (8, 11).", "a": ["Add and halve the x values: (2 + 8) ÷ 2 = <b>5<\/b> (1)", "Add and halve the y values: (3 + 11) ÷ 2 = <b>7<\/b>, so (5, 7) (1)"], "cp": ["Add and halve the x values: (2 + 8) ÷ 2 = 5", "Add and halve the y values: (3 + 11) ÷ 2 = 7, so (5, 7)"], "dp": ["(6, 8)", "(10, 14)", "(3, 4)"], "mand": 0}, {"id": "MAT-08-012", "t": 8, "s": "Mock", "k": "Calculation", "m": 3, "ht": false, "q": "<b>Pack A<\/b> has 6 pens for £2.40. <b>Pack B<\/b> has 10 pens for £3.50. Which is <b>better value<\/b>?", "a": ["A: 240 ÷ 6 = <b>40p<\/b> per pen (1)", "B: 350 ÷ 10 = <b>35p<\/b> per pen (1)", "<b>Pack B<\/b> is better value because it is cheaper per pen (1)"], "cp": ["A: 240 ÷ 6 = 40p per pen", "B: 350 ÷ 10 = 35p per pen", "Pack B is better value because it is cheaper per pen"], "dp": ["Pack A because it costs less in total", "Pack A at 35p per pen", "They are the same value"], "mand": 0}, {"id": "MAT-08-013", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "Fill the gap: <b>3/5 = ?/35<\/b>. Show how.", "a": ["5 × 7 = 35, so multiply top and bottom by <b>7<\/b> (1)", "3 × 7 = <b>21<\/b>, so 21/35 (1)"], "cp": ["5 × 7 = 35, so multiply top and bottom by 7", "3 × 7 = 21, so 21/35"], "dp": ["38/35", "15/35", "18/35"], "mand": 0}, {"id": "MAT-08-014", "t": 8, "s": "Mock", "k": "Recall", "m": 4, "ht": false, "q": "Where do these go on a <b>0 to 1 probability scale<\/b>: impossible, even chance, certain, unlikely?", "a": ["<b>Impossible<\/b> = 0 (1)", "<b>Even chance<\/b> = 1/2 (1)", "<b>Certain<\/b> = 1 (1)", "<b>Unlikely<\/b> lies between 0 and 1/2 (1)"], "cp": ["Impossible = 0", "Even chance = 1/2", "Certain = 1", "Unlikely lies between 0 and 1/2"], "dp": ["Impossible = 1 and certain = 0", "Even chance = 1", "Unlikely is bigger than 1/2"], "mand": 0}, {"id": "MAT-08-015", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "A film starts at <b>6:50 pm<\/b> and lasts <b>145 minutes<\/b>. When does it end?", "a": ["145 minutes = <b>2 hours 25 minutes<\/b> (1)", "6:50 pm + 2 h 25 min = <b>9:15 pm<\/b> (1)"], "cp": ["145 minutes = 2 hours 25 minutes", "6:50 pm + 2 h 25 min = 9:15 pm"], "dp": ["9:35 pm", "8:15 pm", "10:15 pm"], "mand": 0}, {"id": "MAT-08-016", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "Write <b>7:25 pm<\/b> in 24-hour time and <b>16:40<\/b> in 12-hour time.", "a": ["7:25 pm = <b>19:25<\/b> (1)", "16:40 = <b>4:40 pm<\/b> (1)"], "cp": ["7:25 pm = 19:25", "16:40 = 4:40 pm"], "dp": ["7:25 and 6:40 pm", "17:25 and 4:40 am", "19:25 and 6:40 pm"], "mand": 0}, {"id": "MAT-08-017", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "£1 = €1.20. Without a calculator, convert <b>£250<\/b> to euros and <b>€90<\/b> to pounds.", "a": ["£250 × 1.2 = <b>€300<\/b> (1)", "€90 ÷ 1.2 = <b>£75<\/b> (1)"], "cp": ["£250 × 1.2 = €300", "€90 ÷ 1.2 = £75"], "dp": ["€208 and £108", "€300 and £108", "€250 and €90"], "mand": 0}, {"id": "MAT-08-018", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "<b>5 pencils<\/b> cost £1.50. Use the unitary method to find the cost of <b>12 pencils<\/b>.", "a": ["1 pencil = 150 ÷ 5 = <b>30p<\/b> (1)", "12 pencils = 12 × 30p = <b>£3.60<\/b> (1)"], "cp": ["1 pencil = 150 ÷ 5 = 30p", "12 pencils = 12 × 30p = £3.60"], "dp": ["£1.80", "£3.50", "£7.50"], "mand": 0}, {"id": "MAT-08-019", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "The time in Tokyo is <b>9 hours ahead<\/b> of London. What is the time in Tokyo when it is <b>3:00 pm<\/b> in London?", "a": ["3:00 pm + 9 hours (1)", "<b>12:00 midnight<\/b> (the start of the next day) (1)"], "cp": ["3:00 pm + 9 hours", "12:00 midnight (the start of the next day)"], "dp": ["6:00 am", "6:00 pm", "12:00 noon"], "mand": 0}, {"id": "MAT-08-020", "t": 8, "s": "Mock", "k": "Calculation", "m": 3, "ht": false, "q": "Write <b>60<\/b> as a product of prime factors in index form.", "a": ["Start a factor tree: 60 = 2 × 30 = 2 × 2 × 15 (1)", "60 = 2 × 2 × 3 × 5 (1)", "In index form: <b>2² × 3 × 5<\/b> (1)"], "cp": ["Start a factor tree: 60 = 2 × 30 = 2 × 2 × 15", "60 = 2 × 2 × 3 × 5", "In index form: 2² × 3 × 5"], "dp": ["6 × 10", "2 × 3 × 10", "2 × 30"], "mand": 0}, {"id": "MAT-08-021", "t": 8, "s": "Mock", "k": "Calculation", "m": 3, "ht": false, "q": "Round <b>48 762<\/b> to the nearest 1000, <b>48 762<\/b> to 3 s.f. and <b>0.07381<\/b> to 2 s.f.", "a": ["Nearest 1000: <b>49 000<\/b> (1)", "3 s.f.: <b>48 800<\/b> (1)", "2 s.f.: <b>0.074<\/b> (1)"], "cp": ["Nearest 1000: 49 000", "3 s.f.: 48 800", "2 s.f.: 0.074"], "dp": ["48 000 and 48 700 and 0.07", "49 000 and 48 760 and 0.0738", "48 000 and 48 800 and 0.07"], "mand": 0}, {"id": "MAT-08-022", "t": 8, "s": "Mock", "k": "Calculation", "m": 3, "ht": false, "q": "Put in order, smallest first: <b>0.6, 5/8, 59%, 0.605<\/b>.", "a": ["Change all to decimals (1)", "0.6, 0.625, 0.59, 0.605 (1)", "Order: <b>59%, 0.6, 0.605, 5/8<\/b> (1)"], "cp": ["Change all to decimals", "0.6, 0.625, 0.59, 0.605", "Order: 59%, 0.6, 0.605, 5/8"], "dp": ["0.6, 0.605, 59%, 5/8", "5/8, 0.605, 0.6, 59%", "59%, 5/8, 0.6, 0.605"], "mand": 0}, {"id": "MAT-08-023", "t": 8, "s": "Mock", "k": "Calculation", "m": 3, "ht": false, "q": "The angles in a triangle are in the ratio <b>2 : 3 : 4<\/b>. Find the <b>largest angle<\/b>.", "a": ["2 + 3 + 4 = <b>9 parts<\/b> (1)", "180 ÷ 9 = <b>20°<\/b> per part (1)", "Largest = 4 × 20 = <b>80°<\/b> (1)"], "cp": ["2 + 3 + 4 = 9 parts", "180 ÷ 9 = 20° per part", "Largest = 4 × 20 = 80°"], "dp": ["40°", "60°", "90°"], "mand": 0}, {"id": "MAT-08-024", "t": 8, "s": "Mock", "k": "Calculation", "m": 2, "ht": false, "q": "A cone has radius <b>3 cm<\/b> and height <b>5 cm<\/b>. Using V = ⅓πr²h (formula given), find the volume in terms of π.", "a": ["V = ⅓ × π × 3² × 5 (1)", "= <b>15π cm³<\/b> (1)"], "cp": ["V = ⅓ × π × 3² × 5", "= 15π cm³"], "dp": ["45π cm³", "30π cm³", "5π cm³"], "mand": 0}];

function flush(){
  if(!LOGURL||flushing)return;const q=qGet();if(!q.length)return;flushing=true;
  try{fetch(LOGURL,{method:"POST",mode:"no-cors",keepalive:q.length<20,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:LOGKEY,rows:q})})
   .then(()=>{qSet(qGet().slice(q.length));flushing=false;if(qGet().length)setTimeout(flush,300)}).catch(()=>{flushing=false;setTimeout(flush,20000)})}catch(e){flushing=false}
}

    const earned=curScore(c);
    body=`${fbBanner(c,earned)}<div class="opts">${R.opts.map((o,i)=>{const p=R.sel.includes(i);const st=p?(o.ok?"right":"wrong"):(o.ok?"missed":"");const ic=st==="right"?ICON.tick:st==="wrong"?ICON.cross:st==="missed"?ICON.tick:"";const lab=st==="right"?"Correct":st==="wrong"?"Not quite":st==="missed"?"You missed this one":"";return `<div class="pt opt done ${n===1?"single":""} ${st}"><span class="box">${ic}</span><span>${o.h}${lab?`<small class="olab">${lab}</small>`:""}</span></div>`}).join("")}</div>
    <div class="ans"><h3>Full mark scheme</h3><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div>
    <div class="score"><div class="big">${earned} / ${c.m} ${c.m===1?"mark":"marks"}</div><button class="btn" id="nextbtn" onclick="next()">${R.i+1===R.cards.length?"Finish":"Next question"}</button></div></div>`;
  }
  $("#app").innerHTML=`
  <div class="rhead"><button class="chip" onclick="if(confirm('Leave this round?'))go('home')">Quit</button><b>${R.label}</b><div class="seg">${R.cards.map((x,k)=>`<i class="${k<R.i?"d":k===R.i?"n":""}"></i>`).join("")}</div><span class="pill">${R.i+1} / ${R.cards.length}</span>${hearts}${R.combo>=2?`<span class="pill combo">${R.combo} in a row</span>`:""}<span class="pill">${R.earned} marks</span></div>
  <div class="card" style="--c:${col}" id="card">
    <div class="ctop"><span class="id">${c.id}</span><span class="tag c">${TOPICS[c.t].name}</span><span class="tag">${c.k}</span><span class="tag m">${c.m} ${c.m===1?"mark":"marks"}</span>${c.ht?'<span class="tag ht">Higher only</span>':""}<span class="tag">Spec ${c.s}</span></div>
    <p class="q">${c.q}</p>
    ${body}
  </div>`;
}
function fbBanner(c,e){
  const m=c.m,full=e===m,none=e===0;
  const T=full?["Full marks.","Spot on.","Brilliant."]:none?["Not this time."]:["Nearly there."];
  const h=T[(R.i+c.id.length)%T.length];
  const s=full?(m>1?"Every mark secured.":"Correct."):none?"Read the mark scheme below and it will stick next time.":e+" of "+m+" marks. Check what you missed below.";
  return `<div class="fb ${full?"full":none?"none":"part"}"><b>${h}</b><span>${s}</span></div>`}
function curScore(c){let s=0;R.sel.forEach(i=>{if(R.opts[i]&&R.opts[i].ok)s++});return Math.min(s,c.m)}
function reveal(){if(!R.sel.length||R.rev)return;R.rev=true;
  {const c=R.cards[R.i];logEvent({t:"answer",id:c.id,topic:TOPICS[c.t].name,kind:c.k,marks:curScore(c),max:c.m,sel:R.sel.map(i=>plain(R.opts[i].h)).join(" | "),miss:R.opts.filter((o,i)=>o.ok&&!R.sel.includes(i)).map(o=>plain(o.h)).join(" | "),round:R.label})}
  roundView();const a=document.querySelector(".opts");if(a)a.scrollIntoView({behavior:"smooth",block:"start"})}
function pick(i){const n=R.cards[R.i].m;const k=R.sel.indexOf(i);
  if(k>=0)R.sel.splice(k,1);else if(n===1)R.sel=[i];else if(R.sel.length<n)R.sel.push(i);else{toast("You have chosen "+n+". Untick one to change.");return}
  const y=window.scrollY;roundView();window.scrollTo(0,y)}
function next(){
  const c=R.cards[R.i],e=curScore(c);
  R.earned+=e;R.max+=c.m;R.log.push({c,e});R.combo=(e===c.m)?(R.combo||0)+1:0;
  const st=S.cards[c.id]||(S.cards[c.id]={box:0,seen:0,best:0});
  const ratio=e/c.m;st.seen++;st.best=Math.max(st.best,e);
  if(ratio>=.8)st.box=Math.min(3,st.box+1);else if(ratio<.5)st.box=0;else st.box=Math.max(1,st.box);
  let xp=e*10+(e===c.m?5:0);S.xp+=xp;S.marks+=e;
  {const a=S.tp[c.t]||(S.tp[c.t]={e:0,m:0});a.e+=e;a.m+=c.m;const k=S.kp[c.k]||(S.kp[c.k]={e:0,m:0});k.e+=e;k.m+=c.m;S.hist[todayStr()]=(S.hist[todayStr()]||0)+e;const ks=Object.keys(S.hist).sort();while(ks.length>60)delete S.hist[ks.shift()]}
  if(S.day.d!==todayStr())S.day={d:todayStr(),m:0};S.day.m+=e;
  if(e===c.m){S.perfect++;if(c.k==="Exam trap")S.traps++}
  let lost=false;
  if(R.survival&&e<Math.ceil(c.m/2)){R.hearts--;lost=true;if(R.hearts<=0)R.over=true}
  save();
  if(R.over||R.i+1>=R.cards.length){finish();return}
  R.i++;prep();roundView();window.scrollTo(0,0);
  if(lost){const el=$("#card");el.classList.add("shake")}
}
function finish(){
  S.rounds++;
  const t=todayStr();
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.last===y.toLocaleDateString("en-CA"))?S.streak+1:1;S.last=t}
  if(S.streak>(S.best||0))S.best=S.streak;
  if(R.survival&&!R.over)S.survWins++;
  S.recent.unshift({d:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),l:R.label,e:R.earned,m:R.max});S.recent=S.recent.slice(0,10);
  logEvent({t:"round",round:R.label,marks:R.earned,max:R.max,xp:R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0),totalxp:S.xp+0,cards:R.log.length,over:R.over?1:0});
  R.newBadges=checkBadges();save();view="result";render();window.scrollTo(0,0);if(!R.over&&R.max&&R.earned/R.max>=.7)confetti();
}
function resultView(){
  const pct=R.max?R.earned/R.max:0,stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const msg=R.over?"Out of lives. Review the cards you missed and go again.":pct>=.9?"Outstanding. That is top-grade recall.":pct>=.7?"Strong round. A few marks to tidy up.":pct>=.4?"Good effort. The missed cards will come round again.":"Tough one. Read the mark schemes and try again.";
  const missed=R.log.filter(x=>x.e<x.c.m).map(x=>x.c);
  $("#app").innerHTML=`<div class="card result" style="--c:${CFG.accent}">
   <h1 style="margin-top:0">${R.over?"Game over":"Round complete"}</h1><p class="sub">${msg}</p>
   <div class="stars">${[0,1,2].map(i=>`<span class="star ${i<stars?"on":""}">${ICON.star}</span>`).join("")}</div>
   <div class="rstats"><div class="stat"><b>${R.earned}/${R.max}</b><span>marks</span></div><div class="stat"><b>${Math.round(pct*100)}%</b><span>score</span></div><div class="stat"><b>+${R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0)}</b><span>points</span></div></div>
   ${R.newBadges&&R.newBadges.length?`<div class="newb">${R.newBadges.map(b=>`<div class="badge got" style="margin:8px 0"><span class="ic">${ICON.medal}</span><div><b>New badge: ${b.n}</b><small>${b.d}</small></div></div>`).join("")}</div>`:""}
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
    ${missed.length?`<button class="btn" onclick="replay()">Retry ${missed.length} missed</button>`:""}
    <button class="btn ghost" onclick="go('home')">Back to home</button></div>
   ${missed.length?`<h2>Review</h2><div style="text-align:left">${missed.map(c=>`<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span></summary><div class="body"><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`).join("")}</div>`:""}
  </div>`;
  R.missed=missed;
}
function confetti(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cols=[CFG.accent,CFG.accent2,"#ffb84d","#3ddc97","#ffffff"];for(let i=0;i<46;i++){const s=document.createElement("i");s.className="conf";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.animationDuration=(1.8+Math.random()*1.6)+"s";s.style.animationDelay=(Math.random()*.5)+"s";s.style.borderRadius=i%3?"2px":"50%";document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function replay(){const m=R.missed;R={cards:shuffle(m.slice()),i:0,earned:0,max:0,hearts:null,survival:false,label:"Retry",rev:false,sel:[],log:[],over:false};prep();view="round";render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* ---------- library ---------- */
function library(){
  const kinds=[...new Set(DATA.map(c=>c.k))].sort();
  $("#app").innerHTML=`<div class="lib"><h1>Card <span class="grad">library</span></h1><p class="sub">Every question with its full mark scheme. Tap a card to open it.</p>
  <div class="chips">${[0].concat(TN).map(t=>`<button class="chip ${LIB.t===t?"on":""}" onclick="LIB.t=${t};library()">${t?"Topic "+t:"All topics"}</button>`).join("")}</div>
  <div class="chips"><input type="search" id="lq" placeholder="Search questions and answers" value="${LIB.q.replace(/"/g,"&quot;")}"><select id="lk"><option value="">All question types</option>${kinds.map(k=>`<option ${LIB.k===k?"selected":""}>${k}</option>`).join("")}</select><button class="chip" id="lo">Open all</button></div>
  <div id="lres"></div></div>`;
  const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
render();
</script>
