 - 20 = 50 (1)", "Change in time = 5 minutes (1)", "50 ÷ 5 = <b>10 litres per minute<\/b> (1)"], "cp": ["Change in litres = 70 - 20 = 50", "Change in time = 5 minutes", "50 ÷ 5 = 10 litres per minute"], "dp": ["14 litres per minute", "18 litres per minute", "350 litres per minute"], "mand": 0}, {"id": "MAT-03-033", "t": 3, "s": "R12", "k": "Calculation", "m": 3, "ht": false, "q": "Triangles A and B are <b>similar<\/b>. The sides of A are 3, 4, 5. The shortest side of B is 9. Find the <b>scale factor<\/b> and the <b>longest side<\/b> of B.", "a": ["Scale factor = 9 ÷ 3 = <b>3<\/b> (1)", "Longest side = 5 × 3 (1)", "= <b>15<\/b> (1)"], "cp": ["Scale factor = 9 ÷ 3 = 3", "Longest side = 5 × 3", "= 15"], "dp": ["Scale factor 6 and longest side 11", "Scale factor 3 and longest side 8", "Scale factor 12 and longest side 60"], "mand": 0}, {"id": "MAT-03-034", "t": 3, "s": "R13", "k": "Calculation", "m": 3, "ht": false, "q": "Write the ratio <b>2 : 5<\/b> as <b>1 : n<\/b>.", "a": ["Divide both by 2 (1)", "1 : 2.5 (1)", "So <b>n = 2.5<\/b> (1)"], "cp": ["Divide both by 2", "1 : 2.5", "So n = 2.5"], "dp": ["n = 0.4", "n = 5", "n = 10"], "mand": 0}, {"id": "MAT-03-035", "t": 3, "s": "R16", "k": "Recall", "m": 2, "ht": false, "q": "What does <b>1 : 5<\/b> mean, and how is it different from <b>1/5<\/b>?", "a": ["1 : 5 means <b>1 part to 5 parts<\/b> (1)", "The fraction 1/5 means <b>1 part out of 5 total parts<\/b> (1)"], "cp": ["1 : 5 means 1 part to 5 parts", "The fraction 1/5 means 1 part out of 5 total parts"], "dp": ["1 : 5 is the same as 1/5", "1 : 5 means 5 parts to 1 part", "They are always equal"], "mand": 0}, {"id": "MAT-03-036", "t": 3, "s": "R2", "k": "Exam trap", "m": 2, "ht": false, "q": "Share 24 in the ratio 1 : 3. A student does 24 ÷ 3 = 8. What went wrong?", "a": ["They did not <b>add the parts<\/b> first (1)", "1 + 3 = 4 parts, so 1 part = 6, shares are <b>6 and 18<\/b> (1)"], "cp": ["They did not add the parts first", "1 + 3 = 4 parts, so 1 part = 6, shares are 6 and 18"], "dp": ["Nothing, 8 and 16 is right", "The ratio should be 1 : 2", "They should divide by 1"], "mand": 0}, {"id": "MAT-03-037", "t": 3, "s": "R4", "k": "Calculation", "m": 3, "ht": false, "q": "A recipe uses 250 g of butter. A packet is 1 pound. 1 lb = 454 g. How many whole <b>recipes<\/b> from one packet?", "a": ["454 ÷ 250 (1)", "= 1.816 (1)", "Only <b>1<\/b> whole recipe (1)"], "cp": ["454 ÷ 250", "= 1.816", "Only 1 whole recipe"], "dp": ["2", "4", "1.8 recipes exactly"], "mand": 0}, {"id": "MAT-03-038", "t": 3, "s": "R11", "k": "Data", "m": 2, "ht": false, "q": "The graph of cost against units for electricity is a straight line through the origin. What does this show?", "a": ["Cost is <b>directly proportional<\/b> to units used (1)", "The <b>gradient<\/b> is the price per unit (1)"], "cp": ["Cost is directly proportional to units used", "The gradient is the price per unit"], "dp": ["There is a fixed charge", "The cost is inversely proportional", "The cost does not change"], "mand": 0}, {"id": "MAT-03-039", "t": 3, "s": "R8", "k": "Calculation", "m": 3, "ht": false, "q": "A shop reduces a coat by 30% to £56. What was the <b>original price<\/b>?", "a": ["£56 is 70% of the original (1)", "56 ÷ 0.7 (1)", "= <b>£80<\/b> (1)"], "cp": ["£56 is 70% of the original", "56 ÷ 0.7", "= £80"], "dp": ["£72.80", "£39.20", "£86"], "mand": 0}, {"id": "MAT-03-040", "t": 3, "s": "R5", "k": "Calculation", "m": 3, "ht": false, "q": "Which is the <b>better buy<\/b>? <b>500 g for £1.20<\/b> or <b>750 g for £1.65<\/b>.", "a": ["Price per 100 g: 1.20 ÷ 5 = 24p (1)", "1.65 ÷ 7.5 = 22p (1)", "The <b>750 g pack<\/b> is the better buy (1)"], "cp": ["Price per 100 g: 1.20 ÷ 5 = 24p", "1.65 ÷ 7.5 = 22p", "The 750 g pack is the better buy"], "dp": ["The 500 g pack, because it is cheaper", "They cost the same per gram", "The 750 g pack, because it has a higher total price"], "mand": 0}, {"id": "MAT-03-041", "t": 3, "s": "R9", "k": "Calculation", "m": 3, "ht": false, "q": "After a <b>20% reduction<\/b> a coat costs <b>£48<\/b>. Work out the <b>original price<\/b>.", "a": ["After the reduction the price is 80% of the original (1)", "80% = £48, so 1% = £0.60 (1)", "Original = 100% = <b>£60<\/b> (1)"], "cp": ["After the reduction the price is 80% of the original", "80% = £48, so 1% = £0.60", "Original = 100% = £60"], "dp": ["£57.60", "£38.40", "£68"], "mand": 0}, {"id": "MAT-03-042", "t": 3, "s": "R9", "k": "Calculation", "m": 2, "ht": false, "q": "Work out the <b>simple interest<\/b> on <b>£400<\/b> at <b>3% per year<\/b> for <b>5 years<\/b>.", "a": ["Interest each year = 3% of 400 = £12 (1)", "5 years: 12 × 5 = <b>£60<\/b> (1)"], "cp": ["Interest each year = 3% of 400 = £12", "5 years: 12 × 5 = £60"], "dp": ["£12", "£463.71", "£412"], "mand": 0}, {"id": "MAT-03-043", "t": 3, "s": "R16", "k": "Calculation", "m": 3, "ht": false, "q": "A car is worth <b>£10 000<\/b> and loses <b>15%<\/b> of its value each year. Work out its value after <b>2 years<\/b>.", "a": ["Multiplier = <b>0.85<\/b> (1)", "10 000 × 0.85<sup>2<\/sup> (1)", "= <b>£7225<\/b> (1)"], "cp": ["Multiplier = 0.85", "10 000 × 0.85<sup>2<\/sup>", "= £7225"], "dp": ["£7000", "£7500", "£8500"], "mand": 0}, {"id": "MAT-03-044", "t": 3, "s": "R14", "k": "Recall", "m": 2, "ht": false, "q": "What does the <b>gradient<\/b> of a <b>distance-time graph<\/b> represent? What about a <b>straight line<\/b> on such a graph?", "a": ["The gradient is the <b>speed<\/b> (rate of change of distance) (1)", "A straight line means a <b>constant speed<\/b> (1)"], "cp": ["The gradient is the speed (rate of change of distance)", "A straight line means a constant speed"], "dp": ["The gradient is the distance travelled", "A straight line means the object is accelerating", "The gradient is the time taken"], "mand": 0}, {"id": "MAT-04-001", "t": 4, "s": "G1", "k": "Recall", "m": 3, "ht": false, "q": "State the angle rules for <b>a straight line, around a point and in a triangle<\/b>.", "a": ["Angles on a straight line add to <b>180°<\/b> (1)", "Angles around a point add to <b>360°<\/b> (1)", "Angles in a triangle add to <b>180°<\/b> (1)"], "cp": ["Angles on a straight line add to 180°", "Angles around a point add to 360°", "Angles in a triangle add to 180°"], "dp": ["A straight line is 90°, a point is 180°, a triangle is 360°", "A straight line is 360°, a point is 180°, a triangle is 90°", "All three add to 180°"], "mand": 0}, {"id": "MAT-04-002", "t": 4, "s": "G1", "k": "Recall", "m": 2, "ht": false, "q": "What is the sum of the angles in a <b>quadrilateral<\/b>? Explain why.", "a": ["<b>360°<\/b> (1)", "A quadrilateral splits into <b>two triangles<\/b>, each 180° (1)"], "cp": ["360°", "A quadrilateral splits into two triangles, each 180°"], "dp": ["180° because it has 4 sides", "720°", "540°"], "mand": 0}, {"id": "MAT-04-003", "t": 4, "s": "G1", "k": "Calculation", "m": 3, "ht": false, "q": "Two angles on a straight line are 2x and 3x + 10. Find <b>x<\/b>.", "a": ["Angles on a line add to 180: 5x + 10 = 180 (1)", "5x = 170 (1)", "<b>x = 34<\/b> (1)"], "cp": ["Angles on a line add to 180: 5x + 10 = 180", "5x = 170", "x = 34"], "dp": ["x = 36", "x = 17", "x = 38"], "mand": 0}, {"id": "MAT-04-004", "t": 4, "s": "G1", "k": "Calculation", "m": 3, "ht": false, "q": "An isosceles triangle has a <b>top angle of 40°<\/b>. Find the <b>base angles<\/b>.", "a": ["Base angles are equal; the angles add to 180° (1)", "180 - 40 = 140 (1)", "140 ÷ 2 = <b>70°<\/b> each (1)"], "cp": ["Base angles are equal; the angles add to 180°", "180 - 40 = 140", "140 ÷ 2 = 70° each"], "dp": ["40°", "50°", "140°"], "mand": 0}, {"id": "MAT-04-005", "t": 4, "s": "G2", "k": "Recall", "m": 3, "ht": false, "q": "A line crosses two <b>parallel lines<\/b>. Name the <b>three types of equal or supplementary angles<\/b>.", "a": ["<b>Corresponding<\/b> angles are equal (F shape) (1)", "<b>Alternate<\/b> angles are equal (Z shape) (1)", "<b>Co-interior<\/b> angles add to 180° (C shape) (1)"], "cp": ["Corresponding angles are equal (F shape)", "Alternate angles are equal (Z shape)", "Co-interior angles add to 180° (C shape)"], "dp": ["Alternate angles add to 180°", "Corresponding angles add to 180°", "Co-interior angles are equal"], "mand": 0}, {"id": "MAT-04-006", "t": 4, "s": "G2", "k": "Calculation", "m": 3, "ht": false, "q": "Two parallel lines are cut by a transversal. One <b>co-interior angle<\/b> is 65°. Find the other co-interior angle and say why.", "a": ["Co-interior angles add to 180° (1)", "180 - 65 (1)", "= <b>115°<\/b> (1)"], "cp": ["Co-interior angles add to 180°", "180 - 65", "= 115°"], "dp": ["65° because alternate angles are equal", "25°", "295°"], "mand": 0}, {"id": "MAT-04-007", "t": 4, "s": "G2", "k": "Explain", "m": 3, "ht": false, "q": "Explain in words why the <b>exterior angle of a triangle<\/b> equals the sum of the two opposite interior angles.", "a": ["Exterior angle + adjacent interior angle = 180° (straight line) (1)", "The three interior angles add to 180° (1)", "So the exterior angle equals the other two interior angles added together (1)"], "cp": ["Exterior angle + adjacent interior angle = 180° (straight line)", "The three interior angles add to 180°", "So the exterior angle equals the other two interior angles added together"], "dp": ["It always equals 90°", "It equals the adjacent interior angle", "Exterior angles add to 360° so it must equal 120°"], "mand": 0}, {"id": "MAT-04-008", "t": 4, "s": "G3", "k": "Recall", "m": 2, "ht": false, "q": "Give the <b>formula<\/b> for the sum of the interior angles of an n-sided polygon.", "a": ["<b>(n - 2) × 180°<\/b> (1)", "e.g. a hexagon: 4 × 180 = 720° (1)"], "cp": ["(n - 2) × 180°", "e.g. a hexagon: 4 × 180 = 720°"], "dp": ["n × 180°", "(n + 2) × 180°", "(n - 2) × 360°"], "mand": 0}, {"id": "MAT-04-009", "t": 4, "s": "G3", "k": "Calculation", "m": 3, "ht": false, "q": "Find the <b>interior angle<\/b> of a <b>regular octagon<\/b>.", "a": ["Sum = (8 - 2) × 180 = 1080° (1)", "1080 ÷ 8 (1)", "= <b>135°<\/b> (1)"], "cp": ["Sum = (8 - 2) × 180 = 1080°", "1080 ÷ 8", "= 135°"], "dp": ["45°", "120°", "150°"], "mand": 0}, {"id": "MAT-04-010", "t": 4, "s": "G3", "k": "Calculation", "m": 3, "ht": false, "q": "A regular polygon has an <b>exterior angle of 30°<\/b>. How many sides?", "a": ["Exterior angles add to 360° (1)", "360 ÷ 30 (1)", "= <b>12 sides<\/b> (1)"], "cp": ["Exterior angles add to 360°", "360 ÷ 30", "= 12 sides"], "dp": ["6 sides", "10 sides", "15 sides"], "mand": 0}, {"id": "MAT-04-011", "t": 4, "s": "G3", "k": "Recall", "m": 2, "ht": false, "q": "What do the <b>exterior angles of any polygon<\/b> add up to?", "a": ["<b>360°<\/b> (1)", "For a regular polygon, each is 360 ÷ n (1)"], "cp": ["360°", "For a regular polygon, each is 360 ÷ n"], "dp": ["180°", "720°", "It depends on the number of sides"], "mand": 0}, {"id": "MAT-04-012", "t": 4, "s": "G4", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>bearing<\/b>? How is it measured?", "a": ["An angle measured <b>clockwise from North<\/b> (1)", "Always written with <b>3 digits<\/b>, e.g. 045° (1)"], "cp": ["An angle measured clockwise from North", "Always written with 3 digits, e.g. 045°"], "dp": ["Measured anticlockwise from North", "Measured clockwise from East", "Written with 2 digits"], "mand": 0}, {"id": "MAT-04-013", "t": 4, "s": "G4", "k": "Calculation", "m": 3, "ht": false, "q": "The bearing of B from A is <b>070°<\/b>. Find the <b>bearing of A from B<\/b>.", "a": ["Back bearing: add 180° (1)", "70 + 180 (1)", "= <b>250°<\/b> (1)"], "cp": ["Back bearing: add 180°", "70 + 180", "= 250°"], "dp": ["110°", "290°", "020°"], "mand": 0}, {"id": "MAT-04-014", "t": 4, "s": "G4", "k": "Calculation", "m": 3, "ht": false, "q": "The bearing of B from A is <b>250°<\/b>. Find the bearing of A from B.", "a": ["If the bearing is over 180°, subtract 180° (1)", "250 - 180 (1)", "= <b>070°<\/b> (1)"], "cp": ["If the bearing is over 180°, subtract 180°", "250 - 180", "= 070°"], "dp": ["430°", "110°", "290°"], "mand": 0}, {"id": "MAT-04-015", "t": 4, "s": "G5", "k": "Recall", "m": 3, "ht": false, "q": "List the <b>four conditions for congruent triangles<\/b>.", "a": ["<b>SSS<\/b>: three sides equal (1)", "<b>SAS<\/b> (two sides and the included angle) and <b>ASA<\/b> (two angles and a side) (1)", "<b>RHS<\/b>: right angle, hypotenuse, side (1)"], "cp": ["SSS: three sides equal", "SAS (two sides and the included angle) and ASA (two angles and a side)", "RHS: right angle, hypotenuse, side"], "dp": ["SSA, AAA, SAS and RHS", "AAA only", "SSS and AAA only"], "mand": 0}, {"id": "MAT-04-016", "t": 4, "s": "G5", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>AAA<\/b> not enough to show triangles are <b>congruent<\/b>?", "a": ["AAA gives the same <b>shape<\/b> (similar triangles) (1)", "They can be <b>different sizes<\/b> (1)"], "cp": ["AAA gives the same shape (similar triangles)", "They can be different sizes"], "dp": ["It is enough for congruence", "AAA triangles are always the same size", "AAA only works for right-angled triangles"], "mand": 0}, {"id": "MAT-04-017", "t": 4, "s": "G6", "k": "Recall", "m": 2, "ht": false, "q": "What does it mean if a shape has <b>line symmetry<\/b> and <b>rotational symmetry of order 3<\/b>?", "a": ["A line of symmetry splits the shape into two <b>mirror-image halves<\/b> (1)", "Order 3 means it looks the same <b>3 times<\/b> in one full turn (1)"], "cp": ["A line of symmetry splits the shape into two mirror-image halves", "Order 3 means it looks the same 3 times in one full turn"], "dp": ["Rotational symmetry of order 3 means turned through 3°", "Line symmetry means every part turns", "Order 3 means 3 lines of symmetry only"], "mand": 0}, {"id": "MAT-04-018", "t": 4, "s": "G6", "k": "Recall", "m": 3, "ht": false, "q": "How many <b>lines of symmetry<\/b> and what <b>order of rotational symmetry<\/b> does a square, an equilateral triangle and a rectangle have?", "a": ["Square: <b>4 lines, order 4<\/b> (1)", "Equilateral triangle: <b>3 lines, order 3<\/b> (1)", "Rectangle: <b>2 lines, order 2<\/b> (1)"], "cp": ["Square: 4 lines, order 4", "Equilateral triangle: 3 lines, order 3", "Rectangle: 2 lines, order 2"], "dp": ["Square: 2 lines, order 2", "Rectangle: 4 lines, order 4", "Equilateral triangle: 1 line, order 1"], "mand": 0}, {"id": "MAT-04-019", "t": 4, "s": "G7", "k": "Recall", "m": 3, "ht": false, "q": "List the properties of a <b>parallelogram, rhombus and kite<\/b>.", "a": ["<b>Parallelogram<\/b>: opposite sides equal and parallel (1)", "<b>Rhombus<\/b>: all four sides equal, diagonals cross at right angles (1)", "<b>Kite<\/b>: two pairs of adjacent equal sides (1)"], "cp": ["Parallelogram: opposite sides equal and parallel", "Rhombus: all four sides equal, diagonals cross at right angles", "Kite: two pairs of adjacent equal sides"], "dp": ["Parallelogram: all sides equal", "Rhombus: only two sides equal", "Kite: opposite sides parallel"], "mand": 0}, {"id": "MAT-04-020", "t": 4, "s": "G7", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>difference between a rectangle and a square<\/b>? What about a trapezium?", "a": ["A square has <b>all sides equal<\/b>; a rectangle only opposite sides (1)", "A trapezium has <b>one pair of parallel sides<\/b> (1)"], "cp": ["A square has all sides equal; a rectangle only opposite sides", "A trapezium has one pair of parallel sides"], "dp": ["A square has only opposite sides equal", "A trapezium has two pairs of parallel sides", "They are the same"], "mand": 0}, {"id": "MAT-04-021", "t": 4, "s": "G8", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>mathematical name<\/b> for each: a shape turning (a), sliding (b), flipping in a mirror line (c)?", "a": ["(a) <b>Rotation<\/b> (1)", "(b) <b>Translation<\/b> (1)", "(c) <b>Reflection<\/b> (1)"], "cp": ["(a) Rotation", "(b) Translation", "(c) Reflection"], "dp": ["(a) Reflection, (b) Rotation, (c) Translation", "(a) Translation, (b) Reflection, (c) Rotation", "(a) Enlargement, (b) Rotation, (c) Reflection"], "mand": 0}, {"id": "MAT-04-022", "t": 4, "s": "G8", "k": "Calculation", "m": 3, "ht": false, "q": "A shape is <b>reflected in the line x = 2<\/b>. One vertex is at (5, 1). Where is that vertex after the reflection?", "a": ["The distance from x = 2 is 3 (1)", "The image is 3 on the other side: x = 2 - 3 = -1 (1)", "<b>(-1, 1)<\/b> (1)"], "cp": ["The distance from x = 2 is 3", "The image is 3 on the other side: x = 2 - 3 = -1", "(-1, 1)"], "dp": ["(-5, 1)", "(-3, 1)", "(5, -1)"], "mand": 0}, {"id": "MAT-04-023", "t": 4, "s": "G8", "k": "Calculation", "m": 3, "ht": false, "q": "Rotate the point <b>(2, 1)<\/b> by <b>90° clockwise<\/b> about the origin. Where does it go?", "a": ["Clockwise 90°: (x, y) goes to (y, -x) (1)", "(2, 1) goes to (1, -2) (1)", "<b>(1, -2)<\/b> (1)"], "cp": ["Clockwise 90°: (x, y) goes to (y, -x)", "(2, 1) goes to (1, -2)", "(1, -2)"], "dp": ["(-1, 2)", "(-2, -1)", "(-1, -2)"], "mand": 0}, {"id": "MAT-04-024", "t": 4, "s": "G8", "k": "Recall", "m": 3, "ht": false, "q": "What <b>three things<\/b> do you need to describe a <b>rotation<\/b>, a <b>reflection<\/b> and an <b>enlargement<\/b> fully?", "a": ["<b>Rotation<\/b>: angle, direction and centre (1)", "<b>Reflection<\/b>: the mirror line (1)", "<b>Enlargement<\/b>: scale factor and centre (1)"], "cp": ["Rotation: angle, direction and centre", "Reflection: the mirror line", "Enlargement: scale factor and centre"], "dp": ["Rotation: scale factor and centre", "Reflection: angle and direction", "Enlargement: angle and mirror line"], "mand": 0}, {"id": "MAT-04-025", "t": 4, "s": "G8", "k": "Calculation", "m": 3, "ht": false, "q": "Enlarge the triangle with vertices (1, 1), (3, 1), (1, 2) by <b>scale factor 2<\/b> from the origin. Where are the new vertices?", "a": ["Multiply every coordinate by 2 (1)", "(1, 1) to (2, 2) and (3, 1) to (6, 2) (1)", "(1, 2) goes to <b>(2, 4)<\/b> (1)"], "cp": ["Multiply every coordinate by 2", "(1, 1) to (2, 2) and (3, 1) to (6, 2)", "(1, 2) goes to (2, 4)"], "dp": ["(2, 2), (5, 1), (2, 3)", "(3, 3), (5, 3), (3, 4)", "(2, 2), (6, 2), (2, 3)"], "mand": 0}, {"id": "MAT-04-026", "t": 4, "s": "G8", "k": "Recall", "m": 2, "ht": false, "q": "A shape is translated by the vector <b>(3 over -2)<\/b>. What does it mean?", "a": ["Move <b>3 right<\/b> (1)", "and <b>2 down<\/b> (1)"], "cp": ["Move 3 right", "and 2 down"], "dp": ["3 down and 2 right", "3 left and 2 up", "3 up and 2 left"], "mand": 0}, {"id": "MAT-04-027", "t": 4, "s": "G9", "k": "Recall", "m": 3, "ht": false, "q": "What are the steps to <b>construct the perpendicular bisector<\/b> of a line AB?", "a": ["Set compasses to <b>more than half<\/b> of AB (1)", "Draw arcs from <b>A and B<\/b> so they cross above and below (1)", "Join the two crossing points with a <b>ruler<\/b> (1)"], "cp": ["Set compasses to more than half of AB", "Draw arcs from A and B so they cross above and below", "Join the two crossing points with a ruler"], "dp": ["Use a protractor to draw a 90° angle at A", "Draw arcs of the same radius around one end only", "Measure the line and draw a perpendicular"], "mand": 0}, {"id": "MAT-04-028", "t": 4, "s": "G9", "k": "Recall", "m": 3, "ht": false, "q": "How do you <b>construct an angle bisector<\/b>?", "a": ["Arc from the vertex cutting both lines (1)", "Arcs of the same radius from each cut point so they cross (1)", "Join the vertex to the crossing point (<b>bisector<\/b>) (1)"], "cp": ["Arc from the vertex cutting both lines", "Arcs of the same radius from each cut point so they cross", "Join the vertex to the crossing point (bisector)"], "dp": ["Measure the angle and halve it by guessing", "Draw a line through the centre of the page", "Join two points on the lines"], "mand": 0}, {"id": "MAT-04-029", "t": 4, "s": "G10", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>locus<\/b>? Describe the locus of points <b>3 cm from a point<\/b>.", "a": ["A locus is a set of points obeying a rule (1)", "A <b>circle of radius 3 cm<\/b> (1)"], "cp": ["A locus is a set of points obeying a rule", "A circle of radius 3 cm"], "dp": ["A single point", "A straight line", "A circle of diameter 3 cm"], "mand": 0}, {"id": "MAT-04-030", "t": 4, "s": "G10", "k": "Recall", "m": 2, "ht": false, "q": "Describe the locus of points <b>equidistant from two points A and B<\/b>, and the locus of points equidistant from two lines meeting at a point.", "a": ["Equidistant from A and B: the <b>perpendicular bisector<\/b> of AB (1)", "Equidistant from two lines: the <b>angle bisector<\/b> (1)"], "cp": ["Equidistant from A and B: the perpendicular bisector of AB", "Equidistant from two lines: the angle bisector"], "dp": ["Equidistant from A and B: a circle", "Equidistant from two lines: perpendicular bisector", "They are both circles"], "mand": 0}, {"id": "MAT-04-031", "t": 4, "s": "G11", "k": "Recall", "m": 3, "ht": false, "q": "List the <b>parts of a circle<\/b>: circumference, radius, diameter, chord, tangent, arc, sector, segment.", "a": ["<b>Circumference<\/b>: the distance round; <b>radius<\/b>: centre to edge; <b>diameter<\/b>: across through the centre (1)", "<b>Chord<\/b>: a line joining two points on the edge; <b>tangent<\/b>: touches at one point (1)", "<b>Arc<\/b>: part of the edge; <b>sector<\/b>: slice; <b>segment<\/b>: between a chord and the arc (1)"], "cp": ["Circumference: the distance round; radius: centre to edge; diameter: across through the centre", "Chord: a line joining two points on the edge; tangent: touches at one point", "Arc: part of the edge; sector: slice; segment: between a chord and the arc"], "dp": ["Chord: a line from the centre to the edge", "Sector: the area between a chord and an arc", "Diameter: half the radius"], "mand": 0}, {"id": "MAT-04-032", "t": 4, "s": "G13", "k": "Explain", "m": 2, "ht": false, "q": "How can you show that <b>vectors are parallel<\/b>? What if they share a point?", "a": ["Parallel vectors are <b>multiples<\/b> of each other (1)", "If they are parallel and share a point they are on <b>one straight line<\/b> (collinear) (1)"], "cp": ["Parallel vectors are multiples of each other", "If they are parallel and share a point they are on one straight line (collinear)"], "dp": ["Parallel vectors must be equal", "Parallel vectors add to zero", "They must have the same length"], "mand": 0}, {"id": "MAT-04-033", "t": 4, "s": "G14", "k": "Calculation", "m": 3, "ht": false, "q": "Show that the <b>angle sum of a pentagon<\/b> is 540°.", "a": ["A pentagon splits into 3 triangles from one vertex (1)", "3 × 180 (1)", "= <b>540°<\/b> (1)"], "cp": ["A pentagon splits into 3 triangles from one vertex", "3 × 180", "= 540°"], "dp": ["5 × 90 = 450°", "4 × 180 = 720°", "2 × 180 = 360°"], "mand": 0}, {"id": "MAT-04-034", "t": 4, "s": "G14", "k": "Calculation", "m": 3, "ht": false, "q": "The interior angles of a pentagon are x, x + 20, x + 40, 2x and 100. Find <b>x<\/b>.", "a": ["The sum is 540° (1)", "5x + 160 = 540, so 5x = 380 (1)", "<b>x = 76<\/b> (1)"], "cp": ["The sum is 540°", "5x + 160 = 540, so 5x = 380", "x = 76"], "dp": ["x = 80", "x = 60", "x = 72"], "mand": 0}, {"id": "MAT-04-035", "t": 4, "s": "G15", "k": "Exam trap", "m": 2, "ht": false, "q": "Two angles in a diagram look equal, so a student says they are equal. Why is that not a valid reason in a proof?", "a": ["Diagrams are <b>not drawn accurately<\/b> (NTS: not to scale) (1)", "You must give a <b>reason from an angle rule<\/b> (1)"], "cp": ["Diagrams are not drawn accurately (NTS: not to scale)", "You must give a reason from an angle rule"], "dp": ["Diagrams are always accurate", "Looking equal is enough", "Only measuring with a protractor counts"], "mand": 0}, {"id": "MAT-04-036", "t": 4, "s": "G7", "k": "Calculation", "m": 2, "ht": false, "q": "Four shapes: square, rectangle, rhombus and kite. Which has <b>all four sides equal<\/b>?", "a": ["A <b>square<\/b> (1)", "and a <b>rhombus<\/b> (1)"], "cp": ["A square", "and a rhombus"], "dp": ["Rectangle and kite", "Square and kite", "Rectangle and rhombus"], "mand": 0}, {"id": "MAT-04-037", "t": 4, "s": "G3", "k": "Calculation", "m": 3, "ht": false, "q": "A regular polygon has an interior angle of <b>156°<\/b>. How many sides does it have?", "a": ["Exterior angle = 180 - 156 = 24° (1)", "360 ÷ 24 (1)", "= <b>15 sides<\/b> (1)"], "cp": ["Exterior angle = 180 - 156 = 24°", "360 ÷ 24", "= 15 sides"], "dp": ["12 sides", "18 sides", "24 sides"], "mand": 0}, {"id": "MAT-04-038", "t": 4, "s": "G2", "k": "Calculation", "m": 3, "ht": false, "q": "In a diagram with parallel lines, one angle is 3x and the alternate angle is x + 50. Find x.", "a": ["Alternate angles are equal: 3x = x + 50 (1)", "2x = 50 (1)", "<b>x = 25<\/b> (1)"], "cp": ["Alternate angles are equal: 3x = x + 50", "2x = 50", "x = 25"], "dp": ["x = 50", "x = 12.5", "x = 40"], "mand": 0}, {"id": "MAT-05-001", "t": 5, "s": "G16", "k": "Recall", "m": 3, "ht": false, "q": "Write the <b>area formulae<\/b> for a rectangle, triangle and parallelogram.", "a": ["Rectangle: <b>length × width<\/b> (1)", "Triangle: <b>1/2 × base × perpendicular height<\/b> (1)", "Parallelogram: <b>base × perpendicular height<\/b> (1)"], "cp": ["Rectangle: length × width", "Triangle: 1/2 × base × perpendicular height", "Parallelogram: base × perpendicular height"], "dp": ["Triangle: base × height", "Parallelogram: 1/2 × base × height", "Rectangle: 2 × (length + width)"], "mand": 0}, {"id": "MAT-05-002", "t": 5, "s": "G16", "k": "Recall", "m": 2, "ht": false, "q": "Write the <b>area formula for a trapezium<\/b>.", "a": ["Area = <b>1/2 × (a + b) × h<\/b> (1)", "a and b are the <b>parallel sides<\/b>, h is the perpendicular height (1)"], "cp": ["Area = 1/2 × (a + b) × h", "a and b are the parallel sides, h is the perpendicular height"], "dp": ["Area = a × b × h", "Area = 1/2 × a × b", "Area = (a + b) × h"], "mand": 0}, {"id": "MAT-05-003", "t": 5, "s": "G16", "k": "Calculation", "m": 3, "ht": false, "q": "A trapezium has parallel sides 6 cm and 10 cm and a height of 4 cm. Find its <b>area<\/b>.", "a": ["Area = 1/2 × (6 + 10) × 4 (1)", "= 1/2 × 16 × 4 (1)", "= <b>32 cm<sup>2<\/sup><\/b> (1)"], "cp": ["Area = 1/2 × (6 + 10) × 4", "= 1/2 × 16 × 4", "= 32 cm<sup>2<\/sup>"], "dp": ["64 cm<sup>2<\/sup>", "40 cm<sup>2<\/sup>", "24 cm<sup>2<\/sup>"], "mand": 0}, {"id": "MAT-05-004", "t": 5, "s": "G16", "k": "Calculation", "m": 3, "ht": false, "q": "A triangle has base 9 cm and perpendicular height 6 cm. Find its <b>area<\/b>.", "a": ["Area = 1/2 × base × height (1)", "= 1/2 × 9 × 6 (1)", "= <b>27 cm<sup>2<\/sup><\/b> (1)"], "cp": ["Area = 1/2 × base × height", "= 1/2 × 9 × 6", "= 27 cm<sup>2<\/sup>"], "dp": ["54 cm<sup>2<\/sup>", "15 cm<sup>2<\/sup>", "30 cm<sup>2<\/sup>"], "mand": 0}, {"id": "MAT-05-005", "t": 5, "s": "G16", "k": "Calculation", "m": 3, "ht": false, "q": "An L-shape is made from a 10 cm by 4 cm rectangle and a 3 cm by 3 cm square joined on. Find the <b>total area<\/b>.", "a": ["Rectangle: 10 × 4 = 40 (1)", "Square: 3 × 3 = 9 (1)", "Total = <b>49 cm<sup>2<\/sup><\/b> (1)"], "cp": ["Rectangle: 10 × 4 = 40", "Square: 3 × 3 = 9", "Total = 49 cm<sup>2<\/sup>"], "dp": ["13 cm<sup>2<\/sup>", "43 cm<sup>2<\/sup>", "52 cm<sup>2<\/sup>"], "mand": 0}, {"id": "MAT-05-006", "t": 5, "s": "G17", "k": "Recall", "m": 2, "ht": false, "q": "Write the formulae for the <b>circumference<\/b> and <b>area of a circle<\/b>.", "a": ["Circumference = <b>π × diameter<\/b> (C = πd = 2πr) (1)", "Area = <b>π × r<sup>2<\/sup><\/b> (1)"], "cp": ["Circumference = π × diameter (C = πd = 2πr)", "Area = π × r<sup>2<\/sup>"], "dp": ["Area = 2πr", "Circumference = πr<sup>2<\/sup>", "Circumference = πr"], "mand": 0}, {"id": "MAT-05-007", "t": 5, "s": "G17", "k": "Calculation", "m": 2, "ht": false, "q": "Find the <b>circumference<\/b> of a circle of radius 5 cm. Give your answer in terms of π.", "a": ["C = 2πr = 2 × π × 5 (1)", "= <b>10π cm<\/b> (1)"], "cp": ["C = 2πr = 2 × π × 5", "= 10π cm"], "dp": ["25π cm", "5π cm", "10π cm<sup>2<\/sup>"], "mand": 0}, {"id": "MAT-05-008", "t": 5, "s": "G17", "k": "Calculation", "m": 3, "ht": false, "q": "Find the <b>area<\/b> of a circle with diameter 12 cm. Give your answer to 1 decimal place.", "a": ["r = 6 (1)", "Area = π × 6<sup>2<\/sup> = 36π (1)", "= <b>113.1 cm<sup>2<\/sup><\/b> (1)"], "cp": ["r = 6", "Area = π × 6<sup>2<\/sup> = 36π", "= 113.1 cm<sup>2<\/sup>"], "dp": ["452.4 cm<sup>2<\/sup>", "37.7 cm<sup>2<\/sup>", "226.2 cm<sup>2<\/sup>"], "mand": 0}, {"id": "MAT-05-009", "t": 5, "s": "G17", "k": "Exam trap", "m": 2, "ht": false, "q": "A circle has diameter 10 cm. A student works out area = π × 10<sup>2<\/sup>. What is wrong?", "a": ["They used the <b>diameter<\/b> instead of the <b>radius<\/b> (1)", "r = 5 so area = π × 25 = <b>25π<\/b> (1)"], "cp": ["They used the diameter instead of the radius", "r = 5 so area = π × 25 = 25π"], "dp": ["Nothing is wrong", "They should use 10 × 2", "The formula should be πd"], "mand": 0}, {"id": "MAT-05-010", "t": 5, "s": "G18", "k": "Calculation", "m": 3, "ht": false, "q": "Find the <b>perimeter of a semicircle<\/b> of diameter 8 cm. Give your answer to 1 decimal place.", "a": ["Curved part = π × 8 ÷ 2 = 12.57 (1)", "Add the straight edge: 12.57 + 8 (1)", "= <b>20.6 cm<\/b> (1)"], "cp": ["Curved part = π × 8 ÷ 2 = 12.57", "Add the straight edge: 12.57 + 8", "= 20.6 cm"], "dp": ["12.6 cm", "16 cm", "25.1 cm"], "mand": 0}, {"id": "MAT-05-011", "t": 5, "s": "G19", "k": "Recall", "m": 3, "ht": false, "q": "Write the formulae for the <b>volume of a prism<\/b>, <b>cylinder<\/b> and <b>cuboid<\/b>.", "a": ["Prism: <b>cross-sectional area × length<\/b> (1)", "Cylinder: <b>π r<sup>2<\/sup> h<\/b> (1)", "Cuboid: <b>length × width × height<\/b> (1)"], "cp": ["Prism: cross-sectional area × length", "Cylinder: π r<sup>2<\/sup> h", "Cuboid: length × width × height"], "dp": ["Cylinder: 2πrh", "Cuboid: 2(lw + lh + wh)", "Prism: perimeter × length"], "mand": 0}, {"id": "MAT-05-012", "t": 5, "s": "G19", "k": "Calculation", "m": 3, "ht": false, "q": "A cuboid is 5 cm by 4 cm by 3 cm. Find its <b>volume<\/b> and its <b>surface area<\/b>.", "a": ["Volume = 5 × 4 × 3 = <b>60 cm<sup>3<\/sup><\/b> (1)", "Faces: 5 × 4 = 20, 5 × 3 = 15, 4 × 3 = 12 (1)", "Surface area = 2 × (20 + 15 + 12) = <b>94 cm<sup>2<\/sup><\/b> (1)"], "cp": ["Volume = 5 × 4 × 3 = 60 cm<sup>3<\/sup>", "Faces: 5 × 4 = 20, 5 × 3 = 15, 4 × 3 = 12", "Surface area = 2 × (20 + 15 + 12) = 94 cm<sup>2<\/sup>"], "dp": ["Volume 12 cm<sup>3<\/sup> and surface area 47 cm<sup>2<\/sup>", "Volume 60 cm<sup>3<\/sup> and surface area 47 cm<sup>2<\/sup>", "Volume 94 cm<sup>3<\/sup> and surface area 60 cm<sup>2<\/sup>"], "mand": 0}, {"id": "MAT-05-013", "t": 5, "s": "G19", "k": "Calculation", "m": 3, "ht": false, "q": "A cylinder has radius 3 cm and height 10 cm. Find its <b>volume<\/b> to 1 decimal place.", "a": ["V = π r<sup>2<\/sup> h (1)", "= π × 3<sup>2<\/sup> × 10 = 90π (1)", "= <b>282.7 cm<sup>3<\/sup><\/b> (1)"], "cp": ["V = π r<sup>2<\/sup> h", "= π × 3<sup>2<\/sup> × 10 = 90π", "= 282.7 cm<sup>3<\/sup>"], "dp": ["94.2 cm<sup>3<\/sup>", "188.5 cm<sup>3<\/sup>", "848.2 cm<sup>3<\/sup>"], "mand": 0}, {"id": "MAT-05-014", "t": 5, "s": "G19", "k": "Calculation", "m": 3, "ht": false, "q": "Find the <b>curved surface area<\/b> of a cylinder of radius 2 cm and height 7 cm in terms of π.", "a": ["Curved surface = 2π r h (1)", "= 2 × π × 2 × 7 (1)", "= <b>28π cm<sup>2<\/sup><\/b> (1)"], "cp": ["Curved surface = 2π r h", "= 2 × π × 2 × 7", "= 28π cm<sup>2<\/sup>"], "dp": ["14π cm<sup>2<\/sup>", "56π cm<sup>2<\/sup>", "28π cm<sup>3<\/sup>"], "mand": 0}, {"id": "MAT-05-015", "t": 5, "s": "G19", "k": "Calculation", "m": 3, "ht": false, "q": "A triangular prism has a triangle of base 6 cm and height 4 cm. Its length is 10 cm. Find the <b>volume<\/b>.", "a": ["Triangle area = 1/2 × 6 × 4 = 12 cm<sup>2<\/sup> (1)", "V = area × length (1)", "= 12 × 10 = <b>120 cm<sup>3<\/sup><\/b> (1)"], "cp": ["Triangle area = 1/2 × 6 × 4 = 12 cm<sup>2<\/sup>", "V = area × length", "= 12 × 10 = 120 cm<sup>3<\/sup>"], "dp": ["240 cm<sup>3<\/sup>", "24 cm<sup>3<\/sup>", "60 cm<sup>3<\/sup>"], "mand": 0}, {"id": "MAT-05-016", "t": 5, "s": "G21", "k": "Calculation", "m": 3, "ht": false, "q": "A water tank is 2 m by 1.5 m by 1 m. How many <b>litres<\/b> does it hold? (1 m<sup>3<\/sup> = 1000 litres)", "a": ["Volume = 2 × 1.5 × 1 = 3 m<sup>3<\/sup> (1)", "3 × 1000 (1)", "= <b>3000 litres<\/b> (1)"], "cp": ["Volume = 2 × 1.5 × 1 = 3 m<sup>3<\/sup>", "3 × 1000", "= 3000 litres"], "dp": ["300 litres", "4.5 litres", "30 litres"], "mand": 0}, {"id": "MAT-05-017", "t": 5, "s": "G22", "k": "Recall", "m": 2, "ht": false, "q": "State <b>Pythagoras' theorem<\/b> and when you can use it.", "a": ["<b>a<sup>2<\/sup> + b<sup>2<\/sup> = c<sup>2<\/sup><\/b>, where c is the <b>hypotenuse<\/b> (1)", "Only in a <b>right-angled triangle<\/b> (1)"], "cp": ["a<sup>2<\/sup> + b<sup>2<\/sup> = c<sup>2<\/sup>, where c is the hypotenuse", "Only in a right-angled triangle"], "dp": ["a + b = c", "a<sup>2<\/sup> - b<sup>2<\/sup> = c<sup>2<\/sup>", "It works in every triangle"], "mand": 0}, {"id": "MAT-05-018", "t": 5, "s": "G22", "k": "Calculation", "m": 3, "ht": false, "q": "A right-angled triangle has shorter sides 6 cm and 8 cm. Find the <b>hypotenuse<\/b>.", "a": ["c<sup>2<\/sup> = 6<sup>2<\/sup> + 8<sup>2<\/sup> = 36 + 64 = 100 (1)", "c = √100 (1)", "= <b>10 cm<\/b> (1)"], "cp": ["c<sup>2<\/sup> = 6<sup>2<\/sup> + 8<sup>2<\/sup> = 36 + 64 = 100", "c = √100", "= 10 cm"], "dp": ["14 cm", "2 cm", "100 cm"], "mand": 0}, {"id": "MAT-05-019", "t": 5, "s": "G22", "k": "Calculation", "m": 3, "ht": false, "q": "A right-angled triangle has hypotenuse 13 cm and one side 5 cm. Find the <b>other side<\/b>.", "a": ["a<sup>2<\/sup> = 13<sup>2<\/sup> - 5<sup>2<\/sup> = 169 - 25 (1)", "= 144 (1)", "a = <b>12 cm<\/b> (1)"], "cp": ["a<sup>2<\/sup> = 13<sup>2<\/sup> - 5<sup>2<\/sup> = 169 - 25", "= 144", "a = 12 cm"], "dp": ["18 cm", "8 cm", "√194 cm"], "mand": 0}, {"id": "MAT-05-020", "t": 5, "s": "G22", "k": "Exam trap", "m": 2, "ht": false, "q": "When do you <b>add<\/b> and when do you <b>subtract<\/b> in Pythagoras?", "a": ["<b>Add<\/b> the squares when finding the <b>hypotenuse<\/b> (1)", "<b>Subtract<\/b> when finding one of the <b>shorter sides<\/b> (1)"], "cp": ["Add the squares when finding the hypotenuse", "Subtract when finding one of the shorter sides"], "dp": ["Always add", "Always subtract", "Subtract to find the hypotenuse"], "mand": 0}, {"id": "MAT-05-021", "t": 5, "s": "G22", "k": "Calculation", "m": 4, "ht": false, "q": "A ladder 5 m long leans against a wall. The foot is 1.4 m from the wall. How high up the wall does it reach? Give your answer to 2 decimal places.", "a": ["h<sup>2<\/sup> = 5<sup>2<\/sup> - 1.4<sup>2<\/sup> (1)", "= 25 - 1.96 = 23.04 (1)", "h = √23.04 (1)", "= <b>4.80 m<\/b> (1)"], "cp": ["h<sup>2<\/sup> = 5<sup>2<\/sup> - 1.4<sup>2<\/sup>", "= 25 - 1.96 = 23.04", "h = √23.04", "= 4.80 m"], "dp": ["5.19 m", "3.6 m", "4.8 cm"], "mand": 0}, {"id": "MAT-05-022", "t": 5, "s": "G22", "k": "Calculation", "m": 3, "ht": false, "q": "A is at (1, 2) and B at (7, 10). Find the <b>length of AB<\/b>.", "a": ["Horizontal = 6 and vertical = 8 (1)", "AB<sup>2<\/sup> = 36 + 64 = 100 (1)", "AB = <b>10<\/b> (1)"], "cp": ["Horizontal = 6 and vertical = 8", "AB<sup>2<\/sup> = 36 + 64 = 100", "AB = 10"], "dp": ["14", "2", "√14"], "mand": 0}, {"id": "MAT-05-023", "t": 5, "s": "G23", "k": "Recall", "m": 3, "ht": false, "q": "Write the <b>trigonometric ratios<\/b> using SOHCAHTOA.", "a": ["<b>sin = opposite ÷ hypotenuse<\/b> (1)", "<b>cos = adjacent ÷ hypotenuse<\/b> (1)", "<b>tan = opposite ÷ adjacent<\/b> (1)"], "cp": ["sin = opposite ÷ hypotenuse", "cos = adjacent ÷ hypotenuse", "tan = opposite ÷ adjacent"], "dp": ["sin = adjacent ÷ hypotenuse", "cos = opposite ÷ hypotenuse", "tan = hypotenuse ÷ adjacent"], "mand": 0}, {"id": "MAT-05-024", "t": 5, "s": "G23", "k": "Process", "m": 3, "ht": false, "q": "What are the <b>three steps<\/b> when using trigonometry to find a missing side or angle?", "a": ["<b>Label<\/b> the sides: hypotenuse, opposite, adjacent (1)", "Choose sin, cos or tan using the two sides involved (1)", "Substitute and solve; use <b>inverse sin/cos/tan<\/b> for an angle (1)"], "cp": ["Label the sides: hypotenuse, opposite, adjacent", "Choose sin, cos or tan using the two sides involved", "Substitute and solve; use inverse sin/cos/tan for an angle"], "dp": ["Always use sin", "Always use Pythagoras first", "Measure the angle with a protractor"], "mand": 0}, {"id": "MAT-05-025", "t": 5, "s": "G23", "k": "Calculation", "m": 3, "ht": false, "q": "In a right-angled triangle the hypotenuse is 10 cm and angle x = 30°. Find the side <b>opposite<\/b> x.", "a": ["sin 30° = opposite ÷ 10 (1)", "opposite = 10 × sin 30° (1)", "= 10 × 0.5 = <b>5 cm<\/b> (1)"], "cp": ["sin 30° = opposite ÷ 10", "opposite = 10 × sin 30°", "= 10 × 0.5 = 5 cm"], "dp": ["20 cm", "8.7 cm", "17.3 cm"], "mand": 0}, {"id": "MAT-05-026", "t": 5, "s": "G23", "k": "Calculation", "m": 3, "ht": false, "q": "In a right-angled triangle the opposite side is 4 cm and the adjacent side is 7 cm. Find the <b>angle<\/b> to 1 decimal place.", "a": ["tan x = 4 ÷ 7 (1)", "x = tan<sup>-1<\/sup>(4/7) (1)", "= <b>29.7°<\/b> (1)"], "cp": ["tan x = 4 ÷ 7", "x = tan<sup>-1<\/sup>(4/7)", "= 29.7°"], "dp": ["60.3°", "0.6°", "34.4°"], "mand": 0}, {"id": "MAT-05-027", "t": 5, "s": "G23", "k": "Calculation", "m": 3, "ht": false, "q": "The angle of elevation of the top of a tower from a point 20 m away is 35°. Find the tower height to 1 d.p.", "a": ["tan 35° = height ÷ 20 (1)", "height = 20 × tan 35° (1)", "= <b>14.0 m<\/b> (1)"], "cp": ["tan 35° = height ÷ 20", "height = 20 × tan 35°", "= 14.0 m"], "dp": ["28.6 m", "11.5 m", "16.4 m"], "mand": 0}, {"id": "MAT-05-028", "t": 5, "s": "G23", "k": "Calculation", "m": 3, "ht": false, "q": "A ramp is 5 m long and rises 1 m. Find the <b>angle<\/b> of the ramp to 1 d.p.", "a": ["sin x = 1 ÷ 5 (1)", "x = sin<sup>-1<\/sup>(0.2) (1)", "= <b>11.5°<\/b> (1)"], "cp": ["sin x = 1 ÷ 5", "x = sin<sup>-1<\/sup>(0.2)", "= 11.5°"], "dp": ["78.5°", "11.3°", "0.2°"], "mand": 0}, {"id": "MAT-05-029", "t": 5, "s": "G23", "k": "Recall", "m": 3, "ht": false, "q": "Write down the <b>exact values<\/b> of sin 30°, cos 60° and tan 45°.", "a": ["sin 30° = <b>1/2<\/b> (1)", "cos 60° = <b>1/2<\/b> (1)", "tan 45° = <b>1<\/b> (1)"], "cp": ["sin 30° = 1/2", "cos 60° = 1/2", "tan 45° = 1"], "dp": ["sin 30° = 1, cos 60° = 1, tan 45° = 1/2", "sin 30° = 0, cos 60° = 0, tan 45° = 0", "sin 30° = √3/2, cos 60° = √3/2, tan 45° = √3"], "mand": 0}, {"id": "MAT-05-030", "t": 5, "s": "G21", "k": "Calculation", "m": 3, "ht": false, "q": "A square has an area of 49 cm<sup>2<\/sup>. Find its <b>perimeter<\/b>.", "a": ["Side = √49 = 7 cm (1)", "Perimeter = 4 × 7 (1)", "= <b>28 cm<\/b> (1)"], "cp": ["Side = √49 = 7 cm", "Perimeter = 4 × 7", "= 28 cm"], "dp": ["196 cm", "14 cm", "49 cm"], "mand": 0}, {"id": "MAT-05-031", "t": 5, "s": "G17", "k": "Calculation", "m": 3, "ht": false, "q": "A wheel has diameter 60 cm. How far does it travel in <b>10 turns<\/b>? Give your answer to the nearest cm.", "a": ["Circumference = π × 60 = 188.5 cm (1)", "× 10 (1)", "= <b>1885 cm<\/b> (1)"], "cp": ["Circumference = π × 60 = 188.5 cm", "× 10", "= 1885 cm"], "dp": ["5655 cm", "942 cm", "188 cm"], "mand": 0}, {"id": "MAT-05-032", "t": 5, "s": "G23", "k": "Exam trap", "m": 2, "ht": false, "q": "A student uses tan x = 4/7 and gets 0.571. What do they do to get the <b>angle<\/b>?", "a": ["Use the <b>inverse tan<\/b> (shift tan, tan<sup>-1<\/sup>) (1)", "x = tan<sup>-1<\/sup>(0.571) = <b>29.7°<\/b> (1)"], "cp": ["Use the inverse tan (shift tan, tan<sup>-1<\/sup>)", "x = tan<sup>-1<\/sup>(0.571) = 29.7°"], "dp": ["Say the angle is 0.571°", "Multiply by 360", "Use sin<sup>-1<\/sup>"], "mand": 0}, {"id": "MAT-05-033", "t": 5, "s": "G22", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>Pythagorean triple<\/b>? Give two.", "a": ["Three whole numbers that satisfy <b>a<sup>2<\/sup> + b<sup>2<\/sup> = c<sup>2<\/sup><\/b> (1)", "e.g. <b>3, 4, 5<\/b> and <b>5, 12, 13<\/b> (1)"], "cp": ["Three whole numbers that satisfy a<sup>2<\/sup> + b<sup>2<\/sup> = c<sup>2<\/sup>", "e.g. 3, 4, 5 and 5, 12, 13"], "dp": ["Three even numbers", "Three numbers that add to 10", "1, 2, 3"], "mand": 0}, {"id": "MAT-06-001", "t": 6, "s": "P1", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>smallest and largest values<\/b> a probability can take, and what do probabilities in a full set of outcomes add up to?", "a": ["Smallest value is <b>0<\/b> (impossible) (1)", "Largest value is <b>1<\/b> (certain) (1)", "Probabilities of all outcomes add up to <b>1<\/b> (1)"], "cp": ["Smallest value is 0 (impossible)", "Largest value is 1 (certain)", "Probabilities of all outcomes add up to 1"], "dp": ["-1 and 1, adding to 0", "0 and 100, adding to 100", "0 and 10, adding to 10"], "mand": 0}, {"id": "MAT-06-002", "t": 6, "s": "P1", "k": "Recall", "m": 1, "ht": false, "q": "Write the <b>formula for the probability of an event<\/b> when outcomes are equally likely.", "a": ["P(event) = <b>number of successful outcomes ÷ total number of possible outcomes<\/b> (1)"], "cp": ["P(event) = number of successful outcomes ÷ total number of possible outcomes"], "dp": ["Successful outcomes × total outcomes", "Total outcomes ÷ successful outcomes", "Successful outcomes - total outcomes"], "mand": 0}, {"id": "MAT-06-003", "t": 6, "s": "P1", "k": "Calculation", "m": 2, "ht": false, "q": "A bag has 3 red, 5 blue and 2 green counters. One is picked at random. Find <b>P(blue)<\/b>.", "a": ["Total counters = 10 (1)", "P(blue) = <b>5/10 = 1/2<\/b> (1)"], "cp": ["Total counters = 10", "P(blue) = 5/10 = 1/2"], "dp": ["5/3", "5/7", "1/5"], "mand": 0}, {"id": "MAT-06-004", "t": 6, "s": "P1", "k": "Calculation", "m": 2, "ht": false, "q": "The probability that a bus is late is 0.15. Find the probability that it is <b>not late<\/b>.", "a": ["P(not late) = 1 - P(late) (1)", "= 1 - 0.15 = <b>0.85<\/b> (1)"], "cp": ["P(not late) = 1 - P(late)", "= 1 - 0.15 = 0.85"], "dp": ["0.15", "0.75", "1.15"], "mand": 0}, {"id": "MAT-06-005", "t": 6, "s": "P1", "k": "Calculation", "m": 3, "ht": false, "q": "A spinner has outcomes red, blue, green and yellow. P(red) = 0.3, P(blue) = 0.25 and P(green) = 0.2. Find <b>P(yellow)<\/b>.", "a": ["Sum of the three = 0.3 + 0.25 + 0.2 = 0.75 (1)", "P(yellow) = 1 - 0.75 (1)", "= <b>0.25<\/b> (1)"], "cp": ["Sum of the three = 0.3 + 0.25 + 0.2 = 0.75", "P(yellow) = 1 - 0.75", "= 0.25"], "dp": ["0.75", "0.15", "0.35"], "mand": 0}, {"id": "MAT-06-006", "t": 6, "s": "P1", "k": "Calculation", "m": 2, "ht": false, "q": "A fair dice is rolled once. Find the probability of getting a <b>prime number<\/b>.", "a": ["Primes on a dice: 2, 3, 5 (1)", "P = <b>3/6 = 1/2<\/b> (1)"], "cp": ["Primes on a dice: 2, 3, 5", "P = 3/6 = 1/2"], "dp": ["4/6", "2/6", "1/3"], "mand": 0}, {"id": "MAT-06-007", "t": 6, "s": "P1", "k": "Calculation", "m": 2, "ht": false, "q": "A coin is flipped 200 times and lands on heads 112 times. Find the <b>relative frequency<\/b> of heads.", "a": ["Relative frequency = frequency ÷ total trials (1)", "= 112/200 = <b>0.56<\/b> (1)"], "cp": ["Relative frequency = frequency ÷ total trials", "= 112/200 = 0.56"], "dp": ["0.5", "112", "0.44"], "mand": 0}, {"id": "MAT-06-008", "t": 6, "s": "P1", "k": "Explain", "m": 2, "ht": false, "q": "Why does a <b>larger number of trials<\/b> give a better estimate of probability?", "a": ["Results become <b>less affected by chance<\/b> (1)", "Relative frequency gets <b>closer to the true probability<\/b> (1)"], "cp": ["Results become less affected by chance", "Relative frequency gets closer to the true probability"], "dp": ["Because each trial is more likely to be heads", "Because the probability increases", "Because the coin becomes fairer"], "mand": 0}, {"id": "MAT-06-009", "t": 6, "s": "P1", "k": "Calculation", "m": 2, "ht": false, "q": "The probability a seed grows is 0.8. Tim plants 150 seeds. How many would you <b>expect to grow<\/b>?", "a": ["Expected number = probability × number of trials (1)", "= 0.8 × 150 = <b>120<\/b> (1)"], "cp": ["Expected number = probability × number of trials", "= 0.8 × 150 = 120"], "dp": ["30", "187.5", "80"], "mand": 0}, {"id": "MAT-06-010", "t": 6, "s": "P1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says: 'There are two outcomes, pass or fail, so the probability of passing is 1/2.' What is wrong?", "a": ["Outcomes are <b>not necessarily equally likely<\/b> (1)", "Pass and fail do not have to have equal chances, so 1/2 is not justified (1)"], "cp": ["Outcomes are not necessarily equally likely", "Pass and fail do not have to have equal chances, so 1/2 is not justified"], "dp": ["Nothing is wrong", "The probability should be 2", "Probability of passing is always 1/2"], "mand": 0}, {"id": "MAT-06-011", "t": 6, "s": "P2", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>sample space<\/b> and why is it useful?", "a": ["A list or table of <b>all possible outcomes<\/b> (1)", "Helps count outcomes <b>systematically<\/b> so none are missed (1)"], "cp": ["A list or table of all possible outcomes", "Helps count outcomes systematically so none are missed"], "dp": ["The area where trials happen", "The probability of the most likely outcome", "A list of successful outcomes only"], "mand": 0}, {"id": "MAT-06-012", "t": 6, "s": "P2", "k": "Calculation", "m": 3, "ht": false, "q": "Two fair dice are rolled and the scores added. Find the probability the total is <b>7<\/b>.", "a": ["Total outcomes = 6 × 6 = 36 (1)", "Ways to get 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6 (1)", "P = 6/36 = <b>1/6<\/b> (1)"], "cp": ["Total outcomes = 6 × 6 = 36", "Ways to get 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6", "P = 6/36 = 1/6"], "dp": ["1/12", "7/36", "1/7"], "mand": 0}, {"id": "MAT-06-013", "t": 6, "s": "P2", "k": "Calculation", "m": 3, "ht": false, "q": "A fair coin is flipped twice. List the outcomes and find <b>P(exactly one head)<\/b>.", "a": ["Outcomes: HH, HT, TH, TT (1)", "Exactly one head: HT, TH = 2 (1)", "P = 2/4 = <b>1/2<\/b> (1)"], "cp": ["Outcomes: HH, HT, TH, TT", "Exactly one head: HT, TH = 2", "P = 2/4 = 1/2"], "dp": ["1/4", "3/4", "1/3"], "mand": 0}, {"id": "MAT-06-014", "t": 6, "s": "P2", "k": "Calculation", "m": 3, "ht": false, "q": "How many different outfits are there with 4 tops, 3 skirts and 2 pairs of shoes?", "a": ["Multiply the choices (product rule) (1)", "4 × 3 × 2 (1)", "= <b>24<\/b> outfits (1)"], "cp": ["Multiply the choices (product rule)", "4 × 3 × 2", "= 24 outfits"], "dp": ["9 outfits", "12 outfits", "10 outfits"], "mand": 0}, {"id": "MAT-06-015", "t": 6, "s": "P3", "k": "Recall", "m": 2, "ht": false, "q": "State the <b>addition rule<\/b> for mutually exclusive events A and B.", "a": ["<b>P(A or B) = P(A) + P(B)<\/b> (1)", "Only valid if A and B <b>cannot happen at the same time<\/b> (1)"], "cp": ["P(A or B) = P(A) + P(B)", "Only valid if A and B cannot happen at the same time"], "dp": ["P(A or B) = P(A) × P(B)", "P(A or B) = P(A) - P(B)", "P(A or B) = P(A) ÷ P(B)"], "mand": 0}, {"id": "MAT-06-016", "t": 6, "s": "P3", "k": "Calculation", "m": 3, "ht": false, "q": "P(red) = 0.2 and P(green) = 0.35. Find <b>P(red or green)<\/b>, and the probability of <b>neither<\/b>.", "a": ["P(red or green) = 0.2 + 0.35 = <b>0.55<\/b> (1)", "Neither = 1 - 0.55 (1)", "= <b>0.45<\/b> (1)"], "cp": ["P(red or green) = 0.2 + 0.35 = 0.55", "Neither = 1 - 0.55", "= 0.45"], "dp": ["0.07 and 0.93", "0.15 and 0.85", "0.55 and 0.55"], "mand": 0}, {"id": "MAT-06-017", "t": 6, "s": "P3", "k": "Recall", "m": 2, "ht": false, "q": "State the <b>multiplication rule<\/b> for independent events A and B.", "a": ["<b>P(A and B) = P(A) × P(B)<\/b> (1)", "Independent means one event <b>does not affect<\/b> the other (1)"], "cp": ["P(A and B) = P(A) × P(B)", "Independent means one event does not affect the other"], "dp": ["P(A and B) = P(A) + P(B)", "P(A and B) = P(A) ÷ P(B)", "P(A and B) = P(A) - P(B)"], "mand": 0}, {"id": "MAT-06-018", "t": 6, "s": "P3", "k": "Calculation", "m": 3, "ht": false, "q": "The probability Emma is late is 0.1 and Kayla is late is 0.2, independently. Find <b>P(both late)<\/b>.", "a": ["Independent so multiply (1)", "0.1 × 0.2 (1)", "= <b>0.02<\/b> (1)"], "cp": ["Independent so multiply", "0.1 × 0.2", "= 0.02"], "dp": ["0.3", "0.1", "0.2"], "mand": 0}, {"id": "MAT-06-019", "t": 6, "s": "P3", "k": "Calculation", "m": 3, "ht": false, "q": "A fair dice is rolled twice. Find the probability of <b>two sixes<\/b>.", "a": ["P(six) = 1/6 (1)", "1/6 × 1/6 (1)", "= <b>1/36<\/b> (1)"], "cp": ["P(six) = 1/6", "1/6 × 1/6", "= 1/36"], "dp": ["1/3", "2/6", "1/12"], "mand": 0}, {"id": "MAT-06-020", "t": 6, "s": "P3", "k": "Explain", "m": 2, "ht": false, "q": "Explain the difference between <b>mutually exclusive<\/b> and <b>independent<\/b> events.", "a": ["<b>Mutually exclusive<\/b>: cannot happen at the same time (1)", "<b>Independent<\/b>: one event does not change the probability of the other (1)"], "cp": ["Mutually exclusive: cannot happen at the same time", "Independent: one event does not change the probability of the other"], "dp": ["They mean the same thing", "Mutually exclusive means both always happen", "Independent means they cannot happen together"], "mand": 0}, {"id": "MAT-06-021", "t": 6, "s": "P4", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>draw and use a tree diagram<\/b> for two events?", "a": ["Draw <b>branches<\/b> for each outcome of event 1, then event 2 from each (1)", "Write the <b>probabilities on the branches<\/b>; those from one point add to 1 (1)", "<b>Multiply along<\/b> branches and <b>add<\/b> the routes for 'or' (1)"], "cp": ["Draw branches for each outcome of event 1, then event 2 from each", "Write the probabilities on the branches; those from one point add to 1", "Multiply along branches and add the routes for 'or'"], "dp": ["Add along branches and multiply between routes", "Draw one branch only", "Branches from each point add to 2"], "mand": 0}, {"id": "MAT-06-022", "t": 6, "s": "P4", "k": "Calculation", "m": 4, "ht": false, "q": "A bag has 4 red and 6 blue counters. Two are picked <b>with replacement<\/b>. Find P(<b>one of each colour<\/b>).", "a": ["P(red) = 4/10, P(blue) = 6/10 (1)", "P(red then blue) = 0.4 × 0.6 = 0.24 (1)", "P(blue then red) = 0.24 (1)", "Total = <b>0.48<\/b> (1)"], "cp": ["P(red) = 4/10, P(blue) = 6/10", "P(red then blue) = 0.4 × 0.6 = 0.24", "P(blue then red) = 0.24", "Total = 0.48"], "dp": ["0.24", "0.52", "0.5"], "mand": 0}, {"id": "MAT-06-023", "t": 6, "s": "P4", "k": "Calculation", "m": 4, "ht": false, "q": "A bag has 3 red and 5 blue counters. Two are picked <b>without replacement<\/b>. Find P(<b>both red<\/b>).", "a": ["P(first red) = 3/8 (1)", "P(second red) = 2/7 (1)", "3/8 × 2/7 = 6/56 (1)", "= <b>3/28<\/b> (1)"], "cp": ["P(first red) = 3/8", "P(second red) = 2/7", "3/8 × 2/7 = 6/56", "= 3/28"], "dp": ["9/64", "3/8", "5/14"], "mand": 0}, {"id": "MAT-06-024", "t": 6, "s": "P4", "k": "Exam trap", "m": 2, "ht": false, "q": "In a 'without replacement' problem, why does the <b>second probability change<\/b>?", "a": ["The first item is <b>not put back<\/b> (1)", "So the <b>total number<\/b> of items decreases by 1 (and the favourable count may too) (1)"], "cp": ["The first item is not put back", "So the total number of items decreases by 1 (and the favourable count may too)"], "dp": ["The numbers on the second branch stay the same", "The probability is always 1/2", "Because the events are independent"], "mand": 0}, {"id": "MAT-06-025", "t": 6, "s": "P4", "k": "Calculation", "m": 3, "ht": false, "q": "P(rain on Saturday) = 0.4. P(rain on Sunday) = 0.3. Independent. Find P(<b>rain on exactly one day<\/b>).", "a": ["Rain Sat only: 0.4 × 0.7 = 0.28 (1)", "Rain Sun only: 0.6 × 0.3 = 0.18 (1)", "Total = <b>0.46<\/b> (1)"], "cp": ["Rain Sat only: 0.4 × 0.7 = 0.28", "Rain Sun only: 0.6 × 0.3 = 0.18", "Total = 0.46"], "dp": ["0.12", "0.58", "0.7"], "mand": 0}, {"id": "MAT-06-026", "t": 6, "s": "P5", "k": "Recall", "m": 2, "ht": false, "q": "What does a <b>Venn diagram<\/b> show, and what do the symbols ∩ and ∪ mean?", "a": ["Shows how items <b>overlap between sets<\/b> (1)", "∩ means <b>and (intersection)<\/b>, ∪ means <b>or (union)<\/b> (1)"], "cp": ["Shows how items overlap between sets", "∩ means and (intersection), ∪ means or (union)"], "dp": ["∩ means or, ∪ means and", "∩ means not", "They both mean the same thing"], "mand": 0}, {"id": "MAT-06-027", "t": 6, "s": "P5", "k": "Calculation", "m": 3, "ht": false, "q": "30 students: 18 study French (F), 12 study Spanish (S), 5 study both. Find P(<b>neither<\/b>).", "a": ["Only French = 13, only Spanish = 7, both = 5 (1)", "Total studying = 13 + 7 + 5 = 25 (1)", "Neither = 30 - 25 = 5, so P = 5/30 = <b>1/6<\/b> (1)"], "cp": ["Only French = 13, only Spanish = 7, both = 5", "Total studying = 13 + 7 + 5 = 25", "Neither = 30 - 25 = 5, so P = 5/30 = 1/6"], "dp": ["1/3", "7/30", "5/25"], "mand": 0}, {"id": "MAT-06-028", "t": 6, "s": "P6", "k": "Recall", "m": 2, "ht": false, "q": "What does <b>conditional probability<\/b> mean?", "a": ["The probability of an event <b>given that another event has already happened<\/b> (1)", "The <b>sample space gets smaller<\/b> (e.g. without replacement) (1)"], "cp": ["The probability of an event given that another event has already happened", "The sample space gets smaller (e.g. without replacement)"], "dp": ["The probability of two events together", "The probability of an event never happening", "The long-run average"], "mand": 0}, {"id": "MAT-06-029", "t": 6, "s": "P2", "k": "Calculation", "m": 3, "ht": false, "q": "A two-way table: 40 pupils, 25 walk to school, of whom 12 are boys. 18 pupils in total are boys. Find P(<b>boy who does not walk<\/b>).", "a": ["Boys who walk = 12, boys total = 18 (1)", "Boys who do not walk = 18 - 12 = 6 (1)", "P = 6/40 = <b>3/20<\/b> (1)"], "cp": ["Boys who walk = 12, boys total = 18", "Boys who do not walk = 18 - 12 = 6", "P = 6/40 = 3/20"], "dp": ["12/40", "1/3", "18/40"], "mand": 0}, {"id": "MAT-06-030", "t": 6, "s": "P1", "k": "Calculation", "m": 3, "ht": false, "q": "A biased spinner lands on 'win' with probability 0.25. Find the <b>expected number of wins<\/b> in 60 spins and the expected number of losses.", "a": ["Wins = 0.25 × 60 = <b>15<\/b> (1)", "P(loss) = 0.75 (1)", "Losses = 0.75 × 60 = <b>45<\/b> (1)"], "cp": ["Wins = 0.25 × 60 = 15", "P(loss) = 0.75", "Losses = 0.75 × 60 = 45"], "dp": ["25 wins and 35 losses", "15 wins and 15 losses", "0.25 wins and 0.75 losses"], "mand": 0}, {"id": "MAT-06-031", "t": 6, "s": "P1", "k": "Explain", "m": 2, "ht": false, "q": "A dice is rolled 60 times and lands on six 15 times. Does this show it is biased? Give a reason.", "a": ["Expected number of sixes ≈ 10 (1)", "15 is higher than expected but <b>could still be chance<\/b>, so more trials are needed (1)"], "cp": ["Expected number of sixes ≈ 10", "15 is higher than expected but could still be chance, so more trials are needed"], "dp": ["Yes, it must be biased", "No, because it landed on other numbers", "Yes, because 15 is a prime number"], "mand": 0}, {"id": "MAT-06-032", "t": 6, "s": "P1", "k": "Calculation", "m": 3, "ht": false, "q": "A frequency tree: <b>60 students<\/b>, <b>35 are girls<\/b>. <b>20 of the girls<\/b> and <b>10 of the boys<\/b> walk to school. How many <b>students in total walk<\/b>, and how many <b>boys do not walk<\/b>?", "a": ["Boys = 60 - 35 = 25 (1)", "Total who walk = 20 + 10 = <b>30<\/b> (1)", "Boys who do not walk = 25 - 10 = <b>15<\/b> (1)"], "cp": ["Boys = 60 - 35 = 25", "Total who walk = 20 + 10 = 30", "Boys who do not walk = 25 - 10 = 15"], "dp": ["20 walk and 25 boys do not walk", "45 walk and 10 boys do not walk", "30 walk and 35 boys do not walk"], "mand": 0}, {"id": "MAT-07-001", "t": 7, "s": "S1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three types of average<\/b> and the <b>measure of spread<\/b>.", "a": ["<b>Mean<\/b>: add up and divide by how many (1)", "<b>Median<\/b>: middle value when ordered, <b>mode<\/b>: most common (1)", "<b>Range<\/b> = highest - lowest (1)"], "cp": ["Mean: add up and divide by how many", "Median: middle value when ordered, mode: most common", "Range = highest - lowest"], "dp": ["Median = add up and divide", "Mode = middle value", "Range = highest + lowest"], "mand": 0}, {"id": "MAT-07-002", "t": 7, "s": "S1", "k": "Calculation", "m": 3, "ht": false, "q": "Find the <b>mean, median and mode<\/b> of: 3, 7, 7, 2, 11.", "a": ["Mean = 30 ÷ 5 = <b>6<\/b> (1)", "Median: ordered 2, 3, 7, 7, 11 gives <b>7<\/b> (1)", "Mode = <b>7<\/b> (1)"], "cp": ["Mean = 30 ÷ 5 = 6", "Median: ordered 2, 3, 7, 7, 11 gives 7", "Mode = 7"], "dp": ["Mean 7, median 6, mode 7", "Mean 6, median 3, mode 2", "Mean 6, median 7, mode 11"], "mand": 0}, {"id": "MAT-07-003", "t": 7, "s": "S1", "k": "Calculation", "m": 2, "ht": false, "q": "The mean of 5 numbers is 8. A sixth number makes the mean 9. Find the <b>sixth number<\/b>.", "a": ["New total = 6 × 9 = 54, old total = 5 × 8 = 40 (1)", "Sixth number = 54 - 40 = <b>14<\/b> (1)"], "cp": ["New total = 6 × 9 = 54, old total = 5 × 8 = 40", "Sixth number = 54 - 40 = 14"], "dp": ["9", "17", "10"], "mand": 0}, {"id": "MAT-07-004", "t": 7, "s": "S1", "k": "Calculation", "m": 3, "ht": false, "q": "Find the <b>range<\/b> and the <b>median<\/b> of: 12, 5, 9, 20, 14, 8.", "a": ["Range = 20 - 5 = <b>15<\/b> (1)", "Ordered: 5, 8, 9, 12, 14, 20 (1)", "Median = (9 + 12) ÷ 2 = <b>10.5<\/b> (1)"], "cp": ["Range = 20 - 5 = 15", "Ordered: 5, 8, 9, 12, 14, 20", "Median = (9 + 12) ÷ 2 = 10.5"], "dp": ["Range 15, median 9", "Range 25, median 10.5", "Range 15, median 12"], "mand": 0}, {"id": "MAT-07-005", "t": 7, "s": "S1", "k": "Explain", "m": 2, "ht": false, "q": "Give one <b>advantage of the median<\/b> over the mean.", "a": ["The median is <b>not affected by outliers<\/b> (extreme values) (1)", "So it is better for skewed data such as house prices or incomes (1)"], "cp": ["The median is not affected by outliers (extreme values)", "So it is better for skewed data such as house prices or incomes"], "dp": ["It uses every value", "It is always a whole number", "It is always the most common value"], "mand": 0}, {"id": "MAT-07-006", "t": 7, "s": "S1", "k": "Explain", "m": 2, "ht": false, "q": "Give one <b>advantage of the mean<\/b> over the median.", "a": ["The mean <b>uses every value<\/b> in the data set (1)", "So it reflects all of the data (1)"], "cp": ["The mean uses every value in the data set", "So it reflects all of the data"], "dp": ["It ignores extreme values", "It is the most common value", "It is always the middle value"], "mand": 0}, {"id": "MAT-07-007", "t": 7, "s": "S2", "k": "Calculation", "m": 3, "ht": false, "q": "Find the <b>mean from a frequency table<\/b>: scores 1, 2, 3 with frequencies 4, 5, 1.", "a": ["Score × frequency: 4 + 10 + 3 = 17 (1)", "Total frequency = 10 (1)", "Mean = <b>1.7<\/b> (1)"], "cp": ["Score × frequency: 4 + 10 + 3 = 17", "Total frequency = 10", "Mean = 1.7"], "dp": ["2", "5.67", "3.4"], "mand": 0}, {"id": "MAT-07-008", "t": 7, "s": "S2", "k": "Calculation", "m": 4, "ht": false, "q": "Estimate the <b>mean from grouped data<\/b>: 0-10 (freq 4), 10-20 (freq 6), 20-30 (freq 10).", "a": ["Midpoints: 5, 15, 25 (1)", "Midpoint × frequency: 20 + 90 + 250 = 360 (1)", "Total frequency = 20 (1)", "Mean ≈ <b>18<\/b> (1)"], "cp": ["Midpoints: 5, 15, 25", "Midpoint × frequency: 20 + 90 + 250 = 360", "Total frequency = 20", "Mean ≈ 18"], "dp": ["15", "20", "13.5"], "mand": 0}, {"id": "MAT-07-009", "t": 7, "s": "S2", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is a mean from <b>grouped data only an estimate<\/b>?", "a": ["We do not know the <b>exact values<\/b> in each group (1)", "We assume every value is at the <b>midpoint<\/b> (1)"], "cp": ["We do not know the exact values in each group", "We assume every value is at the midpoint"], "dp": ["The groups are too small", "Because the data is always wrong", "Because the mean is always rounded"], "mand": 0}, {"id": "MAT-07-010", "t": 7, "s": "S2", "k": "Calculation", "m": 3, "ht": false, "q": "In a grouped frequency table 40 students were measured. In which <b>class interval is the median<\/b>? Cumulative frequencies: up to 150 cm: 6; up to 160: 18; up to 170: 33; up to 180: 40.", "a": ["Median is at position (40+1)/2 ≈ 20.5 (1)", "Cumulative frequency passes 20 in the interval 160-170 (1)", "Median class = <b>160 to 170 cm<\/b> (1)"], "cp": ["Median is at position (40+1)/2 ≈ 20.5", "Cumulative frequency passes 20 in the interval 160-170", "Median class = 160 to 170 cm"], "dp": ["150-160 cm", "170-180 cm", "The one with the highest frequency"], "mand": 0}, {"id": "MAT-07-011", "t": 7, "s": "S3", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>draw a pie chart<\/b> from a frequency table?", "a": ["Find the total frequency (1)", "Angle for each category = <b>frequency ÷ total × 360°<\/b> (1)", "Draw and <b>label<\/b> each sector with a protractor (1)"], "cp": ["Find the total frequency", "Angle for each category = frequency ÷ total × 360°", "Draw and label each sector with a protractor"], "dp": ["Divide 360 by the number of categories", "Angle = frequency × 100", "Angle = frequency ÷ 360"], "mand": 0}, {"id": "MAT-07-012", "t": 7, "s": "S3", "k": "Calculation", "m": 2, "ht": false, "q": "In a survey of 60 people, 9 chose tea. What <b>angle<\/b> is the tea sector in a pie chart?", "a": ["9 ÷ 60 × 360 (1)", "= <b>54°<\/b> (1)"], "cp": ["9 ÷ 60 × 360", "= 54°"], "dp": ["9°", "36°", "108°"], "mand": 0}, {"id": "MAT-07-013", "t": 7, "s": "S3", "k": "Calculation", "m": 3, "ht": false, "q": "A pie chart sector of 120° represents 24 people. How many people are there <b>in total<\/b>?", "a": ["120° is 1/3 of 360° (1)", "24 is 1/3 of the total (1)", "Total = <b>72<\/b> (1)"], "cp": ["120° is 1/3 of 360°", "24 is 1/3 of the total", "Total = 72"], "dp": ["48", "36", "144"], "mand": 0}, {"id": "MAT-07-014", "t": 7, "s": "S3", "k": "Recall", "m": 3, "ht": false, "q": "What must a good <b>bar chart or line graph<\/b> include?", "a": ["A <b>title<\/b> (1)", "<b>Labelled axes<\/b> with units and an even scale (1)", "Bars of equal width (or accurate plotted points) (1)"], "cp": ["A title", "Labelled axes with units and an even scale", "Bars of equal width (or accurate plotted points)"], "dp": ["Only coloured bars", "Axes without labels", "Uneven scales to fit the data"], "mand": 0}, {"id": "MAT-07-015", "t": 7, "s": "S3", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>scatter graph<\/b> used for, and what is a <b>line of best fit<\/b>?", "a": ["Shows the <b>relationship (correlation)<\/b> between two variables (1)", "The line of best fit goes through the middle of the points and shows the trend (1)"], "cp": ["Shows the relationship (correlation) between two variables", "The line of best fit goes through the middle of the points and shows the trend"], "dp": ["Shows the mean of one variable", "A line joining the first and last points", "A line that must pass through every point"], "mand": 0}, {"id": "MAT-07-016", "t": 7, "s": "S3", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>positive, negative and no correlation<\/b>.", "a": ["<b>Positive<\/b>: as one variable increases, the other increases (1)", "<b>Negative<\/b>: as one increases, the other decreases (1)", "<b>None<\/b>: no pattern between the variables (1)"], "cp": ["Positive: as one variable increases, the other increases", "Negative: as one increases, the other decreases", "None: no pattern between the variables"], "dp": ["Positive: one increases, the other decreases", "Negative: both increase", "None: points form a straight line"], "mand": 0}, {"id": "MAT-07-017", "t": 7, "s": "S3", "k": "Explain", "m": 2, "ht": false, "q": "A scatter graph shows ice-cream sales rising with temperature. Does this prove hot weather <b>causes<\/b> sales? Explain.", "a": ["Correlation <b>does not prove causation<\/b> (1)", "Other factors could also affect sales, so we can say there is a link, not a proof (1)"], "cp": ["Correlation does not prove causation", "Other factors could also affect sales, so we can say there is a link, not a proof"], "dp": ["Yes, it proves it", "No, because the graph is positive", "Yes, if the line goes through zero"], "mand": 0}, {"id": "MAT-07-018", "t": 7, "s": "S3", "k": "Calculation", "m": 3, "ht": false, "q": "A line of best fit passes through (10, 20) and (30, 60). Use it to estimate y when x = 20, and say why using it for x = 100 is <b>unreliable<\/b>.", "a": ["Midpoint estimate: y = <b>40<\/b> (1)", "x = 100 is outside the data range (1)", "<b>Extrapolation<\/b> is unreliable as the trend may not continue (1)"], "cp": ["Midpoint estimate: y = 40", "x = 100 is outside the data range", "Extrapolation is unreliable as the trend may not continue"], "dp": ["y = 30 and extrapolation is fine", "y = 50 and the line is always accurate", "y = 40 and it is reliable"], "mand": 0}, {"id": "MAT-07-019", "t": 7, "s": "S3", "k": "Recall", "m": 2, "ht": false, "q": "What is an <b>outlier<\/b> on a scatter graph?", "a": ["A point that is <b>far away from the general trend<\/b> (1)", "Should be considered separately and may be ignored when drawing a line of best fit (1)"], "cp": ["A point that is far away from the general trend", "Should be considered separately and may be ignored when drawing a line of best fit"], "dp": ["A point on the line of best fit", "The highest y value", "The mean of all points"], "mand": 0}, {"id": "MAT-07-020", "t": 7, "s": "S4", "k": "Recall", "m": 2, "ht": false, "q": "What are <b>cumulative frequency<\/b> and a <b>cumulative frequency graph<\/b>?", "a": ["Cumulative frequency is a <b>running total<\/b> of frequencies (1)", "Plot the total against the <b>upper class boundary<\/b> and join with a smooth curve (1)"], "cp": ["Cumulative frequency is a running total of frequencies", "Plot the total against the upper class boundary and join with a smooth curve"], "dp": ["A table of the mean values", "Plot against the lower class boundary with straight lines", "The highest frequency"], "mand": 0}, {"id": "MAT-07-021", "t": 7, "s": "S4", "k": "Process", "m": 3, "ht": false, "q": "How do you find the <b>median, lower quartile and upper quartile<\/b> from a cumulative frequency graph (total n)?", "a": ["Median: read across from <b>n/2<\/b> (1)", "Lower quartile: read across from <b>n/4<\/b>, upper quartile: <b>3n/4<\/b> (1)", "Down to the x-axis to read the value (1)"], "cp": ["Median: read across from n/2", "Lower quartile: read across from n/4, upper quartile: 3n/4", "Down to the x-axis to read the value"], "dp": ["Read from n/3 and 2n/3", "Median is at the top of the curve", "Quartiles are at 25 and 75 on the x-axis"], "mand": 0}, {"id": "MAT-07-022", "t": 7, "s": "S4", "k": "Calculation", "m": 2, "ht": false, "q": "From a cumulative frequency graph, the lower quartile is 22 and the upper quartile is 38. Find the <b>interquartile range<\/b>.", "a": ["IQR = upper quartile - lower quartile (1)", "= 38 - 22 = <b>16<\/b> (1)"], "cp": ["IQR = upper quartile - lower quartile", "= 38 - 22 = 16"], "dp": ["60", "30", "8"], "mand": 0}, {"id": "MAT-07-023", "t": 7, "s": "S4", "k": "Explain", "m": 2, "ht": false, "q": "Why is the <b>interquartile range<\/b> a better measure of spread than the range?", "a": ["IQR uses the <b>middle 50%<\/b> of the data (1)", "So it is <b>not affected by outliers<\/b> (1)"], "cp": ["IQR uses the middle 50% of the data", "So it is not affected by outliers"], "dp": ["It includes the extreme values", "It is always larger than the range", "It is the same as the mean"], "mand": 0}, {"id": "MAT-07-024", "t": 7, "s": "S5", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>draw a box plot<\/b>?", "a": ["Mark the <b>minimum, lower quartile, median, upper quartile and maximum<\/b> (1)", "Draw a box from LQ to UQ with a line at the median (1)", "Draw <b>whiskers<\/b> out to the min and max (1)"], "cp": ["Mark the minimum, lower quartile, median, upper quartile and maximum", "Draw a box from LQ to UQ with a line at the median", "Draw whiskers out to the min and max"], "dp": ["Draw bars for the mean", "Mark only the median", "Draw the box from min to max"], "mand": 0}, {"id": "MAT-07-025", "t": 7, "s": "S5", "k": "Explain", "m": 2, "ht": false, "q": "Two box plots show test scores: class A has median 60 and IQR 10, class B median 55 and IQR 25. <b>Compare<\/b> them.", "a": ["Class A has a <b>higher median<\/b>, so higher scores on average (1)", "Class A has a <b>smaller IQR<\/b>, so scores are more consistent (1)"], "cp": ["Class A has a higher median, so higher scores on average", "Class A has a smaller IQR, so scores are more consistent"], "dp": ["Class B did better in every way", "They are identical", "Class A has the larger spread"], "mand": 0}, {"id": "MAT-07-026", "t": 7, "s": "S6", "k": "Recall", "m": 3, "ht": false, "q": "Name three <b>types of sampling<\/b> and what makes a sample <b>good<\/b>.", "a": ["<b>Random<\/b> sampling: every member has an equal chance (1)", "<b>Stratified<\/b>: proportionate to group sizes (1)", "A good sample is <b>representative<\/b> and large enough (1)"], "cp": ["Random sampling: every member has an equal chance", "Stratified: proportionate to group sizes", "A good sample is representative and large enough"], "dp": ["Always ask your friends", "Only ask people near you", "A sample of one is best"], "mand": 0}, {"id": "MAT-07-027", "t": 7, "s": "S6", "k": "Calculation", "m": 3, "ht": false, "q": "To estimate fish in a lake, 50 are caught, tagged and released. Later, 40 are caught and 8 are tagged. <b>Estimate the population<\/b>.", "a": ["Proportion tagged in second sample = 8/40 = 1/5 (1)", "Total × 1/5 = 50 (1)", "Population ≈ <b>250<\/b> (1)"], "cp": ["Proportion tagged in second sample = 8/40 = 1/5", "Total × 1/5 = 50", "Population ≈ 250"], "dp": ["400", "90", "10"], "mand": 0}, {"id": "MAT-07-028", "t": 7, "s": "S6", "k": "Explain", "m": 2, "ht": false, "q": "Give two reasons a <b>survey question<\/b> may be poor.", "a": ["It is <b>leading or biased<\/b> (1)", "It has no <b>response options<\/b> or overlapping options, or is too vague (1)"], "cp": ["It is leading or biased", "It has no response options or overlapping options, or is too vague"], "dp": ["It is too short", "It uses numbers", "It has too many boxes"], "mand": 0}, {"id": "MAT-07-029", "t": 7, "s": "S7", "k": "Recall", "m": 3, "ht": false, "q": "Describe how to read a <b>time series graph<\/b> and <b>moving average<\/b>.", "a": ["Time series: data plotted over <b>time<\/b> (1)", "Look for the overall <b>trend<\/b> and regular seasonal patterns (1)", "Moving average smooths data by averaging a set of consecutive values (1)"], "cp": ["Time series: data plotted over time", "Look for the overall trend and regular seasonal patterns", "Moving average smooths data by averaging a set of consecutive values"], "dp": ["Time series is always straight", "Moving averages make data more erratic", "A moving average uses one value only"], "mand": 0}, {"id": "MAT-07-030", "t": 7, "s": "S1", "k": "Calculation", "m": 3, "ht": false, "q": "The mean of 4 numbers is 10. Three of them are 7, 9 and 12. Find the <b>fourth number<\/b>.", "a": ["Total = 4 × 10 = 40 (1)", "Known total = 7 + 9 + 12 = 28 (1)", "Fourth = 40 - 28 = <b>12<\/b> (1)"], "cp": ["Total = 4 × 10 = 40", "Known total = 7 + 9 + 12 = 28", "Fourth = 40 - 28 = 12"], "dp": ["10", "14", "9"], "mand": 0}, {"id": "MAT-07-031", "t": 7, "s": "S1", "k": "Recall", "m": 2, "ht": false, "q": "A data set has an even number of values. How do you find the <b>median<\/b>?", "a": ["Put the values in <b>order<\/b> (1)", "Take the <b>mean of the two middle values<\/b> (1)"], "cp": ["Put the values in order", "Take the mean of the two middle values"], "dp": ["Take the largest value", "Take the first value", "Take the mean of all values"], "mand": 0}, {"id": "MAT-07-032", "t": 7, "s": "S3", "k": "Calculation", "m": 3, "ht": false, "q": "A dual bar chart shows girls scored 14, 18 and 20, boys 12, 16 and 25. Find the <b>total difference<\/b> in scores.", "a": ["Girls total = 52 (1)", "Boys total = 53 (1)", "Difference = <b>1<\/b> (1)"], "cp": ["Girls total = 52", "Boys total = 53", "Difference = 1"], "dp": ["5", "10", "105"], "mand": 0}, {"id": "MAT-07-033", "t": 7, "s": "S4", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>modal class<\/b> and how do you find it from a grouped frequency table?", "a": ["The class interval with the <b>highest frequency<\/b> (1)", "Look down the frequency column for the largest value and read off its class (1)"], "cp": ["The class interval with the highest frequency", "Look down the frequency column for the largest value and read off its class"], "dp": ["The middle class in the table", "The class with the highest midpoint", "The mean of all the class intervals"], "mand": 0}, {"id": "MAT-07-034", "t": 7, "s": "S4", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>primary<\/b> and <b>secondary<\/b> data? Give an example of each.", "a": ["<b>Primary<\/b>: collected yourself for your own purpose, e.g. a survey you carry out (1)", "<b>Secondary<\/b>: collected by someone else, e.g. government statistics or the internet (1)"], "cp": ["Primary: collected yourself for your own purpose, e.g. a survey you carry out", "Secondary: collected by someone else, e.g. government statistics or the internet"], "dp": ["Primary data is always numbers and secondary data is words", "Primary data is older than secondary data", "Primary data is always more accurate"], "mand": 0}, {"id": "MAT-07-035", "t": 7, "s": "S4", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>discrete<\/b> and <b>continuous<\/b> data? Give an example of each.", "a": ["<b>Discrete<\/b>: can only take certain values, e.g. shoe sizes or number of pets (1)", "<b>Continuous<\/b>: can take any value in a range, e.g. height or time (1)"], "cp": ["Discrete: can only take certain values, e.g. shoe sizes or number of pets", "Continuous: can take any value in a range, e.g. height or time"], "dp": ["Discrete data is measured and continuous data is counted", "Discrete data is words and continuous data is numbers", "Both only take whole number values"], "mand": 0}, {"id": "MAT-07-036", "t": 7, "s": "S2", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two<\/b> types of diagram for <b>categorical data<\/b> and one thing to check about a <b>pie chart<\/b>.", "a": ["Any two: <b>bar chart<\/b>, <b>pie chart<\/b>, <b>pictogram<\/b> (1)", "In a pie chart the angles are proportional to frequency and must <b>total 360°<\/b> (1)"], "cp": ["Any two: bar chart, pie chart, pictogram", "In a pie chart the angles are proportional to frequency and must total 360°"], "dp": ["Histogram and cumulative frequency graph", "Scatter graph and line graph", "Pie chart angles total 180°"], "mand": 0}, {"id": "MAT-08-001", "t": 8, "s": "Mock", "k": "Recall", "m": 3, "ht": false, "q": "How is the <b>AQA GCSE Maths Foundation<\/b> assessed?", "a": ["<b>Three papers<\/b>, each <b>80 marks<\/b> and <b>1 hour 30 minutes<\/b> (1)", "<b>Paper 1<\/b> is non-calculator; <b>Papers 2 and 3<\/b> allow a calculator (1)", "Each paper is worth <b>one third<\/b> of the grade (1)"], "cp": ["Three papers, each 80 marks and 1 hour 30 minutes", "Paper 1 is non-calculator; Papers 2 and 3 allow a calculator", "Each paper is worth one third of the grade"], "dp": ["Two papers of 100 marks, both calculator", "One 3 hour paper with a calculator", "Paper 1 calculator, Paper 3 spoken"], "mand": 0}, {"id": "MAT-08-002", "t": 8, "s": "Mock", "k": "Explain", "m": 2, "ht": false, "q": "Roughly how should you <b>pace<\/b> an 80 mark, 90 minute paper?", "a": ["About <b>1 minute per mark<\/b> (1)", "That leaves about <b>10 minutes to check<\/b> answers (1)"], "cp": ["About 1 minute per mark", "That leaves about 10 minutes to check
