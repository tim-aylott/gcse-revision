2", "k": "Recall", "m": 1, "ht": false, "q": "Write the <b>equation<\/b> used to calculate atom economy.", "a": ["<b>M<sub>r<\/sub> of desired product ÷ sum of M<sub>r<\/sub> of all reactants × 100<\/b> (1)"], "cp": ["M<sub>r<\/sub> of desired product ÷ sum of M<sub>r<\/sub> of all reactants × 100"], "dp": ["Mass of product made ÷ mass of reactants", "Actual yield ÷ theoretical yield × 100", "M<sub>r<\/sub> of waste ÷ M<sub>r<\/sub> of reactants"], "mand": 0}, {"id": "CHE-03-022", "t": 3, "s": "4.3.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "Calcium carbonate is heated to make calcium oxide: CaCO<sub>3<\/sub> → CaO + CO<sub>2<\/sub>.<br/>(M<sub>r<\/sub>: CaCO<sub>3<\/sub> = 100, CaO = 56)<br/><br/>Calculate the atom economy for making CaO.", "a": ["Desired product M<sub>r<\/sub> = 56 (1)", "56 ÷ 100 × 100 (1)", "= <b>56%<\/b> (1)"], "cp": ["Desired product M<sub>r<\/sub> = 56", "56 ÷ 100 × 100", "= 56%"], "dp": ["44%", "100%", "178%"], "mand": 0}, {"id": "CHE-03-023", "t": 3, "s": "4.3.3.2", "k": "Calculation", "m": 3, "ht": false, "q": "Iron is made: Fe<sub>2<\/sub>O<sub>3<\/sub> + 3CO → 2Fe + 3CO<sub>2<\/sub>.<br/>(M<sub>r<\/sub>: Fe<sub>2<\/sub>O<sub>3<\/sub> = 160, CO = 28, Fe = 56)<br/><br/>Calculate the atom economy for making iron.", "a": ["Desired product = 2 × 56 = 112 (1)", "Reactants = 160 + (3 × 28) = 244 (1)", "112 ÷ 244 × 100 = <b>45.9%<\/b> (1)"], "cp": ["Desired product = 2 × 56 = 112", "Reactants = 160 + (3 × 28) = 244", "112 ÷ 244 × 100 = 45.9%"], "dp": ["70%", "54.1%", "35%"], "mand": 0}, {"id": "CHE-03-H01", "t": 3, "s": "4.3.2.5", "k": "Calculation", "m": 3, "ht": true, "q": "Calculate the <b>mass of solute<\/b> in 200 cm<sup>3<\/sup> of a solution with concentration 25 g/dm<sup>3<\/sup>.", "a": ["200 cm<sup>3<\/sup> = 0.2 dm<sup>3<\/sup> (1)", "mass = concentration × volume = 25 × 0.2 (1)", "= <b>5 g<\/b> (1)"], "cp": ["200 cm<sup>3<\/sup> = 0.2 dm<sup>3<\/sup>", "mass = concentration × volume = 25 × 0.2", "= 5 g"], "dp": ["125 g", "0.5 g", "50 g"], "mand": 0}, {"id": "CHE-03-H02", "t": 3, "s": "4.3.3.1", "k": "Calculation", "m": 4, "ht": true, "q": "4.8 g of magnesium burns in oxygen: 2Mg + O<sub>2<\/sub> → 2MgO. The student collects 7.2 g of magnesium oxide.<br/>(A<sub>r<\/sub>: Mg = 24, O = 16)<br/><br/>Calculate the percentage yield.", "a": ["Moles Mg = 4.8 ÷ 24 = 0.2 (1)", "Moles MgO = 0.2, so max mass = 0.2 × 40 = <b>8.0 g<\/b> (1)", "7.2 ÷ 8.0 × 100 (1)", "= <b>90%<\/b> (1)"], "cp": ["Moles Mg = 4.8 ÷ 24 = 0.2", "Moles MgO = 0.2, so max mass = 0.2 × 40 = 8.0 g", "7.2 ÷ 8.0 × 100", "= 90%"], "dp": ["150%", "72%", "66.7%"], "mand": 0}, {"id": "CHE-03-H03", "t": 3, "s": "4.3.3.2", "k": "Explain", "m": 3, "ht": true, "q": "Give <b>three<\/b> pieces of information that can help decide the best <b>reaction pathway<\/b> to make a chemical.", "a": ["Any three (1 each):", "• <b>atom economy<\/b>", "• <b>percentage yield<\/b>", "• <b>rate<\/b> of the reaction", "• the <b>equilibrium position<\/b>", "• whether the <b>by-products<\/b> are useful"], "cp": ["atom economy", "percentage yield", "rate of the reaction", "the equilibrium position", "whether the by-products are useful"], "dp": ["The colour of the product", "The state symbols", "The number of electrons in the product"], "mand": 0}, {"id": "CHE-03-H04", "t": 3, "s": "4.3.2.1", "k": "Definition", "m": 2, "ht": true, "q": "What is a <b>mole<\/b>? What is the <b>Avogadro constant<\/b>?", "a": ["The amount of substance that contains <b>6.02 × 10<sup>23<\/sup><\/b> particles (1)", "The Avogadro constant is <b>6.02 × 10<sup>23<\/sup> per mole<\/b> (1)"], "cp": ["The amount of substance that contains 6.02 × 10<sup>23<\/sup> particles", "The Avogadro constant is 6.02 × 10<sup>23<\/sup> per mole"], "dp": ["The mass of one atom in grams", "6.02 × 10<sup>-23<\/sup> particles", "The amount that occupies 24 dm<sup>3<\/sup> for any substance"], "mand": 0}, {"id": "CHE-03-H05", "t": 3, "s": "4.3.2.1", "k": "Recall", "m": 1, "ht": true, "q": "Write the equation linking <b>moles, mass and M<sub>r<\/sub><\/b>.", "a": ["<b>moles = mass (g) ÷ M<sub>r<\/sub><\/b> (1)"], "cp": ["moles = mass (g) ÷ M<sub>r<\/sub>"], "dp": ["moles = mass × M<sub>r<\/sub>", "moles = M<sub>r<\/sub> ÷ mass", "moles = mass ÷ volume"], "mand": 0}, {"id": "CHE-03-H06", "t": 3, "s": "4.3.2.1", "k": "Calculation", "m": 2, "ht": true, "q": "Calculate the number of moles in <b>36 g of water<\/b>, H<sub>2<\/sub>O.<br/>(A<sub>r<\/sub>: H = 1, O = 16)", "a": ["M<sub>r<\/sub> = 18 (1)", "36 ÷ 18 = <b>2 mol<\/b> (1)"], "cp": ["M<sub>r<\/sub> = 18", "36 ÷ 18 = 2 mol"], "dp": ["648 mol", "0.5 mol", "1 mol"], "mand": 0}, {"id": "CHE-03-H07", "t": 3, "s": "4.3.2.1", "k": "Calculation", "m": 2, "ht": true, "q": "Calculate the <b>mass<\/b> of 0.5 mol of sodium hydroxide, NaOH.<br/>(A<sub>r<\/sub>: Na = 23, O = 16, H = 1)", "a": ["M<sub>r<\/sub> = 40 (1)", "0.5 × 40 = <b>20 g<\/b> (1)"], "cp": ["M<sub>r<\/sub> = 40", "0.5 × 40 = 20 g"], "dp": ["80 g", "0.0125 g", "40 g"], "mand": 0}, {"id": "CHE-03-H08", "t": 3, "s": "4.3.2.1", "k": "Calculation", "m": 2, "ht": true, "q": "How many <b>atoms<\/b> are in 2 mol of carbon? (Avogadro constant = 6.02 × 10<sup>23<\/sup>)", "a": ["2 × 6.02 × 10<sup>23<\/sup> (1)", "= <b>1.204 × 10<sup>24<\/sup><\/b> atoms (1)"], "cp": ["2 × 6.02 × 10<sup>23<\/sup>", "= 1.204 × 10<sup>24<\/sup> atoms"], "dp": ["3.01 × 10<sup>23<\/sup> atoms", "6.02 × 10<sup>23<\/sup> atoms", "1.204 × 10<sup>23<\/sup> atoms"], "mand": 0}, {"id": "CHE-03-H09", "t": 3, "s": "4.3.2.2", "k": "Calculation", "m": 4, "ht": true, "q": "Mg + 2HCl → MgCl<sub>2<\/sub> + H<sub>2<\/sub><br/><br/>Calculate the mass of magnesium chloride made from 12 g of magnesium.<br/>(A<sub>r<\/sub>: Mg = 24; M<sub>r<\/sub> MgCl<sub>2<\/sub> = 95)", "a": ["Moles Mg = 12 ÷ 24 = 0.5 (1)", "Ratio Mg : MgCl<sub>2<\/sub> is 1 : 1, so 0.5 mol MgCl<sub>2<\/sub> (1)", "Mass = 0.5 × 95 (1)", "= <b>47.5 g<\/b> (1)"], "cp": ["Moles Mg = 12 ÷ 24 = 0.5", "Ratio Mg : MgCl<sub>2<\/sub> is 1 : 1, so 0.5 mol MgCl<sub>2<\/sub>", "Mass = 0.5 × 95", "= 47.5 g"], "dp": ["95 g", "23.75 g", "190 g"], "mand": 0}, {"id": "CHE-03-H10", "t": 3, "s": "4.3.2.3", "k": "Calculation", "m": 3, "ht": true, "q": "4.8 g of Mg reacts with 3.2 g of O<sub>2<\/sub> to make 8.0 g of MgO.<br/>(M<sub>r<\/sub>: Mg = 24, O<sub>2<\/sub> = 32, MgO = 40)<br/><br/>Use moles to find the balanced equation.", "a": ["Moles: Mg = 0.2, O<sub>2<\/sub> = 0.1, MgO = 0.2 (1)", "Ratio = 0.2 : 0.1 : 0.2 = <b>2 : 1 : 2<\/b> (1)", "<b>2Mg + O<sub>2<\/sub> → 2MgO<\/b> (1)"], "cp": ["Moles: Mg = 0.2, O<sub>2<\/sub> = 0.1, MgO = 0.2", "Ratio = 0.2 : 0.1 : 0.2 = 2 : 1 : 2", "2Mg + O<sub>2<\/sub> → 2MgO"], "dp": ["Mg + O<sub>2<\/sub> → MgO", "Mg + 2O<sub>2<\/sub> → MgO<sub>2<\/sub>", "4Mg + O<sub>2<\/sub> → 2MgO"], "mand": 0}, {"id": "CHE-03-H11", "t": 3, "s": "4.3.2.4", "k": "Explain", "m": 2, "ht": true, "q": "What is a <b>limiting reactant<\/b>? Why is another reactant often used in <b>excess<\/b>?", "a": ["The reactant that is <b>used up first<\/b>, so limits the amount of product (1)", "An excess of the other makes sure the limiting reactant <b>all reacts<\/b> (1)"], "cp": ["The reactant that is used up first, so limits the amount of product", "An excess of the other makes sure the limiting reactant all reacts"], "dp": ["The reactant with the greatest mass", "The reactant that is not used up", "The catalyst"], "mand": 0}, {"id": "CHE-03-H12", "t": 3, "s": "4.3.2.4", "k": "Explain", "m": 2, "ht": true, "q": "2 mol of magnesium is added to 3 mol of hydrochloric acid: Mg + 2HCl → MgCl<sub>2<\/sub> + H<sub>2<\/sub>.<br/><br/>Which is the limiting reactant?", "a": ["2 mol Mg needs 4 mol HCl, but only 3 mol is present (1)", "So <b>hydrochloric acid<\/b> is the limiting reactant (1)"], "cp": ["2 mol Mg needs 4 mol HCl, but only 3 mol is present", "So hydrochloric acid is the limiting reactant"], "dp": ["Magnesium, as there is more of it", "Magnesium, as it needs 4 mol", "Neither, as both react fully"], "mand": 0}, {"id": "CHE-03-H13", "t": 3, "s": "4.3.4", "k": "Calculation", "m": 2, "ht": true, "q": "0.5 mol of sodium hydroxide is dissolved to make 250 cm<sup>3<\/sup> of solution.<br/><br/>Calculate the concentration in mol/dm<sup>3<\/sup>.", "a": ["250 cm<sup>3<\/sup> = 0.25 dm<sup>3<\/sup> (1)", "0.5 ÷ 0.25 = <b>2 mol/dm<sup>3<\/sup><\/b> (1)"], "cp": ["250 cm<sup>3<\/sup> = 0.25 dm<sup>3<\/sup>", "0.5 ÷ 0.25 = 2 mol/dm<sup>3<\/sup>"], "dp": ["0.125 mol/dm<sup>3<\/sup>", "125 mol/dm<sup>3<\/sup>", "0.5 mol/dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-03-H14", "t": 3, "s": "4.3.4", "k": "Calculation", "m": 3, "ht": true, "q": "Calculate the mass of NaOH in 100 cm<sup>3<\/sup> of a 0.50 mol/dm<sup>3<\/sup> solution.<br/>(M<sub>r<\/sub> NaOH = 40)", "a": ["Moles = 0.50 × 0.100 = 0.05 mol (1)", "Mass = 0.05 × 40 (1)", "= <b>2.0 g<\/b> (1)"], "cp": ["Moles = 0.50 × 0.100 = 0.05 mol", "Mass = 0.05 × 40", "= 2.0 g"], "dp": ["20 g", "0.2 g", "5 g"], "mand": 0}, {"id": "CHE-03-H15", "t": 3, "s": "4.3.4", "k": "Calculation", "m": 4, "ht": true, "q": "25.0 cm<sup>3<\/sup> of 0.100 mol/dm<sup>3<\/sup> NaOH is neutralised by 20.0 cm<sup>3<\/sup> of hydrochloric acid: HCl + NaOH → NaCl + H<sub>2<\/sub>O.<br/><br/>Calculate the concentration of the acid.", "a": ["Moles NaOH = 0.100 × 0.0250 = 0.00250 (1)", "Ratio 1 : 1 so moles HCl = 0.00250 (1)", "Concentration = 0.00250 ÷ 0.0200 (1)", "= <b>0.125 mol/dm<sup>3<\/sup><\/b> (1)"], "cp": ["Moles NaOH = 0.100 × 0.0250 = 0.00250", "Ratio 1 : 1 so moles HCl = 0.00250", "Concentration = 0.00250 ÷ 0.0200", "= 0.125 mol/dm<sup>3<\/sup>"], "dp": ["0.0800 mol/dm<sup>3<\/sup>", "0.100 mol/dm<sup>3<\/sup>", "0.200 mol/dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-03-H16", "t": 3, "s": "4.3.5", "k": "Recall", "m": 2, "ht": true, "q": "What volume does <b>1 mol of any gas<\/b> occupy at room temperature and pressure? What is the same for equal volumes of gases?", "a": ["<b>24 dm<sup>3<\/sup><\/b> (24 000 cm<sup>3<\/sup>) (1)", "Equal volumes of gases at the same temperature and pressure contain the <b>same number of moles<\/b> (1)"], "cp": ["24 dm<sup>3<\/sup> (24 000 cm<sup>3<\/sup>)", "Equal volumes of gases at the same temperature and pressure contain the same number of moles"], "dp": ["22.4 dm<sup>3<\/sup> at room temperature", "1 dm<sup>3<\/sup>", "24 cm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-03-H17", "t": 3, "s": "4.3.5", "k": "Calculation", "m": 3, "ht": true, "q": "Calculate the <b>volume of carbon dioxide<\/b> made when 10 g of calcium carbonate decomposes: CaCO<sub>3<\/sub> → CaO + CO<sub>2<\/sub>.<br/>(M<sub>r<\/sub> CaCO<sub>3<\/sub> = 100)", "a": ["Moles CaCO<sub>3<\/sub> = 10 ÷ 100 = 0.1 (1)", "Moles CO<sub>2<\/sub> = 0.1 (1)", "Volume = 0.1 × 24 = <b>2.4 dm<sup>3<\/sup><\/b> (1)"], "cp": ["Moles CaCO<sub>3<\/sub> = 10 ÷ 100 = 0.1", "Moles CO<sub>2<\/sub> = 0.1", "Volume = 0.1 × 24 = 2.4 dm<sup>3<\/sup>"], "dp": ["24 dm<sup>3<\/sup>", "0.24 dm<sup>3<\/sup>", "240 dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-03-H18", "t": 3, "s": "4.3.5", "k": "Calculation", "m": 2, "ht": true, "q": "2H<sub>2<\/sub> + O<sub>2<\/sub> → 2H<sub>2<\/sub>O<br/><br/>What volume of oxygen is needed to react fully with 10 dm<sup>3<\/sup> of hydrogen (same conditions)?", "a": ["The ratio H<sub>2<\/sub> : O<sub>2<\/sub> is 2 : 1 (1)", "So 10 ÷ 2 = <b>5 dm<sup>3<\/sup><\/b> (1)"], "cp": ["The ratio H<sub>2<\/sub> : O<sub>2<\/sub> is 2 : 1", "So 10 ÷ 2 = 5 dm<sup>3<\/sup>"], "dp": ["20 dm<sup>3<\/sup>", "10 dm<sup>3<\/sup>", "2.5 dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-03-H19", "t": 3, "s": "4.3.5", "k": "Calculation", "m": 2, "ht": true, "q": "Calculate the volume of 8 g of oxygen gas (O<sub>2<\/sub>) at room temperature and pressure.<br/>(A<sub>r<\/sub> O = 16)", "a": ["Moles = 8 ÷ 32 = 0.25 (1)", "Volume = 0.25 × 24 = <b>6 dm<sup>3<\/sup><\/b> (1)"], "cp": ["Moles = 8 ÷ 32 = 0.25", "Volume = 0.25 × 24 = 6 dm<sup>3<\/sup>"], "dp": ["12 dm<sup>3<\/sup>", "3 dm<sup>3<\/sup>", "24 dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-04-001", "t": 4, "s": "4.4.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is meant by <b>oxidation<\/b> and <b>reduction<\/b> in terms of oxygen?", "a": ["Oxidation is the <b>gain of oxygen<\/b> (1)", "Reduction is the <b>loss of oxygen<\/b> (1)"], "cp": ["Oxidation is the gain of oxygen", "Reduction is the loss of oxygen"], "dp": ["Oxidation is the loss of oxygen", "Reduction is the gain of oxygen", "Oxidation is the loss of hydrogen only"], "mand": 0}, {"id": "CHE-04-002", "t": 4, "s": "4.4.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Magnesium burns in oxygen: 2Mg + O<sub>2<\/sub> → 2MgO.<br/><br/>Is the magnesium <b>oxidised or reduced<\/b>? Explain.", "a": ["<b>Oxidised<\/b> (1)", "because it <b>gains oxygen<\/b> (1)"], "cp": ["Oxidised", "because it gains oxygen"], "dp": ["Reduced because it gains oxygen", "Reduced because it loses oxygen", "Oxidised because it loses oxygen"], "mand": 0}, {"id": "CHE-04-003", "t": 4, "s": "4.4.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Put these metals in order of reactivity, <b>most reactive first<\/b>: copper, magnesium, zinc, sodium, iron.", "a": ["<b>Sodium<\/b> is the most reactive (1)", "then <b>magnesium<\/b>, then <b>zinc<\/b> (1)", "then <b>iron<\/b>, then <b>copper<\/b> is the least reactive (1)"], "cp": ["Sodium is the most reactive", "then magnesium, then zinc", "then iron, then copper is the least reactive"], "dp": ["Copper, iron, zinc, magnesium, sodium", "Magnesium, sodium, iron, zinc, copper", "Sodium, zinc, magnesium, copper, iron"], "mand": 0}, {"id": "CHE-04-004", "t": 4, "s": "4.4.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Which gas is made when a metal reacts with <b>water<\/b> or <b>dilute acid<\/b>? How do you test for it?", "a": ["<b>Hydrogen<\/b> (1)", "A lit splint gives a <b>squeaky pop<\/b> (1)"], "cp": ["Hydrogen", "A lit splint gives a squeaky pop"], "dp": ["Oxygen, relights a glowing splint", "Carbon dioxide, turns limewater milky", "Chlorine, bleaches damp litmus paper"], "mand": 0}, {"id": "CHE-04-005", "t": 4, "s": "4.4.1.2", "k": "Explain", "m": 2, "ht": false, "q": "What happens when <b>magnesium<\/b> is added to <b>copper sulfate<\/b> solution? Explain.", "a": ["Magnesium <b>displaces<\/b> copper, which forms as a brown/pink solid (blue colour fades) (1)", "Magnesium is <b>more reactive<\/b> than copper (1)"], "cp": ["Magnesium displaces copper, which forms as a brown/pink solid (blue colour fades)", "Magnesium is more reactive than copper"], "dp": ["Nothing happens as magnesium is less reactive", "Copper displaces magnesium", "The solution turns darker blue"], "mand": 0}, {"id": "CHE-04-006", "t": 4, "s": "4.4.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Iron nails are put in zinc sulfate solution and nothing happens. Why?", "a": ["Iron is <b>less reactive<\/b> than zinc (1)", "so it <b>cannot displace<\/b> zinc from its compound (1)"], "cp": ["Iron is less reactive than zinc", "so it cannot displace zinc from its compound"], "dp": ["Iron is more reactive than zinc", "Zinc sulfate is insoluble", "The nails are too small"], "mand": 0}, {"id": "CHE-04-007", "t": 4, "s": "4.4.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Explain why metals more reactive than <b>carbon<\/b> cannot be extracted by heating with carbon.", "a": ["Carbon is <b>less reactive<\/b> than the metal (1)", "so it <b>cannot displace<\/b> (reduce) the metal oxide (1)"], "cp": ["Carbon is less reactive than the metal", "so it cannot displace (reduce) the metal oxide"], "dp": ["Carbon is more reactive than these metals", "These metals are unreactive", "These metals have lower melting points"], "mand": 0}, {"id": "CHE-04-008", "t": 4, "s": "4.4.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Reactivity is linked to how easily a metal forms <b>positive ions<\/b>. Which of potassium and magnesium is more reactive and why?", "a": ["<b>Potassium<\/b> is more reactive (1)", "Its atoms <b>lose electrons<\/b> more easily (1)", "to form positive ions (1)"], "cp": ["Potassium is more reactive", "Its atoms lose electrons more easily", "to form positive ions"], "dp": ["Magnesium, as its atoms hold electrons weakly", "Potassium, as its atoms gain electrons", "Magnesium, as it forms 2+ ions"], "mand": 0}, {"id": "CHE-04-009", "t": 4, "s": "4.4.1.3", "k": "Recall", "m": 2, "ht": false, "q": "Why is <b>gold<\/b> found as the pure metal but <b>iron<\/b> is found as a compound?", "a": ["Gold is <b>unreactive<\/b> so does not react with other substances (1)", "Iron is <b>more reactive<\/b> so is found combined (as iron oxide) (1)"], "cp": ["Gold is unreactive so does not react with other substances", "Iron is more reactive so is found combined (as iron oxide)"], "dp": ["Gold is very reactive", "Iron is unreactive", "Gold is found as a compound"], "mand": 0}, {"id": "CHE-04-010", "t": 4, "s": "4.4.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Iron oxide is heated with carbon. Which substance is <b>reduced<\/b> and why?", "a": ["<b>Iron oxide<\/b> is reduced (1)", "because it <b>loses oxygen<\/b> (to the carbon) (1)"], "cp": ["Iron oxide is reduced", "because it loses oxygen (to the carbon)"], "dp": ["Carbon is reduced because it gains oxygen", "Iron oxide is oxidised because it loses oxygen", "Carbon is reduced because it loses oxygen"], "mand": 0}, {"id": "CHE-04-011", "t": 4, "s": "4.4.1.3", "k": "Recall", "m": 3, "ht": false, "q": "Which <b>three<\/b> of these can be extracted by heating with carbon: zinc, aluminium, iron, potassium, copper?", "a": ["<b>Zinc<\/b> (1)", "<b>Iron<\/b> (1)", "<b>Copper<\/b> (1)", "(they are less reactive than carbon)"], "cp": ["Zinc", "Iron", "Copper"], "dp": ["Aluminium", "Potassium", "Aluminium and potassium"], "mand": 0}, {"id": "CHE-04-012", "t": 4, "s": "4.4.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What are the products when a <b>metal reacts with an acid<\/b>? Give the word equation for magnesium and hydrochloric acid.", "a": ["metal + acid → <b>salt + hydrogen<\/b> (1)", "magnesium + hydrochloric acid → <b>magnesium chloride + hydrogen<\/b> (1)"], "cp": ["metal + acid → salt + hydrogen", "magnesium + hydrochloric acid → magnesium chloride + hydrogen"], "dp": ["metal + acid → salt + water", "magnesium + hydrochloric acid → magnesium oxide + hydrogen", "metal + acid → salt + carbon dioxide"], "mand": 0}, {"id": "CHE-04-013", "t": 4, "s": "4.4.2.2", "k": "Recall", "m": 3, "ht": false, "q": "What are the products when an acid reacts with: a <b>metal oxide<\/b>, a <b>metal hydroxide<\/b>, and a <b>metal carbonate<\/b>?", "a": ["Oxide: <b>salt + water<\/b> (1)", "Hydroxide: <b>salt + water<\/b> (1)", "Carbonate: <b>salt + water + carbon dioxide<\/b> (1)"], "cp": ["Oxide: salt + water", "Hydroxide: salt + water", "Carbonate: salt + water + carbon dioxide"], "dp": ["Oxide: salt + hydrogen", "Hydroxide: salt + hydrogen", "Carbonate: salt + hydrogen"], "mand": 0}, {"id": "CHE-04-014", "t": 4, "s": "4.4.2.2", "k": "Recall", "m": 3, "ht": false, "q": "Which type of salt is made from <b>hydrochloric<\/b>, <b>nitric<\/b> and <b>sulfuric<\/b> acid?", "a": ["Hydrochloric acid makes <b>chlorides<\/b> (1)", "Nitric acid makes <b>nitrates<\/b> (1)", "Sulfuric acid makes <b>sulfates<\/b> (1)"], "cp": ["Hydrochloric acid makes chlorides", "Nitric acid makes nitrates", "Sulfuric acid makes sulfates"], "dp": ["Hydrochloric makes chlorates", "Nitric makes nitrites", "Sulfuric makes sulfites"], "mand": 0}, {"id": "CHE-04-015", "t": 4, "s": "4.4.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Give the word equation for <b>copper oxide + sulfuric acid<\/b>.", "a": ["copper oxide + sulfuric acid → <b>copper sulfate<\/b> (1) + <b>water<\/b> (1)"], "cp": ["copper oxide + sulfuric acid → copper sulfate", "+ water"], "dp": ["copper oxide + sulfuric acid → copper sulfate + hydrogen", "copper oxide + sulfuric acid → copper sulfide + water", "copper oxide + sulfuric acid → copper chloride + water"], "mand": 0}, {"id": "CHE-04-016", "t": 4, "s": "4.4.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Give the word equation for <b>sodium carbonate + hydrochloric acid<\/b>.", "a": ["sodium carbonate + hydrochloric acid → <b>sodium chloride<\/b> (1) + <b>water + carbon dioxide<\/b> (1)"], "cp": ["sodium carbonate + hydrochloric acid → sodium chloride", "+ water + carbon dioxide"], "dp": ["sodium carbonate + hydrochloric acid → sodium chloride + hydrogen", "sodium carbonate + hydrochloric acid → sodium hydroxide + water", "sodium carbonate + hydrochloric acid → sodium chlorate + water"], "mand": 0}, {"id": "CHE-04-017", "t": 4, "s": "4.4.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Write the <b>formula<\/b> of the salt made from zinc oxide and sulfuric acid, and the formula of the salt made from calcium hydroxide and nitric acid.", "a": ["ZnSO<sub>4<\/sub> (zinc sulfate) (1)", "Ca(NO<sub>3<\/sub>)<sub>2<\/sub> (calcium nitrate) (1)"], "cp": ["ZnSO<sub>4<\/sub> (zinc sulfate)", "Ca(NO<sub>3<\/sub>)<sub>2<\/sub> (calcium nitrate)"], "dp": ["ZnSO<sub>3<\/sub> and CaNO<sub>3<\/sub>", "Zn<sub>2<\/sub>SO<sub>4<\/sub> and Ca(NO<sub>3<\/sub>)", "ZnS and CaN<sub>2<\/sub>"], "mand": 0}, {"id": "CHE-04-018", "t": 4, "s": "4.4.2.3", "k": "Practical", "m": 5, "ht": false, "q": "Describe how to make <b>pure, dry crystals of copper sulfate<\/b> from copper oxide and sulfuric acid.", "a": ["Warm the <b>acid<\/b>, add <b>copper oxide<\/b>, stir (1)", "Add until <b>no more dissolves<\/b> (excess) (1)", "<b>Filter<\/b> to remove the excess copper oxide (1)", "<b>Heat the filtrate<\/b> to evaporate some water (1)", "Leave to <b>crystallise<\/b>, filter and <b>dry<\/b> (1)"], "cp": ["Warm the acid, add copper oxide, stir", "Add until no more dissolves (excess)", "Filter to remove the excess copper oxide", "Heat the filtrate to evaporate some water", "Leave to crystallise, filter and dry"], "dp": ["Add acid to the oxide then evaporate to dryness without filtering", "Use excess acid and filter off the crystals straight away", "Boil the mixture until all the water has gone"], "mand": 0}, {"id": "CHE-04-019", "t": 4, "s": "4.4.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Why is the <b>insoluble solid added in excess<\/b> when making a salt?", "a": ["So that <b>all the acid<\/b> is used up (reacts) (1)", "The excess can then be <b>filtered<\/b> off, leaving a neutral pure salt solution (1)"], "cp": ["So that all the acid is used up (reacts)", "The excess can then be filtered off, leaving a neutral pure salt solution"], "dp": ["So the solution is acidic", "To make the reaction faster", "So the acid is in excess"], "mand": 0}, {"id": "CHE-04-020", "t": 4, "s": "4.4.2.4", "k": "Recall", "m": 2, "ht": false, "q": "What <b>ions<\/b> do acids and alkalis make in water?", "a": ["Acids make <b>H<sup>+<\/sup><\/b> ions (1)", "Alkalis make <b>OH<sup>-<\/sup><\/b> ions (1)"], "cp": ["Acids make H<sup>+<\/sup> ions", "Alkalis make OH<sup>-<\/sup> ions"], "dp": ["Acids make OH<sup>-<\/sup> ions", "Alkalis make H<sup>+<\/sup> ions", "Acids make Cl<sup>-<\/sup> ions"], "mand": 0}, {"id": "CHE-04-021", "t": 4, "s": "4.4.2.4", "k": "Recall", "m": 3, "ht": false, "q": "State the pH of: a neutral solution, an acid and an alkali (give a range).", "a": ["Neutral = <b>7<\/b> (1)", "Acid = <b>less than 7<\/b> (1)", "Alkali = <b>more than 7<\/b> (1)"], "cp": ["Neutral = 7", "Acid = less than 7", "Alkali = more than 7"], "dp": ["Neutral = 0", "Acid = more than 7", "Alkali = less than 7"], "mand": 0}, {"id": "CHE-04-022", "t": 4, "s": "4.4.2.4", "k": "Recall", "m": 2, "ht": false, "q": "How can you measure the pH of a solution? Give <b>two<\/b> ways.", "a": ["<b>Universal indicator<\/b> (or pH paper), compare the colour with a chart (1)", "A <b>pH probe<\/b> connected to a meter (1)"], "cp": ["Universal indicator (or pH paper), compare the colour with a chart", "A pH probe connected to a meter"], "dp": ["Litmus paper only", "A thermometer", "A burette"], "mand": 0}, {"id": "CHE-04-023", "t": 4, "s": "4.4.2.4", "k": "Explain", "m": 2, "ht": false, "q": "Write the <b>ionic equation<\/b> for neutralisation. What is made?", "a": ["<b>H<sup>+<\/sup> + OH<sup>-<\/sup> → H<sub>2<\/sub>O<\/b> (1)", "<b>Water<\/b> is made (1)"], "cp": ["H<sup>+<\/sup> + OH<sup>-<\/sup> → H<sub>2<\/sub>O", "Water is made"], "dp": ["H<sup>+<\/sup> + Cl<sup>-<\/sup> → HCl", "OH<sup>-<\/sup> + Na<sup>+<\/sup> → NaOH", "H<sub>2<\/sub> + O<sub>2<\/sub> → H<sub>2<\/sub>O"], "mand": 0}, {"id": "CHE-04-024", "t": 4, "s": "4.4.2.5", "k": "Practical", "m": 5, "ht": false, "q": "Describe how to find the <b>volume of acid<\/b> that exactly neutralises 25 cm<sup>3<\/sup> of alkali (titration).", "a": ["<b>Pipette<\/b> 25 cm<sup>3<\/sup> alkali into a flask (1)", "Add a few drops of <b>indicator<\/b> (1)", "Fill a <b>burette<\/b> with acid, read the start (1)", "Add acid slowly, <b>swirling<\/b>, until the <b>colour just changes<\/b> (1)", "Record the volume and <b>repeat<\/b> until <b>concordant<\/b> (1)"], "cp": ["Pipette 25 cm<sup>3<\/sup> alkali into a flask", "Add a few drops of indicator", "Fill a burette with acid, read the start", "Add acid slowly, swirling, until the colour just changes", "Record the volume and repeat until concordant"], "dp": ["Add all the acid at once", "Use universal indicator to find the pH", "Heat the mixture until it boils dry"], "mand": 0}, {"id": "CHE-04-025", "t": 4, "s": "4.4.2.5", "k": "Explain", "m": 2, "ht": false, "q": "Why is a <b>pipette<\/b> used for the alkali and a <b>burette<\/b> for the acid?", "a": ["A pipette measures an <b>exact fixed volume<\/b> accurately (1)", "A burette lets you add <b>drops<\/b> and read the volume added to 0.05 cm<sup>3<\/sup> (1)"], "cp": ["A pipette measures an exact fixed volume accurately", "A burette lets you add drops and read the volume added to 0.05 cm<sup>3<\/sup>"], "dp": ["A pipette adds the acid in drops", "A burette measures an exact fixed volume", "They are cheaper than measuring cylinders"], "mand": 0}, {"id": "CHE-04-026", "t": 4, "s": "4.4.2.5", "k": "Explain", "m": 1, "ht": false, "q": "Why is a titration often <b>repeated<\/b> until concordant results?", "a": ["To get <b>accurate, reliable<\/b> results (results within 0.10 cm<sup>3<\/sup> of each other) (1)"], "cp": ["To get accurate, reliable results (results within 0.10 cm<sup>3<\/sup> of each other)"], "dp": ["To make the reaction go to completion", "To use up the indicator", "To lower the pH"], "mand": 0}, {"id": "CHE-04-027", "t": 4, "s": "4.4.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>electrolysis<\/b>? What is an <b>electrolyte<\/b>?", "a": ["Using <b>electricity<\/b> to break down an ionic compound (1)", "An electrolyte is the <b>molten or dissolved<\/b> ionic compound that conducts (1)"], "cp": ["Using electricity to break down an ionic compound", "An electrolyte is the molten or dissolved ionic compound that conducts"], "dp": ["Using heat to break down a compound", "A solid ionic compound", "The metal electrode"], "mand": 0}, {"id": "CHE-04-028", "t": 4, "s": "4.4.3.1", "k": "Recall", "m": 2, "ht": false, "q": "Which electrode do <b>positive ions<\/b> go to? Which do <b>negative ions<\/b> go to?", "a": ["Positive ions go to the <b>cathode<\/b> (negative electrode) (1)", "Negative ions go to the <b>anode<\/b> (positive electrode) (1)"], "cp": ["Positive ions go to the cathode (negative electrode)", "Negative ions go to the anode (positive electrode)"], "dp": ["Positive ions go to the anode", "Negative ions go to the cathode", "Both go to the cathode"], "mand": 0}, {"id": "CHE-04-029", "t": 4, "s": "4.4.3.1", "k": "Explain", "m": 2, "ht": false, "q": "Why must an ionic compound be <b>molten or dissolved<\/b> for electrolysis?", "a": ["In a solid the ions are in <b>fixed positions<\/b> (1)", "When molten or dissolved the ions are <b>free to move<\/b> to the electrodes (1)"], "cp": ["In a solid the ions are in fixed positions", "When molten or dissolved the ions are free to move to the electrodes"], "dp": ["Solid ionic compounds contain free electrons", "The ions would move in a solid", "The compound must be cold to conduct"], "mand": 0}, {"id": "CHE-04-030", "t": 4, "s": "4.4.3.2", "k": "Explain", "m": 3, "ht": false, "q": "Molten lead bromide (PbBr<sub>2<\/sub>) is electrolysed with inert electrodes. Name the <b>product at each electrode<\/b>.", "a": ["Cathode: <b>lead<\/b> (metal) (1)", "Anode: <b>bromine<\/b> (1)", "Because positive ions go to the cathode and negative ions to the anode (1)"], "cp": ["Cathode: lead (metal)", "Anode: bromine", "Because positive ions go to the cathode and negative ions to the anode"], "dp": ["Cathode: bromine", "Anode: lead", "Cathode: hydrogen"], "mand": 0}, {"id": "CHE-04-031", "t": 4, "s": "4.4.3.2", "k": "Recall", "m": 1, "ht": false, "q": "Which is formed at the <b>cathode<\/b> when a molten ionic compound is electrolysed?", "a": ["The <b>metal<\/b> (1)"], "cp": ["The metal"], "dp": ["The non-metal", "Hydrogen always", "Oxygen"], "mand": 0}, {"id": "CHE-04-032", "t": 4, "s": "4.4.3.3", "k": "Explain", "m": 2, "ht": false, "q": "Why is <b>electrolysis<\/b> used to extract aluminium?", "a": ["Aluminium is <b>more reactive than carbon<\/b> (1)", "so it cannot be extracted by <b>reduction with carbon<\/b> (1)"], "cp": ["Aluminium is more reactive than carbon", "so it cannot be extracted by reduction with carbon"], "dp": ["Aluminium is less reactive than carbon", "Carbon is too expensive", "Aluminium has no ore"], "mand": 0}, {"id": "CHE-04-033", "t": 4, "s": "4.4.3.3", "k": "Explain", "m": 3, "ht": false, "q": "Aluminium oxide is electrolysed in <b>molten cryolite<\/b>. Why is cryolite used?", "a": ["Aluminium oxide has a <b>very high melting point<\/b> (1)", "Dissolving it in cryolite <b>lowers the temperature<\/b> needed (1)", "which <b>saves energy and cost<\/b> (1)"], "cp": ["Aluminium oxide has a very high melting point", "Dissolving it in cryolite lowers the temperature needed", "which saves energy and cost"], "dp": ["Cryolite increases the melting point", "Cryolite is the product", "Cryolite reduces the aluminium oxide"], "mand": 0}, {"id": "CHE-04-034", "t": 4, "s": "4.4.3.3", "k": "Explain", "m": 2, "ht": false, "q": "Why do the <b>carbon anodes<\/b> need to be replaced regularly in the electrolysis of aluminium oxide?", "a": ["<b>Oxygen<\/b> is made at the anode (1)", "It <b>reacts with the carbon<\/b>, forming carbon dioxide, so the anodes burn away (1)"], "cp": ["Oxygen is made at the anode", "It reacts with the carbon, forming carbon dioxide, so the anodes burn away"], "dp": ["Aluminium reacts with the carbon", "Carbon dissolves in cryolite", "Cryolite reacts with carbon"], "mand": 0}, {"id": "CHE-04-035", "t": 4, "s": "4.4.3.4", "k": "Recall", "m": 2, "ht": false, "q": "In the electrolysis of an <b>aqueous solution<\/b>, what forms at the <b>cathode<\/b>?", "a": ["<b>Hydrogen<\/b> is made if the metal is <b>more reactive than hydrogen<\/b> (1)", "Otherwise the <b>metal<\/b> is made (1)"], "cp": ["Hydrogen is made if the metal is more reactive than hydrogen", "Otherwise the metal is made"], "dp": ["Oxygen is always made", "Metal is always made", "Hydrogen is only made if the metal is less reactive"], "mand": 0}, {"id": "CHE-04-036", "t": 4, "s": "4.4.3.4", "k": "Recall", "m": 2, "ht": false, "q": "In the electrolysis of an <b>aqueous solution<\/b>, what forms at the <b>anode<\/b>?", "a": ["<b>Oxygen<\/b> (1)", "unless a <b>halide ion<\/b> is present, then the <b>halogen<\/b> forms (1)"], "cp": ["Oxygen", "unless a halide ion is present, then the halogen forms"], "dp": ["Hydrogen always", "Metal always", "Chlorine always"], "mand": 0}, {"id": "CHE-04-037", "t": 4, "s": "4.4.3.4", "k": "Explain", "m": 3, "ht": false, "q": "Sodium chloride solution (brine) is electrolysed. Name the products at the <b>cathode<\/b> and the <b>anode<\/b>.", "a": ["Cathode: <b>hydrogen<\/b> (sodium is more reactive than hydrogen) (1)", "Anode: <b>chlorine<\/b> (a halide ion is present) (1)", "<b>Sodium hydroxide<\/b> is left in solution (1)"], "cp": ["Cathode: hydrogen (sodium is more reactive than hydrogen)", "Anode: chlorine (a halide ion is present)", "Sodium hydroxide is left in solution"], "dp": ["Cathode: sodium", "Anode: oxygen", "Anode: hydrogen"], "mand": 0}, {"id": "CHE-04-038", "t": 4, "s": "4.4.3.4", "k": "Explain", "m": 2, "ht": false, "q": "Copper sulfate solution is electrolysed with inert electrodes. Name the products.", "a": ["Cathode: <b>copper<\/b> (less reactive than hydrogen) (1)", "Anode: <b>oxygen<\/b> (1)"], "cp": ["Cathode: copper (less reactive than hydrogen)", "Anode: oxygen"], "dp": ["Cathode: hydrogen", "Anode: sulfur", "Cathode: sulfur dioxide"], "mand": 0}, {"id": "CHE-04-039", "t": 4, "s": "4.4.3.4", "k": "Practical", "m": 4, "ht": false, "q": "Describe how to investigate electrolysis of an aqueous solution using <b>inert electrodes<\/b>.", "a": ["Put the <b>solution<\/b> in a beaker with two inert (graphite) electrodes (1)", "Connect to a <b>power supply<\/b> (d.c.) (1)", "Look for <b>bubbles or a coating<\/b> and test any gas given off (1)", "Compare different solutions and <b>link the products to a hypothesis<\/b> (1)"], "cp": ["Put the solution in a beaker with two inert (graphite) electrodes", "Connect to a power supply (d.c.)", "Look for bubbles or a coating and test any gas given off", "Compare different solutions and link the products to a hypothesis"], "dp": ["Use a metal electrode that reacts with the solution", "Connect to an a.c. supply only", "Use a solid ionic compound"], "mand": 0}, {"id": "CHE-04-H01", "t": 4, "s": "4.4.1.4", "k": "Definition", "m": 2, "ht": true, "q": "What do <b>oxidation<\/b> and <b>reduction<\/b> mean in terms of <b>electrons<\/b>?", "a": ["Oxidation is the <b>loss of electrons<\/b> (1)", "Reduction is the <b>gain of electrons<\/b> (1)"], "cp": ["Oxidation is the loss of electrons", "Reduction is the gain of electrons"], "dp": ["Oxidation is the gain of electrons", "Reduction is the loss of electrons", "Oxidation is the gain of protons"], "mand": 0}, {"id": "CHE-04-H02", "t": 4, "s": "4.4.1.4", "k": "Explain", "m": 3, "ht": true, "q": "Zinc reacts with copper sulfate: Zn + Cu<sup>2+<\/sup> → Zn<sup>2+<\/sup> + Cu.<br/><br/>Which is oxidised and which is reduced? Explain.", "a": ["<b>Zinc<\/b> is oxidised (1)", "because it <b>loses electrons<\/b> (Zn → Zn<sup>2+<\/sup> + 2e<sup>-<\/sup>) (1)", "<b>Copper ions<\/b> are reduced as they <b>gain electrons<\/b> (1)"], "cp": ["Zinc is oxidised", "because it loses electrons (Zn → Zn<sup>2+<\/sup> + 2e<sup>-<\/sup>)", "Copper ions are reduced as they gain electrons"], "dp": ["Zinc is reduced because it loses electrons", "Copper ions are oxidised because they gain electrons", "Both are oxidised"], "mand": 0}, {"id": "CHE-04-H03", "t": 4, "s": "4.4.2.1", "k": "Explain", "m": 3, "ht": true, "q": "Mg + 2H<sup>+<\/sup> → Mg<sup>2+<\/sup> + H<sub>2<\/sub><br/><br/>Explain why this is a <b>redox<\/b> reaction.", "a": ["Magnesium <b>loses electrons<\/b>, so is <b>oxidised<\/b> (1)", "Hydrogen ions <b>gain electrons<\/b>, so are <b>reduced<\/b> (1)", "Both happen at the same time (electrons move from Mg to H<sup>+<\/sup>) (1)"], "cp": ["Magnesium loses electrons, so is oxidised", "Hydrogen ions gain electrons, so are reduced", "Both happen at the same time (electrons move from Mg to H<sup>+<\/sup>)"], "dp": ["Magnesium gains electrons and is reduced", "Hydrogen ions lose electrons", "Only oxidation takes place"], "mand": 0}, {"id": "CHE-04-H04", "t": 4, "s": "4.4.2.6", "k": "Definition", "m": 2, "ht": true, "q": "What is the difference between a <b>strong<\/b> and a <b>weak<\/b> acid?", "a": ["A strong acid is <b>fully ionised<\/b> in water (1)", "A weak acid is only <b>partly ionised<\/b> (1)"], "cp": ["A strong acid is fully ionised in water", "A weak acid is only partly ionised"], "dp": ["A strong acid is more concentrated", "A weak acid has a higher pH than an alkali", "A weak acid has fewer atoms"], "mand": 0}, {"id": "CHE-04-H05", "t": 4, "s": "4.4.2.6", "k": "Recall", "m": 2, "ht": true, "q": "Name <b>one<\/b> strong and <b>one<\/b> weak acid.", "a": ["Strong: <b>hydrochloric<\/b>, <b>nitric<\/b> or <b>sulfuric<\/b> acid (1)", "Weak: <b>ethanoic<\/b>, <b>citric<\/b> or <b>carbonic<\/b> acid (1)"], "cp": ["Strong: hydrochloric, nitric or sulfuric acid", "Weak: ethanoic, citric or carbonic acid"], "dp": ["Strong: ethanoic acid", "Weak: hydrochloric acid", "Strong: citric acid"], "mand": 0}, {"id": "CHE-04-H06", "t": 4, "s": "4.4.2.6", "k": "Explain", "m": 2, "ht": true, "q": "What is the difference between a <b>concentrated<\/b> acid and a <b>strong<\/b> acid?", "a": ["Concentrated = a <b>lot of acid<\/b> in a given volume (amount of substance) (1)", "Strong = the acid is <b>fully ionised<\/b> (degree of ionisation) (1)"], "cp": ["Concentrated = a lot of acid in a given volume (amount of substance)", "Strong = the acid is fully ionised (degree of ionisation)"], "dp": ["They mean the same thing", "Strong means a high mass of acid", "Concentrated means fully ionised"], "mand": 0}, {"id": "CHE-04-H07", "t": 4, "s": "4.4.2.6", "k": "Explain", "m": 2, "ht": true, "q": "The pH of an acid goes from 5 to 3. How does the <b>hydrogen ion concentration<\/b> change?", "a": ["pH fell by <b>2 units<\/b> (1)", "so the H<sup>+<\/sup> concentration is <b>100 times<\/b> greater (10 × 10) (1)"], "cp": ["pH fell by 2 units", "so the H<sup>+<\/sup> concentration is 100 times greater (10 × 10)"], "dp": ["It is 2 times greater", "It is 10 times greater", "It is 100 times smaller"], "mand": 0}, {"id": "CHE-04-H08", "t": 4, "s": "4.4.3.5", "k": "Explain", "m": 2, "ht": true, "q": "Write the <b>half equation<\/b> for hydrogen ions at the cathode.", "a": ["<b>2H<sup>+<\/sup> + 2e<sup>-<\/sup> → H<sub>2<\/sub><\/b> (1)", "Hydrogen ions <b>gain electrons<\/b>, so this is <b>reduction<\/b> (1)"], "cp": ["2H<sup>+<\/sup> + 2e<sup>-<\/sup> → H<sub>2<\/sub>", "Hydrogen ions gain electrons, so this is reduction"], "dp": ["H<sub>2<\/sub> → 2H<sup>+<\/sup> + 2e<sup>-<\/sup>", "2H<sup>+<\/sup> → H<sub>2<\/sub> + 2e<sup>-<\/sup>", "H<sup>+<\/sup> + e<sup>-<\/sup> → H<sub>2<\/sub>"], "mand": 0}, {"id": "CHE-04-H09", "t": 4, "s": "4.4.3.5", "k": "Explain", "m": 2, "ht": true, "q": "Write the <b>half equation<\/b> for chloride ions at the anode.", "a": ["<b>2Cl<sup>-<\/sup> → Cl<sub>2<\/sub> + 2e<sup>-<\/sup><\/b> (1)", "Chloride ions <b>lose electrons<\/b>, so this is <b>oxidation<\/b> (1)"], "cp": ["2Cl<sup>-<\/sup> → Cl<sub>2<\/sub> + 2e<sup>-<\/sup>", "Chloride ions lose electrons, so this is oxidation"], "dp": ["Cl<sub>2<\/sub> + 2e<sup>-<\/sup> → 2Cl<sup>-<\/sup>", "2Cl<sup>-<\/sup> + 2e<sup>-<\/sup> → Cl<sub>2<\/sub>", "Cl<sup>-<\/sup> → Cl + e<sup>+<\/sup>"], "mand": 0}, {"id": "CHE-04-H10", "t": 4, "s": "4.4.3.5", "k": "Explain", "m": 2, "ht": true, "q": "Write the half equation for <b>hydroxide ions<\/b> at the anode making oxygen and water.", "a": ["<b>4OH<sup>-<\/sup> → O<sub>2<\/sub> + 2H<sub>2<\/sub>O + 4e<sup>-<\/sup><\/b> (1)", "Electrons are <b>lost<\/b>, so the hydroxide ions are <b>oxidised<\/b> (1)"], "cp": ["4OH<sup>-<\/sup> → O<sub>2<\/sub> + 2H<sub>2<\/sub>O + 4e<sup>-<\/sup>", "Electrons are lost, so the hydroxide ions are oxidised"], "dp": ["4OH<sup>-<\/sup> + 4e<sup>-<\/sup> → O<sub>2<\/sub> + 2H<sub>2<\/sub>O", "2OH<sup>-<\/sup> → O<sub>2<\/sub> + H<sub>2<\/sub>O + 2e<sup>-<\/sup>", "OH<sup>-<\/sup> → OH + e<sup>+<\/sup>"], "mand": 0}, {"id": "CHE-05-001", "t": 5, "s": "4.5.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>exothermic<\/b> reaction? What happens to the temperature of the surroundings?", "a": ["A reaction that <b>transfers energy to the surroundings<\/b> (1)", "The temperature of the surroundings <b>rises<\/b> (1)"], "cp": ["A reaction that transfers energy to the surroundings", "The temperature of the surroundings rises"], "dp": ["A reaction that takes in energy from the surroundings", "The temperature of the surroundings falls", "A reaction that does not change temperature"], "mand": 0}, {"id": "CHE-05-002", "t": 5, "s": "4.5.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>endothermic<\/b> reaction? What happens to the temperature of the surroundings?", "a": ["A reaction that <b>takes in energy from the surroundings<\/b> (1)", "The temperature of the surroundings <b>falls<\/b> (1)"], "cp": ["A reaction that takes in energy from the surroundings", "The temperature of the surroundings falls"], "dp": ["A reaction that releases energy to the surroundings", "The temperature of the surroundings rises", "A reaction that is always slow"], "mand": 0}, {"id": "CHE-05-003", "t": 5, "s": "4.5.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> examples of exothermic reactions.", "a": ["Any three (1 each):", "• <b>combustion<\/b> (burning)", "• many <b>oxidation<\/b> reactions", "• <b>neutralisation<\/b>", "• <b>respiration<\/b>"], "cp": ["combustion (burning)", "many oxidation reactions", "neutralisation", "respiration"], "dp": ["Thermal decomposition", "Citric acid with sodium hydrogencarbonate", "Photosynthesis"], "mand": 0}, {"id": "CHE-05-004", "t": 5, "s": "4.5.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> examples of endothermic reactions.", "a": ["Any two (1 each):", "• <b>thermal decomposition<\/b>", "• <b>citric acid<\/b> reacting with <b>sodium hydrogencarbonate<\/b>", "• photosynthesis"], "cp": ["thermal decomposition", "citric acid reacting with sodium hydrogencarbonate", "photosynthesis"], "dp": ["Combustion", "Neutralisation", "Rusting of iron"], "mand": 0}, {"id": "CHE-05-005", "t": 5, "s": "4.5.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Give one everyday use of an <b>exothermic<\/b> reaction and one of an <b>endothermic<\/b> reaction.", "a": ["Exothermic: <b>self-heating cans<\/b> or <b>hand warmers<\/b> (1)", "Endothermic: <b>sports injury cold packs<\/b> (1)"], "cp": ["Exothermic: self-heating cans or hand warmers", "Endothermic: sports injury cold packs"], "dp": ["Exothermic: cold packs", "Endothermic: hand warmers", "Exothermic: sports injury packs"], "mand": 0}, {"id": "CHE-05-006", "t": 5, "s": "4.5.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why are hand warmers based on an <b>exothermic<\/b> reaction but injury packs on an <b>endothermic<\/b> one?", "a": ["Hand warmers <b>release energy<\/b> as heat to warm hands (1)", "Injury packs <b>take in energy<\/b>, so cool the injury (1)"], "cp": ["Hand warmers release energy as heat to warm hands", "Injury packs take in energy, so cool the injury"], "dp": ["Both release energy as heat", "Hand warmers take in energy", "Injury packs release energy"], "mand": 0}, {"id": "CHE-05-007", "t": 5, "s": "4.5.1.1", "k": "Explain", "m": 1, "ht": false, "q": "Energy is conserved in a reaction. If energy is transferred to the surroundings, what is true about the products?", "a": ["The products have <b>less energy<\/b> than the reactants (1)"], "cp": ["The products have less energy than the reactants"], "dp": ["The products have more energy than the reactants", "Energy is created", "The products have the same energy as the reactants"], "mand": 0}, {"id": "CHE-05-008", "t": 5, "s": "4.5.1.1", "k": "Practical", "m": 5, "ht": false, "q": "Describe how to investigate the <b>temperature change<\/b> when different amounts of acid and alkali react.", "a": ["Use a <b>polystyrene cup<\/b> with a lid (1)", "Measure the acid and its <b>start temperature<\/b> (1)", "Add the alkali, <b>stir<\/b>, record the highest temperature (1)", "Calculate the <b>temperature change<\/b> (1)", "<b>Repeat<\/b>, keeping other variables the same (1)"], "cp": ["Use a polystyrene cup with a lid", "Measure the acid and its start temperature", "Add the alkali, stir, record the highest temperature", "Calculate the temperature change", "Repeat, keeping other variables the same"], "dp": ["Use a metal can without a lid", "Do not stir the mixture", "Measure only the final temperature"], "mand": 0}, {"id": "CHE-05-009", "t": 5, "s": "4.5.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why is a <b>polystyrene cup with a lid<\/b> used in energy change experiments?", "a": ["Polystyrene is a good <b>insulator<\/b> (1)", "so it reduces <b>energy lost<\/b> to the surroundings (1)"], "cp": ["Polystyrene is a good insulator", "so it reduces energy lost to the surroundings"], "dp": ["Polystyrene is a good conductor", "It makes the reaction faster", "It stops the reaction from starting"], "mand": 0}, {"id": "CHE-05-010", "t": 5, "s": "4.5.1.2", "k": "Definition", "m": 1, "ht": false, "q": "What is meant by <b>activation energy<\/b>?", "a": ["The <b>minimum energy<\/b> particles must have when they collide for a reaction to happen (1)"], "cp": ["The minimum energy particles must have when they collide for a reaction to happen"], "dp": ["The energy released in a reaction", "The total energy of the reactants", "The energy needed to melt a substance"], "mand": 0}, {"id": "CHE-05-011", "t": 5, "s": "4.5.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Describe the <b>reaction profile<\/b> of an exothermic reaction.", "a": ["<b>Reactants<\/b> start higher than the <b>products<\/b> (1)", "The curve rises to a peak showing the <b>activation energy<\/b> (1)", "The overall energy change is the drop from reactants to products (energy released) (1)"], "cp": ["Reactants start higher than the products", "The curve rises to a peak showing the activation energy", "The overall energy change is the drop from reactants to products (energy released)"], "dp": ["The products are higher than the reactants", "The curve is a straight line", "There is no activation energy"], "mand": 0}, {"id": "CHE-05-012", "t": 5, "s": "4.5.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Describe the <b>reaction profile<\/b> of an endothermic reaction.", "a": ["<b>Products<\/b> end higher than the <b>reactants<\/b> (1)", "A curve with a peak showing the <b>activation energy<\/b> (1)", "The overall energy change is the <b>rise<\/b> from reactants to products (energy taken in) (1)"], "cp": ["Products end higher than the reactants", "A curve with a peak showing the activation energy", "The overall energy change is the rise from reactants to products (energy taken in)"], "dp": ["The products are lower than the reactants", "There is no peak", "Reactants and products are at the same level"], "mand": 0}, {"id": "CHE-05-013", "t": 5, "s": "4.5.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how a reaction profile shows if a reaction is <b>exothermic or endothermic<\/b>.", "a": ["Compare the energy of <b>products<\/b> with <b>reactants<\/b> (1)", "Products lower = exothermic, products higher = endothermic (1)"], "cp": ["Compare the energy of products with reactants", "Products lower = exothermic, products higher = endothermic"], "dp": ["Look at the height of the peak only", "Products higher = exothermic", "Count the steps in the curve"], "mand": 0}, {"id": "CHE-05-014", "t": 5, "s": "4.5.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>simple chemical cell<\/b>?", "a": ["Two <b>different metals<\/b> (electrodes) (1)", "in contact with an <b>electrolyte<\/b>, which produces a voltage (1)"], "cp": ["Two different metals (electrodes)", "in contact with an electrolyte, which produces a voltage"], "dp": ["Two identical metals in water", "A metal in a vacuum", "Two non-metals in a solid"], "mand": 0}, {"id": "CHE-05-015", "t": 5, "s": "4.5.2.1", "k": "Explain", "m": 2, "ht": false, "q": "What <b>two factors<\/b> affect the voltage of a simple cell?", "a": ["The <b>difference in reactivity<\/b> of the two metals (1)", "The type of <b>electrolyte<\/b> (1)"], "cp": ["The difference in reactivity of the two metals", "The type of electrolyte"], "dp": ["The size of the beaker", "The colour of the electrolyte", "The length of the wires"], "mand": 0}, {"id": "CHE-05-016", "t": 5, "s": "4.5.2.1", "k": "Explain", "m": 1, "ht": false, "q": "A cell is made with magnesium and copper, and another with zinc and copper. Which gives the <b>bigger voltage<\/b>?", "a": ["The <b>magnesium and copper<\/b> cell, as the metals are <b>further apart<\/b> in reactivity (1)"], "cp": ["The magnesium and copper cell, as the metals are further apart in reactivity"], "dp": ["Zinc and copper as zinc is more reactive", "They give the same voltage", "Zinc and copper as they are closer in reactivity"], "mand": 0}, {"id": "CHE-05-017", "t": 5, "s": "4.5.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>battery<\/b>? How is it different from a single cell?", "a": ["Two or more cells <b>connected in series<\/b> (1)", "which gives a <b>bigger voltage<\/b> (1)"], "cp": ["Two or more cells connected in series", "which gives a bigger voltage"], "dp": ["A single cell with a large electrode", "Cells connected so the voltage stays the same", "A cell that is rechargeable"], "mand": 0}, {"id": "CHE-05-018", "t": 5, "s": "4.5.2.1", "k": "Compare", "m": 2, "ht": false, "q": "Give <b>one difference<\/b> between a rechargeable and a non-rechargeable cell.", "a": ["Non-rechargeable: reactions <b>stop when a reactant is used up<\/b> (1)", "Rechargeable: the reactions can be <b>reversed<\/b> using an external electric current (1)"], "cp": ["Non-rechargeable: reactions stop when a reactant is used up", "Rechargeable: the reactions can be reversed using an external electric current"], "dp": ["Rechargeable cells never run out", "Non-rechargeable cells can be reversed", "Rechargeable cells have no chemical reactions"], "mand": 0}, {"id": "CHE-05-019", "t": 5, "s": "4.5.2.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>fuel cell<\/b>? Name the <b>fuel<\/b> and the <b>product<\/b> in a hydrogen fuel cell.", "a": ["Supplied with a <b>fuel<\/b> and oxygen to make a voltage (the fuel is oxidised) (1)", "Hydrogen is the fuel and <b>water<\/b> is the only product (1)"], "cp": ["Supplied with a fuel and oxygen to make a voltage (the fuel is oxidised)", "Hydrogen is the fuel and water is the only product"], "dp": ["A cell that stores electricity", "Hydrogen is oxidised to make carbon dioxide", "A cell that must be recharged"], "mand": 0}, {"id": "CHE-05-020", "t": 5, "s": "4.5.2.2", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>three<\/b> advantages of a hydrogen fuel cell compared with a rechargeable battery.", "a": ["Any three (1 each):", "• the only product is <b>water<\/b>, so no polluting gases", "• can run <b>continuously<\/b> while fuel is supplied", "• no need to <b>recharge<\/b>", "• lighter for the same power", "• no toxic metals to dispose of"], "cp": ["the only product is water, so no polluting gases", "can run continuously while fuel is supplied", "no need to recharge", "lighter for the same power", "no toxic metals to dispose of"], "dp": ["Hydrogen is easy to store", "Hydrogen is a very safe gas", "Fuel cells are cheaper to make"], "mand": 0}, {"id": "CHE-05-021", "t": 5, "s": "4.5.2.2", "k": "Evaluate", "m": 2, "ht": false, "q": "Give <b>two disadvantages<\/b> of hydrogen fuel cells.", "a": ["Any two (1 each):", "• hydrogen is <b>flammable<\/b> and hard to <b>store<\/b> (a gas)", "• hydrogen has to be <b>made<\/b> using energy (often from fossil fuels)", "• <b>few<\/b> filling stations", "• can be <b>expensive<\/b> to make"], "cp": ["hydrogen is flammable and hard to store (a gas)", "hydrogen has to be made using energy (often from fossil fuels)", "few filling stations", "can be expensive to make"], "dp": ["They produce carbon dioxide", "They have a short life", "They produce toxic metal waste"], "mand": 0}, {"id": "CHE-05-022", "t": 5, "s": "4.5.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Write the <b>overall reaction<\/b> in a hydrogen fuel cell.", "a": ["hydrogen + oxygen → <b>water<\/b> (1)", "<b>2H<sub>2<\/sub> + O<sub>2<\/sub> → 2H<sub>2<\/sub>O<\/b> (1)"], "cp": ["hydrogen + oxygen → water", "2H<sub>2<\/sub> + O<sub>2<\/sub> → 2H<sub>2<\/sub>O"], "dp": ["hydrogen + oxygen → hydrogen peroxide", "H<sub>2<\/sub> + O<sub>2<\/sub> → H<sub>2<\/sub>O<sub>2<\/sub>", "2H<sub>2<\/sub>O → 2H<sub>2<\/sub> + O<sub>2<\/sub>"], "mand": 0}, {"id": "CHE-05-H01", "t": 5, "s": "4.5.1.3", "k": "Explain", "m": 2, "ht": true, "q": "Explain in terms of <b>bonds<\/b> why reactions can be exothermic or endothermic.", "a": ["<b>Breaking bonds<\/b> takes in energy (endothermic) and <b>making bonds<\/b> releases energy (exothermic) (1)", "Exothermic: more energy is released making new bonds than is needed to break old bonds (1)"], "cp": ["Breaking bonds takes in energy (endothermic) and making bonds releases energy (exothermic)", "Exothermic: more energy is released making new bonds than is needed to break old bonds"], "dp": ["Making bonds takes in energy", "Breaking bonds releases energy", "Energy is only needed to make bonds"], "mand": 0}, {"id": "CHE-05-H02", "t": 5, "s": "4.5.1.3", "k": "Calculation", "m": 4, "ht": true, "q": "Hydrogen reacts with chlorine: H–H + Cl–Cl → 2 H–Cl.<br/>Bond energies (kJ/mol): H–H = 436, Cl–Cl = 243, H–Cl = 432.<br/><br/>Calculate the overall energy change.", "a": ["Energy to break bonds = 436 + 243 = <b>679<\/b> (1)", "Energy released making bonds = 2 × 432 = <b>864<\/b> (1)", "Overall = 679 - 864 (1)", "= <b>-185 kJ/mol<\/b> (exothermic) (1)"], "cp": ["Energy to break bonds = 436 + 243 = 679", "Energy released making bonds = 2 × 432 = 864", "Overall = 679 - 864", "= -185 kJ/mol (exothermic)"], "dp": ["+185 kJ/mol", "-1543 kJ/mol", "+1543 kJ/mol"], "mand": 0}, {"id": "CHE-05-H03", "t": 5, "s": "4.5.1.3", "k": "Calculation", "m": 4, "ht": true, "q": "Methane burns: CH<sub>4<\/sub> + 2O<sub>2<\/sub> → CO<sub>2<\/sub> + 2H<sub>2<\/sub>O.<br/>Bond energies (kJ/mol): C–H 413, O=O 498, C=O 805, O–H 464.<br/><br/>Calculate the overall energy change.", "a": ["Bonds broken: 4 × 413 + 2 × 498 = 1652 + 996 = <b>2648<\/b> (1)", "Bonds made: 2 × 805 + 4 × 464 = 1610 + 1856 = <b>3466<\/b> (1)", "Overall = 2648 - 3466 (1)", "= <b>-818 kJ/mol<\/b> (1)"], "cp": ["Bonds broken: 4 × 413 + 2 × 498 = 1652 + 996 = 2648", "Bonds made: 2 × 805 + 4 × 464 = 1610 + 1856 = 3466", "Overall = 2648 - 3466", "= -818 kJ/mol"], "dp": ["+818 kJ/mol", "-6114 kJ/mol", "+6114 kJ/mol"], "mand": 0}, {"id": "CHE-05-H04", "t": 5, "s": "4.5.1.3", "k": "Explain", "m": 1, "ht": true, "q": "A reaction has overall energy change of +120 kJ/mol. Is it exothermic or endothermic?", "a": ["<b>Endothermic<\/b>, because the overall energy change is positive (1)"], "cp": ["Endothermic, because the overall energy change is positive"], "dp": ["Exothermic because the value is positive", "Exothermic because energy is released", "Neither as the change is small"], "mand": 0}, {"id": "CHE-05-H05", "t": 5, "s": "4.5.2.2", "k": "Explain", "m": 2, "ht": true, "q": "Write the half equations for a hydrogen fuel cell in <b>alkaline<\/b> solution.", "a": ["Anode: <b>2H<sub>2<\/sub> + 4OH<sup>-<\/sup> → 4H<sub>2<\/sub>O + 4e<sup>-<\/sup><\/b> (1)", "Cathode: <b>O<sub>2<\/sub> + 2H<sub>2<\/sub>O + 4e<sup>-<\/sup> → 4OH<sup>-<\/sup><\/b> (1)"], "cp": ["Anode: 2H<sub>2<\/sub> + 4OH<sup>-<\/sup> → 4H<sub>2<\/sub>O + 4e<sup>-<\/sup>", "Cathode: O<sub>2<\/sub> + 2H<sub>2<\/sub>O + 4e<sup>-<\/sup> → 4OH<sup>-<\/sup>"], "dp": ["2H<sub>2<\/sub> → 4H<sup>+<\/sup> + 4e<sup>-<\/sup> at the cathode", "O<sub>2<\/sub> + 4e<sup>-<\/sup> → 2O<sup>2-<\/sup> at the anode", "2H<sub>2<\/sub>O → 2H<sub>2<\/sub> + O<sub>2<\/sub>"], "mand": 0}, {"id": "CHE-06-001", "t": 6, "s": "4.6.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Write the equation for <b>mean rate of reaction<\/b> and give the units.", "a": ["mean rate = <b>quantity of product formed (or reactant used) ÷ time taken<\/b> (1)", "Units such as <b>g/s<\/b> or <b>cm<sup>3<\/sup>/s<\/b> (1)"], "cp": ["mean rate = quantity of product formed (or reactant used) ÷ time taken", "Units such as g/s or cm<sup>3<\/sup>/s"], "dp": ["rate = time ÷ quantity", "rate = quantity × time", "Units of mol/dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-06-002", "t": 6, "s": "4.6.1.1", "k": "Calculation", "m": 2, "ht": false, "q": "60 cm<sup>3<\/sup> of gas is made in 20 seconds.<br/><br/>Calculate the mean rate of reaction.", "a": ["60 ÷ 20 (1)", "= <b>3 cm<sup>3<\/sup>/s<\/b> (1)"], "cp": ["60 ÷ 20", "= 3 cm<sup>3<\/sup>/s"], "dp": ["0.33 cm<sup>3<\/sup>/s", "1200 cm<sup>3<\/sup>/s", "80 cm<sup>3<\/sup>/s"], "mand": 0}, {"id": "CHE-06-003", "t": 6, "s": "4.6.1.1", "k": "Calculation", "m": 2, "ht": false, "q": "2.4 g of magnesium is used up in 40 seconds.<br/><br/>Calculate the mean rate of reaction in g/s.", "a": ["2.4 ÷ 40 (1)", "= <b>0.06 g/s<\/b> (1)"], "cp": ["2.4 ÷ 40", "= 0.06 g/s"], "dp": ["16.7 g/s", "0.6 g/s", "96 g/s"], "mand": 0}, {"id": "CHE-06-004", "t": 6, "s": "4.6.1.1", "k": "Data", "m": 3, "ht": false, "q": "A graph shows <b>volume of gas against time<\/b>. The line starts steep, then flattens. What does each part show?", "a": ["A <b>steep<\/b> line means a <b>fast<\/b> rate (1)", "The line getting <b>less steep<\/b> means the rate is <b>slowing<\/b> (reactants used up) (1)", "A <b>flat<\/b> line means the reaction has <b>finished<\/b> (1)"], "cp": ["A steep line means a fast rate", "The line getting less steep means the rate is slowing (reactants used up)", "A flat line means the reaction has finished"], "dp": ["A flat line means the fastest rate", "A steep line means the reaction is slow", "The line flattens because the temperature drops"], "mand": 0}, {"id": "CHE-06-005", "t": 6, "s": "4.6.1.1", "k": "Data", "m": 3, "ht": false, "q": "Describe how to find the <b>rate at a particular time<\/b> from a graph of quantity against time.", "a": ["Draw a <b>tangent<\/b> to the curve at that time (1)", "Find the <b>gradient<\/b> of the tangent: change in y ÷ change in x (1)", "The gradient is the <b>rate<\/b> at that time (1)"], "cp": ["Draw a tangent to the curve at that time", "Find the gradient of the tangent: change in y ÷ change in x", "The gradient is the rate at that time"], "dp": ["Read the value on the y axis at that time", "Find the area under the curve", "Join the start and end of the line"], "mand": 0}, {"id": "CHE-06-006", "t": 6, "s": "4.6.1.2", "k": "Recall", "m": 5, "ht": false, "q": "Name <b>five factors<\/b> that change the rate of a reaction.", "a": ["<b>Temperature<\/b> (1)", "<b>Concentration<\/b> of reactants in solution (1)", "<b>Pressure<\/b> of reacting gases (1)", "<b>Surface area<\/b> of solid reactants (1)", "Use of a <b>catalyst<\/b> (1)"], "cp": ["Temperature", "Concentration of reactants in solution", "Pressure of reacting gases", "Surface area of solid reactants", "Use of a catalyst"], "dp": ["The colour of the reactants", "The mass of the container", "The volume of the room"], "mand": 0}, {"id": "CHE-06-007", "t": 6, "s": "4.6.1.3", "k": "Definition", "m": 1, "ht": false, "q": "What does <b>collision theory<\/b> say must happen for a reaction to occur?", "a": ["Particles must <b>collide<\/b> with <b>enough energy<\/b> (at least the activation energy) (1)"], "cp": ["Particles must collide with enough energy (at least the activation energy)"], "dp": ["Particles must collide with any energy", "Particles must be heated until they melt", "Particles must be very close but not touching"], "mand": 0}, {"id": "CHE-06-008", "t": 6, "s": "4.6.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain why <b>increasing the concentration<\/b> speeds up a reaction.", "a": ["There are <b>more particles<\/b> in the same volume (1)", "so <b>more frequent collisions<\/b> (1)"], "cp": ["There are more particles in the same volume", "so more frequent collisions"], "dp": ["The particles move faster", "The particles have more energy", "The activation energy is lower"], "mand": 0}, {"id": "CHE-06-009", "t": 6, "s": "4.6.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain why <b>increasing the pressure<\/b> of a reacting gas speeds up the reaction.", "a": ["The gas particles are <b>closer together<\/b> (1)", "so there are <b>more frequent collisions<\/b> (1)"], "cp": ["The gas particles are closer together", "so there are more frequent collisions"], "dp": ["The particles have more energy", "The activation energy falls", "The gas particles get smaller"], "mand": 0}, {"id": "CHE-06-010", "t": 6, "s": "4.6.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>increasing the temperature<\/b> speeds up a reaction.", "a": ["Particles move <b>faster<\/b> (1)", "so collide <b>more frequently<\/b> (1)", "and a greater proportion of collisions have <b>enough energy<\/b> (more energetic collisions) (1)"], "cp": ["Particles move faster", "so collide more frequently", "and a greater proportion of collisions have enough energy (more energetic collisions)"], "dp": ["The activation energy is lowered", "There are more particles", "The particles get bigger"], "mand": 0}, {"id": "CHE-06-011", "t": 6, "s": "4.6.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>powdered<\/b> calcium carbonate reacts faster with acid than <b>marble chips<\/b>.", "a": ["The powder has a <b>larger surface area<\/b> compared with its volume (1)", "so more particles are <b>exposed<\/b> to the acid (1)", "so <b>more frequent collisions<\/b> (1)"], "cp": ["The powder has a larger surface area compared with its volume", "so more particles are exposed to the acid", "so more frequent collisions"], "dp": ["The powder has a smaller surface area", "The powder has a higher concentration", "The activation energy is lower for powder"], "mand": 0}, {"id": "CHE-06-012", "t": 6, "s": "4.6.1.3", "k": "Calculation", "m": 2, "ht": false, "q": "A cube has sides of 2 cm. Calculate its <b>surface area to volume ratio<\/b>.", "a": ["Surface area = 6 × 2 × 2 = 24 cm<sup>2<\/sup>; volume = 2 × 2 × 2 = 8 cm<sup>3<\/sup> (1)", "24 ÷ 8 = <b>3 : 1<\/b> (1)"], "cp": ["Surface area = 6 × 2 × 2 = 24 cm<sup>2<\/sup>; volume = 2 × 2 × 2 = 8 cm<sup>3<\/sup>", "24 ÷ 8 = 3 : 1"], "dp": ["4 : 1", "12 : 1", "6 : 1"], "mand": 0}, {"id": "CHE-06-013", "t": 6, "s": "4.6.1.4", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>catalyst<\/b>? What is an <b>enzyme<\/b>?", "a": ["A substance that <b>speeds up<\/b> a reaction without being <b>used up<\/b> (1)", "An enzyme is a <b>biological catalyst<\/b> (1)"], "cp": ["A substance that speeds up a reaction without being used up", "An enzyme is a biological catalyst"], "dp": ["A substance that slows down a reaction", "A substance used up in a reaction", "An enzyme is a metal catalyst"], "mand": 0}, {"id": "CHE-06-014", "t": 6, "s": "4.6.1.4", "k": "Explain", "m": 2, "ht": false, "q": "Explain how a catalyst works in terms of <b>activation energy<\/b>.", "a": ["It provides an <b>alternative pathway<\/b> (1)", "with a <b>lower activation energy<\/b> (1)"], "cp": ["It provides an alternative pathway", "with a lower activation energy"], "dp": ["It raises the activation energy", "It gives the particles more energy", "It increases the temperature"], "mand": 0}, {"id": "CHE-06-015", "t": 6, "s": "4.6.1.4", "k": "Data", "m": 2, "ht": false, "q": "How does the <b>reaction profile<\/b> of a catalysed reaction differ from the uncatalysed one?", "a": ["The <b>peak<\/b> (activation energy) is <b>lower<\/b> (1)", "The energy of the reactants and products is <b>the same<\/b> (1)"], "cp": ["The peak (activation energy) is lower", "The energy of the reactants and products is the same"], "dp": ["The peak is higher", "The products are at a different energy", "The curve has no peak"], "mand": 0}, {"id": "CHE-06-016", "t": 6, "s": "4.6.1.4", "k": "Explain", "m": 2, "ht": false, "q": "How can you tell from a <b>chemical equation<\/b> that a substance is a catalyst?", "a": ["It is <b>not in the equation<\/b> (not used up) (1)", "It is the same chemical <b>before and after<\/b> (1)"], "cp": ["It is not in the equation (not used up)", "It is the same chemical before and after"], "dp": ["It is on both sides in different amounts", "It is the first reactant", "It is always a metal"], "mand": 0}, {"id": "CHE-06-017", "t": 6, "s": "4.6.1.2", "k": "Practical", "m": 5, "ht": false, "q": "Describe an investigation of how <b>concentration<\/b> affects the rate of reaction of sodium thiosulfate with hydrochloric acid.", "a": ["Mark a <b>cross<\/b> on paper under a flask (1)", "Add measured <b>thiosulfate<\/b> and acid (1)", "<b>Time<\/b> until the cross <b>disappears<\/b> (1)", "Repeat with <b>different concentrations<\/b> (1)", "Keep <b>temperature<\/b> and volumes the same (1)"], "cp": ["Mark a cross on paper under a flask", "Add measured thiosulfate and acid", "Time until the cross disappears", "Repeat with different concentrations", "Keep temperature and volumes the same"], "dp": ["Measure the colour of the acid", "Use different temperatures each time", "Time until the solution boils"], "mand": 0}, {"id": "CHE-06-018", "t": 6, "s": "4.6.1.2", "k": "Practical", "m": 4, "ht": false, "q": "Describe how to measure the <b>volume of gas<\/b> made when magnesium reacts with acid of different concentrations.", "a": ["Use a <b>gas syringe<\/b> (or upturned measuring cylinder) to collect the gas (1)", "Add a measured amount of <b>magnesium<\/b> to a measured volume of acid (1)", "Record the <b>volume at regular time intervals<\/b> (1)", "Repeat with different <b>concentrations<\/b> keeping other variables the same (1)"], "cp": ["Use a gas syringe (or upturned measuring cylinder) to collect the gas", "Add a measured amount of magnesium to a measured volume of acid", "Record the volume at regular time intervals", "Repeat with different concentrations keeping other variables the same"], "dp": ["Weigh the gas in a balloon", "Use a thermometer", "Use litmus paper"], "mand": 0}, {"id": "CHE-06-019", "t": 6, "s": "4.6.1.2", "k": "Explain", "m": 1, "ht": false, "q": "Give <b>one<\/b> reason why a reaction in a flask that makes a gas might <b>lose mass<\/b> in a mass-loss experiment.", "a": ["The <b>gas escapes<\/b> from the flask (cotton wool plug stops spray) (1)"], "cp": ["The gas escapes from the flask (cotton wool plug stops spray)"], "dp": ["The acid evaporates completely", "Atoms are destroyed", "The magnesium becomes lighter"], "mand": 0}, {"id": "CHE-06-020", "t": 6, "s": "4.6.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>reversible reaction<\/b>? Show how it is written.", "a": ["A reaction where the <b>products can react to form the reactants again<\/b> (1)", "Written with a double arrow <b>⇌<\/b> (1)"], "cp": ["A reaction where the products can react to form the reactants again", "Written with a double arrow ⇌"], "dp": ["A reaction that happens twice", "A reaction that goes in one direction only", "Written with an equals sign"], "mand": 0}, {"id": "CHE-06-021", "t": 6, "s": "4.6.2.2", "k": "Explain", "m": 2, "ht": false, "q": "A reversible reaction is exothermic in the forward direction. What about the <b>reverse<\/b> direction?", "a": ["The reverse reaction is <b>endothermic<\/b> (1)", "The <b>same amount of energy<\/b> is transferred in each direction (1)"], "cp": ["The reverse reaction is endothermic", "The same amount of energy is transferred in each direction"], "dp": ["The reverse reaction is also exothermic", "The reverse takes in more energy", "The reverse releases less energy"], "mand": 0}, {"id": "CHE-06-022", "t": 6, "s": "4.6.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Hydrated copper sulfate is heated. What colour change is seen, and is it reversible?", "a": ["Blue changes to <b>white<\/b> (anhydrous copper sulfate) (1)", "Adding water makes it <b>blue again<\/b> (reversible) (1)"], "cp": ["Blue changes to white (anhydrous copper sulfate)", "Adding water makes it blue again (reversible)"], "dp": ["White changes to blue when heated", "It changes to black", "The change cannot be reversed"], "mand": 0}, {"id": "CHE-06-023", "t": 6, "s": "4.6.2.3", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>dynamic equilibrium<\/b>?", "a": ["The <b>forward and reverse reactions<\/b> happen at the <b>same rate<\/b> (1)", "in a <b>closed system<\/b>, so concentrations stay constant (1)"], "cp": ["The forward and reverse reactions happen at the same rate", "in a closed system, so concentrations stay constant"], "dp": ["The reactions have stopped", "Only the forward reaction happens", "The concentrations are equal"], "mand": 0}, {"id": "CHE-06-024", "t": 6, "s": "4.6.2.3", "k": "Explain", "m": 1, "ht": false, "q": "Why must a reversible reaction be in a <b>closed system<\/b> to reach equilibrium?", "a": ["So that <b>no reactants or products can escape<\/b> (1)"], "cp": ["So that no reactants or products can escape"], "dp": ["So the temperature rises", "So the reaction can be reversed only", "So a catalyst is not needed"], "mand": 0}, {"id": "CHE-06-H01", "t": 6, "s": "4.6.1.1", "k": "Calculation", "m": 2, "ht": true, "q": "The rate of a reaction is 0.05 mol/s. How many <b>moles<\/b> react in 3 minutes?", "a": ["3 minutes = 180 s (1)", "0.05 × 180 = <b>9 mol<\/b> (1)"], "cp": ["3 minutes = 180 s", "0.05 × 180 = 9 mol"], "dp": ["0.15 mol", "3600 mol", "0.28 mol"], "mand": 0}, {"id": "CHE-06-H02", "t": 6, "s": "4.6.2.4", "k": "Definition", "m": 2, "ht": true, "q": "State <b>Le Chatelier's principle<\/b>.", "a": ["If a change is made to a system at equilibrium, the system <b>moves to counteract<\/b> the change (1)", "This shifts the <b>position of equilibrium<\/b> (more products or more reactants) (1)"], "cp": ["If a change is made to a system at equilibrium, the system moves to counteract the change", "This shifts the position of equilibrium (more products or more reactants)"], "dp": ["The system ignores any changes", "The equilibrium stops when conditions change", "The rate always increases"], "mand": 0}, {"id": "CHE-06-H03", "t": 6, "s": "4.6.2.5", "k": "Explain", "m": 2, "ht": true, "q": "What happens to the position of equilibrium if the <b>concentration of a reactant is increased<\/b>?", "a": ["The equilibrium shifts to the <b>right<\/b> (1)", "so <b>more products<\/b> are formed to use up the extra reactant (1)"], "cp": ["The equilibrium shifts to the right", "so more products are formed to use up the extra reactant"], "dp": ["It shifts to the left", "It does not change", "More reactants are formed"], "mand": 0}, {"id": "CHE-06-H04", "t": 6, "s": "4.6.2.5", "k": "Explain", "m": 1, "ht": true, "q": "What happens if some of the <b>product is removed<\/b>?", "a": ["More reactants react to make more product (equilibrium shifts <b>right<\/b>) (1)"], "cp": ["More reactants react to make more product (equilibrium shifts right)"], "dp": ["The equilibrium shifts left", "Nothing changes", "The reaction stops"], "mand": 0}, {"id": "CHE-06-H05", "t": 6, "s": "4.6.2.6", "k": "Explain", "m": 3, "ht": true, "q": "A reaction is <b>exothermic<\/b> in the forward direction. What is the effect of <b>raising the temperature<\/b>?", "a": ["The equilibrium shifts to the <b>left<\/b> (the endothermic direction) (1)", "The yield of <b>products decreases<\/b> (1)", "The system counteracts the rise by taking in energy (1)"], "cp": ["The equilibrium shifts to the left (the endothermic direction)", "The yield of products decreases", "The system counteracts the rise by taking in energy"], "dp": ["The equilibrium shifts right", "The yield of products increases", "Nothing changes"], "mand": 0}, {"id": "CHE-06-H06", "t": 6, "s": "4.6.2.6", "k": "Explain", "m": 2, "ht": true, "q": "A reaction is <b>endothermic<\/b> in the forward direction. What happens to the yield if the temperature is <b>decreased<\/b>?", "a": ["The equilibrium shifts <b>left<\/b> (the exothermic direction) (1)", "so the yield of <b>products decreases<\/b> (1)"], "cp": ["The equilibrium shifts left (the exothermic direction)", "so the yield of products decreases"], "dp": ["The yield of products increases", "The equilibrium shifts right", "The rate becomes zero"], "mand": 0}, {"id": "CHE-06-H07", "t": 6, "s": "4.6.2.7", "k": "Explain", "m": 3, "ht": true, "q": "N<sub>2<\/sub> + 3H<sub>2<\/sub> ⇌ 2NH<sub>3<\/sub>.<br/><br/>What is the effect of <b>increasing the pressure<\/b> on the position of equilibrium?", "a": ["There are <b>4 molecules<\/b> on the left and <b>2 molecules<\/b> on the right (1)", "Higher pressure shifts equilibrium to the side with <b>fewer molecules<\/b> (1)", "so it shifts <b>right<\/b>, giving more ammonia (1)"], "cp": ["There are 4 molecules on the left and 2 molecules on the right", "Higher pressure shifts equilibrium to the side with fewer molecules", "so it shifts right, giving more ammonia"], "dp": ["The equilibrium shifts left", "It does not change as the temperature is constant", "It shifts to the side with more molecules"], "mand": 0}, {"id": "CHE-06-H08", "t": 6, "s": "4.6.2.7", "k": "Explain", "m": 1, "ht": true, "q": "What happens to the position of equilibrium if the pressure is lowered?", "a": ["It shifts to the side with <b>more molecules<\/b> (1)"], "cp": ["It shifts to the side with more molecules"], "dp": ["It shifts to the side with fewer molecules", "It does not change", "The reaction stops"], "mand": 0}, {"id": "CHE-07-001", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 2, "ht": false, "q": "What is <b>crude oil<\/b>? How did it form?", "a": ["A <b>mixture<\/b> of many hydrocarbons (1)", "Formed from the remains of <b>ancient plankton<\/b> buried in mud over millions of years (1)"], "cp": ["A mixture of many hydrocarbons", "Formed from the remains of ancient plankton buried in mud over millions of years"], "dp": ["A pure compound of carbon and hydrogen", "Formed from dinosaur bones", "A renewable resource"], "mand": 0}, {"id": "CHE-07-002", "t": 7, "s": "4.7.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>hydrocarbon<\/b>? Give the general formula of the alkanes.", "a": ["A compound made of <b>hydrogen and carbon only<\/b> (1)", "Alkanes: <b>C<sub>n<\/sub>H<sub>2n+2<\/sub><\/b> (1)"], "cp": ["A compound made of hydrogen and carbon only", "Alkanes: C<sub>n<\/sub>H<sub>2n+2<\/sub>"], "dp": ["A compound containing carbon and oxygen", "C<sub>n<\/sub>H<sub>2n<\/sub>", "C<sub>n<\/sub>H<sub>n<\/sub>"], "mand": 0}, {"id": "CHE-07-003", "t": 7, "s": "4.7.1.1", "k": "Recall", "m": 4, "ht": false, "q": "Name the first <b>four alkanes<\/b>.", "a": ["<b>Methane<\/b> (1)", "<b>Ethane<\/b> (1)", "<b>Propane<\/b> (1)", "<b>Butane<\/b> (1)"], "cp": ["Methane", "Ethane", "Propane", "Butane"], "dp": ["Ethene", "Propene", "Butene"], "mand": 0}, {"id": "CHE-07-004", "t": 7, "s": "4.7.1.1", "k": "Calculation", "m": 1, "ht": false, "q": "An alkane has 6 carbon atoms. Use C<sub>n<\/sub>H<sub>2n+2<\/sub> to give its formula.", "a": ["<b>C<sub>6<\/sub>H<sub>14<\/sub><\/b> (1)"], "cp": ["C<sub>6<\/sub>H<sub>14<\/sub>"], "dp": ["C<sub>6<\/sub>H<sub>12<\/sub>", "C<sub>6<\/sub>H<sub>6<\/sub>", "C<sub>6<\/sub>H<sub>16<\/sub>"], "mand": 0}, {"id": "CHE-07-005", "t": 7, "s": "4.7.1.2", "k": "Explain", "m": 4, "ht": false, "q": "Explain how <b>fractional distillation<\/b> separates crude oil.", "a": ["Crude oil is <b>heated<\/b> so it evaporates (1)", "The vapours enter a <b>column<\/b> that is hot at the bottom and cooler at the top (1)", "Hydrocarbons <b>condense<\/b> at their boiling points (1)", "Small molecules with <b>low boiling points<\/b> rise to the top; large molecules with high boiling points stay near the bottom (1)"], "cp": ["Crude oil is heated so it evaporates", "The vapours enter a column that is hot at the bottom and cooler at the top", "Hydrocarbons condense at their boiling points", "Small molecules with low boiling points rise to the top; large molecules with high boiling points stay near the bottom"], "dp": ["The oil is filtered through different sized holes", "Large molecules reach the top", "The column is cold at the bottom and hot at the top"], "mand": 0}, {"id": "CHE-07-006", "t": 7, "s": "4.7.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> uses of the products of crude oil.", "a": ["Any three (1 each):", "• <b>fuels<\/b> (petrol, diesel, kerosene, LPG)", "• <b>solvents<\/b>", "• <b>lubricants<\/b>", "• <b>polymers<\/b> (plastics)", "• <b>detergents<\/b>"], "cp": ["fuels (petrol, diesel, kerosene, LPG)", "solvents", "lubricants", "polymers (plastics)", "detergents"], "dp": ["Making metals from ores", "Making fertilisers only", "Making glass"], "mand": 0}, {"id": "CHE-07-007", "t": 7, "s": "4.7.1.3", "k": "Recall", "m": 3, "ht": false, "q": "How do <b>boiling point<\/b>, <b>viscosity<\/b> and <b>flammability<\/b> change as the hydrocarbon molecules get <b>bigger<\/b>?", "a": ["Boiling point <b>increases<\/b> (1)", "Viscosity <b>increases<\/b> (more sticky, less runny) (1)", "Flammability <b>decreases<\/b> (harder to ignite) (1)"], "cp": ["Boiling point increases", "Viscosity increases (more sticky, less runny)", "Flammability decreases (harder to ignite)"], "dp": ["Boiling point decreases", "Viscosity decreases", "Flammability increases"], "mand": 0}, {"id": "CHE-07-008", "t": 7, "s": "4.7.1.3", "k": "Explain", "m": 1, "ht": false, "q": "Why is <b>petrol<\/b> easier to ignite than <b>bitumen<\/b>?", "a": ["Petrol has <b>smaller molecules<\/b>, which are <b>more flammable<\/b> (1)"], "cp": ["Petrol has smaller molecules, which are more flammable"], "dp": ["Petrol has larger molecules", "Bitumen is more volatile", "Petrol is more viscous"], "mand": 0}, {"id": "CHE-07-009", "t": 7, "s": "4.7.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Write the word equation for the <b>complete combustion<\/b> of a hydrocarbon.", "a": ["hydrocarbon + oxygen → <b>carbon dioxide<\/b> (1) + <b>water<\/b> (1)"], "cp": ["hydrocarbon + oxygen → carbon dioxide", "+ water"], "dp": ["hydrocarbon + oxygen → carbon monoxide + water", "hydrocarbon + oxygen → carbon + hydrogen", "hydrocarbon + oxygen → carbon dioxide + hydrogen"], "mand": 0}, {"id": "CHE-07-010", "t": 7, "s": "4.7.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Balance the equation for burning propane:<br/><br/>C<sub>3<\/sub>H<sub>8<\/sub> + O<sub>2<\/sub> → CO<sub>2<\/sub> + H<sub>2<\/sub>O", "a": ["<b>C<sub>3<\/sub>H<sub>8<\/sub> + 5O<sub>2<\/sub> → 3CO<sub>2<\/sub> + 4H<sub>2<\/sub>O<\/b> (1)", "Each side has <b>3 C, 8 H and 10 O<\/b> (1)"], "cp": ["C<sub>3<\/sub>H<sub>8<\/sub> + 5O<sub>2<\/sub> → 3CO<sub>2<\/sub> + 4H<sub>2<\/sub>O", "Each side has 3 C, 8 H and 10 O"], "dp": ["C<sub>3<\/sub>H<sub>8<\/sub> + 3O<sub>2<\/sub> → 3CO<sub>2<\/sub> + 4H<sub>2<\/sub>O", "C<sub>3<\/sub>H<sub>8<\/sub> + 5O<sub>2<\/sub> → 3CO<sub>2<\/sub> + 8H<sub>2<\/sub>O", "C<sub>3<\/sub>H<sub>8<\/sub> + O<sub>2<\/sub> → 3CO<sub>2<\/sub> + 4H<sub>2<\/sub>O"], "mand": 0}, {"id": "CHE-07-011", "t": 7, "s": "4.7.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain why combustion is an <b>oxidation<\/b> reaction.", "a": ["<b>Carbon and hydrogen<\/b> in the fuel react with oxygen (1)", "They <b>gain oxygen<\/b> (are oxidised) and <b>release energy<\/b> (1)"], "cp": ["Carbon and hydrogen in the fuel react with oxygen", "They gain oxygen (are oxidised) and release energy"], "dp": ["The fuel loses oxygen", "The fuel is reduced", "Oxygen is oxidised"], "mand": 0}, {"id": "CHE-07-012", "t": 7, "s": "4.7.1.4", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>cracking<\/b>? Why is it done?", "a": ["Breaking down <b>large hydrocarbons<\/b> into <b>smaller, more useful<\/b> molecules (1)", "Because there is <b>more demand<\/b> for small molecules (fuels and alkenes) than large ones (1)"], "cp": ["Breaking down large hydrocarbons into smaller, more useful molecules", "Because there is more demand for small molecules (fuels and alkenes) than large ones"], "dp": ["Joining small molecules into larger ones", "Separating crude oil by boiling point", "Burning hydrocarbons in oxygen"], "mand": 0}, {"id": "CHE-07-013", "t": 7, "s": "4.7.1.4", "k": "Recall", "m": 2, "ht": false, "q": "Describe <b>two methods<\/b> of cracking.", "a": ["<b>Catalytic cracking<\/b>: heated and passed over a hot <b>catalyst<\/b> (1)", "<b>Steam cracking<\/b>: heated with <b>steam<\/b> at a high temperature (1)"], "cp": ["Cataly
