<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayla Chemistry">
<meta name="theme-color" content="#0d1020">
<title>Kayla's Chemistry Lab | GCSE Higher revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#8b7bff;--accent2:#38d0f0;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/></svg></span><span>Chemistry Lab</span></button>
  <span class="pill">Kayla | Higher</span>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>
<script>
const DATA=[{"id": "CHE-01-001", "t": 1, "s": "4.1.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between an <b>element<\/b> and a <b>compound<\/b>?", "a": ["An element contains only <b>one type of atom<\/b> (1)", "A compound has <b>two or more elements chemically joined<\/b> in fixed proportions (1)"], "cp": ["An element contains only one type of atom", "A compound has two or more elements chemically joined in fixed proportions"], "dp": ["A compound contains only one type of atom", "An element is two or more substances just mixed together", "A compound can be separated by filtering"], "mand": 0}, {"id": "CHE-01-002", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>symbols<\/b> for sodium, potassium and calcium.", "a": ["Sodium = <b>Na<\/b> (1)", "Potassium = <b>K<\/b> (1)", "Calcium = <b>Ca<\/b> (1)"], "cp": ["Sodium = Na", "Potassium = K", "Calcium = Ca"], "dp": ["Sodium = S", "Potassium = P", "Calcium = C"], "mand": 0}, {"id": "CHE-01-003", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the compounds: <b>NaCl<\/b>, <b>CaCO<sub>3<\/sub><\/b> and <b>H<sub>2<\/sub>SO<sub>4<\/sub><\/b>.", "a": ["NaCl = <b>sodium chloride<\/b> (1)", "CaCO<sub>3<\/sub> = <b>calcium carbonate<\/b> (1)", "H<sub>2<\/sub>SO<sub>4<\/sub> = <b>sulfuric acid<\/b> (1)"], "cp": ["NaCl = sodium chloride", "CaCO<sub>3<\/sub> = calcium carbonate", "H<sub>2<\/sub>SO<sub>4<\/sub> = sulfuric acid"], "dp": ["NaCl = sodium chlorate", "CaCO<sub>3<\/sub> = calcium carbide", "H<sub>2<\/sub>SO<sub>4<\/sub> = sulfurous acid"], "mand": 0}, {"id": "CHE-01-004", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 1, "ht": false, "q": "What is the name of a compound made of <b>magnesium and oxygen<\/b>?", "a": ["<b>Magnesium oxide<\/b> (1)"], "cp": ["Magnesium oxide"], "dp": ["Magnesium oxygen", "Magnesium oxalate", "Magnesium dioxide"], "mand": 0}, {"id": "CHE-01-005", "t": 1, "s": "4.1.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Balance this equation:<br/><br/>Mg + O<sub>2<\/sub> → MgO", "a": ["<b>2<\/b>Mg + O<sub>2<\/sub> → <b>2<\/b>MgO (1)", "Both sides now have <b>2 Mg<\/b> and <b>2 O<\/b> (1)"], "cp": ["2Mg + O<sub>2<\/sub> → 2MgO", "Both sides now have 2 Mg and 2 O"], "dp": ["Mg + 2O<sub>2<\/sub> → 2MgO", "2Mg + 2O<sub>2<\/sub> → 2MgO", "Mg + O<sub>2<\/sub> → MgO<sub>2<\/sub>"], "mand": 0}, {"id": "CHE-01-006", "t": 1, "s": "4.1.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Balance this equation:<br/><br/>H<sub>2<\/sub> + O<sub>2<\/sub> → H<sub>2<\/sub>O", "a": ["<b>2<\/b>H<sub>2<\/sub> + O<sub>2<\/sub> → <b>2<\/b>H<sub>2<\/sub>O (1)", "Both sides have <b>4 H<\/b> and <b>2 O<\/b> (1)"], "cp": ["2H<sub>2<\/sub> + O<sub>2<\/sub> → 2H<sub>2<\/sub>O", "Both sides have 4 H and 2 O"], "dp": ["H<sub>2<\/sub> + O<sub>2<\/sub> → H<sub>2<\/sub>O<sub>2<\/sub>", "2H<sub>2<\/sub> + 2O<sub>2<\/sub> → 2H<sub>2<\/sub>O", "H<sub>2<\/sub> + 2O<sub>2<\/sub> → 2H<sub>2<\/sub>O"], "mand": 0}, {"id": "CHE-01-007", "t": 1, "s": "4.1.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Give the <b>state symbols<\/b> for: a solid, a liquid, a gas and a solution in water.", "a": ["Solid <b>(s)<\/b> and liquid <b>(l)<\/b> (1)", "Gas <b>(g)<\/b> and aqueous (in water) <b>(aq)<\/b> (1)"], "cp": ["Solid (s) and liquid (l)", "Gas (g) and aqueous (in water) (aq)"], "dp": ["Solid (l) and liquid (s)", "Gas (a) and aqueous (g)", "Solid (sol) and gas (gas)"], "mand": 0}, {"id": "CHE-01-008", "t": 1, "s": "4.1.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Balance this equation:<br/><br/>Al + O<sub>2<\/sub> → Al<sub>2<\/sub>O<sub>3<\/sub>", "a": ["<b>4<\/b>Al + <b>3<\/b>O<sub>2<\/sub> → <b>2<\/b>Al<sub>2<\/sub>O<sub>3<\/sub> (1)", "Both sides have <b>4 Al<\/b> and <b>6 O<\/b> (1)"], "cp": ["4Al + 3O<sub>2<\/sub> → 2Al<sub>2<\/sub>O<sub>3<\/sub>", "Both sides have 4 Al and 6 O"], "dp": ["2Al + 3O<sub>2<\/sub> → Al<sub>2<\/sub>O<sub>3<\/sub>", "4Al + 2O<sub>2<\/sub> → 2Al<sub>2<\/sub>O<sub>3<\/sub>", "2Al + O<sub>2<\/sub> → Al<sub>2<\/sub>O<sub>3<\/sub>"], "mand": 0}, {"id": "CHE-01-009", "t": 1, "s": "4.1.1.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>mixture<\/b>? Are the substances chemically joined?", "a": ["Two or more elements or compounds <b>not chemically joined<\/b> (1)", "Each substance keeps its <b>own properties<\/b> (1)"], "cp": ["Two or more elements or compounds not chemically joined", "Each substance keeps its own properties"], "dp": ["Substances chemically joined in fixed proportions", "The substances lose their own properties", "A mixture is always a pure substance"], "mand": 0}, {"id": "CHE-01-010", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Which method separates an <b>insoluble solid<\/b> from a liquid? Which separates a <b>soluble solid<\/b> from a solution?", "a": ["Insoluble solid from liquid: <b>filtration<\/b> (1)", "Soluble solid from solution: <b>crystallisation<\/b> (or evaporation) (1)"], "cp": ["Insoluble solid from liquid: filtration", "Soluble solid from solution: crystallisation (or evaporation)"], "dp": ["Insoluble solid: crystallisation", "Soluble solid: filtration", "Insoluble solid: chromatography"], "mand": 0}, {"id": "CHE-01-011", "t": 1, "s": "4.1.1.2", "k": "Recall", "m": 2, "ht": false, "q": "Which method separates a <b>liquid from a solution<\/b> (for example water from salt water)? Which separates a mixture of <b>liquids<\/b>?", "a": ["Liquid from a solution: <b>simple distillation<\/b> (1)", "Mixture of liquids: <b>fractional distillation<\/b> (1)"], "cp": ["Liquid from a solution: simple distillation", "Mixture of liquids: fractional distillation"], "dp": ["Liquid from solution: filtration", "Mixture of liquids: crystallisation", "Liquid from solution: fractional distillation"], "mand": 0}, {"id": "CHE-01-012", "t": 1, "s": "4.1.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>fractional distillation<\/b> separates a mixture of liquids.", "a": ["The mixture is <b>heated<\/b> and the liquids evaporate at <b>different boiling points<\/b> (1)", "The vapours rise up a <b>column<\/b> and cool (1)", "The liquid with the <b>lowest boiling point<\/b> reaches the top first and is condensed and collected (1)"], "cp": ["The mixture is heated and the liquids evaporate at different boiling points", "The vapours rise up a column and cool", "The liquid with the lowest boiling point reaches the top first and is condensed and collected"], "dp": ["The liquids have the same boiling point and are filtered", "The liquid with the highest boiling point leaves first", "The liquids are separated by their different sizes"], "mand": 0}, {"id": "CHE-01-013", "t": 1, "s": "4.1.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Explain how <b>simple distillation<\/b> gets pure water from salt water.", "a": ["The salt water is <b>heated<\/b> so the water <b>evaporates<\/b> (1)", "The vapour is <b>cooled and condensed<\/b> and collected, leaving the salt behind (1)"], "cp": ["The salt water is heated so the water evaporates", "The vapour is cooled and condensed and collected, leaving the salt behind"], "dp": ["The salt evaporates and the water stays", "The water is filtered through paper", "The salt water is cooled until the water freezes"], "mand": 0}, {"id": "CHE-01-014", "t": 1, "s": "4.1.1.3", "k": "Recall", "m": 2, "ht": false, "q": "What did the <b>plum pudding model<\/b> say an atom was like?", "a": ["A <b>ball of positive charge<\/b> (1)", "with <b>negative electrons<\/b> spread through it (1)"], "cp": ["A ball of positive charge", "with negative electrons spread through it"], "dp": ["A tiny dense nucleus with orbiting electrons", "A solid ball with no charge", "A nucleus containing protons and neutrons"], "mand": 0}, {"id": "CHE-01-015", "t": 1, "s": "4.1.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Alpha particles were fired at thin gold foil. Most went straight through, a few were <b>deflected<\/b> and a very few bounced <b>back<\/b>. What did this show?", "a": ["Most of an atom is <b>empty space<\/b> (1)", "The <b>nucleus<\/b> is tiny and has a <b>positive<\/b> charge (1)", "So the plum pudding model was <b>replaced<\/b> by the nuclear model (1)"], "cp": ["Most of an atom is empty space", "The nucleus is tiny and has a positive charge", "So the plum pudding model was replaced by the nuclear model"], "dp": ["Atoms are solid balls of positive charge", "Electrons are in the nucleus", "The nucleus has a negative charge"], "mand": 0}, {"id": "CHE-01-016", "t": 1, "s": "4.1.1.3", "k": "Recall", "m": 2, "ht": false, "q": "What did <b>Bohr<\/b> and <b>Chadwick<\/b> add to the model of the atom?", "a": ["Bohr: electrons orbit the nucleus at <b>specific distances<\/b> (shells) (1)", "Chadwick: the nucleus contains <b>neutrons<\/b> as well as protons (1)"], "cp": ["Bohr: electrons orbit the nucleus at specific distances (shells)", "Chadwick: the nucleus contains neutrons as well as protons"], "dp": ["Bohr found the electron", "Chadwick found the proton", "Bohr showed the atom is a solid sphere"], "mand": 0}, {"id": "CHE-01-017", "t": 1, "s": "4.1.1.4", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>relative charge<\/b> of a proton, a neutron and an electron.", "a": ["Proton = <b>+1<\/b> (1)", "Neutron = <b>0<\/b> (1)", "Electron = <b>-1<\/b> (1)"], "cp": ["Proton = +1", "Neutron = 0", "Electron = -1"], "dp": ["Proton = -1", "Neutron = +1", "Electron = 0"], "mand": 0}, {"id": "CHE-01-018", "t": 1, "s": "4.1.1.4", "k": "Explain", "m": 2, "ht": false, "q": "Why does an atom have <b>no overall charge<\/b>?", "a": ["It has the <b>same number<\/b> of protons and electrons (1)", "The positive and negative charges <b>cancel out<\/b> (1)"], "cp": ["It has the same number of protons and electrons", "The positive and negative charges cancel out"], "dp": ["It has the same number of protons and neutrons", "Neutrons cancel the charge of the protons", "It has more electrons than protons"], "mand": 0}, {"id": "CHE-01-019", "t": 1, "s": "4.1.1.5", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>atomic number<\/b>? What is the <b>mass number<\/b>?", "a": ["Atomic number = number of <b>protons<\/b> (1)", "Mass number = number of <b>protons + neutrons<\/b> (1)"], "cp": ["Atomic number = number of protons", "Mass number = number of protons + neutrons"], "dp": ["Atomic number = protons + neutrons", "Mass number = number of electrons", "Atomic number = number of neutrons"], "mand": 0}, {"id": "CHE-01-020", "t": 1, "s": "4.1.1.5", "k": "Calculation", "m": 3, "ht": false, "q": "An atom of sodium has atomic number 11 and mass number 23.<br/><br/>How many protons, neutrons and electrons does it have?", "a": ["Protons = <b>11<\/b> (1)", "Electrons = <b>11<\/b> (1)", "Neutrons = 23 - 11 = <b>12<\/b> (1)"], "cp": ["Protons = 11", "Electrons = 11", "Neutrons = 23 - 11 = 12"], "dp": ["Neutrons = 11", "Electrons = 12", "Protons = 23"], "mand": 0}, {"id": "CHE-01-021", "t": 1, "s": "4.1.1.5", "k": "Recall", "m": 2, "ht": false, "q": "Where is nearly all the <b>mass<\/b> of an atom? What is the approximate <b>radius<\/b> of an atom?", "a": ["In the <b>nucleus<\/b> (1)", "About <b>0.1 nm<\/b> (1 × 10<sup>-10<\/sup> m) (1)"], "cp": ["In the nucleus", "About 0.1 nm (1 × 10<sup>-10<\/sup> m)"], "dp": ["In the electron shells", "About 1 mm", "About 10 nm"], "mand": 0}, {"id": "CHE-01-022", "t": 1, "s": "4.1.1.5", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>isotopes<\/b>?", "a": ["Atoms of the <b>same element<\/b> (same number of protons) (1)", "with a <b>different number of neutrons<\/b> (1)"], "cp": ["Atoms of the same element (same number of protons)", "with a different number of neutrons"], "dp": ["Atoms of different elements with the same mass number", "Atoms with a different number of protons", "Atoms with a different number of electrons"], "mand": 0}, {"id": "CHE-01-023", "t": 1, "s": "4.1.1.5", "k": "Calculation", "m": 3, "ht": false, "q": "Carbon-14 has atomic number 6.<br/><br/>How many protons, neutrons and electrons are in one atom?", "a": ["Protons = <b>6<\/b> (1)", "Electrons = <b>6<\/b> (1)", "Neutrons = 14 - 6 = <b>8<\/b> (1)"], "cp": ["Protons = 6", "Electrons = 6", "Neutrons = 14 - 6 = 8"], "dp": ["Neutrons = 6", "Protons = 14", "Electrons = 8"], "mand": 0}, {"id": "CHE-01-024", "t": 1, "s": "4.1.1.5", "k": "Calculation", "m": 3, "ht": false, "q": "An ion has 17 protons, 18 electrons and 18 neutrons.<br/><br/>What is its atomic number, mass number and charge?", "a": ["Atomic number = <b>17<\/b> (1)", "Mass number = 17 + 18 = <b>35<\/b> (1)", "Charge = <b>1-<\/b> (one extra electron) (1)"], "cp": ["Atomic number = 17", "Mass number = 17 + 18 = 35", "Charge = 1- (one extra electron)"], "dp": ["Atomic number = 18", "Mass number = 36", "Charge = 1+"], "mand": 0}, {"id": "CHE-01-025", "t": 1, "s": "4.1.1.6", "k": "Definition", "m": 2, "ht": false, "q": "What is meant by <b>relative atomic mass<\/b> (A<sub>r<\/sub>) of an element?", "a": ["The <b>average mass<\/b> of its atoms, taking account of its isotopes (1)", "and how much of <b>each isotope<\/b> there is (abundance) (1)"], "cp": ["The average mass of its atoms, taking account of its isotopes", "and how much of each isotope there is (abundance)"], "dp": ["The mass of the heaviest isotope", "The number of protons in the atom", "The mass of a single atom in grams"], "mand": 0}, {"id": "CHE-01-026", "t": 1, "s": "4.1.1.6", "k": "Calculation", "m": 3, "ht": false, "q": "Chlorine has two isotopes: chlorine-35 (75%) and chlorine-37 (25%).<br/><br/>Calculate the relative atomic mass. Show your working.", "a": ["(35 × 75) + (37 × 25) (1)", "= 2625 + 925 = 3550 (1)", "÷ 100 = <b>35.5<\/b> (1)"], "cp": ["(35 × 75) + (37 × 25)", "= 2625 + 925 = 3550", "÷ 100 = 35.5"], "dp": ["36.0", "35.0", "37.0"], "mand": 0}, {"id": "CHE-01-027", "t": 1, "s": "4.1.1.7", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>electronic structure<\/b> of sodium (atomic number 11)?", "a": ["Electrons fill the shells from the <b>inside outwards<\/b> (1)", "<b>2,8,1<\/b> (1)"], "cp": ["Electrons fill the shells from the inside outwards", "2,8,1"], "dp": ["2,8,2", "2,9", "11"], "mand": 0}, {"id": "CHE-01-028", "t": 1, "s": "4.1.1.7", "k": "Recall", "m": 1, "ht": false, "q": "Write the electronic structure of <b>chlorine<\/b> (atomic number 17).", "a": ["<b>2,8,7<\/b> (1)"], "cp": ["2,8,7"], "dp": ["2,8,8", "2,7,8", "2,15"], "mand": 0}, {"id": "CHE-01-029", "t": 1, "s": "4.1.1.7", "k": "Recall", "m": 1, "ht": false, "q": "Write the electronic structure of <b>calcium<\/b> (atomic number 20).", "a": ["<b>2,8,8,2<\/b> (1)"], "cp": ["2,8,8,2"], "dp": ["2,8,10", "2,8,2", "2,10,8"], "mand": 0}, {"id": "CHE-01-030", "t": 1, "s": "4.1.1.7", "k": "Recall", "m": 2, "ht": false, "q": "What is the maximum number of electrons in the <b>first<\/b> shell and in the <b>second<\/b> shell?", "a": ["First shell = <b>2<\/b> (1)", "Second shell = <b>8<\/b> (1)"], "cp": ["First shell = 2", "Second shell = 8"], "dp": ["First shell = 8", "Second shell = 2", "First shell = 1"], "mand": 0}, {"id": "CHE-01-031", "t": 1, "s": "4.1.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Why do elements in the <b>same group<\/b> have similar chemical properties?", "a": ["They have the <b>same number of electrons<\/b> in their outer shell (1)", "This decides how they <b>react<\/b> (1)"], "cp": ["They have the same number of electrons in their outer shell", "This decides how they react"], "dp": ["They have the same number of protons", "They have the same number of shells", "They have the same mass number"], "mand": 0}, {"id": "CHE-01-032", "t": 1, "s": "4.1.2.1", "k": "Recall", "m": 2, "ht": false, "q": "How are the elements arranged in the <b>periodic table<\/b>?", "a": ["In order of <b>atomic number<\/b> (number of protons) (1)", "Elements with similar properties are in <b>columns (groups)<\/b> (1)"], "cp": ["In order of atomic number (number of protons)", "Elements with similar properties are in columns (groups)"], "dp": ["In order of mass number only", "In order of reactivity", "In order of the number of neutrons"], "mand": 0}, {"id": "CHE-01-033", "t": 1, "s": "4.1.2.1", "k": "Recall", "m": 2, "ht": false, "q": "What does the <b>group number<\/b> tell you? What does the <b>period<\/b> tell you?", "a": ["Group number = number of <b>outer electrons<\/b> (1)", "Period = number of <b>shells<\/b> that contain electrons (1)"], "cp": ["Group number = number of outer electrons", "Period = number of shells that contain electrons"], "dp": ["Group number = number of shells", "Period = number of outer electrons", "Group number = number of neutrons"], "mand": 0}, {"id": "CHE-01-034", "t": 1, "s": "4.1.2.2", "k": "Explain", "m": 3, "ht": false, "q": "How did <b>Mendeleev<\/b> arrange his periodic table? How did it help to show he was right?", "a": ["He ordered elements by <b>atomic weight<\/b> but switched some so similar elements lined up in groups (1)", "He left <b>gaps<\/b> for elements not yet discovered (1)", "Predicted elements were <b>later found<\/b> with matching properties (1)"], "cp": ["He ordered elements by atomic weight but switched some so similar elements lined up in groups", "He left gaps for elements not yet discovered", "Predicted elements were later found with matching properties"], "dp": ["He ordered elements by atomic number", "He left no gaps in the table", "His predictions were later found to be wrong"], "mand": 0}, {"id": "CHE-01-035", "t": 1, "s": "4.1.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Why did ordering elements by <b>atomic weight<\/b> sometimes cause problems?", "a": ["Some elements were in the <b>wrong group<\/b> (1)", "<b>Isotopes<\/b> were not yet known (they change the average mass) (1)"], "cp": ["Some elements were in the wrong group", "Isotopes were not yet known (they change the average mass)"], "dp": ["The atomic weights were all wrong", "Electrons had not been discovered", "There were too many elements"], "mand": 0}, {"id": "CHE-01-036", "t": 1, "s": "4.1.2.3", "k": "Compare", "m": 3, "ht": false, "q": "Give <b>three<\/b> differences between metals and non-metals.", "a": ["Any three (1 each):", "• metals are <b>shiny<\/b>; non-metals are dull", "• metals are good <b>conductors<\/b>; non-metals are poor", "• metals form <b>positive ions<\/b>; non-metals do not", "• metals are <b>malleable<\/b>; non-metals are brittle", "• metals have <b>high melting points<\/b>; non-metals low"], "cp": ["metals are shiny; non-metals are dull", "metals are good conductors; non-metals are poor", "metals form positive ions; non-metals do not", "metals are malleable; non-metals are brittle", "metals have high melting points; non-metals low"], "dp": ["Metals are brittle and non-metals are malleable", "Non-metals form positive ions", "Metals are poor conductors"], "mand": 0}, {"id": "CHE-01-037", "t": 1, "s": "4.1.2.3", "k": "Recall", "m": 2, "ht": false, "q": "Where are the <b>metals<\/b> and <b>non-metals<\/b> in the periodic table?", "a": ["Metals are to the <b>left<\/b> and in the middle (and bottom) (1)", "Non-metals are on the <b>right<\/b> (top right) (1)"], "cp": ["Metals are to the left and in the middle (and bottom)", "Non-metals are on the right (top right)"], "dp": ["Metals are on the right", "Non-metals are on the left", "Metals are only in Group 1"], "mand": 0}, {"id": "CHE-01-038", "t": 1, "s": "4.1.2.4", "k": "Recall", "m": 2, "ht": false, "q": "Why are the <b>noble gases<\/b> (Group 0) unreactive?", "a": ["They have a <b>full outer shell<\/b> of electrons (1)", "(8 electrons, or 2 for helium) so are <b>stable<\/b> and do not need to gain or lose electrons (1)"], "cp": ["They have a full outer shell of electrons", "(8 electrons, or 2 for helium) so are stable and do not need to gain or lose electrons"], "dp": ["They have one outer electron", "They have a half full outer shell", "They are all solids"], "mand": 0}, {"id": "CHE-01-039", "t": 1, "s": "4.1.2.4", "k": "Recall", "m": 2, "ht": false, "q": "How do the <b>boiling points<\/b> change down Group 0? Is argon or neon likely to have the higher boiling point?", "a": ["Boiling points <b>increase<\/b> down the group (1)", "<b>Argon<\/b> is lower down so has the higher boiling point (1)"], "cp": ["Boiling points increase down the group", "Argon is lower down so has the higher boiling point"], "dp": ["Boiling points decrease down the group", "Neon has the higher boiling point", "The boiling points do not change"], "mand": 0}, {"id": "CHE-01-040", "t": 1, "s": "4.1.2.5", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> properties of the Group 1 metals.", "a": ["Any three (1 each):", "• <b>soft<\/b> (can be cut with a knife)", "• <b>low density<\/b> (lithium, sodium, potassium float)", "• <b>low melting points<\/b>", "• very <b>reactive<\/b>", "• have <b>one outer electron<\/b>"], "cp": ["soft (can be cut with a knife)", "low density (lithium, sodium, potassium float)", "low melting points", "very reactive", "have one outer electron"], "dp": ["Hard and dense", "High melting points", "Unreactive"], "mand": 0}, {"id": "CHE-01-041", "t": 1, "s": "4.1.2.5", "k": "Explain", "m": 3, "ht": false, "q": "Describe what you see when <b>sodium reacts with water<\/b>. Name the products.", "a": ["Fizzes, <b>moves around<\/b> and melts into a ball (1)", "Hydrogen gas is made (and sodium hydroxide) (1)", "The solution is <b>alkaline<\/b> (universal indicator turns purple) (1)"], "cp": ["Fizzes, moves around and melts into a ball", "Hydrogen gas is made (and sodium hydroxide)", "The solution is alkaline (universal indicator turns purple)"], "dp": ["Sinks and sits still", "The products are sodium oxide and oxygen", "The solution is acidic"], "mand": 0}, {"id": "CHE-01-042", "t": 1, "s": "4.1.2.5", "k": "Explain", "m": 2, "ht": false, "q": "Explain, in terms of electronic structure, why potassium is <b>more reactive<\/b> than lithium.", "a": ["Potassium has <b>more shells<\/b>, so its outer electron is <b>further from the nucleus<\/b> (1)", "There is <b>weaker attraction<\/b> between nucleus and outer electron, so it is <b>lost more easily<\/b> (1)"], "cp": ["Potassium has more shells, so its outer electron is further from the nucleus", "There is weaker attraction between nucleus and outer electron, so it is lost more easily"], "dp": ["The outer electron is closer to the nucleus", "There are more outer electrons", "The atoms get smaller"], "mand": 0}, {"id": "CHE-01-043", "t": 1, "s": "4.1.2.5", "k": "Explain", "m": 2, "ht": false, "q": "Write the word equation for lithium reacting with water.", "a": ["lithium + water → <b>lithium hydroxide<\/b> (1) + <b>hydrogen<\/b> (1)"], "cp": ["lithium + water → lithium hydroxide", "+ hydrogen"], "dp": ["lithium + water → lithium oxide + oxygen", "lithium + water → lithium oxide + hydrogen", "lithium + water → lithium chloride + hydrogen"], "mand": 0}, {"id": "CHE-01-044", "t": 1, "s": "4.1.2.6", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>colour and state<\/b> at room temperature of chlorine, bromine and iodine.", "a": ["Chlorine = pale green <b>gas<\/b> (1)", "Bromine = red-brown <b>liquid<\/b> (1)", "Iodine = grey (dark) <b>solid<\/b> (1)"], "cp": ["Chlorine = pale green gas", "Bromine = red-brown liquid", "Iodine = grey (dark) solid"], "dp": ["Chlorine = red-brown liquid", "Bromine = grey solid", "Iodine = pale green gas"], "mand": 0}, {"id": "CHE-01-045", "t": 1, "s": "4.1.2.6", "k": "Recall", "m": 2, "ht": false, "q": "How many <b>outer electrons<\/b> do the halogens have? What type of molecules do they form?", "a": ["<b>Seven<\/b> outer electrons (1)", "<b>Diatomic<\/b> molecules, for example Cl<sub>2<\/sub> (1)"], "cp": ["Seven outer electrons", "Diatomic molecules, for example Cl<sub>2<\/sub>"], "dp": ["One outer electron", "Eight outer electrons", "Single atoms"], "mand": 0}, {"id": "CHE-01-046", "t": 1, "s": "4.1.2.6", "k": "Explain", "m": 2, "ht": false, "q": "Why does reactivity <b>decrease<\/b> down Group 7?", "a": ["The outer shell is <b>further from the nucleus<\/b> (1)", "So it is <b>harder to gain<\/b> an electron (weaker attraction) (1)"], "cp": ["The outer shell is further from the nucleus", "So it is harder to gain an electron (weaker attraction)"], "dp": ["The outer shell is closer to the nucleus", "It is easier to gain an electron", "There are fewer shells"], "mand": 0}, {"id": "CHE-01-047", "t": 1, "s": "4.1.2.6", "k": "Explain", "m": 2, "ht": false, "q": "Chlorine gas is bubbled into potassium bromide solution. What happens and why?", "a": ["The solution turns <b>orange<\/b> as bromine is made (1)", "Chlorine is <b>more reactive<\/b> than bromine so it <b>displaces<\/b> it (1)"], "cp": ["The solution turns orange as bromine is made", "Chlorine is more reactive than bromine so it displaces it"], "dp": ["Nothing happens because chlorine is less reactive", "The solution turns purple", "Bromine displaces chlorine"], "mand": 0}, {"id": "CHE-01-048", "t": 1, "s": "4.1.2.6", "k": "Recall", "m": 2, "ht": false, "q": "How do the <b>melting points<\/b> and <b>boiling points<\/b> change down Group 7?", "a": ["Both <b>increase<\/b> down the group (1)", "(so <b>relative molecular mass<\/b> also increases) (1)"], "cp": ["Both increase down the group", "(so relative molecular mass also increases)"], "dp": ["Both decrease down the group", "Melting point rises but boiling point falls", "They stay the same"], "mand": 0}, {"id": "CHE-01-049", "t": 1, "s": "4.1.2.6", "k": "Explain", "m": 2, "ht": false, "q": "Predict whether <b>astatine<\/b> (below iodine in Group 7) is a gas, liquid or solid at room temperature. Give a reason.", "a": ["A <b>solid<\/b> (1)", "Melting and boiling points <b>increase down the group<\/b> and iodine is already solid (1)"], "cp": ["A solid", "Melting and boiling points increase down the group and iodine is already solid"], "dp": ["A gas because it is a halogen", "A liquid because it is below bromine", "A solid because it is a metal"], "mand": 0}, {"id": "CHE-01-050", "t": 1, "s": "4.1.3.1", "k": "Compare", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways transition metals differ from Group 1 metals.", "a": ["Any three (1 each):", "• <b>higher<\/b> melting points", "• <b>higher<\/b> density", "• <b>harder<\/b> and stronger", "• <b>less reactive<\/b> with water, oxygen and halogens"], "cp": ["higher melting points", "higher density", "harder and stronger", "less reactive with water, oxygen and halogens"], "dp": ["Lower melting points", "Softer and less dense", "More reactive with water"], "mand": 0}, {"id": "CHE-01-051", "t": 1, "s": "4.1.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> typical properties of transition metals.", "a": ["Any three (1 each):", "• form ions with <b>different charges<\/b>", "• form <b>coloured<\/b> compounds", "• act as <b>catalysts<\/b>", "• good conductors, hard and strong"], "cp": ["form ions with different charges", "form coloured compounds", "act as catalysts", "good conductors, hard and strong"], "dp": ["They all form ions with the same charge", "They form white compounds only", "They are very reactive"], "mand": 0}, {"id": "CHE-01-052", "t": 1, "s": "4.1.3.2", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> uses of transition metals or their compounds.", "a": ["Any two (1 each):", "• <b>iron<\/b> as a catalyst in the Haber process", "• <b>nickel<\/b> as a catalyst when making margarine", "• <b>copper<\/b> in wires and pipes", "• <b>iron<\/b> in building (steel)"], "cp": ["iron as a catalyst in the Haber process", "nickel as a catalyst when making margarine", "copper in wires and pipes", "iron in building (steel)"], "dp": ["Sodium as a catalyst in the Haber process", "Potassium for electrical wires", "Chlorine for building bridges"], "mand": 0}, {"id": "CHE-01-H01", "t": 1, "s": "4.1.1.1", "k": "Explain", "m": 2, "ht": true, "q": "Write a <b>half equation<\/b> to show a sodium atom becoming a sodium ion.", "a": ["<b>Na → Na<sup>+<\/sup> + e<sup>-<\/sup><\/b> (1)", "The charges and electrons <b>balance<\/b> on both sides (1)"], "cp": ["Na → Na<sup>+<\/sup> + e<sup>-<\/sup>", "The charges and electrons balance on both sides"], "dp": ["Na + e<sup>-<\/sup> → Na<sup>+<\/sup>", "Na → Na<sup>-<\/sup> + e<sup>+<\/sup>", "Na<sup>+<\/sup> → Na + e<sup>-<\/sup>"], "mand": 0}, {"id": "CHE-02-001", "t": 2, "s": "4.2.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three types of strong chemical bond<\/b>.", "a": ["<b>Ionic<\/b> (1)", "<b>Covalent<\/b> (1)", "<b>Metallic<\/b> (1)"], "cp": ["Ionic", "Covalent", "Metallic"], "dp": ["Hydrogen", "Intermolecular", "Van der Waals"], "mand": 0}, {"id": "CHE-02-002", "t": 2, "s": "4.2.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Which type of bonding is found in: a metal, a metal + non-metal compound, and a non-metal compound?", "a": ["Metal = <b>metallic<\/b> (1)", "Metal + non-metal = <b>ionic<\/b> (1)", "Non-metal compound = <b>covalent<\/b> (1)"], "cp": ["Metal = metallic", "Metal + non-metal = ionic", "Non-metal compound = covalent"], "dp": ["Metal = ionic", "Metal + non-metal = covalent", "Non-metal compound = metallic"], "mand": 0}, {"id": "CHE-02-003", "t": 2, "s": "4.2.1.2", "k": "Explain", "m": 3, "ht": false, "q": "Describe what happens to the atoms when <b>sodium reacts with chlorine<\/b> to form sodium chloride.", "a": ["Sodium <b>loses<\/b> one electron to form Na<sup>+<\/sup> (1)", "Chlorine <b>gains<\/b> that electron to form Cl<sup>-<\/sup> (1)", "The oppositely charged ions are held together by <b>electrostatic attraction<\/b> (1)"], "cp": ["Sodium loses one electron to form Na<sup>+<\/sup>", "Chlorine gains that electron to form Cl<sup>-<\/sup>", "The oppositely charged ions are held together by electrostatic attraction"], "dp": ["Sodium gains an electron and chlorine loses one", "The atoms share a pair of electrons", "Both atoms lose electrons"], "mand": 0}, {"id": "CHE-02-004", "t": 2, "s": "4.2.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>ion<\/b> formed by: a Group 1 metal, a Group 2 metal and a Group 7 non-metal.", "a": ["Group 1 = <b>1+<\/b> (1)", "Group 2 = <b>2+<\/b> (1)", "Group 7 = <b>1-<\/b> (1)"], "cp": ["Group 1 = 1+", "Group 2 = 2+", "Group 7 = 1-"], "dp": ["Group 1 = 1-", "Group 2 = 2-", "Group 7 = 7-"], "mand": 0}, {"id": "CHE-02-005", "t": 2, "s": "4.2.1.2", "k": "Recall", "m": 2, "ht": false, "q": "What ions are formed by <b>oxygen<\/b> (Group 6) and <b>magnesium<\/b> (Group 2)?", "a": ["Oxygen forms <b>O<sup>2-<\/sup><\/b> (1)", "Magnesium forms <b>Mg<sup>2+<\/sup><\/b> (1)"], "cp": ["Oxygen forms O<sup>2-<\/sup>", "Magnesium forms Mg<sup>2+<\/sup>"], "dp": ["Oxygen forms O<sup>2+<\/sup>", "Magnesium forms Mg<sup>2-<\/sup>", "Oxygen forms O<sup>6-<\/sup>"], "mand": 0}, {"id": "CHE-02-006", "t": 2, "s": "4.2.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Why do ions of Groups 1, 2, 6 and 7 usually have a <b>noble gas<\/b> electronic structure?", "a": ["They gain or lose electrons to get a <b>full outer shell<\/b> (1)", "which is a <b>stable<\/b> arrangement (1)"], "cp": ["They gain or lose electrons to get a full outer shell", "which is a stable arrangement"], "dp": ["They share electrons with other atoms", "They gain a proton", "They end up with one outer electron"], "mand": 0}, {"id": "CHE-02-007", "t": 2, "s": "4.2.1.2", "k": "Explain", "m": 2, "ht": false, "q": "Describe the <b>dot and cross diagram<\/b> for sodium chloride (NaCl).", "a": ["Sodium has <b>no electrons<\/b> in its outer shell shown, with charge <b>+<\/b> (1)", "Chloride has a <b>full outer shell of 8<\/b> electrons in square brackets with charge <b>-<\/b> (1)"], "cp": ["Sodium has no electrons in its outer shell shown, with charge +", "Chloride has a full outer shell of 8 electrons in square brackets with charge -"], "dp": ["Sodium has 8 outer electrons and charge -", "Chloride has 7 outer electrons and no charge", "The atoms share a pair of electrons"], "mand": 0}, {"id": "CHE-02-008", "t": 2, "s": "4.2.1.3", "k": "Recall", "m": 2, "ht": false, "q": "Describe the <b>structure<\/b> of an ionic compound.", "a": ["A <b>giant lattice<\/b> of ions in a regular pattern (1)", "with strong <b>electrostatic forces<\/b> in all directions between oppositely charged ions (1)"], "cp": ["A giant lattice of ions in a regular pattern", "with strong electrostatic forces in all directions between oppositely charged ions"], "dp": ["Separate small molecules", "Atoms sharing electrons in pairs", "Layers of atoms with delocalised electrons"], "mand": 0}, {"id": "CHE-02-009", "t": 2, "s": "4.2.1.3", "k": "Calculation", "m": 2, "ht": false, "q": "A model of an ionic lattice has 1 magnesium ion for every 2 chloride ions.<br/><br/>What is the <b>formula<\/b> of the compound?", "a": ["Ratio Mg : Cl = <b>1 : 2<\/b> (1)", "<b>MgCl<sub>2<\/sub><\/b> (1)"], "cp": ["Ratio Mg : Cl = 1 : 2", "MgCl<sub>2<\/sub>"], "dp": ["Mg<sub>2<\/sub>Cl", "MgCl", "Mg<sub>2<\/sub>Cl<sub>2<\/sub>"], "mand": 0}, {"id": "CHE-02-010", "t": 2, "s": "4.2.1.3", "k": "Explain", "m": 1, "ht": false, "q": "Give <b>one limitation<\/b> of a 3D ball and stick model of an ionic lattice.", "a": ["Any one: it does not show the <b>sizes<\/b> of the ions properly, or the <b>forces<\/b> between them, or that the lattice is much bigger (1)"], "cp": ["Any one: it does not show the sizes of the ions properly, or the forces between them, or that the lattice is much bigger"], "dp": ["It shows the ions are moving", "It shows the real colour of the ions", "It shows the exact electron shells"], "mand": 0}, {"id": "CHE-02-011", "t": 2, "s": "4.2.1.4", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>covalent bond<\/b>?", "a": ["A <b>shared pair of electrons<\/b> (1)", "between two <b>non-metal<\/b> atoms (1)"], "cp": ["A shared pair of electrons", "between two non-metal atoms"], "dp": ["A transfer of electrons from metal to non-metal", "An attraction between positive ions and delocalised electrons", "The attraction between molecules"], "mand": 0}, {"id": "CHE-02-012", "t": 2, "s": "4.2.1.4", "k": "Recall", "m": 2, "ht": false, "q": "Give the <b>formulae<\/b> of any two of these: hydrogen, chlorine, water, ammonia, methane.", "a": ["Any two (1 each):", "• hydrogen <b>H<sub>2<\/sub><\/b>", "• chlorine <b>Cl<sub>2<\/sub><\/b>", "• water <b>H<sub>2<\/sub>O<\/b>", "• ammonia <b>NH<sub>3<\/sub><\/b>", "• methane <b>CH<sub>4<\/sub><\/b>"], "cp": ["hydrogen H<sub>2<\/sub>", "chlorine Cl<sub>2<\/sub>", "water H<sub>2<\/sub>O", "ammonia NH<sub>3<\/sub>", "methane CH<sub>4<\/sub>"], "dp": ["Hydrogen H", "Water HO", "Methane C<sub>4<\/sub>H"], "mand": 0}, {"id": "CHE-02-013", "t": 2, "s": "4.2.1.4", "k": "Explain", "m": 2, "ht": false, "q": "Describe the covalent bonding in a molecule of <b>hydrogen chloride<\/b>, HCl.", "a": ["One <b>shared pair<\/b> of electrons between H and Cl (1)", "Each atom gets a <b>full outer shell<\/b> (1)"], "cp": ["One shared pair of electrons between H and Cl", "Each atom gets a full outer shell"], "dp": ["Hydrogen gives an electron to chlorine", "Two shared pairs of electrons", "Electrons are delocalised between the atoms"], "mand": 0}, {"id": "CHE-02-014", "t": 2, "s": "4.2.1.4", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three<\/b> types of covalent substance.", "a": ["<b>Small molecules<\/b> (for example water) (1)", "<b>Polymers<\/b> (long chains) (1)", "<b>Giant covalent<\/b> structures (for example diamond) (1)"], "cp": ["Small molecules (for example water)", "Polymers (long chains)", "Giant covalent structures (for example diamond)"], "dp": ["Giant ionic lattices", "Metallic lattices", "Alloys"], "mand": 0}, {"id": "CHE-02-015", "t": 2, "s": "4.2.1.4", "k": "Recall", "m": 2, "ht": false, "q": "Draw or describe the <b>dot and cross<\/b> bonding in an oxygen molecule, O<sub>2<\/sub>.", "a": ["Two oxygen atoms share <b>two pairs<\/b> of electrons (1)", "so they have a <b>double bond<\/b> (O=O) (1)"], "cp": ["Two oxygen atoms share two pairs of electrons", "so they have a double bond (O=O)"], "dp": ["One shared pair, a single bond", "Three shared pairs, a triple bond", "The atoms transfer two electrons"], "mand": 0}, {"id": "CHE-02-016", "t": 2, "s": "4.2.1.4", "k": "Recall", "m": 1, "ht": false, "q": "How many covalent bonds does a nitrogen molecule (N<sub>2<\/sub>) contain between the atoms?", "a": ["A <b>triple bond<\/b> (three shared pairs) (1)"], "cp": ["A triple bond (three shared pairs)"], "dp": ["A single bond", "A double bond", "No bonds between the atoms"], "mand": 0}, {"id": "CHE-02-017", "t": 2, "s": "4.2.1.5", "k": "Explain", "m": 3, "ht": false, "q": "Describe <b>metallic bonding<\/b>.", "a": ["A <b>regular lattice<\/b> of positive metal ions (1)", "Outer electrons are <b>delocalised<\/b> (free to move) (1)", "Strong <b>electrostatic attraction<\/b> between ions and the sea of electrons (1)"], "cp": ["A regular lattice of positive metal ions", "Outer electrons are delocalised (free to move)", "Strong electrostatic attraction between ions and the sea of electrons"], "dp": ["Negative ions in a lattice", "Electrons shared in pairs between atoms", "Metal atoms transfer electrons to non-metals"], "mand": 0}, {"id": "CHE-02-018", "t": 2, "s": "4.2.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>change of state<\/b> for: solid to liquid, liquid to gas and gas to liquid.", "a": ["Solid to liquid = <b>melting<\/b> (1)", "Liquid to gas = <b>boiling (evaporating)<\/b> (1)", "Gas to liquid = <b>condensing<\/b> (1)"], "cp": ["Solid to liquid = melting", "Liquid to gas = boiling (evaporating)", "Gas to liquid = condensing"], "dp": ["Solid to liquid = freezing", "Liquid to gas = condensing", "Gas to liquid = sublimation"], "mand": 0}, {"id": "CHE-02-019", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "A substance has melting point -7 °C and boiling point 59 °C.<br/><br/>What state is it at 20 °C? Give a reason.", "a": ["<b>Liquid<\/b> (1)", "20 °C is <b>above<\/b> the melting point and <b>below<\/b> the boiling point (1)"], "cp": ["Liquid", "20 °C is above the melting point and below the boiling point"], "dp": ["Solid because 20 is above -7", "Gas because it is above the melting point", "Gas because it is a liquid at 59"], "mand": 0}, {"id": "CHE-02-020", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 2, "ht": false, "q": "Explain what happens to the particles when a solid <b>melts<\/b>.", "a": ["Energy is <b>transferred to<\/b> the particles so they vibrate more (1)", "until they can <b>overcome the forces<\/b> holding them in place and move past each other (1)"], "cp": ["Energy is transferred to the particles so they vibrate more", "until they can overcome the forces holding them in place and move past each other"], "dp": ["The particles get bigger and melt", "Covalent bonds inside the particles break", "The particles stop moving"], "mand": 0}, {"id": "CHE-02-021", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 1, "ht": false, "q": "What decides how much energy is needed to change the state of a substance?", "a": ["The <b>strength of the forces<\/b> between the particles (1)"], "cp": ["The strength of the forces between the particles"], "dp": ["The size of the electron shells", "The colour of the substance", "The number of neutrons"], "mand": 0}, {"id": "CHE-02-022", "t": 2, "s": "4.2.2.2", "k": "Recall", "m": 1, "ht": false, "q": "What does the state symbol <b>(aq)<\/b> mean?", "a": ["Dissolved in <b>water<\/b> (an aqueous solution) (1)"], "cp": ["Dissolved in water (an aqueous solution)"], "dp": ["Dissolved in acid", "A solid in water", "Gas in water"], "mand": 0}, {"id": "CHE-02-023", "t": 2, "s": "4.2.2.3", "k": "Explain", "m": 2, "ht": false, "q": "Explain why sodium chloride has a high melting point.", "a": ["It has a <b>giant ionic lattice<\/b> (1)", "with <b>many strong electrostatic attractions<\/b> between ions, needing a lot of energy to overcome (1)"], "cp": ["It has a giant ionic lattice", "with many strong electrostatic attractions between ions, needing a lot of energy to overcome"], "dp": ["Covalent bonds inside molecules must break", "The ions are held by weak forces", "Electrons are free to move"], "mand": 0}, {"id": "CHE-02-024", "t": 2, "s": "4.2.2.3", "k": "Explain", "m": 3, "ht": false, "q": "Why can ionic compounds conduct electricity when <b>molten<\/b> or <b>dissolved<\/b>, but not when solid?", "a": ["In a solid the ions are in <b>fixed positions<\/b> (1)", "When molten or dissolved the ions are <b>free to move<\/b> (1)", "and so can <b>carry the charge<\/b> (1)"], "cp": ["In a solid the ions are in fixed positions", "When molten or dissolved the ions are free to move", "and so can carry the charge"], "dp": ["Electrons are free to move when molten", "Solids have more ions than liquids", "The ions are free to move in the solid"], "mand": 0}, {"id": "CHE-02-025", "t": 2, "s": "4.2.2.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain why simple molecular substances have <b>low melting and boiling points<\/b>.", "a": ["They have <b>weak forces between molecules<\/b> (intermolecular forces) (1)", "Only these weak forces are <b>overcome<\/b>, not the covalent bonds (1)", "So <b>little energy<\/b> is needed (1)"], "cp": ["They have weak forces between molecules (intermolecular forces)", "Only these weak forces are overcome, not the covalent bonds", "So little energy is needed"], "dp": ["The covalent bonds break when they melt", "They have strong forces between molecules", "A lot of energy is needed"], "mand": 0}, {"id": "CHE-02-026", "t": 2, "s": "4.2.2.4", "k": "Explain", "m": 2, "ht": false, "q": "Why do small molecules <b>not conduct electricity<\/b>?", "a": ["They have <b>no free electrons<\/b> (1)", "and <b>no overall charge<\/b> so no charged particles can move (1)"], "cp": ["They have no free electrons", "and no overall charge so no charged particles can move"], "dp": ["They have delocalised electrons", "They contain free ions", "The molecules are too large"], "mand": 0}, {"id": "CHE-02-027", "t": 2, "s": "4.2.2.4", "k": "Explain", "m": 1, "ht": false, "q": "What happens to the melting and boiling points as the <b>size of the molecule<\/b> increases?", "a": ["They <b>increase<\/b>, because the intermolecular forces are stronger (1)"], "cp": ["They increase, because the intermolecular forces are stronger"], "dp": ["They decrease", "They stay the same", "They fall as covalent bonds weaken"], "mand": 0}, {"id": "CHE-02-028", "t": 2, "s": "4.2.2.5", "k": "Recall", "m": 2, "ht": false, "q": "Why are polymers solid at room temperature?", "a": ["Very large molecules, so <b>intermolecular forces are relatively strong<\/b> (1)", "More energy is needed to overcome them than for small molecules (1)"], "cp": ["Very large molecules, so intermolecular forces are relatively strong", "More energy is needed to overcome them than for small molecules"], "dp": ["The forces between molecules are weak", "Polymers contain ionic bonds", "Polymers have delocalised electrons"], "mand": 0}, {"id": "CHE-02-029", "t": 2, "s": "4.2.2.6", "k": "Recall", "m": 2, "ht": false, "q": "Why do giant covalent structures have <b>very high melting points<\/b>?", "a": ["They contain <b>many strong covalent bonds<\/b> (1)", "that all need to be <b>broken<\/b>, which takes a lot of energy (1)"], "cp": ["They contain many strong covalent bonds", "that all need to be broken, which takes a lot of energy"], "dp": ["They have weak forces between molecules", "The ions are free to move", "They have delocalised electrons"], "mand": 0}, {"id": "CHE-02-030", "t": 2, "s": "4.2.2.6", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two<\/b> examples of giant covalent substances.", "a": ["Any two (1 each):", "• <b>diamond<\/b>", "• <b>graphite<\/b>", "• <b>silicon dioxide<\/b> (silica)", "• graphene"], "cp": ["diamond", "graphite", "silicon dioxide (silica)", "graphene"], "dp": ["Sodium chloride", "Water", "Methane"], "mand": 0}, {"id": "CHE-02-031", "t": 2, "s": "4.2.2.7", "k": "Explain", "m": 2, "ht": false, "q": "Why can <b>pure metals<\/b> be bent and shaped?", "a": ["The atoms are in <b>layers<\/b> (1)", "which can <b>slide over each other<\/b> (1)"], "cp": ["The atoms are in layers", "which can slide over each other"], "dp": ["The layers are fixed in place", "The metal ions repel each other", "The atoms are bonded in pairs"], "mand": 0}, {"id": "CHE-02-032", "t": 2, "s": "4.2.2.7", "k": "Explain", "m": 3, "ht": false, "q": "Explain why an <b>alloy<\/b> is harder than a pure metal.", "a": ["An alloy is a <b>mixture<\/b> of metals (or a metal and another element) (1)", "The different sized atoms <b>distort the layers<\/b> (1)", "so the layers <b>cannot slide<\/b> over each other easily (1)"], "cp": ["An alloy is a mixture of metals (or a metal and another element)", "The different sized atoms distort the layers", "so the layers cannot slide over each other easily"], "dp": ["The atoms are all the same size", "The layers slide more easily", "Alloys have covalent bonds"], "mand": 0}, {"id": "CHE-02-033", "t": 2, "s": "4.2.2.8", "k": "Explain", "m": 2, "ht": false, "q": "Why are metals good <b>conductors<\/b> of electricity and heat?", "a": ["The <b>delocalised electrons<\/b> are free to move (1)", "and carry <b>charge or thermal energy<\/b> through the metal (1)"], "cp": ["The delocalised electrons are free to move", "and carry charge or thermal energy through the metal"], "dp": ["The positive ions move through the metal", "The electrons are fixed in place", "Metals contain ions free to move in the solid"], "mand": 0}, {"id": "CHE-02-034", "t": 2, "s": "4.2.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe the structure and properties of <b>diamond<\/b>.", "a": ["Each carbon bonds to <b>four<\/b> others (1)", "Giant covalent structure, very <b>hard<\/b> with very high melting point (1)", "<b>Does not conduct<\/b> electricity (no free electrons) (1)"], "cp": ["Each carbon bonds to four others", "Giant covalent structure, very hard with very high melting point", "Does not conduct electricity (no free electrons)"], "dp": ["Each carbon bonds to three others", "It conducts electricity well", "It is soft with layers that slide"], "mand": 0}, {"id": "CHE-02-035", "t": 2, "s": "4.2.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe the structure of <b>graphite<\/b>.", "a": ["Each carbon bonds to <b>three<\/b> others (1)", "in <b>hexagonal layers<\/b> with no covalent bonds between layers (1)", "One <b>delocalised electron<\/b> per carbon atom (1)"], "cp": ["Each carbon bonds to three others", "in hexagonal layers with no covalent bonds between layers", "One delocalised electron per carbon atom"], "dp": ["Each carbon bonds to four others", "The layers are joined by strong covalent bonds", "It has a sea of positive ions"], "mand": 0}, {"id": "CHE-02-036", "t": 2, "s": "4.2.3.2", "k": "Explain", "m": 2, "ht": false, "q": "Explain why graphite is <b>soft and slippery<\/b> but also conducts electricity.", "a": ["Layers are held by <b>weak forces<\/b> so they slide (1)", "<b>Delocalised electrons<\/b> can move along the layers carrying charge (1)"], "cp": ["Layers are held by weak forces so they slide", "Delocalised electrons can move along the layers carrying charge"], "dp": ["The layers are held by strong covalent bonds", "Graphite has no free electrons", "Graphite contains ions that move"], "mand": 0}, {"id": "CHE-02-037", "t": 2, "s": "4.2.3.3", "k": "Recall", "m": 2, "ht": false, "q": "What is <b>graphene<\/b>? Give <b>one<\/b> use.", "a": ["A <b>single layer<\/b> of graphite (1)", "Use: any one from electronics or composites (1)"], "cp": ["A single layer of graphite", "Use: any one from electronics or composites"], "dp": ["A form of diamond", "Several layers of fullerene", "A polymer used in plastic bags"], "mand": 0}, {"id": "CHE-02-038", "t": 2, "s": "4.2.3.3", "k": "Recall", "m": 3, "ht": false, "q": "Name the structure that has a formula C<sub>60<\/sub>, and give its <b>shape<\/b> and one <b>use<\/b>.", "a": ["<b>Buckminsterfullerene<\/b> (a fullerene) (1)", "<b>Spherical<\/b>, hollow (1)", "Use: any one from drug delivery, lubricants, catalysts (1)"], "cp": ["Buckminsterfullerene (a fullerene)", "Spherical, hollow", "Use: any one from drug delivery, lubricants, catalysts"], "dp": ["Graphene", "A flat sheet", "A giant lattice"], "mand": 0}, {"id": "CHE-02-039", "t": 2, "s": "4.2.3.3", "k": "Recall", "m": 2, "ht": false, "q": "What are <b>carbon nanotubes<\/b>? Give one property.", "a": ["<b>Cylindrical fullerenes<\/b> (hollow tubes of carbon) (1)", "Property: any one from high tensile strength, conduct electricity, high length to diameter ratio (1)"], "cp": ["Cylindrical fullerenes (hollow tubes of carbon)", "Property: any one from high tensile strength, conduct electricity, high length to diameter ratio"], "dp": ["Flat sheets of carbon", "Tiny spheres of diamond", "Weak, because they are hollow"], "mand": 0}, {"id": "CHE-02-040", "t": 2, "s": "4.2.4.1", "k": "Recall", "m": 2, "ht": false, "q": "What size is a <b>nanoparticle<\/b>? How does it compare to PM10 dust?", "a": ["<b>1 to 100 nm<\/b> across (1)", "Much <b>smaller<\/b> than coarse particles (PM10) (1)"], "cp": ["1 to 100 nm across", "Much smaller than coarse particles (PM10)"], "dp": ["100 to 2500 nm", "About 1 mm", "Larger than PM10 dust"], "mand": 0}, {"id": "CHE-02-041", "t": 2, "s": "4.2.4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why nanoparticles can be more <b>effective<\/b> than the same material in bulk.", "a": ["Nanoparticles have a very <b>high surface area to volume<\/b> ratio (1)", "so more of the material is available to react (1)", "so <b>smaller amounts<\/b> can be used (1)"], "cp": ["Nanoparticles have a very high surface area to volume ratio", "so more of the material is available to react", "so smaller amounts can be used"], "dp": ["They have a low surface area to volume ratio", "They are heavier than bulk material", "They need larger amounts to work"], "mand": 0}, {"id": "CHE-02-042", "t": 2, "s": "4.2.4.1", "k": "Calculation", "m": 2, "ht": false, "q": "A cube has sides of 1 cm. A second cube has sides of 0.1 cm.<br/><br/>How does the surface area to volume ratio change?", "a": ["Large cube: 6 ÷ 1 = 6. Small cube: 0.06 ÷ 0.001 = 60 (1)", "The ratio is <b>10 times bigger<\/b> for the small cube (1)"], "cp": ["Large cube: 6 ÷ 1 = 6. Small cube: 0.06 ÷ 0.001 = 60", "The ratio is 10 times bigger for the small cube"], "dp": ["It is 10 times smaller", "It does not change", "It is 100 times bigger"], "mand": 0}, {"id": "CHE-02-043", "t": 2, "s": "4.2.4.2", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two uses<\/b> of nanoparticles.", "a": ["Any two (1 each):", "• <b>medicine<\/b> (drug delivery)", "• <b>sun creams<\/b> and cosmetics", "• <b>deodorants<\/b>", "• <b>catalysts<\/b>", "• <b>electronics<\/b>"], "cp": ["medicine (drug delivery)", "sun creams and cosmetics", "deodorants", "catalysts", "electronics"], "dp": ["Bulk building materials", "Making bricks", "Removing salt from water"], "mand": 0}, {"id": "CHE-02-044", "t": 2, "s": "4.2.4.2", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two concerns<\/b> about using nanoparticles.", "a": ["Any two (1 each):", "• risks to <b>health<\/b> if they enter the body or lungs are not fully known", "• effects on the <b>environment<\/b> are not fully known", "• they may be <b>harmful<\/b> if they get into cells"], "cp": ["risks to health if they enter the body or lungs are not fully known", "effects on the environment are not fully known", "they may be harmful if they get into cells"], "dp": ["They are too expensive to make in bulk", "They are too large to be effective", "They make the product heavier"], "mand": 0}, {"id": "CHE-02-H01", "t": 2, "s": "4.2.2.1", "k": "Explain", "m": 3, "ht": true, "q": "Give <b>three<\/b> limitations of the simple <b>particle model<\/b>.", "a": ["Any three (1 each):", "• it shows <b>no forces<\/b> between particles", "• particles are shown as <b>solid spheres<\/b>", "• particles are shown as <b>inelastic<\/b> (hard) in collisions", "• it does not show the <b>space<\/b> or the real shape of atoms"], "cp": ["it shows no forces between particles", "particles are shown as solid spheres", "particles are shown as inelastic (hard) in collisions", "it does not show the space or the real shape of atoms"], "dp": ["It shows too many forces between particles", "It shows particles that are not moving", "It shows every atom as having a nucleus"], "mand": 0}, {"id": "CHE-03-001", "t": 3, "s": "4.3.1.1", "k": "Explain", "m": 2, "ht": false, "q": "Why is the total mass of the products <b>equal<\/b> to the total mass of the reactants in a chemical reaction?", "a": ["No atoms are <b>made or lost<\/b> in a reaction (1)", "The atoms are just <b>rearranged<\/b> to make new substances (1)"], "cp": ["No atoms are made or lost in a reaction", "The atoms are just rearranged to make new substances"], "dp": ["Atoms are destroyed and new ones made", "Electrons are lost in the reaction", "The products are always lighter"], "mand": 0}, {"id": "CHE-03-002", "t": 3, "s": "4.3.1.1", "k": "Calculation", "m": 1, "ht": false, "q": "6 g of magnesium burns in air to make 10 g of magnesium oxide.<br/><br/>What mass of oxygen reacted?", "a": ["10 - 6 = <b>4 g<\/b> (1)"], "cp": ["10 - 6 = 4 g"], "dp": ["16 g", "6 g", "60 g"], "mand": 0}, {"id": "CHE-03-003", "t": 3, "s": "4.3.1.1", "k": "Recall", "m": 1, "ht": false, "q": "In a balanced symbol equation, what does a <b>big number in front<\/b> of a formula mean?", "a": ["It multiplies <b>everything<\/b> in that formula (the number of units) (1)"], "cp": ["It multiplies everything in that formula (the number of units)"], "dp": ["It changes the formula of the substance", "It shows how many atoms are in one molecule only", "It is the mass in grams"], "mand": 0}, {"id": "CHE-03-004", "t": 3, "s": "4.3.1.2", "k": "Definition", "m": 1, "ht": false, "q": "What is the <b>relative formula mass<\/b> (M<sub>r<\/sub>) of a compound?", "a": ["The <b>sum<\/b> of the relative atomic masses (A<sub>r<\/sub>) of all the atoms in the formula (1)"], "cp": ["The sum of the relative atomic masses (A<sub>r<\/sub>) of all the atoms in the formula"], "dp": ["The number of protons in the compound", "The mass of one atom of the compound in grams", "The highest A<sub>r<\/sub> in the formula"], "mand": 0}, {"id": "CHE-03-005", "t": 3, "s": "4.3.1.2", "k": "Calculation", "m": 2, "ht": false, "q": "Calculate the M<sub>r<\/sub> of <b>calcium carbonate<\/b>, CaCO<sub>3<\/sub>.<br/>(A<sub>r<\/sub>: Ca = 40, C = 12, O = 16)", "a": ["40 + 12 + (3 × 16) (1)", "= <b>100<\/b> (1)"], "cp": ["40 + 12 + (3 × 16)", "= 100"], "dp": ["68", "84", "116"], "mand": 0}, {"id": "CHE-03-006", "t": 3, "s": "4.3.1.2", "k": "Calculation", "m": 2, "ht": false, "q": "Calculate the M<sub>r<\/sub> of <b>magnesium chloride<\/b>, MgCl<sub>2<\/sub>.<br/>(A<sub>r<\/sub>: Mg = 24, Cl = 35.5)", "a": ["24 + (2 × 35.5) (1)", "= <b>95<\/b> (1)"], "cp": ["24 + (2 × 35.5)", "= 95"], "dp": ["59.5", "83", "130"], "mand": 0}, {"id": "CHE-03-007", "t": 3, "s": "4.3.1.2", "k": "Calculation", "m": 2, "ht": false, "q": "Calculate the M<sub>r<\/sub> of <b>sulfuric acid<\/b>, H<sub>2<\/sub>SO<sub>4<\/sub>.<br/>(A<sub>r<\/sub>: H = 1, S = 32, O = 16)", "a": ["(2 × 1) + 32 + (4 × 16) (1)", "= <b>98<\/b> (1)"], "cp": ["(2 × 1) + 32 + (4 × 16)", "= 98"], "dp": ["50", "82", "99"], "mand": 0}, {"id": "CHE-03-008", "t": 3, "s": "4.3.1.2", "k": "Calculation", "m": 2, "ht": false, "q": "Calculate the M<sub>r<\/sub> of <b>calcium hydroxide<\/b>, Ca(OH)<sub>2<\/sub>.<br/>(A<sub>r<\/sub>: Ca = 40, O = 16, H = 1)", "a": ["40 + 2 × (16 + 1) (1)", "= <b>74<\/b> (1)"], "cp": ["40 + 2 × (16 + 1)", "= 74"], "dp": ["57", "58", "114"], "mand": 0}, {"id": "CHE-03-009", "t": 3, "s": "4.3.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the <b>percentage by mass of magnesium<\/b> in magnesium oxide, MgO.<br/>(A<sub>r<\/sub>: Mg = 24, O = 16)", "a": ["M<sub>r<\/sub> of MgO = 24 + 16 = 40 (1)", "24 ÷ 40 × 100 (1)", "= <b>60%<\/b> (1)"], "cp": ["M<sub>r<\/sub> of MgO = 24 + 16 = 40", "24 ÷ 40 × 100", "= 60%"], "dp": ["40%", "24%", "66.7%"], "mand": 0}, {"id": "CHE-03-010", "t": 3, "s": "4.3.1.2", "k": "Calculation", "m": 3, "ht": false, "q": "Calculate the <b>percentage by mass of iron<\/b> in iron(III) oxide, Fe<sub>2<\/sub>O<sub>3<\/sub>.<br/>(A<sub>r<\/sub>: Fe = 56, O = 16)", "a": ["M<sub>r<\/sub> = (2 × 56) + (3 × 16) = 160 (1)", "112 ÷ 160 × 100 (1)", "= <b>70%<\/b> (1)"], "cp": ["M<sub>r<\/sub> = (2 × 56) + (3 × 16) = 160", "112 ÷ 160 × 100", "= 70%"], "dp": ["35%", "30%", "56%"], "mand": 0}, {"id": "CHE-03-011", "t": 3, "s": "4.3.1.3", "k": "Explain", "m": 2, "ht": false, "q": "A student burns magnesium in an open crucible. The mass of the solid <b>increases<\/b>. Explain why.", "a": ["Magnesium <b>reacts with oxygen<\/b> from the air (1)", "to make magnesium oxide, so the solid gains the <b>mass of the oxygen<\/b> (1)"], "cp": ["Magnesium reacts with oxygen from the air", "to make magnesium oxide, so the solid gains the mass of the oxygen"], "dp": ["Magnesium gains mass because atoms are created", "The magnesium oxide is lighter than magnesium", "Heat has mass and is added"], "mand": 0}, {"id": "CHE-03-012", "t": 3, "s": "4.3.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Calcium carbonate is heated in an open container and its mass <b>decreases<\/b>. Explain why.", "a": ["It breaks down (thermal decomposition) to make <b>carbon dioxide<\/b> gas (1)", "The gas <b>escapes<\/b> into the air, so the solid left has less mass (1)"], "cp": ["It breaks down (thermal decomposition) to make carbon dioxide gas", "The gas escapes into the air, so the solid left has less mass"], "dp": ["Atoms are destroyed when it is heated", "Oxygen is taken in from the air", "Calcium oxide is heavier than calcium carbonate"], "mand": 0}, {"id": "CHE-03-013", "t": 3, "s": "4.3.1.4", "k": "Calculation", "m": 3, "ht": false, "q": "A student repeats a titration and gets: 24.2, 24.6 and 24.4 cm<sup>3<\/sup>.<br/><br/>Find the <b>mean<\/b> and the <b>uncertainty<\/b> (range about the mean).", "a": ["Mean = (24.2 + 24.6 + 24.4) ÷ 3 = <b>24.4<\/b> cm<sup>3<\/sup> (1)", "Range = 24.2 to 24.6 (1)", "Uncertainty = <b>± 0.2<\/b> cm<sup>3<\/sup> (1)"], "cp": ["Mean = (24.2 + 24.6 + 24.4) ÷ 3 = 24.4 cm<sup>3<\/sup>", "Range = 24.2 to 24.6", "Uncertainty = ± 0.2 cm<sup>3<\/sup>"], "dp": ["Mean = 24.6", "Uncertainty = ± 0.4", "Mean = 24.2"], "mand": 0}, {"id": "CHE-03-014", "t": 3, "s": "4.3.2.5", "k": "Definition", "m": 1, "ht": false, "q": "Which units are often used for <b>concentration<\/b> of a solution?", "a": ["<b>g/dm<sup>3<\/sup><\/b> (grams of solute per dm<sup>3<\/sup> of solution) (1)"], "cp": ["g/dm<sup>3<\/sup> (grams of solute per dm<sup>3<\/sup> of solution)"], "dp": ["g/cm", "mol/s", "dm<sup>3<\/sup>/g"], "mand": 0}, {"id": "CHE-03-015", "t": 3, "s": "4.3.2.5", "k": "Calculation", "m": 2, "ht": false, "q": "1 dm<sup>3<\/sup> equals how many cm<sup>3<\/sup>? Convert 250 cm<sup>3<\/sup> to dm<sup>3<\/sup>.", "a": ["1 dm<sup>3<\/sup> = <b>1000 cm<sup>3<\/sup><\/b> (1)", "250 cm<sup>3<\/sup> = <b>0.25 dm<sup>3<\/sup><\/b> (1)"], "cp": ["1 dm<sup>3<\/sup> = 1000 cm<sup>3<\/sup>", "250 cm<sup>3<\/sup> = 0.25 dm<sup>3<\/sup>"], "dp": ["1 dm<sup>3<\/sup> = 100 cm<sup>3<\/sup>", "250 cm<sup>3<\/sup> = 2.5 dm<sup>3<\/sup>", "250 cm<sup>3<\/sup> = 0.025 dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-03-016", "t": 3, "s": "4.3.2.5", "k": "Calculation", "m": 2, "ht": false, "q": "40 g of sugar is dissolved to make 500 cm<sup>3<\/sup> of solution.<br/><br/>Calculate the concentration in g/dm<sup>3<\/sup>.", "a": ["500 cm<sup>3<\/sup> = 0.5 dm<sup>3<\/sup> (1)", "40 ÷ 0.5 = <b>80 g/dm<sup>3<\/sup><\/b> (1)"], "cp": ["500 cm<sup>3<\/sup> = 0.5 dm<sup>3<\/sup>", "40 ÷ 0.5 = 80 g/dm<sup>3<\/sup>"], "dp": ["20 g/dm<sup>3<\/sup>", "8 g/dm<sup>3<\/sup>", "40 g/dm<sup>3<\/sup>"], "mand": 0}, {"id": "CHE-03-017", "t": 3, "s": "4.3.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three<\/b> reasons why the <b>yield<\/b> of a reaction is less than 100%.", "a": ["Any three (1 each):", "• the reaction is <b>reversible<\/b> (does not go to completion)", "• some product is <b>lost<\/b> when separating (filtering, transferring)", "• <b>side reactions<\/b> make other products", "• some reactant may not react"], "cp": ["the reaction is reversible (does not go to completion)", "some product is lost when separating (filtering, transferring)", "side reactions make other products", "some reactant may not react"], "dp": ["Atoms are destroyed during the reaction", "The mass of the products is always greater", "The reactants are too pure"], "mand": 0}, {"id": "CHE-03-018", "t": 3, "s": "4.3.3.1", "k": "Calculation", "m": 2, "ht": false, "q": "A reaction should make 10.0 g of product. Only 8.5 g is made.<br/><br/>Calculate the <b>percentage yield<\/b>.", "a": ["actual ÷ maximum × 100 = 8.5 ÷ 10 × 100 (1)", "= <b>85%<\/b> (1)"], "cp": ["actual ÷ maximum × 100 = 8.5 ÷ 10 × 100", "= 85%"], "dp": ["15%", "1.18%", "118%"], "mand": 0}, {"id": "CHE-03-019", "t": 3, "s": "4.3.3.1", "k": "Calculation", "m": 2, "ht": false, "q": "The maximum mass of product is 25 g. A student collects 20 g.<br/><br/>Calculate the percentage yield.", "a": ["20 ÷ 25 × 100 (1)", "= <b>80%<\/b> (1)"], "cp": ["20 ÷ 25 × 100", "= 80%"], "dp": ["125%", "20%", "5%"], "mand": 0}, {"id": "CHE-03-020", "t": 3, "s": "4.3.3.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>atom economy<\/b>? Why is a high atom economy useful?", "a": ["How much of the <b>starting materials<\/b> end up as the <b>desired product<\/b> (1)", "A high value means <b>less waste<\/b>, saving resources and cost (1)"], "cp": ["How much of the starting materials end up as the desired product", "A high value means less waste, saving resources and cost"], "dp": ["The yield of the reaction", "The mass of waste made", "The speed of the reaction"], "mand": 0}, {"id": "CHE-03-021", "t": 3, "s": "4.3.3.
