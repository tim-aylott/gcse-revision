tic cracking: heated and passed over a hot catalyst", "Steam cracking: heated with steam at a high temperature"], "dp": ["Fractional distillation and filtration", "Cracking using ultraviolet light", "Cracking by cooling and compressing"], "mand": 0}, {"id": "CHE-07-014", "t": 7, "s": "4.7.1.4", "k": "Explain", "m": 2, "ht": false, "q": "Cracking decane: C<sub>10<\/sub>H<sub>22<\/sub> → C<sub>8<\/sub>H<sub>18<\/sub> + X. Give the <b>formula of X<\/b> and name its type.", "a": ["X = <b>C<sub>2<\/sub>H<sub>4<\/sub><\/b> (1)", "It is an <b>alkene<\/b> (ethene) (1)"], "cp": ["X = C<sub>2<\/sub>H<sub>4<\/sub>", "It is an alkene (ethene)"], "dp": ["C<sub>2<\/sub>H<sub>6<\/sub>, an alkane", "C<sub>2<\/sub>H<sub>2<\/sub>, an alkane", "C<sub>2<\/sub>H<sub>5<\/sub>, an alkene"], "mand": 0}, {"id": "CHE-07-015", "t": 7, "s": "4.7.1.4", "k": "Recall", "m": 2, "ht": false, "q": "How do you test for an <b>alkene<\/b>? What is the result?", "a": ["Shake with <b>bromine water<\/b> (1)", "It changes from <b>orange to colourless<\/b> (1)"], "cp": ["Shake with bromine water", "It changes from orange to colourless"], "dp": ["Add limewater, turns milky", "Use a glowing splint", "Bromine water stays orange"], "mand": 0}, {"id": "CHE-07-016", "t": 7, "s": "4.7.1.4", "k": "Compare", "m": 2, "ht": false, "q": "Give <b>two differences<\/b> between alkanes and alkenes.", "a": ["Any two (1 each):", "• alkenes have a <b>C=C double bond<\/b>; alkanes only have single bonds", "• alkenes are <b>more reactive<\/b>", "• alkenes <b>decolourise bromine water<\/b>; alkanes do not", "• alkenes are <b>unsaturated<\/b>"], "cp": ["alkenes have a C=C double bond; alkanes only have single bonds", "alkenes are more reactive", "alkenes decolourise bromine water; alkanes do not", "alkenes are unsaturated"], "dp": ["Alkanes have a double bond", "Alkenes are less reactive", "Alkanes decolourise bromine water"], "mand": 0}, {"id": "CHE-07-017", "t": 7, "s": "4.7.2.1", "k": "Definition", "m": 2, "ht": false, "q": "What does <b>unsaturated<\/b> mean? Give the general formula of alkenes.", "a": ["A molecule with a <b>C=C double bond<\/b> (1)", "Alkenes: <b>C<sub>n<\/sub>H<sub>2n<\/sub><\/b> (1)"], "cp": ["A molecule with a C=C double bond", "Alkenes: C<sub>n<\/sub>H<sub>2n<\/sub>"], "dp": ["A molecule with only single bonds", "C<sub>n<\/sub>H<sub>2n+2<\/sub>", "A molecule with no hydrogen"], "mand": 0}, {"id": "CHE-07-018", "t": 7, "s": "4.7.2.1", "k": "Recall", "m": 2, "ht": false, "q": "Name the first <b>four alkenes<\/b>. Give the formula of ethene.", "a": ["<b>Ethene, propene, butene, pentene<\/b> (1)", "Ethene = <b>C<sub>2<\/sub>H<sub>4<\/sub><\/b> (1)"], "cp": ["Ethene, propene, butene, pentene", "Ethene = C<sub>2<\/sub>H<sub>4<\/sub>"], "dp": ["Methene, ethene, propene, butene", "Ethane, propane, butane, pentane", "Ethene = C<sub>2<\/sub>H<sub>6<\/sub>"], "mand": 0}, {"id": "CHE-07-019", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Why do alkenes burn with a <b>smoky flame<\/b>?", "a": ["<b>Incomplete combustion<\/b> happens (1)", "because alkenes have a <b>higher proportion of carbon<\/b>, making soot (carbon) (1)"], "cp": ["Incomplete combustion happens", "because alkenes have a higher proportion of carbon, making soot (carbon)"], "dp": ["They burn completely", "They contain no carbon", "They contain more hydrogen than alkanes"], "mand": 0}, {"id": "CHE-07-020", "t": 7, "s": "4.7.2.2", "k": "Recall", "m": 3, "ht": false, "q": "Name the product of the <b>addition reaction<\/b> of ethene with: hydrogen, water (steam) and bromine.", "a": ["Hydrogen: <b>ethane<\/b> (1)", "Water: <b>ethanol<\/b> (1)", "Bromine: <b>1,2-dibromoethane<\/b> (1)"], "cp": ["Hydrogen: ethane", "Water: ethanol", "Bromine: 1,2-dibromoethane"], "dp": ["Hydrogen: methane", "Water: ethanoic acid", "Bromine: bromoethene"], "mand": 0}, {"id": "CHE-07-021", "t": 7, "s": "4.7.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Why is the reaction of an alkene with bromine called an <b>addition<\/b> reaction?", "a": ["The <b>C=C double bond opens<\/b> (becomes a single bond) (1)", "and the atoms <b>add on<\/b>, with only one product made (1)"], "cp": ["The C=C double bond opens (becomes a single bond)", "and the atoms add on, with only one product made"], "dp": ["Two products are made", "A water molecule is lost", "The C=C bond is made from a single bond"], "mand": 0}, {"id": "CHE-07-022", "t": 7, "s": "4.7.2.2", "k": "Recall", "m": 2, "ht": false, "q": "What <b>conditions<\/b> are used to add hydrogen to an alkene?", "a": ["A <b>nickel catalyst<\/b> (1)", "at about <b>60 °C<\/b> (a raised temperature) (1)"], "cp": ["A nickel catalyst", "at about 60 °C (a raised temperature)"], "dp": ["A cold room with no catalyst", "A platinum catalyst at 1000 °C", "An iron catalyst at 450 °C"], "mand": 0}, {"id": "CHE-07-023", "t": 7, "s": "4.7.2.3", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>functional group<\/b> in alcohols? Name the first four alcohols.", "a": ["<b>–OH<\/b> (1)", "<b>Methanol, ethanol, propanol, butanol<\/b> (1)"], "cp": ["–OH", "Methanol, ethanol, propanol, butanol"], "dp": ["–COOH", "–C=C–", "Methane, ethane, propane, butane"], "mand": 0}, {"id": "CHE-07-024", "t": 7, "s": "4.7.2.3", "k": "Recall", "m": 3, "ht": false, "q": "Describe what alcohols do when added to: <b>sodium<\/b>, <b>water<\/b> and <b>air (burning)<\/b>.", "a": ["With sodium: <b>fizzing<\/b> as hydrogen is made (1)", "In water: they <b>dissolve<\/b> to give a neutral solution (1)", "In air: they <b>burn<\/b> to make carbon dioxide and water (1)"], "cp": ["With sodium: fizzing as hydrogen is made", "In water: they dissolve to give a neutral solution", "In air: they burn to make carbon dioxide and water"], "dp": ["With sodium: no reaction", "They do not dissolve in water", "They do not burn in air"], "mand": 0}, {"id": "CHE-07-025", "t": 7, "s": "4.7.2.3", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two uses<\/b> of alcohols.", "a": ["Any two (1 each):", "• <b>fuels<\/b>", "• <b>solvents<\/b>", "• <b>alcoholic drinks<\/b> (ethanol)", "• making other chemicals"], "cp": ["fuels", "solvents", "alcoholic drinks (ethanol)", "making other chemicals"], "dp": ["Making polymers by addition", "Making metals", "Making soaps only"], "mand": 0}, {"id": "CHE-07-026", "t": 7, "s": "4.7.2.3", "k": "Recall", "m": 3, "ht": false, "q": "Describe how <b>ethanol<\/b> is made by <b>fermentation<\/b>.", "a": ["Sugar solution is mixed with <b>yeast<\/b> (1)", "Kept <b>warm<\/b> (about 30 to 40 °C) with <b>no oxygen<\/b> (anaerobic) (1)", "Sugar → ethanol + <b>carbon dioxide<\/b> (1)"], "cp": ["Sugar solution is mixed with yeast", "Kept warm (about 30 to 40 °C) with no oxygen (anaerobic)", "Sugar → ethanol + carbon dioxide"], "dp": ["Kept at 450 °C with a catalyst", "Oxygen is bubbled through", "The yeast is boiled"], "mand": 0}, {"id": "CHE-07-027", "t": 7, "s": "4.7.2.3", "k": "Recall", "m": 2, "ht": false, "q": "What happens when an alcohol is added to an <b>oxidising agent<\/b>?", "a": ["It is <b>oxidised<\/b> (1)", "to a <b>carboxylic acid<\/b> (for example ethanol becomes ethanoic acid) (1)"], "cp": ["It is oxidised", "to a carboxylic acid (for example ethanol becomes ethanoic acid)"], "dp": ["It is reduced to an alkane", "It forms an alkene", "Nothing happens"], "mand": 0}, {"id": "CHE-07-028", "t": 7, "s": "4.7.2.4", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>functional group<\/b> in carboxylic acids? Name the first four.", "a": ["<b>–COOH<\/b> (1)", "<b>Methanoic, ethanoic, propanoic, butanoic<\/b> acid (1)"], "cp": ["–COOH", "Methanoic, ethanoic, propanoic, butanoic acid"], "dp": ["–OH", "–C=C–", "Methanol, ethanol, propanol, butanol"], "mand": 0}, {"id": "CHE-07-029", "t": 7, "s": "4.7.2.4", "k": "Recall", "m": 2, "ht": false, "q": "What happens when a carboxylic acid reacts with a <b>carbonate<\/b>?", "a": ["A <b>salt<\/b>, <b>water<\/b> and <b>carbon dioxide<\/b> are made (1)", "Fizzing is seen (1)"], "cp": ["A salt, water and carbon dioxide are made", "Fizzing is seen"], "dp": ["Hydrogen gas is made", "No reaction", "An ester is made only"], "mand": 0}, {"id": "CHE-07-030", "t": 7, "s": "4.7.2.4", "k": "Explain", "m": 2, "ht": false, "q": "Why are carboxylic acids <b>weak acids<\/b>?", "a": ["They are only <b>partly ionised<\/b> (1)", "in water, so they have a <b>higher pH<\/b> than a strong acid of the same concentration (1)"], "cp": ["They are only partly ionised", "in water, so they have a higher pH than a strong acid of the same concentration"], "dp": ["They are fully ionised", "They have a pH below 0", "They contain no hydrogen"], "mand": 0}, {"id": "CHE-07-031", "t": 7, "s": "4.7.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Describe <b>addition polymerisation<\/b>.", "a": ["Many <b>small molecules (monomers)<\/b> join together (1)", "The monomers have a <b>C=C double bond<\/b>, which opens (1)", "The polymer is the <b>only product<\/b>; the repeating unit has the same atoms as the monomer (1)"], "cp": ["Many small molecules (monomers) join together", "The monomers have a C=C double bond, which opens", "The polymer is the only product; the repeating unit has the same atoms as the monomer"], "dp": ["A small molecule is lost each time", "The monomers need two functional groups", "Monomers are alkanes"], "mand": 0}, {"id": "CHE-07-032", "t": 7, "s": "4.7.3.1", "k": "Recall", "m": 2, "ht": false, "q": "Name the <b>monomer<\/b> of poly(ethene) and give the formula of its repeating unit.", "a": ["Monomer = <b>ethene<\/b> (1)", "Repeating unit: <b>–CH<sub>2<\/sub>–CH<sub>2<\/sub>–<\/b> (1)"], "cp": ["Monomer = ethene", "Repeating unit: –CH<sub>2<\/sub>–CH<sub>2<\/sub>–"], "dp": ["Monomer = ethane", "Monomer = propene", "Repeating unit: –CH<sub>3<\/sub>–CH<sub>3<\/sub>–"], "mand": 0}, {"id": "CHE-07-033", "t": 7, "s": "4.7.3.1", "k": "Explain", "m": 2, "ht": false, "q": "Draw or describe the <b>repeating unit<\/b> of poly(propene) from propene (CH<sub>3<\/sub>CH=CH<sub>2<\/sub>).", "a": ["The C=C becomes a <b>single bond<\/b> (1)", "The unit is <b>–CH(CH<sub>3<\/sub>)–CH<sub>2<\/sub>–<\/b> with bonds going out each end (1)"], "cp": ["The C=C becomes a single bond", "The unit is –CH(CH<sub>3<\/sub>)–CH<sub>2<\/sub>– with bonds going out each end"], "dp": ["A unit with a C=C bond", "–CH<sub>3<\/sub>–CH<sub>3<\/sub>–CH<sub>2<\/sub>–", "The CH<sub>3<\/sub> group is lost"], "mand": 0}, {"id": "CHE-07-034", "t": 7, "s": "4.7.3.4", "k": "Recall", "m": 2, "ht": false, "q": "What is <b>DNA<\/b>? What are its <b>monomers<\/b>?", "a": ["A <b>polymer<\/b> carrying the genetic code (instructions) (1)", "The monomers are <b>nucleotides<\/b> (four different ones), forming a <b>double helix<\/b> (1)"], "cp": ["A polymer carrying the genetic code (instructions)", "The monomers are nucleotides (four different ones), forming a double helix"], "dp": ["A small molecule used as a fuel", "Its monomers are amino acids", "Its monomers are glucose"], "mand": 0}, {"id": "CHE-07-035", "t": 7, "s": "4.7.3.4", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>monomers<\/b> of proteins, starch and cellulose.", "a": ["Proteins: <b>amino acids<\/b> (1)", "Starch: <b>sugars (glucose)<\/b> (1)", "Cellulose: <b>sugars (glucose)<\/b> (1)"], "cp": ["Proteins: amino acids", "Starch: sugars (glucose)", "Cellulose: sugars (glucose)"], "dp": ["Proteins: nucleotides", "Starch: amino acids", "Cellulose: fatty acids"], "mand": 0}, {"id": "CHE-07-H01", "t": 7, "s": "4.7.2.4", "k": "Explain", "m": 2, "ht": true, "q": "Name the <b>product<\/b> when ethanoic acid reacts with ethanol, and what catalyst is used.", "a": ["<b>Ethyl ethanoate<\/b> (an ester) (1)", "An <b>acid catalyst<\/b> (for example sulfuric acid) (1)"], "cp": ["Ethyl ethanoate (an ester)", "An acid catalyst (for example sulfuric acid)"], "dp": ["Ethanol and ethanoic acid", "Ethyl methanoate", "Ethene and water"], "mand": 0}, {"id": "CHE-07-H02", "t": 7, "s": "4.7.3.2", "k": "Explain", "m": 3, "ht": true, "q": "Describe <b>condensation polymerisation<\/b> to make a polyester.", "a": ["<b>Two different monomers<\/b>, each with <b>two functional groups<\/b> (a diol and a dicarboxylic acid) (1)", "The groups react and a <b>small molecule (water)<\/b> is lost each time (1)", "Many units join to form a <b>polymer<\/b> with ester links (1)"], "cp": ["Two different monomers, each with two functional groups (a diol and a dicarboxylic acid)", "The groups react and a small molecule (water) is lost each time", "Many units join to form a polymer with ester links"], "dp": ["A single monomer with a C=C bond", "No molecule is lost", "The polymer is the only product"], "mand": 0}, {"id": "CHE-07-H03", "t": 7, "s": "4.7.3.2", "k": "Compare", "m": 2, "ht": true, "q": "Give <b>two differences<\/b> between addition and condensation polymerisation.", "a": ["Addition: monomers have a <b>C=C<\/b>; condensation: monomers have <b>two functional groups<\/b> (1)", "Addition makes <b>only the polymer<\/b>; condensation also makes a <b>small molecule<\/b> such as water (1)"], "cp": ["Addition: monomers have a C=C; condensation: monomers have two functional groups", "Addition makes only the polymer; condensation also makes a small molecule such as water"], "dp": ["Addition makes two products", "Condensation monomers have C=C bonds", "Addition loses water"], "mand": 0}, {"id": "CHE-07-H04", "t": 7, "s": "4.7.3.3", "k": "Explain", "m": 3, "ht": true, "q": "What are <b>amino acids<\/b>? How do they form proteins?", "a": ["Molecules with <b>two different functional groups<\/b>: –NH<sub>2<\/sub> and –COOH (1)", "They join by <b>condensation polymerisation<\/b>, losing water (1)", "Forming <b>polypeptides<\/b> and then proteins (1)"], "cp": ["Molecules with two different functional groups: –NH<sub>2<\/sub> and –COOH", "They join by condensation polymerisation, losing water", "Forming polypeptides and then proteins"], "dp": ["Molecules with a C=C bond", "They join by addition polymerisation", "Only one functional group"], "mand": 0}, {"id": "CHE-08-001", "t": 8, "s": "4.8.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>pure substance<\/b> in chemistry? How is it different from the everyday meaning?", "a": ["A <b>single element or compound<\/b> with nothing else mixed in (1)", "In everyday use \"pure\" often just means <b>natural or additive-free<\/b> (1)"], "cp": ["A single element or compound with nothing else mixed in", "In everyday use \"pure\" often just means natural or additive-free"], "dp": ["A mixture of two elements", "Anything that comes from nature", "A substance that melts over a range of temperatures"], "mand": 0}, {"id": "CHE-08-002", "t": 8, "s": "4.8.1.1", "k": "Explain", "m": 2, "ht": false, "q": "How can <b>melting point<\/b> show if a substance is pure?", "a": ["A pure substance melts at a <b>sharp, specific temperature<\/b> (1)", "An impure substance melts <b>over a range<\/b> and at a lower temperature (1)"], "cp": ["A pure substance melts at a sharp, specific temperature", "An impure substance melts over a range and at a lower temperature"], "dp": ["A pure substance melts over a range of temperatures", "An impure substance has a sharp melting point", "Melting point never helps"], "mand": 0}, {"id": "CHE-08-003", "t": 8, "s": "4.8.1.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>formulation<\/b>? Give an example.", "a": ["A mixture <b>designed<\/b> as a useful product, made from <b>measured quantities<\/b> of components (1)", "Examples: <b>fuels, paints, medicines, alloys, fertilisers, foods, cleaning products<\/b> (1)"], "cp": ["A mixture designed as a useful product, made from measured quantities of components", "Examples: fuels, paints, medicines, alloys, fertilisers, foods, cleaning products"], "dp": ["A pure compound", "A random mixture", "An element made in a lab"], "mand": 0}, {"id": "CHE-08-004", "t": 8, "s": "4.8.1.3", "k": "Recall", "m": 2, "ht": false, "q": "In chromatography, what are the <b>mobile phase<\/b> and <b>stationary phase<\/b>?", "a": ["Mobile phase = the <b>solvent<\/b> that moves (1)", "Stationary phase = the <b>paper<\/b> (or other solid) that does not move (1)"], "cp": ["Mobile phase = the solvent that moves", "Stationary phase = the paper (or other solid) that does not move"], "dp": ["Mobile phase = the paper", "Stationary phase = the solvent", "Mobile phase = the spots"], "mand": 0}, {"id": "CHE-08-005", "t": 8, "s": "4.8.1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>paper chromatography<\/b> separates a mixture of dyes.", "a": ["Different substances have <b>different solubilities<\/b> in the solvent and <b>attraction to the paper<\/b> (1)", "They <b>move up the paper at different rates<\/b> (1)", "Giving <b>separate spots<\/b> at different heights (1)"], "cp": ["Different substances have different solubilities in the solvent and attraction to the paper", "They move up the paper at different rates", "Giving separate spots at different heights"], "dp": ["The dyes are separated by their boiling points", "The dyes are separated by mass only", "All the dyes travel the same distance"], "mand": 0}, {"id": "CHE-08-006", "t": 8, "s": "4.8.1.3", "k": "Recall", "m": 1, "ht": false, "q": "Write the equation for <b>R<sub>f<\/sub><\/b>.", "a": ["<b>R<sub>f<\/sub> = distance moved by substance ÷ distance moved by solvent<\/b> (1)"], "cp": ["R<sub>f<\/sub> = distance moved by substance ÷ distance moved by solvent"], "dp": ["R<sub>f<\/sub> = distance moved by solvent ÷ distance moved by substance", "R<sub>f<\/sub> = time × distance", "R<sub>f<\/sub> = mass ÷ volume"], "mand": 0}, {"id": "CHE-08-007", "t": 8, "s": "4.8.1.3", "k": "Calculation", "m": 2, "ht": false, "q": "A spot moves 3.0 cm. The solvent moves 5.0 cm.<br/><br/>Calculate the R<sub>f<\/sub> value.", "a": ["3.0 ÷ 5.0 (1)", "= <b>0.6<\/b> (1)"], "cp": ["3.0 ÷ 5.0", "= 0.6"], "dp": ["1.67", "0.06", "2.0"], "mand": 0}, {"id": "CHE-08-008", "t": 8, "s": "4.8.1.3", "k": "Practical", "m": 5, "ht": false, "q": "Describe how to carry out <b>paper chromatography<\/b> of an ink.", "a": ["Draw a <b>pencil line<\/b> near the bottom of the paper (1)", "Put a <b>spot of ink<\/b> on the line (1)", "Place the paper in a beaker with <b>solvent below the line<\/b> (1)", "Remove when the solvent is near the top and mark the <b>solvent front<\/b> (1)", "Measure distances and calculate <b>R<sub>f<\/sub> values<\/b> (1)"], "cp": ["Draw a pencil line near the bottom of the paper", "Put a spot of ink on the line", "Place the paper in a beaker with solvent below the line", "Remove when the solvent is near the top and mark the solvent front", "Measure distances and calculate R<sub>f<\/sub> values"], "dp": ["Use a pen line so it can be seen", "Put the ink spot below the water level", "Leave it until the solvent has evaporated"], "mand": 0}, {"id": "CHE-08-009", "t": 8, "s": "4.8.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Why is the starting line drawn in <b>pencil<\/b> and above the solvent?", "a": ["Pencil does <b>not dissolve<\/b> in the solvent (1)", "The spot must be <b>above the solvent<\/b> or the ink would wash into it (1)"], "cp": ["Pencil does not dissolve in the solvent", "The spot must be above the solvent or the ink would wash into it"], "dp": ["Pencil dissolves and gives a clear line", "The line should be underwater", "Pen shows up better"], "mand": 0}, {"id": "CHE-08-010", "t": 8, "s": "4.8.1.3", "k": "Data", "m": 2, "ht": false, "q": "A chromatogram of an ink shows <b>three spots<\/b>. What does this tell you? How can you tell if a substance is pure?", "a": ["The ink is a <b>mixture<\/b> of at least three dyes (1)", "A <b>pure<\/b> substance gives a <b>single spot<\/b> (1)"], "cp": ["The ink is a mixture of at least three dyes", "A pure substance gives a single spot"], "dp": ["The ink is pure", "A pure substance gives several spots", "Three spots mean three solvents"], "mand": 0}, {"id": "CHE-08-011", "t": 8, "s": "4.8.2.1", "k": "Recall", "m": 2, "ht": false, "q": "How do you test for <b>hydrogen<\/b>? What is the result?", "a": ["Hold a <b>lit splint<\/b> at the mouth of the test tube (1)", "A <b>squeaky pop<\/b> is heard (1)"], "cp": ["Hold a lit splint at the mouth of the test tube", "A squeaky pop is heard"], "dp": ["A glowing splint relights", "Limewater turns milky", "Damp litmus paper is bleached"], "mand": 0}, {"id": "CHE-08-012", "t": 8, "s": "4.8.2.2", "k": "Recall", "m": 2, "ht": false, "q": "How do you test for <b>oxygen<\/b>? What is the result?", "a": ["Put a <b>glowing splint<\/b> into the gas (1)", "The splint <b>relights<\/b> (1)"], "cp": ["Put a glowing splint into the gas", "The splint relights"], "dp": ["A lit splint gives a squeaky pop", "Limewater turns milky", "Damp litmus paper turns white"], "mand": 0}, {"id": "CHE-08-013", "t": 8, "s": "4.8.2.3", "k": "Recall", "m": 2, "ht": false, "q": "How do you test for <b>carbon dioxide<\/b>? What is the result?", "a": ["Bubble through <b>limewater<\/b> (calcium hydroxide solution) (1)", "It turns <b>milky (cloudy)<\/b> (1)"], "cp": ["Bubble through limewater (calcium hydroxide solution)", "It turns milky (cloudy)"], "dp": ["A glowing splint relights", "A lit splint gives a squeaky pop", "Damp litmus paper is bleached"], "mand": 0}, {"id": "CHE-08-014", "t": 8, "s": "4.8.2.4", "k": "Recall", "m": 2, "ht": false, "q": "How do you test for <b>chlorine<\/b>? What is the result?", "a": ["Hold <b>damp litmus paper<\/b> in the gas (1)", "It is <b>bleached white<\/b> (1)"], "cp": ["Hold damp litmus paper in the gas", "It is bleached white"], "dp": ["A lit splint gives a squeaky pop", "It turns limewater milky", "A glowing splint relights"], "mand": 0}, {"id": "CHE-08-015", "t": 8, "s": "4.8.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>flame test<\/b> colours for lithium, sodium and potassium.", "a": ["Lithium = <b>crimson<\/b> (1)", "Sodium = <b>yellow<\/b> (1)", "Potassium = <b>lilac<\/b> (1)"], "cp": ["Lithium = crimson", "Sodium = yellow", "Potassium = lilac"], "dp": ["Lithium = yellow", "Sodium = lilac", "Potassium = crimson"], "mand": 0}, {"id": "CHE-08-016", "t": 8, "s": "4.8.3.1", "k": "Recall", "m": 2, "ht": false, "q": "Give the flame test colours for <b>calcium<\/b> and <b>copper<\/b> ions.", "a": ["Calcium = <b>orange-red<\/b> (1)", "Copper = <b>green<\/b> (1)"], "cp": ["Calcium = orange-red", "Copper = green"], "dp": ["Calcium = green", "Copper = orange-red", "Calcium = lilac"], "mand": 0}, {"id": "CHE-08-017", "t": 8, "s": "4.8.3.1", "k": "Practical", "m": 3, "ht": false, "q": "Describe how to carry out a <b>flame test<\/b>.", "a": ["Clean a <b>nichrome wire loop<\/b> in acid and hold it in the flame (1)", "Dip it in the <b>sample<\/b> (1)", "Hold it in a <b>blue Bunsen flame<\/b> and note the colour (1)"], "cp": ["Clean a nichrome wire loop in acid and hold it in the flame", "Dip it in the sample", "Hold it in a blue Bunsen flame and note the colour"], "dp": ["Use a paper loop", "Hold the sample in a yellow flame", "Add the sample to water and look at the colour"], "mand": 0}, {"id": "CHE-08-018", "t": 8, "s": "4.8.3.1", "k": "Explain", "m": 1, "ht": false, "q": "Why can a flame test be unreliable for a <b>mixture<\/b> of ions?", "a": ["Some colours can <b>mask<\/b> others, so one ion may not be seen (1)"], "cp": ["Some colours can mask others, so one ion may not be seen"], "dp": ["All ions give the same colour", "Mixtures cannot burn", "Only metals are in mixtures"], "mand": 0}, {"id": "CHE-08-019", "t": 8, "s": "4.8.3.2", "k": "Recall", "m": 3, "ht": false, "q": "What colour precipitate does sodium hydroxide give with: <b>copper(II)<\/b>, <b>iron(II)<\/b> and <b>iron(III)<\/b> ions?", "a": ["Copper(II) = <b>blue<\/b> (1)", "Iron(II) = <b>green<\/b> (1)", "Iron(III) = <b>brown<\/b> (1)"], "cp": ["Copper(II) = blue", "Iron(II) = green", "Iron(III) = brown"], "dp": ["Copper(II) = brown", "Iron(II) = blue", "Iron(III) = green"], "mand": 0}, {"id": "CHE-08-020", "t": 8, "s": "4.8.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Which ions give a <b>white precipitate<\/b> with sodium hydroxide? Which one dissolves in <b>excess<\/b>?", "a": ["<b>Aluminium, calcium and magnesium<\/b> (1)", "<b>Aluminium hydroxide<\/b> dissolves (1)", "giving a <b>colourless solution<\/b> (1)"], "cp": ["Aluminium, calcium and magnesium", "Aluminium hydroxide dissolves", "giving a colourless solution"], "dp": ["Copper, iron(II) and iron(III)", "Calcium hydroxide dissolves in excess", "Magnesium hydroxide dissolves in excess"], "mand": 0}, {"id": "CHE-08-021", "t": 8, "s": "4.8.3.2", "k": "Explain", "m": 2, "ht": false, "q": "Write an <b>ionic equation<\/b> for the formation of copper hydroxide.", "a": ["<b>Cu<sup>2+<\/sup>(aq) + 2OH<sup>-<\/sup>(aq) → Cu(OH)<sub>2<\/sub>(s)<\/b> (1)", "The product is an <b>insoluble precipitate<\/b> shown with (s) (1)"], "cp": ["Cu<sup>2+<\/sup>(aq) + 2OH<sup>-<\/sup>(aq) → Cu(OH)<sub>2<\/sub>(s)", "The product is an insoluble precipitate shown with (s)"], "dp": ["Cu<sup>+<\/sup> + OH<sup>-<\/sup> → CuOH", "Cu<sup>2+<\/sup> + OH<sup>-<\/sup> → Cu(OH)<sub>2<\/sub>", "CuSO<sub>4<\/sub> → Cu(OH)<sub>2<\/sub>"], "mand": 0}, {"id": "CHE-08-022", "t": 8, "s": "4.8.3.3", "k": "Recall", "m": 2, "ht": false, "q": "How do you test for a <b>carbonate<\/b>?", "a": ["Add <b>dilute acid<\/b>, which makes bubbles (1)", "Bubble the gas through <b>limewater<\/b>, which turns <b>milky<\/b> (1)"], "cp": ["Add dilute acid, which makes bubbles", "Bubble the gas through limewater, which turns milky"], "dp": ["Add sodium hydroxide", "Use a flame test", "Add silver nitrate"], "mand": 0}, {"id": "CHE-08-023", "t": 8, "s": "4.8.3.4", "k": "Recall", "m": 3, "ht": false, "q": "What colour precipitate do <b>chloride<\/b>, <b>bromide<\/b> and <b>iodide<\/b> ions give with silver nitrate?", "a": ["Chloride = <b>white<\/b> (1)", "Bromide = <b>cream<\/b> (1)", "Iodide = <b>yellow<\/b> (1)"], "cp": ["Chloride = white", "Bromide = cream", "Iodide = yellow"], "dp": ["Chloride = yellow", "Bromide = white", "Iodide = cream"], "mand": 0}, {"id": "CHE-08-024", "t": 8, "s": "4.8.3.4", "k": "Recall", "m": 1, "ht": false, "q": "Which acid is used to acidify the silver nitrate when testing for halides?", "a": ["Dilute <b>nitric acid<\/b> (1)"], "cp": ["Dilute nitric acid"], "dp": ["Dilute sulfuric acid", "Dilute hydrochloric acid", "Dilute ethanoic acid"], "mand": 0}, {"id": "CHE-08-025", "t": 8, "s": "4.8.3.5", "k": "Recall", "m": 2, "ht": false, "q": "How do you test for a <b>sulfate<\/b>? What is the result?", "a": ["Add <b>dilute hydrochloric acid<\/b>, then <b>barium chloride<\/b> solution (1)", "A <b>white precipitate<\/b> forms (1)"], "cp": ["Add dilute hydrochloric acid, then barium chloride solution", "A white precipitate forms"], "dp": ["Add sodium hydroxide, a blue precipitate", "Add silver nitrate, a cream precipitate", "Add limewater, it goes milky"], "mand": 0}, {"id": "CHE-08-026", "t": 8, "s": "4.8.3.5", "k": "Explain", "m": 1, "ht": false, "q": "Why is <b>hydrochloric acid<\/b> added before barium chloride in the sulfate test?", "a": ["To remove <b>carbonates<\/b> (and similar ions) that would also give a white precipitate (1)"], "cp": ["To remove carbonates (and similar ions) that would also give a white precipitate"], "dp": ["To make the sample alkaline", "To make the barium chloride dissolve", "To dilute the sulfate"], "mand": 0}, {"id": "CHE-08-027", "t": 8, "s": "4.8.3.5", "k": "Practical", "m": 4, "ht": false, "q": "A student has an unknown <b>solid<\/b> containing a single compound. Describe how to <b>identify<\/b> the metal ion and the negative ion.", "a": ["Do a <b>flame test<\/b> and/or add <b>sodium hydroxide<\/b> to find the metal ion (1)", "Add <b>acid<\/b> and test the gas for a <b>carbonate<\/b> (1)", "Add <b>nitric acid and silver nitrate<\/b> for a <b>halide<\/b> (1)", "Add <b>HCl and barium chloride<\/b> for a <b>sulfate<\/b> (1)"], "cp": ["Do a flame test and/or add sodium hydroxide to find the metal ion", "Add acid and test the gas for a carbonate", "Add nitric acid and silver nitrate for a halide", "Add HCl and barium chloride for a sulfate"], "dp": ["Test only with litmus paper", "Weigh the sample", "Heat it until it burns"], "mand": 0}, {"id": "CHE-08-028", "t": 8, "s": "4.8.3.6", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>three advantages<\/b> of instrumental methods over chemical tests.", "a": ["<b>Accurate<\/b> (1)", "<b>Sensitive<\/b> (can detect tiny amounts) (1)", "<b>Rapid<\/b> (quick, and can be automated) (1)"], "cp": ["Accurate", "Sensitive (can detect tiny amounts)", "Rapid (quick, and can be automated)"], "dp": ["Cheap", "Easy to do without training", "Slower but more detailed"], "mand": 0}, {"id": "CHE-08-029", "t": 8, "s": "4.8.3.7", "k": "Explain", "m": 3, "ht": false, "q": "Describe how <b>flame emission spectroscopy<\/b> identifies a metal ion.", "a": ["The sample is put in a <b>flame<\/b> (1)", "The light is passed through a <b>spectroscope<\/b>, giving a <b>line spectrum<\/b> (1)", "The lines are <b>compared with reference<\/b> spectra to identify the ion (the brightness gives the concentration) (1)"], "cp": ["The sample is put in a flame", "The light is passed through a spectroscope, giving a line spectrum", "The lines are compared with reference spectra to identify the ion (the brightness gives the concentration)"], "dp": ["The sample is boiled and the gas tested", "A pH probe measures the ions", "The flame colour is judged by eye"], "mand": 0}, {"id": "CHE-09-001", "t": 9, "s": "4.9.1.1", "k": "Recall", "m": 3, "ht": false, "q": "Give the approximate <b>percentages<\/b> of nitrogen, oxygen and carbon dioxide in today's atmosphere.", "a": ["Nitrogen about <b>78-80%<\/b> (1)", "Oxygen about <b>20-21%<\/b> (1)", "Carbon dioxide about <b>0.04%<\/b> (a tiny amount) (1)"], "cp": ["Nitrogen about 78-80%", "Oxygen about 20-21%", "Carbon dioxide about 0.04% (a tiny amount)"], "dp": ["Nitrogen 20%", "Oxygen 78%", "Carbon dioxide 5%"], "mand": 0}, {"id": "CHE-09-002", "t": 9, "s": "4.9.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two other gases<\/b> found in small amounts in the air.", "a": ["Any two (1 each):", "• <b>water vapour<\/b>", "• <b>noble gases<\/b> (such as argon)", "• <b>carbon dioxide<\/b>"], "cp": ["water vapour", "noble gases (such as argon)", "carbon dioxide"], "dp": ["Hydrogen and chlorine", "Methane and ammonia in large amounts", "Ozone and sulfur"], "mand": 0}, {"id": "CHE-09-003", "t": 9, "s": "4.9.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>Earth's early atmosphere<\/b>.", "a": ["Mostly <b>carbon dioxide<\/b> (1)", "Little or <b>no oxygen<\/b> (1)", "Possibly small amounts of <b>methane and ammonia<\/b>, and water vapour (1)"], "cp": ["Mostly carbon dioxide", "Little or no oxygen", "Possibly small amounts of methane and ammonia, and water vapour"], "dp": ["Mostly oxygen", "Mostly nitrogen", "A lot of oxygen from plants"], "mand": 0}, {"id": "CHE-09-004", "t": 9, "s": "4.9.1.2", "k": "Explain", "m": 2, "ht": false, "q": "How did the <b>oceans<\/b> form?", "a": ["Volcanoes released <b>water vapour<\/b> (1)", "As the Earth <b>cooled<\/b>, the water vapour <b>condensed<\/b> to make oceans (1)"], "cp": ["Volcanoes released water vapour", "As the Earth cooled, the water vapour condensed to make oceans"], "dp": ["Water came from plants", "Ice melted from the oceans", "Water vapour reacted with oxygen to make water"], "mand": 0}, {"id": "CHE-09-005", "t": 9, "s": "4.9.1.2", "k": "Explain", "m": 1, "ht": false, "q": "Why are theories about the <b>early atmosphere<\/b> uncertain?", "a": ["It was <b>4.6 billion years ago<\/b>, so the evidence is limited (1)"], "cp": ["It was 4.6 billion years ago, so the evidence is limited"], "dp": ["Scientists were there to measure it", "All the evidence is complete", "There is no evidence at all"], "mand": 0}, {"id": "CHE-09-006", "t": 9, "s": "4.9.1.3", "k": "Explain", "m": 2, "ht": false, "q": "How did the amount of <b>oxygen<\/b> in the atmosphere increase?", "a": ["<b>Algae<\/b> and then <b>plants<\/b> carried out photosynthesis (1)", "which uses carbon dioxide and releases <b>oxygen<\/b> (1)"], "cp": ["Algae and then plants carried out photosynthesis", "which uses carbon dioxide and releases oxygen"], "dp": ["Volcanoes released oxygen", "Oxygen was made by the oceans", "Animals made oxygen when breathing"], "mand": 0}, {"id": "CHE-09-007", "t": 9, "s": "4.9.1.3", "k": "Recall", "m": 2, "ht": false, "q": "Write the <b>word equation for photosynthesis<\/b>.", "a": ["carbon dioxide + water → <b>glucose<\/b> (1) + <b>oxygen<\/b> (1)", "(light energy)"], "cp": ["carbon dioxide + water → glucose", "+ oxygen"], "dp": ["oxygen + glucose → carbon dioxide + water", "carbon dioxide + oxygen → glucose + water", "glucose + water → carbon dioxide + oxygen"], "mand": 0}, {"id": "CHE-09-008", "t": 9, "s": "4.9.1.4", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> carbon dioxide levels <b>decreased<\/b> over time.", "a": ["<b>Photosynthesis<\/b> by algae and plants used it up (1)", "It dissolved in the <b>oceans<\/b> and formed carbonate <b>sediments<\/b> (1)", "Carbon was locked in <b>sedimentary rocks<\/b> (limestone) and <b>fossil fuels<\/b> (1)"], "cp": ["Photosynthesis by algae and plants used it up", "It dissolved in the oceans and formed carbonate sediments", "Carbon was locked in sedimentary rocks (limestone) and fossil fuels"], "dp": ["Volcanoes absorbed it", "Animals breathed it in", "It escaped into space"], "mand": 0}, {"id": "CHE-09-009", "t": 9, "s": "4.9.1.4", "k": "Explain", "m": 2, "ht": false, "q": "How did <b>coal<\/b> and <b>crude oil<\/b> form?", "a": ["Coal: from <b>plants<\/b> buried and compressed over millions of years (1)", "Crude oil and gas: from <b>plankton<\/b> buried in mud (1)"], "cp": ["Coal: from plants buried and compressed over millions of years", "Crude oil and gas: from plankton buried in mud"], "dp": ["Coal: from dinosaurs", "Crude oil: from coal", "Both formed from volcanic gases"], "mand": 0}, {"id": "CHE-09-010", "t": 9, "s": "4.9.1.4", "k": "Explain", "m": 2, "ht": false, "q": "How did <b>limestone<\/b> form?", "a": ["<b>Shells and skeletons<\/b> of sea creatures (made of calcium carbonate) (1)", "settled on the sea floor and were <b>compressed<\/b> over time (1)"], "cp": ["Shells and skeletons of sea creatures (made of calcium carbonate)", "settled on the sea floor and were compressed over time"], "dp": ["From volcanic lava", "From coal being burned", "From salt in the sea"], "mand": 0}, {"id": "CHE-09-011", "t": 9, "s": "4.9.2.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three greenhouse gases<\/b>.", "a": ["<b>Water vapour<\/b> (1)", "<b>Carbon dioxide<\/b> (1)", "<b>Methane<\/b> (1)"], "cp": ["Water vapour", "Carbon dioxide", "Methane"], "dp": ["Oxygen", "Nitrogen", "Argon"], "mand": 0}, {"id": "CHE-09-012", "t": 9, "s": "4.9.2.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>greenhouse effect<\/b> works.", "a": ["<b>Short wavelength<\/b> radiation from the Sun passes through the atmosphere and warms the Earth (1)", "The Earth emits <b>long wavelength<\/b> infrared radiation (1)", "Greenhouse gases <b>absorb<\/b> this and re-radiate it, so the Earth stays <b>warm<\/b> (1)"], "cp": ["Short wavelength radiation from the Sun passes through the atmosphere and warms the Earth", "The Earth emits long wavelength infrared radiation", "Greenhouse gases absorb this and re-radiate it, so the Earth stays warm"], "dp": ["Greenhouse gases reflect all radiation into space", "Long wavelength radiation comes from the Sun", "Greenhouse gases remove heat from the Earth"], "mand": 0}, {"id": "CHE-09-013", "t": 9, "s": "4.9.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two human activities<\/b> that increase <b>carbon dioxide<\/b>.", "a": ["Any two (1 each):", "• <b>burning fossil fuels<\/b>", "• <b>deforestation<\/b>", "• making cement or <b>manufacturing<\/b>"], "cp": ["burning fossil fuels", "deforestation", "making cement or manufacturing"], "dp": ["Planting trees", "Using solar panels", "Using wind power"], "mand": 0}, {"id": "CHE-09-014", "t": 9, "s": "4.9.2.2", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two human activities<\/b> that increase <b>methane<\/b>.", "a": ["Any two (1 each):", "• <b>cattle farming<\/b> (cows)", "• <b>rice paddy fields<\/b>", "• <b>landfill<\/b> waste", "• oil, gas and coal extraction"], "cp": ["cattle farming (cows)", "rice paddy fields", "landfill waste", "oil, gas and coal extraction"], "dp": ["Burning wood only", "Building wind turbines", "Solar panels"], "mand": 0}, {"id": "CHE-09-015", "t": 9, "s": "4.9.2.2", "k": "Evaluate", "m": 2, "ht": false, "q": "Why should we be careful about <b>media reports<\/b> on climate change?", "a": ["Some reports are <b>biased<\/b> or based on <b>speculation<\/b> (1)", "Reliable evidence is <b>peer reviewed<\/b> by other scientists (1)"], "cp": ["Some reports are biased or based on speculation", "Reliable evidence is peer reviewed by other scientists"], "dp": ["All reports are equally reliable", "Scientists never agree", "Models are exact"], "mand": 0}, {"id": "CHE-09-016", "t": 9, "s": "4.9.2.3", "k": "Recall", "m": 4, "ht": false, "q": "Describe <b>four possible effects<\/b> of global climate change.", "a": ["Any four (1 each):", "• <b>sea level rise<\/b> and flooding of coasts", "• more <b>extreme weather<\/b> (storms, droughts)", "• changes in <b>rainfall<\/b> and <b>crop growth<\/b>", "• <b>habitats<\/b> and species lost or moved", "• <b>melting ice<\/b>"], "cp": ["sea level rise and flooding of coasts", "more extreme weather (storms, droughts)", "changes in rainfall and crop growth", "habitats and species lost or moved", "melting ice"], "dp": ["Cooler winters everywhere", "Lower sea levels", "More ozone"], "mand": 0}, {"id": "CHE-09-017", "t": 9, "s": "4.9.2.4", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>carbon footprint<\/b>?", "a": ["The total amount of <b>carbon dioxide and other greenhouse gases<\/b> (such as methane) (1)", "emitted over the <b>full life cycle<\/b> of a product, service or event (1)"], "cp": ["The total amount of carbon dioxide and other greenhouse gases (such as methane)", "emitted over the full life cycle of a product, service or event"], "dp": ["The mass of carbon in a person", "The amount of oil used in a car", "The weight of coal burned in a day"], "mand": 0}, {"id": "CHE-09-018", "t": 9, "s": "4.9.2.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to reduce a carbon footprint.", "a": ["Any three (1 each):", "• use <b>renewable energy<\/b> (solar, wind)", "• use <b>public transport<\/b> or walk or cycle", "• <b>insulate<\/b> buildings and save energy", "• <b>plant trees<\/b>", "• use <b>carbon capture<\/b>", "• eat less meat and dairy"], "cp": ["use renewable energy (solar, wind)", "use public transport or walk or cycle", "insulate buildings and save energy", "plant trees", "use carbon capture", "eat less meat and dairy"], "dp": ["Burn more coal", "Drive further", "Use more electricity from fossil fuels"], "mand": 0}, {"id": "CHE-09-019", "t": 9, "s": "4.9.2.4", "k": "Evaluate", "m": 2, "ht": false, "q": "Give <b>two reasons<\/b> why it can be difficult to reduce carbon footprints.", "a": ["Any two (1 each):", "• <b>cost<\/b> of new technology", "• people dislike <b>changing lifestyle<\/b>", "• <b>lack of<\/b> international agreement", "• dependence on <b>fossil fuels<\/b>"], "cp": ["cost of new technology", "people dislike changing lifestyle", "lack of international agreement", "dependence on fossil fuels"], "dp": ["Renewables are too cheap", "There is too little evidence", "Everyone agrees on solutions"], "mand": 0}, {"id": "CHE-09-020", "t": 9, "s": "4.9.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three pollutants<\/b> released by burning fuels.", "a": ["Any three (1 each):", "• <b>carbon monoxide<\/b>", "• <b>sulfur dioxide<\/b>", "• <b>oxides of nitrogen<\/b>", "• <b>particulates<\/b> (soot) and unburned hydrocarbons"], "cp": ["carbon monoxide", "sulfur dioxide", "oxides of nitrogen", "particulates (soot) and unburned hydrocarbons"], "dp": ["Oxygen", "Water vapour only", "Nitrogen"], "mand": 0}, {"id": "CHE-09-021", "t": 9, "s": "4.9.3.1", "k": "Explain", "m": 2, "ht": false, "q": "How is <b>carbon monoxide<\/b> formed? How is <b>soot<\/b> formed?", "a": ["CO is formed by <b>incomplete combustion<\/b> with limited oxygen (1)", "Soot (carbon) is formed by <b>incomplete combustion<\/b> too (1)"], "cp": ["CO is formed by incomplete combustion with limited oxygen", "Soot (carbon) is formed by incomplete combustion too"], "dp": ["CO is formed when oxygen is in excess", "Soot is formed in complete combustion", "Both come from nitrogen in the fuel"], "mand": 0}, {"id": "CHE-09-022", "t": 9, "s": "4.9.3.1", "k": "Explain", "m": 2, "ht": false, "q": "How are <b>sulfur dioxide<\/b> and <b>oxides of nitrogen<\/b> formed?", "a": ["<b>Sulfur dioxide<\/b>: sulfur impurities in the fuel burn (1)", "<b>Oxides of nitrogen<\/b>: nitrogen and oxygen from the air react at the <b>high temperatures<\/b> in engines (1)"], "cp": ["Sulfur dioxide: sulfur impurities in the fuel burn", "Oxides of nitrogen: nitrogen and oxygen from the air react at the high temperatures in engines"], "dp": ["Both are formed from carbon in the fuel", "Nitrogen oxides come from the fuel only", "Sulfur dioxide is made from water"], "mand": 0}, {"id": "CHE-09-023", "t": 9, "s": "4.9.3.1", "k": "Explain", "m": 2, "ht": false, "q": "Write the equation for the <b>incomplete combustion<\/b> of methane that makes carbon monoxide and water.", "a": ["<b>2CH<sub>4<\/sub> + 3O<sub>2<\/sub> → 2CO + 4H<sub>2<\/sub>O<\/b> (1)", "Each side has <b>2 C, 8 H and 6 O<\/b> (1)"], "cp": ["2CH<sub>4<\/sub> + 3O<sub>2<\/sub> → 2CO + 4H<sub>2<\/sub>O", "Each side has 2 C, 8 H and 6 O"], "dp": ["CH<sub>4<\/sub> + 2O<sub>2<\/sub> → CO<sub>2<\/sub> + 2H<sub>2<\/sub>O", "CH<sub>4<\/sub> + O<sub>2<\/sub> → CO + H<sub>2<\/sub>O", "2CH<sub>4<\/sub> + 3O<sub>2<\/sub> → 2CO + 2H<sub>2<\/sub>O"], "mand": 0}, {"id": "CHE-09-024", "t": 9, "s": "4.9.3.2", "k": "Recall", "m": 3, "ht": false, "q": "Why is <b>carbon monoxide<\/b> dangerous?", "a": ["It is <b>toxic<\/b> (1)", "It is <b>colourless and odourless<\/b>, so cannot be detected without an alarm (1)", "It stops the blood carrying <b>oxygen<\/b> (1)"], "cp": ["It is toxic", "It is colourless and odourless, so cannot be detected without an alarm", "It stops the blood carrying oxygen"], "dp": ["It is bright green and smells strongly", "It is harmless", "It causes acid rain"], "mand": 0}, {"id": "CHE-09-025", "t": 9, "s": "4.9.3.2", "k": "Recall", "m": 2, "ht": false, "q": "What problems are caused by <b>sulfur dioxide<\/b> and <b>oxides of nitrogen<\/b>?", "a": ["They cause <b>acid rain<\/b> (1)", "and <b>respiratory problems<\/b> (breathing difficulties) (1)"], "cp": ["They cause acid rain", "and respiratory problems (breathing difficulties)"], "dp": ["They cause global dimming", "They cause the greenhouse effect", "They cause no problems"], "mand": 0}, {"id": "CHE-09-026", "t": 9, "s": "4.9.3.2", "k": "Recall", "m": 2, "ht": false, "q": "What problems are caused by <b>particulates<\/b>?", "a": ["<b>Global dimming<\/b> (less sunlight reaches the Earth) (1)", "<b>Health problems<\/b> (breathing) (1)"], "cp": ["Global dimming (less sunlight reaches the Earth)", "Health problems (breathing)"], "dp": ["Acid rain", "Ozone depletion", "Cooling oceans"], "mand": 0}, {"id": "CHE-10-001", "t": 10, "s": "4.10.1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between a <b>finite<\/b> and a <b>renewable<\/b> resource?", "a": ["Finite: will <b>run out<\/b> (cannot be replaced fast enough), e.g. crude oil (1)", "Renewable: can be <b>replaced<\/b> as fast as it is used, e.g. wood (1)"], "cp": ["Finite: will run out (cannot be replaced fast enough), e.g. crude oil", "Renewable: can be replaced as fast as it is used, e.g. wood"], "dp": ["Finite resources are replaced quickly", "Renewable resources run out", "They mean the same thing"], "mand": 0}, {"id": "CHE-10-002", "t": 10, "s": "4.10.1.1", "k": "Recall", "m": 2, "ht": false, "q": "Give <b>two<\/b> natural products that are supplemented or replaced by <b>synthetic<\/b> products.", "a": ["Any two (1 each):", "• <b>wool or cotton<\/b> replaced by synthetic fibres", "• <b>rubber<\/b> replaced by synthetic rubber", "• <b>fertilisers<\/b> replacing manure", "• <b>wood<\/b> replaced by plastics"], "cp": ["wool or cotton replaced by synthetic fibres", "rubber replaced by synthetic rubber", "fertilisers replacing manure", "wood replaced by plastics"], "dp": ["Crude oil replaced by granite", "Sand replaced by oxygen", "Water replaced by salt"], "mand": 0}, {"id": "CHE-10-003", "t": 10, "s": "4.10.1.1", "k": "Explain", "m": 2, "ht": false, "q": "What does <b>sustainable development<\/b> mean?", "a": ["Meeting the <b>needs of people today<\/b> (1)", "without <b>harming<\/b> the ability of future generations to meet theirs (1)"], "cp": ["Meeting the needs of people today", "without harming the ability of future generations to meet theirs"], "dp": ["Using up resources as fast as possible", "Only using renewable energy", "Making products as cheaply as possible"], "mand": 0}, {"id": "CHE-10-004", "t": 10, "s": "4.10.1.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>potable water<\/b>? Is it the same as pure water?", "a": ["Water that is <b>safe to drink<\/b> (low in dissolved salts and microbes) (1)", "<b>No<\/b>, it still contains dissolved substances, pure water has nothing else in it (1)"], "cp": ["Water that is safe to drink (low in dissolved salts and microbes)", "No, it still contains dissolved substances, pure water has nothing else in it"], "dp": ["Yes, potable water contains nothing else", "Water with a high level of dissolved salts", "Water that is safe to swim in"], "mand": 0}, {"id": "CHE-10-005", "t": 10, "s": "4.10.1.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>three steps<\/b> used to make potable water from fresh water.", "a": ["Choose a <b>suitable source<\/b> (rain, rivers, lakes, groundwater) (1)", "Pass it through <b>filter beds<\/b> to remove solids (1)", "<b>Sterilise<\/b> (chlorine, ozone or ultraviolet light) to kill microbes (1)"], "cp": ["Choose a suitable source (rain, rivers, lakes, groundwater)", "Pass it through filter beds to remove solids", "Sterilise (chlorine, ozone or ultraviolet light) to kill microbes"], "dp": ["Distil the water and add salt", "Freeze the water", "Boil it for one hour only"], "mand": 0}, {"id": "CHE-10-006", "t": 10, "s": "4.10.1.2", "k": "Recall", "m": 2, "ht": false, "q": "How can <b>sea water<\/b> be made into potable water? Give <b>two<\/b> methods.", "a": ["<b>Distillation<\/b> (1)", "<b>Reverse osmosis<\/b> (1)", "(both need a lot of energy)"], "cp": ["Distillation", "Reverse osmosis"], "dp": ["Filtration only", "Adding chlorine only", "Sedimentation"], "mand": 0}, {"id": "CHE-10-007", "t": 10, "s": "4.10.1.2", "k": "Evaluate", "m": 1, "ht": false, "q": "Why is <b>desalination<\/b> not used everywhere?", "a": ["It needs <b>large amounts of energy<\/b> so it is expensive (1)"], "cp": ["It needs large amounts of energy so it is expensive"], "dp": ["Sea water is already safe to drink", "It makes salt water more salty", "It needs no energy"], "mand": 0}, {"id": "CHE-10-008", "t": 10, "s": "4.10.1.2", "k": "Practical", "m": 4, "ht": false, "q": "Describe how to analyse and purify a <b>sample of salty water<\/b>.", "a": ["Test the <b>pH<\/b> with a probe or universal indicator (1)", "Find the <b>dissolved solids<\/b> by evaporating a known volume and weighing the residue (1)", "Purify by <b>distillation<\/b> (heat, condense and collect) (1)", "Check the distillate has <b>no dissolved solids<\/b> and a pH of 7 (1)"], "cp": ["Test the pH with a probe or universal indicator", "Find the dissolved solids by evaporating a known volume and weighing the residue", "Purify by distillation (heat, condense and collect)", "Check the distillate has no dissolved solids and a pH of 7"], "dp": ["Filter the sample only", "Measure the colour", "Freeze and weigh the ice"], "mand": 0}, {"id": "CHE-10-009", "t": 10, "s": "4.10.1.3", "k": "Recall", "m": 4, "ht": false, "q": "Describe the <b>four stages<\/b> of sewage treatment.", "a": ["<b>Screening<\/b> and grit removal (1)", "<b>Sedimentation<\/b> to give sludge and effluent (1)", "<b>Anaerobic digestion<\/b> of the sludge (1)", "<b>Aerobic biological treatment<\/b> of the effluent (1)"], "cp": ["Screening and grit removal", "Sedimentation to give sludge and effluent", "Anaerobic digestion of the sludge", "Aerobic biological treatment of the effluent"], "dp": ["Distillation, then crystallisation", "Filtration through sand, then chlorination", "Reverse osmosis, then evaporation"], "mand": 0}, {"id": "CHE-10-010", "t": 10, "s": "4.10.1.3", "k": "Explain", "m": 2, "ht": false, "q": "Why does <b>industrial waste water<\/b> sometimes need extra treatment compared with sewage?", "a": ["It may contain <b>harmful chemicals<\/b> (1)", "that must be <b>removed<\/b> before the water is released (1)"], "cp": ["It may contain harmful chemicals", "that must be removed before the water is released"], "dp": ["It contains no chemicals", "It is always safe to release", "It only contains organic matter"], "mand": 0}, {"id": "CHE-10-011", "t": 10, "s": "4.10.1.4", "k": "Explain", "m": 2, "ht": false, "q": "How can <b>copper<\/b> be obtained from a leachate solution?", "a": ["By <b>displacement<\/b> with scrap iron (1)", "or by <b>electrolysis<\/b> (1)"], "cp": ["By displacement with scrap iron", "or by electrolysis"], "dp": ["By filtration only", "By fractional distillation", "By heating with carbon"], "mand": 0}, {"id": "CHE-10-012", "t": 10, "s": "4.10.2.1", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>stages<\/b> in a life cycle assessment (LCA).", "a": ["Extracting and processing <b>raw materials<\/b> (1)", "<b>Manufacturing<\/b> and packaging (1)", "<b>Use<\/b> and operation (1)", "<b>Disposal<\/b> at the end of life (transport at each stage) (1)"], "cp": ["Extracting and processing raw materials", "Manufacturing and packaging", "Use and operation", "Disposal at the end of life (transport at each stage)"], "dp": ["Designing and advertising", "Marketing and selling only", "Recycling only"], "mand": 0}, {"id": "CHE-10-013", "t": 10, "s": "4.10.2.1", "k": "Evaluate", "m": 2, "ht": false, "q": "Why might an LCA <b>not be completely objective<\/b>?", "a": ["Some factors, such as <b>pollutant effects<\/b>, need <b>value judgements<\/b> (1)", "and a <b>selective<\/b> LCA can be used to support a pre-decided conclusion (such as in adverts) (1)"], "cp": ["Some factors, such as pollutant effects, need value judgements", "and a selective LCA can be used to support a pre-decided conclusion (such as in adverts)"], "dp": ["LCAs only use exact measurements", "Every LCA gives the same result", "LCAs are never used in adverts"], "mand": 0}, {"id": "CHE-10-014", "t": 10, "s": "4.10.2.1", "k": "Evaluate", "m": 3, "ht": false, "q": "Compare <b>plastic and paper shopping bags<\/b> using an LCA.", "a": ["Paper: needs <b>trees<\/b> and more <b>energy and water<\/b> to make (1)", "Plastic: made from <b>crude oil<\/b> (finite resource), but <b>lighter<\/b> to transport (1)", "Plastic lasts long and can be <b>reused<\/b>, but it <b>does not decompose<\/b> and can pollute (1)"], "cp": ["Paper: needs trees and more energy and water to make", "Plastic: made from crude oil (finite resource), but lighter to transport", "Plastic lasts long and can be reused, but it does not decompose and can pollute"], "dp": ["Plastic bags use no crude oil", "Paper bags have no environmental impact", "Both are made from renewable resources only"], "mand": 0}, {"id": "CHE-10-015", "t": 10, "s": "4.10.2.2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three ways<\/b> of reducing the use of limited resources.", "a": ["<b>Reduce<\/b> use (1)", "<b>Reuse<\/b> items (1)", "<b>Recycle<\/b> materials (1)"], "cp": ["Reduce use", "Reuse items", "Recycle materials"], "dp": ["Burn waste", "Buy more products", "Use more virgin materials"], "mand": 0}, {"id": "CHE-10-016", "t": 10, "s": "4.10.2.2", "k": "Explain", "m": 2, "ht": false, "q": "Give <b>two advantages<\/b> of recycling metals.", "a": ["Any two (1 each):", "• saves <b>ore<\/b> and the environmental damage of mining", "• uses <b>less energy<\/b> than extracting from ores", "• reduces <b>waste<\/b> to landfill", "• reduces <b>carbon dioxide<\/b>"], "cp": ["saves ore and the environmental damage of mining", "uses less energy than extracting from ores", "reduces waste to landfill", "reduces carbon dioxide"], "dp": ["It makes the metal weaker", "It always costs more energy", "It increases waste"], "mand": 0}, {"id": "CHE-10-017", "t": 10, "s": "4.10.2.2", "k": "Explain", "m": 1, "ht": false, "q": "How does adding <b>scrap steel<\/b> to a blast furnace help?", "a": ["It <b>reduces the amount of iron ore<\/b> needed (1)"], "cp": ["It reduces the amount of iron ore needed"], "dp": ["It makes the furnace cooler", "It adds more carbon", "It stops the reaction"], "mand": 0}, {"id": "CHE-10-018", "t": 10, "s": "4.10.2.2", "k": "Recall", "m": 2, "ht": false, "q": "How can <b>glass bottles<\/b> be reused or recycled?", "a": ["They can be <b>washed and reused<\/b> (1)", "or <b>crushed and melted<\/b> to make new glass products (1)"], "cp": ["They can be washed and reused", "or crushed and melted to make new glass products"], "dp": ["They are burned for fuel", "They are dissolved in water", "They are buried in the ground"], "mand": 0}, {"id": "CHE-10-019", "t": 10, "s": "4.10.3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>corrosion<\/b>? What does iron need to <b>rust<\/b>?", "a": ["The <b>destruction<\/b> of a material by reaction with the environment (1)", "Iron needs both <b>air (oxygen)<\/b> and <b>water<\/b> to rust (1)"], "cp": ["The destruction of a material by reaction with the environment", "Iron needs both air (oxygen) and water to rust"], "dp": ["Iron needs only water", "Iron needs only air", "Rusting is a reduction of iron"], "mand": 0}, {"id": "CHE-10-020", "t": 10, "s": "4.10.3.1", "k": "Practical", "m": 3, "ht": false, "q": "Describe an experiment to show that <b>both air and water<\/b> are needed for rusting.", "a": ["Tube 1: nail in <b>water and air<\/b> (rusts) (1)", "Tube 2: nail in <b>boiled water<\/b> with oil on top (no air) and tube 3 with <b>calcium chloride<\/b> (dry air) (1)", "Only tube 1 rusts, so both are needed (1)"], "cp": ["Tube 1: nail in water and air (rusts)", "Tube 2: nail in boiled water with oil on top (no air) and tube 3 with calcium chloride (dry air)", "Only tube 1 rusts, so both are needed"], "dp": ["Put the nail in water only and compare", "Heat the nail until it melts", "Leave the nail in a vacuum"], "mand": 0}, {"id": "CHE-10-021", "t": 10, "s": "4.10.3.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> ways to prevent rusting.", "a": ["Any three (1 each):", "• <b>painting<\/b> or oiling or greasing (barrier)", "• <b>electroplating<\/b>", "• <b>galvanising<\/b> (zinc coating)", "• <b>sacrificial protection<\/b> (a more reactive metal)"], "cp": ["painting or oiling or greasing (barrier)", "electroplating", "galvanising (zinc coating)", "sacrificial protection (a more reactive metal)"], "dp": ["Leaving iron in water", "Heating the iron", "Exposing the iron to air"], "mand": 0}, {"id": "CHE-10-022", "t": 10, "s": "4.10.3.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>sacrificial protection<\/b> stops iron rusting.", "a": ["A <b>more reactive metal<\/b> (such as zinc or magnesium) is attached to the iron (1)", "It <b>reacts instead<\/b> of the iron (it loses electrons more easily) (1)", "so the iron is <b>protected<\/b> even if the coating is scratched (1)"], "cp": ["A more reactive metal (such as zinc or magnesium) is attached to the iron", "It reacts instead of the iron (it loses electrons more easily)", "so the iron is protected even if the coating is scratched"], "dp": ["A less reactive metal is attached", "The iron reacts first", "The coating only works if it is not scratched"], "mand": 0}, {"id": "CHE-10-023", "t": 10, "s": "4.10.3.1", "k": "Explain", "m": 2, "ht": false, "q": "Why does <b>aluminium<\/b> not corrode like iron?", "a": ["Aluminium forms a thin layer of <b>aluminium oxide<\/b> (1)", "which <b>protects<\/b> the metal underneath from further reaction (1)"], "cp": ["Aluminium forms a thin layer of aluminium oxide", "which protects the metal underneath from further reaction"], "dp": ["It is unreactive", "The oxide layer flakes away", "It does not react with oxygen"], "mand": 0}, {"id": "CHE-10-024", "t": 10, "s": "4.10.3.2", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>alloy<\/b>? Why are most everyday metals alloys?", "a": ["A <b>mixture<\/b> of a metal with other elements (often metals) (1)", "Alloys are <b>harder and stronger<\/b> than pure metals (1)"], "cp": ["A mixture of a metal with other elements (often metals)", "Alloys are harder and stronger than pure metals"], "dp": ["A compound of two metals", "A pure metal", "A metal mixed with water"], "mand": 0}, {"id": "CHE-10-025", "t": 10, "s": "4.10.3.2", "k": "Recall", "m": 4, "ht": false, "q": "Name the metals in: <b>bronze<\/b> and <b>brass<\/b>. Give a use of each.", "a": ["Bronze = <b>copper and tin<\/b> (1)", "Brass = <b>copper and zinc<\/b> (1)", "Use of bronze: <b>statues, medals, bells<\/b> (1)", "Use of brass: <b>door fittings, taps, musical instruments<\/b> (1)"], "cp": ["Bronze = copper and tin", "Brass = copper and zinc", "Use of bronze: statues, medals, bells", "Use of brass: door fittings, taps, musical instruments"], "dp": ["Bronze = copper and zinc", "Brass = copper and tin", "Bronze = iron and carbon"], "mand": 0}, {"id": "CHE-10-026", "t": 10, "s": "4.10.3.2", "k": "Recall", "m": 3, "ht": false, "q": "What are <b>low-carbon<\/b>, <b>high-carbon<\/b> and <b>stainless<\/b> steels? Give a property of each.", "a": ["Low-carbon steel: <b>soft<\/b> and easily shaped (1)", "High-carbon steel: <b>hard but brittle<\/b> (1)", "Stainless steel: contains <b>chromium and nickel<\/b>, so does not rust (1)"], "cp": ["Low-carbon steel: soft and easily shaped", "High-carbon steel: hard but brittle", "Stainless steel: contains chromium and nickel, so does not rust"], "dp": ["High-carbon steel is soft and easily shaped", "Stainless steel rusts easily", "Low-carbon steel is brittle"], "mand": 0}, {"id": "CHE-10-027", "t": 10, "s": "4.10.3.2", "k": "Calculation", "m": 2, "ht": false, "q": "What <b>percentage of gold<\/b> is in 18 carat gold? What is 24 carat gold?", "a": ["18 ÷ 24 × 100 = <b>75%<\/b> (1)", "24 carat = <b>100%<\/b> (pure gold) (1)"], "cp": ["18 ÷ 24 × 100 = 75%", "24 carat = 100% (pure gold)"], "dp": ["18%", "24 carat is 75% gold", "18 carat is 100% gold"], "mand": 0}, {"id": "CHE-10-028", "t": 10, "s": "4.10.3.2", "k": "Recall", "m": 2, "ht": false, "q": "Why are <b>aluminium alloys<\/b> used to make aircraft?", "a": ["They have a <b>low density<\/b> (light) (1)", "and are <b>strong<\/b> (1)"], "cp": ["They have a low density (light)", "and are strong"], "dp": ["They are heavy and strong", "They are very dense", "They are used because they rust"], "mand": 0}, {"id": "CHE-10-029", "t": 10, "s": "4.10.3.3", "k": "Recall", "m": 4, "ht": false, "q": "Name the raw materials for <b>soda-lime glass<\/b> and for <b>borosilicate glass<\/b>.", "a": ["Soda-lime glass: <b>sand<\/b> (1)", "<b>sodium carbonate and limestone<\/b> (1)", "Borosilicate glass: <b>sand<\/b> (1)", "and <b>boron trioxide<\/b> (1)"], "cp": ["Soda-lime glass: sand", "sodium carbonate and limestone", "Borosilicate glass: sand", "and boron trioxide"], "dp": ["Soda-lime glass: clay and water", "Borosilicate glass: limestone only", "Soda-lime glass: iron and carbon"], "mand": 0}, {"id": "CHE-10-030", "t": 10, "s": "4.10.3.3", "k": "Explain", "m": 2, "ht": false, "q": "How are <b>clay ceramics<\/b> such as pottery and bricks made?", "a": ["<b>Wet clay<\/b> is shaped (1)", "then <b>heated in a furnace<\/b> (fired) (1)"], "cp": ["Wet clay is shaped", "then heated in a furnace (fired)"], "dp": ["Clay is melted and poured", "Clay is dissolved in acid", "Clay is cooled in a freezer"], "mand": 0}, {"id": "CHE-10-031", "t": 10, "s": "4.10.3.3", "k": "Compare", "m": 2, "ht": false, "q": "What is the difference between a <b>thermosoftening<\/b> and a <b>thermosetting<\/b> polymer?", "a": ["Thermosoftening: <b>melts<\/b> when heated (weak forces between chains) (1)", "Thermosetting: <b>does not melt<\/b> (strong cross-links between chains) (1)"], "cp": ["Thermosoftening: melts when heated (weak forces between chains)", "Thermosetting: does not melt (strong cross-links between chains)"], "dp": ["Thermosetting polymers melt when heated", "Thermosoftening polymers have cross-links", "Both melt easily"], "mand": 0}, {"id": "CHE-10-032", "t": 10, "s": "4.10.3.3", "k": "Explain", "m": 2, "ht": false, "q": "Why do <b>low-density<\/b> and <b>high-density<\/b> poly(ethene) have different properties although both are made from ethene?", "a": ["They are made under <b>different conditions<\/b> (temperature, pressure, catalyst) (1)", "giving different <b>chain structures<\/b> (branched or straight) (1)"], "cp": ["They are made under different conditions (temperature, pressure, catalyst)", "giving different chain structures (branched or straight)"], "dp": ["They are made from different monomers", "One is a metal", "They have the same structure"], "mand": 0}, {"id": "CHE-10-033", "t": 10, "s": "4.10.3.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>composite<\/b>? Give an example.", "a": ["A material with <b>reinforcement fibres or fragments<\/b> held in a <b>matrix (binder)<\/b> (1)", "Example: <b>fibreglass<\/b>, <b>concrete<\/b> or <b>carbon fibre<\/b> (1)"], "cp": ["A material with reinforcement fibres or fragments held in a matrix (binder)", "Example: fibreglass, concrete or carbon fibre"], "dp": ["A single pure element", "An alloy of two metals", "A compound of carbon and hydrogen"], "mand": 0}, {"id": "CHE-10-034", "t": 10, "s": "4.10.4.1", "k": "Recall", "m": 3, "ht": false, "q": "Write the <b>equation for the Haber process<\/b> and name the raw materials and where they come from.", "a": ["<b>N<sub>2<\/sub> + 3H<sub>2<\/sub> ⇌ 2NH<sub>3<\/sub><\/b> (1)", "Nitrogen from the <b>air<\/b> (1)", "Hydrogen from <b>natural gas<\/b> (methane) (1)"], "cp": ["N<sub>2<\/sub> + 3H<sub>2<\/sub> ⇌ 2NH<sub>3<\/sub>", "Nitrogen from the air", "Hydrogen from natural gas (methane)"], "dp": ["N + H → NH", "Nitrogen from natural gas", "Hydrogen from the air"], "mand": 0}, {"id": "CHE-10-035", "t": 10, "s": "4.10.4.1", "k": "Recall", "m": 3, "ht": false, "q": "State the <b>conditions<\/b> used in the Haber process.", "a": ["A temperature of about <b>450 °C<\/b> (1)", "A pressure of about <b>200 atmospheres<\/b> (1)", "An <b>iron catalyst<\/b> (1)"], "cp": ["A temperature of about 450 °C", "A pressure of about 200 atmospheres", "An iron catalyst"], "dp": ["A temperature of 25 °C", "A pressure of 1 atmosphere", "A nickel catalyst"], "mand": 0}, {"id": "CHE-10-036", "t": 10, "s": "4.10.4.1", "k": "Explain", "m": 2, "ht": false, "q": "How is the ammonia collected and what happens to the <b>unreacted<\/b> gases?", "a": ["Ammonia is <b>cooled and liquefied<\/b>, then removed (1)", "Unreacted nitrogen and hydrogen are <b>recycled<\/b> (1)"], "cp": ["Ammonia is cooled and liquefied, then removed", "Unreacted nitrogen and hydrogen are recycled"], "dp": ["Ammonia is filtered out", "The unreacted gases are released into the air", "Ammonia is burned"], "mand": 0}, {"id": "CHE-10-037", "t": 10, "s": "4.10.4.2", "k": "Definition", "m": 2, "ht": false, "q": "What does <b>NPK<\/b> stand for in a fertiliser? Why are they used?", "a": ["<b>Nitrogen, phosphorus and potassium<\/b> (1)", "They <b>improve crop growth<\/b> (replace nutrients taken by plants) (1)"], "cp": ["Nitrogen, phosphorus and potassium", "They improve crop growth (replace nutrients taken by plants)"], "dp": ["Nickel, platinum and krypton", "Sodium, phosphate and calcium", "Nitrogen, potassium and carbon"], "mand": 0}, {"id": "CHE-10-038", "t": 10, "s": "4.10.4.2", "k": "Recall", "m": 3, "ht": false, "q": "How is <b>ammonium nitrate<\/b> made from ammonia?", "a": ["Ammonia is made into <b>nitric acid<\/b> (1)", "Ammonia (an alkali) <b>neutralises<\/b> the nitric acid (1)", "giving <b>ammonium nitrate<\/b> (1)"], "cp": ["Ammonia is made into nitric acid", "Ammonia (an alkali) neutralises the nitric acid", "giving ammonium nitrate"], "dp": ["Ammonia is burned in air", "Ammonia reacts with sodium chloride", "Ammonia is bubbled into limewater"], "mand": 0}, {"id": "CHE-10-039", "t": 10, "s": "4.10.4.2", "k": "Explain", "m": 2, "ht": false, "q": "Why can't <b>phosphate rock<\/b> be used directly as a fertiliser? What is done to it?", "a": ["It is <b>insoluble<\/b> so plants cannot take it up (1)", "It is treated with <b>nitric, sulfuric or phosphoric acid<\/b> to make <b>soluble<\/b> salts (1)"], "cp": ["It is insoluble so plants cannot take it up", "It is treated with nitric, sulfuric or phosphoric acid to make soluble salts"], "dp": ["It is too soluble", "It is treated with sodium", "It must be heated until it melts"], "mand": 0}, {"id": "CHE-10-040", "t": 10, "s": "4.10.4.2", "k": "Compare", "m": 2, "ht": false, "q": "Give <b>two differences<\/b> between making a fertiliser salt in industry and in the laboratory.", "a": ["Any two (1 each):", "• industry makes <b>large amounts<\/b> in a continuous process; labs make small batches", "• industry uses <b>different, cheaper<\/b> raw materials", "• industry uses <b>integrated processes<\/b> and recycles energy", "• labs use <b>crystallisation<\/b> to get the solid"], "cp": ["industry makes large amounts in a continuous process; labs make small batches", "industry uses different, cheaper raw materials", "industry uses integrated processes and recycles energy", "labs use crystallisation to get the solid"], "dp": ["Industry uses glassware only", "Labs make larger amounts", "Industry always uses titration"], "mand": 0}, {"id": "CHE-10-H01", "t": 10, "s": "4.10.1.4", "k": "Definition", "m": 2, "ht": true, "q": "What is <b>phytomining<\/b>?", "a": ["<b>Plants absorb<\/b> metal compounds from the soil (1)", "The plants are <b>burned<\/b>, and the <b>ash<\/b> contains the metal compounds (1)"], "cp": ["Plants absorb metal compounds from the soil", "The plants are burned, and the ash contains the metal compounds"], "dp": ["Bacteria produce a leachate solution", "Digging up ore and heating it", "Using electrolysis"], "mand": 0}, {"id": "CHE-10-H02", "t": 10, "s": "4.10.1.4", "k": "Definition", "m": 2, "ht": true, "q": "What is <b>bioleaching<\/b>?", "a": ["<b>Bacteria<\/b> are used to break down low-grade ores (1)", "making a <b>leachate solution<\/b> that contains the metal compounds (1)"], "cp": ["Bacteria are used to break down low-grade ores", "making a leachate solution that contains the metal compounds"], "dp": ["Plants burned to make ash", "Heating ore with carbon", "Adding acid to a battery"], "mand": 0}, {"id": "CHE-10-H03", "t": 10, "s": "4.10.1.4", "k": "Evaluate", "m": 3, "ht": true, "q": "Give <b>three advantages<\/b> of phytomining and bioleaching compared with traditional mining.", "a": ["Any three (1 each):", "• work with <b>low-grade<\/b> ores", "• <b>less damage<\/b> to the environment (less digging and waste rock)", "• use <b>less energy<\/b>", "• can reach ore that is too poor to mine normally", "• less <b>noise<\/b> and dust"], "cp": ["work with low-grade ores", "less damage to the environment (less digging and waste rock)", "use less energy", "can reach ore that is too poor to mine normally", "less noise and dust"], "dp": ["They are much faster", "They produce more pure metal", "They need no land"], "mand": 0}, {"id": "CHE-10-H04", "t": 10, "s": "4.10.4.1", "k": "Explain", "m": 3, "ht": true, "q": "Why is <b>450 °C<\/b> used in the Haber process, a compromise?", "a": ["The forward reaction is <b>exothermic<\/b>, so a lower temperature gives a <b>higher yield<\/b> (1)", "but a lower temperature makes the <b>rate too slow<\/b> (1)", "so 450 °C is a compromise between <b>rate and yield<\/b> (1)"], "cp": ["The forward reaction is exothermic, so a lower temperature gives a higher yield", "but a lower temperature makes the rate too slow", "so 450 °C is a compromise between rate and yield"], "dp": ["A higher temperature increases the yield", "The reaction is endothermic", "It has no effect on the rate"], "mand": 0}, {"id": "CHE-10-H05", "t": 10, "s": "4.10.4.1", "k": "Explain", "m": 3, "ht": true, "q": "Why is <b>200 atmospheres<\/b> used in the Haber process?", "a": ["Higher pressure moves equilibrium to the side with <b>fewer molecules<\/b>, giving more ammonia (1)", "and increases the <b>rate<\/b> (1)", "but very high pressure is too <b>expensive<\/b> and dangerous, so 200 atm is a compromise (1)"], "cp": ["Higher pressure moves equilibrium to the side with fewer molecules, giving more ammonia", "and increases the rate", "but very high pressure is too expensive and dangerous, so 200 atm is a compromise"], "dp": ["Lower pressure gives more ammonia", "High pressure has no effect on rate", "Pressure has no effect on equilibrium"], "mand": 0}];

  if(ratio>=.8)st.box=Math.min(3,st.box+1);else if(ratio<.5)st.box=0;else st.box=Math.max(1,st.box);
  let xp=e*10+(e===c.m?5:0);S.xp+=xp;S.marks+=e;
  {const a=S.tp[c.t]||(S.tp[c.t]={e:0,m:0});a.e+=e;a.m+=c.m;const k=S.kp[c.k]||(S.kp[c.k]={e:0,m:0});k.e+=e;k.m+=c.m;S.hist[todayStr()]=(S.hist[todayStr()]||0)+e;const ks=Object.keys(S.hist).sort();while(ks.length>60)delete S.hist[ks.shift()]}
  if(S.day.d!==todayStr())S.day={d:todayStr(),m:0};S.day.m+=e;
  if(e===c.m){S.perfect++;if(c.k==="Exam trap")S.traps++}
  let lost=false;
  if(R.survival&&e<Math.ceil(c.m/2)){R.hearts--;lost=true;if(R.hearts<=0)R.over=true}
  save();
  if(R.over||R.i+1>=R.cards.length){finish();return}
  R.i++;prep();roundView();window.scrollTo(0,0);
  if(lost){const el=$("#card");el.classList.add("shake")}
}
function finish(){
  S.rounds++;
  const t=todayStr();
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.last===y.toLocaleDateString("en-CA"))?S.streak+1:1;S.last=t}
  if(S.streak>(S.best||0))S.best=S.streak;
  if(R.survival&&!R.over)S.survWins++;
  S.recent.unshift({d:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),l:R.label,e:R.earned,m:R.max});S.recent=S.recent.slice(0,10);
  logEvent({t:"round",round:R.label,marks:R.earned,max:R.max,xp:R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0),totalxp:S.xp+0,cards:R.log.length,over:R.over?1:0});
  R.newBadges=checkBadges();save();view="result";render();window.scrollTo(0,0);if(!R.over&&R.max&&R.earned/R.max>=.7)confetti();
}
function resultView(){
  const pct=R.max?R.earned/R.max:0,stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const msg=R.over?"Out of lives. Review the cards you missed and go again.":pct>=.9?"Outstanding. That is top-grade recall.":pct>=.7?"Strong round. A few marks to tidy up.":pct>=.4?"Good effort. The missed cards will come round again.":"Tough one. Read the mark schemes and try again.";
  const missed=R.log.filter(x=>x.e<x.c.m).map(x=>x.c);
  $("#app").innerHTML=`<div class="card result" style="--c:${CFG.accent}">
   <h1 style="margin-top:0">${R.over?"Game over":"Round complete"}</h1><p class="sub">${msg}</p>
   <div class="stars">${[0,1,2].map(i=>`<span class="star ${i<stars?"on":""}">${ICON.star}</span>`).join("")}</div>
   <div class="rstats"><div class="stat"><b>${R.earned}/${R.max}</b><span>marks</span></div><div class="stat"><b>${Math.round(pct*100)}%</b><span>score</span></div><div class="stat"><b>+${R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0)}</b><span>points</span></div></div>
   ${R.newBadges&&R.newBadges.length?`<div class="newb">${R.newBadges.map(b=>`<div class="badge got" style="margin:8px 0"><span class="ic">${ICON.medal}</span><div><b>New badge: ${b.n}</b><small>${b.d}</small></div></div>`).join("")}</div>`:""}
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
    ${missed.length?`<button class="btn" onclick="replay()">Retry ${missed.length} missed</button>`:""}
    <button class="btn ghost" onclick="go('home')">Back to home</button></div>
   ${missed.length?`<h2>Review</h2><div style="text-align:left">${missed.map(c=>`<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span></summary><div class="body"><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`).join("")}</div>`:""}
  </div>`;
  R.missed=missed;
}
function confetti(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cols=[CFG.accent,CFG.accent2,"#ffb84d","#3ddc97","#ffffff"];for(let i=0;i<46;i++){const s=document.createElement("i");s.className="conf";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.animationDuration=(1.8+Math.random()*1.6)+"s";s.style.animationDelay=(Math.random()*.5)+"s";s.style.borderRadius=i%3?"2px":"50%";document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function replay(){const m=R.missed;R={cards:shuffle(m.slice()),i:0,earned:0,max:0,hearts:null,survival:false,label:"Retry",rev:false,sel:[],log:[],over:false};prep();view="round";render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* ---------- library ---------- */
function library(){
  const kinds=[...new Set(DATA.map(c=>c.k))].sort();
  $("#app").innerHTML=`<div class="lib"><h1>Card <span class="grad">library</span></h1><p class="sub">Every question with its full mark scheme. Tap a card to open it.</p>
  <div class="chips">${[0].concat(TN).map(t=>`<button class="chip ${LIB.t===t?"on":""}" onclick="LIB.t=${t};library()">${t?"Topic "+t:"All topics"}</button>`).join("")}</div>
  <div class="chips"><input type="search" id="lq" placeholder="Search questions and answers" value="${LIB.q.replace(/"/g,"&quot;")}"><select id="lk"><option value="">All question types</option>${kinds.map(k=>`<option ${LIB.k===k?"selected":""}>${k}</option>`).join("")}</select><button class="chip" id="lo">Open all</button></div>
  <div id="lres"></div></div>`;
  const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
render();
</script>
