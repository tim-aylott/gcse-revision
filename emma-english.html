<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emma English">
<meta name="theme-color" content="#0d1020">
<title>Emma's English Lab | GCSE Eduqas revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#ff7a8a;--accent2:#ffb36b;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v3M12 17v3M5 12h14"/><circle cx="12" cy="7" r="0.5"/><circle cx="12" cy="17" r="0.5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span>English Lab</span></button>
  <span class="pill">Emma | Eduqas</span>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>

const DATA=[{"id": "ENG-01-001", "t": 1, "s": "C1 A", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>structure of Eduqas English Language Component 1<\/b>?", "a": ["<b>1 hour 45 minutes<\/b>, 80 marks, 40% of the qualification (1)", "<b>Section A<\/b>: reading one 20th-century literature prose extract (1)", "<b>Section B<\/b>: one creative prose writing task from a choice of four (1)"], "cp": ["1 hour 45 minutes, 80 marks, 40% of the qualification", "Section A: reading one 20th-century literature prose extract", "Section B: one creative prose writing task from a choice of four"], "dp": ["Two non-fiction extracts and two letters", "Spoken language presentation only", "Unseen poetry and a Shakespeare essay"], "mand": 0}, {"id": "ENG-01-002", "t": 1, "s": "C1 A", "k": "Recall", "m": 3, "ht": false, "q": "What kinds of question appear in <b>Component 1 Section A<\/b>?", "a": ["<b>Retrieval<\/b> or short-answer questions on a specified part (1)", "<b>Language analysis<\/b>: 'How does the writer...?' (1)", "<b>Evaluation<\/b> of a statement about the whole text (1)"], "cp": ["Retrieval or short-answer questions on a specified part", "Language analysis: 'How does the writer...?'", "Evaluation of a statement about the whole text"], "dp": ["Only vocabulary lists", "Only a letter to a newspaper", "Only poetry comparison"], "mand": 0}, {"id": "ENG-01-003", "t": 1, "s": "C1 A", "k": "Explain", "m": 3, "ht": false, "q": "A question asks you to <b>list five things<\/b> about a character. How do you answer it?", "a": ["Use <b>only the specified lines<\/b> (1)", "Pick <b>five clear, separate<\/b> details about that character (1)", "Write <b>short points<\/b>; no analysis needed (1)"], "cp": ["Use only the specified lines", "Pick five clear, separate details about that character", "Write short points; no analysis needed"], "dp": ["Write a long essay on the whole text", "Compare two texts", "Use quotations from other books"], "mand": 0}, {"id": "ENG-01-004", "t": 1, "s": "C hors<\/b> clutter the text (1)", "Overused images become <b>clichés<\/b> (1)", "Choose a <b>few precise, original<\/b> images (1)"], "cp": ["Too many similes and metaphors clutter the text", "Overused images become clichés", "Choose a few precise, original images"], "dp": ["More figurative language is always better", "Metaphors are banned", "Never use any description"], "mand": 0}, {"id": "ENG-02-018", "t": 2, "s": "C1 B", "k": "Evaluate", "m": 3, "ht": false, "q": "Is it better to <b>write a narrative or a description<\/b>? Weigh up the choice.", "a": ["<b>Narrative<\/b>: allows structure and plot (1)", "<b>Description<\/b>: lets you focus on language but needs structure (1)", "Choose the one you can <b>control and finish<\/b> (1)"], "cp": ["Narrative: allows structure and plot", "Description: lets you focus on language but needs structure", "Choose the one you can control and finish"], "dp": ["Description is always full marks", "Narrative is banned", "It makes no difference"], "mand": 0}, {"id": "ENG-02-019", "t": 2, "s": "C1 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>build a character<\/b> quickly in a short piece?", "a": ["Use a <b>telling detail<\/b> (1)", "Show them through <b>action and speech<\/b> (1)", "Give them a <b>clear want or problem<\/b> (1)"], "cp": ["Use a telling detail", "Show them through action and speech", "Give them a clear want or problem"], "dp": ["List their age and job", "Use ten adjectives", "Avoid personality"], "mand": 0}, {"id": "ENG-02-020", "t": 2, "s": "C1 B", "k": "Exam trap", "m": 2, "ht": false, "q": "A student starts with a <b>long backstory<\/b>. What is the problem?", "a": ["It <b>delays the action<\/b> (1)", "Little time left for <b>control and ending<\/b> (1)"], "cp": ["It delays the action", "Little time left for control and ending"], "dp": ["Backstory is required", "It adds marks automatically", "It improves technical accuracy"], "mand": 0}, {"id": "ENG-02-021", "t": 2, "s": "C1 B", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>changing viewpoint<\/b> without control risky?", "a": ["It can <b>confuse<\/b> the reader (1)", "It breaks <b>consistency<\/b> and structure (1)"], "cp": ["It can confuse the reader", "It breaks consistency and structure"], "dp": ["It always impresses examiners", "It is required", "It improves spelling"], "mand": 0}, {"id": "ENG-02-022", "t": 2, "s": "C1 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>proofread<\/b> in the last five minutes?", "a": ["Check <b>punctuation and capital letters<\/b> (1)", "Check <b>spelling<\/b> of simple and key words (1)", "Check <b>sentence boundaries<\/b> and tenses (1)"], "cp": ["Check punctuation and capital letters", "Check spelling of simple and key words", "Check sentence boundaries and tenses"], "dp": ["Rewrite the whole piece", "Add a new paragraph", "Skip checking"], "mand": 0}, {"id": "ENG-02-023", "t": 2, "s": "C1 B", "k": "Explain", "m": 3, "ht": false, "q": "Why does <b>planning<\/b> raise marks?", "a": ["Gives <b>structure and focus<\/b> (1)", "Prevents <b>rambling<\/b> (1)", "Helps you <b>finish<\/b> with a strong ending (1)"], "cp": ["Gives structure and focus", "Prevents rambling", "Helps you finish with a strong ending"], "dp": ["Planning wastes time", "Planning lowers marks", "It is not allowed"], "mand": 0}, {"id": "ENG-03-001", "t": 3, "s": "C2 A", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>structure of Eduqas English Language Component 2<\/b>?", "a": ["<b>2 hours<\/b>, 80 marks, 60% of the qualification (1)", "<b>Section A<\/b>: reading two non-fiction texts (19th and 21st century) (1)", "<b>Section B<\/b>: two transactional/persuasive writing tasks (1)"], "cp": ["2 hours, 80 marks, 60% of the qualification", "Section A: reading two non-fiction texts (19th and 21st century)", "Section B: two transactional/persuasive writing tasks"], "dp": ["One poem and a Shakespeare essay", "Creative story only", "Spoken language only"], "mand": 0}, {"id": "ENG-03-002", "t": 3, "s": "C2 A", "k": "Recall", "m": 3, "ht": false, "q": "What <b>kinds of text<\/b> might appear in Component 2 Section A?", "a": ["Any three (1 each):", "• <b>newspaper article<\/b>", "• <b>diary or letter<\/b>", "• <b>magazine article<\/b>", "• <b>speech<\/b>", "• <b>review or blog<\/b>", "• <b>travel writing<\/b>"], "cp": ["newspaper article", "diary or letter", "magazine article", "speech", "review or blog", "travel writing"], "dp": ["Only novels", "Only poems", "Only play scripts"], "mand": 0}, {"id": "ENG-03-003", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "What is a <b>retrieval<\/b> question and how do you answer it?", "a": ["Find <b>facts from the named text<\/b> (1)", "Use the <b>correct text<\/b> only (1)", "Keep answers <b>short and accurate<\/b> (1)"], "cp": ["Find facts from the named text", "Use the correct text only", "Keep answers short and accurate"], "dp": ["Write a long essay", "Use the wrong text", "Give opinions"], "mand": 0}, {"id": "ENG-03-004", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>analyse language in a non-fiction text<\/b>?", "a": ["Pick <b>precise quotations<\/b> (1)", "Name the <b>technique<\/b> (1)", "Explain the <b>effect on the reader<\/b> and the writer's purpose (1)"], "cp": ["Pick precise quotations", "Name the technique", "Explain the effect on the reader and the writer's purpose"], "dp": ["Retell the facts only", "Ignore the writer's purpose", "Quote nothing"], "mand": 0}, {"id": "ENG-03-005", "t": 3, "s": "C2 A", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three persuasive techniques<\/b> in non-fiction.", "a": ["Any three (1 each):", "• <b>rhetorical question<\/b>", "• <b>statistics<\/b>", "• <b>anecdote<\/b>", "• <b>emotive language<\/b>", "• <b>direct address<\/b>", "• <b>repetition / rule of three<\/b>"], "cp": ["rhetorical question", "statistics", "anecdote", "emotive language", "direct address", "repetition / rule of three"], "dp": ["Stanzas and rhyme", "Footnotes only", "Stage directions"], "mand": 0}, {"id": "ENG-03-006", "t": 3, "s": "C2 A", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>emotive language<\/b>?", "a": ["Words chosen to <b>trigger feelings<\/b> in the reader (1)", "e.g. <b>'heartbreaking'<\/b> or 'outrageous' (1)"], "cp": ["Words chosen to trigger feelings in the reader", "e.g. 'heartbreaking' or 'outrageous'"], "dp": ["Words with no meaning", "A grammar rule", "Words in brackets"], "mand": 0}, {"id": "ENG-03-007", "t": 3, "s": "C2 A", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>direct address<\/b>?", "a": ["Speaking to the reader using <b>'you'<\/b> (1)", "To create a <b>personal connection<\/b> (1)"], "cp": ["Speaking to the reader using 'you'", "To create a personal connection"], "dp": ["Using the author's address", "A full postal address", "Dialogue between characters"], "mand": 0}, {"id": "ENG-03-008", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>compare two non-fiction texts<\/b>?", "a": ["Make <b>clear comparison points<\/b> (1)", "Use <b>evidence from both<\/b> texts (1)", "Compare <b>methods and effects<\/b>, not just ideas (1)"], "cp": ["Make clear comparison points", "Use evidence from both texts", "Compare methods and effects, not just ideas"], "dp": ["Write about one text only", "List facts from each separately", "Only copy quotations"], "mand": 0}, {"id": "ENG-03-009", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "Give a <b>comparison sentence stem<\/b> and why it helps.", "a": ["'Whereas Text A..., Text B...' (1)", "Shows <b>difference or similarity<\/b> explicitly (1)", "Keeps both texts <b>linked<\/b> in one point (1)"], "cp": ["'Whereas Text A..., Text B...'", "Shows difference or similarity explicitly", "Keeps both texts linked in one point"], "dp": ["'Text A is long'", "'I like both'", "'The end'"], "mand": 0}, {"id": "ENG-03-010", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>evaluate a statement<\/b> about a text?", "a": ["Say <b>how far you agree<\/b> (1)", "Use <b>evidence<\/b> from the text (1)", "Comment on the writer's <b>methods<\/b> (1)"], "cp": ["Say how far you agree", "Use evidence from the text", "Comment on the writer's methods"], "dp": ["Ignore the statement", "Only agree without evidence", "Use no quotations"], "mand": 0}, {"id": "ENG-03-011", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "What does <b>'identify the writer's viewpoint'<\/b> involve?", "a": ["Find the <b>writer's attitude or opinion<\/b> (1)", "Support with <b>short quotations<\/b> (1)", "Explain how <b>language reveals it<\/b> (1)"], "cp": ["Find the writer's attitude or opinion", "Support with short quotations", "Explain how language reveals it"], "dp": ["Retell the plot", "Guess the author's age", "Ignore the text"], "mand": 0}, {"id": "ENG-03-012", "t": 3, "s": "C2 A", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>fact<\/b> and what is an <b>opinion<\/b>?", "a": ["<b>Fact<\/b>: something that can be proven (1)", "<b>Opinion<\/b>: a personal belief or view (1)"], "cp": ["Fact: something that can be proven", "Opinion: a personal belief or view"], "dp": ["Fact is a belief; opinion is proven", "Both mean the same", "Both are quotations"], "mand": 0}, {"id": "ENG-03-013", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "How does the <b>19th-century<\/b> style differ from 21st-century non-fiction?", "a": ["Often <b>longer, more complex<\/b> sentences (1)", "More <b>formal vocabulary<\/b> (1)", "Different <b>attitudes and context<\/b> to the topic (1)"], "cp": ["Often longer, more complex sentences", "More formal vocabulary", "Different attitudes and context to the topic"], "dp": ["Identical style", "19th-century texts use text speak", "21st-century texts use older English"], "mand": 0}, {"id": "ENG-03-014", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "How do you handle <b>unfamiliar vocabulary<\/b> in a 19th-century text?", "a": ["Use <b>context clues<\/b> (1)", "Look at <b>word parts<\/b> (1)", "Do not panic: focus on <b>the sense<\/b> (1)"], "cp": ["Use context clues", "Look at word parts", "Do not panic: focus on the sense"], "dp": ["Skip the whole text", "Guess random meanings", "Stop reading"], "mand": 0}, {"id": "ENG-03-015", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "How can <b>structure<\/b> be analysed in non-fiction?", "a": ["Comment on how the text <b>opens and builds<\/b> (1)", "Notice <b>paragraph and topic shifts<\/b> (1)", "Explain the effect of the <b>ending<\/b> (1)"], "cp": ["Comment on how the text opens and builds", "Notice paragraph and topic shifts", "Explain the effect of the ending"], "dp": ["Count the words", "Ignore the order", "Describe the font"], "mand": 0}, {"id": "ENG-03-016", "t": 3, "s": "C2 A", "k": "Recall", "m": 3, "ht": false, "q": "What does <b>'purpose, audience, form'<\/b> (PAF) stand for?", "a": ["<b>Purpose<\/b>: why it is written (1)", "<b>Audience<\/b>: who it is for (1)", "<b>Form<\/b>: type of text (1)"], "cp": ["Purpose: why it is written", "Audience: who it is for", "Form: type of text"], "dp": ["Poem, art, film", "Plot, action, feeling", "Page, author, font"], "mand": 0}, {"id": "ENG-03-017", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "Why does <b>audience<\/b> matter when analysing a text?", "a": ["The writer chooses <b>tone and vocabulary<\/b> for them (1)", "It affects <b>formality<\/b> (1)", "It shapes the <b>persuasive methods<\/b> used (1)"], "cp": ["The writer chooses tone and vocabulary for them", "It affects formality", "It shapes the persuasive methods used"], "dp": ["It never matters", "Audience is always the author", "Audience means page count"], "mand": 0}, {"id": "ENG-03-018", "t": 3, "s": "C2 A", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>bias<\/b>?", "a": ["A <b>one-sided<\/b> or unfair view (1)", "Presenting facts to <b>favour one position<\/b> (1)"], "cp": ["A one-sided or unfair view", "Presenting facts to favour one position"], "dp": ["A balanced report", "A type of punctuation", "A neutral description"], "mand": 0}, {"id": "ENG-03-019", "t": 3, "s": "C2 A", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>anecdote<\/b>?", "a": ["A <b>short personal story<\/b> (1)", "Used to <b>illustrate a point<\/b> (1)"], "cp": ["A short personal story", "Used to illustrate a point"], "dp": ["A statistic", "A heading", "A reference list"], "mand": 0}, {"id": "ENG-03-020", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "How can <b>statistics<\/b> persuade a reader?", "a": ["Give an impression of <b>accuracy and authority<\/b> (1)", "Make a claim seem <b>factual<\/b> (1)", "Can be <b>selected to support bias<\/b> (1)"], "cp": ["Give an impression of accuracy and authority", "Make a claim seem factual", "Can be selected to support bias"], "dp": ["Statistics always lie", "They have no effect", "They only appear in poems"], "mand": 0}, {"id": "ENG-03-021", "t": 3, "s": "C2 A", "k": "Explain", "m": 3, "ht": false, "q": "What does <b>'tone' in non-fiction<\/b> tell the reader?", "a": ["The writer's <b>attitude<\/b> (1)", "e.g. <b>serious, humorous, critical<\/b> (1)", "Shown through <b>word choice and sentence style<\/b> (1)"], "cp": ["The writer's attitude", "e.g. serious, humorous, critical", "Shown through word choice and sentence style"], "dp": ["The font size", "The number of paragraphs", "The page layout only"], "mand": 0}, {"id": "ENG-03-022", "t": 3, "s": "C2 A", "k": "Exam trap", "m": 2, "ht": false, "q": "A student <b>copies out facts<\/b> in a comparison question. Why does it lose marks?", "a": ["It is <b>description, not comparison<\/b> (1)", "Examiners want <b>methods and effects compared<\/b> (1)"], "cp": ["It is description, not comparison", "Examiners want methods and effects compared"], "dp": ["Facts earn full marks", "Facts are required", "Copying shows analysis"], "mand": 0}, {"id": "ENG-03-023", "t": 3, "s": "C2 A", "k": "Exam trap", "m": 2, "ht": false, "q": "A student answers on the <b>wrong text<\/b>. What is the consequence?", "a": ["<b>No marks<\/b> for that evidence (1)", "Always check <b>which text<\/b> the question names (1)"], "cp": ["No marks for that evidence", "Always check which text the question names"], "dp": ["Full marks anyway", "The examiner swaps the text", "Bonus marks"], "mand": 0}, {"id": "ENG-03-024", "t": 3, "s": "C2 A", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'it is persuasive'<\/b> alone a weak answer?", "a": ["No <b>technique<\/b> named (1)", "No <b>quotation or effect<\/b> explained (1)"], "cp": ["No technique named", "No quotation or effect explained"], "dp": ["It scores full marks", "Persuasion is not assessed", "It is a detailed analysis"], "mand": 0}, {"id": "ENG-04-001", "t": 4, "s": "C2 B", "k": "Recall", "m": 3, "ht": false, "q": "What happens in <b>Component 2 Section B<\/b>?", "a": ["<b>Two<\/b> compulsory writing tasks (1)", "<b>Transactional or persuasive<\/b> forms, e.g. letter, article, speech (1)", "Linked to the <b>theme<\/b> of Section A (1)"], "cp": ["Two compulsory writing tasks", "Transactional or persuasive forms, e.g. letter, article, speech", "Linked to the theme of Section A"], "dp": ["One creative story only", "One poem", "A Shakespeare essay"], "mand": 0}, {"id": "ENG-04-002", "t": 4, "s": "C2 B", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>key writing skills<\/b> marked in Component 2 Section B?", "a": ["<b>Content and organisation<\/b> (1)", "<b>Technical accuracy<\/b> (1)", "Writing must fit <b>audience, purpose and form<\/b> (1)"], "cp": ["Content and organisation", "Technical accuracy", "Writing must fit audience, purpose and form"], "dp": ["Handwriting only", "Quotation analysis", "Memory of set texts"], "mand": 0}, {"id": "ENG-04-003", "t": 4, "s": "C2 B", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three forms<\/b> you may be asked to write.", "a": ["Any three (1 each):", "• <b>formal letter<\/b>", "• <b>article<\/b>", "• <b>speech<\/b>", "• <b>review<\/b>", "• <b>leaflet<\/b>", "• <b>report<\/b>"], "cp": ["formal letter", "article", "speech", "review", "leaflet", "report"], "dp": ["Sonnet", "Stage play", "Diary of a dragon"], "mand": 0}, {"id": "ENG-04-004", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>analyse a writing task<\/b> before you start?", "a": ["Identify the <b>form<\/b> (1)", "Identify the <b>audience<\/b> (1)", "Identify the <b>purpose<\/b> and any tone clues (1)"], "cp": ["Identify the form", "Identify the audience", "Identify the purpose and any tone clues"], "dp": ["Start writing immediately", "Ignore the task details", "Pick any form"], "mand": 0}, {"id": "ENG-04-005", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>set out a formal letter<\/b>?", "a": ["<b>Addresses and date<\/b> in the correct places (1)", "<b>'Dear Sir/Madam'<\/b> or named recipient with matching ending (1)", "Paragraphs and a <b>formal tone<\/b> (1)"], "cp": ["Addresses and date in the correct places", "'Dear Sir/Madam' or named recipient with matching ending", "Paragraphs and a formal tone"], "dp": ["Start with 'Hey mate'", "Skip the sign-off", "Use text speak"], "mand": 0}, {"id": "ENG-04-006", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How should a letter <b>end<\/b> after 'Dear Sir or Madam'?", "a": ["'Yours faithfully' (1)", "If you used a name: 'Yours sincerely' (1)", "Followed by your <b>name<\/b> (1)"], "cp": ["'Yours faithfully'", "If you used a name: 'Yours sincerely'", "Followed by your name"], "dp": ["Love from", "Bye", "See you"], "mand": 0}, {"id": "ENG-04-007", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>structure an article<\/b>?", "a": ["A strong <b>headline<\/b> (1)", "An engaging <b>introduction<\/b> (1)", "<b>Paragraphs<\/b> with topic sentences and a conclusion (1)"], "cp": ["A strong headline", "An engaging introduction", "Paragraphs with topic sentences and a conclusion"], "dp": ["No title", "One huge paragraph", "Only bullet points"], "mand": 0}, {"id": "ENG-04-008", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "What are the <b>features of a speech<\/b>?", "a": ["<b>Direct address<\/b> and greeting (1)", "<b>Rhetorical devices<\/b> such as rule of three (1)", "A <b>clear opening and closing<\/b> (1)"], "cp": ["Direct address and greeting", "Rhetorical devices such as rule of three", "A clear opening and closing"], "dp": ["No audience", "No opening", "Footnotes"], "mand": 0}, {"id": "ENG-04-009", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write persuasively<\/b>?", "a": ["Use <b>rhetorical questions and emotive language<\/b> (1)", "Use <b>facts or statistics<\/b> (1)", "Build a <b>logical argument<\/b> with counter-argument (1)"], "cp": ["Use rhetorical questions and emotive language", "Use facts or statistics", "Build a logical argument with counter-argument"], "dp": ["Insult the reader", "Use no evidence", "Write one sentence"], "mand": 0}, {"id": "ENG-04-010", "t": 4, "s": "C2 B", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>AFOREST<\/b> toolkit?", "a": ["Alliteration, Facts, Opinion, Rhetorical questions (1)", "Emotive language, Statistics, Triples (1)", "Techniques for <b>persuasive writing<\/b> (1)"], "cp": ["Alliteration, Facts, Opinion, Rhetorical questions", "Emotive language, Statistics, Triples", "Techniques for persuasive writing"], "dp": ["A type of poem", "A spelling test", "A punctuation rule"], "mand": 0}, {"id": "ENG-04-011", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write a counter-argument<\/b>?", "a": ["Acknowledge the <b>other view<\/b> (1)", "Then <b>challenge or refute<\/b> it (1)", "Shows <b>balanced, mature<\/b> thinking (1)"], "cp": ["Acknowledge the other view", "Then challenge or refute it", "Shows balanced, mature thinking"], "dp": ["Ignore other views", "Agree with everyone", "Skip the argument"], "mand": 0}, {"id": "ENG-04-012", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How does <b>register<\/b> change for different audiences?", "a": ["<b>Formal<\/b> for adults or officials (1)", "<b>Informal<\/b> for friends or peers (1)", "Keep it <b>consistent<\/b> within the piece (1)"], "cp": ["Formal for adults or officials", "Informal for friends or peers", "Keep it consistent within the piece"], "dp": ["Always informal", "Always slang", "Never change"], "mand": 0}, {"id": "ENG-04-013", "t": 4, "s": "C2 B", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>register<\/b>?", "a": ["The <b>level of formality<\/b> in writing (1)", "Matched to <b>audience and purpose<\/b> (1)"], "cp": ["The level of formality in writing", "Matched to audience and purpose"], "dp": ["A school list", "A type of punctuation", "A text's length"], "mand": 0}, {"id": "ENG-04-014", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write a review<\/b>?", "a": ["Give a <b>brief summary<\/b> without spoilers (1)", "Give <b>opinion with reasons<\/b> (1)", "Include a <b>recommendation<\/b> and rating (1)"], "cp": ["Give a brief summary without spoilers", "Give opinion with reasons", "Include a recommendation and rating"], "dp": ["Retell the full plot", "Only insult it", "No opinion"], "mand": 0}, {"id": "ENG-04-015", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>make a report formal and clear<\/b>?", "a": ["Use <b>headings<\/b> (1)", "Use <b>formal language<\/b> (1)", "End with a <b>conclusion or recommendation<\/b> (1)"], "cp": ["Use headings", "Use formal language", "End with a conclusion or recommendation"], "dp": ["Use jokes", "No sections", "No conclusion"], "mand": 0}, {"id": "ENG-04-016", "t": 4, "s": "C2 B", "k": "Recall", "m": 3, "ht": false, "q": "How should you <b>spend time<\/b> on Component 2 Section B?", "a": ["About <b>an hour<\/b> on the two tasks (1)", "<b>Plan briefly<\/b> for each (1)", "<b>Proofread<\/b> at the end (1)"], "cp": ["About an hour on the two tasks", "Plan briefly for each", "Proofread at the end"], "dp": ["Spend two hours on one task", "No planning", "Skip proofreading"], "mand": 0}, {"id": "ENG-04-017", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>vary paragraph openings<\/b> in transactional writing?", "a": ["Use <b>discourse markers<\/b> such as 'However' (1)", "Start with <b>different structures<\/b> (1)", "Keep logical <b>flow<\/b> (1)"], "cp": ["Use discourse markers such as 'However'", "Start with different structures", "Keep logical flow"], "dp": ["Start every paragraph with 'I'", "Use no connectives", "Repeat the same opener"], "mand": 0}, {"id": "ENG-04-018", "t": 4, "s": "C2 B", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>discourse markers<\/b>?", "a": ["Words that <b>link ideas<\/b> and signal structure (1)", "e.g. <b>'furthermore'<\/b> or 'in conclusion' (1)"], "cp": ["Words that link ideas and signal structure", "e.g. 'furthermore' or 'in conclusion'"], "dp": ["Punctuation marks", "Speech marks", "Spelling errors"], "mand": 0}, {"id": "ENG-04-019", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "Why should you <b>match tone to purpose<\/b>?", "a": ["A complaint needs a <b>firm but polite<\/b> tone (1)", "A speech may be <b>energetic and persuasive<\/b> (1)", "The wrong tone <b>loses marks<\/b> for audience awareness (1)"], "cp": ["A complaint needs a firm but polite tone", "A speech may be energetic and persuasive", "The wrong tone loses marks for audience awareness"], "dp": ["Tone never matters", "Be rude in every task", "Use slang everywhere"], "mand": 0}, {"id": "ENG-04-020", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How can you <b>use personal experience<\/b> in a persuasive piece?", "a": ["Use an <b>anecdote<\/b> (1)", "Link it to the <b>argument<\/b> (1)", "Do not let it take over the <b>structure<\/b> (1)"], "cp": ["Use an anecdote", "Link it to the argument", "Do not let it take over the structure"], "dp": ["Never include examples", "Write a diary instead", "Make up unrelated stories"], "mand": 0}, {"id": "ENG-04-021", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write an effective conclusion<\/b>?", "a": ["<b>Summarise<\/b> the main argument (1)", "End with a <b>call to action or strong final line<\/b> (1)", "Do not add <b>new points<\/b> (1)"], "cp": ["Summarise the main argument", "End with a call to action or strong final line", "Do not add new points"], "dp": ["Start a new argument", "End mid-sentence", "Repeat the introduction word for word"], "mand": 0}, {"id": "ENG-04-022", "t": 4, "s": "C2 B", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>informally<\/b> for a head teacher. What is wrong?", "a": ["The <b>register does not fit<\/b> the audience (1)", "Loses marks for <b>audience and tone<\/b> (1)"], "cp": ["The register does not fit the audience", "Loses marks for audience and tone"], "dp": ["Informal is always best", "The head teacher prefers slang", "No effect on marks"], "mand": 0}, {"id": "ENG-04-023", "t": 4, "s": "C2 B", "k": "Exam trap", "m": 2, "ht": false, "q": "A student <b>ignores the form<\/b> asked for. What is the risk?", "a": ["Loses marks for <b>form and purpose<\/b> (1)", "The task may not be <b>fulfilled<\/b> (1)"], "cp": ["Loses marks for form and purpose", "The task may not be fulfilled"], "dp": ["Form is never checked", "Examiners ignore form", "It earns extra marks"], "mand": 0}, {"id": "ENG-04-024", "t": 4, "s": "C2 B", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>listing techniques without using them well<\/b> a problem?", "a": ["It reads as <b>artificial<\/b> (1)", "Marks reward <b>control and purpose<\/b>, not quantity (1)"], "cp": ["It reads as artificial", "Marks reward control and purpose, not quantity"], "dp": ["More techniques mean more marks", "Techniques are banned", "It shows accuracy"], "mand": 0}, {"id": "ENG-04-025", "t": 4, "s": "C2 B", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>develop an idea<\/b> in a paragraph?", "a": ["State the <b>main point<\/b> (1)", "Add <b>detail or evidence<\/b> (1)", "Link back to your <b>argument<\/b> (1)"], "cp": ["State the main point", "Add detail or evidence", "Link back to your argument"], "dp": ["Write one line", "Add unrelated detail", "Skip the point"], "mand": 0}, {"id": "ENG-05-001", "t": 5, "s": "SPaG", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>noun<\/b> and what is a <b>verb<\/b>?", "a": ["<b>Noun<\/b>: names a person, place, thing or idea (1)", "<b>Verb<\/b>: shows an action or state (1)"], "cp": ["Noun: names a person, place, thing or idea", "Verb: shows an action or state"], "dp": ["Noun is an action; verb is a name", "Both describe nouns", "Both are punctuation"], "mand": 0}, {"id": "ENG-05-002", "t": 5, "s": "SPaG", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>adjective<\/b> and an <b>adverb<\/b>?", "a": ["<b>Adjective<\/b>: describes a noun (1)", "<b>Adverb<\/b>: describes a verb, adjective or adverb (1)"], "cp": ["Adjective: describes a noun", "Adverb: describes a verb, adjective or adverb"], "dp": ["Adjective describes verbs only", "Adverb names a thing", "Both are verbs"], "mand": 0}, {"id": "ENG-05-003", "t": 5, "s": "SPaG", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>sentence<\/b>?", "a": ["A group of words with a <b>subject and verb<\/b> (1)", "That makes <b>complete sense<\/b> (1)"], "cp": ["A group of words with a subject and verb", "That makes complete sense"], "dp": ["Any group of letters", "A paragraph", "A single word always"], "mand": 0}, {"id": "ENG-05-004", "t": 5, "s": "SPaG", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of sentence structure<\/b>.", "a": ["<b>Simple<\/b> (1)", "<b>Compound<\/b> (1)", "<b>Complex<\/b> (1)"], "cp": ["Simple", "Compound", "Complex"], "dp": ["Short, medium and long", "Fast, slow and steady", "First, second and third"], "mand": 0}, {"id": "ENG-05-005", "t": 5, "s": "SPaG", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>compound sentence<\/b>?", "a": ["Two <b>main clauses<\/b> joined (1)", "By a <b>conjunction<\/b> such as and, but, or (1)"], "cp": ["Two main clauses joined", "By a conjunction such as and, but, or"], "dp": ["One clause only", "A clause with no verb", "A single word"], "mand": 0}, {"id": "ENG-05-006", "t": 5, "s": "SPaG", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>complex sentence<\/b>?", "a": ["Has a <b>main clause<\/b> (1)", "And at least one <b>subordinate clause<\/b> (1)"], "cp": ["Has a main clause", "And at least one subordinate clause"], "dp": ["Two main clauses with 'and'", "Only one word", "No verb"], "mand": 0}, {"id": "ENG-05-007", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "When do you use a <b>comma<\/b>?", "a": ["In <b>lists<\/b> (1)", "After a <b>fronted adverbial or subordinate clause<\/b> (1)", "Around <b>extra information<\/b> (parenthesis) (1)"], "cp": ["In lists", "After a fronted adverbial or subordinate clause", "Around extra information (parenthesis)"], "dp": ["Between every word", "At the end of every line", "Never"], "mand": 0}, {"id": "ENG-05-008", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you avoid a <b>comma splice<\/b>?", "a": ["A comma alone cannot join <b>two main clauses<\/b> (1)", "Use a <b>full stop<\/b> or semicolon (1)", "Or add a <b>conjunction<\/b> (1)"], "cp": ["A comma alone cannot join two main clauses", "Use a full stop or semicolon", "Or add a conjunction"], "dp": ["Add more commas", "Use no punctuation", "Use an exclamation mark every time"], "mand": 0}, {"id": "ENG-05-009", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you use a <b>semicolon<\/b>?", "a": ["Join two <b>related main clauses<\/b> (1)", "Use in <b>complex lists<\/b> (1)", "Do not use it before a quotation mark instead of a full stop (1)"], "cp": ["Join two related main clauses", "Use in complex lists", "Do not use it before a quotation mark instead of a full stop"], "dp": ["Replace every comma", "Use it to end the paper", "Use it instead of capital letters"], "mand": 0}, {"id": "ENG-05-010", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you use a <b>colon<\/b>?", "a": ["Introduce a <b>list<\/b> (1)", "Introduce an <b>explanation or quotation<\/b> (1)", "Must follow a <b>full clause<\/b> (1)"], "cp": ["Introduce a list", "Introduce an explanation or quotation", "Must follow a full clause"], "dp": ["Replace full stops", "Start every sentence", "Use after 'the'"], "mand": 0}, {"id": "ENG-05-011", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "When do you use an <b>apostrophe<\/b>?", "a": ["For <b>contractions<\/b>, e.g. don't (1)", "For <b>possession<\/b>, e.g. Tim's book (1)", "Not for <b>plurals<\/b> (1)"], "cp": ["For contractions, e.g. don't", "For possession, e.g. Tim's book", "Not for plurals"], "dp": ["Before every 's'", "To make plurals", "Never in writing"], "mand": 0}, {"id": "ENG-05-012", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>its<\/b> and <b>it's<\/b>.", "a": ["<b>it's<\/b> = it is or it has (1)", "<b>its<\/b> = belonging to it (1)", "Test: can you say 'it is'? (1)"], "cp": ["it's = it is or it has", "its = belonging to it", "Test: can you say 'it is'?"], "dp": ["They mean the same", "its means it is", "it's shows possession"], "mand": 0}, {"id": "ENG-05-013", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>there, their and they're<\/b>.", "a": ["<b>there<\/b>: place or existence (1)", "<b>their<\/b>: belonging to them (1)", "<b>they're<\/b>: they are (1)"], "cp": ["there: place or existence", "their: belonging to them", "they're: they are"], "dp": ["All mean the same", "their is a place", "there is a contraction of 'they are'"], "mand": 0}, {"id": "ENG-05-014", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>your and you're<\/b>, <b>to, too and two<\/b>.", "a": ["<b>your<\/b> shows possession; <b>you're<\/b> = you are (1)", "<b>to<\/b> a preposition/verb marker; <b>too<\/b> = also or excessive (1)", "<b>two<\/b> = the number 2 (1)"], "cp": ["your shows possession; you're = you are", "to a preposition/verb marker; too = also or excessive", "two = the number 2"], "dp": ["You're shows possession", "too and to are numbers", "Two means also"], "mand": 0}, {"id": "ENG-05-015", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>punctuate direct speech<\/b>?", "a": ["Use <b>speech marks<\/b> around spoken words (1)", "<b>Punctuation inside<\/b> the speech marks (1)", "New <b>line for a new speaker<\/b> (1)"], "cp": ["Use speech marks around spoken words", "Punctuation inside the speech marks", "New line for a new speaker"], "dp": ["No marks at all", "Speech marks around everything", "One paragraph for all speakers"], "mand": 0}, {"id": "ENG-05-016", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write paragraphs<\/b> correctly?", "a": ["Start a new paragraph for a <b>new idea, time, place or speaker<\/b> (1)", "Use a <b>topic sentence<\/b> (1)", "Keep ideas <b>logically linked<\/b> (1)"], "cp": ["Start a new paragraph for a new idea, time, place or speaker", "Use a topic sentence", "Keep ideas logically linked"], "dp": ["Never use paragraphs", "One paragraph per word", "Random breaks"], "mand": 0}, {"id": "ENG-05-017", "t": 5, "s": "SPaG", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of punctuation<\/b> to show a pause or break.", "a": ["Any three (1 each):", "• <b>comma<\/b>", "• <b>dash<\/b>", "• <b>brackets<\/b>", "• <b>semicolon<\/b>", "• <b>colon<\/b>", "• <b>ellipsis<\/b>"], "cp": ["comma", "dash", "brackets", "semicolon", "colon", "ellipsis"], "dp": ["Capital letters", "Italics", "Bullets"], "mand": 0}, {"id": "ENG-05-018", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>check tense consistency<\/b>?", "a": ["Decide whether the piece is in <b>past or present<\/b> (1)", "Keep verbs in the <b>same tense<\/b> (1)", "Only change for a <b>clear reason<\/b> (1)"], "cp": ["Decide whether the piece is in past or present", "Keep verbs in the same tense", "Only change for a clear reason"], "dp": ["Switch tense every sentence", "Use no verbs", "Ignore tense"], "mand": 0}, {"id": "ENG-05-019", "t": 5, "s": "SPaG", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>Standard English<\/b>?", "a": ["The <b>formal, widely accepted<\/b> form of English (1)", "Used in <b>exams and formal writing<\/b> (1)"], "cp": ["The formal, widely accepted form of English", "Used in exams and formal writing"], "dp": ["Slang", "Text speak", "Dialect only"], "mand": 0}, {"id": "ENG-05-020", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>spell tricky words<\/b> in the exam?", "a": ["Break into <b>syllables<\/b> (1)", "Use <b>rules and mnemonics<\/b> (1)", "Choose a <b>simpler word<\/b> if unsure (1)"], "cp": ["Break into syllables", "Use rules and mnemonics", "Choose a simpler word if unsure"], "dp": ["Guess randomly", "Skip all hard words", "Use text speak"], "mand": 0}, {"id": "ENG-05-021", "t": 5, "s": "SPaG", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three common homophone pairs<\/b> to learn.", "a": ["Any three (1 each):", "• <b>their / there<\/b>", "• <b>your / you're<\/b>", "• <b>to / too<\/b>", "• <b>were / where<\/b>", "• <b>of / off<\/b>", "• <b>affect / effect<\/b>"], "cp": ["their / there", "your / you're", "to / too", "were / where", "of / off", "affect / effect"], "dp": ["Cat / cat", "Big / large", "Fast / quick"], "mand": 0}, {"id": "ENG-05-022", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>affect<\/b> and <b>effect<\/b>.", "a": ["<b>Affect<\/b> is usually a verb: to influence (1)", "<b>Effect<\/b> is usually a noun: a result (1)", "Check which <b>part of speech<\/b> you need (1)"], "cp": ["Affect is usually a verb: to influence", "Effect is usually a noun: a result", "Check which part of speech you need"], "dp": ["They are identical", "Affect is always a noun", "Effect is always a verb"], "mand": 0}, {"id": "ENG-05-023", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>use capital letters<\/b> correctly?", "a": ["<b>Start of sentences<\/b> (1)", "<b>Proper nouns<\/b> and names (1)", "Not for <b>ordinary nouns<\/b> mid-sentence (1)"], "cp": ["Start of sentences", "Proper nouns and names", "Not for ordinary nouns mid-sentence"], "dp": ["Every noun", "Every verb", "Random words"], "mand": 0}, {"id": "ENG-05-024", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>vary vocabulary<\/b> without sounding forced?", "a": ["Choose <b>precise words<\/b> (1)", "Avoid repeating <b>simple words<\/b> (1)", "Only use words you can <b>spell and use<\/b> correctly (1)"], "cp": ["Choose precise words", "Avoid repeating simple words", "Only use words you can spell and use correctly"], "dp": ["Use the longest words", "Use a thesaurus word for everything", "Use slang"], "mand": 0}, {"id": "ENG-05-025", "t": 5, "s": "SPaG", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'alot'<\/b> and <b>'should of'<\/b>. What are the correct forms?", "a": ["<b>'a lot'<\/b> (1)", "<b>'should have'<\/b> (1)"], "cp": ["'a lot'", "'should have'"], "dp": ["'allot' and 'should off'", "'alot' and 'should of' are correct", "'a lott' and 'shoulda'"], "mand": 0}, {"id": "ENG-05-026", "t": 5, "s": "SPaG", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is a <b>run-on sentence<\/b> a problem?", "a": ["It <b>joins ideas without punctuation<\/b> (1)", "Harms <b>clarity and accuracy marks<\/b> (1)"], "cp": ["It joins ideas without punctuation", "Harms clarity and accuracy marks"], "dp": ["It earns top marks", "It is a form of poetry", "It shows style"], "mand": 0}, {"id": "ENG-05-027", "t": 5, "s": "SPaG", "k": "Exam trap", "m": 2, "ht": false, "q": "A student uses <b>text-speak<\/b> in an exam. What is wrong?", "a": ["It is <b>not Standard English<\/b> (1)", "Loses marks for <b>tone and accuracy<\/b> (1)"], "cp": ["It is not Standard English", "Loses marks for tone and accuracy"], "dp": ["It is encouraged", "It earns marks", "Examiners prefer it"], "mand": 0}, {"id": "ENG-05-028", "t": 5, "s": "SPaG", "k": "Explain", "m": 3, "ht": false, "q": "Why do <b>spelling, punctuation and grammar<\/b> matter in both Language components?", "a": ["<b>Technical accuracy<\/b> is a separate mark band (1)", "Accurate writing is <b>clearer<\/b> (1)", "Errors can <b>limit the overall mark<\/b> (1)"], "cp": ["Technical accuracy is a separate mark band", "Accurate writing is clearer", "Errors can limit the overall mark"], "dp": ["They never matter", "Only handwriting matters", "They are not assessed"], "mand": 0}, {"id": "ENG-06-001", "t": 6, "s": "Lit 1", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>structure of Eduqas English Literature Component 1<\/b>?", "a": ["<b>2 hours<\/b>, 40% of the qualification (1)", "<b>Section A<\/b>: Shakespeare, one extract question plus one essay (1)", "<b>Section B<\/b>: poetry 1789 to present from the anthology (1)"], "cp": ["2 hours, 40% of the qualification", "Section A: Shakespeare, one extract question plus one essay", "Section B: poetry 1789 to present from the anthology"], "dp": ["Spoken language and creative writing", "Unseen poetry only", "Non-fiction reading"], "mand": 0}, {"id": "ENG-06-002", "t": 6, "s": "Lit 2", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>structure of Eduqas English Literature Component 2<\/b>?", "a": ["<b>2 hours 30 minutes<\/b>, 60% of the qualification (1)", "<b>Section A<\/b>: post-1914 prose or drama; <b>Section B<\/b>: 19th-century prose (1)", "<b>Section C<\/b>: unseen poetry (two poems, one compared) (1)"], "cp": ["2 hours 30 minutes, 60% of the qualification", "Section A: post-1914 prose or drama; Section B: 19th-century prose", "Section C: unseen poetry (two poems, one compared)"], "dp": ["Shakespeare and poetry only", "Creative writing and letters", "Spoken language"], "mand": 0}, {"id": "ENG-06-003", "t": 6, "s": "Lit", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four assessment objectives<\/b> in English Literature.", "a": ["<b>AO1<\/b>: read, understand and respond with evidence (1)", "<b>AO2<\/b>: analyse language, form and structure (1)", "<b>AO3<\/b>: context and links between texts (1)", "<b>AO4<\/b>: accurate vocabulary, spelling and punctuation (1)"], "cp": ["AO1: read, understand and respond with evidence", "AO2: analyse language, form and structure", "AO3: context and links between texts", "AO4: accurate vocabulary, spelling and punctuation"], "dp": ["Speaking, listening, writing, reading", "Plot, character, theme, setting", "Facts, opinions, evidence, summary"], "mand": 0}, {"id": "ENG-06-004", "t": 6, "s": "Lit 1", "k": "Explain", "m": 3, "ht": false, "q": "How do you answer a <b>Shakespeare extract question<\/b>?", "a": ["Read the <b>extract carefully<\/b> (1)", "Analyse <b>language and structure<\/b> with quotations (1)", "Link to the <b>whole play<\/b> and context where relevant (1)"], "cp": ["Read the extract carefully", "Analyse language and structure with quotations", "Link to the whole play and context where relevant"], "dp": ["Ignore the extract", "Write only about plot", "Quote nothing"], "mand": 0}, {"id": "ENG-06-005", "t": 6, "s": "Lit 1", "k": "Explain", "m": 3, "ht": false, "q": "How do you answer a <b>Shakespeare essay question<\/b>?", "a": ["Plan <b>3 or 4 key points<\/b> (1)", "Use <b>quotations from across the play<\/b> (1)", "Link to <b>context and audience<\/b> (1)"], "cp": ["Plan 3 or 4 key points", "Use quotations from across the play", "Link to context and audience"], "dp": ["Write about the extract only", "Retell the plot", "No evidence"], "mand": 0}, {"id": "ENG-06-006", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How should you <b>use context<\/b> (AO3)?", "a": ["Link to the <b>historical, social or literary<\/b> background (1)", "Explain how it <b>affects meaning<\/b> (1)", "Do not write a <b>history lesson<\/b> (1)"], "cp": ["Link to the historical, social or literary background", "Explain how it affects meaning", "Do not write a history lesson"], "dp": ["Write a full biography", "Ignore context", "Add random facts"], "mand": 0}, {"id": "ENG-06-007", "t": 6, "s": "Lit", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>theme<\/b>?", "a": ["A <b>central idea<\/b> explored in a text (1)", "e.g. <b>power, love or conflict<\/b> (1)"], "cp": ["A central idea explored in a text", "e.g. power, love or conflict"], "dp": ["A character's name", "A plot event only", "A punctuation mark"], "mand": 0}, {"id": "ENG-06-008", "t": 6, "s": "Lit", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>character arc<\/b>?", "a": ["How a character <b>changes<\/b> across a text (1)", "From <b>start to finish<\/b> (1)"], "cp": ["How a character changes across a text", "From start to finish"], "dp": ["A shape on a graph", "A single scene", "A rhyme scheme"], "mand": 0}, {"id": "ENG-06-009", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write about a character<\/b> well?", "a": ["Link to <b>words, actions and relationships<\/b> (1)", "Use <b>precise quotations<\/b> (1)", "Comment on <b>the writer's purpose<\/b> (1)"], "cp": ["Link to words, actions and relationships", "Use precise quotations", "Comment on the writer's purpose"], "dp": ["Only retell the plot", "Describe appearance only", "Use no evidence"], "mand": 0}, {"id": "ENG-06-010", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write about a theme<\/b> well?", "a": ["Define the <b>theme<\/b> in the question's terms (1)", "Trace it with <b>evidence across the text<\/b> (1)", "Explain <b>how the writer develops it<\/b> (1)"], "cp": ["Define the theme in the question's terms", "Trace it with evidence across the text", "Explain how the writer develops it"], "dp": ["State the theme only", "Use one quotation", "Ignore the writer"], "mand": 0}, {"id": "ENG-06-011", "t": 6, "s": "Lit", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>dramatic irony<\/b>?", "a": ["The audience <b>knows more<\/b> than a character (1)", "Creates <b>tension or sympathy<\/b> (1)"], "cp": ["The audience knows more than a character", "Creates tension or sympathy"], "dp": ["A character knows everything", "A type of rhyme", "A grammar rule"], "mand": 0}, {"id": "ENG-06-012", "t": 6, "s": "Lit", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>soliloquy<\/b>?", "a": ["A speech where a character <b>speaks alone<\/b> (1)", "Revealing <b>inner thoughts<\/b> to the audience (1)"], "cp": ["A speech where a character speaks alone", "Revealing inner thoughts to the audience"], "dp": ["A conversation between two characters", "A written letter", "A stage direction"], "mand": 0}, {"id": "ENG-06-013", "t": 6, "s": "Lit", "k": "Definition", "m": 2, "ht": false, "q": "What are <b>stage directions<\/b>?", "a": ["Instructions about <b>action, movement or tone<\/b> (1)", "Written in a <b>script<\/b> (1)"], "cp": ["Instructions about action, movement or tone", "Written in a script"], "dp": ["Footnotes", "Spoken lines", "Poem titles"], "mand": 0}, {"id": "ENG-06-014", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write about a play<\/b> as a performance?", "a": ["Consider how <b>staging and tone<\/b> work (1)", "Consider <b>audience response<\/b> (1)", "Use <b>quotations and stage directions<\/b> (1)"], "cp": ["Consider how staging and tone work", "Consider audience response", "Use quotations and stage directions"], "dp": ["Treat it as a novel only", "Ignore the audience", "Only retell scenes"], "mand": 0}, {"id": "ENG-06-015", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you answer a <b>source-based question on a post-1914 prose/drama text<\/b>?", "a": ["Use the <b>given extract<\/b> (1)", "Analyse <b>language and structure<\/b> (1)", "Link to <b>the whole text<\/b> and context (1)"], "cp": ["Use the given extract", "Analyse language and structure", "Link to the whole text and context"], "dp": ["Write about another book", "Ignore the extract", "Skip analysis"], "mand": 0}, {"id": "ENG-06-016", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you answer a <b>19th-century prose<\/b> question?", "a": ["Analyse the <b>extract's language<\/b> (1)", "Link to <b>events and themes<\/b> in the whole text (1)", "Use <b>Victorian context<\/b> where relevant (1)"], "cp": ["Analyse the extract's language", "Link to events and themes in the whole text", "Use Victorian context where relevant"], "dp": ["Ignore the era", "Write modern slang", "Retell the plot"], "mand": 0}, {"id": "ENG-06-017", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How can <b>Victorian context<\/b> help you write about 19th-century prose?", "a": ["Understand <b>class and social attitudes<\/b> (1)", "Understand <b>beliefs and morality<\/b> (1)", "Explain <b>why the writer presents ideas<\/b> that way (1)"], "cp": ["Understand class and social attitudes", "Understand beliefs and morality", "Explain why the writer presents ideas that way"], "dp": ["It is irrelevant", "Only the author's age matters", "Context is banned"], "mand": 0}, {"id": "ENG-06-018", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>embed quotations<\/b> smoothly?", "a": ["Fit the quotation into your <b>own sentence<\/b> (1)", "Keep it <b>short<\/b> (1)", "Follow with <b>analysis<\/b> (1)"], "cp": ["Fit the quotation into your own sentence", "Keep it short", "Follow with analysis"], "dp": ["Paste long passages", "Quote without comment", "Place quotes alone on a line"], "mand": 0}, {"id": "ENG-06-019", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "What makes a <b>strong thesis or argument<\/b> in an essay?", "a": ["A clear <b>answer to the question<\/b> (1)", "Maintained <b>throughout<\/b> (1)", "Supported with <b>evidence and analysis<\/b> (1)"], "cp": ["A clear answer to the question", "Maintained throughout", "Supported with evidence and analysis"], "dp": ["Several unrelated points", "No introduction", "A list of quotations"], "mand": 0}, {"id": "ENG-06-020", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write an essay introduction<\/b> under timed conditions?", "a": ["Answer the <b>question directly<\/b> (1)", "Mention <b>key ideas<\/b> to be developed (1)", "Keep it <b>brief<\/b> (1)"], "cp": ["Answer the question directly", "Mention key ideas to be developed", "Keep it brief"], "dp": ["Write half a page of background", "Skip the introduction", "Retell the story"], "mand": 0}, {"id": "ENG-06-021", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>write a conclusion<\/b>?", "a": ["Summarise your <b>argument<\/b> (1)", "Link back to the <b>question<\/b> (1)", "Do not add <b>new points<\/b> (1)"], "cp": ["Summarise your argument", "Link back to the question", "Do not add new points"], "dp": ["Start a new topic", "Repeat quotations", "End mid-sentence"], "mand": 0}, {"id": "ENG-06-022", "t": 6, "s": "Lit", "k": "Recall", "m": 3, "ht": false, "q": "What should you <b>do in the first five minutes<\/b> of a Literature question?", "a": ["<b>Underline key words<\/b> in the question (1)", "Make a <b>brief plan<\/b> (1)", "Choose <b>evidence<\/b> to use (1)"], "cp": ["Underline key words in the question", "Make a brief plan", "Choose evidence to use"], "dp": ["Start writing at once", "Skip the question", "Draw a picture"], "mand": 0}, {"id": "ENG-06-023", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "Why can't you take <b>copies of set texts<\/b> into the exam?", "a": ["It is a <b>closed-book<\/b> exam (1)", "You must <b>learn key quotations<\/b> (1)", "The extract question provides some text (1)"], "cp": ["It is a closed-book exam", "You must learn key quotations", "The extract question provides some text"], "dp": ["Texts are always allowed", "Copies are provided free", "It is an open-book exam"], "mand": 0}, {"id": "ENG-06-024", "t": 6, "s": "Lit", "k": "Explain", "m": 3, "ht": false, "q": "How can you <b>learn quotations<\/b> effectively?", "a": ["Choose <b>short, flexible<\/b> ones (1)", "Link each to a <b>theme or character<\/b> (1)", "Practise <b>recall and analysis<\/b> (1)"], "cp": ["Choose short, flexible ones", "Link each to a theme or character", "Practise recall and analysis"], "dp": ["Memorise whole chapters", "Learn none", "Copy once"], "mand": 0}, {"id": "ENG-06-025", "t": 6, "s": "Lit", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes a <b>biography<\/b> of the author instead of analysis. What is wrong?", "a": ["Context must be <b>linked to the text<\/b> (1)", "AO2 analysis of language and structure is missed (1)"], "cp": ["Context must be linked to the text", "AO2 analysis of language and structure is missed"], "dp": ["Biographies earn top marks", "Context is all that matters", "Analysis is not needed"], "mand": 0}, {"id": "ENG-06-026", "t": 6, "s": "Lit", "k": "Exam trap", "m": 2, "ht": false, "q": "Why is <b>'the writer uses it to show'<\/b> without detail weak?", "a": ["It gives <b>no specific method or quotation<\/b> (1)", "Analysis must be <b>precise<\/b> (1)"], "cp": ["It gives no specific method or quotation", "Analysis must be precise"], "dp": ["It earns full marks", "It is detailed", "It is a quotation"], "mand": 0}, {"id": "ENG-06-027", "t": 6, "s": "Lit", "k": "Exam trap", "m": 2, "ht": false, "q": "A student uses <b>only the extract<\/b> in an essay asking about the whole text. What i /* ---------- library ---------- */
function library(){
  const kinds=[...new Set(DATA.map(c=>c.k))].sort();
  $("#app").innerHTML=`<div class="lib"><h1>Card <span class="grad">library</span></h1><p class="sub">Every question with its full mark scheme. Tap a card to open it.</p>
  <div class="chips">${[0].concat(TN).map(t=>`<button class="chip ${LIB.t===t?"on":""}" onclick="LIB.t=${t};library()">${t?"Topic "+t:"All topics"}</button>`).join("")}</div>
  <div class="chips"><input type="search" id="lq" placeholder="Search questions and answers" value="${LIB.q.replace(/"/g,"&quot;")}"><select id="lk"><option value="">All question types</option>${kinds.map(k=>`<option ${LIB.k===k?"selected":""}>${k}</option>`).join("")}</select><button class="chip" id="lo">Open all</button></div>
  <div id="lres"></div></div>`;
  const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
render();
</script>
