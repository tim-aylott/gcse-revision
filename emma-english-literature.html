<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emma English Literature">
<meta name="theme-color" content="#0d1020">
<title>Emma's English Literature Lab | GCSE Eduqas revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#ff7a8a;--accent2:#ffb36b;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')" aria-label="Home"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10122a" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v3M12 17v3M5 12h14"/><circle cx="12" cy="7" r="0.5"/><circle cx="12" cy="17" r="0.5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span>English Literature Lab</span></button>
  <span class="pill">Emma | Eduqas</span>
  <span class="spacer"></span>
  <div class="xpbox" id="xpbox"></div>
  <nav class="nav"><button id="nav-home" onclick="go('home')">Home</button><button id="nav-progress" onclick="go('progress')">Progress</button><button id="nav-library" onclick="go('library')">Cards</button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>
<script>
const DATA=[{"id": "LIT-01-001", "t": 1, "s": "C1", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>structure of Eduqas English Literature Component 1<\/b>?", "a": ["<b>2 hours<\/b>, worth 40% of the qualification (1)", "<b>Section A<\/b>: Shakespeare, 40 marks (extract 15, whole-text essay 25 including 5 for AO4) (1)", "<b>Section B<\/b>: poetry anthology, 40 marks (1)"], "cp": ["2 hours, worth 40% of the qualification", "Section A: Shakespeare, 40 marks (extract 15, whole-text essay 25 including 5 for AO4)", "Section B: poetry anthology, 40 marks"], "dp": ["Spoken language and creative writing", "Unseen poetry only", "Non-fiction reading and writing"], "mand": 0}, {"id": "LIT-01-002", "t": 1, "s": "C2", "k": "Recall", "m": 3, "ht": false, "q": "What is the <b>structure of Eduqas English Literature Component 2<\/b>?", "a": ["<b>2 hours 30 minutes<\/b>, worth 60% of the qualification (1)", "<b>Section A<\/b>: post-1914 prose or drama; <b>Section B<\/b>: 19th-century prose (1)", "<b>Section C<\/b>: unseen poetry; each section is 40 marks (1)"], "cp": ["2 hours 30 minutes, worth 60% of the qualification", "Section A: post-1914 prose or drama; Section B: 19th-century prose", "Section C: unseen poetry; each section is 40 marks"], "dp": ["Shakespeare and the poetry anthology", "Creative writing and letters", "Spoken language"], "mand": 0}, {"id": "LIT-01-003", "t": 1, "s": "Texts", "k": "Recall", "m": 3, "ht": false, "q": "Which <b>three set texts<\/b> are you studying, and which section is each in?", "a": ["<b>Macbeth<\/b>: Shakespeare, Component 1 Section A (1)", "<b>Lord of the Flies<\/b>: post-1914 prose, Component 2 Section A (1)", "<b>Jekyll and Hyde<\/b>: 19th-century prose, Component 2 Section B (1)"], "cp": ["Macbeth: Shakespeare, Component 1 Section A", "Lord of the Flies: post-1914 prose, Component 2 Section A", "Jekyll and Hyde: 19th-century prose, Component 2 Section B"], "dp": ["Macbeth is in Component 2", "Jekyll and Hyde is the Shakespeare text", "Lord of the Flies is the poetry section"], "mand": 0}, {"id": "LIT-01-004", "t": 1, "s": "AO", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four assessment objectives<\/b> in English Literature.", "a": ["<b>AO1<\/b>: informed personal response, with references and quotations (1)", "<b>AO2<\/b>: analyse language, form and structure (1)", "<b>AO3<\/b>: relate texts to their contexts (1)", "<b>AO4<\/b>: accurate vocabulary, sentence structure, spelling and punctuation (1)"], "cp": ["AO1: informed personal response, with references and quotations", "AO2: analyse language, form and structure", "AO3: relate texts to their contexts", "AO4: accurate vocabulary, sentence structure, spelling and punctuation"], "dp": ["Speaking, listening, writing, reading", "Plot, character, theme, setting", "Facts, opinions, evidence, summary"], "mand": 0}, {"id": "LIT-01-005", "t": 1, "s": "AO", "k": "Recall", "m": 3, "ht": false, "q": "Which <b>assessment objectives<\/b> are marked in each section?", "a": ["<b>Shakespeare and post-1914 text<\/b>: AO1, AO2 and AO4 (1)", "<b>19th-century prose and anthology poetry<\/b>: AO1, AO2 and AO3 (1)", "<b>Unseen poetry<\/b>: AO1 and AO2 only (1)"], "cp": ["Shakespeare and post-1914 text: AO1, AO2 and AO4", "19th-century prose and anthology poetry: AO1, AO2 and AO3", "Unseen poetry: AO1 and AO2 only"], "dp": ["AO3 in every section", "AO4 in every section", "Only AO1 in poetry"], "mand": 0}, {"id": "LIT-01-006", "t": 1, "s": "AO4", "k": "Explain", "m": 2, "ht": false, "q": "What does <b>AO4<\/b> reward, and in which sections?", "a": ["Accurate <b>vocabulary, sentence structure, spelling and punctuation<\/b> (1)", "<b>5 marks<\/b> in Shakespeare (essay) and <b>5 marks<\/b> in the post-1914 text (1)"], "cp": ["Accurate vocabulary, sentence structure, spelling and punctuation", "5 marks in Shakespeare (essay) and 5 marks in the post-1914 text"], "dp": ["Handwriting only", "Quotation length", "Every section equally"], "mand": 0}, {"id": "LIT-01-007", "t": 1, "s": "AO3", "k": "Explain", "m": 2, "ht": false, "q": "<b>Context (AO3)<\/b> is not marked in Shakespeare or the post-1914 text. What should you do about it?", "a": ["Focus on <b>AO1 and AO2<\/b>: ideas, language, form and structure (1)", "Use context only if it <b>sharpens your analysis<\/b>, not as extra facts (1)"], "cp": ["Focus on AO1 and AO2: ideas, language, form and structure", "Use context only if it sharpens your analysis, not as extra facts"], "dp": ["Write a paragraph of history first", "Ignore the extract", "Skip the whole-text essay"], "mand": 0}, {"id": "LIT-01-008", "t": 1, "s": "Method", "k": "Recall", "m": 2, "ht": false, "q": "Is the exam <b>open or closed book<\/b> for set texts and the anthology?", "a": ["<b>Closed book<\/b>: no copies of set texts or the anthology (1)", "So you must <b>learn key quotations<\/b> (1)"], "cp": ["Closed book: no copies of set texts or the anthology", "So you must learn key quotations"], "dp": ["Open book for all texts", "Open book for poetry only", "You may bring annotated copies"], "mand": 0}, {"id": "LIT-01-009", "t": 1, "s": "C1 A", "k": "Recall", "m": 2, "ht": false, "q": "What are the <b>two Shakespeare questions<\/b> in Section A?", "a": ["One <b>extract-based<\/b> question, 15 marks (1)", "One <b>essay<\/b> on the whole text, 25 marks including 5 for AO4 (1)"], "cp": ["One extract-based question, 15 marks", "One essay on the whole text, 25 marks including 5 for AO4"], "dp": ["Two essays on different plays", "A creative writing task", "A comparison with a poem"], "mand": 0}, {"id": "LIT-01-010", "t": 1, "s": "C1 B", "k": "Recall", "m": 3, "ht": false, "q": "How do the <b>two anthology poetry questions<\/b> work?", "a": ["<b>Question 1<\/b> (15 marks) asks about one named poem (1)", "<b>Question 2<\/b> (25 marks) compares it with a second anthology poem of your choice (1)", "Both are marked on <b>AO1, AO2 and AO3<\/b> (1)"], "cp": ["Question 1 (15 marks) asks about one named poem", "Question 2 (25 marks) compares it with a second anthology poem of your choice", "Both are marked on AO1, AO2 and AO3"], "dp": ["Both questions name the poems", "One poem is unseen", "Only language is marked"], "mand": 0}, {"id": "LIT-01-011", "t": 1, "s": "C2 C", "k": "Recall", "m": 3, "ht": false, "q": "How does the <b>unseen poetry<\/b> section work?", "a": ["<b>Two poems<\/b> from the 20th or 21st century, not studied before (1)", "<b>Question 1<\/b> (15 marks) is about the first poem (1)", "<b>Question 2<\/b> (25 marks) compares the second poem with the first (1)"], "cp": ["Two poems from the 20th or 21st century, not studied before", "Question 1 (15 marks) is about the first poem", "Question 2 (25 marks) compares the second poem with the first"], "dp": ["One poem from the anthology", "Three poems from the 18th century", "One poem, no comparison"], "mand": 0}, {"id": "LIT-01-012", "t": 1, "s": "C2 A", "k": "Recall", "m": 2, "ht": false, "q": "How is the <b>post-1914 text<\/b> (Lord of the Flies) assessed?", "a": ["<b>One source-based question<\/b> using an extract (1)", "<b>40 marks<\/b>: 35 for AO1 and AO2, plus 5 for AO4 (1)"], "cp": ["One source-based question using an extract", "40 marks: 35 for AO1 and AO2, plus 5 for AO4"], "dp": ["Three short answer questions", "A choice of four essays", "A comparison with Macbeth"], "mand": 0}, {"id": "LIT-01-013", "t": 1, "s": "C2 B", "k": "Recall", "m": 2, "ht": false, "q": "How is the <b>19th-century prose<\/b> text (Jekyll and Hyde) assessed?", "a": ["<b>One source-based question<\/b> using an extract (1)", "<b>40 marks<\/b>, with AO1, AO2 and AO3 context (1)"], "cp": ["One source-based question using an extract", "40 marks, with AO1, AO2 and AO3 context"], "dp": ["A creative writing task", "Two essay choices on poetry", "A question with no extract"], "mand": 0}, {"id": "LIT-01-014", "t": 1, "s": "Skills", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>embed a quotation<\/b> well?", "a": ["Keep it <b>short and precise<\/b> (1)", "Fit it into <b>your own sentence<\/b> (1)", "Then <b>analyse a key word or technique<\/b> in it (1)"], "cp": ["Keep it short and precise", "Fit it into your own sentence", "Then analyse a key word or technique in it"], "dp": ["Copy a whole speech", "Put quotations at the end only", "Quote without comment"], "mand": 0}, {"id": "LIT-01-015", "t": 1, "s": "Skills", "k": "Explain", "m": 3, "ht": false, "q": "What makes <b>analysis<\/b> better than description?", "a": ["Zoom in on <b>a key word or technique<\/b> (1)", "Explain the <b>effect on the reader<\/b> (1)", "Link to the <b>writer's purpose and ideas<\/b> (1)"], "cp": ["Zoom in on a key word or technique", "Explain the effect on the reader", "Link to the writer's purpose and ideas"], "dp": ["Retell what happens", "List techniques", "Say the writer uses it to show"], "mand": 0}, {"id": "LIT-01-016", "t": 1, "s": "Skills", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>language, structure and form<\/b>?", "a": ["<b>Language<\/b>: word choice and techniques; <b>structure<\/b>: how the text is organised and shifts (1)", "<b>Form<\/b>: the type of text, such as play, novella or poem (1)"], "cp": ["Language: word choice and techniques; structure: how the text is organised and shifts", "Form: the type of text, such as play, novella or poem"], "dp": ["They all mean word choice", "Form is spelling", "Structure is handwriting"], "mand": 0}, {"id": "LIT-01-017", "t": 1, "s": "Skills", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>link an extract to the whole text<\/b>?", "a": ["Show <b>where it fits<\/b> in the plot or character arc (1)", "Refer to <b>earlier or later moments<\/b> with short quotations (1)", "Show the <b>idea develops or changes<\/b> (1)"], "cp": ["Show where it fits in the plot or character arc", "Refer to earlier or later moments with short quotations", "Show the idea develops or changes"], "dp": ["Treat the extract as separate", "Only retell the ending", "Ignore the rest of the text"], "mand": 0}, {"id": "LIT-01-018", "t": 1, "s": "Skills", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>tentative language<\/b> and why use it?", "a": ["Words like <b>'suggests', 'could imply'<\/b> (1)", "Shows you are exploring <b>more than one interpretation<\/b> (1)"], "cp": ["Words like 'suggests', 'could imply'", "Shows you are exploring more than one interpretation"], "dp": ["Rude words", "Rhyming words", "Old-fashioned spelling"], "mand": 0}, {"id": "LIT-01-019", "t": 1, "s": "Skills", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>structure a paragraph<\/b> in a literature essay?", "a": ["Make a <b>clear point<\/b> that answers the question (1)", "Give <b>evidence<\/b> and analyse it (1)", "End by <b>linking back to the question<\/b> (1)"], "cp": ["Make a clear point that answers the question", "Give evidence and analyse it", "End by linking back to the question"], "dp": ["Start with a long quotation", "Finish with a new topic", "Write one sentence only"], "mand": 0}, {"id": "LIT-01-020", "t": 1, "s": "Skills", "k": "Explain", "m": 3, "ht": false, "q": "How do you <b>compare two poems<\/b> well?", "a": ["Pick <b>clear comparison points<\/b>: ideas, methods, tone (1)", "Use <b>connectives<\/b> such as 'whereas' and 'similarly' (1)", "Cover <b>both poems<\/b> in each paragraph (1)"], "cp": ["Pick clear comparison points: ideas, methods, tone", "Use connectives such as 'whereas' and 'similarly'", "Cover both poems in each paragraph"], "dp": ["Write about one poem then stop", "List all quotations", "Compare page length"], "mand": 0}, {"id": "LIT-01-021", "t": 1, "s": "Trap", "k": "Exam trap", "m": 2, "ht": false, "q": "A student <b>retells the plot<\/b>. Why does this lose marks?", "a": ["Marks are for <b>analysis and ideas<\/b>, not narrative (1)", "Use events only as <b>evidence for a point<\/b> (1)"], "cp": ["Marks are for analysis and ideas, not narrative", "Use events only as evidence for a point"], "dp": ["Plot summary earns top marks", "The examiner needs the story", "It shows good knowledge"], "mand": 0}, {"id": "LIT-01-022", "t": 1, "s": "Trap", "k": "Exam trap", "m": 2, "ht": false, "q": "A student <b>spots techniques<\/b> without explaining them. Why is this weak?", "a": ["Naming a technique <b>earns little<\/b> (1)", "You must explain the <b>effect and meaning<\/b> (1)"], "cp": ["Naming a technique earns little", "You must explain the effect and meaning"], "dp": ["Naming is the main skill", "Techniques are not marked", "More names means more marks"], "mand": 0}, {"id": "LIT-01-023", "t": 1, "s": "Trap", "k": "Exam trap", "m": 2, "ht": false, "q": "What is wrong with writing the <b>author's life story<\/b>?", "a": ["It is <b>not analysis<\/b> of the text (1)", "Use context <b>only to support a point<\/b> (1)"], "cp": ["It is not analysis of the text", "Use context only to support a point"], "dp": ["Biography earns AO3 in every section", "It is required", "Examiners prefer it"], "mand": 0}, {"id": "LIT-01-024", "t": 1, "s": "Trap", "k": "Exam trap", "m": 2, "ht": false, "q": "Why must you answer <b>the exact question<\/b> and not a prepared essay?", "a": ["Marks go for <b>relevance to the task<\/b> (1)", "Pre-learned essays <b>miss the focus words<\/b> (1)"], "cp": ["Marks go for relevance to the task", "Pre-learned essays miss the focus words"], "dp": ["Examiners reward memorised essays", "Any essay on the text is fine", "Questions never change"], "mand": 0}, {"id": "LIT-01-025", "t": 1, "s": "Skills", "k": "Explain", "m": 2, "ht": false, "q": "How should you <b>use the extract<\/b> in a source-based question?", "a": ["Use it as <b>the starting point<\/b> and quote from it (1)", "Then link to <b>other parts of the text<\/b> (1)"], "cp": ["Use it as the starting point and quote from it", "Then link to other parts of the text"], "dp": ["Ignore the extract", "Copy it out", "Write only about the ending"], "mand": 0}, {"id": "LIT-02-001", "t": 2, "s": "Macbeth", "k": "Recall", "m": 3, "ht": false, "q": "What happens in <b>Act 1<\/b> of Macbeth?", "a": ["The <b>witches<\/b> prophesy Macbeth will be Thane of Cawdor and king (1)", "Macbeth is named <b>Thane of Cawdor<\/b> after Cawdor's treachery (1)", "<b>Lady Macbeth<\/b> pushes him to kill Duncan (1)"], "cp": ["The witches prophesy Macbeth will be Thane of Cawdor and king", "Macbeth is named Thane of Cawdor after Cawdor's treachery", "Lady Macbeth pushes him to kill Duncan"], "dp": ["Macbeth is crowned king", "Banquo's ghost appears", "Lady Macbeth sleepwalks"], "mand": 0}, {"id": "LIT-02-002", "t": 2, "s": "Macbeth", "k": "Recall", "m": 3, "ht": false, "q": "What happens in <b>Act 2<\/b> of Macbeth?", "a": ["Macbeth sees a <b>dagger<\/b> and kills Duncan (1)", "<b>Lady Macbeth<\/b> returns the daggers and smears the guards with blood (1)", "<b>Macduff<\/b> discovers the body and Macbeth kills the guards (1)"], "cp": ["Macbeth sees a dagger and kills Duncan", "Lady Macbeth returns the daggers and smears the guards with blood", "Macduff discovers the body and Macbeth kills the guards"], "dp": ["Banquo is murdered", "Birnam Wood moves", "Macduff's family is killed"], "mand": 0}, {"id": "LIT-02-003", "t": 2, "s": "Macbeth", "k": "Recall", "m": 3, "ht": false, "q": "What happens in <b>Act 3<\/b> of Macbeth?", "a": ["Macbeth hires <b>murderers to kill Banquo<\/b> and Fleance (1)", "<b>Banquo is killed<\/b> but Fleance escapes (1)", "<b>Banquo's ghost<\/b> appears at the banquet (1)"], "cp": ["Macbeth hires murderers to kill Banquo and Fleance", "Banquo is killed but Fleance escapes", "Banquo's ghost appears at the banquet"], "dp": ["Duncan is murdered", "Lady Macbeth dies", "Malcolm becomes king"], "mand": 0}, {"id": "LIT-02-004", "t": 2, "s": "Macbeth", "k": "Recall", "m": 3, "ht": false, "q": "What happens in <b>Act 4<\/b> of Macbeth?", "a": ["Macbeth visits the witches and sees <b>three apparitions<\/b> (1)", "He orders the <b>murder of Macduff's family<\/b> (1)", "<b>Malcolm tests Macduff<\/b> in England, and they plan to invade (1)"], "cp": ["Macbeth visits the witches and sees three apparitions", "He orders the murder of Macduff's family", "Malcolm tests Macduff in England, and they plan to invade"], "dp": ["Macbeth kills Duncan", "The banquet ghost scene", "Lady Macbeth sleepwalks"], "mand": 0}, {"id": "LIT-02-005", "t": 2, "s": "Macbeth", "k": "Recall", "m": 3, "ht": false, "q": "What happens in <b>Act 5<\/b> of Macbeth?", "a": ["<b>Lady Macbeth sleepwalks<\/b> and later dies (1)", "<b>Birnam Wood<\/b> seems to move as the army attacks (1)", "<b>Macduff kills Macbeth<\/b> and Malcolm is made king (1)"], "cp": ["Lady Macbeth sleepwalks and later dies", "Birnam Wood seems to move as the army attacks", "Macduff kills Macbeth and Malcolm is made king"], "dp": ["Duncan is murdered", "Banquo's ghost appears", "The witches meet Macbeth for the first time"], "mand": 0}, {"id": "LIT-02-006", "t": 2, "s": "Macbeth", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>three apparitions<\/b> and their messages?", "a": ["An <b>armed head<\/b>: beware Macduff (1)", "A <b>bloody child<\/b>: none of woman born can harm him (1)", "A <b>crowned child<\/b> with a tree: safe until Birnam Wood comes to Dunsinane (1)"], "cp": ["An armed head: beware Macduff", "A bloody child: none of woman born can harm him", "A crowned child with a tree: safe until Birnam Wood comes to Dunsinane"], "dp": ["A ghost, a king, a dagger", "Three sisters with a cauldron", "Banquo, Fleance and Duncan"], "mand": 0}, {"id": "LIT-02-007", "t": 2, "s": "Macbeth", "k": "Explain", "m": 2, "ht": false, "q": "How is the <b>prophecy about Macduff<\/b> fulfilled?", "a": ["Macduff was <b>born by caesarean<\/b>, 'untimely ripped' from his mother (1)", "So he is <b>not 'of woman born'<\/b> in the way Macbeth expects (1)"], "cp": ["Macduff was born by caesarean, 'untimely ripped' from his mother", "So he is not 'of woman born' in the way Macbeth expects"], "dp": ["He is a ghost", "He is the witches' child", "He was born in England"], "mand": 0}, {"id": "LIT-02-008", "t": 2, "s": "Macbeth", "k": "Explain", "m": 2, "ht": false, "q": "How is <b>Birnam Wood<\/b> prophecy fulfilled?", "a": ["Malcolm's soldiers <b>cut branches<\/b> as camouflage (1)", "So the wood <b>appears to move<\/b> to Dunsinane (1)"], "cp": ["Malcolm's soldiers cut branches as camouflage", "So the wood appears to move to Dunsinane"], "dp": ["A real forest walks", "The witches move trees", "Macduff plants trees"], "mand": 0}, {"id": "LIT-02-009", "t": 2, "s": "Macbeth", "k": "Explain", "m": 3, "ht": false, "q": "How does <b>Macbeth's attitude change<\/b> from Act 1 to Act 3?", "a": ["He is <b>hesitant and guilty<\/b> before killing Duncan (1)", "He <b>plans Banquo's murder alone<\/b>, without telling Lady Macbeth (1)", "He becomes <b>more ruthless<\/b> and paranoid (1)"], "cp": ["He is hesitant and guilty before killing Duncan", "He plans Banquo's murder alone, without telling Lady Macbeth", "He becomes more ruthless and paranoid"], "dp": ["He stays loyal", "He gives up the crown", "He becomes more trusting"], "mand": 0}, {"id": "LIT-02-010", "t": 2, "s": "Macbeth", "k": "Recall", "m": 2, "ht": false, "q": "What are the <b>two prophecies about Banquo<\/b>?", "a": ["He will be <b>lesser than Macbeth, and greater<\/b> (1)", "His <b>descendants will be kings<\/b> (1)"], "cp": ["He will be lesser than Macbeth, and greater", "His descendants will be kings"], "dp": ["He will be king", "He will die in Act 1", "He will marry Lady Macbeth"], "mand": 0}, {"id": "LIT-02-011", "t": 2, "s": "Macbeth", "k": "Explain", "m": 3, "ht": false, "q": "Why does Macbeth <b>kill Banquo<\/b>?", "a": ["Banquo <b>suspects<\/b> Macbeth (1)", "The witches said Banquo's <b>children will be kings<\/b> (1)", "Macbeth fears his own <b>line will not rule<\/b> (1)"], "cp": ["Banquo suspects Macbeth", "The witches said Banquo's children will be kings", "Macbeth fears his own line will not rule"], "dp": ["Banquo is   if(S.streak>(S.best||0))S.best=S.streak;
  if(R.survival&&!R.over)S.survWins++;
  S.recent.unshift({d:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),l:R.label,e:R.earned,m:R.max});S.recent=S.recent.slice(0,10);
  logEvent({t:"round",round:R.label,marks:R.earned,max:R.max,xp:R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0),totalxp:S.xp+0,cards:R.log.length,over:R.over?1:0});
  R.newBadges=checkBadges();save();view="result";render();window.scrollTo(0,0);if(!R.over&&R.max&&R.earned/R.max>=.7)confetti();
}
function resultView(){
  const pct=R.max?R.earned/R.max:0,stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const msg=R.over?"Out of lives. Review the cards you missed and go again.":pct>=.9?"Outstanding. That is top-grade recall.":pct>=.7?"Strong round. A few marks to tidy up.":pct>=.4?"Good effort. The missed cards will come round again.":"Tough one. Read the mark schemes and try again.";
  const missed=R.log.filter(x=>x.e<x.c.m).map(x=>x.c);
  $("#app").innerHTML=`<div class="card result" style="--c:${CFG.accent}">
   <h1 style="margin-top:0">${R.over?"Game over":"Round complete"}</h1><p class="sub">${msg}</p>
   <div class="stars">${[0,1,2].map(i=>`<span class="star ${i<stars?"on":""}">${ICON.star}</span>`).join("")}</div>
   <div class="rstats"><div class="stat"><b>${R.earned}/${R.max}</b><span>marks</span></div><div class="stat"><b>${Math.round(pct*100)}%</b><span>score</span></div><div class="stat"><b>+${R.log.reduce((a,x)=>a+x.e*10+(x.e===x.c.m?5:0),0)}</b><span>points</span></div></div>
   ${R.newBadges&&R.newBadges.length?`<div class="newb">${R.newBadges.map(b=>`<div class="badge got" style="margin:8px 0"><span class="ic">${ICON.medal}</span><div><b>New badge: ${b.n}</b><small>${b.d}</small></div></div>`).join("")}</div>`:""}
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
    ${missed.length?`<button class="btn" onclick="replay()">Retry ${missed.length} missed</button>`:""}
    <button class="btn ghost" onclick="go('home')">Back to home</button></div>
   ${missed.length?`<h2>Review</h2><div style="text-align:left">${missed.map(c=>`<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span></summary><div class="body"><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`).join("")}</div>`:""}
  </div>`;
  R.missed=missed;
}
function confetti(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cols=[CFG.accent,CFG.accent2,"#ffb84d","#3ddc97","#ffffff"];for(let i=0;i<46;i++){const s=document.createElement("i");s.className="conf";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.animationDuration=(1.8+Math.random()*1.6)+"s";s.style.animationDelay=(Math.random()*.5)+"s";s.style.borderRadius=i%3?"2px":"50%";document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function replay(){const m=R.missed;R={cards:shuffle(m.slice()),i:0,earned:0,max:0,hearts:null,survival:false,label:"Retry",rev:false,sel:[],log:[],over:false};prep();view="round";render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* ---------- library ---------- */
function library(){
  const kinds=[...new Set(DATA.map(c=>c.k))].sort();
  $("#app").innerHTML=`<div class="lib"><h1>Card <span class="grad">library</span></h1><p class="sub">Every question with its full mark scheme. Tap a card to open it.</p>
  <div class="chips">${[0].concat(TN).map(t=>`<button class="chip ${LIB.t===t?"on":""}" onclick="LIB.t=${t};library()">${t?"Topic "+t:"All topics"}</button>`).join("")}</div>
  <div class="chips"><input type="search" id="lq" placeholder="Search questions and answers" value="${LIB.q.replace(/"/g,"&quot;")}"><select id="lk"><option value="">All question types</option>${kinds.map(k=>`<option ${LIB.k===k?"selected":""}>${k}</option>`).join("")}</select><button class="chip" id="lo">Open all</button></div>
  <div id="lres"></div></div>`;
  const draw=()=>{
    const q=LIB.q.toLowerCase();
    const list=pool().filter(c=>(!LIB.t||c.t===LIB.t)&&(!LIB.k||c.k===LIB.k)&&(!q||(c.q+c.a.join(" ")+c.id).toLowerCase().includes(q)));
    $("#lres").innerHTML=`<p class="small">${list.length} cards</p>`+list.map(c=>{const st=S.cards[c.id];return `<details class="item" style="--c:${tc(c.t)}"><summary><span class="id">${c.id}</span><span class="qs">${c.q}</span><span class="tag m">${c.m}m</span>${c.ht?'<span class="tag ht">H</span>':""}${st&&st.box>=2?'<span class="tag" style="color:var(--good)">mastered</span>':""}</summary><div class="body"><div class="small" style="margin-bottom:8px">${TOPICS[c.t].name} | ${c.k} | Spec ${c.s}</div><div class="a">${c.a.map(x=>`<p>${x}</p>`).join("")}</div></div></details>`}).join("");
  };
  $("#lq").oninput=e=>{LIB.q=e.target.value;draw()};$("#lk").onchange=e=>{LIB.k=e.target.value;draw()};
  $("#lo").onclick=()=>{const ds=[...document.querySelectorAll("details.item")];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open)};
  draw();
}
/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="round"||!R||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!R.rev)reveal();else next()}
  else if(!R.rev&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(R.opts[i])pick(i)}
});
/* ---------- restore progress from the sheet (any device) ---------- */
let SYNCING=false;
async function restore(){
  if(!LOGURL||SYNCING||(view==="round"&&R&&!R.done))return;
  SYNCING=true;
  try{
    if(qGet().length){flush();await new Promise(r=>setTimeout(r,2500));if(qGet().length)return}
    const res=await fetch(LOGURL+"?action=state&key="+encodeURIComponent(LOGKEY)+"&child="+encodeURIComponent(CFG.name)+"&subject="+encodeURIComponent(CFG.subject),{cache:"no-store"});
    const j=await res.json();
    if(!j||!j.ok||!j.state)return;
    const rs=j.state;
    if(!(rs.xp>S.xp))return;
    const tp={};Object.keys(rs.tpN).forEach(nm=>{const t=CFG.topics.find(x=>x.name===nm);if(t)tp[t.n]=rs.tpN[nm]});
    const keep=S.incHT;
    S=Object.assign(fresh(),{cards:rs.cards,xp:rs.xp,marks:rs.marks,perfect:rs.perfect,traps:rs.traps,rounds:rs.rounds,survWins:rs.survWins,streak:rs.streak,best:rs.best,last:rs.last,hist:rs.hist,recent:rs.recent,tp:tp,kp:rs.kp,badges:[],incHT:keep});
    S.day={d:todayStr(),m:rs.hist[todayStr()]||0};
    checkBadges();save();
    if(view==="home"||view==="progress")render();
  }catch(e){}finally{SYNCING=false}
}
setTimeout(restore,900);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)restore()});
render();
</script>
