n", "m": 3, "ht": false, "q": "Give <b>three economic or social impacts<\/b> of deforestation.", "a": ["Any three (1 each):", "• <b>jobs and income<\/b> from logging and farming", "• loss of land and culture for <b>indigenous people<\/b>", "• loss of <b>forest products<\/b> such as medicines", "• conflicts over land", "• revenue from exports"], "cp": ["jobs and income from logging and farming", "loss of land and culture for indigenous people", "loss of forest products such as medicines", "conflicts over land", "revenue from exports"], "dp": ["No income at all", "Increased forest biodiversity", "More rainfall"], "mand": 0}, {"id": "GEO-08-005", "t": 8, "s": "8.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how deforestation can <b>increase carbon emissions<\/b>.", "a": ["Trees <b>store carbon<\/b> (1)", "When cut or burned, <b>CO<sub>2<\/sub> is released<\/b> (1)", "Fewer trees means less <b>CO<sub>2<\/sub> absorbed<\/b> by photosynthesis (1)"], "cp": ["Trees store carbon", "When cut or burned, CO<sub>2<\/sub> is released", "Fewer trees means less CO<sub>2<\/sub> absorbed by photosynthesis"], "dp": ["Cutting trees makes CO<sub>2<\/sub> disappear", "Trees only release CO<sub>2<\/sub>", "Deforestation absorbs methane"], "mand": 0}, {"id": "GEO-08-006", "t": 8, "s": "8.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how deforestation causes <b>soil erosion<\/b>.", "a": ["Tree roots <b>bind the soil<\/b> (1)", "Without cover, heavy rain <b>washes soil away<\/b> (1)", "Leaching and runoff damage <b>soil fertility<\/b> and rivers (1)"], "cp": ["Tree roots bind the soil", "Without cover, heavy rain washes soil away", "Leaching and runoff damage soil fertility and rivers"], "dp": ["Tree roots break the soil", "Soil is protected by bare ground", "Rain never reaches the forest floor"], "mand": 0}, {"id": "GEO-08-007", "t": 8, "s": "8.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to manage rainforests sustainably.", "a": ["Any three (1 each):", "• <b>selective logging<\/b> and replanting", "• <b>protected areas<\/b> or national parks", "• <b>ecotourism<\/b>", "• <b>agroforestry<\/b>", "• <b>FSC certification<\/b> of timber", "• <b>debt-for-nature swaps<\/b>"], "cp": ["selective logging and replanting", "protected areas or national parks", "ecotourism", "agroforestry", "FSC certification of timber", "debt-for-nature swaps"], "dp": ["Clear-felling all trees", "Opening more logging roads", "Ignoring land rights"], "mand": 0}, {"id": "GEO-08-008", "t": 8, "s": "8.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>selective logging<\/b>?", "a": ["Only <b>some mature trees<\/b> are cut (1)", "The forest is left to <b>regenerate<\/b> and the canopy is kept (1)"], "cp": ["Only some mature trees are cut", "The forest is left to regenerate and the canopy is kept"], "dp": ["All trees are cut at once", "Trees are never cut", "Trees are only cut in the dry season"], "mand": 0}, {"id": "GEO-08-009", "t": 8, "s": "8.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>ecotourism<\/b>?", "a": ["<b>Small-scale tourism<\/b> that protects nature and respects local people (1)", "It provides <b>income and jobs<\/b> without destroying habitats (1)"], "cp": ["Small-scale tourism that protects nature and respects local people", "It provides income and jobs without destroying habitats"], "dp": ["Tourism in large hotels", "Tourism that ignores nature", "Tourism by private jet"], "mand": 0}, {"id": "GEO-08-010", "t": 8, "s": "8.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>debt-for-nature swap<\/b>?", "a": ["Part of a country's <b>debt is cancelled<\/b> (1)", "In return, the country <b>protects forest<\/b> (1)"], "cp": ["Part of a country's debt is cancelled", "In return, the country protects forest"], "dp": ["A tax on wood", "Borrowing to cut down more forest", "A swap of trees between countries"], "mand": 0}, {"id": "GEO-08-011", "t": 8, "s": "8.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>protected areas<\/b> as a way of conserving rainforest.", "a": ["Advantage: protect <b>habitats and species<\/b> (1)", "Advantage: help store <b>carbon<\/b> (1)", "Disadvantage: may <b>restrict local people<\/b> (1)", "Disadvantage: <b>enforcement is difficult<\/b> and costly (1)"], "cp": ["Advantage: protect habitats and species", "Advantage: help store carbon", "Disadvantage: may restrict local people", "Disadvantage: enforcement is difficult and costly"], "dp": ["No advantages", "No problems at all", "They increase logging"], "mand": 0}, {"id": "GEO-08-012", "t": 8, "s": "8.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>international agreements<\/b> on forest protection.", "a": ["Advantage: encourage <b>cooperation<\/b> and funding (1)", "Advantage: help set <b>common standards<\/b> (1)", "Disadvantage: <b>hard to enforce<\/b> (1)", "Disadvantage: countries may <b>put economic growth first<\/b> (1)"], "cp": ["Advantage: encourage cooperation and funding", "Advantage: help set common standards", "Disadvantage: hard to enforce", "Disadvantage: countries may put economic growth first"], "dp": ["They always stop all deforestation", "They are legally enforced everywhere", "They ignore funding"], "mand": 0}, {"id": "GEO-08-013", "t": 8, "s": "8.2", "k": "Recall", "m": 3, "ht": false, "q": "For your <b>rainforest case study<\/b> what three things should you know?", "a": ["Its <b>location and importance<\/b> (1)", "Causes and impacts of <b>deforestation<\/b> (1)", "The <b>management<\/b> and conservation attempts and their success (1)"], "cp": ["Its location and importance", "Causes and impacts of deforestation", "The management and conservation attempts and their success"], "dp": ["Only its name", "Only its flag", "Only the colour of its leaves"], "mand": 0}, {"id": "GEO-08-014", "t": 8, "s": "8.3", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three threats<\/b> to the taiga.", "a": ["Any three (1 each):", "• <b>logging<\/b> and timber production", "• <b>mining<\/b> and oil and gas extraction", "• <b>HEP<\/b> dams", "• <b>climate change<\/b> (warming, fire, pests)", "• <b>roads<\/b> and settlement"], "cp": ["logging and timber production", "mining and oil and gas extraction", "HEP dams", "climate change (warming, fire, pests)", "roads and settlement"], "dp": ["Heavy flooding from rain", "Tourist demand for sand", "Tidal waves"], "mand": 0}, {"id": "GEO-08-015", "t": 8, "s": "8.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>climate change<\/b> threatens the taiga.", "a": ["<b>Warming<\/b> changes habitats and species ranges (1)", "<b>Permafrost<\/b> thaws, releasing methane (1)", "<b>Fires and pests<\/b> become more frequent (1)"], "cp": ["Warming changes habitats and species ranges", "Permafrost thaws, releasing methane", "Fires and pests become more frequent"], "dp": ["Climate change creates cooler summers", "It increases permafrost", "It protects trees from pests"], "mand": 0}, {"id": "GEO-08-016", "t": 8, "s": "8.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to conserve the taiga.", "a": ["Any three (1 each):", "• <b>protected areas<\/b>", "• <b>sustainable forestry<\/b> (selective cutting, replanting)", "• <b>regulation<\/b> of mining and oil extraction", "• <b>international cooperation<\/b>", "• reducing <b>CO<sub>2<\/sub><\/b> emissions"], "cp": ["protected areas", "sustainable forestry (selective cutting, replanting)", "regulation of mining and oil extraction", "international cooperation", "reducing CO<sub>2<\/sub> emissions"], "dp": ["Clear-felling everything", "Building more roads", "Ignoring indigenous people"], "mand": 0}, {"id": "GEO-08-017", "t": 8, "s": "8.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why the <b>taiga is important globally<\/b>.", "a": ["It stores <b>vast amounts of carbon<\/b> (1)", "It is home to <b>wildlife<\/b> and a source of timber (1)", "It helps regulate <b>climate and water<\/b> (1)"], "cp": ["It stores vast amounts of carbon", "It is home to wildlife and a source of timber", "It helps regulate climate and water"], "dp": ["It has no global role", "It produces no carbon storage", "It is only important to tourists"], "mand": 0}, {"id": "GEO-08-018", "t": 8, "s": "8.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>rainforest species are lost<\/b> when forest is cleared.", "a": ["<b>Habitat loss<\/b> leaves species nowhere to live (1)", "<b>Food chains<\/b> collapse (1)", "Many species are <b>endemic<\/b> and cannot migrate (1)"], "cp": ["Habitat loss leaves species nowhere to live", "Food chains collapse", "Many species are endemic and cannot migrate"], "dp": ["Species move easily into farmland", "Food chains become more complex", "Clearing creates new habitat for all"], "mand": 0}, {"id": "GEO-08-019", "t": 8, "s": "8.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>indigenous people<\/b> can help conserve forests.", "a": ["They have <b>traditional knowledge<\/b> of sustainable use (1)", "Land rights give them <b>incentives to protect<\/b> forest (1)", "Their management often shows <b>lower deforestation rates<\/b> (1)"], "cp": ["They have traditional knowledge of sustainable use", "Land rights give them incentives to protect forest", "Their management often shows lower deforestation rates"], "dp": ["They always clear forests", "They have no knowledge of forests", "They have no land rights"], "mand": 0}, {"id": "GEO-08-020", "t": 8, "s": "8.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'deforestation is always bad for everyone'<\/b>. What would improve this?", "a": ["Recognise <b>benefits<\/b>: jobs, income and farmland (1)", "Weigh them against <b>long-term costs<\/b> to environment and communities (1)"], "cp": ["Recognise benefits: jobs, income and farmland", "Weigh them against long-term costs to environment and communities"], "dp": ["Nothing needs changing", "Remove all costs", "Ignore local people"], "mand": 0}, {"id": "GEO-08-021", "t": 8, "s": "8.1", "k": "Calculation", "m": 2, "ht": false, "q": "A forest of 50,000 hectares loses 3,000 hectares in a year. Calculate the <b>percentage lost<\/b>.", "a": ["3,000 ÷ 50,000 (1)", "× 100 = <b>6%<\/b> (1)"], "cp": ["3,000 ÷ 50,000", "× 100 = 6%"], "dp": ["16.7%", "60%", "0.6%"], "mand": 0}, {"id": "GEO-08-022", "t": 8, "s": "8.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three adaptations<\/b> of <b>tropical rainforest<\/b> plants and animals.", "a": ["<b>Buttress roots<\/b> support tall trees (1)", "<b>Lianas<\/b> climb to reach canopy light (1)", "<b>Monkey tails<\/b> help balance and feed in the canopy (1)"], "cp": ["Buttress roots support tall trees", "Lianas climb to reach canopy light", "Monkey tails help balance and feed in the canopy"], "dp": ["Thick oily fur for cold", "Conical shape to shed snow", "Waxy needles for dry winters"], "mand": 0}, {"id": "GEO-08-023", "t": 8, "s": "8.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three adaptations<\/b> of <b>taiga<\/b> plants and animals.", "a": ["<b>Conical conifers<\/b> shed snow (1)", "<b>Waxy needles<\/b> reduce water loss (1)", "<b>Thick oily fur<\/b>, hibernation or migration (1)"], "cp": ["Conical conifers shed snow", "Waxy needles reduce water loss", "Thick oily fur, hibernation or migration"], "dp": ["Buttress roots and lianas", "Big flat leaves for heavy rain", "Fast nutrient cycling all year"], "mand": 0}, {"id": "GEO-08-024", "t": 8, "s": "8.3", "k": "Explain", "m": 3, "ht": false, "q": "Why is the <b>taiga nutrient cycle slow<\/b>?", "a": ["Most nutrients are in the <b>litter store<\/b> (1)", "<b>Slow decay<\/b> in the cold (1)", "<b>Small biomass<\/b> because of a short growing season and low precipitation (1)"], "cp": ["Most nutrients are in the litter store", "Slow decay in the cold", "Small biomass because of a short growing season and low precipitation"], "dp": ["Rapid decay in the heat", "A large biomass store", "Fast uptake by the trees"], "mand": 0}, {"id": "GEO-08-025", "t": 8, "s": "8.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three threats<\/b> to the <b>taiga<\/b>.", "a": ["<b>Wildfires<\/b> from hot dry summers and lightning (1)", "<b>Pests and diseases<\/b> as temperatures rise (1)", "<b>Acid rain<\/b> from burning fossil fuels (SO2) (1)"], "cp": ["Wildfires from hot dry summers and lightning", "Pests and diseases as temperatures rise", "Acid rain from burning fossil fuels (SO2)"], "dp": ["Too much rainfall in the tropics", "Tsunamis", "Coral bleaching"], "mand": 0}, {"id": "GEO-08-026", "t": 8, "s": "8.5", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>CITES<\/b> and <b>REDD<\/b> as ways to protect forests.", "a": ["<b>CITES<\/b>: treaty with 180 countries banning ivory trade (1)", "But it does not stop <b>deforestation<\/b> or climate change (1)", "<b>REDD<\/b>: UN scheme where governments and TNCs fund conservation (1)", "But it is <b>hard to police<\/b> and illegal logging continues (1)"], "cp": ["CITES: treaty with 180 countries banning ivory trade", "But it does not stop deforestation or climate change", "REDD: UN scheme where governments and TNCs fund conservation", "But it is hard to police and illegal logging continues"], "dp": ["CITES stops all deforestation", "REDD is paid for by indigenous people", "Both are completely successful"], "mand": 0}, {"id": "GEO-08-027", "t": 8, "s": "8.5", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three sustainable management<\/b> methods for forests.", "a": ["<b>Ecotourism<\/b> creating local jobs (1)", "<b>Agroforestry<\/b> growing crops between trees (1)", "<b>Selective logging<\/b> removing only large valuable trees (1)"], "cp": ["Ecotourism creating local jobs", "Agroforestry growing crops between trees", "Selective logging removing only large valuable trees"], "dp": ["Clear-felling whole areas", "Burning trees for ranching", "Building more roads and dams"], "mand": 0}, {"id": "GEO-09-001", "t": 9, "s": "9.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>energy mix<\/b>?", "a": ["The <b>different sources<\/b> used to supply a country's energy (1)", "e.g. coal, oil, gas, nuclear and renewables, and <b>their proportions<\/b> (1)"], "cp": ["The different sources used to supply a country's energy", "e.g. coal, oil, gas, nuclear and renewables, and their proportions"], "dp": ["The amount of rain a country gets", "The temperature of the energy", "A list of power stations only"], "mand": 0}, {"id": "GEO-09-002", "t": 9, "s": "9.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three reasons<\/b> global energy demand is rising.", "a": ["Any three (1 each):", "• <b>population growth<\/b>", "• <b>economic development<\/b> and industrialisation", "• <b>rising incomes<\/b> and more appliances", "• growth of <b>transport<\/b>", "• <b>urbanisation<\/b>"], "cp": ["population growth", "economic development and industrialisation", "rising incomes and more appliances", "growth of transport", "urbanisation"], "dp": ["Falling population", "Reduced industry", "Fewer cars"], "mand": 0}, {"id": "GEO-09-003", "t": 9, "s": "9.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>energy demand grows as countries develop<\/b>.", "a": ["<b>Industry<\/b> and factories need power (1)", "Higher incomes mean more <b>cars, appliances and heating<\/b> (1)", "More <b>urban living<\/b> and infrastructure (1)"], "cp": ["Industry and factories need power", "Higher incomes mean more cars, appliances and heating", "More urban living and infrastructure"], "dp": ["Development reduces energy needs", "Countries use less when richer", "Industry does not need electricity"], "mand": 0}, {"id": "GEO-09-004", "t": 9, "s": "9.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three fossil fuels<\/b>.", "a": ["<b>Coal<\/b> (1)", "<b>Oil<\/b> (1)", "<b>Natural gas<\/b> (1)"], "cp": ["Coal", "Oil", "Natural gas"], "dp": ["Solar, wind and hydro", "Uranium, biomass and hydrogen", "Wood, tidal and geothermal"], "mand": 0}, {"id": "GEO-09-005", "t": 9, "s": "9.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>fossil fuels<\/b> are called non-renewable.", "a": ["They form over <b>millions of years<\/b> (1)", "They are used <b>much faster<\/b> than they form (1)", "Once used, they <b>cannot be replaced<\/b> in a human lifetime (1)"], "cp": ["They form over millions of years", "They are used much faster than they form", "Once used, they cannot be replaced in a human lifetime"], "dp": ["They renew every year", "They are always replaced by plants", "They are produced by the Sun in days"], "mand": 0}, {"id": "GEO-09-006", "t": 9, "s": "9.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three environmental impacts<\/b> of using fossil fuels.", "a": ["Any three (1 each):", "• <b>carbon dioxide<\/b> emissions drive climate change", "• <b>air pollution<\/b> and acid rain", "• <b>oil spills<\/b> damage oceans", "• <b>habitat loss<\/b> from mining", "• landscape damage"], "cp": ["carbon dioxide emissions drive climate change", "air pollution and acid rain", "oil spills damage oceans", "habitat loss from mining", "landscape damage"], "dp": ["Reduced CO<sub>2<\/sub>", "Cleaner air", "Zero waste"], "mand": 0}, {"id": "GEO-09-007", "t": 9, "s": "9.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what <b>energy security<\/b> means and why it matters.", "a": ["Having a <b>reliable supply<\/b> of affordable energy (1)", "Countries that import fuel are <b>vulnerable to price rises<\/b> or supply disruption (1)", "Lack of energy can <b>harm economies and daily life<\/b> (1)"], "cp": ["Having a reliable supply of affordable energy", "Countries that import fuel are vulnerable to price rises or supply disruption", "Lack of energy can harm economies and daily life"], "dp": ["Having too much energy", "A safe place to store power", "Energy that can never be used"], "mand": 0}, {"id": "GEO-09-008", "t": 9, "s": "9.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three factors<\/b> that affect a country's energy mix.", "a": ["Any three (1 each):", "• <b>resources available<\/b> (coal, gas, rivers, wind)", "• <b>cost<\/b> of production", "• <b>technology<\/b> and infrastructure", "• <b>politics<\/b> and security", "• <b>environmental<\/b> concerns"], "cp": ["resources available (coal, gas, rivers, wind)", "cost of production", "technology and infrastructure", "politics and security", "environmental concerns"], "dp": ["The colour of the flag", "The country's football team", "The number of tourists"], "mand": 0}, {"id": "GEO-09-009", "t": 9, "s": "9.2", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four types of renewable energy<\/b>.", "a": ["Any four (1 each):", "• <b>solar<\/b>", "• <b>wind<\/b>", "• <b>hydroelectric<\/b>", "• <b>tidal and wave<\/b>", "• <b>geothermal<\/b>", "• <b>biomass<\/b>"], "cp": ["solar", "wind", "hydroelectric", "tidal and wave", "geothermal", "biomass"], "dp": ["Coal and oil", "Natural gas and uranium", "Peat and lignite"], "mand": 0}, {"id": "GEO-09-010", "t": 9, "s": "9.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>wind power<\/b>.", "a": ["Advantage: <b>renewable and low carbon<\/b> in use (1)", "Advantage: low running costs (1)", "Disadvantage: <b>intermittent<\/b> and depends on wind (1)", "Disadvantage: <b>visual impact<\/b> and noise, and costly to build (1)"], "cp": ["Advantage: renewable and low carbon in use", "Advantage: low running costs", "Disadvantage: intermittent and depends on wind", "Disadvantage: visual impact and noise, and costly to build"], "dp": ["It works with no wind", "It has no costs at all", "It releases large amounts of CO<sub>2<\/sub> when running"], "mand": 0}, {"id": "GEO-09-011", "t": 9, "s": "9.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>nuclear power<\/b>.", "a": ["Advantage: <b>large output<\/b> and low carbon (1)", "Advantage: <b>reliable<\/b> supply (1)", "Disadvantage: <b>radioactive waste<\/b> and accident risk (1)", "Disadvantage: very <b>high construction and decommissioning costs<\/b> (1)"], "cp": ["Advantage: large output and low carbon", "Advantage: reliable supply", "Disadvantage: radioactive waste and accident risk", "Disadvantage: very high construction and decommissioning costs"], "dp": ["It produces no waste", "It is a renewable resource", "It has zero accident risk"], "mand": 0}, {"id": "GEO-09-012", "t": 9, "s": "9.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>solar power<\/b>.", "a": ["Advantage: <b>renewable<\/b> and produces no emissions in use (1)", "Advantage: suits <b>remote areas<\/b> and sunny countries (1)", "Disadvantage: <b>depends on sunshine<\/b> and daylight (1)", "Disadvantage: <b>high installation costs<\/b> and storage needs (1)"], "cp": ["Advantage: renewable and produces no emissions in use", "Advantage: suits remote areas and sunny countries", "Disadvantage: depends on sunshine and daylight", "Disadvantage: high installation costs and storage needs"], "dp": ["It works well in the dark", "It has no installation cost", "It always produces more than needed"], "mand": 0}, {"id": "GEO-09-013", "t": 9, "s": "9.2", "k": "Evaluate", "m": 3, "ht": false, "q": "Evaluate <b>HEP (hydroelectric power)<\/b>: give two advantages and one disadvantage.", "a": ["Advantage: <b>renewable<\/b> and reliable (1)", "Advantage: provides <b>flood control and water supply<\/b> (1)", "Disadvantage: <b>floods land and displaces people<\/b>, and affects wildlife (1)"], "cp": ["Advantage: renewable and reliable", "Advantage: provides flood control and water supply", "Disadvantage: floods land and displaces people, and affects wildlife"], "dp": ["It produces no environmental impact", "It only works in deserts", "It has no construction cost"], "mand": 0}, {"id": "GEO-09-014", "t": 9, "s": "9.2", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two unconventional fossil fuel<\/b> sources.", "a": ["Any two (1 each):", "• <b>fracking<\/b> (shale gas)", "• <b>tar sands<\/b> (oil sands)", "• <b>deep-sea<\/b> drilling", "• coal-bed methane"], "cp": ["fracking (shale gas)", "tar sands (oil sands)", "deep-sea drilling", "coal-bed methane"], "dp": ["Wind and wave", "Solar and tidal", "Geothermal and biomass"], "mand": 0}, {"id": "GEO-09-015", "t": 9, "s": "9.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one concern<\/b> about fracking.", "a": ["<b>Groundwater contamination<\/b> risk (1)", "<b>Small earthquakes<\/b> (tremors) can be triggered (1)", "Still <b>releases greenhouse gases<\/b> and harms landscapes (1)"], "cp": ["Groundwater contamination risk", "Small earthquakes (tremors) can be triggered", "Still releases greenhouse gases and harms landscapes"], "dp": ["It is always completely safe", "It removes the need for water", "It reduces all emissions"], "mand": 0}, {"id": "GEO-09-016", "t": 9, "s": "9.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> individuals can reduce energy use.", "a": ["Any three (1 each):", "• <b>turn off<\/b> lights and devices", "• use <b>energy-efficient appliances<\/b>", "• <b>insulate<\/b> homes", "• <b>walk, cycle or use public transport<\/b>", "• use <b>LEDs<\/b> and smart meters"], "cp": ["turn off lights and devices", "use energy-efficient appliances", "insulate homes", "walk, cycle or use public transport", "use LEDs and smart meters"], "dp": ["Leave lights on", "Use more cars", "Heat empty rooms"], "mand": 0}, {"id": "GEO-09-017", "t": 9, "s": "9.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three government actions<\/b> to encourage sustainable energy use.", "a": ["Any three (1 each):", "• <b>subsidies<\/b> for renewables", "• <b>carbon taxes<\/b>", "• <b>regulation<\/b> of efficiency standards", "• <b>investment<\/b> in research", "• <b>international agreements<\/b>"], "cp": ["subsidies for renewables", "carbon taxes", "regulation of efficiency standards", "investment in research", "international agreements"], "dp": ["Banning insulation", "Taxing renewable energy heavily", "Removing all standards"], "mand": 0}, {"id": "GEO-09-018", "t": 9, "s": "9.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>attitudes to energy<\/b> can differ between stakeholders.", "a": ["<b>Energy companies<\/b> may focus on profit (1)", "<b>Environmental groups<\/b> push for renewables and lower emissions (1)", "<b>Governments<\/b> balance security, cost and climate targets (1)"], "cp": ["Energy companies may focus on profit", "Environmental groups push for renewables and lower emissions", "Governments balance security, cost and climate targets"], "dp": ["All stakeholders always agree", "Environmental groups promote coal", "Governments ignore cost"], "mand": 0}, {"id": "GEO-09-019", "t": 9, "s": "9.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>carbon capture and storage<\/b> as a way to reduce emissions.", "a": ["Advantage: can <b>cut CO<sub>2<\/sub> from power stations<\/b> (1)", "Advantage: allows continued use of existing plant while changing (1)", "Disadvantage: <b>expensive<\/b> and unproven at scale (1)", "Disadvantage: <b>storage safety<\/b> and leakage concerns (1)"], "cp": ["Advantage: can cut CO<sub>2<\/sub> from power stations", "Advantage: allows continued use of existing plant while changing", "Disadvantage: expensive and unproven at scale", "Disadvantage: storage safety and leakage concerns"], "dp": ["It removes the need for any other action", "It is free and fully developed", "It produces more CO<sub>2<\/sub>"], "mand": 0}, {"id": "GEO-09-020", "t": 9, "s": "9.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain what a <b>sustainable energy strategy<\/b> includes.", "a": ["A growing share of <b>renewables<\/b> (1)", "<b>Energy efficiency<\/b> and conservation (1)", "A secure, affordable supply that <b>reduces emissions<\/b> (1)"], "cp": ["A growing share of renewables", "Energy efficiency and conservation", "A secure, affordable supply that reduces emissions"], "dp": ["Only coal", "No energy efficiency", "Ignoring the environment"], "mand": 0}, {"id": "GEO-09-021", "t": 9, "s": "9.1", "k": "Data", "m": 3, "ht": false, "q": "A country's energy: coal 40%, oil 30%, gas 20%, renewables 10%. Calculate the <b>percentage from fossil fuels<\/b> and comment.", "a": ["Fossil fuels = 40 + 30 + 20 (1)", "= <b>90%<\/b> (1)", "The country is <b>highly dependent on fossil fuels<\/b> and has low renewable use (1)"], "cp": ["Fossil fuels = 40 + 30 + 20", "= 90%", "The country is highly dependent on fossil fuels and has low renewable use"], "dp": ["10% and mostly renewable", "60% and mostly nuclear", "100% and no renewables"], "mand": 0}, {"id": "GEO-09-022", "t": 9, "s": "9.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'renewable energy is always cheaper and perfect'<\/b>. What is wrong?", "a": ["Renewables can have <b>high set-up costs<\/b> and be <b>intermittent<\/b> (1)", "They can have <b>environmental impacts<\/b>, so you must weigh pros and cons (1)"], "cp": ["Renewables can have high set-up costs and be intermittent", "They can have environmental impacts, so you must weigh pros and cons"], "dp": ["Nothing is wrong", "They never need storage", "They have no impacts"], "mand": 0}, {"id": "GEO-09-023", "t": 9, "s": "9.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>energy sources vary between countries<\/b>.", "a": ["Different <b>natural resources<\/b> (coal, oil, rivers, sun) (1)", "Different <b>wealth and technology<\/b> (1)", "Different <b>policies and security<\/b> priorities (1)"], "cp": ["Different natural resources (coal, oil, rivers, sun)", "Different wealth and technology", "Different policies and security priorities"], "dp": ["All countries have the same energy mix", "Resources do not affect energy", "Wealth does not matter"], "mand": 0}, {"id": "GEO-09-024", "t": 9, "s": "9.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>energy use is linked to climate change<\/b>.", "a": ["Burning fossil fuels releases <b>CO<sub>2<\/sub><\/b> (1)", "Greenhouse gases <b>trap heat<\/b> and warm the planet (1)", "Rising energy demand increases <b>emissions<\/b> unless low-carbon sources grow (1)"], "cp": ["Burning fossil fuels releases CO<sub>2<\/sub>", "Greenhouse gases trap heat and warm the planet", "Rising energy demand increases emissions unless low-carbon sources grow"], "dp": ["Energy use cools the planet", "Fossil fuels absorb CO<sub>2<\/sub>", "Renewables increase emissions greatly"], "mand": 0}, {"id": "GEO-09-025", "t": 9, "s": "9.1", "k": "Recall", "m": 3, "ht": false, "q": "Classify energy resources as <b>non-renewable, renewable and recyclable<\/b>.", "a": ["<b>Non-renewable<\/b>: coal, oil and gas (1)", "<b>Renewable<\/b>: wind, solar and HEP (1)", "<b>Recyclable<\/b>: nuclear and biofuel (1)"], "cp": ["Non-renewable: coal, oil and gas", "Renewable: wind, solar and HEP", "Recyclable: nuclear and biofuel"], "dp": ["Renewable: coal, oil and gas", "Non-renewable: wind and solar", "Recyclable: coal and gas"], "mand": 0}, {"id": "GEO-09-026", "t": 9, "s": "9.2", "k": "Explain", "m": 3, "ht": false, "q": "What is <b>peak oil<\/b> and what affects the <b>price of oil<\/b>?", "a": ["<b>Peak oil<\/b>: half of reserves used, which may have passed (1)", "<b>OPEC<\/b> decisions and demand affect price (1)", "New supply, e.g. <b>US fracking<\/b>, caused oversupply and falling prices (1)"], "cp": ["Peak oil: half of reserves used, which may have passed", "OPEC decisions and demand affect price", "New supply, e.g. US fracking, caused oversupply and falling prices"], "dp": ["Peak oil is when no oil is left", "Oil price never changes", "OPEC sets the price of renewable energy"], "mand": 0}, {"id": "GEO-09-027", "t": 9, "s": "9.2", "k": "Explain", "m": 3, "ht": false, "q": "Why is there pressure to exploit the <b>Arctic<\/b> and <b>unconventional<\/b> oil and gas?", "a": ["The Arctic holds about <b>25%<\/b> of remaining oil and gas (1)", "New technology makes it possible (<b>drilling, seismic imaging<\/b>) (1)", "<b>Tar sands<\/b> (Canada) and shale gas are expensive and use lots of energy and water (1)"], "cp": ["The Arctic holds about 25% of remaining oil and gas", "New technology makes it possible (drilling, seismic imaging)", "Tar sands (Canada) and shale gas are expensive and use lots of energy and water"], "dp": ["The Arctic has no energy resources", "Unconventional sources are cheap and clean", "There is no technology to reach them"], "mand": 0}, {"id": "GEO-09-028", "t": 9, "s": "9.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to reduce reliance on <b>fossil fuels<\/b>.", "a": ["<b>Efficiency<\/b>: LED bulbs and solar water heating (1)", "<b>Transport<\/b>: hybrid buses (London) (1)", "<b>Diversification<\/b>: HEP, biofuels, hydrogen cars (1)"], "cp": ["Efficiency: LED bulbs and solar water heating", "Transport: hybrid buses (London)", "Diversification: HEP, biofuels, hydrogen cars"], "dp": ["Burn more coal", "Use more oil and gas", "Remove all renewable power"], "mand": 0}, {"id": "GEO-09-029", "t": 9, "s": "9.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare <b>energy use<\/b> in Malawi, India and a developed country.", "a": ["<b>Malawi<\/b>: low use, mostly fuelwood and dung, <b>energy poverty<\/b> (1)", "<b>India<\/b>: emerging economy, manufacturing and <b>coal<\/b> (1)", "<b>Developed countries<\/b>: high consumption, gas and oil (1)"], "cp": ["Malawi: low use, mostly fuelwood and dung, energy poverty", "India: emerging economy, manufacturing and coal", "Developed countries: high consumption, gas and oil"], "dp": ["Malawi uses the most energy", "India has energy poverty only", "Developed countries use no fossil fuels"], "mand": 0}, {"id": "GEO-09-030", "t": 9, "s": "9.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Give <b>four stakeholder views<\/b> on the future energy mix.", "a": ["<b>Energy companies<\/b>: supply energy (1)", "<b>Climatologists<\/b>: the current mix is unsustainable (1)", "<b>Governments<\/b>: tackle climate change and keep bills low (1)", "<b>Consumers<\/b>: low bills but concerned about climate change (1)"], "cp": ["Energy companies: supply energy", "Climatologists: the current mix is unsustainable", "Governments: tackle climate change and keep bills low", "Consumers: low bills but concerned about climate change"], "dp": ["All stakeholders agree", "Climatologists want more coal", "Governments ignore climate change"], "mand": 0}, {"id": "GEO-10-001", "t": 10, "s": "10.1", "k": "Recall", "m": 2, "ht": false, "q": "How do you give a <b>four-figure and a six-figure grid reference<\/b>?", "a": ["<b>Four-figure<\/b>: eastings first, then northings, to the grid square (1)", "<b>Six-figure<\/b>: add a tenth estimate in each direction, so the position is more precise (1)"], "cp": ["Four-figure: eastings first, then northings, to the grid square", "Six-figure: add a tenth estimate in each direction, so the position is more precise"], "dp": ["Northings first, then eastings", "Use latitude then longitude", "Count squares from the right edge"], "mand": 0}, {"id": "GEO-10-002", "t": 10, "s": "10.1", "k": "Process", "m": 2, "ht": false, "q": "What is the rule for reading a grid reference?", "a": ["<b>Along the corridor<\/b> (eastings) (1)", "<b>Then up the stairs<\/b> (northings) (1)"], "cp": ["Along the corridor (eastings)", "Then up the stairs (northings)"], "dp": ["Up the stairs, then along the corridor", "Always start at the top", "Read left to right then down"], "mand": 0}, {"id": "GEO-10-003", "t": 10, "s": "10.1", "k": "Calculation", "m": 3, "ht": false, "q": "A map has a scale of 1:25,000. A route measures 8 cm on the map. Calculate the <b>real distance<\/b> in km.", "a": ["8 × 25,000 = 200,000 cm (1)", "= 2,000 m (1)", "= <b>2 km<\/b> (1)"], "cp": ["8 × 25,000 = 200,000 cm", "= 2,000 m", "= 2 km"], "dp": ["20 km", "0.2 km", "200 km"], "mand": 0}, {"id": "GEO-10-004", "t": 10, "s": "10.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe how <b>contour lines<\/b> show relief.", "a": ["Lines join points of <b>equal height<\/b> (1)", "<b>Close together<\/b> means a steep slope (1)", "<b>Far apart<\/b> means a gentle slope (1)"], "cp": ["Lines join points of equal height", "Close together means a steep slope", "Far apart means a gentle slope"], "dp": ["Close lines mean flat land", "Contours show roads", "Contours show rivers only"], "mand": 0}, {"id": "GEO-10-005", "t": 10, "s": "10.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three features<\/b> that can be found on a map key.", "a": ["Any three (1 each):", "• <b>settlements<\/b> and buildings", "• <b>roads and railways<\/b>", "• <b>rivers and water<\/b>", "• <b>woodland<\/b>", "• <b>tourist symbols<\/b>"], "cp": ["settlements and buildings", "roads and railways", "rivers and water", "woodland", "tourist symbols"], "dp": ["Weather forecasts", "Population totals", "Tax rates"], "mand": 0}, {"id": "GEO-10-006", "t": 10, "s": "10.1", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>describe the relief<\/b> of an OS map area?", "a": ["Give <b>heights<\/b> and use <b>contour spacing<\/b> (1)", "Describe <b>slopes<\/b> as steep or gentle (1)", "Mention <b>valleys, ridges, peaks<\/b> and flat areas (1)"], "cp": ["Give heights and use contour spacing", "Describe slopes as steep or gentle", "Mention valleys, ridges, peaks and flat areas"], "dp": ["List shop names", "Describe only the roads", "Write the date"], "mand": 0}, {"id": "GEO-10-007", "t": 10, "s": "10.2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of map<\/b> used in geography to show data.", "a": ["<b>Choropleth<\/b> map (1)", "<b>Isoline<\/b> map (1)", "<b>Proportional symbol<\/b> map (1)"], "cp": ["Choropleth map", "Isoline map", "Proportional symbol map"], "dp": ["Weather map, sky map and moon map", "Tourist map, road map and city map only", "Contour map, tide map and rain map only"], "mand": 0}, {"id": "GEO-10-008", "t": 10, "s": "10.2", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>choropleth map<\/b>?", "a": ["A map that uses <b>different shades or colours<\/b> for areas (1)", "The shading shows <b>data values<\/b> such as population density (1)"], "cp": ["A map that uses different shades or colours for areas", "The shading shows data values such as population density"], "dp": ["A map with only roads", "A map that shows height only", "A drawing of a landscape"], "mand": 0}, {"id": "GEO-10-009", "t": 10, "s": "10.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three types of graph<\/b> commonly used in geography.", "a": ["Any three (1 each):", "• <b>bar chart<\/b>", "• <b>line graph<\/b>", "• <b>scatter graph<\/b>", "• <b>pie chart<\/b>", "• <b>histogram<\/b>", "• <b>pictogram<\/b>"], "cp": ["bar chart", "line graph", "scatter graph", "pie chart", "histogram", "pictogram"], "dp": ["Map, compass and ruler", "Table, key and scale", "Flow, delta and spit"], "mand": 0}, {"id": "GEO-10-010", "t": 10, "s": "10.2", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>describe a graph<\/b> in an exam?", "a": ["State the <b>overall trend or pattern<\/b> (1)", "Quote <b>figures with units<\/b>, such as highest and lowest (1)", "Mention <b>anomalies<\/b> or changes in rate (1)"], "cp": ["State the overall trend or pattern", "Quote figures with units, such as highest and lowest", "Mention anomalies or changes in rate"], "dp": ["Only repeat the title", "Give a personal opinion", "Only describe the colours"], "mand": 0}, {"id": "GEO-10-011", "t": 10, "s": "10.2", "k": "Calculation", "m": 3, "ht": false, "q": "Data: 12, 15, 9, 15, 19. Calculate the <b>mean, median and mode<\/b>.", "a": ["Mean = 70 ÷ 5 = <b>14<\/b> (1)", "Median: ordered 9, 12, 15, 15, 19 gives <b>15<\/b> (1)", "Mode = <b>15<\/b> (1)"], "cp": ["Mean = 70 ÷ 5 = 14", "Median: ordered 9, 12, 15, 15, 19 gives 15", "Mode = 15"], "dp": ["Mean 15, median 14, mode 9", "Mean 14, median 9, mode 12", "Mean 15, median 12, mode 15"], "mand": 0}, {"id": "GEO-10-012", "t": 10, "s": "10.2", "k": "Calculation", "m": 2, "ht": false, "q": "Calculate the <b>interquartile range<\/b> of 4, 6, 8, 10, 12, 14, 16, 18.", "a": ["Lower quartile = 7, upper quartile = 15 (1)", "IQR = 15 - 7 = <b>8<\/b> (1)"], "cp": ["Lower quartile = 7, upper quartile = 15", "IQR = 15 - 7 = 8"], "dp": ["14", "4", "18"], "mand": 0}, {"id": "GEO-10-013", "t": 10, "s": "10.2", "k": "Recall", "m": 2, "ht": false, "q": "What does <b>correlation<\/b> mean and how do you describe it?", "a": ["A <b>relationship<\/b> between two variables (1)", "Describe as <b>positive, negative or none<\/b>, and its strength (1)"], "cp": ["A relationship between two variables", "Describe as positive, negative or none, and its strength"], "dp": ["The size of a sample", "A type of map", "A sampling method"], "mand": 0}, {"id": "GEO-10-014", "t": 10, "s": "10.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three uses<\/b> of GIS (Geographical Information Systems).", "a": ["Any three (1 each):", "• <b>layering<\/b> data on maps", "• <b>planning<\/b> and decision making", "• <b>tracking hazards<\/b>", "• <b>analysing patterns<\/b>", "• <b>mapping flood or hazard risk<\/b>"], "cp": ["layering data on maps", "planning and decision making", "tracking hazards", "analysing patterns", "mapping flood or hazard risk"], "dp": ["Painting landscapes", "Measuring rock hardness", "Printing newspapers"], "mand": 0}, {"id": "GEO-10-015", "t": 10, "s": "10.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>two advantages<\/b> and <b>one limitation<\/b> of using photographs in geography.", "a": ["Advantage: show <b>real features<\/b> and landscapes (1)", "Advantage: useful for <b>comparing change<\/b> over time (1)", "Limitation: <b>limited viewpoint<\/b> or bias and may be dated (1)"], "cp": ["Advantage: show real features and landscapes", "Advantage: useful for comparing change over time", "Limitation: limited viewpoint or bias and may be dated"], "dp": ["They always show the whole area", "They never show anything useful", "They give exact measurements"], "mand": 0}, {"id": "GEO-10-016", "t": 10, "s": "10.2", "k": "Process", "m": 3, "ht": false, "q": "How do you <b>annotate a photograph or sketch<\/b> well?", "a": ["Label <b>key features<\/b> (1)", "Add <b>explanations<\/b>, for example how they formed (1)", "Keep notes <b>short and linked<\/b> to the question (1)"], "cp": ["Label key features", "Add explanations, for example how they formed", "Keep notes short and linked to the question"], "dp": ["Write a story", "Write long personal opinions", "Cover the photo in colour"], "mand": 0}, {"id": "GEO-10-017", "t": 10, "s": "10.3", "k": "Process", "m": 3, "ht": false, "q": "What are the <b>steps in the decision-making exercise<\/b> (Paper 3)?", "a": ["Read the <b>issue and resource booklet<\/b> carefully (1)", "Identify the <b>options and the stakeholders<\/b> (1)", "Weigh <b>advantages and disadvantages<\/b> and choose one option with a justification (1)"], "cp": ["Read the issue and resource booklet carefully", "Identify the options and the stakeholders", "Weigh advantages and disadvantages and choose one option with a justification"], "dp": ["Guess the answer immediately", "Ignore the resources", "Only write about your own opinion"], "mand": 0}, {"id": "GEO-10-018", "t": 10, "s": "10.3", "k": "Recall", "m": 3, "ht": false, "q": "What makes a <b>good justified decision<\/b> in a 12-mark Paper 3 answer?", "a": ["Make a clear <b>decision<\/b> (1)", "Use <b>evidence<\/b> from the resources (1)", "Consider <b>other options<\/b> and explain why they were rejected (1)"], "cp": ["Make a clear decision", "Use evidence from the resources", "Consider other options and explain why they were rejected"], "dp": ["Make no decision", "Quote no evidence", "Only describe one option"], "mand": 0}, {"id": "GEO-10-019", "t": 10, "s": "10.3", "k": "Definition", "m": 2, "ht": false, "q": "Who are <b>stakeholders<\/b>?", "a": ["People or groups <b>affected by or with an interest<\/b> in a decision (1)", "e.g. residents, councils, businesses and environmental groups (1)"], "cp": ["People or groups affected by or with an interest in a decision", "e.g. residents, councils, businesses and environmental groups"], "dp": ["People who plant trees only", "Only the government", "Only tourists"], "mand": 0}, {"id": "GEO-10-020", "t": 10, "s": "10.3", "k": "Evaluate", "m": 3, "ht": false, "q": "What does <b>sustainable<\/b> mean in a decision?", "a": ["Meets <b>current needs without harming<\/b> future generations (1)", "Considers <b>environmental<\/b> impact (1)", "Also considers <b>economic and social<\/b> impacts (1)"], "cp": ["Meets current needs without harming future generations", "Considers environmental impact", "Also considers economic and social impacts"], "dp": ["Cheapest for now only", "Makes the most profit only", "Ignores the environment"], "mand": 0}, {"id": "GEO-10-021", "t": 10, "s": "10.3", "k": "Exam trap", "m": 2, "ht": false, "q": "An exam asks you to <b>'assess'<\/b> something. What do you need to do?", "a": ["Weigh up <b>both sides<\/b> (1)", "Make a <b>judgement<\/b> backed by evidence (1)"], "cp": ["Weigh up both sides", "Make a judgement backed by evidence"], "dp": ["State only one side", "Describe only", "Give a list with no reasons"], "mand": 0}, {"id": "GEO-10-022", "t": 10, "s": "10.3", "k": "Exam trap", "m": 2, "ht": false, "q": "What does <b>'describe'<\/b> mean in a command word, compared with <b>'explain'<\/b>?", "a": ["<b>Describe<\/b>: say what something is like or what it shows (1)", "<b>Explain<\/b>: give <b>reasons<\/b> why or how (1)"], "cp": ["Describe: say what something is like or what it shows", "Explain: give reasons why or how"], "dp": ["Describe means give reasons", "Explain means list features", "They mean the same thing"], "mand": 0}, {"id": "GEO-10-023", "t": 10, "s": "10.3", "k": "Exam trap", "m": 2, "ht": false, "q": "What are <b>PEEL-style answers<\/b> for 6-mark questions?", "a": ["<b>Point<\/b>, <b>evidence<\/b>, <b>explanation<\/b> (and link back) (1)", "Use <b>case study evidence<\/b> to support each point (1)"], "cp": ["Point, evidence, explanation (and link back)", "Use case study evidence to support each point"], "dp": ["Write one long sentence", "Avoid examples", "Write only a list of keywords"], "mand": 0}, {"id": "GEO-10-024", "t": 10, "s": "10.1", "k": "Calculation", "m": 2, "ht": false, "q": "A map has a scale of 1:50,000. How many <b>cm on the map<\/b> represent 3 km?", "a": ["3 km = 300,000 cm (1)", "300,000 ÷ 50,000 = <b>6 cm<\/b> (1)"], "cp": ["3 km = 300,000 cm", "300,000 ÷ 50,000 = 6 cm"], "dp": ["60 cm", "0.6 cm", "15 cm"], "mand": 0}, {"id": "GEO-10-025", "t": 10, "s": "10.1", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two ways<\/b> a compass can be used on an OS map.", "a": ["Find <b>direction<\/b> between two places (1)", "Give bearings or <b>eight-point compass directions<\/b> (e.g. north-west) (1)"], "cp": ["Find direction between two places", "Give bearings or eight-point compass directions (e.g. north-west)"], "dp": ["To measure rainfall", "To draw contour lines", "To count houses"], "mand": 0}, {"id": "GEO-10-026", "t": 10, "s": "10.2", "k": "Recall", "m": 2, "ht": false, "q": "What is a <b>flow line map<\/b>?", "a": ["Shows <b>movement<\/b> such as trade or migration with lines (1)", "Line <b>width shows volume<\/b> (1)"], "cp": ["Shows movement such as trade or migration with lines", "Line width shows volume"], "dp": ["A map showing only altitude", "A map showing rainfall only", "A map of road signs"], "mand": 0}, {"id": "GEO-10-027", "t": 10, "s": "10.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why you should write <b>units<\/b> in geographical answers.", "a": ["Numbers are <b>meaningless without units<\/b> (1)", "They avoid <b>confusion<\/b>, such as km and m (1)", "Examiners expect <b>accuracy<\/b> and credit correct units (1)"], "cp": ["Numbers are meaningless without units", "They avoid confusion, such as km and m", "Examiners expect accuracy and credit correct units"], "dp": ["Units are never needed", "Units make answers wrong", "Units only matter in art"], "mand": 0}, {"id": "GEO-11-001", "t": 11, "s": "Booster P2", "k": "Process", "m": 4, "ht": false, "q": "Paper 2 is the <b>UK paper<\/b>. Which sections does it have, and which fieldwork questions do you answer?", "a": ["Section A: the UK's <b>physical<\/b> landscape. Section B: the UK's <b>human<\/b> landscape (1)", "Section C: fieldwork. C1 is physical, C2 is human (1)", "Answer <b>Question 8<\/b> (coastal change and conflict) and <b>Question 10<\/b> (dynamic urban areas) (1)", "Do <b>not<\/b> answer Questions 9 or 11 (1)"], "cp": ["Section A: the UK's physical landscape. Section B: the UK's human landscape", "Section C: fieldwork. C1 is physical, C2 is human", "Answer Question 8 (coastal change and conflict) and Question 10 (dynamic urban areas)", "Do not answer Questions 9 or 11"], "dp": ["Answer all four fieldwork questions 8, 9, 10 and 11", "Answer Questions 9 and 11 only", "Choose any one fieldwork question"], "mand": 0}, {"id": "GEO-11-002", "t": 11, "s": "Booster P2", "k": "Process", "m": 3, "ht": false, "q": "How does the booster booklet suggest you <b>split your time<\/b> on Paper 2 (94 marks)?", "a": ["Section A: about <b>30 minutes<\/b> (1)", "Section B: about <b>30 minutes<\/b> (1)", "Section C (C1 and C2 together): about <b>45 minutes<\/b> (1)", "Check the paper length on your timetable (booklet: 1 hour 45; Pearson lists 1 hour 30)"], "cp": ["Section A: about 30 minutes", "Section B: about 30 minutes", "Section C (C1 and C2 together): about 45 minutes"], "dp": ["Spend 10 minutes on each section", "Spend all the time on Section C", "Spend 60 minutes on Section A"], "mand": 0}, {"id": "GEO-11-003", "t": 11, "s": "Booster P2", "k": "Process", "m": 2, "ht": false, "q": "Why must every example on <b>Paper 2<\/b> come from the <b>UK<\/b>?", "a": ["Paper 2 is about <b>UK geographical issues<\/b> (1)", "Case studies from <b>anywhere else in the world<\/b> will not earn marks (1)"], "cp": ["Paper 2 is about UK geographical issues", "Case studies from anywhere else in the world will not earn marks"], "dp": ["Paper 2 rewards examples from abroad", "Only Section C needs UK examples", "Any country is allowed if it is described well"], "mand": 0}, {"id": "GEO-11-004", "t": 11, "s": "Booster P2", "k": "Process", "m": 5, "ht": false, "q": "How do you structure an <b>8-mark 'assess' answer with a source<\/b>? (e.g. 'Assess the influence of geology on the UK landscape')", "a": ["<b>Short paragraph 1<\/b>: Trend, Evidence, Anomaly (1)", "Then <b>two PEEJ paragraphs<\/b> (1)", "<b>P<\/b>oint: 'the most / second most significant...' (1)", "<b>E<\/b>vidence from the figure, then <b>E<\/b>xplanation 'this means...' (1)", "<b>J<\/b>udgement: 'most significant as it...' using SITS (1)"], "cp": ["Short paragraph 1: Trend, Evidence, Anomaly", "Then two PEEJ paragraphs", "Point: 'the most / second most significant...'", "Evidence from the figure, then Explanation 'this means...'", "Judgement: 'most significant as it...' using SITS"], "dp": ["Retell the figure line by line and stop", "Write one long paragraph with no data", "Give a list of facts from memory only"], "mand": 0}, {"id": "GEO-11-005", "t": 11, "s": "Booster P2", "k": "Recall", "m": 4, "ht": false, "q": "What does <b>SITS<\/b> stand for when you make a <b>judgement<\/b>?", "a": ["<b>S<\/b>cale: local or regional, national, global (1)", "<b>I<\/b>mpact: positive or negative (1)", "<b>T<\/b>imescale: short term or long term (1)", "<b>S<\/b>ustainable: lasting for future generations (1)"], "cp": ["Scale: local or regional, national, global", "Impact: positive or negative", "Timescale: short term or long term", "Sustainable: lasting for future generations"], "dp": ["Size, Income, Time, Speed", "Source, Impact, Trend, Summary", "Scale, Issue, Trend, Support"], "mand": 0}, {"id": "GEO-11-006", "t": 11, "s": "Booster P2", "k": "Process", "m": 4, "ht": false, "q": "In an <b>unfamiliar fieldwork<\/b> 8-mark question, name four things to check in the <b>method<\/b>.", "a": ["Any four (1 each):", "• <b>sample size<\/b> and <b>sampling method<\/b>", "• <b>day and time<\/b>", "• <b>who was asked<\/b>", "• <b>type of data<\/b>", "• <b>secondary data<\/b>: recent?", "• data <b>comparable<\/b>?"], "cp": ["sample size and sampling method", "day and time", "who was asked", "type of data", "secondary data: recent?", "data comparable?"], "dp": ["The colour of the clipboards", "How much the students enjoyed it", "The brand of pens used"], "mand": 0}, {"id": "GEO-11-007", "t": 11, "s": "Booster P2", "k": "Process", "m": 6, "ht": false, "q": "How do you <b>analyse the conclusion<\/b> in an unfamiliar fieldwork question?", "a": ["Expect <b>some flaws<\/b> (1)", "Does <b>all the evidence support<\/b> it? (1)", "Compare the data <b>trend<\/b> with the conclusion (1)", "Find evidence to <b>support and counter<\/b> it (1)", "Start with what is <b>correct<\/b>, then the issues (1)", "End with a <b>judgement<\/b> on reliability (1)"], "cp": ["Expect some flaws", "Does all the evidence support it?", "Compare the data trend with the conclusion", "Find evidence to support and counter it", "Start with what is correct, then the issues", "End with a judgement on reliability"], "dp": ["Copy the conclusion out word for word", "Say it is perfect without checking", "Ignore the data and give your own opinion"], "mand": 0}, {"id": "GEO-11-008", "t": 11, "s": "Booster P2", "k": "Process", "m": 4, "ht": false, "q": "What is the difference between answering <b>'assess'<\/b> and <b>'evaluate'<\/b> on your <b>own fieldwork<\/b> (8 marks)?", "a": ["<b>Assess<\/b>: weigh it up with PEEJ paragraphs (most significant, second, third) (1)", "Be <b>specific<\/b>: use your actual location, methods and secondary data, and do not story-tell (1)", "<b>Evaluate<\/b>: you must give <b>advantages and disadvantages<\/b> (1)", "<b>Evaluate<\/b> must end with a conclusion: do the advantages outweigh the disadvantages? (1)"], "cp": ["Assess: weigh it up with PEEJ paragraphs (most significant, second, third)", "Be specific: use your actual location, methods and secondary data, and do not story-tell", "Evaluate: you must give advantages and disadvantages", "Evaluate must end with a conclusion: do the advantages outweigh the disadvantages?"], "dp": ["They mean the same thing and need no structure", "Assess needs a list; evaluate needs a story", "Both need only one-word answers"], "mand": 0}, {"id": "GEO-11-009", "t": 11, "s": "Booster P2", "k": "Recall", "m": 7, "ht": false, "q": "What <b>seven headings<\/b> can you use to organise what you know about your fieldwork?", "a": ["Hypothesis or <b>enquiry question<\/b> (1)", "<b>Location<\/b> (1)", "<b>Primary<\/b> data (1)", "<b>Secondary<\/b> data (1)", "Data <b>presentation and analysis<\/b> (1)", "<b>Conclusions<\/b> (1)", "<b>Evaluation<\/b> (1)"], "cp": ["Hypothesis or enquiry question", "Location", "Primary data", "Secondary data", "Data presentation and analysis", "Conclusions", "Evaluation"], "dp": ["Title, cover, index, glossary, quiz, poster, map", "Weather, lunch, travel, kit, risk, cost, rain", "Start, middle, end, sketch, photo, graph, test"], "mand": 0}, {"id": "GEO-11-010", "t": 11, "s": "Booster P2", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four approaches<\/b> to coastal management in a shoreline management plan.", "a": ["<b>Hold the line<\/b>: keep the coastline where it is with defences (1)", "<b>Advance the line<\/b>: build new defences seaward (1)", "<b>Managed retreat<\/b> or strategic realignment (1)", "<b>Do nothing<\/b> (1)"], "cp": ["Hold the line: keep the coastline where it is with defences", "Advance the line: build new defences seaward", "Managed retreat or strategic realignment", "Do nothing"], "dp": ["Build, break, bury, burn", "Hold, sink, drift, wash", "Retreat, advance, flood, freeze"], "mand": 0}, {"id": "GEO-11-011", "t": 11, "s": "Booster P2", "k": "Sequence", "m": 4, "ht": false, "q": "Put the <b>erosional landforms of a headland<\/b> in order, from first to last.", "a": ["A crack is eroded into a <b>cave<\/b> (1)", "The cave is eroded through to form an <b>arch<\/b> (1)", "The arch roof collapses leaving a <b>stack<\/b> (1)", "The stack is eroded to a <b>stump<\/b> (1)"], "cp": ["A crack is eroded into a cave", "The cave is eroded through to form an arch", "The arch roof collapses leaving a stack", "The stack is eroded to a stump"], "dp": ["Stump, stack, arch, cave", "Arch, cave, stump, stack", "Stack, stump, cave, arch"], "mand": 0}, {"id": "GEO-11-012", "t": 11, "s": "Booster P2", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four depositional landforms<\/b> found around the UK coast.", "a": ["<b>Spits<\/b> (1)", "<b>Salt marshes<\/b> (1)", "<b>Bars<\/b> (1)", "<b>Tombolos<\/b> (1)"], "cp": ["Spits", "Salt marshes", "Bars", "Tombolos"], "dp": ["Arches, stacks, caves and stumps", "Waterfalls, gorges, levees and deltas", "Cliffs, notches, platforms and dunes"], "mand": 0}, {"id": "GEO-11-013", "t": 11, "s": "Booster P2", "k": "Compare", "m": 3, "ht": false, "q": "Describe the <b>upper course<\/b> of a river (Bradshaw model).", "a": ["<b>Vertical erosion<\/b>, narrow shallow channel, large angular sediment (1)", "Landforms: <b>V-shaped valley<\/b>, interlocking spurs (1)", "Landforms: <b>waterfalls<\/b> (1)"], "cp": ["Vertical erosion, narrow shallow channel, large angular sediment", "Landforms: V-shaped valley, interlocking spurs", "Landforms: waterfalls"], "dp": ["Wide, deep channel with small rounded sediment", "Lateral erosion and meanders only", "A tidal estuary"], "mand": 0}, {"id": "GEO-11-014", "t": 11, "s": "Booster P2", "k": "Compare", "m": 4, "ht": false, "q": "Describe the <b>middle and lower course<\/b> of a river (Bradshaw model).", "a": ["<b>Middle<\/b>: lateral erosion, smaller rounder sediment, more discharge (1)", "<b>Middle<\/b> landforms: meanders, ox-bow lakes, flood plains (1)", "<b>Lower<\/b>: wide, deep channel, gentle gradient, much deposition (1)", "<b>Lower<\/b> landforms: estuaries, deltas, salt marshes (1)"], "cp": ["Middle: lateral erosion, smaller rounder sediment, more discharge", "Middle landforms: meanders, ox-bow lakes, flood plains", "Lower: wide, deep channel, gentle gradient, much deposition", "Lower landforms: estuaries, deltas, salt marshes"], "dp": ["Middle: vertical erosion and V-shaped valley", "Lower: steep narrow channel with large angular rocks", "Lower: waterfalls and interlocking spurs"], "mand": 0}, {"id": "GEO-11-015", "t": 11, "s": "Booster P2", "k": "Recall", "m": 4, "ht": false, "q": "Explain these parts of a <b>storm hydrograph<\/b>: <b>lag time<\/b>, <b>rising limb<\/b>, <b>peak discharge<\/b>.", "a": ["<b>Lag time<\/b>: the delay between peak rainfall and peak discharge (1)", "<b>Rising limb<\/b>: how quickly the river level rises after the rain (1)", "<b>Peak discharge<\/b>: the highest flow in the river (1)", "<b>Discharge<\/b>: volume of water passing a point each second, about width x depth x velocity (1)"], "cp": ["Lag time: the delay between peak rainfall and peak discharge", "Rising limb: how quickly the river level rises after the rain", "Peak discharge: the highest flow in the river", "Discharge: volume of water passing a point each second, about width x depth x velocity"], "dp": ["Lag time is the time rain falls for", "Rising limb is the fall after the peak", "Peak discharge is the lowest river level"], "mand": 0}, {"id": "GEO-11-016", "t": 11, "s": "Booster P2", "k": "Compare", "m": 4, "ht": false, "q": "Give <b>two hard<\/b> and <b>two soft engineering<\/b> river flood defences.", "a": ["<b>Hard<\/b>: flood walls or levees (1)", "<b>Hard<\/b>: dredging or flood relief channels (1)", "<b>Soft<\/b>: flood plain retention (1)", "<b>Soft<\/b>: relief channel restoration, working with natural processes (1)"], "cp": ["Hard: flood walls or levees", "Hard: dredging or flood relief channels", "Soft: flood plain retention", "Soft: relief channel restoration, working with natural processes"], "dp": ["Hard: planting trees. Soft: concrete walls", "Hard: warning sirens. Soft: sandbags", "Hard and soft mean the same thing"], "mand": 0}, {"id": "GEO-11-017", "t": 11, "s": "Booster P2", "k": "Case study", "m": 3, "ht": false, "q": "Why did the <b>Somerset Levels flood<\/b> so badly in 2014?", "a": ["Low-lying <b>moorland<\/b> floods easily (1)", "A run of <b>major storms<\/b> in the winter (1)", "Lack of <b>dredging<\/b> and levees that stopped the river adjusting to its channel (1)"], "cp": ["Low-lying moorland floods easily", "A run of major storms in the winter", "Lack of dredging and levees that stopped the river adjusting to its channel"], "dp": ["Because the area is a steep mountain valley", "Because the sea level dropped", "Because there was no rainfall"], "mand": 0}, {"id": "GEO-11-018", "t": 11, "s": "Booster P2", "k": "Compare", "m": 4, "ht": false, "q": "Compare the <b>urban core regions<\/b> and the <b>rural periphery<\/b> of the UK.", "a": ["<b>Core<\/b> (London, Birmingham, Manchester, Glasgow): benefit from the <b>multiplier effect<\/b> (1)", "<b>Core<\/b>: a younger population and more jobs (1)", "<b>Periphery<\/b>: older population, lower incomes, high transport costs (1)", "<b>Periphery<\/b>: young people leave (out-migration); economy based on primary industry and tourism (1)"], "cp": ["Core (London, Birmingham, Manchester, Glasgow): benefit from the multiplier effect", "Core: a younger population and more jobs", "Periphery: older population, lower incomes, high transport costs", "Periphery: young people leave (out-migration); economy based on primary industry and tourism"], "dp": ["The core has an older population and lower incomes", "The periphery has the most jobs and the youngest people", "They are the same in every way"], "mand": 0}, {"id": "GEO-11-019", "t": 11, "s": "Booster P2", "k": "Recall", "m": 3, "ht": false, "q": "How can the UK <b>reduce the gap<\/b> between the core and the periphery?", "a": ["<b>Enterprise zones<\/b> to attract business (1)", "<b>Grants and investment<\/b> in struggling areas (1)", "Better <b>transport links<\/b>, e.g. HS2 (1)"], "cp": ["Enterprise zones to attract business", "Grants and investment in struggling areas", "Better transport links, e.g. HS2"], "dp": ["Close all roads to the periphery", "Move all jobs to the south east", "Stop any investment"], "mand": 0}, {"id": "GEO-11-020", "t": 11, "s": "Booster P2", "k": "Explain", "m": 3, "ht": false, "q": "Why has the UK economy become more <b>globalised<\/b>?", "a": ["<b>Free trade<\/b>, for example through EU membership (1)", "<b>Foreign direct investment<\/b> brings capital and jobs (1)", "Growth of <b>TNCs<\/b> and privatisation of services and infrastructure (1)"], "cp": ["Free trade, for example through EU membership", "Foreign direct investment brings capital and jobs", "Growth of TNCs and privatisation of services and infrastructure"], "dp": ["Because the UK stopped trading", "Because of fewer flights and ports", "Because all businesses are owned locally"], "mand": 0}, {"id": "GEO-11-021", "t": 11, "s": "Booster P2", "k": "Recall", "m": 5, "ht": false, "q": "Describe the <b>structure of London<\/b> from the centre outwards.", "a": ["<b>CBD<\/b>: high-rise offices, oldest, highest land values (1)", "<b>Inner suburbs<\/b>: old factories, terraces, flats (1)", "Inner suburbs: <b>quality varies<\/b> (1)", "<b>Urban-rural fringe<\/b>: lower density, some industry (1)", "Fringe: <b>higher quality<\/b> (1)"], "cp": ["CBD: high-rise offices, oldest, highest land values", "Inner suburbs: old factories, terraces, flats", "Inner suburbs: quality varies", "Urban-rural fringe: lower density, some industry", "Fringe: higher quality"], "dp": ["The CBD has the lowest land values", "The fringe has the tallest buildings", "The inner suburbs are all farmland"], "mand": 0}, {"id": "GEO-11-022", "t": 11, "s": "Booster P2", "k": "Explain", "m": 4, "ht": false, "q": "Explain how <b>London<\/b> has changed through <b>deindustrialisation<\/b> and <b>reurbanisation<\/b>.", "a": ["<b>Deindustrialisation<\/b>: Docklands industry closed, causing unemployment and depopulation (1)", "<b>Reurbanisation<\/b>: regeneration brings people back, e.g. Queen Elizabeth Olympic Park after 2012 (1)", "<b>Rebranding<\/b> raises the desirability of poorer areas (1)", "<b>Gentrification<\/b> and studentification change inner areas (1)"], "cp": ["Deindustrialisation: Docklands industry closed, causing unemployment and depopulation", "Reurbanisation: regeneration brings people back, e.g. Queen Elizabeth Olympic Park after 2012", "Rebranding raises the desirability of poorer areas", "Gentrification and studentification change inner areas"], "dp": ["Docklands grew bigger as industry arrived", "Reurbanisation means people leave cities", "Regeneration never changes an area"], "mand": 0}, {"id": "GEO-11-023", "t": 11, "s": "Booster P2", "k": "Explain", "m": 3, "ht": false, "q": "Why did people <b>move out of central London<\/b> (suburbanisation and decentralisation)?", "a": ["<b>Suburbanisation<\/b>: the Underground and electrified surface rail made commuting easier (1)", "<b>Decentralisation<\/b>: shopping and jobs moved out of the CBD (1)", "e.g. <b>out-of-town shopping centres<\/b>, retail parks and business parks (1)"], "cp": ["Suburbanisation: the Underground and electrified surface rail made commuting easier", "Decentralisation: shopping and jobs moved out of the CBD", "e.g. out-of-town shopping centres, retail parks and business parks"], "dp": ["Because the Underground was closed", "Because the CBD had no offices", "Because the fringe had no houses"], "mand": 0}, {"id": "GEO-11-024", "t": 11, "s": "Booster P2", "k": "Recall", "m": 5, "ht": false, "q": "Describe an <b>accessible rural area<\/b> such as <b>Terling<\/b>, and the <b>challenges<\/b> facing rural areas.", "a": ["A <b>commuter village<\/b>, e.g. Terling (1)", "Decline of <b>primary industries<\/b>, e.g. farming, fishing (1)", "<b>Deprivation<\/b> and many <b>elderly<\/b> people (1)", "<b>Few services<\/b>, poor access to health care (1)", "Poor access to <b>higher education<\/b> (1)"], "cp": ["A commuter village, e.g. Terling", "Decline of primary industries, e.g. farming, fishing", "Deprivation and many elderly people", "Few services, poor access to health care", "Poor access to higher education"], "dp": ["A remote village with no road access", "A city centre with many services", "An area with few elderly people"], "mand": 0}, {"id": "GEO-11-025", "t": 11, "s": "Booster P2", "k": "Case study", "m": 4, "ht": false, "q": "How has <b>investment in Devon<\/b> (e.g. the Met Office in Exeter) changed the area?", "a": ["Population has <b>increased<\/b> (1)", "More pressure on <b>housing<\/b> (1)", "More pressure on <b>leisure and recreation<\/b> (1)", "More <b>jobs<\/b> and skilled workers, but congestion and pressure on some services (1)"], "cp": ["Population has increased", "More pressure on housing", "More pressure on leisure and recreation", "More jobs and skilled workers, but congestion and pressure on some services"], "dp": ["Population fell and housing was cheap", "Jobs disappeared and services improved", "Nothing changed"], "mand": 0}, {"id": "GEO-11-026", "t": 11, "s": "Booster P2", "k": "Recall", "m": 4, "ht": false, "q": "Name <b>four processes<\/b> that explain different levels of <b>population growth<\/b> in UK areas.", "a": ["<b>Rural to urban<\/b> migration (1)", "<b>Natural increase<\/b> (1)", "<b>International migration<\/b> (1)", "<b>Counter-urbanisation<\/b> (1)"], "cp": ["Rural to urban migration", "Natural increase", "International migration", "Counter-urbanisation"], "dp": ["Earthquakes, tsunamis, volcanoes, floods", "Taxes, tariffs, trade, tourism", "Birth, death, school, work only"], "mand": 0}, {"id": "GEO-11-027", "t": 11, "s": "Booster P2", "k": "Explain", "m": 3, "ht": false, "q": "Use the pattern of <b>UK population growth<\/b>: why does <b>London<\/b> grow fast but <b>rural Yorkshire<\/b> grow slowly?", "a": ["<b>London<\/b>: high international migration and many jobs in the knowledge economy (1)", "<b>Accessible rural areas<\/b> grow by commuters moving out (1)", "<b>Rural Yorkshire<\/b>: older population and slower growth (1)"], "cp": ["London: high international migration and many jobs in the knowledge economy", "Accessible rural areas grow by commuters moving out", "Rural Yorkshire: older population and slower growth"], "dp": ["London has fewer jobs than Yorkshire", "Rural Yorkshire has the youngest population", "Growth is the same everywhere"], "mand": 0}, {"id": "GEO-11-028", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 4, "ht": false, "q": "<b>Q8 coastal fieldwork<\/b>: what was the investigation, the enquiry question and the location?", "a": ["Investigate the <b>impact of coastal management<\/b> on coastal processes and communities (1)", "Enquiry question: <b>groynes have an impact on longshore drift<\/b> (1)", "Location: <b>Christchurch Bay<\/b> (1)", "Sites between <b>Hengistbury Head and Naish Farm<\/b> (1)"], "cp": ["Investigate the impact of coastal management on coastal processes and communities", "Enquiry question: groynes have an impact on longshore drift", "Location: Christchurch Bay", "Sites between Hengistbury Head and Naish Farm"], "dp": ["River flooding in Reading", "Urban quality of life in Reading", "Cliff erosion in Cornwall"], "mand": 0}, {"id": "GEO-11-029", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q8<\/b>: why did the class choose <b>Christchurch Bay<\/b> for the fieldwork?", "a": ["It is the <b>nearest coastline to school<\/b> (1)", "Contrasting sites with different <b>management<\/b> (1)", "<b>Accessible<\/b> to large groups and coaches (1)"], "cp": ["It is the nearest coastline to school", "Contrasting sites with different management", "Accessible to large groups and coaches"], "dp": ["It has the tallest cliffs in the UK", "It has no coastal management", "It is free to park on the beach"], "mand": 0}, {"id": "GEO-11-030", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 4, "ht": false, "q": "<b>Q8<\/b>: what <b>primary data<\/b> was collected and what are its strengths and weaknesses?", "a": ["<b>Beach profiles<\/b> (quantitative) using ranging poles, a clinometer and tape measures (1)", "+ gives <b>statistics<\/b> on the shape of the beach (1)", "- <b>human error<\/b>, e.g. misreading the clinometer (1)", "<b>Field sketch<\/b> (qualitative): easy and cheap, but <b>subjective<\/b> so less reliable (1)"], "cp": ["Beach profiles (quantitative) using ranging poles, a clinometer and tape measures", "+ gives statistics on the shape of the beach", "- human error, e.g. misreading the clinometer", "Field sketch (qualitative): easy and cheap, but subjective so less reliable"], "dp": ["Rainfall totals from the Met Office", "Census data about people", "A shoreline management plan from the council"], "mand": 0}, {"id": "GEO-11-031", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q8<\/b>: what <b>secondary data<\/b> was used and what did each source show?", "a": ["A <b>geology map<\/b> shows the rock types and so rates of erosion (1)", "A <b>shoreline management plan<\/b> shows how sites are managed and the direction of longshore drift (1)", "Together they show <b>where management is located<\/b> and how geology affects erosion (1)"], "cp": ["A geology map shows the rock types and so rates of erosion", "A shoreline management plan shows how sites are managed and the direction of longshore drift", "Together they show where management is located and how geology affects erosion"], "dp": ["A census and an index of multiple deprivation", "A traffic count and a questionnaire", "A weather forecast and a tide table"], "mand": 0}, {"id": "GEO-11-032", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q8<\/b>: what <b>conclusion<\/b> did the class reach about <b>groynes<\/b>?", "a": ["The enquiry question was <b>proved<\/b>: groynes affect longshore drift (1)", "Groynes trap sediment, causing <b>terminal groyne syndrome<\/b> further along (1)", "This leaves <b>smaller beaches<\/b> that are more vulnerable to erosion (1)"], "cp": ["The enquiry question was proved: groynes affect longshore drift", "Groynes trap sediment, causing terminal groyne syndrome further along", "This leaves smaller beaches that are more vulnerable to erosion"], "dp": ["Groynes had no effect at all", "Groynes make every beach bigger", "The results were inconclusive and unused"], "mand": 0}, {"id": "GEO-11-033", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q8<\/b>: what <b>evidence<\/b> supported the conclusion?", "a": ["<b>Beach profiles<\/b> differed on each side of the long groyne (1)", "The <b>Naish Farm<\/b> profile was smaller and shallower (1)", "The <b>shoreline management plan<\/b> showed longshore drift direction and many groynes (1)"], "cp": ["Beach profiles differed on each side of the long groyne", "The Naish Farm profile was smaller and shallower", "The shoreline management plan showed longshore drift direction and many groynes"], "dp": ["A traffic count on a pedestrian street", "Graffiti scores from the inner city", "Census data from 2010"], "mand": 0}, {"id": "GEO-11-034", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q8<\/b>: give <b>three limitations<\/b> of the coastal investigation.", "a": ["Any three (1 each):", "• <b>human error<\/b> using the clinometer for beach profiles", "• <b>only three<\/b> beach profiles, so the sample is small", "• <b>equipment error<\/b>, e.g. clinometers giving incorrect readings", "• <b>subjective<\/b> field sketches"], "cp": ["human error using the clinometer for beach profiles", "only three beach profiles, so the sample is small", "equipment error, e.g. clinometers giving incorrect readings", "subjective field sketches"], "dp": ["The sea was too blue", "Too many people were interviewed", "The data was all secondary"], "mand": 0}, {"id": "GEO-11-035", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q8<\/b>: what makes the coastal conclusion <b>reliable<\/b>?", "a": ["A <b>reliable source<\/b> of secondary data (1)", "All sites were on the <b>same coastline<\/b> (1)", "A <b>range of primary and secondary sources<\/b> supported the conclusion (1)"], "cp": ["A reliable source of secondary data", "All sites were on the same coastline", "A range of primary and secondary sources supported the conclusion"], "dp": ["It used only a single beach profile", "It relied on opinion alone", "It was done in a different county each time"], "mand": 0}, {"id": "GEO-11-036", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 4, "ht": false, "q": "<b>Q10 urban fieldwork<\/b>: what was the investigation, the enquiry question and the sites?", "a": ["Investigate <b>how and why quality of life varies within Reading<\/b> (1)", "Enquiry question: <b>which area of Reading has the highest environmental quality?<\/b> (1)", "Three sites: <b>Calcot<\/b> (suburb), the <b>inner city<\/b> and <b>Reading CBD<\/b> (1)", "Prediction based on the <b>Burgess model<\/b>: lowest quality of life in the inner city (1)"], "cp": ["Investigate how and why quality of life varies within Reading", "Enquiry question: which area of Reading has the highest environmental quality?", "Three sites: Calcot (suburb), the inner city and Reading CBD", "Prediction based on the Burgess model: lowest quality of life in the inner city"], "dp": ["Groynes and longshore drift", "Rural population change in Devon", "Deforestation in Cambodia"], "mand": 0}, {"id": "GEO-11-037", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q10<\/b>: why did the class choose <b>Reading<\/b>?", "a": ["<b>Close to school<\/b>, reducing travel time and cost (1)", "<b>Contrasting sites<\/b> with different levels of deprivation (1)", "<b>Accessible<\/b> to large groups and coaches (1)"], "cp": ["Close to school, reducing travel time and cost", "Contrasting sites with different levels of deprivation", "Accessible to large groups and coaches"], "dp": ["It is the biggest city in the UK", "It has no deprivation", "It is next to the coast"], "mand": 0}, {"id": "GEO-11-038", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 4, "ht": false, "q": "<b>Q10<\/b>: what <b>primary data<\/b> was collected and what are its strengths and weaknesses?", "a": ["<b>Traffic count<\/b>: number of vehicles in a minute (quantitative) (1)", "<b>Environmental quality survey<\/b>: scores on a scale of -3 to +3 for features like graffiti (1)", "+ gives an <b>overall score<\/b> for each site (1)", "- <b>totals can hide<\/b> specific environmental issues; <b>field sketches<\/b> are subjective (1)"], "cp": ["Traffic count: number of vehicles in a minute (quantitative)", "Environmental quality survey: scores on a scale of -3 to +3 for features like graffiti", "+ gives an overall score for each site", "- totals can hide specific environmental issues; field sketches are subjective"], "dp": ["A beach profile with a clinometer", "A geology map", "A shoreline management plan"], "mand": 0}, {"id": "GEO-11-039", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q10<\/b>: what <b>secondary data<\/b> was used and why?", "a": ["<b>Census data<\/b> covers the whole population and shows health, employment and education (1)", "The <b>Index of Multiple Deprivation<\/b> combines indices such as income, crime, health and employment (1)", "IMD <b>helped choose sites<\/b> with contrasting levels of deprivation (1)"], "cp": ["Census data covers the whole population and shows health, employment and education", "The Index of Multiple Deprivation combines indices such as income, crime, health and employment", "IMD helped choose sites with contrasting levels of deprivation"], "dp": ["A shoreline management plan and a tide table", "A weather map and rainfall chart", "A traffic count and a field sketch"], "mand": 0}, {"id": "GEO-11-040", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q10<\/b>: what <b>conclusion<\/b> did the class reach about environmental quality in Reading?", "a": ["<b>Calcot<\/b> had the highest environmental quality (1)", "Quality <b>decreased towards the CBD<\/b>, but rose again in the CBD itself (1)", "This matched the prediction that the <b>inner city has the lowest<\/b> quality (1)"], "cp": ["Calcot had the highest environmental quality", "Quality decreased towards the CBD, but rose again in the CBD itself", "This matched the prediction that the inner city has the lowest quality"], "dp": ["The inner city had the highest quality", "Quality was identical at all three sites", "The CBD had the lowest quality"], "mand": 0}, {"id": "GEO-11-041", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q10<\/b>: what <b>evidence<\/b> supported the conclusion?", "a": ["The <b>environmental quality survey<\/b> scored lowest in the inner city (poor housing, graffiti, rubbish) (1)", "<b>IMD data<\/b> showed the highest deprivation in the inner city (1)", "<b>Field sketches<\/b> showed terraced housing and on-street parking (1)"], "cp": ["The environmental quality survey scored lowest in the inner city (poor housing, graffiti, rubbish)", "IMD data showed the highest deprivation in the inner city", "Field sketches showed terraced housing and on-street parking"], "dp": ["Beach profiles either side of a groyne", "A shoreline management plan", "A geology map"], "mand": 0}, {"id": "GEO-11-042", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 4, "ht": false, "q": "<b>Q10<\/b>: give <b>four limitations<\/b> of the urban investigation.", "a": ["Any four (1 each):", "• traffic count in a <b>dead end street<\/b> and a pedestrian zone were not comparable", "• <b>IMD and census data<\/b> was out of date (2010)", "• only <b>three sites<\/b>, a small sample", "• a <b>weekday<\/b> may change congestion", "• <b>time of year<\/b> affects qualitative data"], "cp": ["traffic count in a dead end street and a pedestrian zone were not comparable", "IMD and census data was out of date (2010)", "only three sites, a small sample", "a weekday may change congestion", "time of year affects qualitative data"], "dp": ["Too many sites were visited", "The data was all collected on one day by one method", "The sample was very large"], "mand": 0}, {"id": "GEO-11-043", "t": 11, "s": "Booster P2", "k": "Fieldwork", "m": 3, "ht": false, "q": "<b>Q10<\/b>: what makes the urban conclusion <b>reliable<\/b>?", "a": ["It takes into account <b>multiple components<\/b>, for example the IMD (1)", "It is based on a <b>transect covering three sites<\/b> (1)", "Data was all collected <b>on the same day using the same methods<\/b> (1)"], "cp": ["It takes into account multiple components, for example the IMD", "It is based on a transect covering three sites", "Data was all collected on the same day using the same methods"], "dp": ["It used only opinions", "Each site was visited in a different month", "It used one measurement only"], "mand": 0}, {"id": "GEO-12-001", "t": 12, "s": "Booster P3", "k": "Process", "m": 4, "ht": false, "q": "Paper 3 (<b>People and Environment Issues<\/b>) is worth 64 marks in 90 minutes. What are its sections and the suggested time for each?", "a": ["Sections: <b>A<\/b> People and the biosphere, <b>B<\/b> Forests under threat, <b>C<\/b> Consuming energy resources, <b>D<\/b> Making geographical decisions (1)", "<b>A and B<\/b> together: about 20 minutes (1)", "<b>C<\/b> (two 8-mark questions): about 30 minutes (1)", "<b>D<\/b> (decision making): about 30 minutes (1)"], "cp": ["Sections: A People and the biosphere, B Forests under threat, C Consuming energy resources, D Making geographical decisions", "A and B together: about 20 minutes", "C (two 8-mark questions): about 30 minutes",
