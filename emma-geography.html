 "a": ["<b>Uplands<\/b> (high ground) are mostly in the north and west (1)", "<b>Lowlands<\/b> (low, flatter land) are mostly in the south and east (1)"], "cp": ["Uplands (high ground) are mostly in the north and west", "Lowlands (low, flatter land) are mostly in the south and east"], "dp": ["Uplands in the south east, lowlands in the north west", "The UK is completely flat", "Mountains cover the whole of England"], "mand": 0}, {"id": "GEO-04-002", "t": 4, "s": "4.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three rock types<\/b> and give an example of each found in the UK.", "a": ["<b>Igneous<\/b>, e.g. granite (1)", "<b>Sedimentary<\/b>, e.g. chalk or limestone (1)", "<b>Metamorphic<\/b>, e.g. slate or marble (1)"], "cp": ["Igneous, e.g. granite", "Sedimentary, e.g. chalk or limestone", "Metamorphic, e.g. slate or marble"], "dp": ["Igneous: chalk, sedimentary: granite, metamorphic: clay", "Igneous: slate, sedimentary: marble, metamorphic: sand", "Igneous: sand, sedimentary: basalt, metamorphic: limestone"], "mand": 0}, {"id": "GEO-04-003", "t": 4, "s": "4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>glaciation<\/b> has shaped UK upland landscapes.", "a": ["Ice sheets and glaciers <b>eroded valleys<\/b> into U-shapes (1)", "They carved <b>corries, arêtes and pyramidal peaks<\/b> (1)", "Melting ice left <b>deposits<\/b> (moraine) and lakes (1)"], "cp": ["Ice sheets and glaciers eroded valleys into U-shapes", "They carved corries, arêtes and pyramidal peaks", "Melting ice left deposits (moraine) and lakes"], "dp": ["Glaciers have never reached the UK", "Glaciers made V-shaped valleys", "Volcanoes carved all uplands"], "mand": 0}, {"id": "GEO-04-004", "t": 4, "s": "4.2", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four processes of coastal erosion<\/b>.", "a": ["<b>Hydraulic action<\/b> (1)", "<b>Abrasion<\/b> (1)", "<b>Attrition<\/b> (1)", "<b>Solution<\/b> (1)"], "cp": ["Hydraulic action", "Abrasion", "Attrition", "Solution"], "dp": ["Hydraulic action, deposition, saltation and traction", "Suspension, solution, traction and abrasion", "Freeze-thaw, slumping, landslide and rockfall"], "mand": 0}, {"id": "GEO-04-005", "t": 4, "s": "4.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>hydraulic action<\/b> and what is <b>abrasion<\/b>?", "a": ["<b>Hydraulic action<\/b>: waves force air and water into cracks, breaking the rock (1)", "<b>Abrasion<\/b>: waves hurl rocks and sand that wear away the cliff (1)"], "cp": ["Hydraulic action: waves force air and water into cracks, breaking the rock", "Abrasion: waves hurl rocks and sand that wear away the cliff"], "dp": ["Hydraulic action: rocks hit each other and become smaller", "Abrasion: acids dissolve the rock", "Both mean transport by wind"], "mand": 0}, {"id": "GEO-04-006", "t": 4, "s": "4.2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three types of weathering or mass movement<\/b> on coasts.", "a": ["Any three (1 each):", "• <b>freeze-thaw<\/b> (mechanical)", "• <b>chemical weathering<\/b>", "• <b>biological weathering<\/b> (roots)", "• <b>rockfall<\/b>", "• <b>landslide<\/b>", "• <b>slumping<\/b>"], "cp": ["freeze-thaw (mechanical)", "chemical weathering", "biological weathering (roots)", "rockfall", "landslide", "slumping"], "dp": ["Longshore drift", "Spits and bars", "Hydraulic action"], "mand": 0}, {"id": "GEO-04-007", "t": 4, "s": "4.2", "k": "Process", "m": 4, "ht": false, "q": "Describe how <b>longshore drift<\/b> moves material along a coast.", "a": ["Waves approach the coast at an <b>angle<\/b> due to the prevailing wind (1)", "The <b>swash<\/b> carries material up the beach at that angle (1)", "The <b>backwash<\/b> returns straight down the slope (1)", "Material moves <b>along the beach<\/b> in a zigzag (1)"], "cp": ["Waves approach the coast at an angle due to the prevailing wind", "The swash carries material up the beach at that angle", "The backwash returns straight down the slope", "Material moves along the beach in a zigzag"], "dp": ["Waves approach at 90 degrees so material moves straight up and down", "Backwash moves material up the beach", "Longshore drift only happens in rivers"], "mand": 0}, {"id": "GEO-04-008", "t": 4, "s": "4.2", "k": "Explain", "m": 4, "ht": false, "q": "Explain the formation of a <b>stack<\/b> from a headland.", "a": ["Waves <b>erode cracks<\/b> in the headland (1)", "Cracks become a <b>cave<\/b>, then widen into an <b>arch<\/b> (1)", "The arch roof collapses leaving a <b>stack<\/b> (1)", "The stack is eroded to a <b>stump<\/b> (1)"], "cp": ["Waves erode cracks in the headland", "Cracks become a cave, then widen into an arch", "The arch roof collapses leaving a stack", "The stack is eroded to a stump"], "dp": ["Deposition builds a pillar of sand", "Rivers cut a stack from a headland", "Wind carves a stack from a beach"], "mand": 0}, {"id": "GEO-04-009", "t": 4, "s": "4.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>headlands and bays<\/b> form.", "a": ["Alternating <b>hard and soft rock<\/b> along the coast (1)", "Soft rock erodes faster, forming <b>bays<\/b> (1)", "Hard rock erodes slower and sticks out as <b>headlands<\/b> (1)"], "cp": ["Alternating hard and soft rock along the coast", "Soft rock erodes faster, forming bays", "Hard rock erodes slower and sticks out as headlands"], "dp": ["Sea level changes carve bays", "Bays are made by deposition from rivers", "Hard rock erodes faster than soft rock"], "mand": 0}, {"id": "GEO-04-010", "t": 4, "s": "4.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>spit<\/b> forms.", "a": ["<b>Longshore drift<\/b> carries sand along the coast (1)", "The coast changes direction (or a river mouth), and sediment is <b>deposited<\/b> (1)", "A long ridge builds out into the sea, often with a <b>curved end<\/b> (1)"], "cp": ["Longshore drift carries sand along the coast", "The coast changes direction (or a river mouth), and sediment is deposited", "A long ridge builds out into the sea, often with a curved end"], "dp": ["Spits form when rivers flood", "Spits are made by cliff collapse", "Spits form when the coast is eroded fast"], "mand": 0}, {"id": "GEO-04-011", "t": 4, "s": "4.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three hard engineering<\/b> methods used to protect coasts.", "a": ["Any three (1 each):", "• <b>sea walls<\/b>", "• <b>groynes<\/b>", "• <b>rock armour<\/b> (rip-rap)", "• <b>gabions<\/b>", "• <b>revetments<\/b>"], "cp": ["sea walls", "groynes", "rock armour (rip-rap)", "gabions", "revetments"], "dp": ["Beach nourishment", "Dune regeneration", "Managed retreat"], "mand": 0}, {"id": "GEO-04-012", "t": 4, "s": "4.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three soft engineering<\/b> or sustainable methods used on coasts.", "a": ["Any three (1 each):", "• <b>beach nourishment<\/b> (adding sand)", "• <b>dune regeneration<\/b> (planting marram grass, fencing)", "• <b>managed retreat<\/b> (letting the sea flood land)", "• <b>cliff regrading<\/b>"], "cp": ["beach nourishment (adding sand)", "dune regeneration (planting marram grass, fencing)", "managed retreat (letting the sea flood land)", "cliff regrading"], "dp": ["Sea walls", "Rock armour", "Concrete groynes"], "mand": 0}, {"id": "GEO-04-013", "t": 4, "s": "4.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>sea walls<\/b> as coastal protection.", "a": ["Advantage: <b>strong<\/b> protection against waves (1)", "Advantage: protects homes and roads (1)", "Disadvantage: <b>expensive<\/b> to build and maintain (1)", "Disadvantage: <b>looks unattractive<\/b> and can deflect erosion elsewhere (1)"], "cp": ["Advantage: strong protection against waves", "Advantage: protects homes and roads", "Disadvantage: expensive to build and maintain", "Disadvantage: looks unattractive and can deflect erosion elsewhere"], "dp": ["Cheap and invisible", "Never needs maintenance", "Reduces erosion everywhere"], "mand": 0}, {"id": "GEO-04-014", "t": 4, "s": "4.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>why groynes<\/b> can cause problems further along the coast.", "a": ["Groynes <b>trap sediment<\/b> from longshore drift (1)", "Beaches beyond the groynes get <b>less sediment<\/b> (1)", "The coast there is <b>eroded faster<\/b> (1)"], "cp": ["Groynes trap sediment from longshore drift", "Beaches beyond the groynes get less sediment", "The coast there is eroded faster"], "dp": ["Groynes increase sediment down drift", "They stop all erosion everywhere", "They remove waves"], "mand": 0}, {"id": "GEO-04-015", "t": 4, "s": "4.2", "k": "Evaluate", "m": 3, "ht": false, "q": "Why is <b>managed retreat<\/b> often chosen despite loss of land?", "a": ["It is <b>cheaper<\/b> than building defences (1)", "It creates <b>natural habitats<\/b> such as salt marsh (1)", "It works <b>with nature<\/b> and slows erosion elsewhere (1)"], "cp": ["It is cheaper than building defences", "It creates natural habitats such as salt marsh", "It works with nature and slows erosion elsewhere"], "dp": ["It protects every home", "It is the most expensive option", "It uses large concrete walls"], "mand": 0}, {"id": "GEO-04-016", "t": 4, "s": "4.2", "k": "Recall", "m": 3, "ht": false, "q": "What are the <b>costs, benefits and conflicts<\/b> considered in a coastal management scheme?", "a": ["<b>Economic costs<\/b> of defences (1)", "<b>Benefits<\/b> such as protecting homes, businesses and farmland (1)", "<b>Conflicts<\/b> between residents, councils, environmental groups and visitors (1)"], "cp": ["Economic costs of defences", "Benefits such as protecting homes, businesses and farmland", "Conflicts between residents, councils, environmental groups and visitors"], "dp": ["Only the weather", "Only the number of boats", "Only the colour of the cliff"], "mand": 0}, {"id": "GEO-04-017", "t": 4, "s": "4.3", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four river processes of transport<\/b>.", "a": ["<b>Traction<\/b> (1)", "<b>Saltation<\/b> (1)", "<b>Suspension<\/b> (1)", "<b>Solution<\/b> (1)"], "cp": ["Traction", "Saltation", "Suspension", "Solution"], "dp": ["Hydraulic action, abrasion, attrition and solution", "Slumping, rockfall, landslide and flow", "Longshore drift, swash, backwash and wash"], "mand": 0}, {"id": "GEO-04-018", "t": 4, "s": "4.3", "k": "Explain", "m": 4, "ht": false, "q": "Explain how a <b>waterfall and gorge<\/b> form.", "a": ["River flows over <b>hard rock<\/b> above softer rock (1)", "Softer rock is eroded faster, creating an <b>overhang<\/b> and <b>plunge pool<\/b> (1)", "The overhang collapses and the waterfall <b>retreats upstream<\/b> (1)", "A steep-sided <b>gorge<\/b> is left behind (1)"], "cp": ["River flows over hard rock above softer rock", "Softer rock is eroded faster, creating an overhang and plunge pool", "The overhang collapses and the waterfall retreats upstream", "A steep-sided gorge is left behind"], "dp": ["Deposition builds a waterfall", "A gorge forms before a waterfall", "Waterfalls form in lowland floodplains"], "mand": 0}, {"id": "GEO-04-019", "t": 4, "s": "4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>meander<\/b> develops.", "a": ["Water flows faster on the <b>outside bend<\/b> (1)", "Fast flow <b>erodes<\/b> the outside, forming a river cliff (1)", "Slow flow <b>deposits<\/b> on the inside, forming a slip-off slope (1)"], "cp": ["Water flows faster on the outside bend", "Fast flow erodes the outside, forming a river cliff", "Slow flow deposits on the inside, forming a slip-off slope"], "dp": ["The inside of a bend is eroded fastest", "Meanders are straightened by erosion", "Rivers form meanders in uplands only"], "mand": 0}, {"id": "GEO-04-020", "t": 4, "s": "4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how an <b>ox-bow lake<\/b> forms.", "a": ["<b>Erosion<\/b> narrows the neck of a large meander (1)", "The river breaks through in a <b>flood<\/b> and takes the shorter route (1)", "<b>Deposition<\/b> seals off the old meander, leaving a lake (1)"], "cp": ["Erosion narrows the neck of a large meander", "The river breaks through in a flood and takes the shorter route", "Deposition seals off the old meander, leaving a lake"], "dp": ["A glacier digs out the lake", "Rain fills a hollow in a floodplain", "Ox-bow lakes form in upper courses"], "mand": 0}, {"id": "GEO-04-021", "t": 4, "s": "4.3", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>features of a river's upper course<\/b>.", "a": ["<b>V-shaped valley<\/b> (1)", "<b>Steep gradient<\/b> and fast, shallow flow with rapids (1)", "Mostly <b>vertical erosion<\/b> and large angular bedload (1)"], "cp": ["V-shaped valley", "Steep gradient and fast, shallow flow with rapids", "Mostly vertical erosion and large angular bedload"], "dp": ["Wide floodplain and meanders", "Delta and estuary", "Smooth, rounded bedload and slow flow"], "mand": 0}, {"id": "GEO-04-022", "t": 4, "s": "4.3", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>features of a river's lower course<\/b>.", "a": ["<b>Wide, flat floodplain<\/b> (1)", "<b>Levees<\/b> and meanders or an estuary (1)", "<b>Deposition<\/b> dominates, with small, rounded bedload (1)"], "cp": ["Wide, flat floodplain", "Levees and meanders or an estuary", "Deposition dominates, with small, rounded bedload"], "dp": ["Waterfalls and gorges", "V-shaped valley and steep slope", "Rapid flow over large boulders"], "mand": 0}, {"id": "GEO-04-023", "t": 4, "s": "4.3", "k": "Recall", "m": 4, "ht": false, "q": "Give <b>four factors<\/b> that increase flood risk.", "a": ["Any four (1 each):", "• <b>heavy or prolonged rainfall<\/b>", "• <b>impermeable<\/b> rock or <b>saturated<\/b> ground", "• <b>steep slopes<\/b> and small drainage basins", "• <b>urbanisation<\/b> (concrete, drains)", "• <b>deforestation<\/b>", "• snowmelt"], "cp": ["heavy or prolonged rainfall", "impermeable rock or saturated ground", "steep slopes and small drainage basins", "urbanisation (concrete, drains)", "deforestation", "snowmelt"], "dp": ["Permeable soils only", "Dry weather", "Dense forest on a flat slope"], "mand": 0}, {"id": "GEO-04-024", "t": 4, "s": "4.3", "k": "Data", "m": 3, "ht": false, "q": "Describe the <b>features of a flood hydrograph<\/b>: lag time, peak discharge, rising limb.", "a": ["<b>Peak discharge<\/b> is the highest flow (1)", "<b>Lag time<\/b> is the time between peak rainfall and peak discharge (1)", "<b>Rising limb<\/b> is the part where discharge increases rapidly (1)"], "cp": ["Peak discharge is the highest flow", "Lag time is the time between peak rainfall and peak discharge", "Rising limb is the part where discharge increases rapidly"], "dp": ["Lag time is the time rainfall lasts", "Peak discharge is the lowest flow", "The rising limb is the falling part"], "mand": 0}, {"id": "GEO-04-025", "t": 4, "s": "4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why a <b>short lag time<\/b> is common in urban areas.", "a": ["Hard surfaces are <b>impermeable<\/b> (1)", "Water runs quickly into <b>drains<\/b> (1)", "Less <b>infiltration<\/b> so more surface runoff reaches the river fast (1)"], "cp": ["Hard surfaces are impermeable", "Water runs quickly into drains", "Less infiltration so more surface runoff reaches the river fast"], "dp": ["Soil absorbs most rain", "There are more trees to slow water", "Urban areas are always on high ground"], "mand": 0}, {"id": "GEO-04-026", "t": 4, "s": "4.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three hard engineering<\/b> river management methods.", "a": ["Any three (1 each):", "• <b>dams and reservoirs<\/b>", "• <b>embankments<\/b>", "• <b>straightening<\/b> channels", "• <b>flood relief channels<\/b>", "• <b>dredging<\/b>"], "cp": ["dams and reservoirs", "embankments", "straightening channels", "flood relief channels", "dredging"], "dp": ["Flood warnings", "Planting trees", "Floodplain zoning"], "mand": 0}, {"id": "GEO-04-027", "t": 4, "s": "4.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three soft engineering<\/b> river management methods.", "a": ["Any three (1 each):", "• <b>flood warnings<\/b> and preparation", "• <b>floodplain zoning<\/b> (no building)", "• <b>afforestation<\/b> (planting trees)", "• <b>river restoration<\/b> (re-meandering)", "• <b>washlands<\/b>"], "cp": ["flood warnings and preparation", "floodplain zoning (no building)", "afforestation (planting trees)", "river restoration (re-meandering)", "washlands"], "dp": ["Dams", "Embankments", "Concrete channels"], "mand": 0}, {"id": "GEO-04-028", "t": 4, "s": "4.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>river straightening or embankments<\/b> as flood management.", "a": ["Advantage: can speed water out and protect nearby areas (1)", "Advantage: protects homes and farmland (1)", "Disadvantage: <b>expensive<\/b> and may increase flood risk downstream (1)", "Disadvantage: spoils <b>habitats<\/b> and appearance (1)"], "cp": ["Advantage: can speed water out and protect nearby areas", "Advantage: protects homes and farmland", "Disadvantage: expensive and may increase flood risk downstream", "Disadvantage: spoils habitats and appearance"], "dp": ["No downsides at all", "They reduce flood risk everywhere", "They are free to build"], "mand": 0}, {"id": "GEO-04-029", "t": 4, "s": "4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>soft engineering<\/b> such as river restoration can reduce flooding.", "a": ["Re-creating <b>meanders and wetlands<\/b> slows the flow (1)", "Water spreads onto the <b>floodplain<\/b> instead of downstream towns (1)", "It increases <b>lag time<\/b> and benefits wildlife (1)"], "cp": ["Re-creating meanders and wetlands slows the flow", "Water spreads onto the floodplain instead of downstream towns", "It increases lag time and benefits wildlife"], "dp": ["It speeds water down the channel", "It creates more concrete", "It reduces biodiversity"], "mand": 0}, {"id": "GEO-04-030", "t": 4, "s": "4.3", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'rivers erode in the lower course more than the upper course'<\/b>. Is this right?", "a": ["No: the upper course has <b>more vertical erosion<\/b> (1)", "The lower course is dominated by <b>deposition and lateral erosion<\/b> (1)"], "cp": ["No: the upper course has more vertical erosion", "The lower course is dominated by deposition and lateral erosion"], "dp": ["Yes, always", "Erosion does not happen in rivers", "Rivers do not have upper courses"], "mand": 0}, {"id": "GEO-04-031", "t": 4, "s": "4.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>geology<\/b> affects the shape of the UK coastline.", "a": ["<b>Hard rock<\/b> forms headlands and cliffs (1)", "<b>Soft rock<\/b> erodes quickly into bays and gentle slopes (1)", "Layers and <b>joints<\/b> affect where caves and arches form (1)"], "cp": ["Hard rock forms headlands and cliffs", "Soft rock erodes quickly into bays and gentle slopes", "Layers and joints affect where caves and arches form"], "dp": ["Geology does not affect coasts", "Wind alone shapes cliffs", "Soft rock forms headlands"], "mand": 0}, {"id": "GEO-04-032", "t": 4, "s": "4.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>erosional sequence<\/b> of a headland: <b>cave, arch, stack, stump<\/b>.", "a": ["Waves enlarge a crack into a <b>cave<\/b>, then break through to form an <b>arch<\/b> (1)", "The arch roof collapses, leaving a <b>stack<\/b> (1)", "The stack is eroded to a <b>stump<\/b> (1)"], "cp": ["Waves enlarge a crack into a cave, then break through to form an arch", "The arch roof collapses, leaving a stack", "The stack is eroded to a stump"], "dp": ["Stump, stack, arch, cave", "Spit, bar, tombolo, lagoon", "Delta, levee, meander, oxbow lake"], "mand": 0}, {"id": "GEO-04-033", "t": 4, "s": "4.3", "k": "Recall", "m": 3, "ht": false, "q": "Explain <b>concordant and discordant coasts<\/b>.", "a": ["<b>Concordant<\/b>: rock types run parallel to the coast, so a resistant layer protects soft rock, forming <b>coves<\/b> (1)", "<b>Discordant<\/b>: alternating hard and soft rock at right angles to the coast (1)", "This forms <b>headlands and bays<\/b> (1)"], "cp": ["Concordant: rock types run parallel to the coast, so a resistant layer protects soft rock, forming coves", "Discordant: alternating hard and soft rock at right angles to the coast", "This forms headlands and bays"], "dp": ["Concordant coasts have headlands and bays", "Discordant coasts have one rock type", "Both are formed only by deposition"], "mand": 0}, {"id": "GEO-04-034", "t": 4, "s": "4.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a <b>wave-cut platform<\/b> forms on a hard-rock coast.", "a": ["Waves undercut the cliff base to form a <b>wave-cut notch<\/b> (1)", "The cliff above becomes unstable and <b>collapses<\/b> (1)", "The cliff retreats, leaving a flat <b>wave-cut platform<\/b> (1)"], "cp": ["Waves undercut the cliff base to form a wave-cut notch", "The cliff above becomes unstable and collapses", "The cliff retreats, leaving a flat wave-cut platform"], "dp": ["Waves deposit sand and build up the platform", "Rivers deposit sediment at the cliff base", "Longshore drift moves the cliff inland"], "mand": 0}, {"id": "GEO-04-035", "t": 4, "s": "4.3", "k": "Explain", "m": 2, "ht": false, "q": "What is <b>fetch<\/b> and why does the <b>west coast<\/b> of the UK have strong waves?", "a": ["<b>Fetch<\/b> is the distance of open water the wind blows over (1)", "The west coast faces the Atlantic, the <b>longest fetch<\/b>, with prevailing south-westerly winds (1)"], "cp": ["Fetch is the distance of open water the wind blows over", "The west coast faces the Atlantic, the longest fetch, with prevailing south-westerly winds"], "dp": ["Fetch is the height of a wave on the shore", "The west coast has the shortest fetch", "Fetch is how far the tide comes up"], "mand": 0}, {"id": "GEO-04-036", "t": 4, "s": "4.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three glacial landforms<\/b> and how <b>plucking<\/b> and <b>abrasion<\/b> work.", "a": ["<b>U-shaped valleys<\/b>, <b>hanging valleys<\/b> and <b>scree<\/b> slopes (1)", "<b>Plucking<\/b>: ice freezes to rock and pulls pieces away (1)", "<b>Abrasion<\/b>: rocks in the ice scrape the valley (1)"], "cp": ["U-shaped valleys, hanging valleys and scree slopes", "Plucking: ice freezes to rock and pulls pieces away", "Abrasion: rocks in the ice scrape the valley"], "dp": ["V-shaped valleys, spits and deltas", "Oxbow lakes, levees and meanders", "Waves and wind erode the landscape"], "mand": 0}, {"id": "GEO-04-037", "t": 4, "s": "4.2", "k": "Recall", "m": 3, "ht": false, "q": "Compare <b>upland and lowland<\/b> UK geology and human activity.", "a": ["<b>Upland<\/b>: resistant igneous and metamorphic rock, hill sheep farming, forestry and tourism (1)", "<b>Lowland<\/b>: sedimentary rock forming <b>escarpments<\/b>, dip slopes and clay vales (1)", "Lowland: arable farming and a longer growing season (1)"], "cp": ["Upland: resistant igneous and metamorphic rock, hill sheep farming, forestry and tourism", "Lowland: sedimentary rock forming escarpments, dip slopes and clay vales", "Lowland: arable farming and a longer growing season"], "dp": ["Upland areas are low flat plains with arable farming", "Lowland areas have granite and little farming", "Both have the same rock types"], "mand": 0}, {"id": "GEO-04-038", "t": 4, "s": "4.6", "k": "Recall", "m": 4, "ht": false, "q": "Describe the <b>upper, middle and lower courses<\/b> of a river.", "a": ["<b>Upper<\/b>: steep, vertical erosion, V-shaped valleys, waterfalls (1)", "<b>Middle<\/b>: lateral erosion, <b>meanders<\/b>, more tributaries (1)", "<b>Lower<\/b>: wide and deep, fastest velocity, <b>floodplains<\/b>, levees, deltas (1)", "<b>Oxbow lakes<\/b> form when a meander neck is cut through (1)"], "cp": ["Upper: steep, vertical erosion, V-shaped valleys, waterfalls", "Middle: lateral erosion, meanders, more tributaries", "Lower: wide and deep, fastest velocity, floodplains, levees, deltas", "Oxbow lakes form when a meander neck is cut through"], "dp": ["Upper: wide with meanders and deposition", "Lower: steep V-shaped valleys with waterfalls", "All three courses look the same"], "mand": 0}, {"id": "GEO-04-039", "t": 4, "s": "4.5", "k": "Explain", "m": 4, "ht": false, "q": "Compare <b>hard<\/b> and <b>soft engineering<\/b> for coasts, with <b>two<\/b> examples of each.", "a": ["<b>Hard<\/b>: <b>sea walls<\/b> and <b>groynes<\/b>, long-lasting but expensive (1)", "Sea walls cost about £6 000/m and groynes about £1 000/m (1)", "<b>Soft<\/b>: <b>beach replenishment<\/b> and slope stabilisation (1)", "Soft methods are cheaper but need repeating (1)"], "cp": ["Hard: sea walls and groynes, long-lasting but expensive", "Sea walls cost about £6 000/m and groynes about £1 000/m", "Soft: beach replenishment and slope stabilisation", "Soft methods are cheaper but need repeating"], "dp": ["Soft engineering includes sea walls", "Hard engineering includes beach replenishment", "Both are free and permanent"], "mand": 0}, {"id": "GEO-04-040", "t": 4, "s": "4.4", "k": "Case study", "m": 3, "ht": false, "q": "Case study (Pearson example): the <b>Dorset coast<\/b>. Give <b>three<\/b> facts.", "a": ["Only about <b>25%<\/b> is developed (1)", "<b>Groynes and a sea wall<\/b> protect Swanage (1)", "<b>Dredging<\/b> and landslides at Durlston Bay show human and natural effects (1)"], "cp": ["Only about 25% is developed", "Groynes and a sea wall protect Swanage", "Dredging and landslides at Durlston Bay show human and natural effects"], "dp": ["The whole coast is heavily developed", "There is no coastal protection", "It is a delta coast in Scotland"], "mand": 0}, {"id": "GEO-04-041", "t": 4, "s": "4.7", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>River Severn floods, July 2007<\/b>. Give <b>four<\/b> facts.", "a": ["Physical: <b>heavy rain<\/b> and saturated soils (1)", "Human: <b>urbanisation<\/b> and lack of defences (1)", "Tewkesbury Abbey flooded and <b>48 000 homes<\/b> flooded (1)", "<b>3 deaths<\/b> and about <b>£3.2 billion<\/b> cost (1)"], "cp": ["Physical: heavy rain and saturated soils", "Human: urbanisation and lack of defences", "Tewkesbury Abbey flooded and 48 000 homes flooded", "3 deaths and about £3.2 billion cost"], "dp": ["There were over 1 000 deaths", "It happened in winter 2020 only", "Only farmland was affected"], "mand": 0}, {"id": "GEO-04-042", "t": 4, "s": "4.8", "k": "Evaluate", "m": 4, "ht": false, "q": "Compare <b>flood walls, embankments, floodplain retention<\/b> and <b>river restoration<\/b>.", "a": ["<b>Flood walls<\/b>: expensive, may push flooding downstream (1)", "<b>Embankments<\/b>: cheap but can be overtopped or burst (1)", "<b>Floodplain retention<\/b>: cheap natural storage (1)", "<b>River restoration<\/b>: restores meanders and habitats but may affect farming (1)"], "cp": ["Flood walls: expensive, may push flooding downstream", "Embankments: cheap but can be overtopped or burst", "Floodplain retention: cheap natural storage", "River restoration: restores meanders and habitats but may affect farming"], "dp": ["Flood walls are cheap and natural", "River restoration builds higher walls", "Embankments cannot be breached"], "mand": 0}, {"id": "GEO-04-043", "t": 4, "s": "4.6", "k": "Recall", "m": 3, "ht": false, "q": "What affects the shape of a <b>flood hydrograph<\/b>? Define <b>lag time<\/b>.", "a": ["<b>Lag time<\/b>: the time between peak rainfall and peak discharge (1)", "<b>Flashy<\/b> (short lag): impermeable rock, urban areas, steep slopes (1)", "<b>Gentle<\/b> (long lag): permeable rock, woodland, rural areas (1)"], "cp": ["Lag time: the time between peak rainfall and peak discharge", "Flashy (short lag): impermeable rock, urban areas, steep slopes", "Gentle (long lag): permeable rock, woodland, rural areas"], "dp": ["Lag time is the time rainfall lasts", "Urban areas have long lag times", "Hydrographs show the river's depth only"], "mand": 0}, {"id": "GEO-05-001", "t": 5, "s": "5.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>pattern of population distribution<\/b> in the UK.", "a": ["Highest densities in <b>cities and the South East<\/b> (1)", "Lowest densities in <b>upland rural areas<\/b>, such as the Scottish Highlands (1)", "Population clusters around <b>major cities and transport routes<\/b> (1)"], "cp": ["Highest densities in cities and the South East", "Lowest densities in upland rural areas, such as the Scottish Highlands", "Population clusters around major cities and transport routes"], "dp": ["Population is even across the UK", "The Highlands are the most densely populated", "Most people live on mountains"], "mand": 0}, {"id": "GEO-05-002", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>some areas of the UK are densely populated<\/b>.", "a": ["Many <b>jobs and services<\/b> (1)", "Good <b>transport links<\/b> and flat, easy-to-build land (1)", "Historical industries or ports drew people in (1)"], "cp": ["Many jobs and services", "Good transport links and flat, easy-to-build land", "Historical industries or ports drew people in"], "dp": ["Poor roads and few jobs", "Steep land that is difficult to build on", "Harsh weather"], "mand": 0}, {"id": "GEO-05-003", "t": 5, "s": "5.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>north-south divide<\/b> in the UK?", "a": ["Differences in <b>wealth, jobs and living standards<\/b> between the north and south (1)", "The South East generally has <b>higher incomes and house prices<\/b> (1)"], "cp": ["Differences in wealth, jobs and living standards between the north and south", "The South East generally has higher incomes and house prices"], "dp": ["A river that divides England", "A road between London and Edinburgh", "A line that splits the UK into equal halves"], "mand": 0}, {"id": "GEO-05-004", "t": 5, "s": "5.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>how the UK population is changing<\/b>.", "a": ["An <b>ageing population<\/b> (more over 65s) (1)", "Increasing <b>ethnic diversity<\/b> through migration (1)", "<b>Rural areas<\/b> losing young people while some cities attract them (1)"], "cp": ["An ageing population (more over 65s)", "Increasing ethnic diversity through migration", "Rural areas losing young people while some cities attract them"], "dp": ["The UK has no migration", "Everyone in the UK is under 30", "The proportion of older people is falling"], "mand": 0}, {"id": "GEO-05-005", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>two causes<\/b> of an ageing population in the UK.", "a": ["People are <b>living longer<\/b> due to better healthcare, diet and living conditions (1)", "The <b>birth rate has fallen<\/b> (1)", "<b>Baby boomers<\/b> are now reaching older age (1)"], "cp": ["People are living longer due to better healthcare, diet and living conditions", "The birth rate has fallen", "Baby boomers are now reaching older age"], "dp": ["Death rate has risen sharply", "Older people are leaving the UK", "There are more babies than ever"], "mand": 0}, {"id": "GEO-05-006", "t": 5, "s": "5.1", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two impacts<\/b> of an ageing population.", "a": ["Any two (1 each):", "• greater demand for <b>healthcare and care homes<\/b>", "• higher <b>pension costs<\/b>", "• a smaller <b>working population<\/b> paying taxes", "• growth in <b>services for older people<\/b>"], "cp": ["greater demand for healthcare and care homes", "higher pension costs", "a smaller working population paying taxes", "growth in services for older people"], "dp": ["More schools needed", "Fewer pensions needed", "Lower demand for hospitals"], "mand": 0}, {"id": "GEO-05-007", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>deindustrialisation<\/b> changed the UK economy.", "a": ["Manufacturing and heavy industries such as <b>coal, steel and shipbuilding declined<\/b> (1)", "Competition from <b>cheaper overseas<\/b> producers and automation reduced jobs (1)", "The economy shifted to <b>tertiary and quaternary<\/b> services (1)"], "cp": ["Manufacturing and heavy industries such as coal, steel and shipbuilding declined", "Competition from cheaper overseas producers and automation reduced jobs", "The economy shifted to tertiary and quaternary services"], "dp": ["The UK built more factories in the 1980s", "Agriculture grew rapidly", "Everyone moved into primary jobs"], "mand": 0}, {"id": "GEO-05-008", "t": 5, "s": "5.1", "k": "Definition", "m": 2, "ht": false, "q": "What are the <b>primary, secondary, tertiary and quaternary sectors<\/b>?", "a": ["Primary: raw materials. Secondary: manufacturing (1)", "Tertiary: services. Quaternary: research and high-tech knowledge industries (1)"], "cp": ["Primary: raw materials. Secondary: manufacturing", "Tertiary: services. Quaternary: research and high-tech knowledge industries"], "dp": ["Primary: services. Tertiary: farming", "Secondary: mining. Quaternary: agriculture", "Primary: manufacturing. Tertiary: farming"], "mand": 0}, {"id": "GEO-05-009", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>globalisation<\/b> has changed UK places.", "a": ["<b>Foreign investment<\/b> and TNCs locate in UK (1)", "Some industries <b>moved overseas<\/b>, closing factories (1)", "Increased <b>migration<\/b> and cultural diversity (1)"], "cp": ["Foreign investment and TNCs locate in UK", "Some industries moved overseas, closing factories", "Increased migration and cultural diversity"], "dp": ["It has stopped all trade", "It means no companies from abroad work in the UK", "It has made the UK isolated"], "mand": 0}, {"id": "GEO-05-010", "t": 5, "s": "5.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what causes <b>regional differences<\/b> in the UK economy.", "a": ["<b>Decline of heavy industry<\/b> hit northern and Welsh areas (1)", "The South East has <b>services, finance and London<\/b> (1)", "Differences in <b>investment, skills and transport links<\/b> (1)"], "cp": ["Decline of heavy industry hit northern and Welsh areas", "The South East has services, finance and London", "Differences in investment, skills and transport links"], "dp": ["All regions have equal investment", "Weather alone explains it", "Only farmland causes differences"], "mand": 0}, {"id": "GEO-05-011", "t": 5, "s": "5.2", "k": "Recall", "m": 3, "ht": false, "q": "For your <b>major UK city case study<\/b>, what three things should you know?", "a": ["Its <b>location and function<\/b> (e.g. regional or national role) (1)", "How it has <b>changed<\/b>: causes of growth, migration and economic change (1)", "Its <b>challenges and opportunities<\/b>, and how they are managed (1)"], "cp": ["Its location and function (e.g. regional or national role)", "How it has changed: causes of growth, migration and economic change", "Its challenges and opportunities, and how they are managed"], "dp": ["Only its name", "Only the weather", "Only its football club"], "mand": 0}, {"id": "GEO-05-012", "t": 5, "s": "5.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three impacts of migration<\/b> on a UK city.", "a": ["Any three (1 each):", "• <b>cultural diversity<\/b> and new food, shops and festivals", "• <b>filling job vacancies<\/b> and skills gaps", "• pressure on <b>housing and services<\/b>", "• <b>growing<\/b> population and demand"], "cp": ["cultural diversity and new food, shops and festivals", "filling job vacancies and skills gaps", "pressure on housing and services", "growing population and demand"], "dp": ["Fewer shops", "Lower cultural diversity", "Fewer jobs filled"], "mand": 0}, {"id": "GEO-05-013", "t": 5, "s": "5.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> urban areas can be regenerated.", "a": ["Any three (1 each):", "• <b>redeveloping brownfield sites<\/b>", "• new <b>housing, shops and offices<\/b>", "• <b>improving transport<\/b>", "• <b>investment in culture<\/b> and sport (rebranding)", "• improving <b>green space<\/b>"], "cp": ["redeveloping brownfield sites", "new housing, shops and offices", "improving transport", "investment in culture and sport (rebranding)", "improving green space"], "dp": ["Closing all businesses", "Demolishing every building", "Moving the city"], "mand": 0}, {"id": "GEO-05-014", "t": 5, "s": "5.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>regeneration<\/b>?", "a": ["<b>Investment to revive<\/b> a run-down area (1)", "Creating <b>jobs, housing and improved services<\/b> (1)"], "cp": ["Investment to revive a run-down area", "Creating jobs, housing and improved services"], "dp": ["Removing all people from an area", "Building only motorways", "Moving a city to a new site"], "mand": 0}, {"id": "GEO-05-015", "t": 5, "s": "5.2", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>regeneration<\/b> as a way of improving a UK city.", "a": ["Advantage: creates <b>jobs and homes<\/b> (1)", "Advantage: attracts <b>investment and visitors<\/b> (1)", "Disadvantage: <b>rents and prices rise<\/b>, pushing out locals (1)", "Disadvantage: <b>cost<\/b> and disruption, and not all benefit equally (1)"], "cp": ["Advantage: creates jobs and homes", "Advantage: attracts investment and visitors", "Disadvantage: rents and prices rise, pushing out locals", "Disadvantage: cost and disruption, and not all benefit equally"], "dp": ["It never has problems", "It only helps rich areas", "It always costs nothing"], "mand": 0}, {"id": "GEO-05-016", "t": 5, "s": "5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a city can improve <b>sustainability<\/b>.", "a": ["Promote <b>public transport<\/b>, walking and cycling (1)", "Use <b>renewable energy<\/b> and recycling (1)", "Protect <b>green space<\/b> and build energy-efficient homes (1)"], "cp": ["Promote public transport, walking and cycling", "Use renewable energy and recycling", "Protect green space and build energy-efficient homes"], "dp": ["Increase car use", "Remove all parks", "Burn all waste"], "mand": 0}, {"id": "GEO-05-017", "t": 5, "s": "5.3", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>rural population change<\/b> in the UK.", "a": ["Some rural areas gain people through <b>counter-urbanisation<\/b> and commuting (1)", "Remote rural areas lose <b>young people<\/b> (1)", "Rural populations are <b>older<\/b> on average (1)"], "cp": ["Some rural areas gain people through counter-urbanisation and commuting", "Remote rural areas lose young people", "Rural populations are older on average"], "dp": ["All rural areas are growing quickly", "Young people are moving in everywhere", "Rural areas have no commuters"], "mand": 0}, {"id": "GEO-05-018", "t": 5, "s": "5.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>two causes<\/b> of change in rural UK areas.", "a": ["<b>Counter-urbanisation<\/b> and commuters moving in (1)", "<b>Second homes<\/b> and tourism (1)", "Farming <b>mechanisation<\/b> reduces jobs (1)"], "cp": ["Counter-urbanisation and commuters moving in", "Second homes and tourism", "Farming mechanisation reduces jobs"], "dp": ["Rural areas get more factories", "Everyone is moving to farms", "Farming needs more labour"], "mand": 0}, {"id": "GEO-05-019", "t": 5, "s": "5.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three effects<\/b> of second homes in rural areas.", "a": ["Any three (1 each):", "• <b>house prices rise<\/b> beyond locals' means", "• villages empty out outside holiday time", "• <b>shops and schools<\/b> can close", "• benefits for the <b>tourism<\/b> economy", "• less <b>demand for local services<\/b>"], "cp": ["house prices rise beyond locals' means", "villages empty out outside holiday time", "shops and schools can close", "benefits for the tourism economy", "less demand for local services"], "dp": ["More school places", "Cheaper local housing", "More year-round residents"], "mand": 0}, {"id": "GEO-05-020", "t": 5, "s": "5.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>rural-urban fringe<\/b> areas can be affected by development.", "a": ["Pressure for <b>new housing and retail parks<\/b> on green land (1)", "Loss of <b>farmland and habitats<\/b> (1)", "Conflict between <b>developers and green belt<\/b> campaigners (1)"], "cp": ["Pressure for new housing and retail parks on green land", "Loss of farmland and habitats", "Conflict between developers and green belt campaigners"], "dp": ["No development is ever allowed", "The fringe is entirely sealed with trees", "There are no houses on the fringe"], "mand": 0}, {"id": "GEO-05-021", "t": 5, "s": "5.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> UK retailing has changed.", "a": ["Any three (1 each):", "• <b>online shopping<\/b> growth", "• <b>out-of-town<\/b> retail parks and shopping centres", "• <b>high street decline<\/b>", "• growth of <b>supermarkets<\/b> and click-and-collect", "• <b>pedestrianised<\/b> centres"], "cp": ["online shopping growth", "out-of-town retail parks and shopping centres", "high street decline", "growth of supermarkets and click-and-collect", "pedestrianised centres"], "dp": ["More corner shops", "Less online shopping", "No change since 1950"], "mand": 0}, {"id": "GEO-05-022", "t": 5, "s": "5.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why many <b>high streets are in decline<\/b>.", "a": ["Customers shop <b>online<\/b> (1)", "<b>Out-of-town<\/b> centres offer parking and large stores (1)", "<b>High rents and rates<\/b> force shops to close (1)"], "cp": ["Customers shop online", "Out-of-town centres offer parking and large stores", "High rents and rates force shops to close"], "dp": ["Online shopping has stopped", "Rents are very low", "Out-of-town shops have all closed"], "mand": 0}, {"id": "GEO-05-023", "t": 5, "s": "5.1", "k": "Calculation", "m": 2, "ht": false, "q": "A city has 80,000 people in 12 km<sup>2<\/sup>. Calculate its <b>population density<\/b>.", "a": ["Density = population ÷ area (1)", "80,000 ÷ 12 = about <b>6,667 people per km<sup>2<\/sup><\/b> (1)"], "cp": ["Density = population ÷ area", "80,000 ÷ 12 = about 6,667 people per km<sup>2<\/sup>"], "dp": ["960,000 per km<sup>2<\/sup>", "666 per km<sup>2<\/sup>", "12,000 per km<sup>2<\/sup>"], "mand": 0}, {"id": "GEO-05-024", "t": 5, "s": "5.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says <b>'the UK's population is falling because it is ageing'<\/b>. What is wrong?", "a": ["UK population is <b>mostly still increasing<\/b>, mainly through <b>migration<\/b> and natural increase (1)", "Ageing means a <b>higher proportion of older people<\/b>, not necessarily a falling total (1)"], "cp": ["UK population is mostly still increasing, mainly through migration and natural increase", "Ageing means a higher proportion of older people, not necessarily a falling total"], "dp": ["Ageing always reduces population", "Migration reduces the population", "The UK has no older people"], "mand": 0}, {"id": "GEO-05-025", "t": 5, "s": "5.1", "k": "Compare", "m": 3, "ht": false, "q": "Compare the <b>urban core<\/b> and the <b>rural periphery<\/b> of the UK.", "a": ["<b>Urban core<\/b>: high density, young adults, retail and offices (1)", "<b>Rural periphery<\/b>: low density, ageing population, primary industry and seasonal tourism (1)", "Policies include <b>enterprise zones<\/b>, HS2 and regional development funds (1)"], "cp": ["Urban core: high density, young adults, retail and offices", "Rural periphery: low density, ageing population, primary industry and seasonal tourism", "Policies include enterprise zones, HS2 and regional development funds"], "dp": ["Rural periphery has the highest density", "Urban core has mostly farming", "They are the same except for names"], "mand": 0}, {"id": "GEO-05-026", "t": 5, "s": "5.2", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>North East and South East England<\/b>. Give <b>four<\/b> contrasts.", "a": ["North East: coal, shipbuilding and steel declined; <b>deindustrialisation<\/b> (1)", "North East: <b>8% unemployment<\/b> (2013) and Nissan arrived in 1986 (1)", "South East: <b>quaternary sector<\/b> on the M4 corridor (1)", "South East: lower unemployment (about <b>6%<\/b>) and strong accessibility (1)"], "cp": ["North East: coal, shipbuilding and steel declined; deindustrialisation", "North East: 8% unemployment (2013) and Nissan arrived in 1986", "South East: quaternary sector on the M4 corridor", "South East: lower unemployment (about 6%) and strong accessibility"], "dp": ["South East has high unemployment and heavy industry", "North East has quaternary industry", "Both regions have identical economies"], "mand": 0}, {"id": "GEO-05-027", "t": 5, "s": "5.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>deindustrialisation<\/b> and the <b>spiral of decline<\/b>.", "a": ["<b>Deindustrialisation<\/b>: decline of manufacturing due to the <b>global shift<\/b> to cheaper countries (1)", "Jobs and incomes fall, so <b>services close<\/b> (1)", "People leave and the area declines further: a <b>spiral of decline<\/b> (1)"], "cp": ["Deindustrialisation: decline of manufacturing due to the global shift to cheaper countries", "Jobs and incomes fall, so services close", "People leave and the area declines further: a spiral of decline"], "dp": ["Growth of factories and rising employment", "Deindustrialisation means more manufacturing jobs", "A spiral of decline increases investment"], "mand": 0}, {"id": "GEO-05-028", "t": 5, "s": "5.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three<\/b> UK migration examples and their impacts.", "a": ["<b>Retirement migration<\/b> to Devon, Dorset and Cornwall (1)", "<b>EU accession 2004<\/b> migration from Poland and Latvia (1)", "Impacts: pressure on services, skills shortages and <b>cultural diversity<\/b> (1)"], "cp": ["Retirement migration to Devon, Dorset and Cornwall", "EU accession 2004 migration from Poland and Latvia", "Impacts: pressure on services, skills shortages and cultural diversity"], "dp": ["Migration has never affected the UK", "Only students migrated to the UK", "Migration reduced cultural diversity"], "mand": 0}, {"id": "GEO-05-029", "t": 5, "s": "5.3", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>Birmingham<\/b>. Give <b>four<\/b> facts about its changes.", "a": ["<b>Industrial Revolution<\/b>: the 'city of 1001 trades' (1)", "<b>Deindustrialisation<\/b> left dereliction in Digbeth (1)", "<b>Regeneration<\/b>: Bullring and Brindley Place (1)", "<b>Gentrification<\/b> in the Jewellery Quarter; <b>studentification<\/b> in Aston (1)"], "cp": ["Industrial Revolution: the 'city of 1001 trades'", "Deindustrialisation left dereliction in Digbeth", "Regeneration: Bullring and Brindley Place", "Gentrification in the Jewellery Quarter; studentification in Aston"], "dp": ["Birmingham has never had industry", "Birmingham is a tiny village", "There has been no regeneration"], "mand": 0}, {"id": "GEO-05-030", "t": 5, "s": "5.6", "k": "Explain", "m": 3, "ht": false, "q": "Case study (Pearson example): how is <b>Birmingham<\/b> improving <b>quality of life<\/b>?", "a": ["<b>Tram<\/b> and cycle routes to cut congestion (1)", "<b>Recycling<\/b> and Big City Plan parks (1)", "<b>Summerfield Eco Village<\/b> with insulation and solar panels (1)"], "cp": ["Tram and cycle routes to cut congestion", "Recycling and Big City Plan parks", "Summerfield Eco Village with insulation and solar panels"], "dp": ["By closing all parks", "By removing public transport", "By banning recycling"], "mand": 0}, {"id": "GEO-05-031", "t": 5, "s": "5.8", "k": "Explain", "m": 3, "ht": false, "q": "Explain how rural areas can use <b>diversification<\/b> to deal with decline.", "a": ["Farms add <b>farm shops<\/b>, farm stays and horse riding (1)", "<b>Tourism<\/b> creates jobs (Eden Project, Brontë Country) (1)", "But tourism can cause <b>erosion, noise and light pollution<\/b> (1)"], "cp": ["Farms add farm shops, farm stays and horse riding", "Tourism creates jobs (Eden Project, Brontë Country)", "But tourism can cause erosion, noise and light pollution"], "dp": ["Diversification means only growing one crop", "Diversification closes services", "Tourism has no negative effects"], "mand": 0}, {"id": "GEO-06-001", "t": 6, "s": "6.1", "k": "Process", "m": 4, "ht": false, "q": "Put the <b>stages of a geographical enquiry<\/b> in order.", "a": ["Question or hypothesis (1)", "Collect data (primary and secondary) (1)", "Present and analyse results (1)", "Conclude and evaluate (1)"], "cp": ["Question or hypothesis", "Collect data (primary and secondary)", "Present and analyse results", "Conclude and evaluate"], "dp": ["Conclusion, then collect data, then question, then present", "Present results, ask a question, then collect data, then conclude", "Evaluate, conclude, collect data, present"], "mand": 0}, {"id": "GEO-06-002", "t": 6, "s": "6.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>hypothesis<\/b> in fieldwork?", "a": ["A <b>testable statement<\/b> or prediction (1)", "e.g. 'Pebble size decreases downstream' (1)"], "cp": ["A testable statement or prediction", "e.g. 'Pebble size decreases downstream'"], "dp": ["A question with no answer", "A list of equipment", "A summary of results"], "mand": 0}, {"id": "GEO-06-003", "t": 6, "s": "6.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the difference between <b>primary and secondary data<\/b>?", "a": ["<b>Primary<\/b>: data you collect yourself in the field (1)", "<b>Secondary<\/b>: data collected by someone else, such as the census or maps (1)"], "cp": ["Primary: data you collect yourself in the field", "Secondary: data collected by someone else, such as the census or maps"], "dp": ["Primary data is from the internet", "Secondary data is collected by you", "They mean the same thing"], "mand": 0}, {"id": "GEO-06-004", "t": 6, "s": "6.1", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three sampling methods<\/b>.", "a": ["<b>Random<\/b> sampling (1)", "<b>Systematic<\/b> sampling (every nth sample) (1)", "<b>Stratified<\/b> sampling (proportional to groups) (1)"], "cp": ["Random sampling", "Systematic sampling (every nth sample)", "Stratified sampling (proportional to groups)"], "dp": ["Hopeful, careless and fast", "Quick, slow and equal", "Biased, loose and tidy"], "mand": 0}, {"id": "GEO-06-005", "t": 6, "s": "6.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>sampling<\/b> is used in fieldwork.", "a": ["It is not possible to measure <b>everything<\/b> (1)", "Sampling saves <b>time<\/b> and effort (1)", "A good sample can still be <b>representative<\/b> of the whole area (1)"], "cp": ["It is not possible to measure everything", "Sampling saves time and effort", "A good sample can still be representative of the whole area"], "dp": ["It removes the need for data", "It makes the results less accurate by design", "It is only needed for primary data"], "mand": 0}, {"id": "GEO-06-006", "t": 6, "s": "6.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to manage <b>risk<\/b> on fieldwork.", "a": ["Any three (1 each):", "• complete a <b>risk assessment<\/b>", "• check <b>weather and tides<\/b>", "• wear suitable <b>clothing<\/b> and footwear", "• work in <b>groups<\/b> and stay with a leader", "• carry a <b>first aid kit<\/b> and phone"], "cp": ["complete a risk assessment", "check weather and tides", "wear suitable clothing and footwear", "work in groups and stay with a leader", "carry a first aid kit and phone"], "dp": ["Go alone and in the dark", "Ignore tide times", "Wear flip-flops in a river"], "mand": 0}, {"id": "GEO-06-007", "t": 6, "s": "6.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain what is meant by <b>reliability, accuracy and validity<\/b> in a fieldwork evaluation.", "a": ["<b>Reliability<\/b>: whether the results would be the same if repeated (1)", "<b>Accuracy<\/b>: how close measurements are to the true value (1)", "<b>Validity<\/b>: whether the data really answers the enquiry question (1)"], "cp": ["Reliability: whether the results would be the same if repeated", "Accuracy: how close measurements are to the true value", "Validity: whether the data really answers the enquiry question"], "dp": ["Reliability means the data is expensive", "Validity means the data is long", "Accuracy means the data was easy to collect"], "mand": 0}, {"id": "GEO-06-008", "t": 6, "s": "6.1", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>two ways<\/b> you could improve a fieldwork investigation.", "a": ["Take <b>more samples<\/b> or repeat measurements (1)", "Use <b>more sites<\/b> or a wider area (1)", "Collect data at <b>different times<\/b> or use more accurate equipment (1)"], "cp": ["Take more samples or repeat measurements", "Use more sites or a wider area", "Collect data at different times or use more accurate equipment"], "dp": ["Use fewer sites", "Take only one measurement", "Ignore anomalies"], "mand": 0}, {"id": "GEO-06-009", "t": 6, "s": "6.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three measurements<\/b> taken in a river fieldwork enquiry.", "a": ["Any three (1 each):", "• <b>channel width<\/b>", "• <b>depth<\/b>", "• <b>velocity<\/b> (e.g. using a float or flow meter)", "• <b>bedload size and shape<\/b>", "• <b>gradient<\/b>", "• <b>wetted perimeter<\/b>"], "cp": ["channel width", "depth", "velocity (e.g. using a float or flow meter)", "bedload size and shape", "gradient", "wetted perimeter"], "dp": ["Population density", "Pedestrian counts", "Beach slope in an urban area"], "mand": 0}, {"id": "GEO-06-010", "t": 6, "s": "6.2", "k": "Process", "m": 3, "ht": false, "q": "Describe how you would measure <b>river velocity<\/b> with a float.", "a": ["Mark a <b>measured distance<\/b> along the river (1)", "Time a float travelling that distance (1)", "Velocity = <b>distance ÷ time<\/b>, repeating to calculate a mean (1)"], "cp": ["Mark a measured distance along the river", "Time a float travelling that distance", "Velocity = distance ÷ time, repeating to calculate a mean"], "dp": ["Measure the colour of the water", "Count the number of boulders", "Weigh the float"], "mand": 0}, {"id": "GEO-06-011", "t": 6, "s": "6.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>discharge<\/b> is calculated.", "a": ["Discharge = <b>cross-sectional area × velocity<\/b> (1)", "Area = <b>width × average depth<\/b> (1)", "Units are <b>cumecs<\/b> (m<sup>3<\/sup>/s) (1)"], "cp": ["Discharge = cross-sectional area × velocity", "Area = width × average depth", "Units are cumecs (m<sup>3<\/sup>/s)"], "dp": ["Discharge = depth ÷ width", "Discharge = velocity ÷ area", "Discharge is measured in kilograms"], "mand": 0}, {"id": "GEO-06-012", "t": 6, "s": "6.2", "k": "Data", "m": 2, "ht": false, "q": "A river's <b>bedload becomes smaller and rounder downstream<\/b>. Explain why.", "a": ["<b>Attrition<\/b> wears particles down as they move (1)", "Rocks are smoothed and <b>rounded<\/b> by collisions (1)"], "cp": ["Attrition wears particles down as they move", "Rocks are smoothed and rounded by collisions"], "dp": ["Deposition makes stones larger", "Wind makes stones smaller", "Hydraulic action makes stones angular"], "mand": 0}, {"id": "GEO-06-013", "t": 6, "s": "6.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three measurements<\/b> taken in a coastal fieldwork enquiry.", "a": ["Any three (1 each):", "• <b>beach profile<\/b> (slope angle)", "• <b>pebble size and shape<\/b>", "• <b>longshore drift<\/b> speed and direction", "• <b>cliff condition<\/b> or erosion rate", "• <b>sea defence<\/b> survey"], "cp": ["beach profile (slope angle)", "pebble size and shape", "longshore drift speed and direction", "cliff condition or erosion rate", "sea defence survey"], "dp": ["Pedestrian counts", "River velocity", "Traffic count"], "mand": 0}, {"id": "GEO-06-014", "t": 6, "s": "6.3", "k": "Process", "m": 3, "ht": false, "q": "Describe how to complete a <b>beach profile<\/b>.", "a": ["Use <b>ranging poles and a clinometer<\/b> to measure slope (1)", "Measure <b>distance between breaks of slope<\/b> with a tape (1)", "Record angle and distance, then <b>plot the profile<\/b> (1)"], "cp": ["Use ranging poles and a clinometer to measure slope", "Measure distance between breaks of slope with a tape", "Record angle and distance, then plot the profile"], "dp": ["Count shells on the beach", "Measure wind speed only", "Photograph the sea at night"], "mand": 0}, {"id": "GEO-06-015", "t": 6, "s": "6.3", "k": "Data", "m": 2, "ht": false, "q": "Why might <b>pebble size<\/b> change along a beach?", "a": ["Larger stones are deposited where energy is <b>high<\/b> and <b>attrition<\/b> reduces size over distance (1)", "Longshore drift sorts material along the beach, so size and roundness <b>vary along it<\/b> (1)"], "cp": ["Larger stones are deposited where energy is high and attrition reduces size over distance", "Longshore drift sorts material along the beach, so size and roundness vary along it"], "dp": ["Pebbles are carried by wind", "Pebbles get larger with distance", "Pebbles are always the same size"], "mand": 0}, {"id": "GEO-06-016", "t": 6, "s": "6.4", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three methods<\/b> of collecting data in an urban enquiry.", "a": ["Any three (1 each):", "• <b>environmental quality survey<\/b>", "• <b>pedestrian counts<\/b>", "• <b>questionnaires<\/b>", "• <b>land use mapping<\/b>", "• <b>building condition survey<\/b>"], "cp": ["environmental quality survey", "pedestrian counts", "questionnaires", "land use mapping", "building condition survey"], "dp": ["Measuring river discharge", "Beach profile", "Pebble roundness"], "mand": 0}, {"id": "GEO-06-017", "t": 6, "s": "6.4", "k": "Process", "m": 3, "ht": false, "q": "Describe how to complete an <b>environmental quality survey<\/b>.", "a": ["Choose sites using a <b>sampling method<\/b> (1)", "Score features, such as litter or noise, on a <b>scale<\/b> (1)", "Total or average the scores and <b>map them<\/b> (1)"], "cp": ["Choose sites using a sampling method", "Score features, such as litter or noise, on a scale", "Total or average the scores and map them"], "dp": ["Tick a box if you like the place", "Write a poem", "Take only one photograph"], "mand": 0}, {"id": "GEO-06-018", "t": 6, "s": "6.4", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>one advantage<\/b> and <b>one disadvantage<\/b> of questionnaires.", "a": ["Advantage: collect people's <b>opinions and experiences<\/b> (1)", "Disadvantage: <b>bias<\/b> in who responds or in the questions (1)", "Disadvantage: time-consuming and <b>small samples<\/b> (1)"], "cp": ["Advantage: collect people's opinions and experiences", "Disadvantage: bias in who responds or in the questions", "Disadvantage: time-consuming and small samples"], "dp": ["They are perfectly accurate", "They never take time", "They avoid opinions"], "mand": 0}, {"id": "GEO-06-019", "t": 6, "s": "6.4", "k": "Recall", "m": 2, "ht": false, "q": "What are the <b>CBD, inner city and suburbs<\/b> likely to show in terms of land value or quality?", "a": ["<b>CBD<\/b>: highest land values and tall buildings (1)", "<b>Suburbs<\/b>: lower density, more green space and often higher environmental quality (1)"], "cp": ["CBD: highest land values and tall buildings", "Suburbs: lower density, more green space and often higher environmental quality"], "dp": ["CBD has the cheapest land", "Suburbs have the tallest buildings", "The inner city has no buildings"], "mand": 0}, {"id": "GEO-06-020", "t": 6, "s": "6.5", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> of presenting fieldwork data and when to use each.", "a": ["<b>Bar chart<\/b> to compare categories (1)", "<b>Line graph<\/b> to show change over time or distance (1)", "<b>Scatter graph<\/b> to show relationships between two variables (1)"], "cp": ["Bar chart to compare categories", "Line graph to show change over time or distance", "Scatter graph to show relationships between two variables"], "dp": ["Pie chart for time series", "Line graph for categories", "Tables for relationships only"], "mand": 0}, {"id": "GEO-06-021", "t": 6, "s": "6.5", "k": "Explain", "m": 3, "ht": false, "q": "Explain what a <b>scatter graph<\/b> with a line of best fit shows.", "a": ["The <b>relationship<\/b> between two variables (1)", "The <b>direction<\/b> of correlation: positive or negative (1)", "<b>Anomalies<\/b> that sit far from the line (1)"], "cp": ["The relationship between two variables", "The direction of correlation: positive or negative", "Anomalies that sit far from the line"], "dp": ["The average of all data", "The location of data", "The mode of the data"], "mand": 0}, {"id": "GEO-06-022", "t": 6, "s": "6.5", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three descriptive statistics<\/b> used in geography.", "a": ["<b>Mean<\/b> (1)", "<b>Median<\/b> or <b>mode<\/b> (1)", "<b>Range<\/b> or <b>interquartile range<\/b> (1)"], "cp": ["Mean", "Median or mode", "Range or interquartile range"], "dp": ["Hypothesis, sample and map", "Axis, line and legend", "Scale, key and north arrow"], "mand": 0}, {"id": "GEO-06-023", "t": 6, "s": "6.5", "k": "Exam trap", "m": 2, "ht": false, "q": "An exam asks you to <b>'justify'<\/b> a fieldwork method. What must you do?", "a": ["Give <b>reasons<\/b> why the method suited the enquiry (1)", "Link the method to the <b>hypothesis or question<\/b> (1)"], "cp": ["Give reasons why the method suited the enquiry", "Link the method to the hypothesis or question"], "dp": ["Describe only the equipment", "List the results", "Say it was easy"], "mand": 0}, {"id": "GEO-06-024", "t": 6, "s": "6.1", "k": "Exam trap", "m": 2, "ht": false, "q": "Exam questions often ask about <b>your own fieldwork<\/b>. What helps most?", "a": ["Use <b>specific details<\/b> such as place names, sites and data (1)", "Describe <b>why you chose<\/b> methods and what the results showed (1)"], "cp": ["Use specific details such as place names, sites and data", "Describe why you chose methods and what the results showed"], "dp": ["Describe any fieldwork you read about", "Give general advice only", "Leave out the location"], "mand": 0}, {"id": "GEO-06-025", "t": 6, "s": "6.2", "k": "Recall", "m": 3, "ht": false, "q": "Explain <b>random, systematic and stratified sampling<\/b>.", "a": ["<b>Random<\/b>: every point has an equal chance, which reduces bias (1)", "<b>Systematic<\/b>: samples at regular intervals, good for change over distance (1)", "<b>Stratified<\/b>: samples each contrasting area in proportion (1)"], "cp": ["Random: every point has an equal chance, which reduces bias", "Systematic: samples at regular intervals, good for change over distance", "Stratified: samples each contrasting area in proportion"], "dp": ["Random sampling picks at regular intervals", "Systematic sampling picks only the easiest places", "Stratified sampling is always biased"], "mand": 0}, {"id": "GEO-06-026", "t": 6, "s": "6.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three primary data methods<\/b> used in physical and human enquiries.", "a": ["Coasts: <b>sediment analysis<\/b> and beach profiles (1)", "Rivers: <b>width and depth<\/b> measurements, flood-risk questionnaires (1)", "Urban or rural: <b>questionnaires<\/b> and <b>traffic counts<\/b> (1)"], "cp": ["Coasts: sediment analysis and beach profiles", "Rivers: width and depth measurements, flood-risk questionnaires", "Urban or rural: questionnaires and traffic counts"], "dp": ["Only using Google Maps", "Only reading newspapers", "Only using Census data"], "mand": 0}, {"id": "GEO-06-027", "t": 6, "s": "6.4", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three secondary data sources<\/b> and what to check about them.", "a": ["<b>Census and IMD<\/b> data (1)", "<b>Digimap<\/b> historic OS maps and police.uk crime statistics (1)", "Check accuracy, <b>reliability, timeliness and significance<\/b> (1)"], "cp": ["Census and IMD data", "Digimap historic OS maps and police.uk crime statistics", "Check accuracy, reliability, timeliness and significance"], "dp": ["Only your own measurements", "Photos taken yesterday", "Anything on social media"], "mand": 0}, {"id": "GEO-07-001", "t": 7, "s": "7.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>biosphere<\/b>?", "a": ["The part of the Earth where <b>life exists<\/b> (1)", "Includes land, water and air, and the <b>living things<\/b> within them (1)"], "cp": ["The part of the Earth where life exists", "Includes land, water and air, and the living things within them"], "dp": ["The layer of rock under the crust", "The ozone layer", "The part of the sea with no life"], "mand": 0}, {"id": "GEO-07-002", "t": 7, "s": "7.1", "k": "Definition", "m": 2, "ht": false, "q": "What is an <b>ecosystem<\/b>?", "a": ["A community of <b>living things<\/b> (plants and animals) interacting with each other (1)", "And with their <b>non-living environment<\/b> (soil, water, climate) (1)"], "cp": ["A community of living things (plants and animals) interacting with each other", "And with their non-living environment (soil, water, climate)"], "dp": ["A single species", "A type of rock", "A group of rivers"], "mand": 0}, {"id": "GEO-07-003", "t": 7, "s": "7.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three roles<\/b> of living things in a food chain.", "a": ["<b>Producers<\/b> make food by photosynthesis (1)", "<b>Consumers<\/b> eat other organisms (1)", "<b>Decomposers<\/b> break down dead material (1)"], "cp": ["Producers make food by photosynthesis", "Consumers eat other organisms", "Decomposers break down dead material"], "dp": ["Predators, parasites and plants", "Herbivores, fish and birds", "Recyclers, planters and growers"], "mand": 0}, {"id": "GEO-07-004", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>nutrient cycle<\/b> works in an ecosystem.", "a": ["Nutrients are stored in <b>biomass, litter and soil<\/b> (1)", "They move by <b>uptake<\/b>, leaf fall and decay (1)", "<b>Decomposers<\/b> return nutrients to the soil (1)"], "cp": ["Nutrients are stored in biomass, litter and soil", "They move by uptake, leaf fall and decay", "Decomposers return nutrients to the soil"], "dp": ["Nutrients never move", "Nutrients only stay in the air", "Decomposers remove nutrients permanently"], "mand": 0}, {"id": "GEO-07-005", "t": 7, "s": "7.1", "k": "Recall", "m": 5, "ht": false, "q": "Name <b>five biomes<\/b> of the world.", "a": ["<b>Tropical rainforest<\/b> (1)", "<b>Savanna<\/b> (1)", "<b>Desert<\/b> (1)", "<b>Tundra<\/b> (1)", "<b>Taiga<\/b> (boreal forest) (1)"], "cp": ["Tropical rainforest", "Savanna", "Desert", "Tundra", "Taiga (boreal forest)"], "dp": ["Meadow, field, garden, orchard and farm", "River, ocean, lake, pond and canal", "Alps, Andes, Rockies, Himalayas and Urals"], "mand": 0}, {"id": "GEO-07-006", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>climate affects the distribution of biomes<\/b>.", "a": ["<b>Temperature and rainfall<\/b> determine which plants grow (1)", "Hot, wet climates near the Equator support <b>rainforest<\/b> (1)", "Cold, dry climates support <b>tundra<\/b> with few plants (1)"], "cp": ["Temperature and rainfall determine which plants grow", "Hot, wet climates near the Equator support rainforest", "Cold, dry climates support tundra with few plants"], "dp": ["Climate has no effect on biomes", "Rainforests grow in deserts", "Tundra grows where it is hot"], "mand": 0}, {"id": "GEO-07-007", "t": 7, "s": "7.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ecosystem services<\/b> provided by the biosphere.", "a": ["Any three (1 each):", "• <b>food and timber<\/b> (provisioning)", "• <b>climate regulation<\/b> through carbon storage", "• <b>water filtering<\/b> and flood regulation", "• <b>recreation<\/b> and culture", "• <b>pollination<\/b> and soil formation"], "cp": ["food and timber (provisioning)", "climate regulation through carbon storage", "water filtering and flood regulation", "recreation and culture", "pollination and soil formation"], "dp": ["Making the Moon bigger", "Producing tectonic plates", "Controlling the tides"], "mand": 0}, {"id": "GEO-07-008", "t": 7, "s": "7.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> people use the biosphere.", "a": ["Any three (1 each):", "• <b>food<\/b> from farming and fishing", "• <b>timber and fuel<\/b>", "• <b>medicines<\/b> from plants", "• <b>water<\/b> supply", "• <b>tourism and recreation<\/b>"], "cp": ["food from farming and fishing", "timber and fuel", "medicines from plants", "water supply", "tourism and recreation"], "dp": ["Making steel", "Mining only rock", "Building rockets"], "mand": 0}, {"id": "GEO-07-009", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>demand for biosphere resources is rising<\/b>.", "a": ["A growing <b>population<\/b> needs more food and water (1)", "Rising <b>incomes<\/b> increase demand for meat, timber and energy (1)", "Industrial growth increases <b>demand for raw materials<\/b> (1)"], "cp": ["A growing population needs more food and water", "Rising incomes increase demand for meat, timber and energy", "Industrial growth increases demand for raw materials"], "dp": ["The population is shrinking", "Incomes are falling everywhere", "There is no demand for food"], "mand": 0}, {"id": "GEO-07-010", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>human activity<\/b> threatens ecosystems.", "a": ["<b>Deforestation<\/b> and farming destroy habitats (1)", "<b>Pollution<\/b> and waste damage soil, air and water (1)", "<b>Climate change<\/b> and overuse push species towards extinction (1)"], "cp": ["Deforestation and farming destroy habitats", "Pollution and waste damage soil, air and water", "Climate change and overuse push species towards extinction"], "dp": ["Humans protect all ecosystems", "Human activity has no effect", "Farms always increase biodiversity"], "mand": 0}, {"id": "GEO-07-011", "t": 7, "s": "7.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>biodiversity<\/b>?", "a": ["The <b>variety of living things<\/b> in an area (1)", "It includes <b>species and genetic diversity<\/b> (1)"], "cp": ["The variety of living things in an area", "It includes species and genetic diversity"], "dp": ["The number of people in an area", "The size of a lake", "The amount of rainfall"], "mand": 0}, {"id": "GEO-07-012", "t": 7, "s": "7.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>climate of tropical rainforests<\/b>.", "a": ["<b>Hot all year<\/b> (around 27°C) (1)", "<b>Heavy rainfall<\/b> (over 2000 mm per year) (1)", "<b>Little seasonal change<\/b>, near the Equator (1)"], "cp": ["Hot all year (around 27°C)", "Heavy rainfall (over 2000 mm per year)", "Little seasonal change, near the Equator"], "dp": ["Cold and dry", "Hot and dry", "Hot with a long dry season"], "mand": 0}, {"id": "GEO-07-013", "t": 7, "s": "7.2", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four layers<\/b> of a tropical rainforest.", "a": ["<b>Emergent<\/b> layer (1)", "<b>Canopy<\/b> (1)", "<b>Understorey<\/b> (1)", "<b>Forest floor<\/b> (shrub layer) (1)"], "cp": ["Emergent layer", "Canopy", "Understorey", "Forest floor (shrub layer)"], "dp": ["Crust, mantle, outer core and inner core", "Soil, rock, water and air", "Canopy, trunk, root and flower"], "mand": 0}, {"id": "GEO-07-014", "t": 7, "s": "7.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one adaptation<\/b> of rainforest plants to the climate.", "a": ["<b>Drip tips<\/b> shed heavy rain (1)", "<b>Buttress roots<\/b> support tall trees in shallow soils (1)", "<b>Epiphytes<\/b> grow on branches to reach sunlight (1)"], "cp": ["Drip tips shed heavy rain", "Buttress roots support tall trees in shallow soils", "Epiphytes grow on branches to reach sunlight"], "dp": ["Thick bark to store water", "Long roots reach deep groundwater", "Needle leaves to reduce water loss"], "mand": 0}, {"id": "GEO-07-015", "t": 7, "s": "7.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain why rainforest soils are <b>nutrient-poor<\/b> despite lush growth.", "a": ["Most nutrients are <b>in the biomass and litter<\/b> (1)", "Heavy rain <b>leaches<\/b> nutrients out of the soil (1)", "When trees are cut, the <b>nutrient cycle is broken<\/b> (1)"], "cp": ["Most nutrients are in the biomass and litter", "Heavy rain leaches nutrients out of the soil", "When trees are cut, the nutrient cycle is broken"], "dp": ["Rainforest soils are very deep and rich", "Soils lack plants", "Decomposition is very slow because it is cold"], "mand": 0}, {"id": "GEO-07-016", "t": 7, "s": "7.2", "k": "Evaluate", "m": 3, "ht": false, "q": "Explain how <b>plants and animals depend on each other<\/b> in a rainforest.", "a": ["Plants provide <b>food and shelter<\/b> (1)", "Animals <b>pollinate and spread seeds<\/b> (1)", "Decomposers <b>return nutrients<\/b> to plants (1)"], "cp": ["Plants provide food and shelter", "Animals pollinate and spread seeds", "Decomposers return nutrients to plants"], "dp": ["They do not depend on each other", "Animals harm all plants", "Plants eat animals"], "mand": 0}, {"id": "GEO-07-017", "t": 7, "s": "7.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>features of taiga (boreal forest)<\/b>.", "a": ["<b>Cold climate<\/b> with long winters (1)", "Mostly <b>coniferous<\/b> trees with needle leaves (1)", "<b>Acidic, thin<\/b> soils and low biodiversity (1)"], "cp": ["Cold climate with long winters", "Mostly coniferous trees with needle leaves", "Acidic, thin soils and low biodiversity"], "dp": ["Hot and wet all year", "Broad-leaved trees only", "Deep, fertile soils"], "mand": 0}, {"id": "GEO-07-018", "t": 7, "s": "7.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>adaptations of taiga trees<\/b> to cold, snowy winters.", "a": ["<b>Needle leaves<\/b> reduce water loss (1)", "<b>Conical shape<\/b> sheds snow (1)", "<b>Dark colour<\/b> absorbs heat, and trees are evergreen to photosynthesise (1)"], "cp": ["Needle leaves reduce water loss", "Conical shape sheds snow", "Dark colour absorbs heat, and trees are evergreen to photosynthesise"], "dp": ["Large flat leaves", "Shedding leaves in summer", "Thick fleshy stems"], "mand": 0}, {"id": "GEO-07-019", "t": 7, "s": "7.1", "k": "Calculation", "m": 2, "ht": false, "q": "A forest has 400 species in 1980 and 300 in 2020. Calculate the <b>percentage change<\/b>.", "a": ["Change = -100 (1)", "-100 ÷ 400 × 100 = <b>-25%<\/b> (1)"], "cp": ["Change = -100", "-100 ÷ 400 × 100 = -25%"], "dp": ["-33%", "+25%", "-100%"], "mand": 0}, {"id": "GEO-07-020", "t": 7, "s": "7.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says <b>'rainforests and taiga are the same biome'<\/b>. What is wrong?", "a": ["They have very different <b>climates and species<\/b> (1)", "Rainforest is <b>hot and wet<\/b> in the tropics, taiga is <b>cold and coniferous<\/b> (1)"], "cp": ["They have very different climates and species", "Rainforest is hot and wet in the tropics, taiga is cold and coniferous"], "dp": ["They have identical climates", "Taiga is in the tropics", "Both are deserts"], "mand": 0}, {"id": "GEO-07-021", "t": 7, "s": "7.1", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four types of ecosystem service<\/b> with an example of each.", "a": ["<b>Provisioning<\/b>: food, timber (1)", "<b>Supporting<\/b>: nutrient cycling, soil formation (1)", "<b>Regulating<\/b>: carbon storage, hydrological cycle (1)", "<b>Cultural<\/b>: tourism, education (1)"], "cp": ["Provisioning: food, timber", "Supporting: nutrient cycling, soil formation", "Regulating: carbon storage, hydrological cycle", "Cultural: tourism, education"], "dp": ["Primary, secondary, tertiary and quaternary", "Hard, soft, direct and indirect", "Source, store, sink and transfer"], "mand": 0}, {"id": "GEO-07-022", "t": 7, "s": "7.2", "k": "Compare", "m": 4, "ht": false, "q": "Compare the views of <b>Malthus<\/b> and <b>Boserup<\/b> on population and resources.", "a": ["<b>Malthus<\/b> (pessimist): population outgrows food supply (1)", "Checks include war, famine and fewer children (1)", "<b>Boserup<\/b> (optimist): technology solves shortages (1)", "e.g. GM crops and irrigation (1)"], "cp": ["Malthus (pessimist): population outgrows food supply", "Checks include war, famine and fewer children", "Boserup (optimist): technology solves shortages", "e.g. GM crops and irrigation"], "dp": ["Malthus says technology always solves shortages", "Boserup predicts war and famine only", "They agree on everything"], "mand": 0}, {"id": "GEO-07-023", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why biomes act as <b>carbon sinks<\/b> and what happens when they are destroyed.", "a": ["Plants <b>store carbon<\/b> through photosynthesis (1)", "Destroying or burning biomes <b>releases CO2<\/b> (1)", "They become a <b>carbon source<\/b>, adding to global warming (1)"], "cp": ["Plants store carbon through photosynthesis", "Destroying or burning biomes releases CO2", "They become a carbon source, adding to global warming"], "dp": ["Biomes release carbon when growing", "Burning forests removes CO2 from the air", "Biomes have no effect on carbon"], "mand": 0}, {"id": "GEO-07-024", "t": 7, "s": "7.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>climate and local factors<\/b> affect where biomes occur.", "a": ["<b>Latitude<\/b> controls temperature, precipitation and sunshine (1)", "<b>Altitude<\/b>: temperature falls and rainfall rises with height (1)", "<b>Rock, soil and drainage<\/b> affect nutrients and water (1)"], "cp": ["Latitude controls temperature, precipitation and sunshine", "Altitude: temperature falls and rainfall rises with height", "Rock, soil and drainage affect nutrients and water"], "dp": ["Biomes depend only on the oceans", "Altitude has no effect", "Climate does not affect plants"], "mand": 0}, {"id": "GEO-08-001", "t": 8, "s": "8.1", "k": "Recall", "m": 4, "ht": false, "q": "Give <b>four causes<\/b> of tropical rainforest deforestation.", "a": ["Any four (1 each):", "• <b>logging<\/b> for timber", "• <b>cattle ranching<\/b>", "• <b>commercial farming<\/b> (soya, palm oil)", "• <b>mining<\/b>", "• <b>road building<\/b> and settlement", "• <b>HEP dams<\/b>"], "cp": ["logging for timber", "cattle ranching", "commercial farming (soya, palm oil)", "mining", "road building and settlement", "HEP dams"], "dp": ["Planting new forest", "Seaweed harvesting", "Building coastal defences"], "mand": 0}, {"id": "GEO-08-002", "t": 8, "s": "8.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>cattle ranching and soya<\/b> lead to deforestation in the Amazon.", "a": ["Land is <b>cleared<\/b> for pasture or crop fields (1)", "<b>Global demand<\/b> for beef and soya drives clearance (1)", "Roads open more land to <b>clearance<\/b> (1)"], "cp": ["Land is cleared for pasture or crop fields", "Global demand for beef and soya drives clearance", "Roads open more land to clearance"], "dp": ["Cows plant new trees", "Soya crops need forest cover", "Demand for beef is falling quickly"], "mand": 0}, {"id": "GEO-08-003", "t": 8, "s": "8.1", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three environmental impacts<\/b> of deforestation.", "a": ["Any three (1 each):", "• <b>loss of habitat<\/b> and biodiversity", "• <b>soil erosion<\/b> and landslides", "• higher <b>CO<sub>2<\/sub><\/b> emissions and climate change", "• <b>water cycle<\/b> disruption and reduced rainfall", "• river siltation"], "cp": ["loss of habitat and biodiversity", "soil erosion and landslides", "higher CO<sub>2<\/sub> emissions and climate change", "water cycle disruption and reduced rainfall", "river siltation"], "dp": ["More biodiversity", "Less soil erosion", "Cleaner air"], "mand": 0}, {"id": "GEO-08-004", "t": 8, "s": "8.1", "k": "Explai
