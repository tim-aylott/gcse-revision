<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emma Geography">
<meta name="theme-color" content="#0d1020">
<title>Emma's Geography Lab | GCSE Edexcel B revision</title>
<style>
:root{--bg:#0d1020;--bg2:#131730;--panel:#181d3a;--panel2:#212750;--line:#2c3466;--text:#eef0fb;--muted:#9ba4cc;--accent:#ff7a8a;--accent2:#ffb36b;--good:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,summary,input,select{touch-action:manipulation}
html,body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--bg2),var(--bg));color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding:0 0 calc(60px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,16,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.pill{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
.xpbox{min-width:170px}
.xpbox .l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.nav{display:flex;gap:6px}
.nav button{background:none;border:1px solid transparent;padding:8px 12px;border-radius:10px;color:var(--muted)}
.nav button.on,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:26px 0 6px;line-height:1.1}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.7rem}
.stat span{color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;align-items:center;gap:14px}
.modes{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
@media(hover:hover){.mode:hover{transform:translateY(-3px);border-color:var(--accent)}.tile:hover{transform:translateY(-3px)}.pt:hover{border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}}
.mode:active,.tile:active{transform:scale(.985)}
.mode.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#10122a}
.mode.primary small{color:rgba(16,18,42,.75)}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode small{color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .n{font-size:.75rem;color:var(--muted)}
.tile b{display:block;margin:2px 0 10px;font-size:1.02rem}
.tile .bar>i{background:var(--c)}
.tile .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:8px}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.badge.got .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a}
.badge.locked{opacity:.55}
.badge b{font-size:.9rem;display:block}.badge small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--accent);color:#10122a;border-color:transparent;font-weight:600}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:10px}
/* round */
.rhead{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
.rhead .bar{flex:1;min-width:140px}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:20px;color:var(--bad)}.heart.off{color:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.id{font-weight:700;font-size:.95rem}
.tag{padding:3px 10px;border-radius:999px;font-size:.75rem;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);color:#10122a;border-color:transparent;font-weight:600}
.tag.ht{background:#fff;color:#10122a;border-color:#fff;font-weight:700}
.tag.m{color:var(--text)}
.q{font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.45;margin:0 0 6px}
.q b{color:var(--accent)}
.ans{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ans h3{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.pt{min-height:52px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.45;font-size:1.02rem}
.pt .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:transparent;transition:.15s}
.pt.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.pt.on .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt b{color:#fff}
.note{margin:10px 2px;color:var(--muted);font-size:.95rem}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.score .big{font-size:1.3rem;font-weight:700}
.btn{min-height:50px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;color:var(--muted);margin-left:8px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* result */
.result{text-align:center;padding:34px 20px;margin-top:22px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.star{width:54px;height:54px;color:var(--line)}.star.on{color:var(--warn);filter:drop-shadow(0 0 12px rgba(255,184,77,.6));animation:pop .5s}
.rstats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.rstats .stat{min-width:130px}
.newb{margin:12px auto;max-width:460px}
/* library */
.lib input[type=search],.lib select{min-height:44px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit}
.lib input[type=search]{flex:1;min-width:200px}
details.item{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin:10px 0;padding:0}
details.item summary{cursor:pointer;min-height:48px;padding:14px 16px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
details.item .qs{flex:1}
details.item .body{padding:0 16px 14px}
details.item .a{border-top:1px dashed var(--line);padding-top:10px}
details.item .a p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 18px;border-radius:14px;z-index:50;animation:pop .3s}
@media(max-width:820px){.xpbox{min-width:120px}.modes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media(max-width:640px){
 .top .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:10px;flex-wrap:wrap}
 .xpbox{display:block;order:5;flex:1 0 100%;min-width:0}
 .top .pill{font-size:.72rem}
 .nav button{padding:8px 10px;min-height:40px}
 .logo{width:30px;height:30px}.brand span:last-child{display:none}
 h1{margin-top:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat b{font-size:1.45rem}
 .modes,.topics,.badges{grid-template-columns:1fr}
 .card{padding:18px;border-radius:20px}
 .rhead{gap:8px;margin-top:14px}.rhead .bar{order:9;flex:1 0 100%}
 .score{flex-direction:column;align-items:stretch}.score .btn{width:100%}
 .score .big{text-align:center}
 .kbd{display:none}
 .pt{font-size:1rem;padding:12px}
 .ans{margin-top:16px}
 .result{padding:22px 12px}.rstats .stat{min-width:100px;flex:1}
 .star{width:46px;height:46px}
 .lib .chips{gap:6px}
 .toast{width:calc(100% - 32px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media(min-width:641px) and (max-width:1100px){.q{font-size:1.45rem}.pt{font-size:1.1rem}.btn{font-size:1.05rem}}
@media(orientation:landscape) and (max-height:500px){header.top{position:static}}

.pt:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.pt.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt.opt.done{cursor:default}
.pt.opt.on{border-color:var(--accent);background:rgba(255,255,255,.06)}
.pt.opt.on .box{background:var(--accent);border-color:var(--accent);color:#10122a}
.pt.right{border-color:var(--good);background:rgba(61,220,151,.12)}
.pt.right .box{background:var(--good);border-color:var(--good);color:#06281a}
.pt.wrong{border-color:#ff6b7a;background:rgba(255,107,122,.12)}
.pt.wrong .box{background:#ff6b7a;border-color:#ff6b7a;color:#2a0509}
.pt.missed{border-color:#f5b94a;border-style:dashed;background:rgba(245,185,74,.08)}
.pt.missed .box{border-color:#f5b94a;color:#f5b94a}
.olab{display:block;margin-top:3px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.opts{margin-top:14px}
.ans .a p{margin:6px 0}

/* v3 engagement */
.hello{margin:22px 0 4px;color:var(--muted);font-size:.95rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;margin:14px 0 8px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 68%);opacity:.28;pointer-events:none}
.hero .k{font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.hero .btn{position:relative}
.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{display:block;font-size:1.55rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.8rem}
.kpi .fl{color:var(--warn);flex:none}
.kpi .fl svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,184,77,.5))}
.kpi .fl.off{color:var(--line);filter:none}.kpi .fl.off svg{filter:none}
.mini{height:6px;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.4);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.banner button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--text);flex:none}
.fb{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 16px;margin:8px 0 4px;border:1px solid var(--line);animation:pop .3s ease}
.fb b{font-size:1.1rem}.fb span{color:var(--muted);font-size:.9rem}
.fb.full{background:rgba(61,220,151,.12);border-color:var(--good)}.fb.full b{color:var(--good)}
.fb.part{background:rgba(255,184,77,.1);border-color:var(--warn)}.fb.part b{color:var(--warn)}
.fb.none{background:rgba(255,107,129,.1);border-color:var(--bad)}.fb.none b{color:var(--bad)}
.pt.single .box{border-radius:50%}
.pill.combo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#10122a;border:0;font-weight:700}
.seg{display:flex;gap:4px;flex:1;min-width:140px}.seg i{flex:1;height:8px;border-radius:99px;background:var(--panel2)}.seg i.d{background:var(--accent)}.seg i.n{background:var(--text);opacity:.8}
.bar.two{position:relative}.bar.two>i{position:absolute;left:0;top:0}.bar.two>i.s{opacity:.32}
/* progress page */
.pgrid{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:1rem}
.trow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-size:.95rem}.trow small{color:var(--muted);display:block}
.trow .bar{height:10px}.trow .bar>i{background:var(--c)}
.pctl{font-weight:700;min-width:48px;text-align:right}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.85rem;border-radius:10px;box-shadow:none}
.kbars{display:grid;gap:10px}
.kb{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.kb .bar{height:10px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.rrow:first-of-type{border-top:0}
.rrow .st{color:var(--warn);letter-spacing:2px}
.legend{color:var(--muted);font-size:.8rem;margin-top:6px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.badge .ic svg{width:22px;height:22px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.pgrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}.kb{grid-template-columns:90px 1fr 40px}.hero{padding:18px}.hero h2{font-size:1.2rem}}
</style>
</head>

<header class="top"><div class="wrap">

</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Based on the <span id="specline"></span> specification. Your answers are sent to a private progress sheet so your parents can see how revision is going, and your progress comes back from it on any device. Original questions written in GCSE mark-scheme style.</footer></div>
<script>
const DATA=[{"id": "GEO-01-001", "t": 1, "s": "1.1", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three cells<\/b> in the global atmospheric circulation model.", "a": ["<b>Hadley<\/b> cell (1)", "<b>Ferrel<\/b> cell (1)", "<b>Polar<\/b> cell (1)"], "cp": ["Hadley cell", "Ferrel cell", "Polar cell"], "dp": ["Coriolis, Gulf and Trade cells", "Equatorial, Tropical and Arctic cells", "Hadley, Atlantic and Pacific cells"], "mand": 0}, {"id": "GEO-01-002", "t": 1, "s": "1.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why there is <b>low pressure and heavy rainfall at the Equator<\/b>.", "a": ["The Sun heats the surface strongly at the Equator (1)", "Warm air <b>rises<\/b>, creating low pressure (1)", "The air cools, <b>condenses<\/b> and forms clouds and heavy rain (1)"], "cp": ["The Sun heats the surface strongly at the Equator", "Warm air rises, creating low pressure", "The air cools, condenses and forms clouds and heavy rain"], "dp": ["Cold air sinks and gets drier", "Winds blow away from the Equator so no air remains", "The oceans are always colder there"], "mand": 0}, {"id": "GEO-01-003", "t": 1, "s": "1.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why there are <b>deserts around 30° north and south<\/b> of the Equator.", "a": ["Air that rose at the Equator <b>sinks<\/b> at about 30° (1)", "Sinking air creates <b>high pressure<\/b> (1)", "Sinking air warms and holds moisture, so <b>skies are clear and dry<\/b> (1)"], "cp": ["Air that rose at the Equator sinks at about 30°", "Sinking air creates high pressure", "Sinking air warms and holds moisture, so skies are clear and dry"], "dp": ["Warm air rises here and forms clouds", "Cold polar air brings rain here", "The Coriolis effect stops any rain here"], "mand": 0}, {"id": "GEO-01-004", "t": 1, "s": "1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>Coriolis effect<\/b>?", "a": ["The <b>deflection of winds<\/b> caused by the Earth's rotation (1)", "Winds are deflected to the <b>right in the northern hemisphere<\/b> and the left in the south (1)"], "cp": ["The deflection of winds caused by the Earth's rotation", "Winds are deflected to the right in the northern hemisphere and the left in the south"], "dp": ["The movement of tectonic plates", "The pull of the Moon on the oceans", "A wind that always blows from the sea"], "mand": 0}, {"id": "GEO-01-005", "t": 1, "s": "1.1", "k": "Recall", "m": 2, "ht": false, "q": "Name the <b>surface winds<\/b> found between the Equator and 30°, and between 30° and 60°.", "a": ["Between 0° and 30°: <b>trade winds<\/b> (1)", "Between 30° and 60°: <b>westerlies<\/b> (1)"], "cp": ["Between 0° and 30°: trade winds", "Between 30° and 60°: westerlies"], "dp": ["Westerlies, then trade winds", "Monsoons, then jet streams", "Polar easterlies, then trade winds"], "mand": 0}, {"id": "GEO-01-006", "t": 1, "s": "1.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>ITCZ<\/b>?", "a": ["The <b>Inter-Tropical Convergence Zone<\/b> (1)", "A belt of <b>low pressure near the Equator<\/b> where trade winds meet and air rises (1)"], "cp": ["The Inter-Tropical Convergence Zone", "A belt of low pressure near the Equator where trade winds meet and air rises"], "dp": ["A zone of high pressure over the poles", "A tropical cyclone belt", "A band of ocean currents"], "mand": 0}, {"id": "GEO-01-007", "t": 1, "s": "1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three natural causes<\/b> of climate change.", "a": ["Any three (1 each):", "• <b>volcanic eruptions<\/b> (ash and gases block sunlight)", "• changes in the <b>Sun's energy output<\/b> (sunspots)", "• changes in the <b>Earth's orbit and tilt<\/b> (Milankovitch cycles)", "• <b>meteorite impacts<\/b>"], "cp": ["volcanic eruptions (ash and gases block sunlight)", "changes in the Sun's energy output (sunspots)", "changes in the Earth's orbit and tilt (Milankovitch cycles)", "meteorite impacts"], "dp": ["Burning fossil fuels", "Deforestation", "Farming cattle"], "mand": 0}, {"id": "GEO-01-008", "t": 1, "s": "1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three pieces of evidence<\/b> for climate change.", "a": ["Any three (1 each):", "• <b>ice cores<\/b> (trapped air shows past CO<sub>2<\/sub>)", "• <b>tree rings<\/b>", "• <b>temperature records<\/b> from thermometers", "• <b>retreating glaciers<\/b> and shrinking sea ice", "• <b>sea level<\/b> measurements"], "cp": ["ice cores (trapped air shows past CO<sub>2<\/sub>)", "tree rings", "temperature records from thermometers", "retreating glaciers and shrinking sea ice", "sea level measurements"], "dp": ["Tourist numbers", "Population census data", "Rock types at the coast"], "mand": 0}, {"id": "GEO-01-009", "t": 1, "s": "1.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how the <b>greenhouse effect<\/b> works.", "a": ["Short-wave radiation from the Sun passes through the atmosphere (1)", "The Earth gives out heat as long-wave radiation (1)", "<b>Greenhouse gases<\/b> such as CO<sub>2<\/sub> and methane absorb and re-radiate it, warming the Earth (1)"], "cp": ["Short-wave radiation from the Sun passes through the atmosphere", "The Earth gives out heat as long-wave radiation", "Greenhouse gases such as CO<sub>2<\/sub> and methane absorb and re-radiate it, warming the Earth"], "dp": ["The ozone layer reflects all heat into space", "Greenhouse gases block all sunlight", "Heat is trapped by thick clouds only"], "mand": 0}, {"id": "GEO-01-010", "t": 1, "s": "1.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three human causes<\/b> of climate change.", "a": ["Any three (1 each):", "• burning <b>fossil fuels<\/b> for energy and transport", "• <b>deforestation<\/b> (fewer trees to absorb CO<sub>2<\/sub>)", "• <b>farming<\/b> (methane from cattle and rice paddies)", "• <b>industry<\/b> and cement production"], "cp": ["burning fossil fuels for energy and transport", "deforestation (fewer trees to absorb CO<sub>2<\/sub>)", "farming (methane from cattle and rice paddies)", "industry and cement production"], "dp": ["Sunspots", "Volcanic eruptions", "Changes in orbit"], "mand": 0}, {"id": "GEO-01-011", "t": 1, "s": "1.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one way<\/b> that climate change affects people and <b>one way<\/b> it affects the environment.", "a": ["People: sea level rise or flooding threatens <b>homes and farmland<\/b> (1)", "People: <b>extreme weather<\/b> or drought reduces food and water supply (1)", "Environment: <b>habitats<\/b> change and species decline, for example coral bleaching (1)"], "cp": ["People: sea level rise or flooding threatens homes and farmland", "People: extreme weather or drought reduces food and water supply", "Environment: habitats change and species decline, for example coral bleaching"], "dp": ["It only makes places colder", "It removes all extreme weather", "It increases the ozone layer"], "mand": 0}, {"id": "GEO-01-012", "t": 1, "s": "1.2", "k": "Compare", "m": 4, "ht": false, "q": "Compare <b>mitigation<\/b> and <b>adaptation<\/b> as responses to climate change.", "a": ["<b>Mitigation<\/b> tries to reduce the causes of climate change (1)", "e.g. <b>renewable energy<\/b>, carbon capture or planting trees (1)", "<b>Adaptation<\/b> means living with the effects (1)", "e.g. <b>flood defences<\/b>, drought-resistant crops or water saving (1)"], "cp": ["Mitigation tries to reduce the causes of climate change", "e.g. renewable energy, carbon capture or planting trees", "Adaptation means living with the effects", "e.g. flood defences, drought-resistant crops or water saving"], "dp": ["Mitigation means adapting to rising seas", "Adaptation means cutting emissions", "They are both ways to melt ice"], "mand": 0}, {"id": "GEO-01-013", "t": 1, "s": "1.3", "k": "Recall", "m": 3, "ht": false, "q": "State <b>three conditions<\/b> needed for a tropical cyclone to form.", "a": ["Any three (1 each):", "• sea surface temperature of <b>at least 27°C<\/b>", "• ocean water <b>at least 50 m deep<\/b>", "• between about <b>5° and 30°<\/b> north or south of the Equator (so the Coriolis effect can spin the storm)", "• <b>low wind shear<\/b>"], "cp": ["sea surface temperature of at least 27°C", "ocean water at least 50 m deep", "between about 5° and 30° north or south of the Equator (so the Coriolis effect can spin the storm)", "low wind shear"], "dp": ["Cold ocean currents", "A location on the Equator", "Over land with mountains"], "mand": 0}, {"id": "GEO-01-014", "t": 1, "s": "1.3", "k": "Recall", "m": 3, "ht": false, "q": "Name the <b>three main parts<\/b> of the structure of a tropical cyclone.", "a": ["The <b>eye<\/b> (calm, clear centre) (1)", "The <b>eyewall<\/b> (strongest winds and heaviest rain) (1)", "<b>Rainbands<\/b> (spiral bands of cloud and rain) (1)"], "cp": ["The eye (calm, clear centre)", "The eyewall (strongest winds and heaviest rain)", "Rainbands (spiral bands of cloud and rain)"], "dp": ["Crust, mantle and core", "Storm surge, tsunami and flood", "Epicentre, focus and fault"], "mand": 0}, {"id": "GEO-01-015", "t": 1, "s": "1.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>storm surge<\/b>?", "a": ["A rise in sea level caused by a <b>tropical cyclone<\/b> (1)", "<b>Low pressure and strong winds<\/b> push water onto the coast, causing flooding (1)"], "cp": ["A rise in sea level caused by a tropical cyclone", "Low pressure and strong winds push water onto the coast, causing flooding"], "dp": ["A wave caused by an earthquake", "A wave that forms in a river", "A slow rise in sea level from melting ice"], "mand": 0}, {"id": "GEO-01-016", "t": 1, "s": "1.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain why tropical cyclones <b>weaken when they move over land<\/b>.", "a": ["They lose their <b>supply of warm, moist air<\/b> from the ocean (1)", "<b>Friction<\/b> with the land slows the winds (1)", "Less evaporation means less energy to power the storm (1)"], "cp": ["They lose their supply of warm, moist air from the ocean", "Friction with the land slows the winds", "Less evaporation means less energy to power the storm"], "dp": ["The land is hotter so adds energy", "Land has higher wind shear in a cell", "The Coriolis effect becomes stronger on land"], "mand": 0}, {"id": "GEO-01-017", "t": 1, "s": "1.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Typhoon Haiyan hit the Philippines in 2013. Describe <b>two effects<\/b> and <b>two responses<\/b>.", "a": ["Effect: thousands of deaths (over 6000) (1)", "Effect: <b>widespread flooding and destroyed homes<\/b> (storm surge in Tacloban) (1)", "Response: <b>emergency aid<\/b> and shelter from other countries and charities (1)", "Response: rebuilding and better <b>early warning and evacuation<\/b> (1)"], "cp": ["Effect: thousands of deaths (over 6000)", "Effect: widespread flooding and destroyed homes (storm surge in Tacloban)", "Response: emergency aid and shelter from other countries and charities", "Response: rebuilding and better early warning and evacuation"], "dp": ["No people died and no homes were damaged", "The Philippines refused all help", "It was a volcanic eruption"], "mand": 0}, {"id": "GEO-01-018", "t": 1, "s": "1.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> to reduce the impacts of tropical cyclones.", "a": ["Any three (1 each):", "• <b>monitoring and prediction<\/b> by satellite and warnings", "• <b>evacuation plans<\/b> and cyclone shelters", "• <b>building strong or raised homes<\/b> and sea walls", "• <b>planting mangroves<\/b> to absorb surge energy"], "cp": ["monitoring and prediction by satellite and warnings", "evacuation plans and cyclone shelters", "building strong or raised homes and sea walls", "planting mangroves to absorb surge energy"], "dp": ["Draining the sea", "Moving the Equator", "Cutting down all coastal trees"], "mand": 0}, {"id": "GEO-01-019", "t": 1, "s": "1.4", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four layers<\/b> of the Earth from the surface to the centre.", "a": ["<b>Crust<\/b> (1)", "<b>Mantle<\/b> (1)", "<b>Outer core<\/b> (liquid) (1)", "<b>Inner core<\/b> (solid) (1)"], "cp": ["Crust", "Mantle", "Outer core (liquid)", "Inner core (solid)"], "dp": ["Crust, atmosphere, core and mantle", "Mantle, crust, outer core and magma", "Crust, lithosphere, inner core and outer core"], "mand": 0}, {"id": "GEO-01-020", "t": 1, "s": "1.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>convection currents<\/b> move tectonic plates.", "a": ["Heat from the core makes <b>mantle material rise<\/b> (1)", "It cools, spreads sideways and <b>sinks<\/b> again, forming a current (1)", "The moving mantle <b>drags the plates<\/b> above it (1)"], "cp": ["Heat from the core makes mantle material rise", "It cools, spreads sideways and sinks again, forming a current", "The moving mantle drags the plates above it"], "dp": ["The Moon pulls plates apart", "Winds blow plates along", "Plates float because oceans are heavy"], "mand": 0}, {"id": "GEO-01-021", "t": 1, "s": "1.4", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>four types of plate boundary<\/b>.", "a": ["<b>Constructive<\/b> (divergent) (1)", "<b>Destructive<\/b> (convergent, subduction) (1)", "<b>Conservative<\/b> (transform) (1)", "<b>Collision<\/b> (1)"], "cp": ["Constructive (divergent)", "Destructive (convergent, subduction)", "Conservative (transform)", "Collision"], "dp": ["Constructive, passive, active and static", "Hot, cold, wet and dry", "Oceanic, tropical, polar and arid"], "mand": 0}, {"id": "GEO-01-022", "t": 1, "s": "1.4", "k": "Explain", "m": 4, "ht": false, "q": "Explain what happens at a <b>destructive plate boundary<\/b> where oceanic crust meets continental crust.", "a": ["The denser <b>oceanic plate sinks<\/b> under the continental plate (subduction) (1)", "The plate melts and <b>magma rises<\/b> forming volcanoes (1)", "Plates stick, then jerk free, causing <b>earthquakes<\/b> (1)", "An <b>ocean trench<\/b> forms (1)"], "cp": ["The denser oceanic plate sinks under the continental plate (subduction)", "The plate melts and magma rises forming volcanoes", "Plates stick, then jerk free, causing earthquakes", "An ocean trench forms"], "dp": ["Two plates move apart and magma fills the gap", "Two plates slide past each other without friction", "The continental plate sinks under the oceanic plate"], "mand": 0}, {"id": "GEO-01-023", "t": 1, "s": "1.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain what happens at a <b>constructive plate boundary<\/b>.", "a": ["Plates <b>move apart<\/b> (1)", "<b>Magma rises<\/b> to fill the gap and cools, forming new crust (1)", "Shield volcanoes and <b>mid-ocean ridges<\/b> form (1)"], "cp": ["Plates move apart", "Magma rises to fill the gap and cools, forming new crust", "Shield volcanoes and mid-ocean ridges form"], "dp": ["Plates collide and fold into mountains", "Plates slide sideways past each other", "One plate sinks beneath another"], "mand": 0}, {"id": "GEO-01-024", "t": 1, "s": "1.4", "k": "Definition", "m": 2, "ht": false, "q": "What are the <b>focus<\/b> and the <b>epicentre<\/b> of an earthquake?", "a": ["<b>Focus<\/b>: the point underground where the earthquake starts (1)", "<b>Epicentre<\/b>: the point on the surface directly above the focus (1)"], "cp": ["Focus: the point underground where the earthquake starts", "Epicentre: the point on the surface directly above the focus"], "dp": ["Focus is the point on the surface, epicentre is underground", "Both mean the strongest wind", "Epicentre is the largest crack in the crust"], "mand": 0}, {"id": "GEO-01-025", "t": 1, "s": "1.4", "k": "Evaluate", "m": 4, "ht": false, "q": "Nepal's earthquake (2015) and Japan's earthquake (2011) had different impacts. Give <b>four reasons<\/b> a lower income country like Nepal can suffer more.", "a": ["Many buildings were <b>not built to withstand earthquakes<\/b> (1)", "Poorer <b>emergency services and equipment<\/b> and slow rescue (1)", "Remote mountain villages were <b>hard to reach<\/b> by road (1)", "Less money for <b>rebuilding and healthcare<\/b> so recovery is slower (1)"], "cp": ["Many buildings were not built to withstand earthquakes", "Poorer emergency services and equipment and slow rescue", "Remote mountain villages were hard to reach by road", "Less money for rebuilding and healthcare so recovery is slower"], "dp": ["Nepal had stronger buildings", "Nepal has a larger economy than Japan", "Nepal had better warning systems"], "mand": 0}, {"id": "GEO-01-026", "t": 1, "s": "1.4", "k": "Recall", "m": 3, "ht": false, "q": "Give the <b>risk equation<\/b> for a tectonic hazard, and say what each part means.", "a": ["Risk = <b>hazard × vulnerability ÷ capacity to cope<\/b> (1)", "<b>Vulnerability<\/b>: how likely people are to be harmed, for example poverty and density (1)", "<b>Capacity to cope<\/b>: preparation, wealth and services that reduce harm (1)"], "cp": ["Risk = hazard × vulnerability ÷ capacity to cope", "Vulnerability: how likely people are to be harmed, for example poverty and density", "Capacity to cope: preparation, wealth and services that reduce harm"], "dp": ["Risk = hazard + vulnerability + capacity", "Risk = vulnerability ÷ hazard", "Risk = capacity × population × hazard"], "mand": 0}, {"id": "GEO-01-027", "t": 1, "s": "1.4", "k": "Process", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> that people reduce the impact of earthquakes.", "a": ["Any three (1 each):", "• <b>monitoring<\/b> with seismometers", "• <b>earthquake-proof buildings<\/b> (cross-bracing, rubber bases)", "• <b>emergency drills<\/b> and plans", "• <b>land-use planning<\/b> on safe ground"], "cp": ["monitoring with seismometers", "earthquake-proof buildings (cross-bracing, rubber bases)", "emergency drills and plans", "land-use planning on safe ground"], "dp": ["Predicting the exact minute", "Stopping the plates moving", "Pumping water into the fault"], "mand": 0}, {"id": "GEO-01-028", "t": 1, "s": "1.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain why people choose to live near <b>volcanoes<\/b> despite the risks.", "a": ["<b>Fertile volcanic soil<\/b> for farming (1)", "<b>Geothermal energy<\/b> and mineral resources (1)", "<b>Tourism<\/b> jobs, or no money or choice to move (1)"], "cp": ["Fertile volcanic soil for farming", "Geothermal energy and mineral resources", "Tourism jobs, or no money or choice to move"], "dp": ["Volcanoes never erupt", "They are always safe", "There is no soil near volcanoes"], "mand": 0}, {"id": "GEO-01-029", "t": 1, "s": "1.4", "k": "Recall", "m": 2, "ht": false, "q": "What are the <b>main ways<\/b> of measuring earthquake strength?", "a": ["<b>Richter or moment magnitude scale<\/b> measures the energy released (1)", "<b>Mercalli scale<\/b> measures the observed damage (1)"], "cp": ["Richter or moment magnitude scale measures the energy released", "Mercalli scale measures the observed damage"], "dp": ["Beaufort scale and Saffir-Simpson scale", "Mohs scale and Kelvin scale", "pH scale and decibel scale"], "mand": 0}, {"id": "GEO-01-030", "t": 1, "s": "1.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>tsunamis<\/b> form after some earthquakes.", "a": ["An earthquake under the <b>sea floor<\/b> moves the plate (1)", "This <b>displaces a large volume of water<\/b> (1)", "Waves travel across the ocean and <b>grow tall in shallow water<\/b> near land (1)"], "cp": ["An earthquake under the sea floor moves the plate", "This displaces a large volume of water", "Waves travel across the ocean and grow tall in shallow water near land"], "dp": ["Wind blows waves across the ocean", "Tides become very strong", "Volcanic ash falls into the sea"], "mand": 0}, {"id": "GEO-01-031", "t": 1, "s": "1.4", "k": "Evaluate", "m": 4, "ht": false, "q": "Japan's 2011 Tohoku earthquake and tsunami caused huge damage. Give <b>two effects<\/b> and <b>two responses<\/b>.", "a": ["Effect: about <b>18,000 deaths<\/b> and huge damage to towns (1)", "Effect: the <b>Fukushima nuclear plant<\/b> was damaged (1)", "Response: government and army rescue, shelters and <b>aid<\/b> (1)", "Response: <b>tsunami barriers and evacuation<\/b> upgrades afterwards (1)"], "cp": ["Effect: about 18,000 deaths and huge damage to towns", "Effect: the Fukushima nuclear plant was damaged", "Response: government and army rescue, shelters and aid", "Response: tsunami barriers and evacuation upgrades afterwards"], "dp": ["Almost nobody was hurt", "There was no tsunami", "Japan received no international help"], "mand": 0}, {"id": "GEO-01-032", "t": 1, "s": "1.4", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says <b>'a volcano erupts at every plate boundary'<\/b>. What is wrong with this?", "a": ["Volcanoes are mostly found at <b>constructive and destructive<\/b> boundaries (1)", "<b>Conservative<\/b> boundaries mostly cause earthquakes and little or no volcanism (1)"], "cp": ["Volcanoes are mostly found at constructive and destructive boundaries", "Conservative boundaries mostly cause earthquakes and little or no volcanism"], "dp": ["Every boundary produces volcanoes", "Only collision boundaries have earthquakes", "Volcanoes only occur in the middle of plates"], "mand": 0}, {"id": "GEO-01-033", "t": 1, "s": "1.1", "k": "Recall", "m": 3, "ht": false, "q": "What <b>three conditions<\/b> are needed for a <b>tropical cyclone<\/b> to form, and what wind speed defines one?", "a": ["Sea surface temperature above <b>26.5°C<\/b> (1)", "Strong <b>updraft winds<\/b> and the <b>Coriolis force<\/b>, so not at the equator (1)", "Winds over <b>118 km/h<\/b> (1)"], "cp": ["Sea surface temperature above 26.5°C", "Strong updraft winds and the Coriolis force, so not at the equator", "Winds over 118 km/h"], "dp": ["Sea above 10°C, calm winds and over land", "Cold ocean currents and the equator", "Mountains and winds of 50 km/h"], "mand": 0}, {"id": "GEO-01-034", "t": 1, "s": "1.2", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>Cyclone Aila, Bangladesh, 2009<\/b>. Give <b>four<\/b> facts about its impacts.", "a": ["About <b>190 deaths<\/b> (1)", "<b>750 000 people made homeless<\/b> (1)", "<b>Crop loss<\/b> and livestock deaths (1)", "<b>Waterborne disease<\/b> afterwards (1)"], "cp": ["About 190 deaths", "750 000 people made homeless", "Crop loss and livestock deaths", "Waterborne disease afterwards"], "dp": ["About 1 833 deaths and the levees failed", "About 300 000 deaths", "It hit New Orleans and cost US$108 billion"], "mand": 0}, {"id": "GEO-01-035", "t": 1, "s": "1.2", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>Hurricane Katrina, USA, 2005<\/b>. Give <b>four<\/b> facts.", "a": ["<b>Levee failure<\/b> flooded about <b>80% of New Orleans<\/b> (1)", "The <b>poor and elderly<\/b> could not evacuate (1)", "<b>1 833 deaths<\/b>, about <b>US$108 billion<\/b> cost (1)", "Levees were poorly <b>designed and maintained<\/b>, and the federal response was criticised (1)"], "cp": ["Levee failure flooded about 80% of New Orleans", "The poor and elderly could not evacuate", "1 833 deaths, about US$108 billion cost", "Levees were poorly designed and maintained, and the federal response was criticised"], "dp": ["190 deaths and 750 000 homeless", "The storm hit Bangladesh in 2009", "Only small damage because of strong defences"], "mand": 0}, {"id": "GEO-01-036", "t": 1, "s": "1.3", "k": "Recall", "m": 4, "ht": false, "q": "Name the <b>structure of the Earth<\/b> in order from the surface.", "a": ["<b>Lithosphere<\/b>: the crust (continental granite, oceanic basalt) (1)", "<b>Asthenosphere<\/b>: partly molten mantle (1)", "<b>Outer core<\/b>: liquid iron and nickel (1)", "<b>Inner core<\/b>: solid (1)"], "cp": ["Lithosphere: the crust (continental granite, oceanic basalt)", "Asthenosphere: partly molten mantle", "Outer core: liquid iron and nickel", "Inner core: solid"], "dp": ["Core, mantle, crust, atmosphere", "Crust, outer core, mantle, inner core", "Basalt, granite, magma, lava"], "mand": 0}, {"id": "GEO-01-037", "t": 1, "s": "1.3", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>Haiti earthquake 2010<\/b>. Give <b>four<\/b> facts or causes of its impacts.", "a": ["Magnitude <b>7.0<\/b>, <b>shallow focus<\/b> near dense Port-au-Prince (1)", "<b>Poor building regulations<\/b> (1)", "Roads, power and communications blocked, so <b>aid was delayed<\/b> (1)", "Over 1 million homeless, <b>cholera<\/b> killed about 8 000 (1)"], "cp": ["Magnitude 7.0, shallow focus near dense Port-au-Prince", "Poor building regulations", "Roads, power and communications blocked, so aid was delayed", "Over 1 million homeless, cholera killed about 8 000"], "dp": ["Magnitude 9.0 with a tsunami and nuclear meltdown", "Small impact because of strong building codes", "20 000 deaths and US$235 billion damage"], "mand": 0}, {"id": "GEO-01-038", "t": 1, "s": "1.3", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>Sendai, Japan 2011<\/b>. Give <b>four<\/b> facts.", "a": ["Magnitude <b>9.0<\/b>, about <b>70 km offshore<\/b> (1)", "A <b>tsunami<\/b> followed (1)", "About <b>20 000 deaths<\/b> and <b>US$235 billion<\/b> damage (1)", "<b>Two nuclear reactors melted down<\/b>; preparation included drills and tsunami walls (1)"], "cp": ["Magnitude 9.0, about 70 km offshore", "A tsunami followed", "About 20 000 deaths and US$235 billion damage", "Two nuclear reactors melted down; preparation included drills and tsunami walls"], "dp": ["Magnitude 7.0 and 300 000 deaths", "Only a small earthquake with no tsunami", "Death toll under 100"], "mand": 0}, {"id": "GEO-01-039", "t": 1, "s": "1.3", "k": "Case study", "m": 3, "ht": false, "q": "Case study (Pearson example): <b>Nepal earthquakes 2015<\/b>. Give <b>three<\/b> facts or responses.", "a": ["About <b>10 000 deaths<\/b> (1)", "<b>Aid from abroad<\/b> was needed (1)", "<b>Safer housing<\/b>: lightweight roofs, steel foundations, cross-braced frames (1)"], "cp": ["About 10 000 deaths", "Aid from abroad was needed", "Safer housing: lightweight roofs, steel foundations, cross-braced frames"], "dp": ["About 300 000 deaths", "It was caused by a tropical cyclone", "No international aid was needed"], "mand": 0}, {"id": "GEO-01-040", "t": 1, "s": "1.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>three cells of global atmospheric circulation<\/b> and the <b>ITCZ<\/b>.", "a": ["<b>Hadley<\/b> (0 to 30°), <b>Ferrel<\/b> (30 to 60°) and <b>Polar<\/b> (60 to 90°) cells (1)", "The <b>ITCZ<\/b> is a low-pressure belt where air converges and rises near the equator (1)", "The Hadley cell gives West Africa a summer <b>rainy season<\/b> and winter dry season (1)"], "cp": ["Hadley (0 to 30°), Ferrel (30 to 60°) and Polar (60 to 90°) cells", "The ITCZ is a low-pressure belt where air converges and rises near the equator", "The Hadley cell gives West Africa a summer rainy season and winter dry season"], "dp": ["Three cells all between 0 and 30° with high pressure at the equator", "The ITCZ is a high-pressure belt over the poles", "The Ferrel cell sits at the equator"], "mand": 0}, {"id": "GEO-02-001", "t": 2, "s": "2.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three indicators<\/b> used to measure development.", "a": ["Any three (1 each):", "• <b>GNI per capita<\/b>", "• <b>life expectancy<\/b>", "• <b>literacy rate<\/b>", "• <b>infant mortality rate<\/b>", "• <b>Human Development Index (HDI)<\/b>", "• access to <b>clean water<\/b> or doctors per person"], "cp": ["GNI per capita", "life expectancy", "literacy rate", "infant mortality rate", "Human Development Index (HDI)", "access to clean water or doctors per person"], "dp": ["Number of tourists", "Average rainfall", "Length of coastline"], "mand": 0}, {"id": "GEO-02-002", "t": 2, "s": "2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is the <b>Human Development Index (HDI)<\/b>?", "a": ["A <b>composite measure<\/b> of development combining several indicators (1)", "It combines <b>income, life expectancy and education<\/b> into one score from 0 to 1 (1)"], "cp": ["A composite measure of development combining several indicators", "It combines income, life expectancy and education into one score from 0 to 1"], "dp": ["A measure of GDP only", "A count of people with jobs", "A score of how many cars a country has"], "mand": 0}, {"id": "GEO-02-003", "t": 2, "s": "2.1", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>one advantage<\/b> and <b>one limitation<\/b> of using GNI per capita to measure development.", "a": ["Advantage: it is <b>easy to calculate and compare<\/b> between countries (1)", "Limitation: it is an <b>average<\/b> that hides inequality within a country (1)", "Limitation: it does not show <b>quality of life<\/b>, health or education (1)"], "cp": ["Advantage: it is easy to calculate and compare between countries", "Limitation: it is an average that hides inequality within a country", "Limitation: it does not show quality of life, health or education"], "dp": ["It shows how happy people are", "It includes all informal work exactly", "It measures life expectancy and literacy"], "mand": 0}, {"id": "GEO-02-004", "t": 2, "s": "2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is meant by the <b>development gap<\/b>?", "a": ["The difference in <b>levels of development<\/b> between richer and poorer countries (1)", "Shown by indicators such as income, health and education (1)"], "cp": ["The difference in levels of development between richer and poorer countries", "Shown by indicators such as income, health and education"], "dp": ["The gap between two rivers", "A hole in a country's economy", "The time between two elections"], "mand": 0}, {"id": "GEO-02-005", "t": 2, "s": "2.1", "k": "Recall", "m": 3, "ht": false, "q": "Describe the <b>Demographic Transition Model (DTM)<\/b> stage 2.", "a": ["<b>Birth rates stay high<\/b> (1)", "<b>Death rates fall<\/b> because of better food, water and medicine (1)", "<b>Population grows rapidly<\/b> (1)"], "cp": ["Birth rates stay high", "Death rates fall because of better food, water and medicine", "Population grows rapidly"], "dp": ["Birth rates fall and death rates are high", "Both rates are low and stable", "Death rates rise because of famine"], "mand": 0}, {"id": "GEO-02-006", "t": 2, "s": "2.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>two physical or human causes<\/b> of uneven development.", "a": ["Physical: <b>landlocked or hazard-prone<\/b> countries find trade and growth harder (1)", "Physical: poor <b>climate or soils<\/b> reduce farming output (1)", "Human: <b>colonial history, conflict or debt<\/b> hold back economies (1)"], "cp": ["Physical: landlocked or hazard-prone countries find trade and growth harder", "Physical: poor climate or soils reduce farming output", "Human: colonial history, conflict or debt hold back economies"], "dp": ["Having too many beaches", "Having a long coastline always makes a country poor", "Too many roads"], "mand": 0}, {"id": "GEO-02-007", "t": 2, "s": "2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>trade<\/b> can help a country develop.", "a": ["Exporting goods brings <b>income<\/b> (1)", "Income can pay for <b>schools, health and infrastructure<\/b> (1)", "Trade creates <b>jobs<\/b> and encourages investment (1)"], "cp": ["Exporting goods brings income", "Income can pay for schools, health and infrastructure", "Trade creates jobs and encourages investment"], "dp": ["Trade always reduces income", "Trade stops factories opening", "Trade removes the need for roads"], "mand": 0}, {"id": "GEO-02-008", "t": 2, "s": "2.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain one way that <b>poor trade terms<\/b> can keep a country poor.", "a": ["Many poorer countries export <b>cheap raw materials<\/b> (1)", "Prices of raw materials are low and <b>unstable<\/b> (1)", "Manufactured imports cost more, so countries earn less than they spend (1)"], "cp": ["Many poorer countries export cheap raw materials", "Prices of raw materials are low and unstable", "Manufactured imports cost more, so countries earn less than they spend"], "dp": ["Exports of high-value electronics", "Prices of their goods always rise", "Imports are always cheaper than exports"], "mand": 0}, {"id": "GEO-02-009", "t": 2, "s": "2.2", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>foreign direct investment (FDI)<\/b>?", "a": ["<b>Money invested by companies<\/b> from one country in another country (1)", "e.g. building factories, creating <b>jobs and skills<\/b> (1)"], "cp": ["Money invested by companies from one country in another country", "e.g. building factories, creating jobs and skills"], "dp": ["Loans repaid between friends", "Aid given by charities", "Tax collected on exports"], "mand": 0}, {"id": "GEO-02-010", "t": 2, "s": "2.2", "k": "Recall", "m": 3, "ht": false, "q": "Name <b>three ways<\/b> countries are connected in the global economy.", "a": ["Any three (1 each):", "• <b>trade<\/b> in goods and services", "• <b>foreign direct investment<\/b>", "• <b>migration<\/b> and remittances", "• <b>transnational companies<\/b>", "• <b>aid<\/b>"], "cp": ["trade in goods and services", "foreign direct investment", "migration and remittances", "transnational companies", "aid"], "dp": ["Weather patterns only", "Plate boundaries", "Ocean tides"], "mand": 0}, {"id": "GEO-02-011", "t": 2, "s": "2.3", "k": "Compare", "m": 4, "ht": false, "q": "Compare <b>top-down<\/b> and <b>bottom-up<\/b> development.", "a": ["<b>Top-down<\/b>: led by governments or large organisations (1)", "e.g. large <b>dams, roads and power stations<\/b> (1)", "<b>Bottom-up<\/b>: led by local communities (1)", "e.g. small-scale <b>water pumps or solar projects<\/b> using local skills (1)"], "cp": ["Top-down: led by governments or large organisations", "e.g. large dams, roads and power stations", "Bottom-up: led by local communities", "e.g. small-scale water pumps or solar projects using local skills"], "dp": ["Top-down is led by villagers", "Bottom-up is always more expensive", "Both always use big machinery"], "mand": 0}, {"id": "GEO-02-012", "t": 2, "s": "2.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one advantage<\/b> of microfinance loans as a bottom-up approach.", "a": ["Small <b>loans<\/b> are given to people who cannot get bank credit (1)", "Recipients can <b>start small businesses<\/b> (1)", "Income grows and <b>families pay for food and school<\/b> (1)"], "cp": ["Small loans are given to people who cannot get bank credit", "Recipients can start small businesses", "Income grows and families pay for food and school"], "dp": ["They give very large loans to governments", "They need no repayment", "They only help rich businesses"], "mand": 0}, {"id": "GEO-02-013", "t": 2, "s": "2.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three types of aid<\/b>.", "a": ["<b>Bilateral<\/b> (government to government) (1)", "<b>Multilateral<\/b> (through organisations such as the UN or World Bank) (1)", "<b>NGO or charity<\/b> aid (e.g. Oxfam) (1)"], "cp": ["Bilateral (government to government)", "Multilateral (through organisations such as the UN or World Bank)", "NGO or charity aid (e.g. Oxfam)"], "dp": ["Aid from the sea", "Tax aid", "Private jet aid"], "mand": 0}, {"id": "GEO-02-014", "t": 2, "s": "2.3", "k": "Evaluate", "m": 4, "ht": false, "q": "Evaluate <b>aid<\/b> as a way of reducing the development gap.", "a": ["Benefit: can pay for <b>schools, health and water<\/b> (1)", "Benefit: emergency aid saves lives after a disaster (1)", "Drawback: may create <b>dependency<\/b> (1)", "Drawback: <b>tied aid<\/b>, corruption or poor targeting can limit benefits (1)"], "cp": ["Benefit: can pay for schools, health and water", "Benefit: emergency aid saves lives after a disaster", "Drawback: may create dependency", "Drawback: tied aid, corruption or poor targeting can limit benefits"], "dp": ["Aid always completely solves poverty", "Aid has no effect at all", "Aid is only ever given as loans"], "mand": 0}, {"id": "GEO-02-015", "t": 2, "s": "2.3", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>fair trade<\/b>?", "a": ["Trade that guarantees <b>fair prices<\/b> for producers (1)", "Gives better <b>working conditions<\/b> and community funds (1)"], "cp": ["Trade that guarantees fair prices for producers", "Gives better working conditions and community funds"], "dp": ["Trade with no prices", "Trade that only happens in shops", "Trade between two neighbouring towns"], "mand": 0}, {"id": "GEO-02-016", "t": 2, "s": "2.3", "k": "Recall", "m": 2, "ht": false, "q": "What is the <b>Millennium Development Goal<\/b> successor adopted in 2015?", "a": ["The <b>Sustainable Development Goals (SDGs)<\/b> (1)", "17 goals aimed at ending poverty and protecting the planet by <b>2030<\/b> (1)"], "cp": ["The Sustainable Development Goals (SDGs)", "17 goals aimed at ending poverty and protecting the planet by 2030"], "dp": ["The Kyoto Protocol", "The Marshall Plan", "The Paris Plan for Cities"], "mand": 0}, {"id": "GEO-02-017", "t": 2, "s": "2.4", "k": "Recall", "m": 3, "ht": false, "q": "For your <b>emerging country case study<\/b>, what three types of information should you be ready to give?", "a": ["Its <b>location and importance<\/b> (global trade, population, regional role) (1)", "How its <b>economy has changed<\/b> (primary to secondary to tertiary) (1)", "Its <b>environmental and social effects<\/b> of growth, plus the role of TNCs and trade (1)"], "cp": ["Its location and importance (global trade, population, regional role)", "How its economy has changed (primary to secondary to tertiary)", "Its environmental and social effects of growth, plus the role of TNCs and trade"], "dp": ["Only its flag", "Only its climate", "Only the capital city's weather"], "mand": 0}, {"id": "GEO-02-018", "t": 2, "s": "2.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>how transnational companies (TNCs)<\/b> can both help and harm an emerging economy.", "a": ["Help: bring <b>jobs and investment<\/b> (1)", "Help: bring <b>skills and technology<\/b> (1)", "Harm: profits may <b>leave the country<\/b> and workers may face low pay or poor conditions (1)"], "cp": ["Help: bring jobs and investment", "Help: bring skills and technology", "Harm: profits may leave the country and workers may face low pay or poor conditions"], "dp": ["TNCs only help local shops", "TNCs only damage the environment", "TNCs are owned by the government"], "mand": 0}, {"id": "GEO-02-019", "t": 2, "s": "2.4", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>economic change<\/b> (e.g. moving to manufacturing and services) can improve quality of life.", "a": ["More <b>jobs and higher wages<\/b> (1)", "More tax income for <b>health and education<\/b> (1)", "Better <b>infrastructure<\/b>, transport and communications (1)"], "cp": ["More jobs and higher wages", "More tax income for health and education", "Better infrastructure, transport and communications"], "dp": ["Everyone becomes unemployed", "Education is stopped", "It reduces the number of roads"], "mand": 0}, {"id": "GEO-02-020", "t": 2, "s": "2.4", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three environmental effects<\/b> that can result from rapid economic growth.", "a": ["Any three (1 each):", "• <b>air pollution<\/b> from industry", "• <b>water pollution<\/b> from waste", "• <b>loss of habitats<\/b> and deforestation", "• growing <b>waste<\/b>", "• higher <b>carbon emissions<\/b>"], "cp": ["air pollution from industry", "water pollution from waste", "loss of habitats and deforestation", "growing waste", "higher carbon emissions"], "dp": ["Cleaner rivers", "More forests", "Less traffic"], "mand": 0}, {"id": "GEO-02-021", "t": 2, "s": "2.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student says <b>'a high GNI means everyone in the country is well off'<\/b>. What is wrong?", "a": ["GNI per capita is an <b>average<\/b> (1)", "It hides <b>inequality<\/b>, so some people can still be poor (1)"], "cp": ["GNI per capita is an average", "It hides inequality, so some people can still be poor"], "dp": ["GNI is always accurate for every person", "GNI measures life expectancy", "GNI includes only the richest"], "mand": 0}, {"id": "GEO-02-022", "t": 2, "s": "2.2", "k": "Process", "m": 3, "ht": false, "q": "Describe the <b>multiplier effect<\/b> in a developing economy.", "a": ["A new <b>industry or investment<\/b> creates jobs (1)", "Workers spend money, creating more <b>demand<\/b> and jobs in other businesses (1)", "Local economy and <b>tax income<\/b> grow, funding more services (1)"], "cp": ["A new industry or investment creates jobs", "Workers spend money, creating more demand and jobs in other businesses", "Local economy and tax income grow, funding more services"], "dp": ["Industries shrink and stop growing", "Jobs disappear one by one", "Prices fall until nothing is sold"], "mand": 0}, {"id": "GEO-02-023", "t": 2, "s": "2.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three examples<\/b> of intermediate technology.", "a": ["Any three (1 each):", "• <b>hand pumps<\/b> for water", "• <b>solar cookers<\/b>", "• small <b>biogas digesters<\/b>", "• simple <b>wind pumps<\/b>", "• <b>treadle pumps<\/b> for irrigation"], "cp": ["hand pumps for water", "solar cookers", "small biogas digesters", "simple wind pumps", "treadle pumps for irrigation"], "dp": ["Nuclear power stations", "Large motorways", "Deep-sea oil rigs"], "mand": 0}, {"id": "GEO-02-024", "t": 2, "s": "2.4", "k": "Exam trap", "m": 2, "ht": false, "q": "Exam questions often ask for a <b>named case study<\/b>. What does that mean?", "a": ["Use the <b>actual country<\/b> and real places, figures or dates (1)", "Do not write only general statements (1)"], "cp": ["Use the actual country and real places, figures or dates", "Do not write only general statements"], "dp": ["Write only the word 'case study'", "Make up numbers", "Use a case study from a different subject"], "mand": 0}, {"id": "GEO-02-025", "t": 2, "s": "2.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>GDP per capita<\/b> and what is the <b>HDI<\/b>?", "a": ["<b>GDP per capita<\/b>: the total value of goods and services made per person (1)", "<b>HDI<\/b>: an index combining <b>life expectancy, years of schooling and GDP per capita<\/b> (1)"], "cp": ["GDP per capita: the total value of goods and services made per person", "HDI: an index combining life expectancy, years of schooling and GDP per capita"], "dp": ["GDP is the number of people and HDI is their wealth", "HDI measures only income", "GDP is the total debt of a country"], "mand": 0}, {"id": "GEO-02-026", "t": 2, "s": "2.2", "k": "Recall", "m": 3, "ht": false, "q": "Describe <b>Rostow's model<\/b> and <b>Frank's dependency theory<\/b>.", "a": ["Rostow: <b>five stages<\/b> from traditional society to high mass consumption (1)", "<b>Take-off<\/b> is the stage when industry grows rapidly (1)", "Frank: <b>core<\/b> countries exploit the <b>periphery<\/b> that supplies raw materials (1)"], "cp": ["Rostow: five stages from traditional society to high mass consumption", "Take-off is the stage when industry grows rapidly", "Frank: core countries exploit the periphery that supplies raw materials"], "dp": ["Rostow says development never changes", "Frank says all countries develop at the same speed", "Rostow's model has two stages"], "mand": 0}, {"id": "GEO-02-027", "t": 2, "s": "2.2", "k": "Recall", "m": 2, "ht": false, "q": "What was the <b>Brandt Report (1980)<\/b> and what are <b>NICs<\/b> and <b>RICs<\/b>?", "a": ["It divided the world into <b>HICs and LICs<\/b>, showing a development gap (1)", "<b>NICs<\/b> (e.g. Singapore) and <b>RICs<\/b> (e.g. India) are newly industrialised and rapidly industrialising countries (1)"], "cp": ["It divided the world into HICs and LICs, showing a development gap", "NICs (e.g. Singapore) and RICs (e.g. India) are newly industrialised and rapidly industrialising countries"], "dp": ["A report on climate change from 2007", "NICs and RICs are the poorest countries", "It said the development gap was closing"], "mand": 0}, {"id": "GEO-02-028", "t": 2, "s": "2.3", "k": "Explain", "m": 4, "ht": false, "q": "Compare <b>top-down<\/b> and <b>bottom-up<\/b> development, using <b>one example<\/b>.", "a": ["<b>Top-down<\/b>: governments plan big projects, e.g. <b>Sardar Sarovar Dam<\/b> (1)", "It brings HEP and water but <b>floods villages<\/b> (1)", "<b>Bottom-up<\/b>: communities choose small projects, e.g. <b>biogas plants<\/b> (1)", "Biogas gives smoke-free cooking and fertiliser (1)"], "cp": ["Top-down: governments plan big projects, e.g. Sardar Sarovar Dam", "It brings HEP and water but floods villages", "Bottom-up: communities choose small projects, e.g. biogas plants", "Biogas gives smoke-free cooking and fertiliser"], "dp": ["Bottom-up is planned by governments only", "Top-down projects are always small and cheap", "Sardar Sarovar is a bottom-up biogas project"], "mand": 0}, {"id": "GEO-02-029", "t": 2, "s": "2.4", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): <b>India<\/b>. Give <b>four<\/b> facts about its globalisation and development.", "a": ["<b>Exports<\/b> up about 20 times in 23 years (1)", "<b>GDP up 500%<\/b> with less poverty (1)", "<b>FDI<\/b> from TNCs encouraged by market policies (1)", "India is a <b>G20<\/b> member and a major greenhouse gas emitter (1)"], "cp": ["Exports up about 20 times in 23 years", "GDP up 500% with less poverty", "FDI from TNCs encouraged by market policies", "India is a G20 member and a major greenhouse gas emitter"], "dp": ["India is a low-income country with no exports", "India has the smallest economy in the G20", "Its GDP has fallen since 1990"], "mand": 0}, {"id": "GEO-02-030", "t": 2, "s": "2.1", "k": "Case study", "m": 2, "ht": false, "q": "Case study (Pearson example): why does <b>Malawi<\/b> have a <b>high fertility rate<\/b>?", "a": ["Linked to <b>poverty<\/b> (1)", "Low <b>secondary school attendance by girls<\/b> and early marriage (1)"], "cp": ["Linked to poverty", "Low secondary school attendance by girls and early marriage"], "dp": ["Strong healthcare and high incomes", "High female education", "A government ban on contraception"], "mand": 0}, {"id": "GEO-03-001", "t": 3, "s": "3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is <b>urbanisation<\/b>?", "a": ["The <b>increase in the proportion of people living in towns and cities<\/b> (1)", "Caused by <b>rural-urban migration<\/b> and natural increase in cities (1)"], "cp": ["The increase in the proportion of people living in towns and cities", "Caused by rural-urban migration and natural increase in cities"], "dp": ["The movement of people away from cities", "The growth of the countryside", "The building of a single road"], "mand": 0}, {"id": "GEO-03-002", "t": 3, "s": "3.1", "k": "Recall", "m": 2, "ht": false, "q": "Name <b>two causes<\/b> of urbanisation in lower income countries.", "a": ["Any two (1 each):", "• <b>rural-urban migration<\/b>", "• <b>natural increase<\/b> in cities", "• more <b>jobs and services<\/b> in cities (pull factors)", "• rural poverty or farming problems (push factors)"], "cp": ["rural-urban migration", "natural increase in cities", "more jobs and services in cities (pull factors)", "rural poverty or farming problems (push factors)"], "dp": ["Low birth rate in cities", "People moving to farms", "Cities becoming smaller"], "mand": 0}, {"id": "GEO-03-003", "t": 3, "s": "3.1", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>two push factors<\/b> and <b>one pull factor<\/b> for migration to cities.", "a": ["Push: <b>lack of jobs<\/b> or farming failure (1)", "Push: poor <b>services<\/b> in rural areas (1)", "Pull: <b>jobs, schools and hospitals<\/b> in cities (1)"], "cp": ["Push: lack of jobs or farming failure", "Push: poor services in rural areas", "Pull: jobs, schools and hospitals in cities"], "dp": ["Pull: farming land is cheaper", "Push: lots of jobs in the village", "Pull: cities have no services"], "mand": 0}, {"id": "GEO-03-004", "t": 3, "s": "3.1", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>megacity<\/b>?", "a": ["A city with a population of <b>more than 10 million<\/b> people (1)", "Most are now found in <b>lower income and emerging countries<\/b> (1)"], "cp": ["A city with a population of more than 10 million people", "Most are now found in lower income and emerging countries"], "dp": ["A city with more than 1 million", "A town with new buildings", "A city with the tallest tower"], "mand": 0}, {"id": "GEO-03-005", "t": 3, "s": "3.1", "k": "Explain", "m": 3, "ht": false, "q": "Explain why <b>urban growth<\/b> is faster in lower income countries than in higher income countries.", "a": ["Rural-urban migration is <b>still happening<\/b> at scale (1)", "High <b>birth rates<\/b> and younger populations (1)", "Higher income countries <b>urbanised earlier<\/b> and growth has slowed (1)"], "cp": ["Rural-urban migration is still happening at scale", "High birth rates and younger populations", "Higher income countries urbanised earlier and growth has slowed"], "dp": ["Higher income countries are still urbanising rapidly", "Lower income countries have fewer people", "There is no migration in lower income countries"], "mand": 0}, {"id": "GEO-03-006", "t": 3, "s": "3.1", "k": "Recall", "m": 2, "ht": false, "q": "Define <b>counter-urbanisation<\/b> and <b>suburbanisation<\/b>.", "a": ["<b>Counter-urbanisation<\/b>: movement of people from cities to rural areas (1)", "<b>Suburbanisation<\/b>: growth of residential areas on the edges of cities (1)"], "cp": ["Counter-urbanisation: movement of people from cities to rural areas", "Suburbanisation: growth of residential areas on the edges of cities"], "dp": ["Both mean moving to the city centre", "Counter-urbanisation means people leave villages", "Suburbanisation means demolishing suburbs"], "mand": 0}, {"id": "GEO-03-007", "t": 3, "s": "3.2", "k": "Recall", "m": 3, "ht": false, "q": "For your <b>megacity case study<\/b>, what should you know?", "a": ["Its <b>location and importance<\/b> (national and global role) (1)", "Causes of its <b>growth<\/b> (migration, natural increase) (1)", "Its <b>opportunities and challenges<\/b>, including slums and pollution, and how they are managed (1)"], "cp": ["Its location and importance (national and global role)", "Causes of its growth (migration, natural increase)", "Its opportunities and challenges, including slums and pollution, and how they are managed"], "dp": ["Only its name", "Only its flag", "Only its football team"], "mand": 0}, {"id": "GEO-03-008", "t": 3, "s": "3.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>slums<\/b> (informal settlements) form around rapidly growing cities.", "a": ["Cities grow faster than <b>housing and services<\/b> can be built (1)", "Migrants cannot afford <b>formal housing<\/b> (1)", "They build <b>informal homes<\/b> on available land without services (1)"], "cp": ["Cities grow faster than housing and services can be built", "Migrants cannot afford formal housing", "They build informal homes on available land without services"], "dp": ["Governments build luxury flats for migrants", "Slums form because of heavy rainfall only", "Slums are built by planners"], "mand": 0}, {"id": "GEO-03-009", "t": 3, "s": "3.2", "k": "Explain", "m": 3, "ht": false, "q": "Give <b>three challenges<\/b> faced by people living in slums.", "a": ["Any three (1 each):", "• lack of <b>clean water and sanitation<\/b>", "• poor <b>health<\/b> and disease", "• <b>overcrowding<\/b> and fire risk", "• <b>insecure land<\/b> ownership", "• <b>crime<\/b> and flooding", "• <b>pollution<\/b>"], "cp": ["lack of clean water and sanitation", "poor health and disease", "overcrowding and fire risk", "insecure land ownership", "crime and flooding", "pollution"], "dp": ["Plenty of clean water", "Too many hospitals", "Excellent bus services"], "mand": 0}, {"id": "GEO-03-010", "t": 3, "s": "3.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain <b>one opportunity<\/b> that a megacity can provide.", "a": ["Many <b>jobs<\/b> in industry and services (1)", "Access to <b>schools and healthcare<\/b> (1)", "Informal <b>economy<\/b> and recycling provide income for many people (1)"], "cp": ["Many jobs in industry and services", "Access to schools and healthcare", "Informal economy and recycling provide income for many people"], "dp": ["No jobs but cheap flights", "No services", "No transport links"], "mand": 0}, {"id": "GEO-03-011", "t": 3, "s": "3.2", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three environmental challenges<\/b> in a rapidly growing megacity.", "a": ["Any three (1 each):", "• <b>air pollution<\/b> from traffic and industry", "• <b>water pollution<\/b>", "• growing <b>waste<\/b> and landfill", "• <b>traffic congestion<\/b>", "• loss of <b>green space<\/b>"], "cp": ["air pollution from traffic and industry", "water pollution", "growing waste and landfill", "traffic congestion", "loss of green space"], "dp": ["Too few cars", "Too many forests", "Clean rivers everywhere"], "mand": 0}, {"id": "GEO-03-012", "t": 3, "s": "3.3", "k": "Recall", "m": 3, "ht": false, "q": "Give <b>three ways<\/b> of improving life in a slum.", "a": ["Any three (1 each):", "• <b>self-help schemes<\/b> (residents improve homes)", "• <b>site and service<\/b> schemes (plots with water and toilets)", "• <b>slum upgrading<\/b> (water, power, sewers)", "• <b>microfinance<\/b> for small businesses"], "cp": ["self-help schemes (residents improve homes)", "site and service schemes (plots with water and toilets)", "slum upgrading (water, power, sewers)", "microfinance for small businesses"], "dp": ["Demolish all slums at once", "Build a motorway through it", "Do nothing"], "mand": 0}, {"id": "GEO-03-013", "t": 3, "s": "3.3", "k": "Definition", "m": 2, "ht": false, "q": "What is a <b>site and service scheme<\/b>?", "a": ["Government gives people <b>plots of land with basic services<\/b> (water, power, sewers) (1)", "Residents <b>build their own homes<\/b> (1)"], "cp": ["Government gives people plots of land with basic services (water, power, sewers)", "Residents build their own homes"], "dp": ["Government builds all homes for free", "A scheme that bans building", "A scheme that moves slums to forests"], "mand": 0}, {"id": "GEO-03-014", "t": 3, "s": "3.3", "k": "Compare", "m": 4, "ht": false, "q": "Compare <b>top-down<\/b> and <b>bottom-up<\/b> approaches to improving urban areas.", "a": ["<b>Top-down<\/b>: led by government with large projects (1)", "e.g. <b>new roads, transport and flats<\/b> (1)", "<b>Bottom-up<\/b>: led by residents or NGOs (1)", "e.g. community <b>toilets, self-help housing and small loans<\/b> (1)"], "cp": ["Top-down: led by government with large projects", "e.g. new roads, transport and flats", "Bottom-up: led by residents or NGOs", "e.g. community toilets, self-help housing and small loans"], "dp": ["Top-down is led by residents", "Bottom-up is led by governments only", "Neither involves local people"], "mand": 0}, {"id": "GEO-03-015", "t": 3, "s": "3.3", "k": "Evaluate", "m": 3, "ht": false, "q": "Give <b>one benefit<\/b> and <b>one drawback<\/b> of building new urban public transport such as metros.", "a": ["Benefit: cuts <b>congestion and pollution<\/b> (1)", "Benefit: gives <b>access to jobs<\/b> for people without cars (1)", "Drawback: <b>high cost<\/b> and long construction times (1)"], "cp": ["Benefit: cuts congestion and pollution", "Benefit: gives access to jobs for people without cars", "Drawback: high cost and long construction times"], "dp": ["It increases traffic", "It is always cheap", "It only helps car owners"], "mand": 0}, {"id": "GEO-03-016", "t": 3, "s": "3.3", "k": "Explain", "m": 3, "ht": false, "q": "Explain how a megacity can become more <b>sustainable<\/b>.", "a": ["Improve <b>public transport<\/b> and cycling (1)", "Increase <b>renewable energy<\/b> and recycling (1)", "Provide <b>affordable housing<\/b> and green spaces (1)"], "cp": ["Improve public transport and cycling", "Increase renewable energy and recycling", "Provide affordable housing and green spaces"], "dp": ["Increase the number of cars", "Burn more waste", "Reduce public transport"], "mand": 0}, {"id": "GEO-03-017", "t": 3, "s": "3.1", "k": "Exam trap", "m": 2, "ht": false, "q": "A student writes <b>'urbanisation means cities are getting bigger'<\/b>. What is missing?", "a": ["Urbanisation is the increase in the <b>proportion<\/b> of people living in urban areas (1)", "A city can grow bigger without the <b>proportion<\/b> changing, so use 'proportion' (1)"], "cp": ["Urbanisation is the increase in the proportion of people living in urban areas", "A city can grow bigger without the proportion changing, so use 'proportion'"], "dp": ["Nothing is missing", "It only means more buildings", "It only refers to higher income countries"], "mand": 0}, {"id": "GEO-03-018", "t": 3, "s": "3.2", "k": "Explain", "m": 3, "ht": false, "q": "Explain how <b>rural areas<\/b> can be affected by migration to megacities.", "a": ["Fewer young people means a <b>shrinking workforce<\/b> (1)", "Money sent home (<b>remittances<\/b>) can help families (1)", "Services such as schools can <b>close<\/b> as the population falls (1)"], "cp": ["Fewer young people means a shrinking workforce", "Money sent home (remittances) can help families", "Services such as schools can close as the population falls"], "dp": ["Rural areas become busier and richer", "Fields are covered by slums", "Rural birth rates rise sharply"], "mand": 0}, {"id": "GEO-03-019", "t": 3, "s": "3.1", "k": "Calculation", "m": 2, "ht": false, "q": "A city had 4 million people in 2000 and 6 million in 2020. Calculate the <b>percentage increase<\/b>.", "a": ["Increase = 2 million (1)", "2 ÷ 4 × 100 = <b>50%<\/b> (1)"], "cp": ["Increase = 2 million", "2 ÷ 4 × 100 = 50%"], "dp": ["33%", "150%", "25%"], "mand": 0}, {"id": "GEO-03-020", "t": 3, "s": "3.1", "k": "Recall", "m": 3, "ht": false, "q": "Define <b>megacity<\/b>, <b>world city<\/b> and <b>urban primacy<\/b>.", "a": ["<b>Megacity<\/b>: over <b>10 million<\/b> people (1)", "<b>World city<\/b>: global political and economic influence (1)", "<b>Urban primacy<\/b>: one city much larger and more important than the rest (e.g. London) (1)"], "cp": ["Megacity: over 10 million people", "World city: global political and economic influence", "Urban primacy: one city much larger and more important than the rest (e.g. London)"], "dp": ["A megacity has over 1 million people", "A world city is any capital city", "Urban primacy means all cities are equal"], "mand": 0}, {"id": "GEO-03-021", "t": 3, "s": "3.2", "k": "Case study", "m": 3, "ht": false, "q": "Case study (Pearson example): what happened to <b>Detroit<\/b> and <b>New York<\/b>?", "a": ["<b>Detroit<\/b>: <b>deindustrialisation<\/b> caused population decline (1)", "<b>New York<\/b>: the <b>knowledge economy<\/b> attracts international migrants (1)", "New York had counter-urbanisation to 1980, then <b>re-urbanisation<\/b> and brownfield regeneration (1)"], "cp": ["Detroit: deindustrialisation caused population decline", "New York: the knowledge economy attracts international migrants", "New York had counter-urbanisation to 1980, then re-urbanisation and brownfield regeneration"], "dp": ["Both cities grew only because of car manufacturing", "Detroit has a knowledge economy and New York declined", "Neither city has changed since 1950"], "mand": 0}, {"id": "GEO-03-022", "t": 3, "s": "3.3", "k": "Case study", "m": 4, "ht": false, "q": "Case study (Pearson example): why has <b>Mumbai<\/b> grown so fast?", "a": ["About <b>1 000 new migrants<\/b> arrive daily (hyper-urbanisation) (1)", "<b>Pull<\/b> factors: jobs and education (1)", "<b>Push<\/b> factors: crop failure, small farmers forced off land (1)", "<b>Natural increase<\/b> as young migrants start families (1)"], "cp": ["About 1 000 new migrants arrive daily (hyper-urbanisation)", "Pull factors: jobs and education", "Push factors: crop failure, small farmers forced off land", "Natural increase as young migrants start families"], "dp": ["Because of no jobs in the city", "Only from natural decrease", "Mumbai has stopped growing"], "mand": 0}, {"id": "GEO-03-023", "t": 3, "s": "3.4", "k": "Explain", "m": 3, "ht": false, "q": "Case study (Pearson example): <b>Mumbai<\/b>. Give <b>three<\/b> challenges.", "a": ["<b>Housing shortage<\/b> and unplanned settlements (1)", "<b>Water and air pollution<\/b> (1)", "<b>Traffic congestion<\/b> and low tax income for infrastructure (1)"], "cp": ["Housing shortage and unplanned settlements", "Water and air pollution", "Traffic congestion and low tax income for infrastructure"], "dp": ["Too much land and no migrants", "Excess water supply and clean air", "A lack of tourists"], "mand": 0}, {"id": "GEO-03-024", "t": 3, "s": "3.4", "k": "Evaluate", "m": 4, "ht": false, "q": "Case study (Pearson example): evaluate <b>Vision Mumbai<\/b> (top-down) and the <b>LSS charity<\/b> (bottom-up).", "a": ["Vision Mumbai replaced <b>45 000 unplanned homes<\/b> with flats, added 300 toilets and 72 trains (1)", "But communities were <b>split<\/b> and rents unaffordable (1)", "LSS in <b>Dharavi<\/b> treated <b>28 000<\/b> people for leprosy and taught hygiene (1)", "But it cannot reach everyone and relies on <b>charity funding<\/b> (1)"], "cp": ["Vision Mumbai replaced 45 000 unplanned homes with flats, added 300 toilets and 72 trains", "But communities were split and rents unaffordable", "LSS in Dharavi treated 28 000 people for leprosy and taught hygiene", "But it cannot reach everyone and relies on charity funding"], "dp": ["Vision Mumbai had no costs and LSS failed", "LSS is a top-down government plan", "Both schemes made the slums larger"], "mand": 0}, {"id": "GEO-04-001", "t": 4, "s": "4.1", "k": "Recall", "m": 2, "ht": false, "q": "Describe the <b>general pattern of UK relief<\/b>.",
